<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IRON HORIZON</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
:root{--ui:1;--panel:rgba(10,15,22,.94);--line:#2f4356;--accent:#ffb000;--ok:#58d68d;--bad:#ff5a4d;--txt:#e3ecf3;--dim:#8ea3b5;--cy:#35d0ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#05080c;color:var(--txt);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;background:#05080c}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity .6s}
#overlay{position:absolute;inset:0;display:none;font-size:calc(16px * var(--ui))}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:2em 1em;background:radial-gradient(ellipse at 50% 30%,rgba(24,38,52,.88),rgba(4,7,11,.97))}
.screen.on{display:flex}
.screen.clear{background:rgba(3,6,10,.72)}
.screen.menuBg{background:radial-gradient(ellipse at 50% 55%,rgba(4,7,11,.62),rgba(4,7,11,.22))}
.wrap{width:min(1100px,100%);margin:auto}
h1{font-size:3.4em;letter-spacing:.28em;margin:0;font-weight:800;color:var(--txt);text-shadow:0 0 24px rgba(255,176,0,.35)}
h1 b{color:var(--accent)}
h2{font-size:1.5em;letter-spacing:.18em;margin:.2em 0 .6em;color:var(--accent);text-transform:uppercase}
h3{font-size:1em;letter-spacing:.12em;margin:.8em 0 .3em;color:var(--cy);text-transform:uppercase}
.sub{color:var(--dim);letter-spacing:.2em;font-size:.85em;margin:.4em 0 1.6em;text-transform:uppercase}
.menu{display:flex;flex-direction:column;gap:.55em;width:min(420px,92vw)}
.btn{font:inherit;color:var(--txt);background:rgba(20,32,44,.9);border:1px solid var(--line);padding:.75em 1.1em;text-align:left;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;border-left:4px solid var(--line)}
.btn:hover,.btn:focus{outline:none;border-color:var(--accent);background:rgba(44,58,72,.95);color:#fff}
.btn:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.btn.primary{border-left-color:var(--accent);background:rgba(70,48,8,.85)}
.btn.small{padding:.35em .7em;font-size:.85em}
.btn.on{border-color:var(--ok);color:var(--ok)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:.8em;flex-wrap:wrap;align-items:center;margin:.4em 0}
.row.end{justify-content:flex-end}
.panel{background:var(--panel);border:1px solid var(--line);padding:1em 1.2em;margin:.5em 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}
@media (max-width:820px){.grid2,.grid3{grid-template-columns:1fr}h1{font-size:2.1em}}
.card{border:1px solid var(--line);background:rgba(14,22,32,.95);padding:.7em .9em;cursor:pointer;text-align:left;font:inherit;color:var(--txt);width:100%}
.card:hover,.card:focus{outline:none;border-color:var(--accent)}
.card.sel{border-color:var(--accent);background:rgba(60,44,10,.8)}
.card small,.dim{color:var(--dim)}
.tag{display:inline-block;border:1px solid var(--line);padding:0 .45em;margin-right:.3em;font-size:.75em;letter-spacing:.1em;color:var(--dim)}
.bar{height:.55em;background:#16212c;border:1px solid #223344;margin:.12em 0 .4em}
.bar i{display:block;height:100%;background:var(--cy)}
.lbl{display:flex;justify-content:space-between;font-size:.8em;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
label.f{display:flex;justify-content:space-between;align-items:center;gap:1em;padding:.35em 0;border-bottom:1px solid rgba(255,255,255,.05)}
select,input[type=range],input[type=number]{font:inherit;color:var(--txt);background:#0d1620;border:1px solid var(--line);padding:.3em .4em;max-width:55%}
input[type=range]{padding:0;width:12em}
table{border-collapse:collapse;width:100%;font-size:.92em}
td,th{padding:.3em .5em;border-bottom:1px solid rgba(255,255,255,.07);text-align:left}
th{color:var(--cy);letter-spacing:.1em;text-transform:uppercase;font-size:.8em}
kbd{background:#0d1620;border:1px solid var(--line);border-bottom-width:2px;padding:0 .4em;font-family:Consolas,monospace;color:var(--accent)}
.good{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--accent)}
#toast{position:absolute;left:50%;top:12%;transform:translateX(-50%);background:rgba(10,15,22,.92);border:1px solid var(--accent);padding:.5em 1.2em;letter-spacing:.1em;display:none;pointer-events:none;font-size:calc(15px * var(--ui));z-index:5;text-transform:uppercase}
#diag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.72);color:#9fe;font:12px/1.35 Consolas,monospace;padding:6px 8px;display:none;pointer-events:none;white-space:pre;z-index:6}
#fatal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#05080c;z-index:9;text-align:center;padding:2em}
#fatal div{max-width:640px}
.big{font-size:2.4em;letter-spacing:.2em;font-weight:800}
.rankS{color:#ffd24d}.rankA{color:#8fe388}.rankB{color:#7fd0ff}.rankC{color:#c9c9c9}.rankF{color:var(--bad)}
.hint{color:var(--dim);font-size:.85em;margin-top:1em;letter-spacing:.08em}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
  <div id="fade"></div>
  <div id="overlay"></div>
  <div id="toast"></div>
  <div id="diag"></div>
  <div id="fatal"><div>
    <h2 id="fatalTitle">Cannot start IRON HORIZON</h2>
    <p id="fatalText" class="dim"></p>
    <p class="dim">Use a current desktop version of Chrome, Edge or Firefox with hardware acceleration enabled.</p>
    <button class="btn" id="fatalBtn" style="display:none">Return to main menu</button>
  </div></div>
</div>
<noscript><p style="color:#fff;padding:2em">IRON HORIZON needs JavaScript enabled.</p></noscript>
<script>
'use strict';
/* =====================================================================
   IRON HORIZON - single-file build. No external assets or libraries.
   Sections: util, data, settings/input/audio, renderer, world, platforms,
   weapons, AI, missions, UI/HUD, game loop.
   World units are metres. Y is up, forward = (sin yaw, 0, cos yaw),
   right = (-cos yaw, 0, sin yaw). Positive pitch looks up.
   ===================================================================== */

const PI = Math.PI, TAU = Math.PI * 2, DEG = Math.PI / 180;
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sat = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const damp = (a, b, rate, dt) => a + (b - a) * (1 - Math.exp(-rate * dt));
const wrapAngle = (a) => { a = (a + PI) % TAU; if (a < 0) a += TAU; return a - PI; };
const angleDiff = (from, to) => wrapAngle(to - from);
const smoothstep = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const finite = (v, fallback) => (Number.isFinite(v) ? v : (fallback || 0));
const approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
const turnToward = (cur, target, maxStep) => cur + clamp(angleDiff(cur, target), -maxStep, maxStep);
const dist2D = (ax, az, bx, bz) => Math.hypot(ax - bx, az - bz);
const dist3D = (ax, ay, az, bx, by, bz) => Math.hypot(ax - bx, ay - by, az - bz);
const rand = (a, b) => a + Math.random() * (b - a);
const randSign = () => (Math.random() < 0.5 ? -1 : 1);

function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const fmtTime = (s) => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- matrices (column-major, WebGL layout) ---------- */
function mat4Perspective(out, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  out.fill(0);
  out[0] = f / aspect; out[5] = f;
  out[10] = (far + near) / (near - far); out[11] = -1;
  out[14] = (2 * far * near) / (near - far);
  return out;
}
function mat4LookAt(out, ex, ey, ez, tx, ty, tz) {
  let zx = ex - tx, zy = ey - ty, zz = ez - tz;
  let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
  let xx = zz, xy = 0, xz = -zx; // up x z with up = (0,1,0)
  l = Math.hypot(xx, xz) || 1; xx /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * ex + xy * ey + xz * ez);
  out[13] = -(yx * ex + yy * ey + yz * ez);
  out[14] = -(zx * ex + zy * ey + zz * ez);
  out[15] = 1;
  return out;
}
function mat4Mul(out, a, b) {
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    out[c * 4] = a[0] * b0 + a[4] * b1 + a[8] * b2 + a[12] * b3;
    out[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9] * b2 + a[13] * b3;
    out[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    out[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return out;
}

/* Transform stack: right-multiplying T/R/S helpers, no allocation. */
class MatStack {
  constructor(depth) {
    this.m = new Float32Array(16 * (depth || 24));
    this.top = 0;
    this.ident();
  }
  ident() {
    const m = this.m, o = this.top * 16;
    for (let i = 0; i < 16; i++) m[o + i] = 0;
    m[o] = m[o + 5] = m[o + 10] = m[o + 15] = 1;
    return this;
  }
  push() { const o = this.top * 16; this.m.copyWithin(o + 16, o, o + 16); this.top++; return this; }
  pop() { this.top--; return this; }
  t(x, y, z) {
    const m = this.m, o = this.top * 16;
    m[o + 12] += m[o] * x + m[o + 4] * y + m[o + 8] * z;
    m[o + 13] += m[o + 1] * x + m[o + 5] * y + m[o + 9] * z;
    m[o + 14] += m[o + 2] * x + m[o + 6] * y + m[o + 10] * z;
    m[o + 15] += m[o + 3] * x + m[o + 7] * y + m[o + 11] * z;
    return this;
  }
  ry(a) {
    const m = this.m, o = this.top * 16, c = Math.cos(a), s = Math.sin(a);
    for (let r = 0; r < 4; r++) {
      const a0 = m[o + r], a2 = m[o + 8 + r];
      m[o + r] = a0 * c - a2 * s;
      m[o + 8 + r] = a0 * s + a2 * c;
    }
    return this;
  }
  rx(a) {
    const m = this.m, o = this.top * 16, c = Math.cos(a), s = Math.sin(a);
    for (let r = 0; r < 4; r++) {
      const a1 = m[o + 4 + r], a2 = m[o + 8 + r];
      m[o + 4 + r] = a1 * c + a2 * s;
      m[o + 8 + r] = -a1 * s + a2 * c;
    }
    return this;
  }
  rz(a) {
    const m = this.m, o = this.top * 16, c = Math.cos(a), s = Math.sin(a);
    for (let r = 0; r < 4; r++) {
      const a0 = m[o + r], a1 = m[o + 4 + r];
      m[o + r] = a0 * c + a1 * s;
      m[o + 4 + r] = -a0 * s + a1 * c;
    }
    return this;
  }
  s(x, y, z) {
    const m = this.m, o = this.top * 16;
    for (let r = 0; r < 4; r++) { m[o + r] *= x; m[o + 4 + r] *= y; m[o + 8 + r] *= z; }
    return this;
  }
  copyTo(out) { const o = this.top * 16; for (let i = 0; i < 16; i++) out[i] = this.m[o + i]; }
}

/* Forward/up/right basis from yaw, pitch, roll (matches the model transform ry*rx(-pitch)*rz(roll)). */
function basisFrom(yaw, pitch, roll, out) {
  const sy = Math.sin(yaw), cy = Math.cos(yaw), sp = Math.sin(pitch), cp = Math.cos(pitch);
  const sr = Math.sin(roll), cr = Math.cos(roll);
  // pre-roll basis
  const fx = sy * cp, fy = sp, fz = cy * cp;
  const lx = cy, ly = 0, lz = -sy;                       // local +x axis (model left)
  const ux = -sy * sp, uy = cp, uz = -cy * sp;           // local +y axis
  // roll about forward: x' = x*cr + y*sr ... (rz applied before pitch/yaw)
  out.fx = fx; out.fy = fy; out.fz = fz;
  out.lx = lx * cr + ux * sr; out.ly = ly * cr + uy * sr; out.lz = lz * cr + uz * sr;
  out.ux = -lx * sr + ux * cr; out.uy = -ly * sr + uy * cr; out.uz = -lz * sr + uz * cr;
  return out;
}


/* =====================================================================
   DATA: weapons, platforms, archetypes, maps, difficulty, bindings
   ===================================================================== */
const GRAVITY = 28;
const WORLD_HALF = 1000;        // terrain covers +-1000 m
const GROUND_BOUND = 930;       // ground platforms cannot leave this square
const AIR_BOUND = 1080;         // aircraft are steered back beyond this
const AIR_CEILING = 420;        // low enough that flak and AA missiles still reach a high flier

const MAX_PROJECTILES = 420;
/* Damage one armour point stops, by damage type: rounds glance off plating, explosives and energy

  storageOk: true,

    return { v: SAVE_VERSION, settings, bindings, loadouts: {}, platformId: 'bulwark', best: {}, skirmish: null };
  },
  sanitize(raw) {
    const out = this.defaults();

      const code = rb[a[0]];

    });

/* =====================================================================
   LOADOUT VALIDATION
   ===================================================================== */
const Loadout = {
  group(slot) { return SLOT_GROUP[slot]; },
  weight(lo) {
    let w = 0;
    WEAPON_SLOTS.forEach((s) => { if (lo[s] && WEAPONS[lo[s]]) w += WEAPONS[lo[s]].weight; });
    return w;
  },
  validate(def, lo) {
    const errors = [];
    if (!def || !lo) return { ok: false, errors: ['No platform or loadout'], weight: 0 };
    WEAPON_SLOTS.forEach((slot) => {
      const id = lo[slot];
      if (!id) { if (slot === 'primaryA') errors.push('Primary A must be filled'); return; }
      const w = WEAPONS[id];
      if (!w) { errors.push(slot + ': unknown weapon'); return; }
      if (def.allow[SLOT_GROUP[slot]].indexOf(id) < 0) errors.push(w.name + ' cannot mount on ' + def.name + ' (' + SLOT_LABEL[slot] + ')');
    });
    const weight = this.weight(lo);
    if (weight > def.weightCap) errors.push('Overweight by ' + (weight - def.weightCap) + ' (capacity ' + def.weightCap + ')');
    return { ok: errors.length === 0, errors, weight };
  },
  heatLoad(lo) { // approximate heat per second when firing both primaries continuously
    let h = 0;
    ['primaryA', 'primaryB'].forEach((s) => { const w = lo[s] && WEAPONS[lo[s]]; if (w) h += w.heat / Math.max(0.04, w.cd) * 0.5; });
    return h;
  },
  speedMult(def, lo) { return clamp(1.04 - 0.22 * (this.weight(lo) / def.weightCap), 0.7, 1.05); },
  forPlatform(id) {
    const def = PLATFORMS[id];
    const saved = Save.data && Save.data.loadouts[id];
    return Object.assign({}, saved && Loadout.validate(def, saved).ok ? saved : def.loadout);
  },
  store(id, lo) { Save.data.loadouts[id] = Object.assign({}, lo); Save.persist(); },
};

/* =====================================================================
   INPUT
   ===================================================================== */
const Input = {
  down: new Set(), pressed: new Set(), released: new Set(),
  mdx: 0, mdy: 0, wheel: 0, locked: false, lockSupported: true, lockFailed: false,
  curX: 0.5, curY: 0.5, bindings: {}, inited: false, capture: null,
  onKeyDown: null, onLockChange: null, playing: false,
  setBindings(b) { this.bindings = Object.assign({}, b); },
  init(canvas) {
    if (this.inited) return; // never attach listeners twice
    this.inited = true;
    this.canvas = canvas;
    this.setBindings(Save.data.bindings);
    this.lockSupported = !!(canvas.requestPointerLock);
    window.addEventListener('keydown', (e) => this._key(e, true), true);
    window.addEventListener('keyup', (e) => this._key(e, false), true);
    window.addEventListener('mousedown', (e) => this._mouse(e, true), true);
    window.addEventListener('mouseup', (e) => this._mouse(e, false), true);
    window.addEventListener('mousemove', (e) => {
      if (this.locked) { this.mdx += e.movementX || 0; this.mdy += e.movementY || 0; }
      this.curX = e.clientX / Math.max(1, window.innerWidth); this.curY = e.clientY / Math.max(1, window.innerHeight);
    }, true);
    window.addEventListener('wheel', (e) => { if (this.playing) { this.wheel += Math.sign(e.deltaY); e.preventDefault(); } }, { passive: false });
    window.addEventListener('contextmenu', (e) => { if (this.playing || this.capture) e.preventDefault(); });
    window.addEventListener('blur', () => this.clearAll());
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.clearAll(); });
    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === canvas;
      if (this.onLockChange) this.onLockChange(this.locked);
    });
    document.addEventListener('pointerlockerror', () => { this.lockFailed = true; this.locked = false; if (this.onLockChange) this.onLockChange(false); });
  },
  clearAll() { this.down.clear(); this.pressed.clear(); this.released.clear(); this.mdx = this.mdy = this.wheel = 0; },
  _key(e, isDown) {
    const code = e.code;
    if (isDown && this.capture) { e.preventDefault(); e.stopPropagation(); this.capture(code); return; }
    if (isDown) {
      if (!e.repeat) { this.pressed.add(code); this.down.add(code); if (this.onKeyDown) this.onKeyDown(code, e); }
    } else { this.down.delete(code); this.released.add(code); }
    if (this.playing) {
      // keep browser shortcuts from firing during combat (Tab focus, F-keys, space scrolling)
      if (code === 'Tab' || code === 'Space' || /^F\d+$/.test(code) || code.indexOf('Arrow') === 0) e.preventDefault();
    }
  },
  _mouse(e, isDown) {
    const code = 'Mouse' + e.button;
    if (isDown && this.capture) { if (e.target === this.canvas || (e.target.closest && e.target.closest('[data-capture]'))) { e.preventDefault(); this.capture(code); } return; }
    if (!this.playing) return;
    if (isDown) { this.down.add(code); this.pressed.add(code); } else { this.down.delete(code); this.released.add(code); }
    if (e.target === this.canvas) e.preventDefault();
  },
  code(action) { return this.bindings[action]; },
  held(action) { const c = this.bindings[action]; return !!c && this.down.has(c); },
  hit(action) { const c = this.bindings[action]; return !!c && this.pressed.has(c); },
  up(action) { const c = this.bindings[action]; return !!c && this.released.has(c); },
  endFrame() { this.pressed.clear(); this.released.clear(); this.mdx = 0; this.mdy = 0; this.wheel = 0; },
  requestLock() {

    this.lockFailed = false;

  releaseLock() { try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) { /* ignore */ } },
  /* gamepad: returns a normalised snapshot or null */
  pad() {
    let pads = null;
    try { pads = navigator.getGamepads ? navigator.getGamepads() : null; } catch (e) { return null; }
    if (!pads) return null;
    for (let i = 0; i < pads.length; i++) {
      const p = pads[i];
      if (p && p.connected && p.axes && p.axes.length >= 4) {
        const dz = (v) => (Math.abs(v) < 0.18 ? 0 : v);
        const b = (n) => !!(p.buttons[n] && p.buttons[n].pressed);
        return { lx: dz(p.axes[0]), ly: dz(p.axes[1]), rx: dz(p.axes[2]), ry: dz(p.axes[3]), fire1: b(7) || b(5), fire2: b(6) || b(4), boost: b(10), jump: b(0), defense: b(1), melee: b(2), cycle: b(3), start: b(9) };

  },

/* =====================================================================
   AUDIO (all synthesised with Web Audio, started after a user gesture)
   ===================================================================== */
const Snd = {
  ctx: null, master: null, bus: {}, noiseBuf: null, voices: 0, ok: false, last: {},
  lx: 0, ly: 0, lz: 0, lyaw: 0, MAXV: 26, engine: null, musicTimer: null, musicMode: 'off', step: 0, nextT: 0, intensity: 0,
  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = this.ctx = new AC();
      this.master = c.createGain();
      const comp = c.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(c.destination);
      ['sfx', 'music', 'ui'].forEach((n) => { const g = c.createGain(); g.connect(this.master); this.bus[n] = g; });
      const len = c.sampleRate;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.ok = true;
      this.applyVolumes();
    } catch (e) { this.ok = false; }
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  applyVolumes() {
    if (!this.ok) return;
    this.master.gain.value = S.master;
    this.bus.sfx.gain.value = S.sfx; this.bus.music.gain.value = S.music * 0.6; this.bus.ui.gain.value = S.ui;
  },
  _out(bus, pan, vol) {
    const c = this.ctx, g = c.createGain();
    g.gain.value = vol;
    let last = g;
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); last = p; }
    last.connect(this.bus[bus]);
    return g;
  },
  tone(o) {
    if (!this.ok || this.voices >= this.MAXV) return;
    try {
      const c = this.ctx, t = c.currentTime + (o.delay || 0);
      const osc = c.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(Math.max(1, o.freq), t);
      if (o.freq2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freq2), t + o.dur);
      const out = this._out(o.bus || 'sfx', o.pan || 0, 0.0001);
      out.gain.setValueAtTime(0.0001, t);
      out.gain.linearRampToValueAtTime(Math.max(0.0002, o.vol), t + (o.att || 0.005));
      out.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      osc.connect(out); osc.start(t); osc.stop(t + o.dur + 0.05);
      this.voices++;
      osc.onended = () => { this.voices--; try { out.disconnect(); } catch (e) { /* gone */ } };
    } catch (e) { /* audio must never break the game */ }
  },
  noise(o) {
    if (!this.ok || this.voices >= this.MAXV) return;
    try {
      const c = this.ctx, t = c.currentTime + (o.delay || 0);
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf; src.loop = true;
      const f = c.createBiquadFilter();
      f.type = o.hp ? 'highpass' : 'lowpass';
      f.frequency.setValueAtTime(o.hp || o.lp || 2000, t);
      if (o.lp2) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.lp2), t + o.dur);
      const out = this._out(o.bus || 'sfx', o.pan || 0, 0.0001);
      out.gain.setValueAtTime(0.0001, t);
      out.gain.linearRampToValueAtTime(Math.max(0.0002, o.vol), t + (o.att || 0.004));
      out.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      src.connect(f); f.connect(out);
      src.start(t, Math.random() * 0.5); src.stop(t + o.dur + 0.05);
      this.voices++;
      src.onended = () => { this.voices--; try { out.disconnect(); } catch (e) { /* gone */ } };
    } catch (e) { /* ignore */ }
  },
  setListener(x, y, z, yaw) { this.lx = x; this.ly = y; this.lz = z; this.lyaw = yaw; },
  /* Positional one-shot. Limits per-sound repetition so rapid fire cannot flood the mixer. */
  play(name, x, y, z, scale) {
    if (!this.ok) return;
    const now = this.ctx.currentTime;
    const gap = Snd.GAP[name] === undefined ? 0.03 : Snd.GAP[name];
    if (this.last[name] && now - this.last[name] < gap) return;
    this.last[name] = now;
    let vol = scale === undefined ? 1 : scale, pan = 0;

  },
  ui(name) { this.play(name, undefined, undefined, undefined, 1); },
  /* engine hum for the player's platform */
  engineUpdate(kind, level, boosting) {

        osc.type = 'sawtooth'; osc2.type = 'square'; f.type = 'lowpass'; f.frequency.value = 300; g.gain.value = 0;

        osc.start(); osc2.start();

      e.osc.frequency.setTargetAtTime(freq, t, 0.08);
      e.osc2.frequency.setTargetAtTime(freq * 0.5, t, 0.08);
      e.f.frequency.setTargetAtTime(160 + level * (kind === 'air' ? 900 : 380) + (boosting ? 250 : 0), t, 0.1);
      e.g.gain.setTargetAtTime((0.025 + level * 0.05) * (kind === 'air' ? 1.2 : 1), t, 0.1);

/* ---------- particles (struct of arrays, swap-remove) ---------- */
const FX = {
  MAX: 720, n: 0, budget: 460,
  x: new Float32Array(720), y: new Float32Array(720), z: new Float32Array(720),
  vx: new Float32Array(720), vy: new Float32Array(720), vz: new Float32Array(720),
  life: new Float32Array(720), maxLife: new Float32Array(720), s0: new Float32Array(720), s1: new Float32Array(720),
  r: new Float32Array(720), g: new Float32Array(720), b: new Float32Array(720), a: new Float32Array(720),
  drag: new Float32Array(720), grav: new Float32Array(720), add: new Uint8Array(720),
  clear() { this.n = 0; },
  emit(x, y, z, vx, vy, vz, life, s0, s1, r, g, b, a, drag, grav, additive) {
    if (this.n >= Math.min(this.MAX, this.budget)) return;
    const i = this.n++;
    this.x[i] = x; this.y[i] = y; this.z[i] = z; this.vx[i] = vx; this.vy[i] = vy; this.vz[i] = vz;
    this.life[i] = life; this.maxLife[i] = life; this.s0[i] = s0; this.s1[i] = s1;
    this.r[i] = r; this.g[i] = g; this.b[i] = b; this.a[i] = a; this.drag[i] = drag; this.grav[i] = grav; this.add[i] = additive ? 1 : 0;

  update(dt) {

      const d = Math.exp(-this.drag[i] * dt);
      this.vx[i] *= d; this.vy[i] = this.vy[i] * d - this.grav[i] * dt; this.vz[i] *= d;

      i++;
    }
  },
  _remove(i) {
    const l = --this.n;
    if (i === l) return;
    this.x[i] = this.x[l]; this.y[i] = this.y[l]; this.z[i] = this.z[l];
    this.vx[i] = this.vx[l]; this.vy[i] = this.vy[l]; this.vz[i] = this.vz[l];
    this.life[i] = this.life[l]; this.maxLife[i] = this.maxLife[l]; this.s0[i] = this.s0[l]; this.s1[i] = this.s1[l];
    this.r[i] = this.r[l]; this.g[i] = this.g[l]; this.b[i] = this.b[l]; this.a[i] = this.a[l];
    this.drag[i] = this.drag[l]; this.grav[i] = this.grav[l]; this.add[i] = this.add[l];

  fill(out, additive) {
    let k = 0;
    const want = additive ? 1 : 0;
    for (let i = 0; i < this.n && k < 800; i++) {
      if (this.add[i] !== want) continue;
      const t = 1 - this.life[i] / this.maxLife[i];
      const o = k * 8;

    return k;
  },

/* =====================================================================
   WORLD: terrain, structures, spatial hash, raycasts, debris, effects
   ===================================================================== */
let W = null; // the live world (null in menus)

const TILE_CELLS = 8, TILES = Math.ceil(250 / TILE_CELLS);
const TERRAIN_CACHE_SIZE = 4;   // recent terrains kept for restarts and co-op joins (about 3 MB each with the mesh)
const Terrain = {
  G: 8, N: 250, heights: new Float32Array(251 * 251), tileMax: new Float32Array(TILES * TILES), sites: [], map: null,
  baseHeight(x, z, m) {
    const s = m.seed;
    let h = 16 * Math.sin(x * 0.0042 + s) * Math.cos(z * 0.0036 + s * 1.7)
      + 9 * Math.sin(x * 0.009 - z * 0.007 + s * 2.3)
      + 4.5 * Math.sin(z * 0.017 + x * 0.011 + s * 0.4)
      + 2 * Math.sin(x * 0.031 + s) * Math.sin(z * 0.027);

  },
  baseGrids: {},   // unflattened heights per map (as doubles), shared by every mission on that map
  cache: [],       // finished terrains (heights, tile maxima, mesh) for recent map + site layouts
  current: null,   // cache entry of the terrain in use
  build(map, sites) {
    this.map = map;
    this.sites = sites.map((s) => ({ x: s.x, z: s.z, r: s.r, tag: s.tag || '', h: this.baseHeight(s.x, s.z, map) }));

      entry = this.computeTerrain(map, key);
      this.cache.push(entry);
      if (this.cache.length > TERRAIN_CACHE_SIZE) this.cache.shift();

  },
  cacheKey(map, sites) {

  },
  computeTerrain(map, key) {

    for (let tj = 0; tj < TILES; tj++) for (let ti = 0; ti < TILES; ti++) {
      let m = -1e9;
      for (let j = tj * TILE_CELLS; j <= Math.min(N, tj * TILE_CELLS + TILE_CELLS); j++) for (let i = ti * TILE_CELLS; i <= Math.min(N, ti * TILE_CELLS + TILE_CELLS); i++) { const v = hs[j * (N + 1) + i]; if (v > m) m = v; }

  },
  baseGrid(map) {

    for (let j = 0; j <= N; j++) {

    }
    this.baseGrids[map.name] = grid;
    return grid;
  },
  /* flatten around each site in site order, visiting only the grid points it can reach (same result as testing every point) */
  flattenSites(base, hs) {
    const N = this.N, G = this.G;

    for (let k = 0; k < this.sites.length; k++) {

      const j0 = Math.max(0, Math.floor((s.z - reach + WORLD_HALF) / G)), j1 = Math.min(N, Math.ceil((s.z + reach + WORLD_HALF) / G));

  /* upper bound of Terrain.h around (x, z): the max height of its tile */
  maxAt(x, z) {

  /* upper bound of Terrain.h inside the box x0..x1, z0..z1: the max over the tiles it touches */
  maxIn(x0, z0, x1, z1) {

  h(x, z) {

  },
  buildMesh(map) {

      for (let i = 0; i < n; i++) {

        this.normal(x, z, nrm);

        const steep = clamp((1 - nrm.y) * 4.5, 0, 1);
        r = lerp(r, map.dark[0], steep); g = lerp(g, map.dark[1], steep); b = lerp(b, map.dark[2], steep);

          const s = this.sites[k];
          if (s.tag === 'pad' || s.tag === 'city' || s.tag === 'base') {
            const d = Math.hypot(x - s.x, z - s.z);
            const pw = 1 - smoothstep(s.r * 0.7, s.r, d);
            const tc = s.tag === 'city' ? [0.33, 0.34, 0.36] : s.tag === 'base' ? [0.44, 0.45, 0.41] : [0.46, 0.47, 0.48];

          }

        data[o++] = nrm.x; data[o++] = nrm.y; data[o++] = nrm.z;

  },
};

/* ---------- spatial hash for structures ---------- */
const Hash = {
  C: 40, NC: 50, cells: [], stamp: 1, out: [],
  reset() { this.cells = []; for (let i = 0; i < this.NC * this.NC; i++) this.cells.push([]); },
  cellOf(v) { const c = Math.floor((v + WORLD_HALF) / this.C); return c < 0 ? 0 : c > this.NC - 1 ? this.NC - 1 : c; },
  add(obj, x0, z0, x1, z1) {
    const gx0 = this.cellOf(x0), gx1 = this.cellOf(x1), gz0 = this.cellOf(z0), gz1 = this.cellOf(z1);
    for (let gx = gx0; gx <= gx1; gx++) for (let gz = gz0; gz <= gz1; gz++) this.cells[gx * this.NC + gz].push(obj);
  },
  /* Fills Hash.out[0..count-1] with the structures overlapping the box and returns the count.
     Plain structures come from the hash cells. Building pieces are not in the hash: they
     are added from each overlapping building's column grid, limited to the floors inside
     the optional height range [ylo, yhi]. plainOnly skips building pieces and also drops plain
     structures whose own box does not overlap the query box (projectile sweeps).
     Hash.out is reused and never shortened: entries past the count are stale. (Setting
     length = 0 would make V8 drop its storage and re-grow it on every query.) */
  query(x0, z0, x1, z1, ylo, yhi, plainOnly) {
    const out = this.out;
    const st = ++this.stamp, CS = this.C, NC = this.NC, LAST = NC - 1, cells = this.cells;
    let gx0 = Math.floor((x0 + WORLD_HALF) / CS), gx1 = Math.floor((x1 + WORLD_HALF) / CS), gz0 = Math.floor((z0 + WORLD_HALF) / CS), gz1 = Math.floor((z1 + WORLD_HALF) / CS);
    if (gx0 < 0) gx0 = 0; else if (gx0 > LAST) gx0 = LAST;
    if (gx1 < 0) gx1 = 0; else if (gx1 > LAST) gx1 = LAST;
    if (gz0 < 0) gz0 = 0; else if (gz0 > LAST) gz0 = LAST;
    if (gz1 < 0) gz1 = 0; else if (gz1 > LAST) gz1 = LAST;
    if (plainOnly) return this.queryOverlapping(x0, z0, x1, z1, gx0, gx1, gz0, gz1);
    let n = 0;
    for (let gx = gx0; gx <= gx1; gx++) for (let gz = gz0; gz <= gz1; gz++) {
      const c = cells[gx * NC + gz];
      for (let i = 0; i < c.length; i++) { const o = c[i]; if (o._q !== st) { o._q = st; out[n++] = o; } }
    }
    if (!W) return n;
    const list = W.buildings, lo = ylo === undefined ? -1e9 : ylo, hi = yhi === undefined ? 1e9 : yhi;
    for (let bi = 0; bi < list.length; bi++) {
      const b = list[bi];
      if (b.alive === 0 || x1 < b.ox || x0 > b.bx1 || z1 < b.oz || z0 > b.bz1 || hi < b.y0 - 2 || lo > b.topY + 0.5) continue;
      const i0 = Math.max(0, Math.floor((x0 - b.ox) / CELL)), i1 = Math.min(b.nx - 1, Math.floor((x1 - b.ox) / CELL));
      const j0 = Math.max(0, Math.floor((z0 - b.oz) / CELL)), j1 = Math.min(b.nz - 1, Math.floor((z1 - b.oz) / CELL));
      const f0 = Math.max(0, Math.floor((lo - b.y0) / b.fh) - 1), f1 = Math.min(b.nf, Math.floor((hi - b.y0) / b.fh) + 1);
      const nf1 = b.nf + 1;
      for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) {
        const base = (i * b.nz + j) * nf1;
        for (let f = f0; f <= f1; f++) { const c = b.grid[base + f]; for (let k = 0; k < c.length; k++) out[n++] = c[k]; }
      }
    }
    return n;
  },
  /* plain structures in the given cell range whose own box overlaps x0..x1, z0..z1; returns the count */
  queryOverlapping(x0, z0, x1, z1, gx0, gx1, gz0, gz1) {
    const out = this.out, st = this.stamp, NC = this.NC, cells = this.cells;
    let n = 0;
    for (let gx = gx0; gx <= gx1; gx++) for (let gz = gz0; gz <= gz1; gz++) {
      const c = cells[gx * NC + gz];
      for (let i = 0; i < c.length; i++) {
        const o = c[i];
        if (o._q === st) continue;
        o._q = st;
        if (o.x + o.hx >= x0 && o.x - o.hx <= x1 && o.z + o.hz >= z0 && o.z - o.hz <= z1) out[n++] = o;
      }
    }
    return n;
  },
};

function updateWorldEffects(dt) {
  W.time += dt;
  updateDebris(dt);
  for (let i = W.beams.length - 1; i >= 0; i--) { W.beams[i].life -= dt; if (W.beams[i].life <= 0) W.beams.splice(i, 1); }
  for (let i = W.rings.length - 1; i >= 0; i--) { W.rings[i].life -= dt; if (W.rings[i].life <= 0) W.rings.splice(i, 1); }
  for (let i = W.scorches.length - 1; i >= 0; i--) { W.scorches[i].life -= dt; if (W.scorches[i].life <= 0) W.scorches.splice(i, 1); }
  for (let i = W.lights.length - 1; i >= 0; i--) { W.lights[i].life -= dt; if (W.lights[i].life <= 0) W.lights.splice(i, 1); }
  for (let i = W.decoys.length - 1; i >= 0; i--) {
    const d = W.decoys[i]; d.life -= dt; d.vy -= 6 * dt; d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
    if (d.life <= 0 || d.y < Terrain.h(d.x, d.z)) W.decoys.splice(i, 1);
  }
  for (let i = W.pickups.length - 1; i >= 0; i--) { const p = W.pickups[i]; p.life -= dt; p.t += dt; if (p.life <= 0) W.pickups.splice(i, 1); }
  for (let i = 0; i < W.plain.length; i++) {
    const s = W.plain[i];
    if (s.flash > 0) s.flash -= dt;
    if (!s.destroyed && s.state === 2) { // critical structures smoulder
      s.smokeT -= dt;
      if (s.smokeT <= 0) { s.smokeT = 0.35; FX.emit(s.x + rand(-1, 1) * s.hx * 0.5, s.y + s.h * 0.8, s.z + rand(-1, 1) * s.hz * 0.5, 0, rand(2, 4), 0, 1.6, 0.6, 0.3, 0.3, 0.3, 0.5, 0.5, -0.8, false); }
    } else if (s.destroyed && W.time - s.destroyedAt < 12 && s.hx * s.hz > 4) {
      s.smokeT -= dt;
      if (s.smokeT <= 0) { s.smokeT = 0.5; FX.emit(s.x, s.y + 1, s.z, rand(-0.5, 0.5), rand(2, 4), rand(-0.5, 0.5), 2, 1.5, 3.4, 0.22, 0.22, 0.22, 0.4, 0.4, -0.6, false); }
    }
  }
  for (let i = W.queue.length - 1; i >= 0; i--) {
    const q = W.queue[i]; q.delay -= dt;

  }

  W.hitMarker = Math.max(0, W.hitMarker - dt); W.killMarker = Math.max(0, W.killMarker - dt); W.flash = Math.max(0, W.flash - dt);
  Bld.update(dt);
  FX.update(dt);
}

          else if (windowed) {
            grp.pieces.push(mk('sill', wx, e, wz, hx, 1.0, hz, { fl: f, i, j, hp: 0.5, vr }));
            grp.pieces.push(mk('header', wx, e + wh - 1.2, wz, hx, 1.2, hz, { fl: f, i, j, hp: 0.6, vr }));
          } else grp.pieces.push(mk('wall', wx, e, wz, hx, wh, hz, { fl: f, i, j, vr }));
          b.walls[f].push(grp);
        }
      }
    }
    // interior pillars
    for (let f = 0; f < nf; f++) {
      b.pillars.push([]);
      if (t.pillars === false) continue;
      for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
        if (!isOcc(f, i, j) || (i + j) % 2 !== 0) continue;
        if (stair && i === stair.i && j === stair.j) continue;
        if (!(isOcc(f, i + 1, j) && isOcc(f, i - 1, j) && isOcc(f, i, j + 1) && isOcc(f, i, j - 1))) continue;
        b.pillars[f].push(mk('pillar', ox + (i + 0.5) * CELL, y0 + f * fh + SLAB_T, oz + (j + 0.5) * CELL, 0.45, fh - SLAB_T, 0.45, { fl: f, i, j, vr: rb(f, i, j, 9) }));
      }
    }
    // stairs: flights of 0.5 m steps. Even flights climb in one half of the cell, odd flights come back down the
    // other half, so no flight is ever above another one and there is always head room.
    if (stair) {
      const strip = CELL / STEPS_PER_FLIGHT, halfW = (CELL / 2 - 0.3) / 2 - 0.1;
      for (let f = 0; f < stair.top; f++) {
        const fl = [], plus = f % 2 === 0, across = plus ? -1.5 : 1.5;
        const step = stair.ax === 0 ? [plus ? -1 : 1, 0] : [0, plus ? -1 : 1];
        const entryI = stair.i + (stair.ax === 0 ? (plus ? -1 : 1) : 0), entryJ = stair.j + (stair.ax === 1 ? (plus ? -1 : 1) : 0);
        void step;
        for (let k = 0; k < STEPS_PER_FLIGHT; k++) {
          const t0 = plus ? -CELL / 2 + (k + 0.5) * strip : CELL / 2 - (k + 0.5) * strip;
          const sx = ox + (stair.i + 0.5) * CELL + (stair.ax === 0 ? t0 : across), sz = oz + (stair.j + 0.5) * CELL + (stair.ax === 1 ? t0 : across);
          const hx = stair.ax === 0 ? strip / 2 : halfW, hz = stair.ax === 1 ? strip / 2 : halfW;
          const sp = mk('step', sx, y0 + f * fh + SLAB_T, sz, hx, 0.5 * (k + 1), hz, { fl: f, i: stair.i, j: stair.j, hp: 0.9, vr: rb(f, k, 3, 5) });
          sp.flight = f; sp.stepNo = k;
          if (f >= 1) sp.supportSlab = b.slab[f][entryI] && b.slab[f][entryI][entryJ];
          fl.push(sp);
        }
        b.flights.push(fl);
      }
    }
    b.total = b.pieces.length;
    this.makeChunks(b);
    this.linkNeighbours(b);
    W.buildings.push(b);
    return b;
  },
  /* group pieces into mesh chunks of CHUNK_FLOORS floors (floor index nf is the roof) */
  makeChunks(b) {
    const count = Math.floor(b.nf / CHUNK_FLOORS) + 1;
    for (let c = 0; c < count; c++) b.chunks.push({ pieces: [], dirty: true, upload: false, start: 0, cap: 0, count: 0 });
    for (const s of b.pieces) b.chunks[this.chunkIndex(b, s.fl)].pieces.push(s);
  },
  chunkIndex(b, fl) { return Math.min(b.chunks.length - 1, Math.floor(fl / CHUNK_FLOORS)); },
  /* a piece changed look (removed = false) or was removed (true): its chunk needs re-writing */
  markDirty(s, removed) {
    const b = s.bld;
    b.dirtyMesh = true;
    b.chunks[this.chunkIndex(b, s.fl)].dirty = true;
    if (!removed || !b.data) return;   // before the first layout every mask is computed anyway
    // a removed piece can reveal faces of the pieces touching it (possibly in the next chunk)
    for (const o of s.near) {
      if (o.destroyed) continue;
      o.faceMask = this.faceMask(b, o);
      b.chunks[this.chunkIndex(b, o.fl)].dirty = true;
    }
  },
  /* pieces came back (training reset): every face mask must be recomputed */
  markAllDirty(b) {
    b.dirtyMesh = true; b.relayout = true;
    for (const c of b.chunks) c.dirty = true;
  },

  /* ---------- meshes ---------- */
  pieceColor(b, s, out) {
    const t = b.t;
    let c = t.col, shade = 1;   // slabs and pillars are darker versions of the wall colour
    if (s.kind === 'found') c = FOUND_COL;
    else if (s.kind === 'roof') c = t.roof;
    else if (s.kind === 'slab') shade = 0.8;
    else if (s.kind === 'pillar') shade = 0.7;
    else if (s.kind === 'step') c = STEP_COL;
    const v = 0.9 + s.vr * 0.16, dmg = 0.62 + 0.38 * sat(s.hp / s.maxHp), burn = 1 - s.scorch * 0.4;
    const night = W.mods && W.mods.night ? 1 : 0;
    const k = v * dmg * burn;
    out[0] = c[0] * shade * k; out[1] = c[1] * shade * k; out[2] = c[2] * shade * k;
    // lit windows at night: window gap faces get no pieces, so tint headers/sills warmly
    if (night && (s.kind === 'sill') ) { out[0] = 0.9; out[1] = 0.75; out[2] = 0.4; }
  },
  /* which faces of piece s are covered by an alive touching neighbour (bit k = face k of BOX_VERTS) */
  faceMask(b, s) {
    const near = s.near;
    let mask = 0;
    for (let k = 0; k < near.length && mask !== ALL_FACES; k++) {
      const o = near[k];
      if (!o.destroyed) mask |= coverMask(o, s);
    }
    return mask;
  },
  /* pieces never move, so each piece's touching neighbours are found once, when the building is made */
  linkNeighbours(b) {
    for (const s of b.pieces) {
      NEAR.length = 0;
      const f0 = Math.max(0, s.fl - 1), f1 = Math.min(b.nf, s.fl + 1);
      const i0 = Math.max(0, s.ci - 1), i1 = Math.min(b.nx - 1, s.ci + 1);
      for (let f = f0; f <= f1; f++) {
        for (let i = i0; i <= i1; i++) this.collectTouching(b, s, i, f);   // every piece that can touch s is in the 3 x 3 cells, 3 floors around it
      }
      s.near = NEAR.slice();
    }
  },
  collectTouching(b, s, i, f) {
    const j0 = Math.max(0, s.cj - 1), j1 = Math.min(b.nz - 1, s.cj + 1);
    for (let j = j0; j <= j1; j++) {
      const list = b.grid[(i * b.nz + j) * (b.nf + 1) + f];
      for (let k = 0; k < list.length; k++) if (list[k] !== s && touches(list[k], s)) NEAR.push(list[k]);
    }
  },
  /* vertices the chunk needs after hidden-face removal (recompute = work out each piece's face mask first) */
  measureChunk(b, chunk, recompute) {
    let faces = 0;
    for (const s of chunk.pieces) {
      if (s.destroyed) continue;
      if (recompute) s.faceMask = this.faceMask(b, s);
      faces += visibleFaceCount(s.faceMask);
    }
    return faces * 6;
  },
  /* write the chunk's pieces into its room in b.buf (masks from measureChunk) */
  writeChunk(b, chunk) {
    const a = b.buf;
    let o = chunk.start * 9;
    for (const s of chunk.pieces) {
      if (s.destroyed) continue;
      this.pieceColor(b, s, PIECE_COL);
      o = writePieceFaces(a, o, s, PIECE_COL);
    }
    a.fill(0, o, (chunk.start + chunk.cap) * 9);   // unused room: zero-area triangles that draw nothing
    chunk.count = o / 9 - chunk.start;
    chunk.dirty = false; chunk.upload = true;
  },
  /* give every chunk fresh room (its need plus slack) and write all of them */
  layoutAll(b) {
    let total = 0;
    for (const c of b.chunks) {
      const need = this.measureChunk(b, c, true);
      c.start = total;
      c.cap = Math.ceil(need * CHUNK_SLACK / 6) * 6 + 36;   // + 36: always room for one more whole piece
      total += c.cap;
    }
    if (!b.buf || b.buf.length < total * 9) b.buf = new Float32Array(total * 9);
    for (const c of b.chunks) this.writeChunk(b, c);
    b.data = b.buf.subarray(0, total * 9);
    b.gpuDirty = true;   // the layout changed: upload the whole mesh
    b.relayout = false;
  },
  /* full rebuild (first draw, training reset, benchmarks) */
  rebuild(b) {
    this.markAllDirty(b);
    this.layoutAll(b);
    this.finishRebuild(b);
  },
  /* re-write only the dirty chunks; falls back to a full layout when one outgrew its room */
  refresh(b) {
    let fits = !b.relayout && !!b.data;
    for (const c of b.chunks) {
      if (fits && c.dirty && this.measureChunk(b, c, false) > c.cap) fits = false;
    }
    if (!fits) this.layoutAll(b);
    else for (const c of b.chunks) if (c.dirty) this.writeChunk(b, c);
    // after heavy destruction most of the room is empty padding the GPU still processes: pack it again
    let used = 0;
    for (const c of b.chunks) used += c.count;
    if (used < COMPACT_BELOW * (b.data.length / 9)) this.layoutAll(b);
    this.finishRebuild(b);
  },
  finishRebuild(b) {
    let top = b.y0 + 0.5, vertices = 0;
    for (const s of b.pieces) if (!s.destroyed && s.top > top) top = s.top;
    for (const c of b.chunks) vertices += c.count;
    b.topY = top; b.vertexCount = vertices;
    b.dirtyMesh = false;
    b.nextRebuild = W.time + 0.12;
  },
  /* send changed vertices to the GPU: the whole mesh after a new layout, else only re-written chunks */
  upload(b) {
    const fresh = !b.mesh || b.mesh.ctx !== R.ctxId;
    if (fresh || b.gpuDirty) {
      if (fresh) b.mesh = R.makeMesh(b.data); else R.updateMesh(b.mesh, b.data);
      b.gpuDirty = false;
      for (const c of b.chunks) c.upload = false;
      return;
    }
    for (const c of b.chunks) {
      if (!c.upload) continue;
      R.updateMeshRange(b.mesh, b.data, c.start, c.cap);
      c.upload = false;
    }
  },
  draw(b) {
    if (!R.visible(b.cx, b.cy, b.cz, b.radius)) return;
    if (b.dirtyMesh && W.time >= b.nextRebuild) this.refresh(b);
    if (!b.data) this.rebuild(b);
    this.upload(b);
    R.stack.top = 0; R.stack.ident();
    R.drawRaw(b.mesh, 0.12);
    // rubble heap where the building has fallen
    const frac = b.alive / b.total;
    if (frac < 0.65) {
      const k = 1 - frac / 0.65, h = 0.6 + 3.2 * k * k;
      R.box(b.cx, b.y0 + h / 2, b.cz, b.nx * CELL * (0.55 + 0.35 * k), h, b.nz * CELL * (0.55 + 0.35 * k), [0.3, 0.29, 0.28], 0, 0);
    }
  },

  /* ---------- destruction ---------- */
  pieceDestroyed(s, owner) {
    const b = s.bld;
    b.alive--; this.markDirty(s, true);
    spawnDebris(s.x, s.y + s.h / 2, s.z, 2, s, 9);
    if (Math.random() < 0.4) fxSmokePuff(s.x, s.y + s.h / 2, s.z, 1.4, 1);
    fxSparks(s.x, s.y + s.h / 2, s.z, 3, [1, 0.8, 0.5], 8);
    Snd.play('hitStruct', s.x, s.y, s.z, 0.8);
    if (!Net.guest) { if (!b.needCheck) { b.needCheck = true; b.checkAt = W.time + 0.3; } }
    void owner;
  },
  isAlive(s) { return !!s && !s.destroyed && s.fallAt === undefined; },
  groupAlive(g) { return g.pieces.some((p) => !p.destroyed); },
  /* decide which pieces have lost their support */
  supportCheck(b) {
    const falling = [];
    const mark = (s, delay) => { if (s && !s.destroyed && s.fallAt === undefined) { s.fallAt = W.time + delay; falling.push(s); } };
    const nf = b.nf, nx = b.nx, nz = b.nz;
    const slabOK = (f, i, j) => { const s = b.slab[f] && b.slab[f][i] && b.slab[f][i][j]; return !!s && !s.destroyed && s.fallAt === undefined; };
    // 1. slabs: each cell must connect, within two cells, to a cell resting on a wall or pillar below
    for (let f = 1; f <= nf; f++) {
      const reach = [];
      for (let i = 0; i < nx; i++) reach.push(new Array(nz).fill(-1));
      const queue = [];
      for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) {
        if (!slabOK(f, i, j)) continue;
        let anchored = false;
        for (const g of b.walls[f - 1] || []) if (g.i === i && g.j === j && this.groupAlive(g)) { anchored = true; break; }
        if (!anchored) for (const p of (b.pillars[f - 1] || [])) if (p.ci === i && p.cj === j && !p.destroyed) { anchored = true; break; }
        if (anchored) { reach[i][j] = 0; queue.push([i, j]); }
      }
      for (let q = 0; q < queue.length; q++) {
        const [i, j] = queue[q], d = reach[i][j];
        if (d >= 2) continue;
        for (const dd of DIR_AXIS) {
          const ni = i + dd[0], nj = j + dd[1];
          if (ni < 0 || nj < 0 || ni >= nx || nj >= nz || reach[ni][nj] >= 0 || !slabOK(f, ni, nj)) continue;
          reach[ni][nj] = d + 1; queue.push([ni, nj]);
        }
      }
      for (let i = 0; i < nx; i++) for (let j = 0; j < nz; j++) if (slabOK(f, i, j) && reach[i][j] < 0) mark(b.slab[f][i][j], 0.25 + Math.random() * 0.5);
    }
    // 2. walls and pillars need the floor they stand on
    for (let f = 1; f < nf; f++) {
      for (const g of b.walls[f]) {
        const inStair = b.stair && g.i === b.stair.i && g.j === b.stair.j;      // the stair cell has no floor slab by design
        const ok = inStair ? (b.stair.ax === 0 ? slabOK(f, g.i - 1, g.j) || slabOK(f, g.i + 1, g.j) : slabOK(f, g.i, g.j - 1) || slabOK(f, g.i, g.j + 1)) : slabOK(f, g.i, g.j);
        if (!ok) for (const p of g.pieces) mark(p, 0.3 + Math.random() * 0.5);
      }
      for (const p of b.pillars[f]) if (!slabOK(f, p.ci, p.cj)) mark(p, 0.3 + Math.random() * 0.5);
    }
    // 3. stair flights rest on the flight below
    for (const fl of b.flights) for (const s of fl) if (s.supportSlab && (s.supportSlab.destroyed || s.supportSlab.fallAt !== undefined)) mark(s, 0.4 + Math.random() * 0.4);
    // 4. a floor that has lost most of its walls and pillars cannot carry what is above it: pancake collapse
    for (let f = 0; f < nf; f++) {
      const groups = b.walls[f], total = groups.length + b.pillars[f].length;
      if (total < 4) continue;
      const aliveN = groups.filter((g) => this.groupAlive(g) && g.pieces.some((p) => p.fallAt === undefined)).length + b.pillars[f].filter((p) => !p.destroyed && p.fallAt === undefined).length;
      if (aliveN / total < 0.38) {
        let n = 0;
        for (const p of b.pieces) {
          if (p.destroyed || p.fallAt !== undefined || p.kind === 'found') continue;
          const above = p.fl > f;
          if (above) { mark(p, 0.2 + (p.fl - f) * 0.12 + Math.random() * 0.4); n++; }
        }
        if (n > 4) b.collapseBurst = n;
        break;
      }
    }
    if (falling.length) { b.fallQueue = (b.fallQueue || []).concat(falling); }
    if (b.collapseBurst) {
      explode(b.cx, b.y0 + b.nf * b.fh * 0.4, b.cz, 7, 0, 'explosive', null);
      shakeFrom(b.cx, b.y0, b.cz, 0.5, 300);
      b.collapseBurst = 0;
    }
  },
  crush(s) {
    const r = Math.max(s.hx, s.hz);
    const dmg = s.kind === 'slab' || s.kind === 'roof' ? 70 : s.kind === 'pillar' ? 40 : 25;
    for (const p of W.platforms) {
      if (p.dead || p.kind === 'air') continue;
      if (Math.abs(p.x - s.x) > r + p.radius || Math.abs(p.z - s.z) > r + p.radius) continue;
      if (p.y >= s.y - 0.5 && p.y < s.y + 0.6) continue;           // standing on top of it
      if (p.y + p.height > s.y && p.y < s.y) { p.takeDamage(dmg, 'kinetic', null, 0, 0); p.stagger = Math.max(p.stagger, 0.5); }
    }
  },
  update(dt) {
    for (const b of W.buildings) {
      if (Net.guest) {
        if (b.alive < b.total && b.alive / b.total < 0.9 && Math.random() < dt * 0.4) this.smoke(b);
        continue;
      }
      if (b.needCheck && W.time >= b.checkAt) { b.needCheck = false; this.supportCheck(b); }
      const q = b.fallQueue;
      if (q && q.length) {
        let n = 0;
        for (let i = q.length - 1; i >= 0; i--) {
          const s = q[i];
          if (s.destroyed) { q.splice(i, 1); continue; }
          if (W.time >= s.fallAt && n < 14) {
            q.splice(i, 1); n++;
            this.crush(s);
            destroyStruct(s, null);
            if (s.kind === 'slab' || s.kind === 'roof') fxSmokePuff(s.x, s.y, s.z, 3, 2);
          }
        }
      }
      if (b.alive < b.total && b.alive / b.total < 0.9 && Math.random() < dt * 0.4) this.smoke(b);
    }
  },
  smoke(b) {
    const alive = b.pieces[Math.floor(Math.random() * b.pieces.length)];
    if (alive && !alive.destroyed) FX.emit(alive.x, alive.y + alive.h, alive.z, rand(-0.5, 0.5), rand(2, 4), rand(-0.5, 0.5), 2.2, 1.6, 3.8, 0.25, 0.25, 0.25, 0.4, 0.4, -0.6, false);
  },
};

/* ---------------------------------------------------------------------
   Scenery: one city and one military base per battlefield
   --------------------------------------------------------------------- */
const SCENERY = {
  ashfall: { city: { x: -120, z: 690, r: 150 }, base: { x: 680, z: 650, r: 125 } },
  verdant: { city: { x: -560, z: 560, r: 150 }, base: { x: 650, z: -250, r: 125 } },
  frost: { city: { x: -600, z: 600, r: 150 }, base: { x: 650, z: -450, r: 125 } },
};
const Scenery = {
  sitesFor(map) {
    const s = SCENERY[map];
    return s ? [{ x: s.city.x, z: s.city.z, r: s.city.r + 15, tag: 'city' }, { x: s.base.x, z: s.base.z, r: s.base.r + 15, tag: 'base' }] : [];
  },
  keepOutFor(map) {
    const s = SCENERY[map];
    return s ? [{ x: s.city.x, z: s.city.z, r: s.city.r + 10 }, { x: s.base.x, z: s.base.z, r: s.base.r + 10 }] : [];
  },
  build(map, seed) {
    const s = SCENERY[map];
    if (!s) return;
    let h = seed >>> 0;
    for (let i = 0; i < map.length; i++) h = (h * 31 + map.charCodeAt(i)) >>> 0;
    const rng = makeRng(h);
    this.city(s.city, rng);
    this.base(s.base, rng);
  },
  city(c, rng) {
    const step = 52;
    for (let gi = -2; gi <= 2; gi++) for (let gj = -2; gj <= 2; gj++) {
      const x = c.x + gi * step, z = c.z + gj * step, d = Math.hypot(gi, gj) * step;
      if (d > c.r - 18) continue;
      const roll = rng();
      let id;
      if (d < 40) id = roll < 0.55 ? 'skyscraper' : 'terraced';
      else if (d < 80) id = roll < 0.25 ? 'skyscraper' : roll < 0.55 ? 'office' : roll < 0.75 ? 'terraced' : 'mall';
      else id = roll < 0.3 ? 'apartment' : roll < 0.55 ? 'apartmentL' : roll < 0.7 ? 'office' : 'shop';
      if (roll > 0.93 && d > 60) continue;                                   // an empty lot or small park
      Bld.make(id, x + (rng() - 0.5) * 6, z + (rng() - 0.5) * 6, rng);
    }
    // street furniture for cover
    for (let n = 0; n < 14; n++) {
      const a = rng() * TAU, r = rng() * (c.r - 25);
      const x = c.x + Math.cos(a) * r, z = c.z + Math.sin(a) * r;
      const type = rng() < 0.5 ? 'barrier' : 'crate';
      if (W.place) W.place(type, x, z, { swap: rng() < 0.5 });
    }
  },
  base(c, rng) {
    const put = (id, dx, dz) => Bld.make(id, c.x + dx, c.z + dz, rng);
    put('barracks', -58, -62); put('barracks', -58, -26); put('barracks', -58, 10);
    put('hq', 5, 48);
    put('hangar', 52, -52); put('hangar', 52, 10);
    put('bunker', -4, -70); put('bunker', 8, -2);
    put('guard', -92, -92); put('guard', 92, -92); put('guard', -92, 92); put('guard', 92, 92);
    // perimeter wall with two gates
    const half = 100;
    for (let k = -half + 5; k <= half - 5; k += 10) {
      for (const side of [0, 1]) {
        const gate = Math.abs(k) < 14;
        const near = Math.abs(k) > half - 22;                                  // keep the corners free for the towers
        if (!near && !(gate && side === 0)) { if (W.place) W.place('barrier', c.x + k, c.z + (side ? half : -half), {}); }
        if (!near && !gate) { if (W.place) W.place('barrier', c.x + (side ? half : -half), c.z + k, { swap: true }); }
      }
    }
    for (const q of [[-30, 20], [30, -20], [-20, -20]]) if (W.place) W.place('fuel', c.x + q[0], c.z + q[1], {});
    if (W.place) { W.place('generator', c.x + 70, c.z + 60, {}); W.place('tower', c.x - 80, c.z + 40, {}); for (let n = 0; n < 6; n++) W.place('crate', c.x - 20 + n * 4, c.z + 28, {}); }
  },
  /* hostile defenders for the base, spawned on the host only */
  garrison(map) {
    const s = SCENERY[map];
    if (!s) return;
    const c = s.base;
    spawnGroup(['turret', 'turret', 'turret', 'aaTurret', 'sniper', 'sniper'], c.x, c.z, { radius: 95 });
    spawnGroup(['infantry', 'infantry', 'infantry', 'infantry', 'rpgTrooper', 'rpgTrooper', 'tank'], c.x, c.z, { radius: 60 });
  },
};


/* =====================================================================
   PLATFORMS: shared combat entity for mechs, ground vehicles and aircraft
   A platform is driven by a command struct (cmd) filled by a controller:

    FX.emit(mz.x + dir.x, mz.y + dir.y, mz.z + dir.z, 0, 0, 0, 0.08, fl * 2, fl * 0.5, d.tracer[0], d.tracer[1], d.tracer[2], 0.9, 0, 0, true);
    if (d.blast >= 4 || d.fire === 'charge') addLight(mz.x, mz.y, mz.z, 28, d.tracer[0], d.tracer[1], d.tracer[2], 0.12);
  }
  solveArc(d, mz, ap, dir) {

  fireBeam(w, mz, dx, dy, dz) {

    const ex = r.hit ? r.x : mz.x + dx * d.range, ey = r.hit ? r.y : mz.y + dy * d.range, ez = r.hit ? r.z : mz.z + dz * d.range;
    if (Net.host) Net.bcast({ t: 'b', a: [r1(mz.x), r1(mz.y), r1(mz.z), r1(ex), r1(ey), r1(ez)], c: WEAPON_IDS.indexOf(w.id) });
    if (W.beams.length < 28) W.beams.push({ x1: mz.x, y1: mz.y, z1: mz.z, x2: ex, y2: ey, z2: ez, life: 0.07, maxLife: 0.07, col: d.tracer, width: 0.35 });

    const kind = r.kind, obj = r.obj;

  }

  /* ---------------- defenses ---------------- */
  updateDefense(dt) {
    const u = this.util, c = this.cmd;
    if (this.kind === 'air' && c.ejectEdge) {
      if (this.ejectArm > 0) { this.eject(); return; }
      this.ejectArm = 1.6; if (W.player === this) W.msgL('PRESS EJECT AGAIN TO CONFIRM' + (this.canWithdraw() ? ' (WITHDRAWAL: NO DEATH RECORDED)' : ' (HULL LOW: COUNTS AS A DEATH)'));
    }
    if (!u) return;
    const ud = u.def;
    u.cd = Math.max(0, u.cd - dt);
    switch (ud.def) {
      case 'shield':
        if (c.defenseEdge) {
          if (this.shieldOn) this.shieldOn = false;
          else if (this.shieldBroken <= 0 && this.shield > 1 && this.energy > 5 && !this.energyLock) { this.shieldOn = true; Snd.play('shieldHit', this.x, this.y, this.z, 0.8); }
        }
        // a steady drain that, unlike boosts and jets, does not pause energy regeneration
        if (this.shieldOn) { this.energy -= ud.drain * dt; if (this.energyLock || this.shieldBroken > 0) this.shieldOn = false; }
        break;
      case 'aps':
        if (c.defenseEdge) { u.auto = !u.auto; if (W.player === this) W.msgL('ACTIVE PROTECTION ' + (u.auto ? 'ARMED' : 'OFF')); }
        if (u.charges < ud.charges) { u.rechargeT += dt; if (u.rechargeT >= ud.recharge) { u.rechargeT = 0; u.charges++; } } else u.rechargeT = 0;
        if (u.auto && u.charges > 0 && u.cd <= 0) this.apsScan(u);
        break;
      case 'repair':
        if (c.defenseEdge && u.charges > 0 && u.cd <= 0 && this.hp < this.maxHp) {
          u.charges--; u.cd = ud.cd; u.healLeft = this.maxHp * ud.heal; Snd.ui('repair');
          if (W.player === this) W.msgL('REPAIR NANITES ACTIVE');
        }
        if (u.healLeft > 0) {
          const h = Math.min(u.healLeft, this.maxHp * ud.heal / 5 * dt);
          this.hp = Math.min(this.maxHp, this.hp + h); u.healLeft -= h;
          if (Math.random() < dt * 14) FX.emit(this.x + rand(-1, 1) * this.radius, this.y + this.height * rand(0.2, 1), this.z + rand(-1, 1) * this.radius, 0, 3, 0, 0.6, 1, 0.3, 0.4, 1, 0.5, 0.8, 0, 0, true);
        }

    c.defenseEdge = false;
  }
  apsScan(u) {
    const ps = W.projs, R2 = u.def.radius;
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      if (!p.active || p.team === this.team || !(p.def.rocket || p.def.arc)) continue;
      if (p.dmg < u.def.minDmg) continue;   // light rockets are not worth a charge
      const d = Math.hypot(p.x - this.x, p.y - (this.y + this.height * 0.5), p.z - this.z);
      if (d > R2) continue;

      explode(p.x, p.y, p.z, 2.2, 0, 'explosive', null);
      Snd.play('shieldHit', p.x, p.y, p.z, 1);

    }
  }
  deployFlares(u) {
    u.charges--; u.cd = u.def.cd;
    const b = basisFrom(this.yaw, this.pitch, this.roll, TMP_BASIS);
    for (let i = 0; i < 3; i++) {
      W.decoys.push({ x: this.x - b.fx * 6, y: this.y - 1, z: this.z - b.fz * 6, vx: this.vx * 0.4 - b.fx * 14 + rand(-12, 12), vy: rand(-6, 4), vz: this.vz * 0.4 - b.fz * 14 + rand(-12, 12), life: 3.8 + Math.random(), isDecoy: true });
    }
    Snd.play('flare', this.x, this.y, this.z, 1);
    const decoy = W.decoys[W.decoys.length - 1];
    for (let i = 0; i < W.projs.length; i++) {
      const p = W.projs[i];
      if (p.active && p.target === this && Math.random() < FLARE_SPOOF) p.target = decoy;
    }
    for (let i = 0; i < W.platforms.length; i++) { const e = W.platforms[i]; if (e.lock.target === this && Math.random() < 0.7) { e.lock.progress = 0; e.lock.state = 'none'; } }

  /* Ejecting with enough hull left is a tactical withdrawal: the platform is lost, but no death is recorded. */
  canWithdraw() { return this.hp >= this.maxHp * EJECT_SAFE_HULL; }
  eject() {

    notify(this, this.withdrew ? 'TACTICAL WITHDRAWAL: PLATFORM LOST, NO DEATH RECORDED' : 'EJECTED: PLATFORM LOST');
    Snd.ui('eject');
    FX.emit(this.x, this.y + 2, this.z, 0, 14, 0, 1.2, 4, 1, 1, 0.9, 0.5, 0.9, 1, 0, true);

  }
  doMelee() {
    if (this.meleeCd > 0 || this.stagger > 0) return;
    this.meleeCd = 1.1; this.meleeT = 0.4;
    const d = this.def.mech;
    const fx = Math.sin(this.torsoYaw), fz = Math.cos(this.torsoYaw), reach = this.radius + (this.def.style === 'infantry' ? 2.2 : 7);
    Snd.play('melee', this.x, this.y, this.z, 1);
    const hx = this.x + fx * (this.radius + (this.def.style === 'infantry' ? 1 : 2.5)), hz = this.z + fz * (this.radius + (this.def.style === 'infantry' ? 1 : 2.5));

      if (dd > reach + p.radius || (dx * fx + dz * fz) / Math.max(1, dd) < 0.3) continue;

    const list = Hash.out.slice(0, n);
    for (const s of list) if (!s.destroyed && structContains(s, hx, hz, 4)) damageStruct(s, d.meleeDmg * 1.8, 'kinetic', this, 1);
    fxSparks(hx, this.y + this.height * 0.4, hz, 10, [1, 0.8, 0.4], 14);
    shakeFrom(hx, this.y, hz, 0.15, 60);
  }

  /* ---------------- damage ---------------- */
  takeDamage(amount, dtype, owner, dx, dz, info) {
    if (Net.guest) return 0;
    if (this.dead || amount <= 0 || this.invuln) return 0;
    info = info || {};
    if (owner && owner.team === this.team && !W.friendlyFire) return 0;
    if (owner === this && !W.friendlyFire) return 0;
    if (owner && owner.team === 1 && this.team === 0) amount *= W.diff.dmg;
    // rear armour is weaker
    if (!info.blast && this.kind !== 'air' && dx !== undefined && (dx !== 0 || dz !== 0)) {
      const l = Math.hypot(dx, dz) || 1, face = (dx * Math.sin(this.yaw) + dz * Math.cos(this.yaw)) / l;

      FX.emit(this.x, this.y + this.height * 0.5, this.z, 0, 0, 0, 0.18, this.radius * 2.4, this.radius * 2.8, 0.3, 0.8, 1, 0.35, 0, 0, true);
      if (this.shield <= 0) { this.shieldOn = false; this.shieldBroken = 3.5; Snd.play('shieldBreak', this.x, this.y, this.z, 1); if (W.player === this) W.msgL('SHIELD DOWN'); }
    }

      const eff = dtype === 'energy' ? 0.6 : dtype === 'explosive' ? 0.85 : 1;

      const toArmor = Math.min(this.armor * soak, rem * this.def.armorRatio * eff);
      this.armor = Math.max(0, this.armor - toArmor / soak); rem -= toArmor;
    }
    if (rem > 0) {
      this.hp -= rem; this.hitFlash = 0.18;
      if (!info.blast && !info.beam) Snd.play('hit', this.x, this.y, this.z, 0.9);
    }
    if (owner) { owner.stats.damage += total; if (owner === W.player) { W.stats.damageDealt += total; W.hitMarker = 0.25; W.lastHit = { dmg: Math.round(total), target: this.name }; (W.dmgLog || (W.dmgLog = [])).push({ t: W.time, a: total }); } else if (owner.netPeer) Net.sendTo(owner.netPeer, { t: 'h' }); }
    if (this === W.player) {
      W.stats.damageTaken += total; W.flash = 0.25;

    } else if (this.netPeer) Net.sendTo(this.netPeer, { t: 'd', a: r2(dx !== undefined ? Math.atan2(-dx, -dz) : 0), v: Math.round(total) });

    const f = this.hp / this.maxHp;
    if (this.hp > 0 && this.def.hp > 100) {
      while (this.subIndex < 2 && f < (this.subIndex === 0 ? 0.66 : 0.33)) { this.failSubsystem(); this.subIndex++; }
    }
    if (this.hp <= 0) this.destroy(owner, dtype);

  }
  failSubsystem() {
    const names = ['weapons', 'mobility', 'sensors'];
    const name = names[Math.floor(Math.random() * 3)];

    if (W.player === this) { W.msgL('SUBSYSTEM FAILURE: ' + name.toUpperCase()); Snd.ui('warn'); }
  }
  destroy(owner, cause) {
    if (this.dead) return;

      explode(this.x, cy, this.z, rad, 30, 'explosive', null, { exclude: this });
      spawnDebris(this.x, cy, this.z, 10, { mat: 'metal', hx: this.radius * 0.5, hz: this.radius * 0.5, type: 'wreck' }, 18);

      const types = W.mods.scarce ? ['repair', 'energy'] : ['ammo', 'repair', 'energy'];   // scarce ammunition: no ammo drops
      const t = types[Math.floor(Math.random() * types.length)];
      spawnPickup(t, this.x, this.z, 50);
    }
    W.feed.push({ t: W.time, text: (owner ? owner.name : cause === 'crash' || cause === 'collision' ? 'Collision' : 'Unknown') + '  >  ' + this.name, team: this.team });
    if (W.feed.length > 5) W.feed.shift();
    if (Net.host) { const fe = W.feed[W.feed.length - 1]; Net.bcast({ t: 'f', text: fe.text, team: fe.team }); }
    if (W.onPlatformDestroyed) W.onPlatformDestroyed(this, owner, cause);
  }
}

/* resolve platform-versus-platform overlaps (called once per tick) */
function resolvePairs(dt) {
  const pl = W.platforms;
  for (let i = 0; i < pl.length; i++) {
    const a = pl[i];
    if (a.dead) continue;
    for (let j = i + 1; j < pl.length; j++) {
      const b = pl[j];
      if (b.dead) continue;
      const dx = b.x - a.x, dz = b.z - a.z, dist2 = dx * dx + dz * dz, rr = a.radius + b.radius;
      if (dist2 > rr * rr * 1.2) continue;
      if (a.kind === 'air' && b.kind === 'air') {
        if (Math.hypot(dx, b.y - a.y, dz) < rr * 0.8) {
          a.takeDamage(260, 'collision', null, dx, dz, { noStagger: true }); b.takeDamage(260, 'collision', null, -dx, -dz, { noStagger: true });
        }
        continue;
      }
      if (a.kind === 'air' || b.kind === 'air') {
        const air = a.kind === 'air' ? a : b, gr = a.kind === 'air' ? b : a;
        if (air.y < gr.y + gr.height + air.radius * 0.5 && Math.hypot(air.x - gr.x, air.z - gr.z) < gr.radius + air.radius * 0.5 && air.crashCd <= 0) {
          air.crashCd = 0.8;
          air.takeDamage(200, 'collision', null, 0, 0, { noStagger: true }); gr.takeDamage(120, 'collision', null, 0, 0);
        }
        continue;
      }
      if (a.def.speed === 0 && b.def.speed === 0) continue;
      const d = Math.sqrt(dist2) || 0.001;
      if (d >= rr) continue;
      const nx = dx / d, nz = dz / d, push = rr - d;
      const ia = a.def.speed === 0 ? 0 : 1 / a.def.mass, ib = b.def.speed === 0 ? 0 : 1 / b.def.mass, is = ia + ib || 1;
      a.x -= nx * push * ia / is; a.z -= nz * push * ia / is; b.x += nx * push * ib / is; b.z += nz * push * ib / is;
      const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
      if (rel < -10 && a.team !== b.team) {
        const dmg = Math.min(80, -rel * 1.2);
        a.takeDamage(dmg * b.def.mass / a.def.mass * 0.5, 'collision', null, nx, nz, { noStagger: true });
        b.takeDamage(dmg * a.def.mass / b.def.mass * 0.5, 'collision', null, -nx, -nz, { noStagger: true });
      }
    }
  }
}


/* =====================================================================
   PROCEDURAL MODELS (articulated parts; no assets)
   ===================================================================== */
const TEAM_ACCENT = { 0: [0.2, 0.85, 1.0], 1: [1.0, 0.32, 0.14], 2: [1, 0.85, 0.2] };

function part(mesh, x, y, z, sx, sy, sz, col, emis, spec, alpha) {
  const st = R.stack;
  st.push().t(x, y, z).s(sx, sy, sz);
  R.draw(mesh, col[0], col[1], col[2], alpha, emis, spec);
  st.pop();
}
/* barrel along +z */
function barrel(x, y, z, w, len, col, recoil) {
  const st = R.stack;
  st.push().t(x, y, z + len * 0.5 - (recoil || 0)).rx(PI / 2).s(w, len, w);
  R.draw('cyl', col[0], col[1], col[2], 1, 0, 0.6);
  st.pop();
}
function tint(c, f, add) { return [c[0] * f + add, c[1] * f + add, c[2] * f + add]; }

function drawPlatform(p) { drawPlatformBody(p); drawPlatformOverlay(p); }
/* the opaque model (can be baked into a batch) */
function drawPlatformBody(p) {
  if (p.dead) return;
  const cy = p.y + (p.kind === 'air' ? 0 : p.height * 0.5);
  if (!R.visible(p.x, cy, p.z, p.radius * 2 + 8)) return;
  const dist = Math.hypot(p.x - R.cam.x, p.z - R.cam.z);
  const acc = TEAM_ACCENT[p.team] || TEAM_ACCENT[2];
  const flash = p.hitFlash > 0 ? 0.3 : 0;
  const dmgK = p.hp / p.maxHp < 0.3 ? 0.65 : 1;
  const main = tint(p.def.col.main, dmgK, flash), dark = tint(p.def.col.dark, dmgK, flash);
  const lod = dist > 380;
  const st = R.stack;
  st.top = 0; st.ident();
  switch (p.model) {
    case 'mech': drawMech(p, main, dark, acc, lod); break;
    case 'infantry': drawInfantry(p, main, dark, acc, lod); break;
    case 'wheeled': drawWheeled(p, main, dark, acc, lod); break;
    case 'tracked': drawTracked(p, main, dark, acc, lod); break;
    case 'hover': drawHover(p, main, dark, acc, lod); break;
    case 'truck': drawTruck(p, main, dark, acc); break;
    case 'dummy': drawDummy(p, main, acc); break;
    case 'turret': drawTurret(p, main, dark, acc); break;
    case 'jet': drawJet(p, main, dark, acc, lod); break;
    case 'gunship': drawGunship(p, main, dark, acc, lod); break;
    case 'bomber': drawBomber(p, main, dark, acc); break;
    default: R.box(p.x, p.y + p.height / 2, p.z, p.radius, p.height, p.radius, main, 0, 0);
  }
  st.top = 0; st.ident();
}
/* transparent effects on a platform: drawn live, after all opaque geometry */
function drawPlatformOverlay(p) {
  if (p.dead || !((p.shieldOn && p.shield > 0) || p.telegraph > 0)) return;
  const cy = p.y + (p.kind === 'air' ? 0 : p.height * 0.5);
  if (!R.visible(p.x, cy, p.z, p.radius * 3 + 8)) return;
  const st = R.stack;
  st.top = 0; st.ident();
  // energy shield bubble
  if (p.shieldOn && p.shield > 0) {
    R.blend(true, true); R.depthWrite(false);
    const k = 0.5 + 0.5 * (p.shield / p.maxShield), rr = p.radius * 2.6;
    st.push().t(p.x, cy, p.z).s(rr, p.height * 1.15 + 1, rr);
    R.draw('sphere', 0.2 * k, 0.55 * k, 1 * k, 0.28, 0.8, 0);
    st.pop();
    R.blend(false); R.depthWrite(true);
  }
  // telegraph glow (enemy heavy weapon wind-up)
  if (p.telegraph > 0) {
    R.blend(true, true); R.depthWrite(false);
    const pulse = 0.5 + 0.5 * Math.sin(W.time * 30);
    st.push().t(p.x, cy + p.height * 0.35, p.z).s(3 + pulse, 3 + pulse, 3 + pulse);
    R.draw('sphere', 1, 0.2, 0.1, 0.6, 2, 0);
    st.pop();
    R.blend(false); R.depthWrite(true);
  }
}

function drawMech(p, main, dark, acc, lod) {
  const st = R.stack, k = p.height / 10, style = p.def.style;
  const heavy = style === 'heavy', light = style === 'light';
  const tw = (light ? 3.0 : heavy ? 5.6 : 4.2) * k, th = (light ? 2.4 : 3.2) * k, td = (light ? 2.6 : heavy ? 3.8 : 3.2) * k;
  const spd = p.speed, swing = Math.sin(p.walkPhase) * 0.65 * clamp(spd / 8, 0, 1) * (p.grounded ? 1 : 0.2);
  const hipY = 5.0 * k, hipX = (light ? 0.9 : heavy ? 1.7 : 1.3) * k, legW = (light ? 0.8 : heavy ? 1.7 : 1.2) * k;
  const crouchDrop = p.crouch ? 1.2 * k : 0;
  const acEm = 0.9;
  st.push().t(p.x, p.y - crouchDrop * 0.2, p.z).ry(p.yaw).rx(-p.pitch);
  // legs
  for (let side = -1; side <= 1; side += 2) {
    const sw = swing * side;

// Every projectile slot gets all fields up front, so used and unused slots share one hidden shape.
function newProjectileSlot() {
  return {
    active: false, def: null, owner: null, team: 0, nid: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
    life: 0, age: 0, dmg: 0, pierceLeft: 0, hitSet: null, target: null, curSpeed: 0, noGuide: false,
  };
}
function spawnProjectile(owner, w, mz, dx, dy, dz, charge) {
  const d = w.def;
  let p = null;
  for (let i = 0; i < MAX_PROJECTILES; i++) {
    const c = W.projs[(W.projCursor + i) % MAX_PROJECTILES];
    if (!c.active) { p = c; W.projCursor = (W.projCursor + i + 1) % MAX_PROJECTILES; break; }
  }
  if (!p) return;
  const speed = d.arc ? (owner.arcSpeed || d.speed) : d.speed;

function projectileTargetPos(t, out) {

  if (!talive(t)) return false;

}
const TMP_T = { x: 0, y: 0, z: 0 };
const STRUCT_SPARK_COLOR = [1, 0.8, 0.5];

function detonate(p, x, y, z, excludePlatform, excludeStruct) {
  const d = p.def;
  p.active = false;
  if (d.blast > 0) {
    const dmg = d.blastDmg !== undefined ? d.blastDmg : d.dmg;
    explode(x, y, z, d.blast, dmg, d.dtype, p.owner, { exclude: excludePlatform, excludeStruct, structMult: d.structMult });
  } else {

function updateProjectiles(dt) {
  const ps = W.projs, pl = W.platforms;
  for (let i = 0; i < ps.length; i++) {
    const p = ps[i];
    if (!p.active) continue;
    const d = p.def;
    p.age += dt; p.life -= dt;
    if (p.life <= 0) {
      if (d.blast > 0 && (d.prox || d.arc || d.kind === 'bomb')) detonate(p, p.x, p.y, p.z, null); else p.active = false;
      continue;
    }
    // acceleration for rockets
    if (d.accel && p.curSpeed < d.maxSpeed) {
      p.curSpeed = Math.min(d.maxSpeed, p.curSpeed + d.accel * dt);

        const dx = TMP_T.x - p.x, dy = TMP_T.y - p.y, dz = TMP_T.z - p.z, l = Math.hypot(dx, dy, dz) || 1;
        const s = Math.hypot(p.vx, p.vy, p.vz) || 1;

        const nx = dx / l, ny = dy / l, nz = dz / l;
        const dot = clamp(cx * nx + cy * ny + cz * nz, -1, 1);
        const ang = Math.acos(dot);
        const maxTurn = d.guide.turn * dt;

    }
    if (d.grav) p.vy -= d.grav * dt;
    // proximity fuse
    if (d.prox) {
      let fused = false;
      for (let k = 0; k < pl.length; k++) {
        const e = pl[k];
        if (e.dead || (e.team === p.team && !W.friendlyFire) || e === p.owner || e.team === 2) continue;
        const ey = e.y + (e.kind === 'air' ? 0 : e.height * 0.5);
        if (Math.hypot(e.x - p.x, ey - p.y, e.z - p.z) < d.prox + e.radius * 0.5) { fused = true; break; }

      if (fused) { detonate(p, p.x, p.y, p.z, null); continue; }
    }

    for (let s = 1; s <= steps; s++) {
      const t = len * s / steps;

    for (let k = 0; k < pl.length; k++) {
      const e = pl[k];

      if (e.team === p.team && !W.friendlyFire) continue;
      const ry = e.kind === 'air' ? e.radius : e.height * 0.5 + 0.4;
      const ecy = e.y + (e.kind === 'air' ? 0 : e.height * 0.5), er = (e.radius + 0.3 > ry ? e.radius + 0.3 : ry) + half;

      if (ht >= 0 && ht < bestT) { bestT = ht; kind = 'platform'; obj = e; }
    }
    if (kind === '') { p.x = x0 + mx; p.y = y0 + my; p.z = z0 + mz; continue; }
    const hx = x0 + ux * bestT, hy = y0 + uy * bestT, hz = z0 + uz * bestT;

      const dealt = obj.takeDamage(p.dmg, d.dtype, p.owner, p.vx, p.vz, { proj: p });
      if (p.owner === W.player && dealt > 0) W.stats.hits++;

      if (p.owner === W.player) W.stats.hits++;
      if (d.blast <= 0) Snd.play('hitStruct', hx, hy, hz, 0.6);
      fxSparks(hx, hy, hz, 4, STRUCT_SPARK_COLOR, 12);
      detonate(p, hx, hy, hz, null, obj);
    } else {
      if (d.blast <= 0) {
        for (let k = 0; k < 3; k++) FX.emit(hx, hy + 0.2, hz, rand(-2, 2), rand(1, 4), rand(-2, 2), 0.5, 0.8, 1.8, 0.55, 0.5, 0.42, 0.4, 2, 2, false);

}

function notify(pl, text) {
  if (pl === W.player) W.msgL(text);
  else if (pl.netPeer) Net.sendTo(pl.netPeer, { t: 'msg', text });
}
function updatePickups(dt) {
  if (!W.pickups.length) return;
  const list = [];
  if (W.player && !W.player.dead) list.push(W.player);
  if (Net.host) for (const pe of Net.peers) if (pe.p && !pe.p.dead) list.push(pe.p);
  for (const pl of list) {
    for (let i = W.pickups.length - 1; i >= 0; i--) {
      const k = W.pickups[i];
      const reach = pl.kind === 'air' ? 14 : pl.radius + 3.5;
      if (Math.hypot(k.x - pl.x, k.z - pl.z) > reach) continue;
      if (pl.kind === 'air' && pl.y - k.y > 28) continue;
      if (k.type === 'ammo') {
        ['primaryA', 'primaryB', 'secondary'].forEach((sl) => { const w = pl.wslots[sl]; if (w && w.def.kind !== 'beam') w.reserve = Math.min(w.def.reserve * 1.5, w.reserve + w.def.clip * 2); });
        notify(pl, 'AMMUNITION RESUPPLIED');
      } else if (k.type === 'repair') { pl.hp = Math.min(pl.maxHp, pl.hp + pl.maxHp * 0.3); pl.armor = Math.min(pl.maxArmor, pl.armor + pl.maxArmor * 0.4); notify(pl, 'HULL REPAIRED'); }
      else { pl.energy = pl.maxEnergy; pl.heat = 0; pl.overheated = false; notify(pl, 'ENERGY AND HEAT RESTORED'); }
      if (pl === W.player) { W.stats.pickups++; Snd.ui('pickup'); }
      W.pickups.splice(i, 1);
    }
  }
}

/* Field resupply at a supply pad using the interact action (also used for remote players). */
function tryResupply(pl) {
  if (!pl || pl.dead) return;
  if (Net.guest) { Net.pendEdge |= 2048; return; }
  let near = null;
  for (const pad of W.pads) {
    if (Math.hypot(pad.x - pl.x, pad.z - pl.z) < 22 && (pl.kind !== 'air' || pl.y - Terrain.h(pad.x, pad.z) < 40)) near = pad;
  }
  if (!near) { notify(pl, 'NO SUPPLY PAD IN RANGE'); return; }
  const ammoMult = W.mods.scarce ? SCARCE_AMMO : 1;
  if (!resupplyNeeded(pl, ammoMult)) { notify(pl, 'ALREADY FULLY SUPPLIED'); return; }
  if (W.mode !== 'training' && W.resupplies <= 0) { notify(pl, 'NO RESUPPLY CHARGES LEFT'); return; }
  if (pl.nextResupply && W.time < pl.nextResupply) { notify(pl, 'RESUPPLY COOLING DOWN'); return; }
  if (W.mode !== 'training') W.resupplies--;
  pl.nextResupply = W.time + 8;
  // top up to the deployment reserve, never below what pickups already gave
  GUN_SLOTS.forEach((sl) => { const w = pl.wslots[sl]; if (w) { w.clip = w.def.clip; w.reserve = Math.max(w.reserve, Math.round(w.def.reserve * ammoMult)); w.reloading = 0; } });
  pl.hp = Math.min(pl.maxHp, pl.hp + pl.maxHp * 0.5); pl.armor = pl.maxArmor; pl.energy = pl.maxEnergy; pl.heat = 0; pl.overheated = false;
  if (pl.util) pl.util.charges = Math.max(pl.util.charges, pl.util.def.charges || 0);
  if (pl === W.player) Snd.ui('repair');
  notify(pl, 'RESUPPLIED' + (W.mode !== 'training' ? ' (' + W.resupplies + ' LEFT)' : ''));
}

/* True when a pad visit would restore something (energy and heat recover on their own). */
function resupplyNeeded(pl, ammoMult) {
  for (const sl of GUN_SLOTS) {
    const w = pl.wslots[sl];
    if (w && w.def.kind !== 'beam' && (w.clip < w.def.clip || w.reserve < Math.round(w.def.reserve * ammoMult))) return true;
  }
  if (pl.util && pl.util.charges < (pl.util.def.charges || 0)) return true;
  return pl.hp < pl.maxHp || pl.armor < pl.maxArmor;
}

/* Player-facing alert about guided weapons chasing the platform. */
function incomingMissiles(pl) {
  let best = 1e9, count = 0;
  for (let i = 0; i < W.projs.length; i++) {
    const p = W.projs[i];
    if (p.active && p.target === pl) { count++; best = Math.min(best, Math.hypot(p.x - pl.x, p.y - pl.y, p.z - pl.z)); }
  }
  return { count, dist: best };
}


/* =====================================================================
   AI: perception -> decision (every ~0.3 s) -> execution (every tick).
   The AI only reads world state; it never reads player input.
   ===================================================================== */
const AI_PROFILE = {
  skirmisher: { min: 25, max: 120, strafe: 1, flank: 0.3, retreat: 0.2, on: [0.8, 1.6], off: [0.4, 1.0] },
  soldier: { min: 70, max: 190, strafe: 1, flank: 0.2, retreat: 0.25, on: [0.9, 1.8], off: [0.5, 1.2] },
  bruiser: { min: 90, max: 230, strafe: 0.6, flank: 0, retreat: 0.15, on: [1.2, 2.4], off: [0.5, 1.2] },
  sniper: { min: 160, max: 420, strafe: 0.3, flank: 0, retreat: 0.3, on: [0.2, 0.4], off: [1.5, 2.5] },
  flanker: { min: 20, max: 110, strafe: 1, flank: 1, retreat: 0.3, on: [0.6, 1.2], off: [0.4, 0.9] },
  boss: { min: 90, max: 220, strafe: 0.8, flank: 0.1, retreat: 0, on: [1.4, 2.6], off: [0.4, 0.9] },

const AI_SWITCH_DELAY = 2;         // minimum seconds between AI primary weapon swaps

const NIGHT_SIGHT = 0.75;          // AI sight multiplier at night

class AIController {

    this.think = Math.random() * 0.3; this.state = 'idle'; this.stateT = 0; this.strafeDir = randSign(); this.strafeT = 2;
    this.reactT = 0; this.burstOn = false; this.burstT = rand(0.2, 1); this.tele = 0; this.teleFor = 0;
    this.err = { x: 0, y: 0, z: 0 }; this.errGoal = { x: 0, y: 0, z: 0 }; this.errT = 0; this.aim = { x: 0, y: 0, z: 0 };
    this.losTarget = null; this.losClear = false; this.losAt = -1;

      case 'patrol': this.runPatrol(dt); return;
      case 'orbit': this.runOrbit(dt); return;

/* ---------- mission runtime ---------- */
class Mission {
  constructor(def, cfg) {
    this.def = def; this.cfg = cfg; this.objectives = []; this.events = []; this.time = 0; this.state = 'running'; this.endDelay = 0;

    this.cfgMods = cfg.mods || {};

  add(obj) { this.objectives.push(obj); return obj; }
