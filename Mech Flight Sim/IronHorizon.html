  every(interval, fn, startAt) { this.everyList.push({ interval, fn, next: startAt === undefined ? interval : startAt }); }
  get(id) { return this.objectives.find((o) => o.id === id); }
  update(dt) {
    if (this.state !== 'running') { this.endDelay -= dt; return; }
    this.time += dt;
    for (const e of this.events) if (!e.done && this.time >= e.t) { e.done = true; e.fn(this); }
    for (const e of this.everyList) if (this.time >= e.next) { e.next += e.interval; e.fn(this); }
    for (const o of this.objectives) {
      if (o.status === 'inactive' && o.deps.every((d) => { const x = this.get(d); return x && x.status === 'complete'; })) {
        o.status = 'active';
        if (this.time > 1) { W.msg('NEW OBJECTIVE: ' + o.title.toUpperCase()); Snd.ui('objective'); }
        if (o.onActivate) o.onActivate(this);
      }
      if (o.status === 'active') {
        const before = o.status;
        o.tick(1 / 60);
        if (before !== o.status) {
          Snd.ui(o.status === 'complete' ? 'objective' : 'warn');
          W.msg((o.status === 'complete' ? 'OBJECTIVE COMPLETE: ' : 'OBJECTIVE FAILED: ') + o.title.toUpperCase());
          if (o.onComplete && o.status === 'complete') o.onComplete(this);
        }
      }
    }
    if (this.def.update) this.def.update(this, dt);
    const prim = this.objectives.filter((o) => o.primary);
    if (prim.some((o) => o.status === 'failed')) return this.end(false, prim.find((o) => o.status === 'failed').title + ' failed');
    if (prim.length && prim.every((o) => o.status === 'complete')) return this.end(true, '');
    if (this.limit > 0 && this.time >= this.limit && !this.noTimeout) return this.end(false, 'Time expired');
    if (W.mode !== 'training' && Net.allDown()) return this.end(false, 'Platform lost with no reserves');
  }
  end(won, reason) {
    if (this.state !== 'running') return;
    this.objectives.forEach((o) => { if (!o.primary || o.status === 'active') o.finalize(); if (!o.primary && (o.status === 'active' || o.status === 'inactive')) o.status = 'missed'; });
    this.state = won ? 'won' : 'lost'; this.failReason = reason; this.endDelay = 2.2;

  rank() {
    if (this.state !== 'won') return 'F';

    const optDone = opt.length ? opt.filter((o) => o.status === 'complete').length / opt.length : 1;
    const deathPen = clamp(W.stats.deaths / Math.max(1, W.maxLives), 0, 1);
    const timeF = this.limit > 0 ? clamp(1 - this.time / this.limit, 0, 1) : 0.5;
    const pi = 50 + optDone * 20 + (1 - deathPen) * 15 + timeF * 15;
    return pi >= 90 ? 'S' : pi >= 76 ? 'A' : pi >= 62 ? 'B' : 'C';
  }
}

/* ---------- skirmish ---------- */
const SKIRMISH_SIZES = { small: { waves: 4, budget: 3 }, medium: { waves: 6, budget: 5 }, large: { waves: 9, budget: 7 } };
const SKIRMISH_DEFAULT = { map: 'ashfall', size: 'small', difficulty: 'veteran', duration: 10, platformId: 'bulwark', destruction: 'normal', support: 'light', reinforce: 'normal', fog: false, night: false, scarce: false, seed: 12345 };
function skirmishDef(cfg) {
  const sz = SKIRMISH_SIZES[cfg.size], rng = makeRng(cfg.seed);
  const start = { x: -560, z: -620, yaw: 0.8 };
  const types = ['infantry', 'buggy', 'rpgTrooper', 'tank', 'lightMech', 'medMech', 'heavyMech', 'jet', 'gunship'];
  const waves = [];
  for (let w = 0; w < sz.waves; w++) {
    let budget = sz.budget + w * 1.8;
    const list = [];
    const maxTier = Math.min(types.length, 2 + Math.floor(w * 0.9) + (cfg.size === 'large' ? 1 : 0));
    const unlocked = types.slice(0, maxTier);
    while (budget > 0) { // draw only from what the budget still affords, so one expensive roll does not end the wave early
      const affordable = unlocked.filter((t) => unitCost(t) <= budget);
      if (affordable.length === 0) break;
      const k = affordable[Math.floor(rng() * affordable.length)];
      list.push(k); budget -= unitCost(k);
    }
    waves.push({ list, ang: rng() * TAU });
  }
  const interval = { low: 80, normal: 55, high: 36 }[cfg.reinforce];
  return {
    id: 'skirmish', name: 'Skirmish', type: 'Skirmish', map: cfg.map, timeLimit: cfg.duration > 0 ? cfg.duration * 60 : 0, start,
    sites: [{ x: start.x, z: start.z, r: 34, tag: 'pad' }, { x: 80, z: 60, r: 70, tag: 'obj' }, { x: 400, z: -200, r: 60, tag: 'obj' }, { x: -300, z: 380, r: 60, tag: 'obj' }],
    build(ctx) {
      const m = ctx.m;
      const total = waves.reduce((a, w) => a + w.list.length, 0);
      const ob = m.add(Obj.kill({ id: 'all', title: 'Destroy all hostile forces', units: [], status: 'active',
        tick() { const alive = this.units.filter((u) => !u.dead).length; this.progress = this.spawnedAll ? 1 - alive / Math.max(1, this.units.length) : 0; if (this.spawnedAll && alive === 0) this.status = 'complete'; },
        text() { return this.title + ' (wave ' + Math.min(this.waveNo, waves.length) + '/' + waves.length + ', ' + this.units.filter((u) => !u.dead).length + ' hostile)'; }, waveNo: 0, spawnedAll: false }));
      void total;
      const supportList = { none: [], light: ['allyMech', 'allyTank'], heavy: ['allyMech', 'allyMech', 'allyTank', 'allyJet'] }[cfg.support];
      ctx.later(() => { if (supportList.length) spawnGroup(supportList, start.x + 30, start.z + 30, { team: 0, radius: 40, exact: true }); });
      let idx = 0;
      const spawnWave = () => {
        if (idx >= waves.length) return;
        const w = waves[idx], r = 700;
        const ang = w.ang;
        const cx = clamp(Math.cos(ang) * r + 100, -860, 860), cz = clamp(Math.sin(ang) * r + 100, -860, 860);
        const us = spawnGroup(w.list, cx, cz, { radius: 70, minPlayerDist: 220 });
        us.forEach((u) => { ob.units.push(u); if (u.ai && u.kind !== 'air') u.ai.goal = { x: W.player ? W.player.x : 0, z: W.player ? W.player.z : 0 }; });
        idx++; ob.waveNo = idx;
        W.msg('WAVE ' + idx + ' OF ' + waves.length + ' INBOUND'); Snd.ui('alarm');
        if (idx >= waves.length) ob.spawnedAll = true;
      };
      m.at(3, spawnWave);
      m.every(interval, () => spawnWave(), interval + 3);
      m.every(4, () => { // enemies without a target head for the player
        if (!W.player || W.player.dead) return;
        for (const p of W.platforms) if (p.team === 1 && p.ai && p.arch && p.ai.goal !== undefined && !p.ai.target && p.kind !== 'air') p.ai.goal = { x: W.player.x, z: W.player.z };
      }, 8);
      m.every(2, () => { // next wave early if the field is nearly clear
        const alive = ob.units.filter((u) => !u.dead).length;
        if (alive <= 1 && idx < waves.length && m.time > 20) spawnWave();
      }, 15);
      m.add(Obj.noDeaths({ id: 'nodeath', title: 'Complete without losing your platform' }));
    },
  };
}

const STEP = 1 / 60;

const PC = {
  sdx: 0, sdy: 0, axRoll: 0, axPitch: 0, padLast: false, padF2: false, padStart: false,
  /* Convert raw input into platform commands once per rendered frame. */
  sample(p, dt) {
    const c = p.cmd, pad = Input.pad();
    let dx = Input.mdx, dy = Input.mdy;
    if (!Input.locked) {                       // cursor-offset aiming when pointer lock is off or unavailable
      const f = (v) => (Math.abs(v) < 0.12 ? 0 : Math.sign(v) * (Math.abs(v) - 0.12) / 0.88);

    }
    if (pad) { dx += pad.rx * dt * 900 * S.sens; dy += pad.ry * dt * 700 * S.sens; }

      this.axPitch = clamp(this.axPitch * Math.exp(-3 * dt) - this.sdy * 0.011 * inv, -1, 1);

    } else {

      c.aimPitch = clamp(c.aimPitch - this.sdy * k * inv * (air ? 0.85 : 1), air ? -1.2 : -0.75, air ? 1.2 : 1.15);
    }
    // movement
    let f = (Input.held('moveForward') ? 1 : 0) - (Input.held('moveBack') ? 1 : 0);
    let s = (Input.held('moveRight') ? 1 : 0) - (Input.held('moveLeft') ? 1 : 0);
    if (pad) { f += -pad.ly; s += pad.lx; f = clamp(f, -1, 1); s = clamp(s, -1, 1); }
    if (air) { c.throttleIn = f; c.moveF = 0; c.moveS = s; c.turn = 0; }

    else { c.moveF = f; c.moveS = 0; c.turn = s; }

    c.jump = Input.held('jump') || !!(pad && pad.jump);

    if (p.kind !== 'mech') c.jump = false;
    c.fire1 = Input.held('fire1') || !!(pad && pad.fire1);
    c.fire2 = Input.held('fire2') || !!(pad && pad.fire2);
    if (Input.hit('fire1') || (pad && pad.fire1 && !this.padLast)) c.fire1Edge = true;
    if (Input.hit('fire2') || (pad && pad.fire2 && !this.padF2)) c.fire2Edge = true;
    if (pad) { this.padLast = pad.fire1; this.padF2 = pad.fire2; }
    if (Input.hit('defense') || (pad && pad.defense && !this.padD)) c.defenseEdge = true;
    if (pad) this.padD = pad.defense;
    if (Input.hit('melee') || (pad && pad.melee && !this.padM)) c.meleeEdge = true;
    if (pad) this.padM = pad.melee;
    if (Input.hit('stance')) { c.stanceEdge = true; }
    if (Input.hit('reload')) c.reloadEdge = true;
    if (Input.hit('gear')) c.gearEdge = true;
    if (Input.hit('eject')) c.ejectEdge = true;
    if (Input.hit('weapon1')) c.sel1 = true;
    if (Input.hit('weapon2')) c.sel2 = true;
    if (Input.wheel !== 0) c.selNext = true;
    if (Input.hit('cycleTarget') || (pad && pad.cycle && !this.padC)) p.cycleTarget();
    if (pad) this.padC = pad.cycle;
    if (Input.hit('interact')) tryResupply(p);
    if (Input.hit('switchPlatform') && W.mode === 'training') Game.trainingSwitch();

  /* Gamepad Start toggles the pause menu; polled every frame because sample() stops while paused. */
  pollPause() {
    const pad = Input.pad(), start = !!(pad && pad.start), edge = start && !this.padStart;
    this.padStart = start;

    const paused = Game.state === 'paused' || Game.netPaused;

const Cam = {

  update(dt) {

    } else {

      const dx = Math.sin(yaw) * cp, dy = Math.sin(pitch), dz = Math.cos(yaw) * cp;
      const mech = p.kind === 'mech';
      const px = p.x, py = p.y + p.height * (mech ? 0.9 : 1.3) - (p.crouch ? p.height * 0.2 : 0), pz = p.z;
      const inf = p.def.style === 'infantry';
      const dist = (inf ? 3.4 + p.height * 1.1 : mech ? 12 + p.height * 0.95 : 13 + p.radius * 2.4) * introK;
      const side = inf ? 0.55 : mech ? 2.2 + p.radius * 0.4 : 1.6 + p.radius * 0.3;
      const rx = -Math.cos(yaw), rz = Math.sin(yaw);
      ex = px - dx * dist + rx * side; ey = py - dy * dist + (inf ? 0.25 : 2.5) + p.height * 0.15; ez = pz - dz * dist + rz * side;
      const vx = ex - px, vy = ey - py, vz = ez - pz, vl = Math.hypot(vx, vy, vz);
      const r = raycast(px, py, pz, vx / vl, vy / vl, vz / vl, vl, p, true);
      if (r.hit && r.t < vl) { const k = Math.max(2, r.t - 1.2) / vl; ex = px + vx * k; ey = py + vy * k; ez = pz + vz * k; }
      ey = Math.max(ey, Terrain.h(ex, ez) + (inf ? 0.8 : 1.8));
      tx = ex + dx * 60; ty = ey + dy * 60; tz = ez + dz * 60;
      this.dx = dx; this.dy = dy; this.dz = dz;
      this.lastX = p.x; this.lastY = p.y; this.lastZ = p.z;
    }
    const amt = W.shake * W.shake * (S.reducedMotion ? 0.1 : 1);

    W.camPos.x = ex; W.camPos.y = ey; W.camPos.z = ez;
    Snd.setListener(ex, ey, ez, Math.atan2(tx - ex, tz - ez));
  },
  /* aim ray from the camera, used by the player's weapons and the reticle */
  aimRay() {
    const p = W.player;
    if (!p || p.dead) return;

    const dx = this.dx / l, dy = this.dy / l, dz = this.dz / l;

  },

/* =====================================================================
   GAME
   ===================================================================== */
const Game = {
  state: 'boot', cfg: null, mission: null, accum: 0, last: 0, respawnT: 0, protectT: 0, fps: 60, frameMs: 16, lowFpsT: 0, errors: [], errBurst: 0, errBurstT: 0,
  menuTimer: 0, trainingHelp: false, tutorial: null, resultData: null, frames: 0, fpsAcc: 0, fpsN: 0, started: false, ctxLost: false,

  /* ----- session construction ----- */
  buildDef(cfg) {
    if (cfg.mode === 'mission') return MISSION_BY_ID[cfg.missionId];
    if (cfg.mode === 'skirmish') return skirmishDef(cfg.skirmish);
    return TRAINING_DEF;
  },
  startSession(cfg, guest) {
    const def = this.buildDef(cfg);
    if (!def) { UI.toast('Unknown mission'); return false; }
    this.cfg = cfg;
    Snd.engineStop();
    const sk = cfg.skirmish;
    const mods = sk ? { fog: sk.fog, night: sk.night, scarce: sk.scarce } : {};
    const destr = sk ? { low: [0.5, 1.5, 1.2], normal: [1, 1, 1], high: [1.5, 0.8, 1.3] }[sk.destruction] : [1, 1, 1];
    let seed = 7;
    for (let i = 0; i < def.id.length; i++) seed = (seed * 31 + def.id.charCodeAt(i)) >>> 0;
    if (sk) seed = sk.seed;
    newWorld({ map: def.map, mode: cfg.mode, sites: def.sites.concat(Scenery.sitesFor(def.map)), difficulty: cfg.difficulty || S.difficulty, mods, structHp: destr[1], structDamage: destr[2], seed, start: def.start });
    const st = def.start;
    W.pads = [{ x: st.x + 20, z: st.z + 4 }];
    W.mission = this.mission = new Mission(def, cfg);
    W.mission.noTimeout = cfg.mode === 'training';
    W.maxLives = cfg.mode === 'training' ? 999 : 3; W.lives = W.maxLives; W.resupplies = 2;
    W.mods = mods;
    const ctx = makeCtx(this.mission, cfg);
    def.build(ctx);
    populateWorld({ seed, destruction: destr[0], start: st, corridors: def.corridors, scenery: () => Scenery.build(def.map, seed), sceneryKeep: Scenery.keepOutFor(def.map), keepOut: def.sites.filter((s) => s.tag === 'obj').map((s) => ({ x: s.x, z: s.z, r: s.r * 0.45 })) });
    W.coopMult = cfg.coop ? 1 + 0.5 * ((cfg.nPlayers || 1) - 1) : 1;
    W.bossHpMult = cfg.coop ? 1 + COOP_BOSS_HP * ((cfg.nPlayers || 1) - 1) : 1;   // a single boss cannot be multiplied, so it gets tougher
    if (guest) { this.mission.objectives = []; W.player = null; this.mission.later = []; }
    else {
      this.spawnPlayer();
      if (cfg.coop && Net.host) Net.sessionBegin();
      if (cfg.mode !== 'training') this.mission.later.push(() => Scenery.garrison(def.map));
      this.mission.later.forEach((fn) => fn());
    }
    W.stats.score = 0;
    if (W.player) Cam.reset(W.player);
    this.accum = 0; this.respawnT = 0;
    Input.playing = true; Input.clearAll();
    this.state = 'playing';
    if (W.player) this.setTutorial(); else this.tutorial = null;
    R.fovKick = 0;
    UI.fade(0);
    UI.hideAll();
    Snd.musicStart('combat');
    W.msg(def.name.toUpperCase() + ' - DEPLOYED');
    return true;
  },
  spawnPlayer(atPos) {
    const cfg = this.cfg, def = PLATFORMS[cfg.platformId], st = this.mission.def.start;
    const lo = Object.assign({}, cfg.loadout);
    const old = W.player;
    const x = atPos ? atPos.x : st.x, z = atPos ? atPos.z : st.z;
    const p = new Platform(def, { team: 0, x, z, yaw: st.yaw, loadout: lo, name: 'YOU', ammoMult: W.mods.scarce ? SCARCE_AMMO : 1, y: def.kind === 'air' ? Terrain.h(x, z) + 160 : undefined });
    p.controller = PC; p.cmd.aimYaw = st.yaw; p.flightMode = S.flightMode;
    p.invuln = true; this.protectT = 3;
    if (old) { p.stats = old.stats; }
    W.player = p;
    W.platforms = W.platforms.filter((q) => q !== old);
    W.platforms.push(p);
    p.noTarget = false;
    // keep a ground spawn point clear of structures
    if (def.kind !== 'air' && groundBlocked(p.x, p.z, p.radius + 1)) {
      const sp = findSpawn(x, z, 40, p.radius, 0);
      if (sp) { p.x = sp.x; p.z = sp.z; p.y = Terrain.h(sp.x, sp.z); }
    }
    Cam.reset(p);
  },
  trainingSwitch() {
    const cfg = this.cfg, idx = PLAYABLE.indexOf(cfg.platformId);
    const next = PLAYABLE[(idx + 1) % PLAYABLE.length];
    cfg.platformId = next; cfg.loadout = Loadout.forPlatform(next);
    const p = W.player;
    const pos = p && !p.dead ? { x: p.x, z: p.z } : null;
    W.player.dead = true;
    this.spawnPlayer(pos);
    this.protectT = 0.5;
    W.msg('PLATFORM: ' + PLATFORMS[next].name.toUpperCase());
    Snd.ui('ok');
    this.setTutorial();
  },
  restart() {
    Snd.ui('click');
    if (Net.host && this.cfg && this.cfg.coop) { this.netPaused = false; Net.startCoop(); Input.requestLock(); return; }
    this.startSession(this.cfg);
    Input.requestLock();
  },
  quitToMenu() {
    this.netPaused = false;
    if (Net.active) Net.leave();
    Input.playing = false; Input.releaseLock(); Snd.engineStop(); Snd.musicStart('menu');
    this.enterMenuWorld();
    this.state = 'menu';
    UI.stack = []; UI.cur = null; Input.capture = null; UI.rebind = null;
    UI.show('main');
  },
  enterMenuWorld() {
    newWorld({ map: 'ashfall', mode: 'menu', sites: [{ x: 0, z: 0, r: 80, tag: 'obj' }], difficulty: 'veteran', seed: 99, start: { x: 600, z: 600, yaw: 0 } });
    W.mission = null; W.lives = 99;
    populateWorld({ seed: 99, destruction: 1, start: { x: 600, z: 600, yaw: 0 } });
    const mk = (id, x, z, team, yaw) => { const d = PLATFORMS[id]; const p = new Platform(d, { team, x, z, yaw, loadout: d.loadout }); W.platforms.push(p); return p; };
    mk('bulwark', 0, 0, 0, 0.6); mk('colossus', 40, 18, 0, 0.9); mk('bastion', -35, 25, 0, 0.3); mk('wraith', 18, -30, 0, 1.1);
    const jet = mk('kestrel', 0, 200, 0, 0); jet.ai = new AIController(jet, 'orbit', W.diff); jet.ai.orbitC = { x: 0, z: 0 }; jet.controller = jet.ai;
    const j2 = mk('shrike', 100, -150, 0, 2); j2.ai = new AIController(j2, 'orbit', W.diff); j2.ai.orbitC = { x: 0, z: 0 }; j2.controller = j2.ai;
    Cam.orbit = 0; Cam.lastX = 0; Cam.lastY = 12; Cam.lastZ = 0;
    W.player = null;
  },
  setTutorial() {
    if (S.tutorialSeen || this.cfg.mode === 'skirmish' && false) { this.tutorial = null; return; }
    const p = W.player, kind = p.kind;
    const k = (a) => keyLabel(Input.code(a));
    const steps = [];
    if (kind === 'air') {
      steps.push({ text: 'Move the MOUSE to steer; the plane follows your cursor. ' + k('moveForward') + '/' + k('moveBack') + ' = throttle', test: () => Math.abs(p.cmd.aimYaw - p.yaw) > 0.4 || p.cmd.throttleIn !== 0 });
      steps.push({ text: 'Hold ' + k('fire1') + ' to fire guns, ' + k('fire2') + ' for missiles/bombs. ' + k('boost') + ' = afterburner', test: () => p.cmd.fire1 || p.cmd.fire2 });
      steps.push({ text: k('cycleTarget') + ' selects a target; keep it in the lock cone to lock missiles', test: () => !!p.target });
      steps.push({ text: k('defense') + ' drops flares against missiles. ' + k('gear') + ' = landing gear, ' + k('eject') + ' twice = eject', test: () => p.cmd.defenseEdge });
    } else {
      steps.push({ text: 'Move with ' + k('moveForward') + k('moveLeft') + k('moveBack') + k('moveRight') + (kind === 'ground' ? ' (A/D steer the vehicle)' : '') + ', aim with the MOUSE', test: () => Math.abs(p.cmd.moveF) + Math.abs(p.cmd.moveS) + Math.abs(p.cmd.turn) > 0 });
      steps.push({ text: 'Hold ' + k('fire1') + ' to fire your primary. ' + k('fire2') + ' fires the secondary. ' + k('weapon1') + '/' + k('weapon2') + ' switch primaries', test: () => p.cmd.fire1 || p.cmd.fire2 });
      steps.push({ text: k('cycleTarget') + ' cycles targets. Watch the heat bar: overheating locks your weapons', test: () => !!p.target });
      steps.push({ text: k('defense') + ' uses your defense system. ' + (kind === 'mech' ? k('jump') + ' = jump jets, ' + k('melee') + ' = melee' : k('jump') + ' = handbrake') + ', ' + k('boost') + ' = boost', test: () => p.cmd.defenseEdge || p.cmd.jump || p.cmd.boost });
    }
    this.tutorial = { steps, i: 0, t: 0, done: false };
  },

  /* ----- pause / resume ----- */
  pause() {
    if (this.state !== 'playing' || this.netPaused) return;
    if (Net.active && Net.inSession) { // the shared world keeps running; only this player's controls pause
      this.netPaused = true; Input.playing = false; Input.releaseLock(); Input.clearAll();
      UI.show('pause');
      return;
    }
    this.state = 'paused';
    Input.playing = false; Input.releaseLock(); Input.clearAll();
    Snd.engineStop(); Snd.suspend();
    UI.show('pause');
  },
  resume() {
    if (this.netPaused) {
      this.netPaused = false; Input.playing = true; Input.clearAll(); UI.hideAll(); Input.requestLock();
      return;
    }
    if (this.state !== 'paused') return;
    this.state = 'playing';
    Input.playing = true; Input.clearAll(); this.accum = 0; this.last = performance.now();
    Snd.resume();
    UI.hideAll();
    Input.requestLock();
  },

  /* ----- one fixed simulation step ----- */
  tick(dt) {
    const cfg = this.cfg;
    const m = this.mission, pl = W.player;
    // controllers (AI) fill commands; the player's were filled per frame
    for (let i = 0; i < W.platforms.length; i++) { const p = W.platforms[i]; if (p.ai && !p.dead) p.ai.update(dt); }
    for (let i = 0; i < W.platforms.length; i++) W.platforms[i].update(dt);
    resolvePairs(dt);
    updateProjectiles(dt);
    updatePickups(dt);
    updateWorldEffects(dt);
    for (let i = W.dmgDirs.length - 1; i >= 0; i--) { W.dmgDirs[i].t -= dt; if (W.dmgDirs[i].t <= 0) W.dmgDirs.splice(i, 1); }
    // remove destroyed platforms (the player object is kept for the camera)
    let removed = false;
    for (let i = W.platforms.length - 1; i >= 0; i--) if (W.platforms[i].dead) { W.platforms.splice(i, 1); removed = true; }
    void removed;
    if (m) m.update(dt);
    if (Net.host) Net.hostTick(dt);
    if (cfg && cfg.mode === 'training' && this.frames % 20 === 0) respawnTrainingTargets();
    // player lifecycle
    if (pl && pl.dead && this.state === 'playing') {
      if (!pl.deathHandled) {
        pl.deathHandled = true; W.lives--;
        if (!pl.withdrew) W.stats.deaths++;
        this.respawnT = pl.withdrew ? EJECT_RESPAWN : RESPAWN_TIME;
        if (cfg.mode === 'training') this.respawnT = 1.5;
        if (W.lives <= 0 && cfg.mode !== 'training') this.respawnT = 999;
      }
      this.respawnT -= dt;
      if (this.respawnT <= 0 && W.lives > 0) this.spawnPlayer({ x: pl.kind === 'air' ? this.mission.def.start.x : this.mission.def.start.x, z: this.mission.def.start.z });
    }
    if (this.protectT > 0) { this.protectT -= dt; if (this.protectT <= 0 && W.player) W.player.invuln = false; }
    if (m && m.state !== 'running' && m.endDelay <= 0 && this.state === 'playing') this.showResults();
    // training helpers
    if (cfg && cfg.mode === 'training' && pl && !pl.dead) {
      if (W.infiniteAmmo) { pl.energy = pl.maxEnergy; pl.heat = 0; }
    }
    // music intensity from nearby hostiles
    if (this.frames % 30 === 0 && pl && !pl.dead) {
      let near = 0;
      for (const e of W.platforms) if (e.team === 1 && Math.hypot(e.x - pl.x, e.z - pl.z) < 300) near++;
      Snd.intensity = Math.min(1, near / 6);
    }
  },
  showResults() {
    const m = this.mission;
    this.state = 'results';
    Input.playing = false; Input.releaseLock(); Snd.engineStop();
    const st = W.stats;
    const shots = Math.max(1, st.shots);
    this.resultData = {
      won: m.state === 'won', reason: m.failReason, rank: m.rank(), time: m.time, name: m.def.name, type: m.def.type, id: m.def.id, mode: this.cfg.mode,
      objectives: m.objectives.map((o) => ({ title: o.title, primary: o.primary, status: o.status })),
      stats: { kills: st.kills, accuracy: Math.min(100, Math.round(st.hits / shots * 100)), dealt: Math.round(st.damageDealt), taken: Math.round(st.damageTaken), deaths: st.deaths, structures: st.structures, score: st.score },
    };
    if (this.cfg.mode === 'mission' && m.state === 'won') {
      const prev = Save.data.best[m.def.id];
      const score = Math.round(st.score + (m.limit ? Math.max(0, m.limit - m.time) : 0) + st.kills * 10);
      if (!prev || score > prev.score) { Save.data.best[m.def.id] = { score, rank: this.resultData.rank, time: Math.round(m.time) }; Save.persist(); }
      this.resultData.score = score;
    }
    UI.show('results');
    if (Net.host) Net.sendEnd(this.resultData);
  },
  showResultsGuest(r) {
    this.state = 'results'; this.netPaused = false; this.resultData = r;
    Input.playing = false; Input.releaseLock(); Snd.engineStop();
    UI.show('results');
  },

  /* ----- per-frame ----- */
  frame(now) {
    requestAnimationFrame((t) => Game.frame(t));
    try {
      this.frameInner(now);
      this.errBurst = Math.max(0, this.errBurst - 0.02);
    } catch (e) {
      this.reportError(e);
    }
  },
  frameInner(now) {
    if (!this.last) this.last = now;
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (!(dt > 0)) return;
    dt = Math.min(dt, 0.1);
    this.frames++;
    this.frameMs = lerp(this.frameMs, dt * 1000, 0.05);
    this.fpsAcc += dt; this.fpsN++;
    if (this.fpsAcc >= 0.5) { this.fps = this.fpsN / this.fpsAcc; this.fpsAcc = 0; this.fpsN = 0; this.adaptQuality(); this.updateDiag(); }
    if (R.lost || !R.ok) return;
    UI.resizeIfNeeded();
    PC.pollPause();
    if (this.state === 'playing') {
      const pl = W.player;
      if (pl && !pl.dead) { if (this.netPaused) { const c = pl.cmd; c.moveF = c.moveS = c.turn = c.throttleIn = 0; c.fire1 = c.fire2 = c.boost = c.jump = c.brake = false; } else PC.sample(pl, dt); }
      if (Net.guest) Net.guestTick(dt);
      else {
        this.accum += dt;
        let steps = 0;
        while (this.accum >= STEP && steps < 5) { this.tick(STEP); this.accum -= STEP; steps++; }
        if (steps === 5) this.accum = 0;
      }
      Cam.update(dt);
      Cam.aimRay();
      const p = W.player;
      if (p && !p.dead) {
        Snd.engineUpdate(p.kind, p.kind === 'air' ? p.throttle : clamp(p.speed / Math.max(1, p.def.speed), 0, 1.4), p.boosting || p.afterburner);
        this.updateWarnings(p);
      } else Snd.engineStop();
      this.tutorialUpdate(dt);
    } else if (this.state === 'results' || this.state === 'menu' || this.state === 'paused') {
      if (Net.guest && this.state === 'results') Net.guestTick(dt);
      else if (this.state !== 'paused') {
        // keep the background alive
        const sub = Math.min(dt, 0.05);
        for (let i = 0; i < W.platforms.length; i++) { const q = W.platforms[i]; if (q.ai && !q.dead) q.ai.update(sub); }
        for (let i = 0; i < W.platforms.length; i++) W.platforms[i].update(sub);
        updateProjectiles(sub); updateWorldEffects(sub);
      }
      if (this.state === 'menu') { Cam.orbit += dt * 0.12; Cam.lastX = 0; Cam.lastY = 14; Cam.lastZ = 0; Cam.menuUpdate(dt); }
      else Cam.update(dt);
    }
    if (W) this.render(dt);
    Input.endFrame();
  },
  render(dt) {
    R.beginFrame(Cam, Cam.fov);
    drawWorld(dt);
    HUD.draw(dt);
  },
  updateWarnings(p) {
    const inc = Net.guest ? (p.netInc || { count: 0, dist: 0 }) : incomingMissiles(p);
    p.warnIncoming = inc;
    if (inc.count > 0 && this.frames % 40 === 0) Snd.ui('alarm');
    else if (p.beingLocked > 0 && this.frames % 50 === 0) Snd.ui('lock');
    if (p.kind === 'air' && !p.grounded && p.y - Terrain.h(p.x, p.z) < 60 && p.vy < -8 && this.frames % 30 === 0) Snd.ui('warn');
    if (p.hp < p.maxHp * 0.25 && this.frames % 60 === 0) Snd.ui('warn');
  },
  tutorialUpdate(dt) {
    const t = this.tutorial;
    if (!t || t.done) return;
    t.t += dt;
    const s = t.steps[t.i];
    if (t.t > 2 && (s.test() || t.t > 14)) { t.i++; t.t = 0; if (t.i >= t.steps.length) { t.done = true; S.tutorialSeen = true; Save.persist(); } }
  },

  /* ----- robustness ----- */
  reportError(e) {
    const msg = (e && e.message) ? e.message : String(e);
    this.errors.push(new Date().toLocaleTimeString() + ' ' + msg);
    if (this.errors.length > 20) this.errors.shift();
    this.errBurst += 1;
    if (typeof console !== 'undefined') console.error(e);
    if (this.errBurst > 25) { this.fatal('The game hit repeated errors and cannot continue this session.', msg); this.errBurst = 0; }
    else UI.toast('Recovered from an error (F10 for details)');
  },
  fatal(text, detail) {
    this.state = 'menu'; Input.playing = false; Input.releaseLock();
    el('fatalTitle').textContent = 'Something went wrong';
    el('fatalText').textContent = text + (detail ? ' [' + detail + ']' : '');
    el('fatal').style.display = 'flex';
    const b = el('fatalBtn'); b.style.display = 'inline-block';
    b.onclick = () => { el('fatal').style.display = 'none'; try { Game.quitToMenu(); } catch (e) { location.reload(); } };
  },
  adaptQuality() {
    if (this.state !== 'playing') { this.lowFpsT = 0; return; }
    if (this.fps < 26) this.lowFpsT += 0.5; else this.lowFpsT = Math.max(0, this.lowFpsT - 0.25);
    if (this.lowFpsT >= 4 && (R.scaleCap || 1) > 0.5) {
      R.scaleCap = Math.max(0.5, (R.scaleCap || QUALITY[S.quality].scale) - 0.1);
      this.lowFpsT = 0; UI.needResize = true;
      UI.toast('Lowering render resolution to keep the game smooth');
    }
  },
  updateDiag() {
    const d = el('diag');

/* =====================================================================
   UI: menus, hangar, controls, settings, pause, results

const UI = {

  init() {

    this.root.addEventListener('change', (e) => this.onInput(e, true));

  fade(v) { el('fade').style.opacity = v; },
  fadeNow(v) { const f = el('fade'); f.style.transition = 'none'; f.style.opacity = v; void f.offsetWidth; f.style.transition = 'opacity .6s'; },
  toast(msg) {

  },
  resizeIfNeeded() {

    HUD.resize(w, h, Math.min(window.devicePixelRatio || 1, 2));
  },
  applySettings() {
    document.documentElement.style.setProperty('--ui', S.uiScale);
    Snd.applyVolumes();
    this.needResize = true;
  },
  hideAll() { this.root.style.display = 'none'; this.root.innerHTML = ''; this.cur = null; this.stack = []; },
  visible() { return this.root.style.display === 'block'; },

  /* ---- navigation ---- */
  show(name, data, replace) {
    if (!replace && this.cur && this.cur.name !== name) this.stack.push(this.cur);

  },
  back() {
    const prev = this.stack.pop();

  escape() {

  },
  render() {
    const c = this.cur;

    const scroll = old ? old.scrollTop : 0;
    const fn = this['scr_' + c.name];
    if (!fn) { this.root.innerHTML = '<div class="screen on"><p>Missing screen ' + esc(c.name) + '</p></div>'; this.root.style.display = 'block'; return; }
    const cls = c.name === 'pause' || c.name === 'confirm' ? 'clear' : (c.name === 'boot' || c.name === 'main') ? 'menuBg' : '';
    this.root.innerHTML = '<section class="screen on ' + cls + '" data-capture="1"><div class="wrap">' + fn.call(this, c.data) + '</div></section>';
    this.root.style.display = 'block';
    const sc = this.root.querySelector('.screen');

  act_tutorialReset() { S.tutorialSeen = false; Save.persist(); this.toast('Tutorial hints will show next deployment'); },

    const other = Object.keys(b).find((k) => b[k] === code && k !== rb.action);
    if (other) {
      if (rb.pending && rb.pending.code === code) { // second press confirms the swap
        b[other] = b[rb.action]; b[rb.action] = code;
      } else {
        rb.pending = { code, other };
        rb.msg = '"' + keyLabel(code) + '" is already used by "' + (ACTIONS.find((a) => a[0] === other) || [0, other])[1] + '". Press it again to swap, or choose another key (Esc cancels).';
        this.render(); return;
      }
    } else b[rb.action] = code;
    Input.setBindings(b); Save.persist();
    Input.capture = null; this.rebind = null;
    this.render();
    this.toast('Bound to ' + keyLabel(code));
  },
  onInput(e, commit) {
    const t = e.target;
    if (t.dataset && t.dataset.coop) { this.onCoopInput(t, commit); return; }
    const key = t.dataset && t.dataset.set;
    if (!key) {
      if (t.dataset && t.dataset.skirm) { this.skirmish[t.dataset.skirm] = t.type === 'checkbox' ? t.checked : (t.dataset.num ? Number(t.value) : t.value); if (commit) { this.cur.keepScroll = true; this.render(); } }
      if (t.dataset && t.dataset.slot) { this.hg.loadout[t.dataset.slot] = t.value || null; this.cur.keepScroll = true; this.render(); }
      if (t.dataset && t.dataset.diff) { S.difficulty = t.value; Save.persist(); }
      return;
    }
    const sc = SETTING_SCHEMA[key];
    if (!sc) return;
    let v;
    if (sc[0] === 'num') v = clamp(Number(t.value), sc[1], sc[2]);
    else if (sc[0] === 'bool') v = !!t.checked;
    else v = t.value;
    S[key] = v;
    if (key === 'quality') { R.scaleCap = 1; FX.budget = QUALITY[S.quality].particles; }
    this.applySettings();
    const lab = t.parentNode.querySelector('.val'); if (lab) lab.textContent = sc[0] === 'num' ? Number(v).toFixed(2) : '';
    if (commit) Save.persist();
  },

      th: r2(p.throttle), g: p.gear ? 1 : 0, gr: p.grounded ? 1 : 0, ab: p.afterburner ? 1 : 0, stl: p.stalled ? 1 : 0, wn: p.warn || '', bl: r2(p.beingLocked),
      inc: [inc.count, inc.count ? Math.round(inc.dist) : 0], cr: p.crouch ? 1 : 0, rf: p.radarFocus ? 1 : 0, abk: p.airbrake ? 1 : 0, lv: peer.lives, rs: 0,
      k: [p.stats.kills, W.stats.score, peer.deaths || 0], tp: p.target ? 1 : 0, ej: 0,
    };
  },
  sendSnapshots() {
    const plats = [];
    for (const p of W.platforms) if (!p.dead && plats.length < 44) plats.push(this.platEntry(p));
    const prs = [];
    for (const q of W.projs) if (q.active && prs.length < 70) prs.push([q.nid, WEAPON_IDS.indexOf(q.def.id || ''), r1(q.x), r1(q.y), r1(q.z), r1(q.vx), r1(q.vy), r1(q.vz), q.owner ? q.owner.id : 0]);
    const pk = W.pickups.map((k) => [k.type, r1(k.x), r1(k.z)]);
    const base = { t: 's', q: ++this.seq, p: plats, pr: prs, pk };
    for (const peer of this.peers) {
      if (!peer.open || !peer.hello) continue;
      for (const p of W.platforms) {
        if (p.dead || peer.known.has(p.id)) continue;
        peer.known.add(p.id);
        this.send(peer, { t: 'sp', id: p.id, d: p.def.id, team: p.team, name: p.name, arch: p.arch || '', lo: p.loadout, x: r1(p.x), y: r1(p.y), z: r1(p.z), yaw: r2(p.yaw), self: p === peer.p ? 1 : 0, pl: p.isPlayer ? 1 : 0 });
      }
      base.me = this.selfState(peer);
      this.send(peer, base, false);
    }
  },
  sendObjectives() {
    const m = Game.mission;
    if (!m) return;
    const o = m.objectives.map((x) => [x.id, x.title, x.primary ? 1 : 0, x.status, r2(x.progress), x.text(), x.status === 'active' ? x.markers().slice(0, 8).map((k) => [r1(k.x), r1(k.y), r1(k.z), k.label, k.kind]) : []]);
    this.bcast({ t: 'ob', T: r1(m.time), L: m.limit, st: m.state, why: m.failReason, o });
  },
  /* the host announces the end so guests show the same result screen */
  sendEnd(result) { this.bcast({ t: 'end', r: result }); },

  /* ---------- guest: building the mirrored world and applying updates ---------- */
  guestStart(m) {
    if (!m.cfg || !MISSION_BY_ID[m.cfg.missionId]) { this.leave('Unknown mission from host'); return; }
    this.inSession = true; this.map = {}; this.projMap = {}; this.lastSnapSeq = 0; this.inAcc = 0; this.beatAcc = 0; this.t = 0;
    Game.cfg = null;
    if (!Game.startSession(m.cfg, true)) { this.leave('Could not start the mission'); return; }
    if (W.structs.length !== m.ns) this.leave('World mismatch with host (' + W.structs.length + ' vs ' + m.ns + ')');
  },
  applySpawn(m) {
    if (!W || !PLATFORMS[m.d]) return;
    if (this.map[m.id]) return;
    const def = PLATFORMS[m.d];
    const lo = {};
    WEAPON_SLOTS.forEach((s) => { lo[s] = m.lo && typeof m.lo[s] === 'string' && WEAPONS[m.lo[s]] ? m.lo[s] : null; });
    const p = new Platform(def, { team: numIn(m.team, 0, 2), x: m.x, z: m.z, yaw: m.yaw, y: m.y, loadout: lo, name: String(m.name).substring(0, 16), arch: m.arch || null });
    p.id = m.id; p.isPlayer = !!m.pl; p.y = m.y; p.nx = m.x; p.ny = m.y; p.nz = m.z; p.nyaw = m.yaw; p.npitch = 0; p.nroll = 0; p.nty = m.yaw; p.ntp = 0;
    p.netInit = true; p.seen = this.t; p.speedMult = 1;
    this.map[m.id] = p;
    W.platforms.push(p);
    if (m.self) {
      p.name = 'YOU'; p.controller = PC; p.cmd.aimYaw = m.yaw; p.flightMode = S.flightMode;
      W.player = p; Cam.reset(p);
    }
  },
  applySnapshot(m) {
    if (!W || !Array.isArray(m.p) || m.q <= this.lastSnapSeq) return;
    this.lastSnapSeq = m.q;
    for (const e of m.p) {
      const p = this.map[e[0]];
      if (!p) continue;
      p.nx = e[1]; p.ny = e[2]; p.nz = e[3]; p.nyaw = e[4]; p.npitch = e[5]; p.nroll = e[6]; p.nty = e[7]; p.ntp = e[8];
      const frac = e[9];
      if (frac < p.hp / p.maxHp - 0.001) p.hitFlash = 0.15;
      p.hp = frac * p.maxHp; p.speed = e[10]; p.seen = this.t;
      const f = e[11] | 0;
      p.shieldOn = !!(f & 1); p.jetting = !!(f & 2); p.afterburner = !!(f & 4); p.gear = !!(f & 8); p.crouch = !!(f & 16); p.boosting = !!(f & 32);
      p.telegraph = (f & 64) ? 0.3 : 0; p.grounded = !!(f & 128); p.meleeT = (f & 256) ? 0.2 : 0; p.activeSlot = (f & 512) ? 'primaryB' : 'primaryA';
      if (p.shieldOn && p.maxShield > 0) p.shield = p.maxShield * 0.6;
    }
    // projectiles
    const next = {};
    for (const e of m.pr || []) {
      let pr = this.projMap[e[0]];
      if (!pr || !pr.active || pr.nid !== e[0]) {
        pr = null;
        for (let i = 0; i < W.projs.length; i++) if (!W.projs[i].active) { pr = W.projs[i]; break; }
        if (!pr) continue;
        const wd = WEAPONS[WEAPON_IDS[e[1]]];
        if (!wd) continue;
        pr.active = true; pr.nid = e[0]; pr.def = wd; pr.owner = this.map[e[8]] || null;
        Snd.play(wd.sound, e[2], e[3], e[4], 0.8);
        if (pr.owner) pr.owner.recoil = 1;
      }
      pr.x = e[2]; pr.y = e[3]; pr.z = e[4]; pr.vx = e[5]; pr.vy = e[6]; pr.vz = e[7]; pr.seen = this.t;
      next[e[0]] = pr;
    }
    this.projMap = next;
    W.pickups = (m.pk || []).map((k) => ({ type: PICKUP_TYPES[k[0]] ? k[0] : 'ammo', x: k[1], z: k[2], y: Terrain.h(k[1], k[2]) + 1.5, life: 3, t: this.t }));
    if (m.me) this.applySelf(m.me);
  },
  applySelf(me) {
    const gp = W.player;
    W.lives = me.lv; Game.respawnT = me.rs || 0;
    if (me.dead) { if (gp) gp.dead = true; return; }
    if (!gp || gp.id !== me.id) return;
    gp.dead = false;
    gp.hp = me.hp; gp.armor = me.ar; gp.shield = me.sh; gp.shieldOn = !!me.so; gp.shieldBroken = me.sb; gp.energy = me.en; gp.energyLock = !!me.el; gp.heat = me.ht; gp.overheated = !!me.ov;
    gp.sub.weapons = me.sub[0]; gp.sub.mobility = me.sub[1]; gp.sub.sensors = me.sub[2];
    SLOT_ORDER.forEach((s, i) => { const w = gp.wslots[s], a = me.w[i]; if (w && a) { w.clip = a[0]; w.reserve = a[1]; w.cd = a[2]; w.reloading = a[3]; w.charge = a[4]; } });
    gp.activeSlot = SLOT_ORDER[me.as] || 'primaryA';
    if (gp.util && me.u) { gp.util.charges = me.u[0]; gp.util.cd = me.u[1]; gp.util.auto = !!me.u[2]; }
    gp.lock.state = LOCK_STATES[me.lk[0]] || 'none'; gp.lock.progress = me.lk[1]; gp.lock.reason = me.lk[2]; gp.lock.target = me.lk[3] ? (this.map[me.lk[3]] || null) : null;
    gp.throttle = me.th; gp.gear = !!me.g; gp.grounded = !!me.gr; gp.afterburner = !!me.ab; gp.stalled = !!me.stl; gp.warn = me.wn; gp.beingLocked = me.bl;
    gp.warnIncoming = gp.netInc = { count: me.inc[0], dist: me.inc[1] }; gp.crouch = !!me.cr; gp.radarFocus = !!me.rf; gp.airbrake = !!me.abk;
    W.stats.kills = me.k[0]; W.stats.score = me.k[1]; W.stats.deaths = me.k[2];
  },
  applyObjectives(m) {
    const ms = Game.mission;
    if (!ms || !Array.isArray(m.o)) return;
    ms.time = m.T; ms.limit = m.L; ms.state = m.st; ms.failReason = m.why || '';
    const byId = {};
    ms.objectives.forEach((o) => { byId[o.id] = o; });
    const list = [];
    for (const e of m.o) {
      let o = byId[e[0]];
      if (!o) o = { id: e[0], deps: [], tick() {}, finalize() {}, text() { return this.txt; }, markers() { return this.mk; } };
      o.title = String(e[1]); o.primary = !!e[2]; o.status = e[3]; o.progress = e[4]; o.txt = String(e[5]);
      o.mk = (e[6] || []).map((k) => ({ x: k[0], y: k[1], z: k[2], label: k[3], kind: k[4] }));
      list.push(o);
    }
    ms.objectives = list;
  },
  applyStructs(m) {
    if (!W || !Array.isArray(m.l)) return;
    for (const e of m.l) {
      const s = W.structs[e[0]];
      if (!s) continue;
      s.hp = e[1]; s.scorch = Math.min(1, (1 - e[1] / s.maxHp) * 0.8); s.flash = 0.1;
      if (e[3] && !s.destroyed) {
        const ex = s.explosive; s.explosive = false;           // the host sends the blast as its own event
        destroyStruct(s, null);
        s.explosive = ex;
      } else if (!e[3]) {
        if (s.bld && s.state !== e[2]) Bld.markDirty(s, false);
        s.state = e[2];
      }
      if (!s.bld) Chunks.mark(s);
    }
  },

  /* per rendered frame on the guest (no simulation runs there) */
  guestTick(dt) {
    this.t += dt;
    if (this.hostPeer && this.t - this.hostPeer.lastRecv > 8) { this.leave('Lost connection to the host'); return; }
    const k = Math.min(1, dt * 14);
    for (let i = W.platforms.length - 1; i >= 0; i--) {
      const p = W.platforms[i];
      if (!p.netInit) continue;
      if (this.t - p.seen > 0.8) {
        W.platforms.splice(i, 1); delete this.map[p.id];
        if (p === W.player) p.dead = true;
        continue;
      }
      const dx = p.nx - p.x, dz = p.nz - p.z;
      if (dx * dx + dz * dz > 90000) { p.x = p.nx; p.z = p.nz; p.y = p.ny; } // teleport (respawn)
      p.x += dx * k; p.y += (p.ny - p.y) * k; p.z += dz * k;
      p.yaw += angleDiff(p.yaw, p.nyaw) * k; p.pitch += (p.npitch - p.pitch) * k; p.roll += (p.nroll - p.roll) * k;
      p.torsoYaw += angleDiff(p.torsoYaw, p.nty) * k; p.torsoPitch += (p.ntp - p.torsoPitch) * k;
      p.walkPhase += p.speed * dt * (p.kind === 'mech' ? 0.42 : 1);
      p.hitFlash = Math.max(0, p.hitFlash - dt); p.recoil = Math.max(0, p.recoil - dt * 4);
      p.vx = Math.sin(p.yaw) * p.speed; p.vz = Math.cos(p.yaw) * p.speed; p.vy = 0;
    }
    for (const q of W.projs) {
      if (!q.active) continue;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      if (this.t - q.seen > 0.35) q.active = false;
    }
    const ms = Game.mission;
    if (ms && ms.state === 'running') ms.time += dt;
    updateWorldEffects(dt);
    for (let i = W.dmgDirs.length - 1; i >= 0; i--) { W.dmgDirs[i].t -= dt; if (W.dmgDirs[i].t <= 0) W.dmgDirs.splice(i, 1); }
    this.beatAcc += dt;
    if (this.beatAcc >= 1) { this.beatAcc = 0; this.send(this.hostPeer, { t: 'p' }, false); }
    this.inAcc += dt;
    if (this.inAcc >= 1 / 30) { this.inAcc = 0; this.sendInput(); }
  },
  sendInput() {
    const p = W.player;
    if (!this.hostPeer || !this.hostPeer.open) return;
    if (!p || p.dead) { this.send(this.hostPeer, { t: 'in', q: ++this.inSeq, mf: 0, ms: 0, tn: 0, ti: 0, ay: 0, ap: 0, b: 0, e: 0 }, false); return; }
    const c = p.cmd;
    const b = (c.fire1 ? 1 : 0) | (c.fire2 ? 2 : 0) | (c.boost ? 4 : 0) | (c.jump ? 8 : 0) | (c.brake ? 16 : 0);
    const e = (c.fire1Edge ? 1 : 0) | (c.fire2Edge ? 2 : 0) | (c.defenseEdge ? 4 : 0) | (c.meleeEdge ? 8 : 0) | (c.stanceEdge ? 16 : 0) | (c.gearEdge ? 32 : 0) | (c.reloadEdge ? 64 : 0) | (c.ejectEdge ? 128 : 0) | (c.sel1 ? 256 : 0) | (c.sel2 ? 512 : 0) | (c.selNext ? 1024 : 0) | this.pendEdge;
    c.fire1Edge = c.fire2Edge = c.defenseEdge = c.meleeEdge = c.stanceEdge = c.gearEdge = c.reloadEdge = c.ejectEdge = false; c.sel1 = c.sel2 = c.selNext = false; this.pendEdge = 0;
    const ap = c.aimPoint;
    const t = p.target;
    this.send(this.hostPeer, {
      t: 'in', q: ++this.inSeq, mf: r2(c.moveF), ms: r2(c.moveS), tn: r2(c.turn), ti: r2(c.throttleIn), ay: r2(c.aimYaw), ap: r2(c.aimPitch),
      ax: [r2(c.axisPitch), r2(c.axisRoll), r2(c.axisYaw)], b, e, pt: ap ? [r1(ap.x), r1(ap.y), r1(ap.z)] : null,
      tg: t && talive(t) ? (t.isStruct ? -1 - t.idx : t.id) : 0, fm: S.flightMode,
    }, e !== 0);
  },
};

/* ---------------------------------------------------------------------
   Co-op lobby screens
   --------------------------------------------------------------------- */
Net.onChange = () => { if (UI.cur && UI.cur.name.indexOf('coop') === 0) { UI.cur.keepScroll = true; UI.render(); } };
UI.copyText = function (text) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(() => this.toast('Copied'), () => this.toast('Select the code and press Ctrl+C')); return; } } catch (e) { /* fall through */ }
  this.toast('Select the code and press Ctrl+C');
};
UI.act_coop = function () { this.show('coop'); };
UI.act_coopHostGo = function () { Net.leave(); Net.host = true; Net.guest = false; this.show('coopHost'); };
UI.act_coopJoinGo = function () { Net.leave(); Net.guest = true; Net.host = false; this.show('coopJoin'); };
UI.act_coopLeave = function () { Net.leave(); this.stack = [{ name: 'main', data: {} }]; this.show('coop', {}, true); };
UI.act_coopAdd = async function () {
  try { await Net.hostInvite(); } catch (e) { this.toast(e.message); }
};
UI.act_coopConnect = async function (d) {
  const peer = Net.peers.find((p) => p.id === Number(d.peer));
  if (!peer) return;
  try { await Net.hostAccept(peer, peer.replyText); } catch (e) { this.toast(e.message || 'Could not use that code'); }
};
UI.act_coopCopy = function (d) { const peer = Net.peers.find((p) => p.id === Number(d.peer)); this.copyText(d.what === 'invite' && peer ? peer.code : (Net.hostPeer ? Net.hostPeer.code : '')); };
UI.act_coopRemove = function (d) { const peer = Net.peers.find((p) => p.id === Number(d.peer)); if (peer) { Net.dropPeer(peer, 'removed'); this.render(); } };
UI.act_coopStart = function () {
  Snd.init(); Snd.resume();
  Input.requestLock();
  UI.fadeNow(1);
  if (Net.startCoop()) UI.hideAll(); else UI.fade(0);
};
UI.act_coopReply = async function () {
  try { await Net.guestJoin(Net.inviteText); this.render(); } catch (e) { this.toast(e.message || 'Could not use that invite'); }
};
UI.act_coopReady = function () { Net.toggleReady(); };
UI.act_coopSync = function () { Net.sendLobbyState(); Net.changed(); };
UI.onCoopInput = function (t, commit) {
  if (t.dataset.coop === 'name') Net.name = cleanName(t.value);
  else if (t.dataset.coop === 'stun') Net.useStun = t.checked;
  else if (t.dataset.coop === 'mission') { Net.missionId = t.value; if (commit && Net.host) Net.sendLobby(); }
  else if (t.dataset.coop === 'reply') { const peer = Net.peers.find((p) => p.id === Number(t.dataset.peer)); if (peer) peer.replyText = t.value; }
  else if (t.dataset.coop === 'invite') Net.inviteText = t.value;
};
UI.scr_coop = function () {

  return '<h2>Co-op missions</h2><div class="panel">Play any objective mission with up to 3 friends. One player hosts and everyone else joins using copy-and-paste codes. No server is used: the browsers connect directly. On the same network it works as is; over the internet enable the public STUN option below, which contacts a free Google server only to discover your address.</div>' +
    '<div class="menu"><button class="btn primary" data-act="coopHostGo" data-focus>Host a game</button><button class="btn" data-act="coopJoinGo">Join a game</button><button class="btn" data-act="back">Back</button></div>';
};
UI.coopCommon = function () {
  return '<label class="f"><span>Your name</span><input type="text" maxlength="14" data-coop="name" value="' + esc(Net.name) + '" style="font:inherit;color:var(--txt);background:#0d1620;border:1px solid var(--line);padding:.3em .4em"></label>' +

};

      '<div class="row"><button class="btn small" data-act="coopConnect" data-peer="' + p.id + '">Connect</button><button class="btn small" data-act="coopRemove" data-peer="' + p.id + '">Cancel slot</button></div></td></tr>';

    '<div class="dim">Your platform: ' + esc(this.platLabel(Save.data.platformId)) + '</div><div class="row"><button class="btn small" data-act="hangar" data-ret="1">Change platform / loadout</button></div>' +
    '<div class="dim">Enemies scale up with player count. Each player has 3 platforms.</div></div>' +

    (Net.peers.length < Net.maxPeers ? '<div class="row"><button class="btn small" data-act="coopAdd">+ Add a player</button></div>' : '') + '</div></div>' +
    '<div class="row"><button class="btn primary" data-act="coopStart"' + (err ? ' disabled' : '') + '>Start mission</button><button class="btn" data-act="coopLeave" data-focus>Close lobby</button></div>' +
    '<div class="hint">' + esc(err || 'Everyone is ready.') + '</div>';
};
UI.scr_coopJoin = function () {

    body = '<div class="panel"><h3 style="margin-top:0">Lobby - ' + esc(m ? m.name : lobby.mission) + '</h3><table>' + lobby.players.map((p) => '<tr><td>' + esc(p.name) + (p.host ? ' (host)' : '') + '</td><td>' + esc(this.platLabel(p.pid)) + '</td><td class="' + (p.ready ? 'good' : 'warn') + '">' + (p.ready ? 'Ready' : 'Not ready') + '</td></tr>').join('') + '</table>' +
      '<div class="dim">Your platform: ' + esc(this.platLabel(Save.data.platformId)) + '</div><div class="row"><button class="btn small" data-act="hangar" data-ret="1">Change platform / loadout</button><button class="btn small" data-act="coopSync">Send my loadout</button></div>' +

  } else if (myCode) {

  } else {
    body = '<div class="panel">' + this.coopCommon() + '<div class="lbl"><span>1. Paste the host\'s invite code</span></div><textarea rows="3" data-coop="invite" style="width:100%;font:11px Consolas,monospace;background:#0d1620;color:var(--txt);border:1px solid var(--line)">' + esc(Net.inviteText) + '</textarea>' +
      '<div class="row"><button class="btn primary" data-act="coopReply" data-focus>Create reply code</button><button class="btn" data-act="coopLeave">Back</button></div></div>';
  }
  return '<h2>Join a co-op game</h2>' + body;
};


/* =====================================================================
   BOOTSTRAP
   ===================================================================== */
function showFatal(title, text) {
  el('fatalTitle').textContent = title;
  el('fatalText').textContent = text;
  el('fatal').style.display = 'flex';
}

(function boot() {
  try {
    Save.load();
    document.documentElement.style.setProperty('--ui', S.uiScale);
    const glCanvas = el('gl');
    if (!R.init(glCanvas)) {
      showFatal('Graphics not available', 'This game needs WebGL. ' + (R.initError ? '(' + R.initError + ')' : 'Your browser or device did not provide a WebGL context.'));
      return;
    }
    HUD.init(el('hud'));
    Input.init(glCanvas);
    UI.init();
    R.onLost = () => { if (Game.state === 'playing') Game.pause(); UI.toast('Graphics context lost - waiting for the browser to restore it'); };
    R.onRestored = () => {
      if (R.terrainSrc) R.setTerrain(R.terrainSrc.data, R.terrainSrc.indices);
      UI.needResize = true; UI.toast('Graphics restored');
    };
    Input.onLockChange = (locked) => {
      if (!locked && Game.state === 'playing' && S.pointerLock && !Input.lockFailed) Game.pause();
    };
    Input.onKeyDown = (code, e) => {
      if (code === 'F10') { e.preventDefault(); UI.diagOn = !UI.diagOn; Game.updateDiag(); return; }
      const st = Game.state;
      if (st === 'playing' && Game.netPaused) { if (code === 'Escape' || code === Input.code('pause')) UI.escape(); else if (code === 'ArrowDown' || code === 'ArrowUp') { e.preventDefault(); UI.navKey(code); } return; }
      if (st === 'playing') {
        if (code === 'Escape' || code === Input.code('pause')) { Game.pause(); return; }
        if (W && W.mode === 'training') {
          if (code === 'F1') Game.trainingHelp = !Game.trainingHelp;
          else if (code === 'F2') { W.infiniteAmmo = !W.infiniteAmmo; W.msg('INFINITE AMMO ' + (W.infiniteAmmo ? 'ON' : 'OFF')); }
          else if (code === 'F3') { W.friendlyFire = !W.friendlyFire; W.msg('FRIENDLY FIRE ' + (W.friendlyFire ? 'ON' : 'OFF')); }
          else if (code === 'F4') resetTrainingDestructibles();
          else if (code === 'F6') resetTrainingTargets();
        }
        return;
      }
      if (UI.cur && UI.cur.name === 'boot') { if (code !== 'Escape' && !/^F\d+$/.test(code)) UI.act('begin', {}); return; }
      if (UI.visible()) {
        if (code === 'Escape') UI.escape();
        else if (code === 'ArrowDown' || code === 'ArrowUp') { e.preventDefault(); UI.navKey(code); }
        else if (st === 'paused' && code === Input.code('pause') && UI.cur && UI.cur.name === 'pause') Game.resume();
      }
    };
    glCanvas.addEventListener('mousedown', () => { if (Game.state === 'playing' && !Input.locked && S.pointerLock) Input.requestLock(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) { if (Game.state === 'playing') Game.pause(); } });
    window.addEventListener('blur', () => { if (Game.state === 'playing') Game.pause(); });
    window.addEventListener('error', (e) => { Game.errors.push('window: ' + (e.message || 'error')); if (Game.errors.length > 20) Game.errors.shift(); });
    window.addEventListener('unhandledrejection', (e) => { Game.errors.push('promise: ' + (e.reason && e.reason.message || e.reason)); });
    UI.applySettings();
    UI.resizeIfNeeded();
    Game.enterMenuWorld();
    Game.state = 'menu';
    UI.show('boot');
    UI.fade(0);
    el('app').addEventListener('contextmenu', (e) => e.preventDefault());
    window.__IH = { selfTest: () => SelfTest.run(), Game, W: () => W, Terrain, PLATFORMS, WEAPONS, MISSIONS, S, UI, Cam, R, FX, Input, Save, Platform, spawnUnit, STEP };
    requestAnimationFrame((t) => Game.frame(t));
  } catch (err) {
    showFatal('Startup failed', (err && err.message) || String(err));
    if (typeof console !== 'undefined') console.error(err);
  }
})();

</script>
