  this.tick = 0;
  this.thrown = null;
}
BattleLayer.prototype.update = function () {
  this.tick++;
  this.box.update();
  for (const view of this.views) {
    if (view.shown < view.target) view.shown = Math.min(view.target, view.shown + Math.max(0.6, view.max / 45));
    else if (view.shown > view.target) view.shown = Math.max(view.target, view.shown - Math.max(0.6, view.max / 45));
    const whole = Math.round(view.shown);
    if (whole !== view.lastShown) { view.lastShown = whole; view.hpText = whole + '/' + view.max; }
  }
  if (this.fx) {
    this.fx.t++;
    this.applyFx();
    if (this.fx.t >= this.fx.dur) { const done = this.fx.resolve; this.finishFx(); if (done) done(); }
  }
  if (this.mode === 'text') this.updateText();
  else if (this.mode === 'root') this.updateRoot();
  else if (this.mode === 'moves') this.updateMoves();
};
BattleLayer.prototype.updateText = function () {
  if (this.box.isTyping()) { if (Input.pressed.a || Input.pressed.b) this.box.advance(); return; }
  this.hold++;
  if (Input.pressed.a || Input.pressed.b || this.hold > AUTO_ADVANCE_FRAMES[OPT.textSpeed]) {
    if (this.box.hasMorePages()) { this.box.advance(); this.hold = 0; return; }
    this.mode = 'idle';
    const resolve = this.textResolve;
    this.textResolve = null;
    if (resolve) resolve();
  }
};
BattleLayer.prototype.showText = function (text) {
  this.mode = 'text';
  this.hold = 0;
  this.box.setText(text);
  const layer = this;
  return new Promise(function (resolve) { layer.textResolve = resolve; });
};
// ---- effects (short animations that finish before the next event is played) ----
BattleLayer.prototype.startFx = function (kind, side, duration) {
  const layer = this;
  if (OPT.reduceMotion && (kind === 'attack' || kind === 'hit')) duration = Math.min(duration, 6);
  if (OPT.reduceMotion && kind === 'faint') duration = 1; // the creature just disappears
  return new Promise(function (resolve) { layer.fx = { kind: kind, side: side, t: 0, dur: Math.max(1, duration), resolve: resolve }; });
};
BattleLayer.prototype.applyFx = function () {
  const fx = this.fx;
  const view = this.views[fx.side];
  const progress = fx.t / fx.dur;
  if (fx.kind === 'attack') view.dx = OPT.reduceMotion ? 0 : Math.sin(progress * Math.PI) * 12 * (fx.side === 0 ? 1 : -1);
  else if (fx.kind === 'hit') {
    view.dx = OPT.reduceMotion ? 0 : ((fx.t >> 1) % 2 === 0 ? 3 : -3);
    view.alpha = OPT.reduceMotion ? 1 : ((fx.t >> 1) % 2 === 0 ? 0.4 : 1);
  } else if (fx.kind === 'faint') {
    view.dy = OPT.reduceMotion ? 0 : progress * 36;
    view.alpha = OPT.reduceMotion ? 1 : 1 - progress;
  }
  else if (fx.kind === 'enter') { view.alpha = progress; view.dx = (1 - progress) * (fx.side === 0 ? -30 : 30); }
};
BattleLayer.prototype.finishFx = function () {
  const fx = this.fx;
  const view = this.views[fx.side];
  if (fx.kind === 'faint') { view.visible = false; view.alpha = 1; view.dy = 0; }
  else { view.dx = 0; view.dy = 0; view.alpha = 1; }
  this.fx = null;
};
BattleLayer.prototype.waitUntil = async function (condition, maxFrames) {
  for (let i = 0; i < maxFrames && !condition(); i++) await nextFrame();
};
// ---- menus ----
BattleLayer.prototype.updateRoot = function () {
  // The four tabs sit in one row: left/up goes to the previous tab, right/down to the next (wrapping).
  const step = (Input.pressed.right || Input.pressed.down ? 1 : 0) - (Input.pressed.left || Input.pressed.up ? 1 : 0);
  if (step !== 0) { this.rootCursor = (this.rootCursor + step + ROOT_LABELS.length) % ROOT_LABELS.length; Sound.sfx('move'); }
  if (Input.pressed.a) { Sound.sfx('confirm'); const resolve = this.menuResolve; this.mode = 'idle'; this.menuResolve = null; resolve(this.rootCursor); }
};
BattleLayer.prototype.updateMoves = function () {
  const mon = activeMon(this.battle, 0);
  const count = mon.moves.length;
  let cursor = this.moveCursor; // the moves are a vertical list in the ticker strip
  if (Input.pressed.up && cursor > 0) cursor--;
  if (Input.pressed.down && cursor + 1 < count) cursor++;
  if (cursor !== this.moveCursor) { this.moveCursor = cursor; Sound.sfx('move'); this.refreshMoveInfo(); }
  if (Input.pressed.a || Input.pressed.b) {
    const resolve = this.menuResolve;
    this.mode = 'idle';
    this.menuResolve = null;
    if (Input.pressed.a) { Sound.sfx('confirm'); resolve(mon.moves[this.moveCursor]); } else { Sound.sfx('back'); resolve(null); }
  }
};
BattleLayer.prototype.refreshMoveInfo = function () {
  const moveId = activeMon(this.battle, 0).moves[this.moveCursor];
  this.moveInfo = moveInfoLine(moveId);
  this.moveType = MOVES[moveId].t;
};
BattleLayer.prototype.askRoot = function () {
  const layer = this;
  const mon = activeMon(this.battle, 0);
  this.rootPrompt = wrapText(T('battle.prompt', { name: speciesName(mon.sp) }), TICKER.textW);
  this.mode = 'root';
  return new Promise(function (resolve) { layer.menuResolve = resolve; });
};
BattleLayer.prototype.askMove = function () {
  const layer = this;
  this.moveCursor = 0;
  this.refreshMoveInfo();
  this.mode = 'moves';
  return new Promise(function (resolve) { layer.menuResolve = resolve; });
};
// ---- the main loop ----
BattleLayer.prototype.askAction = async function () {
  const battle = this.battle;
  for (;;) {
    const choice = await this.askRoot();
    const mon = activeMon(battle, 0);
    if (choice === 0) {
      const moveId = await this.askMove();
      if (moveId) return { t: 'move', id: moveId };
    } else if (choice === 1) {
      const itemId = await openLayer(new BagLayer({ battle: true }));
      if (!itemId) continue;
      if (ITEMS[itemId].kind === 'recruit') return { t: 'recruit', id: itemId };
      const target = await openLayer(new PartyLayer({ mode: 'choose', canChoose: function (index) { return canUseItemOn(G.party[index], itemId); } }));
      if (target >= 0) return { t: 'item', id: itemId, target: target };
    } else if (choice === 2) {
      if (mon.bt.trap > 0) { await this.showText(T('b.trapped', { mon: speciesName(mon.sp) })); continue; }
      const index = await openLayer(new PartyLayer({ mode: 'switch', activeIndex: battle.sides[0].active }));
      if (index >= 0) return { t: 'switch', idx: index };
    } else {
      if (battle.kind !== 'wild') { await this.showText(T('b.run.trainer')); continue; }
      return { t: 'run' };
    }
  }
};
BattleLayer.prototype.run = async function () {
  const battle = this.battle;
  await this.playEvents(battle.events);
  while (!battle.over) {
    if (battle.phase === 'forced') {
      const index = await openLayer(new PartyLayer({ mode: 'switch', forced: true, activeIndex: -1 }));
      await this.playEvents(playForcedSwitch(battle, index));
      continue;
    }
    const action = await this.askAction();
    await this.playEvents(playTurn(battle, action));
  }
  return this.finish();
};
BattleLayer.prototype.finish = async function () {
  const battle = this.battle;
  let result = 'win';
  if (battle.ran) result = 'ran';
  else if (battle.winner === 1) result = 'lose';
  if (result === 'win') {
    if (battle.kind === 'trainer') {
      const prize = prizeFor(battle, this.trainer);
      G.money += prize;
      await this.showText(T('b.prize', { n: prize }));
    }
    if (battle.moneyDelta !== 0) {
      G.money = Math.max(0, G.money + battle.moneyDelta);
      await this.showText(T(battle.moneyDelta > 0 ? 'b.moneyGain' : 'b.moneyLoss', { n: Math.abs(battle.moneyDelta) }));
    }
  }
  endBattle(battle);
  return result;
};
BattleLayer.prototype.playEvents = async function (events) {
  const battle = this.battle;
  for (const ev of events) {
    const view = ev.side !== undefined ? this.views[ev.side] : null;
    if (ev.k === 'msg') await this.showText(eventText(ev, OPT.lang, G.player.gender, battle.kind));
    else if (ev.k === 'seen') G.dex.seen[ev.sp] = true;
    else if (ev.k === 'recruited') { G.dex.seen[ev.sp] = true; G.dex.got[ev.sp] = true; }
    else if (ev.k === 'send') {
      view.sp = ev.sp; view.name = speciesName(ev.sp); view.max = ev.max; view.shown = ev.hp; view.target = ev.hp; view.lastShown = -1;
      view.status = ev.status; view.visible = true; view.hidden = false; view.lvText = T('ui.lv') + battle.sides[ev.side].party[battle.sides[ev.side].active].lv;
      if (ev.side === 1) this.trainerLook = null;
      await this.startFx('enter', ev.side, OPT.reduceMotion ? 1 : 16);
    } else if (ev.k === 'hp') {
      view.max = ev.max; view.target = ev.hp; view.lastShown = -1;
      await this.waitUntil(function () { return view.shown === view.target; }, 100);
    } else if (ev.k === 'status') view.status = ev.status;
    else if (ev.k === 'anim') {
      if (ev.kind === 'attack') { Sound.sfx('attack'); await this.startFx('attack', ev.side, 14); }
      else {
        Sound.sfx(ev.eff > 1 ? 'super' : (ev.eff < 1 ? 'weak' : 'hit'));
        await this.startFx('hit', ev.side, 16);
      }
    } else if (ev.k === 'faint') { Sound.sfx('faint'); await this.startFx('faint', ev.side, 30); }
    else if (ev.k === 'xp') await this.showText(T('b.xp', { mon: speciesName(G.party[ev.idx].sp), n: ev.amount }));
    else if (ev.k === 'lvl') {
      const mon = G.party[ev.idx];
      Sound.sfx('levelup');
      if (ev.active) { const mine = this.views[0]; mine.lvText = T('ui.lv') + ev.lv; mine.max = ev.max; mine.target = ev.hp; mine.lastShown = -1; }
      await this.showText(T('b.lvl', { mon: speciesName(mon.sp), n: ev.lv }));
    } else if (ev.k === 'learned') await this.showText(T('b.learned', { mon: speciesName(G.party[ev.idx].sp), move: MOVES[ev.move].n }));
    else if (ev.k === 'learnPrompt') {
      const mon = G.party[ev.idx];
      mon.pend = mon.pend.filter(function (id) { return id !== ev.move; });
      await offerLearnMove(mon, ev.move);
    } else if (ev.k === 'recruit') await this.playRecruit(ev);
  }
};
BattleLayer.prototype.playRecruit = async function (ev) {
  const foeView = this.views[1];

  Sound.sfx('throw');
  for (let t = 0; t <= 24; t++) { this.thrown.t = t / 24; await nextFrame(); }
  foeView.hidden = true;
  for (let i = 0; i < ev.shakes; i++) {
    Sound.sfx('shake');
    for (let t = 0; t < 22; t++) { this.thrown.wobble = OPT.reduceMotion ? 0 : Math.sin(t / 22 * Math.PI * 4) * 3; await nextFrame(); }
    this.thrown.wobble = 0;
    await waitFrames(8);

  else { foeView.hidden = false; Sound.sfx('error'); }

  ctx.globalAlpha = active ? 1 : 0.45;
  for (let i = 0; i < ROOT_LABELS.length; i++) {
    const x = COMMAND_ROW.x + i * COMMAND_ROW.tabW;
    const selected = active && i === this.rootCursor;
    ctx.fillStyle = COLOR.border; ctx.fillRect(x, COMMAND_ROW.y, COMMAND_ROW.tabW - 2, COMMAND_ROW.h);
    ctx.fillStyle = selected ? COLOR.gold : TAB_BLUE; ctx.fillRect(x + 1, COMMAND_ROW.y + 1, COMMAND_ROW.tabW - 4, COMMAND_ROW.h - 2);
    drawText(T(ROOT_LABELS[i]), x + (COMMAND_ROW.tabW - 2) / 2, COMMAND_ROW.y + 3, selected ? COLOR.ink : COLOR.white, 'center');
  }
  ctx.globalAlpha = 1;
};
// The news-ticker strip along the bottom: a red NEWS tag on the left, the text on a navy band.
BattleLayer.prototype.drawTicker = function () {
  ctx.fillStyle = NEWS_NAVY; ctx.fillRect(0, TICKER.y, SCREEN_W, TICKER.h);
  ctx.fillStyle = COLOR.red; ctx.fillRect(0, TICKER.y, SCREEN_W, 2);
  ctx.fillStyle = COLOR.red; ctx.fillRect(0, TICKER.y + 2, TICKER.tagW, TICKER.h - 2);
  ctx.font = FONT_SMALL;
  drawText(T('battle.news'), TICKER.tagW / 2, TICKER.y + 7, COLOR.white, 'center');
  ctx.fillStyle = COLOR.gold; ctx.fillRect(6, TICKER.y + 17, TICKER.tagW - 12, 2);
  ctx.font = FONT;
  if (this.mode === 'root') {
    for (let i = 0; i < this.rootPrompt.length; i++) drawText(this.rootPrompt[i], TICKER.textX, TICKER.y + 5 + i * TICKER.lineHeight, COLOR.white);
  } else if (this.mode === 'moves') {
    const mon = activeMon(this.battle, 0);
    for (let i = 0; i < mon.moves.length; i++) {
      const rowY = TICKER.y + 3 + i * 9;
      if (i === this.moveCursor) { ctx.fillStyle = COLOR.gold; ctx.fillRect(TICKER.textX, rowY + 1, 3, 6); }
      drawText(MOVES[mon.moves[i]].n, TICKER.textX + 7, rowY, i === this.moveCursor ? COLOR.gold : COLOR.white);
    }
  } else if (this.mode === 'text') {
    this.box.draw(TICKER.textX, TICKER.y + 5, TICKER.lineHeight, COLOR.white);
  }
};
// While the player picks a move, the command row shows that move's type and numbers instead of the tabs.
BattleLayer.prototype.drawMoveInfo = function () {
  ctx.fillStyle = TAB_BLUE; ctx.fillRect(COMMAND_ROW.x, COMMAND_ROW.y, COMMAND_ROW.w, COMMAND_ROW.h);
  const tagWidth = drawTypeTag(this.moveType, COMMAND_ROW.x + 2, COMMAND_ROW.y + 2);
  ctx.font = FONT_SMALL;
  drawText(this.moveInfo, COMMAND_ROW.x + tagWidth + 8, COMMAND_ROW.y + 3, COLOR.white);
  ctx.font = FONT;
};
BattleLayer.prototype.draw = function () {
  ctx.font = FONT;
  this.drawBackground();
  drawPodium(PODIUM.leftX);
  drawPodium(PODIUM.rightX);
  if (this.trainerLook && !this.views[1].visible) ctx.drawImage(charSheet(this.trainerLook), 0, 0, 16, 16, 158, 48, 48, 48);
  this.drawView(this.views[1], 150, CREATURE_Y, false);
  this.drawView(this.views[0], 26, CREATURE_Y, true);
  this.drawPollPanel(this.views[0], POLL_PANEL.leftX, true);
  this.drawPollPanel(this.views[1], POLL_PANEL.rightX, false);
  if (this.thrown) {
    const t = this.thrown.t;
    const x = 70 + (172 - 70) * t + this.thrown.wobble;
    const y = 70 + (52 - 70) * t - Math.sin(t * Math.PI) * 24;
    ctx.drawImage(getEnvelopeSprite(), Math.round(x), Math.round(y));
  }
  if (this.mode === 'moves') this.drawMoveInfo();
  else this.drawCommandRow();
  this.drawTicker();
};

// ---- Start a battle and return 'win' | 'lose' | 'ran' --------------------------------------------------------------
async function runBattle(setup) {
  const trainer = setup.trainerId ? TRAINERS[setup.trainerId] : null;
  const battle = createBattle(G.party, setup.foeParty, G.rng, {
    kind: setup.kind, trainerId: setup.trainerId, foeItems: trainer ? trainer.items : [], foeName: trainer ? trainer.name : '',
    bag: G.bag, sunday: new Date().getDay() === 0, recruitable: !!(trainer && trainer.recruitable), recruitOnly: trainer ? trainer.recruitOnly : null,
  });
  const mapId = G.player.map;
  const theme = mapId === 'studio' ? 'studio' : (mapId === 'port' ? 'sea' : 'grass');
  const layer = new BattleLayer(battle, trainer, theme);
  Sound.play(trainer && trainer.boss ? 'boss' : 'battle');
  await Fade.start(1, 14);
  pushLayer(layer);
  await waitFrames(2);
  await Fade.start(0, 14);
  let result;
  try { result = await layer.run(); } catch (error) {
    // A broken battle must never count as a win: no story flag, medal or credits follow from 'ran'.
    console.error('Mizamon battle error', error);
    endBattle(battle);
    result = 'ran';
  }
  await Fade.start(1, 12);
  removeLayer(layer);
  const world = layers.find(function (candidate) { return candidate instanceof OverworldLayer; });
  Sound.play(world ? world.map.music : 'town');
  await Fade.start(0, 12);
  return result;
}

// ---- Game flow: title, new game, continue ---------------------------------------------------------------------
function clockSeed() { return (Date.now() ^ Math.floor(performance.now() * 1000)) >>> 0; }
function startWorld() {
  layers.length = 0;
  pushLayer(new OverworldLayer());
}
async function newGameFlow() {
  const gender = await openLayer(new GenderLayer());
  PREVIEW_PLAYER.gender = gender;
  const name = await openLayer(new NameLayer(gender === 'f' ? 'ΜΑΡΙΑ' : 'ΝΙΚΟΣ'));
  const backdrop = new BackdropLayer('prof');
  pushLayer(backdrop);
  PREVIEW_PLAYER.name = name;
  resetTextCache();
  for (const key of ['intro.1', 'intro.2', 'intro.3', 'intro.4', 'intro.5']) await say(key, { name: name });
  let starter;
  for (;;) {
    starter = await openLayer(new StarterLayer());
    if (await askYesNo('starter.confirm', { mon: speciesName(starter) })) break;
  }
  G = newGameState(name, gender, starter);
  G.rng = makeRng(clockSeed());
  resetTextCache();
  await say('intro.6', { name: name, mon: speciesName(starter) });
  await say('intro.7', { name: name });
  removeLayer(backdrop);
  await Fade.start(1, 12);
  startWorld();
  await waitFrames(3);
  await Fade.start(0, 12);
}
async function titleFlow() {
  layers.length = 0;
  G = null;
  await openLayer(new NoticeLayer());
  pushLayer(new TitleLayer());
  for (;;) {
    const saved = readSave();
    const choice = await choose([T('title.new'), { label: T('title.continue'), disabled: !saved }, T('menu.options')], { x: 84, y: 100, w: 72, cancel: false });
    if (choice === 0) { await newGameFlow(); return; }
    if (choice === 1) {
      G = gameFromSave(saved);
      resetTextCache();
      Sound.sfx('confirm');
      await Fade.start(1, 12);
      startWorld();
      await waitFrames(3);
      await Fade.start(0, 12);
      return;
    }
    if (choice === 2) await openLayer(new OptionsLayer());
  }
}

// ---- Main loop --------------------------------------------------------------------------------------------------------
let lastFrameTime = 0;
let accumulator = 0;
let loopPaused = false;
const STEP_MS = 1000 / 60;
function stepGame() {
  Input.poll();
  updateLayers();
  Fade.update();
  releaseFrameWaiters();
}
function renderFrame() {
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.font = FONT;
  ctx.textBaseline = 'top';
  drawLayers();
  Fade.draw();
}
function frameLoop(now) {
  requestAnimationFrame(frameLoop);
  if (loopPaused) { lastFrameTime = now; return; }
  if (!lastFrameTime) lastFrameTime = now;
  accumulator += Math.min(100, now - lastFrameTime);
  lastFrameTime = now;
  let steps = 0;
  while (accumulator >= STEP_MS && steps < 4) { stepGame(); accumulator -= STEP_MS; steps++; }
  if (steps > 0) renderFrame();
}
function boot() {
  loadOptions();
  buildAllSprites();
  resizeScreen();
  bindTouchButtons();
  window.addEventListener('resize', resizeScreen);
  window.addEventListener('orientationchange', resizeScreen);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { Input.clear(); } });
  window.addEventListener('pointerdown', function () { Sound.unlock(); }, { passive: true });
  titleFlow();
  requestAnimationFrame(frameLoop);
}

// ---- Self test (run it in the browser: await MIZAMON.selfTest()) ----------------------------------------------------------------
function yieldToBrowser() { return new Promise(function (resolve) { const channel = new MessageChannel(); channel.port1.onmessage = function () { resolve(); }; channel.port2.postMessage(0); }); }
async function pumpUntil(condition, maxFrames, button, every) {
  for (let i = 0; i < maxFrames; i++) {
    if (condition()) return true;
    if (button && i % every === 0) Input.inject(button, 2);
    stepGame();
    if (i % 4 === 0) renderFrame();
    await yieldToBrowser();
  }
  return condition();
}
async function pumpFrames(count) { await pumpUntil(function () { return false; }, count, null, 1); }
// Moves the battle command cursor to the command with this label key (a row of tabs: right = next) and presses A.
async function chooseBattleCommand(labelKey) {
  const top = layers[layers.length - 1];
  const wanted = ROOT_LABELS.indexOf(labelKey);
  for (let tries = 0; tries < ROOT_LABELS.length && top.rootCursor !== wanted; tries++) { Input.inject('right', 2); await pumpFrames(3); }
  const found = top.rootCursor === wanted;
  Input.inject('a', 2); await pumpFrames(3);
  return found;
}
async function selfTest() {
  const results = [];
  const check = function (name, pass, detail) { results.push({ name: name, pass: !!pass, detail: detail === undefined ? '' : String(detail) }); };
  const snapshot = { G: G, layers: layers.slice(), OPT: Object.assign({}, OPT), forceMemory: Store.forceMemory, touchForced: touchForced, loopPaused: loopPaused, memory: Object.assign({}, Store.memory) };
  loopPaused = true;
  Store.forceMemory = true;
  Store.memory = {};
  const guard = async function (name, fn) {
    try { await fn(); } catch (error) { check(name, false, 'exception: ' + (error && error.stack ? error.stack.split('\n').slice(0, 3).join(' | ') : error)); }
  };
  try {
    await guard('rules', async function () {
      check('chart has 7x7 entries', TYPE_IDS.every(function (a) { return TYPE_IDS.every(function (d) { return [0.5, 1, 2].includes(TYPE_CHART[a][d]); }); }));
      const attacker = makeMon('komma', 10);
      const defender = makeMon('fakelakis', 10);
      const hit = computeDamage(attacker, defender, MOVES.psifodeltio, { roll: 1 });
      check('damage is positive and super effective', hit.damage > 0 && hit.effectiveness === 2, hit.damage);
      const a = simulateBattle([makeMon('komma', 8)], [makeMon('eforaki', 8)], makeRng(7), {});
      const b = simulateBattle([makeMon('komma', 8)], [makeMon('eforaki', 8)], makeRng(7), {});
      check('seeded battle replays identically', a.checksum === b.checksum && a.winner === b.winner, a.checksum);
      const keys = Object.keys(STRINGS);
      check('every string has Greek and English', keys.every(function (key) { return STRINGS[key][0] && STRINGS[key][1]; }), keys.length + ' keys');
      const source = Array.prototype.map.call(document.scripts, function (s) { return s.textContent; }).join('\n');
      const used = new Set();
      source.replace(/\b(?:T|say|sayAll|askYesNo)\('([A-Za-z0-9_.]*[A-Za-z0-9_])'/g, function (all, key) { used.add(key); return all; });
      const missing = Array.from(used).filter(function (key) { return !STRINGS[key]; });
      check('every string key used in the code exists', missing.length === 0, missing.join(','));
    });
    await guard('sprites', async function () {
      const blank = [];
      for (const id of Object.keys(SPECIES)) {
        const data = creatureSprite(id).getContext('2d').getImageData(0, 0, 32, 32).data;
        let filled = 0;
        for (let i = 3; i < data.length; i += 4) if (data[i] > 0) filled++;
        if (filled < 150) blank.push(id);
      }
      check('all creature sprites are drawn', blank.length === 0, blank.join(','));
    });
    await guard('new game', async function () {
      layers.length = 0;
      G = null;
      titleFlow();
      const reached = await pumpUntil(function () { return layers.some(function (l) { return l instanceof OverworldLayer; }) && Fade.alpha === 0; }, 3000, 'a', 7);
      check('title, notice, new game reaches the overworld', reached && !!G && G.party.length === 1, G ? G.player.name + ' ' + G.player.map : 'no state');
      const world = layers.find(function (l) { return l instanceof OverworldLayer; });
      if (world) {
        await pumpFrames(5);
        const before = world.px;
        Input.inject('left', 14);
        await pumpFrames(30);
        check('player walks', world.px < before, before + ' -> ' + world.px);
      }
    });
    await guard('battle', async function () {
      if (!G) throw new Error('no game');
      G.party[0].lv = 20; G.party[0].xp = xpForLevel(20); G.party[0].hp = maxHp(G.party[0]);
      const xpBefore = G.party[0].xp;
      let result = null;
      runBattle({ kind: 'wild', foeParty: [makeMon('fakelakis', 2)] }).then(function (r) { result = r; });
      await pumpUntil(function () { return result !== null; }, 4000, 'a', 6);
      check('battle commands carry the debate labels', ROOT_LABELS.map(function (key) { return lookupString(key, 'en'); }).join('/') === 'Speech/Bag/Party/Flee');
      check('scripted battle is won through the UI', result === 'win' && G.party[0].xp > xpBefore, result + ' xp ' + xpBefore + ' -> ' + G.party[0].xp);
    });
    await guard('recruit', async function () {
      if (!G) throw new Error('no game');
      let success = false;
      let detail = '';
      for (let seed = 1; seed <= 12 && !success; seed++) {
        G.rng = makeRng(seed);
        G.bag.fakelaki = 5;
        const foe = makeMon('fakelakis', 3);
        foe.hp = 1;
        let result = null;
        const size = G.party.length;
        runBattle({ kind: 'wild', foeParty: [foe] }).then(function (r) { result = r; });
        // Wait for the first menu, pick the Bag command by its label, choose the first item (A), and let the rest run
        await pumpUntil(function () { const top = layers[layers.length - 1]; return top instanceof BattleLayer && top.mode === 'root'; }, 600, null, 1);
        await chooseBattleCommand('battle.bag');
        Input.inject('a', 2);
        await pumpUntil(function () { return result !== null; }, 3000, 'a', 8);
        success = G.party.length === size + 1;
        detail = 'seed ' + seed + ' party ' + G.party.length + ' result ' + result;
      }
      check('recruit success path adds the creature and the dossier entry', success && G.dex.got.fakelakis, detail);
    });
    await guard('save', async function () {
      if (!G) throw new Error('no game');
      G.money = 4321; G.flags.testFlag = true;
      const stored = writeSave();
      const loaded = readSave();
      const copy = loaded ? gameFromSave(loaded) : null;
      check('loaded game matches', !!copy && copy.money === 4321 && copy.flags.testFlag === true && copy.party.length === G.party.length &&
        copy.party[0].sp === G.party[0].sp && copy.party[0].lv === G.party[0].lv && copy.player.name === G.player.name, copy ? copy.money : 'null');
      check('save key is mizamon.v1.save with version 1', JSON.parse(Store.get('mizamon.v1.save')).version === 1);
    });
    await guard('language', async function () {
      OPT.lang = 'el'; const greek = T('menu.bag');
      OPT.lang = 'en'; const english = T('menu.bag');
      OPT.lang = 'el';
      check('language toggle changes the strings', greek !== english && english === 'Bag', greek + ' / ' + english);
    });
    await guard('touch', async function () {
      touchForced = true; resizeScreen();
      const buttons = Array.from(touchPad.querySelectorAll('[data-btn]'));
      const shown = touchPad.style.display !== 'none' && buttons.length >= 7;
      const game = canvas.getBoundingClientRect();
      const covering = buttons.filter(function (button) {
        const box = button.getBoundingClientRect();
        return box.left < game.right && box.right > game.left && box.top < game.bottom && box.bottom > game.top;
      }).map(function (button) { return button.getAttribute('data-btn'); });
      touchForced = false; resizeScreen();
      check('touch controls exist when forced on', shown);
      check('no touch button covers the game (' + window.innerWidth + 'x' + window.innerHeight + ')', covering.length === 0, covering.join(','));
    });
  } finally {
    layers.length = 0;
    for (const layer of snapshot.layers) layers.push(layer);
    G = snapshot.G;
    OPT = snapshot.OPT;
    Store.forceMemory = snapshot.forceMemory;
    Store.memory = snapshot.memory;
    touchForced = snapshot.touchForced;
    resizeScreen();
    Input.clear();
    Fade.alpha = 0;
    loopPaused = snapshot.loopPaused;
  }
  return results;
}

// ---- Public handle for the tests and for quick starts -----------------------------------------------------------------------------------
window.MIZAMON = {
  version: 'MVP 1',
  selfTest: selfTest,
  rules: RULES,
  press: function (name, frames) { Input.inject(name, frames || 2); },
  forceTouch: function (on) { touchForced = on; resizeScreen(); },
  state: function () { return G; },
  // Starts a game without the intro (for tests and screenshots).
  quickStart: function (options) {
    const o = options || {};
    G = newGameState(o.name || 'ΝΙΚΟΣ', o.gender || 'm', o.starter || 'komma');
    G.rng = makeRng(o.seed || 1234);
    if (o.map) { G.player.map = o.map; G.player.x = o.x; G.player.y = o.y; G.player.dir = o.dir || 'down'; }
    if (o.flags) Object.assign(G.flags, o.flags);
    if (o.level) { G.party[0].lv = o.level; G.party[0].xp = xpForLevel(o.level); G.party[0].moves = movesAtLevel(G.party[0].sp, o.level); G.party[0].hp = maxHp(G.party[0]); }
    startWorld();
    return G;
  },
  layers: layers,
  runBattle: runBattle,
  // Manual stepping for tests: pause the real-time loop, then pump frames with optional button presses.
  pause: function (on) { loopPaused = !!on; },
  pumpUntil: pumpUntil,
  pumpFrames: pumpFrames,
  hold: function (name, frames) { Input.inject(name, frames); },
};
boot();

</script>
