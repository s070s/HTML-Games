// ---- Seeded random numbers (mulberry32) --------------------------------------
function makeRng(seed) {
  let state = seed >>> 0;
  const next = function () {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  next.getState = function () { return state; };
  next.setState = function (value) { state = value >>> 0; };
  return next;
}
function randInt(rng, min, max) { return min + Math.floor(rng() * (max - min + 1)); }
function pickOne(rng, list) { return list[Math.floor(rng() * list.length)]; }
function pickWeighted(rng, entries) {
  let total = 0;
  for (const entry of entries) total += entry.w;
  let roll = rng() * total;
  for (const entry of entries) {
    roll -= entry.w;
    if (roll < 0) return entry;
  }
  return entries[entries.length - 1];
}
function hashString(text) { // FNV-1a, used for test checksums
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) {

}

// ---- Formatting helpers (strings table is below) ------------------------------------
// Template syntax: {name} is replaced from vars; {m|f} picks the masculine or feminine
// wording of the player's gender ("m" or "f").
function formatText(template, vars, gender) {
  return template
    .replace(/\{([^{}|]*)\|([^{}|]*)\}/g, function (all, masculine, feminine) { return gender === 'f' ? feminine : masculine; })
    .replace(/\{(\w+)\}/g, function (all, name) { return vars && vars[name] !== undefined ? String(vars[name]) : all; });
}
function lookupString(key, lang) {
  const entry = STRINGS[key];
  if (!entry) return key;
  const text = lang === 'en' ? entry[1] : entry[0];
  return text === undefined || text === '' ? entry[0] : text;
}

// ---- Creatures: stats, experience, moves ------------------------------------------
function statOf(mon, key) {
  const base = SPECIES[mon.sp].base[STAT_INDEX[key]];
  if (key === 'hp') return Math.floor(base * mon.lv / 20) + mon.lv + 10;
  return Math.floor(base * mon.lv / 25) + 5;
}
function maxHp(mon) { return statOf(mon, 'hp'); }
function xpForLevel(level) { return Math.floor(0.6 * level * level * level); } // total xp needed to reach a level
function levelFromXp(xp) {
  let level = 1;
  while (level < MAX_LEVEL && xp >= xpForLevel(level + 1)) level++;
  return level;
}
// The moves a species knows at a level: at most MOVES_MAX. When there are more, the creature keeps
// its basic attack (the first damaging move of its own type) plus the newest moves.
function movesAtLevel(speciesId, level) {
  const known = [];
  for (const entry of SPECIES[speciesId].learn) {
    if (entry[0] <= level && !known.includes(entry[1])) known.push(entry[1]);
  }
  if (known.length <= MOVES_MAX) return known;
  const ownType = SPECIES[speciesId].t;
  const basic = known.find(function (id) { return MOVES[id].p > 0 && MOVES[id].t === ownType; });
  if (!basic) return known.slice(-MOVES_MAX);
  const others = known.filter(function (id) { return id !== basic; });
  return [basic].concat(others.slice(-(MOVES_MAX - 1)));
}
function makeMon(speciesId, level) {
  const mon = { sp: speciesId, lv: level, xp: xpForLevel(level), moves: movesAtLevel(speciesId, level), pend: [], hp: 1, status: null };
  mon.hp = maxHp(mon);
  return mon;
}

  return { sp: mon.sp, lv: mon.lv, xp: mon.xp, moves: mon.moves.slice(), pend: mon.pend.slice(), hp: mon.hp, status: null };
}

// Adds experience. Returns the list of level-ups; each says which moves were learned

function gainXp(mon, amount) {
  const result = [];
  mon.xp += amount;
  while (mon.lv < MAX_LEVEL && mon.xp >= xpForLevel(mon.lv + 1)) {

  side.party.forEach(function (mon, index) {

    let score = 0;

      if (move.p > 0) score = Math.max(score, move.p * typeMultiplier(move.t, SPECIES[foe.sp].t) * (SPECIES[mon.sp].t === move.t ? 1.5 : 1));

// ---- Turn resolution -------------------------------------------------------------------
function checkFaints(battle) {

    const side = battle.sides[sideIndex];
    const mon = side.party[side.active];
    if (mon.hp > 0 || mon.bt.fainted) continue;
    mon.bt.fainted = true;
    if (mon.removed) continue; // recruited: no faint, no experience
    emit(battle, { k: 'faint', side: sideIndex });
    logMsg(battle, 'b.fainted', { mon: { sp: mon.sp, side: sideIndex } });
    const type = SPECIES[mon.sp].t;
    side.fallen[type] = (side.fallen[type] || 0) + 1;
    if (sideIndex === 1) awardXp(battle, mon);
  }
  const playerAlive = partyHasAlive(battle.sides[0].party);
  const foeAlive = partyHasAlive(battle.sides[1].party);
  if (!playerAlive || !foeAlive) {

    battle.winner = playerAlive ? 0 : 1;

}
function awardXp(battle, foeMon) {
  const total = xpReward(foeMon, battle.kind === 'trainer');
  const party = battle.sides[0].party;
  const participants = battle.sides[0].part.filter(function (index) { return monIsAlive(party[index]); });
  if (participants.length === 0) return;
  const share = Math.max(1, Math.floor(total / participants.length));
  for (const index of participants) {
    const mon = party[index];
    emit(battle, { k: 'xp', idx: index, amount: share });
    const levelUps = gainXp(mon, share);
    for (const levelUp of levelUps) {
      emit(battle, { k: 'lvl', idx: index, lv: levelUp.lv, hp: mon.hp, max: maxHp(mon), active: index === battle.sides[0].active });
      for (const moveId of levelUp.learned) emit(battle, { k: 'learned', idx: index, move: moveId });
      for (const moveId of levelUp.pending) emit(battle, { k: 'learnPrompt', idx: index, move: moveId });
    }
  }
}

    const mon = activeMon(battle, sideIndex);
    if (mon.hp <= 0) continue;
    const ref = monRef(battle, sideIndex);
    if (mon.status && mon.status.id === 'sca') {
      loseHp(battle, sideIndex, Math.max(1, Math.floor(maxHp(mon) / 8)));
      logMsg(battle, 'b.sca.hurt', { mon: ref });
    }
    if (mon.hp > 0 && abilityOf(mon) === 'gra' && mon.hp < maxHp(mon)) {
      gainHp(battle, sideIndex, Math.max(1, Math.floor(maxHp(mon) / 16) * (battle.sunday ? 2 : 1)));
      logMsg(battle, 'b.grace', { mon: ref });
    }
    if (mon.hp > 0 && mon.bt.broken > 0) {
      mon.bt.broken--;
      if (mon.bt.broken === 0) { loseHp(battle, sideIndex, Math.max(1, Math.floor(maxHp(mon) / 8))); logMsg(battle, 'b.promise', { mon: ref }); }
    }
    if (mon.hp > 0 && abilityOf(mon) === 'bah') {
      const stat = pickOne(battle.rng, STAGE_KEYS.slice(0, 5));
      if (mon.bt.stage[stat] < 6) changeStage(battle, sideIndex, stat, 1);
    }
    if (mon.hp > 0 && mon.status && STATUSES[mon.status.id].turns > 0) {
      mon.status.turns--;

    }

    logMsg(battle, 'b.overtime', {});
    const turnsOver = battle.turn - OVERTIME_TURN + 1;
    for (let sideIndex = 0; sideIndex < 2; sideIndex++) {
      const mon = activeMon(battle, sideIndex);
      if (mon.hp > 0) loseHp(battle, sideIndex, Math.max(1, Math.floor(maxHp(mon) * OVERTIME_STEP * turnsOver)));

function playTurn(battle, playerAction) {
  battle.events = [];

  const free = picks.filter(function (p) { return p.action.t !== 'move'; });

  for (const p of free.concat(moves)) {
    if (battle.over) break;

    if (mon.hp <= 0) continue;
    const action = p.action;
    if (action.t === 'move') useMove(battle, p.side, action.id);
    else if (action.t === 'switch') switchTo(battle, p.side, action.idx, false);
    else if (action.t === 'item') useItemAction(battle, p.side, action.id, action.target);
    else if (action.t === 'recruit') useItemAction(battle, p.side, action.id);
    else if (action.t === 'run') doRun(battle);

  const lead = battle.sides[0].party[battle.sides[0].active];

function simulateBattle(partyA, partyB, rng, options) {

    kind: o.kind || 'trainer', foeItems: o.foeItems, foeName: 'sim', bag: {}, trainerId: 'sim',
  });
  battle.sides[0].items = o.playerItems ? o.playerItems.slice() : [];

  while (!battle.over && guard++ < 400) {

      checksum = (checksum + hashString(JSON.stringify(events))) >>> 0;

    action = chooseAction(battle, 0);

    const events = playTurn(battle, action);
    checksum = (checksum + hashString(JSON.stringify(events))) >>> 0;
  }

const ARTICLE = { m: 'Ο', f: 'Η', n: 'Το' };

function monLabel(ref, lang, battleKind) {
  const species = SPECIES[ref.sp];
  if (lang === 'en') {
    if (ref.side === 0) return species.n;
    return (battleKind === 'wild' ? 'Independent ' : 'Opposition ') + species.n;
  }
  if (ref.side === 0) return ARTICLE[species.g] + ' ' + species.n;
  const adjective = battleKind === 'wild' ? WILD_ADJECTIVE[species.g] : FOE_ADJECTIVE[species.g];
  return ARTICLE[species.g] + ' ' + adjective + ' ' + species.n;
}
function eventVars(vars, lang, battleKind) {
  const out = {};
  for (const name of Object.keys(vars || {})) {
    const value = vars[name];
    if (value && typeof value === 'object') { out[name] = monLabel(value, lang, battleKind); out[name + '_name'] = SPECIES[value.sp].n; }
    else if (name === 'move') out[name] = MOVES[value].n;
    else if (name === 'item') out[name] = lookupString('item.' + value, lang);
    else if (name === 'stat') out[name] = lookupString('stat.' + value, lang);
    else out[name] = value;
  }

}

function paintMap(width, height, fill, operations) {
  const grid = [];
  for (let y = 0; y < height; y++) grid.push(new Array(width).fill(fill));
  const put = function (char, x, y) { if (y >= 0 && y < height && x >= 0 && x < width) grid[y][x] = char; };
  for (const op of operations) {
    if (op[0] === 'rect') for (let y = op[3]; y < op[3] + op[5]; y++) for (let x = op[2]; x < op[2] + op[4]; x++) put(op[1], x, y);
    if (op[0] === 'px') put(op[1], op[2], op[3]);
    if (op[0] === 'path') {
      const points = op[2];
      for (let i = 0; i + 1 < points.length; i++) {
        const [x1, y1] = points[i];
        const [x2, y2] = points[i + 1];
        for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) put(op[1], x, y);
      }
    }
  }
  return grid.map(function (row) { return row.join(''); });
}

const DEFAULT_HEAL_SPOT = { map: 'kep', x: 4, y: 6, dir: 'up' }; // black-out destination until a ΚΕΠ visit

function tileAt(map, x, y) {
  if (y < 0 || y >= map.h || x < 0 || x >= map.w) return ' ';
  return map.rows[y][x];
}
function tileDef(map, x, y) { return TILE_DEFS[tileAt(map, x, y)] || { solid: true }; }
function npcVisible(npc, flags) {
  if (npc.showFlag && !flags[npc.showFlag]) return false;
  if (npc.hideFlag && flags[npc.hideFlag]) return false;
  if (npc.kind === 'trainer' && npc.trainer === 'rival2' && flags.t_rival2) return false; // he leaves after the second fight
  return true;
}
function findWarp(map, x, y) {
  for (const warp of map.warps) if (warp.x === x && warp.y === y) return warp;
  return null;
}
function warpOpen(warp, flags) { return !warp.needFlag || !!flags[warp.needFlag]; }
function npcAtTile(map, x, y, flags) {
  for (const npc of map.npcs) if (npc.x === x && npc.y === y && npcVisible(npc, flags)) return npc;
  return null;
}
function tileWalkable(map, x, y, flags) {
  if (tileDef(map, x, y).solid) return false;
  if (npcAtTile(map, x, y, flags)) return false;
  const warp = findWarp(map, x, y);
  if (warp && !warpOpen(warp, flags)) return false;
  return true;
}
function zoneAt(map, x) {
  for (const zone of map.zones || []) if (x >= zone.x0 && x <= zone.x1) return zone;
  return null;
}
// Returns { sp, lv } for a wild encounter, or null. Uses the seeded RNG only.
function rollEncounter(rng, map, x, y) {
  if (!tileDef(map, x, y).grass) return null;
  if (rng() >= ENCOUNTER_CHANCE) return null;
  const zone = zoneAt(map, x);
  if (!zone) return null;
  const entry = pickWeighted(rng, zone.table);
  return { sp: entry.sp, lv: randInt(rng, entry.min, entry.max) };
}
// Reachability helper: every (map, x, y) a player can walk to from a start, following warps.
// flags: story flags (gated doors open when their flag is set).
function reachableTiles(startMap, startX, startY, flags) {
  const seen = new Set();
  const queue = [[startMap, startX, startY]];
  seen.add(startMap + ':' + startX + ':' + startY);
  const steps = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (queue.length > 0) {
    const [mapId, x, y] = queue.shift();
    const map = MAPS[mapId];
    for (const [dx, dy] of steps) {
      const nx = x + dx;
      const ny = y + dy;
      if (!tileWalkable(map, nx, ny, flags)) continue;
      const key = mapId + ':' + nx + ':' + ny;
      if (seen.has(key)) continue;
      seen.add(key);
      queue.push([mapId, nx, ny]);
      const warp = findWarp(map, nx, ny);
      if (warp) {
        const targetKey = warp.to + ':' + warp.tx + ':' + warp.ty;
        if (!seen.has(targetKey)) { seen.add(targetKey); queue.push([warp.to, warp.tx, warp.ty]); }
      }
    }
  }
  return seen;
}
// Can the player stand somewhere that lets them talk to this NPC (directly or across a counter)?
function npcTalkable(mapId, npc, reached) {
  const map = MAPS[mapId];
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const ax = npc.x + dx;
    const ay = npc.y + dy;
    if (reached.has(mapId + ':' + ax + ':' + ay)) return true;
    if (tileDef(map, ax, ay).counter && reached.has(mapId + ':' + (ax + dx) + ':' + (ay + dy))) return true;
  }
  return false;
}

function defaultOptions() { return { lang: 'el', sound: true, textSpeed: 1, reduceMotion: false }; }
function normalizeOptions(raw) {
  const base = defaultOptions();
  if (!raw || typeof raw !== 'object') return base;
  if (raw.lang === 'en' || raw.lang === 'el') base.lang = raw.lang;
  if (typeof raw.sound === 'boolean') base.sound = raw.sound;
  if (raw.textSpeed === 0 || raw.textSpeed === 1 || raw.textSpeed === 2) base.textSpeed = raw.textSpeed;
  if (typeof raw.reduceMotion === 'boolean') base.reduceMotion = raw.reduceMotion;
  return base;
}
function serializeMon(mon) {
  return { sp: mon.sp, lv: mon.lv, xp: mon.xp, hp: mon.hp, moves: mon.moves.slice(), pend: mon.pend.slice() };
}
function restoreMon(raw) {
  if (!raw || !SPECIES[raw.sp]) return null;
  const lv = Math.max(1, Math.min(MAX_LEVEL, Math.floor(Number(raw.lv) || 1)));
  const mon = makeMon(raw.sp, lv);
  if (Number.isFinite(raw.xp)) mon.xp = Math.max(xpForLevel(lv), raw.xp);
  if (Array.isArray(raw.moves)) {
    const moves = raw.moves.filter(function (id) { return MOVES[id]; }).slice(0, MOVES_MAX);
    if (moves.length > 0) mon.moves = moves;
  }
  if (Array.isArray(raw.pend)) mon.pend = raw.pend.filter(function (id) { return MOVES[id]; });
  if (Number.isFinite(raw.hp)) mon.hp = Math.max(0, Math.min(maxHp(mon), Math.floor(raw.hp)));
  return mon;
}
// A version 0 save is the shape of the first prototype: flat fields, "team" and "items".
function migrateV0(old) {
  const bag = {};
  for (const id of Object.keys(old.items || {})) if (ITEMS[id]) bag[id] = Math.max(0, Math.floor(Number(old.items[id]) || 0));
  const seen = {};
  const got = {};
  for (const id of old.seen || []) seen[id] = true;
  for (const id of old.got || []) { got[id] = true; seen[id] = true; }
  // The first prototype had no story flags. Rebuild the ones that can be told from the data:
  // a creature on the team means the starter was chosen; a player outside the lab has met the
  // rival (the meeting happens on the doorstep when leaving the lab).
  const flags = {};
  const team = Array.isArray(old.team) ? old.team : [];
  if (team.length > 0) flags.gotStarter = true;
  if (team.length > 0 && MAPS[old.map] && old.map !== START_MAP.map) { flags.rival1 = true; flags.t_rival1 = true; }
  return {
    version: 1,
    player: { name: String(old.name || 'ΝΙΚΟΣ').slice(0, NAME_MAX), gender: old.girl ? 'f' : 'm', map: old.map, x: old.x, y: old.y, dir: 'down' },
    party: (old.team || []).map(function (member) { return { sp: member.id, lv: member.lv, xp: member.xp, hp: member.hp }; }),
    money: old.drachmas, bag: bag, dex: { seen: seen, got: got }, flags: flags, lastHeal: null, options: null, rngState: 12345, starter: old.starter,
  };
}
// Returns a clean version-1 save object, or null when the data is unusable or from a newer game.
function migrateSave(raw) {
  if (!raw || typeof raw !== 'object') return null;
  let save = raw;
  const version = typeof raw.version === 'number' ? raw.version : (typeof raw.v === 'number' ? raw.v : 0);
  if (version > SAVE_VERSION) return null;
  if (version < 1) save = migrateV0(raw);
  const party = (Array.isArray(save.party) ? save.party : []).map(restoreMon).filter(Boolean).slice(0, PARTY_MAX);
  if (party.length === 0) return null;
  const player = save.player || {};
  const startMap = MAPS[player.map] ? player.map : START_MAP.map;
  const map = MAPS[startMap];
  const useStart = !(MAPS[player.map] && tileWalkable(map, player.x, player.y, save.flags || {}));
  const bag = {};
  for (const id of ITEM_IDS) bag[id] = Math.max(0, Math.floor(Number((save.bag || {})[id]) || 0));
  const dex = { seen: {}, got: {} };
  for (const id of DEX_ORDER) {
    if (save.dex && save.dex.seen && save.dex.seen[id]) dex.seen[id] = true;
    if (save.dex && save.dex.got && save.dex.got[id]) { dex.got[id] = true; dex.seen[id] = true; }
  }
  for (const mon of party) { dex.seen[mon.sp] = true; dex.got[mon.sp] = true; }
  const heal = save.lastHeal && MAPS[save.lastHeal.map] ? save.lastHeal : DEFAULT_HEAL_SPOT;
  return {
    version: SAVE_VERSION,
    player: {
      name: String(player.name || 'ΝΙΚΟΣ').slice(0, NAME_MAX), gender: player.gender === 'f' ? 'f' : 'm',
      map: useStart ? START_MAP.map : player.map, x: useStart ? START_MAP.x : player.x, y: useStart ? START_MAP.y : player.y,
      dir: ['up', 'down', 'left', 'right'].includes(player.dir) ? player.dir : 'down',
    },
    party: party.map(serializeMon),
    money: Math.max(0, Math.floor(Number(save.money) || 0)),
    bag: bag, dex: dex, flags: (save.flags && typeof save.flags === 'object') ? Object.assign({}, save.flags) : {},
    lastHeal: { map: heal.map, x: heal.x, y: heal.y, dir: heal.dir || 'up' },
    options: normalizeOptions(save.options),
    rngState: Number.isFinite(save.rngState) ? save.rngState >>> 0 : 12345,
    starter: STARTERS.includes(save.starter) ? save.starter : party[0].sp,
  };
}

  'cafe.hello': ['Καφενείο «Η Κρίση». Έλα να τα πούμε. Ελληνικός, μέτριος, με λίγη οικονομία.', 'Cafe "The Crisis". Come, let us talk. Greek coffee, medium, with a little economics.'],

  // People
  'npc.kid': ['Έδωσα εξετάσεις 12 φορές. Ο Μπέμπης πέρασε με ένα τηλεφώνημα.', 'I took the exam 12 times. Bebis passed with one phone call.'],
  'npc.oldman': ['Στον καιρό μου το Δημόσιο έκλεινε στις 3. Τώρα κλείνει και στις 2:59.', 'In my day the civil service closed at 3. Now it closes at 2:59.'],
  'npc.fisher': ['Ψαρεύω στον ποταμό της αναμονής. Το λιμάνι πλημμύρισε το 2500 και συστάθηκε επιτροπή.', 'I fish in the river of waiting. The port flooded in 2500 and a committee was formed.'],
  'npc.student': ['Είμαι ο βοηθός του Καθηγητή. Δουλεύω εθελοντικά. Δηλαδή με ξέχασαν.', "I am the Professor's assistant. I work as a volunteer. Meaning they forgot me."],
  'npc.prof.1': ['Πήγαινε, {name}! Έξω σε περιμένει η ζωή. Και ο Μπέμπης.', 'Go on, {name}! Life awaits outside. And Bebis.'],
  'npc.prof.1b': ['Ο Μπέμπης; Το ξέρω, έχει θείους παντού. Εσύ έχεις Mizamon. Προχώρα στη Διαδρομή 1.', 'Bebis? I know, he has uncles everywhere. You have Mizamon. Head down Route 1.'],
  'npc.prof.2': ['Παράσημο, ε; Μπράβο! Τώρα μπορείς να ζητήσεις αύξηση. Εγώ περιμένω ακόμη τη δική μου.', 'A medal, eh? Well done! Now you can ask for a raise. I am still waiting for mine.'],
  'npc.prof.3': ['Άνοιξε Τηλεοπτικό Στούντιο στην πλατεία. Λένε ότι ο παρουσιαστής ψάχνει αντίπαλο. Και φάκελο.', 'A TV Studio opened in the square. They say the host is looking for a challenger. And an envelope.'],
  'npc.queue1': ['Περιμένω από την Τρίτη. Δεν θυμάμαι ποια Τρίτη.', 'I have been waiting since Tuesday. I do not remember which Tuesday.'],
  'npc.queue2': ['Ο αριθμός μου είναι 10.000. Ο μπαμπάς μου πήρε αριθμό το 2990.', 'My number is 10,000. My dad took a number in 2990.'],
  'npc.customer': ['Ήρθα για ένα κουλούρι και έφυγα με φορολογική δήλωση.', 'I came for a koulouri and left with a tax return.'],
  'npc.tavli1': ['Αν ο Μπέμπης γίνεται υπουργός, εγώ λύνω την οικονομία. Έλα, ρίξε ζάρια.', 'If Bebis can become a minister, I can fix the economy. Come on, roll the dice.'],
  'npc.tavli2': ['Πεντέ-έξι. Αυτό ήταν το ελληνικό ΑΕΠ το 2400.', 'Five-six. That was the Greek GDP in 2400.'],
  'npc.sailor1': ['Ο Λιμενάρχης είναι εκεί. Μην αναφέρεις ότι το λιμάνι πουλήθηκε ήδη. Δύο φορές.', 'The Harbour Master is right there. Do not mention the port is already sold. Twice.'],
  'npc.sailor2': ['Δουλεύω εδώ 20 χρόνια. Ο μισθός μου είναι μια ιδέα. Μου αρέσει η ιδέα.', 'I have worked here 20 years. My salary is an idea. I like the idea.'],
  'rival1.intro1': ['Ε, εσύ! Εσύ είσαι που πήρες Mizamon από τον Καθηγητή; Εγώ πήρα το δικό μου με ένα τηλεφώνημα.', 'Hey, you! You are the one who got a Mizamon from the Professor? I got mine with one phone call.'],
  'rival1.intro2': ['Με λένε Μπέμπη. Ο θείος μου είναι υπουργός. Ο άλλος θείος μου είναι υπουργός. Ο τρίτος... βρες {μόνος|μόνη}. ΜΑΧΗ!', 'I am Bebis. My uncle is a minister. My other uncle is a minister. The third... figure it out. BATTLE!'],
  'rival1.win': ['Χα! Το ήξερα. Γεννήθηκα νικητής. Και με βύσμα.', 'Ha! I knew it. I was born a winner. And with connections.'],
  'rival1.lose': ['Τι; Αυτό δεν... Θα το πω στον θείο! Θα σε βάλω σε εξεταστική επιτροπή!', 'What? That is not... I will tell my uncle! I will put you before an inquiry committee!'],
  'tr.phoebe.intro': ['Γεια σας, φίλοι μου! Σήμερα κάνουμε unboxing... ΜΑΧΗ! Μην ξεχάσετε το like!', 'Hi friends! Today we do an unboxing... BATTLE! Do not forget to like!'],
  'tr.phoebe.win': ['Θα το μοντάρω αλλιώς. Θα φαίνεται ότι κέρδισα.', 'I will edit it differently. It will look like I won.'],
  'tr.phoebe.after': ['Έχασα ακολούθους. Αλλά όχι αυτούς που αγόρασα.', 'I lost followers. Not the ones I bought, though.'],
  'tr.stelios.intro': ['Έλεγχος ταυτότητας! Για λόγους ασφαλείας. Μόνο τα δικά σου χαρτιά.', 'ID check! For security reasons. Only your papers.'],
  'tr.stelios.win': ['Ήταν άσκηση ετοιμότητας. Δεν έγινε τίποτα. Αρχειοθετείται.', 'That was a readiness exercise. Nothing happened. Filed away.'],
  'tr.stelios.after': ['Δεν υπήρξε περιστατικό. Κυκλοφορήστε.', 'There was no incident. Move along.'],
  'tr.takis.intro': ['Στο πάλκο, {φίλε|φίλη}! Το μπουζούκι θέλει φωνή και ο κόσμος θέλει ψυχή.', 'To the stage, friend! The bouzouki wants a voice and the crowd wants a soul.'],
  'tr.takis.win': ['Το τραγούδι ήταν καλύτερο από τη μάχη. Πάντα είναι.', 'The song was better than the fight. It always is.'],
  'tr.takis.after': ['Αύριο παίζω στην Τρούμπα. Αν με θυμηθούν.', 'Tomorrow I play in Troumpa. If they remember me.'],
  'tr.rival2.intro': ['Α, εσύ πάλι! Ο θείος μου ο υπουργός είπε να σε νικήσω. Δεν τον ρώτησα πώς.', 'Oh, you again! My uncle the minister told me to beat you. I did not ask him how.'],
  'tr.rival2.win': ['Θα τηλεφωνήσω σε κάποιον. Αυτό δεν μετράει! Αυτό δεν μετράει!', 'I will call someone. This does not count! This does not count!'],
  'tr.rival2.after': ['Ο Μπέμπης έφυγε. Κάποιος του τηλεφώνησε.', 'Bebis left. Someone called him.'],
  'tr.kotsos.intro': ['Καλώς ήρθες στο Λιμεναρχείο. Το λιμάνι είναι δικό μου... αυτή τη σεζόν. Να δούμε τι ομάδα έχεις, {ανιψιέ|ανιψιά}.', 'Welcome to the Harbour Office. The port is mine... this season. Let us see what team you have, nephew.'],
  'tr.kotsos.win': ['Ε, μπράβο. Θα πουλήσω ξανά το λιμάνι για να το γιορτάσω.', 'Well, congratulations. I will sell the port again to celebrate.'],
  'tr.kotsos.after': ['Το λιμάνι είναι πουλημένο. Ξανά. Να προσέχεις στον δρόμο.', 'The port is sold. Again. Take care on the road.'],
  'tr.host.intro': ['Καλησπέρα και καλώς ήρθατε στην εκπομπή «Όλοι Μαζί, Κανείς Μόνος»! Απόψε: ΕΣΥ εναντίον των καλεσμένων μου. Παίζουμε ζωντανά, δηλαδή ηχογραφημένα!', 'Good evening and welcome to the show "All Together, No One Alone"! Tonight: YOU against my guests. We play live, meaning recorded!'],
  'tr.host.win': ['Και κόβουμε για διαφημίσεις. Μείνετε μαζί μας. Δεν έχετε άλλη επιλογή.', 'And we cut to a commercial break. Stay with us. You have no other choice.'],
  'tr.host.after': ['Η εκπομπή συνεχίζεται. Όπως και τα ρέστα του καναλιού.', "The show goes on. So does the channel's budget."],
  'blackout.text': ['Όλη η ομάδα σου παραιτήθηκε και το πορτοφόλι ελαφρύνθηκε στο μισό. Η δημοσκόπησή σου πήρε την κατηφόρα.', 'Your whole team resigned and the wallet got half lighter. Your poll numbers took the downhill road.'],
  'blackout.kep': ['Σε περιμάζεψε το ΚΕΠ 3000. Η ομάδα σου εξυπηρετήθηκε χωρίς αριθμό. Αυτό είναι το πιο ανησυχητικό.', 'ΚΕΠ 3000 picked you up. Your team was served without a number. That is the most worrying part.'],
  'boss.win2': ['Ωραία, ωραία. Το Παράσημο είναι δικό σου, με τον όρο να μη ρωτήσεις πού πήγαν τα λεφτά.', 'Fine, fine. The medal is yours, on the condition that you do not ask where the money went.'],
  'boss.win3': ['Πήρες το Παράσημο της Νέας Πειραιάς! Η πρώτη εκλογική περιφέρεια είναι δική σου.', 'You got the New Piraeus Medal! The first electoral district is yours.'],
  'badge.title': ['ΠΑΡΑΣΗΜΟ ΝΕΑΣ ΠΕΙΡΑΙΑΣ', 'NEW PIRAEUS MEDAL'], 'badge.sub': ['Με τον όρο ότι δεν ρωτάς.', 'On the condition you do not ask.'],
  'credits.text': ['MIZAMON\n\nΤο τέλος της Πρώτης Περιφέρειας\n\nΣχεδιασμός, κώδικας, γραφικά, μουσική:\nόλα φτιαγμένα από κώδικα\n\nΟ Καθηγητής Σταθόπουλος\nεκπροσωπεί όλους όσους\nπεριμένουν πληρωμή\n\nΣάτιρα. Όλοι οι χαρακτήρες\nείναι παρωδίες ή φανταστικοί·\nκάθε ομοιότητα είναι καρικατούρα.\n\nΗ Βουλή του 3000 περιμένει...\n\nΕυχαριστούμε που έπαιξες!',
    'MIZAMON\n\nThe end of the First District\n\nDesign, code, graphics, music:\nall made from code\n\nProfessor Stathopoulos\nspeaks for everyone\nwaiting to be paid\n\nSatire. All characters\nare parodies or fictional;\nany resemblance is caricature.\n\nThe Parliament of 3000 awaits...\n\nThanks for playing!'],
  'credits.after': ['Ένα νέο κτίριο άνοιξε στην πλατεία της Νέας Πειραιάς: το Τηλεοπτικό Στούντιο. Λένε ότι ψάχνει αντίπαλο.', 'A new building opened in the New Piraeus square: the TV Studio. They say it is looking for a challenger.'],

// ---- Pixel pens: small drawing helpers for procedural pixel art -------------------------
function makePen(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  const pen = {
    canvas: canvas, g: g,
    px: function (x, y, color) { g.fillStyle = color; g.fillRect(x, y, 1, 1); },
    rect: function (x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); },
    ell: function (cx, cy, rx, ry, color) { // filled ellipse, one scanline at a time
      g.fillStyle = color;
      for (let y = -ry; y <= ry; y++) {
        const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / ((ry + 0.5) * (ry + 0.5)))));
        g.fillRect(cx - half, cy + y, half * 2 + 1, 1);
      }
    },
    line: function (x1, y1, x2, y2, color) {
      g.fillStyle = color;
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1), 1);
      for (let i = 0; i <= steps; i++) g.fillRect(Math.round(x1 + (x2 - x1) * i / steps), Math.round(y1 + (y2 - y1) * i / steps), 1, 1);
    },
    tri: function (x1, y1, x2, y2, x3, y3, color) {
      g.fillStyle = color;
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath(); g.fill();
    },
    outline: function (color) { // 1 px dark outline around everything that is drawn
      const image = g.getImageData(0, 0, width, height);
      const data = image.data;
      const solid = new Uint8Array(width * height);
      for (let i = 0; i < solid.length; i++) solid[i] = data[i * 4 + 3] > 0 ? 1 : 0;
      const rgb = hexToRgb(color);
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const index = y * width + x;
          if (solid[index]) continue;
          const near = (x > 0 && solid[index - 1]) || (x < width - 1 && solid[index + 1]) || (y > 0 && solid[index - width]) || (y < height - 1 && solid[index + width]);
          if (near) { data[index * 4] = rgb[0]; data[index * 4 + 1] = rgb[1]; data[index * 4 + 2] = rgb[2]; data[index * 4 + 3] = 255; }
        }
      }
      g.putImageData(image, 0, 0);
    },
  };

}
function hexToRgb(hex) {
  const value = parseInt(hex.slice(1), 16);
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}
function shade(hex, amount) { // amount -1..1 : darker or lighter
  const rgb = hexToRgb(hex).map(function (c) { return Math.max(0, Math.min(255, Math.round(amount < 0 ? c * (1 + amount) : c + (255 - c) * amount))); });
  return '#' + rgb.map(function (c) { return c.toString(16).padStart(2, '0'); }).join('');
}

function drawCharFrame(p, ox, oy, look, dir, frame) {
  const dark = shade(look.top, -0.3);
  const stepLeft = frame === 1;
  const stepRight = frame === 2;
  // legs and shoes
  p.rect(ox + 5, oy + 13, 3, stepLeft ? 1 : 2, look.pants);
  p.rect(ox + 8, oy + 13, 3, stepRight ? 1 : 2, look.pants);
  p.rect(ox + 5, oy + (stepLeft ? 14 : 15), 3, 1, '#222');
  p.rect(ox + 8, oy + (stepRight ? 14 : 15), 3, 1, '#222');
  // body
  p.rect(ox + 4, oy + 8, 8, 5, look.top);
  p.rect(ox + 4, oy + 8, 1, 5, dark);
  p.rect(ox + 11, oy + 8, 1, 5, dark);
  if (look.skirt) p.rect(ox + 4, oy + 12, 8, 2, look.top);
  if (look.coat) { p.rect(ox + 4, oy + 8, 8, 7, look.top); p.rect(ox + 7, oy + 10, 2, 5, '#cfcfcf'); }
  if (look.apron) p.rect(ox + 5, oy + 10, 6, 5, look.apron);
  if (look.stripes) for (let y = 9; y < 13; y += 2) p.rect(ox + 4, oy + y, 8, 1, look.stripes);
  p.px(ox + 4, oy + 12, look.skin); p.px(ox + 11, oy + 12, look.skin);
  // head
  p.rect(ox + 5, oy + 2, 6, 6, look.skin);
  if (dir === 'up') {
    p.rect(ox + 5, oy + 1, 6, 6, look.hair);
  } else {
    if (look.style !== 'bald') p.rect(ox + 5, oy + 1, 6, 2, look.hair);
    else p.rect(ox + 5, oy + 1, 6, 1, look.hair);
    if (look.style === 'long' || look.style === 'bun') {
      p.rect(ox + 4, oy + 2, 1, 6, look.hair); p.rect(ox + 11, oy + 2, 1, 6, look.hair);
    }
    if (look.style === 'pomp') { p.rect(ox + 5, oy + 0, 6, 2, look.hair); p.rect(ox + 4, oy + 2, 1, 2, look.hair); p.rect(ox + 11, oy + 2, 1, 2, look.hair); }
    if (look.style === 'bun') p.rect(ox + 6, oy + 0, 4, 1, look.hair);
    if (look.style === 'bald') { p.px(ox + 4, oy + 3, look.hair); p.px(ox + 11, oy + 3, look.hair); }
    if (dir === 'down') {
      p.px(ox + 6, oy + 5, '#1a1a1a'); p.px(ox + 9, oy + 5, '#1a1a1a');
      if (look.glasses) { p.rect(ox + 5, oy + 5, 3, 1, '#222'); p.rect(ox + 8, oy + 5, 3, 1, '#222'); }
      if (look.mustache) p.rect(ox + 6, oy + 6, 4, 1, shade(look.hair, -0.4));
      if (look.pacifier) { p.rect(ox + 7, oy + 7, 2, 1, '#e8e040'); p.px(ox + 8, oy + 8, '#e8e040'); }
      if (look.tie) p.rect(ox + 7, oy + 8, 2, 4, look.tie);
      if (look.bowtie) { p.rect(ox + 6, oy + 8, 4, 1, look.bowtie); }
      if (look.mic) { p.rect(ox + 12, oy + 9, 1, 3, '#aaa'); p.px(ox + 12, oy + 8, '#222'); }
      if (look.phone) { p.rect(ox + 12, oy + 7, 2, 4, '#222'); p.px(ox + 12, oy + 8, '#8fc3ee'); }
    } else if (dir === 'left') {
      p.px(ox + 6, oy + 5, '#1a1a1a');
      p.rect(ox + 8, oy + 2, 3, 5, look.hair);
      if (look.glasses) p.rect(ox + 5, oy + 5, 2, 1, '#222');
      if (look.mustache) p.rect(ox + 5, oy + 6, 2, 1, shade(look.hair, -0.4));
    }
  }
  if (look.hat) {
    p.rect(ox + 4, oy + 0, 8, 3, look.hat);
    p.rect(ox + 3, oy + 3, 10, 1, look.brim || shade(look.hat, -0.3));
  }
}
const charSheets = {};
function charSheet(lookId) {
  if (charSheets[lookId]) return charSheets[lookId];
  const p = makePen(48, 48);
  const look = LOOKS[lookId];
  ['down', 'up', 'left'].forEach(function (dir, row) {
    for (let frame = 0; frame < 3; frame++) drawCharFrame(p, frame * 16, row * 16, look, dir, frame);
  });
  charSheets[lookId] = p.canvas;
  return p.canvas;
}

// ---- Storage (works without localStorage) ----------------------------------------------------
const Store = {
  memory: {},
  forceMemory: false,
  get: function (key) {
    if (!this.forceMemory) {
      try { return window.localStorage.getItem(key); } catch (error) { /* private mode or blocked storage */ }
    }
    return Object.prototype.hasOwnProperty.call(this.memory, key) ? this.memory[key] : null;
  },
  set: function (key, value) {
    if (!this.forceMemory) {
      try { window.localStorage.setItem(key, value); return true; } catch (error) { /* fall back to memory */ }
    }
    this.memory[key] = value;
    return false;
  },
  remove: function (key) {
    if (!this.forceMemory) {
      try { window.localStorage.removeItem(key); } catch (error) { /* ignore */ }
    }
    delete this.memory[key];
  },
};

// ---- Game state and options ---------------------------------------------------------------------
let OPT = defaultOptions();
let G = null; // the running game; null on the title screen
const PREVIEW_PLAYER = { gender: 'm', name: 'ΝΙΚΟΣ' };
function newGameState(name, gender, starter) {
  const party = [makeMon(starter, 5)];
  const dexSeen = {};
  const dexGot = {};
  dexSeen[starter] = true;
  dexGot[starter] = true;
  return {
    player: { name: name, gender: gender, map: START_MAP.map, x: START_MAP.x, y: START_MAP.y, dir: START_MAP.dir },
    party: party, money: START_MONEY, bag: Object.assign({}, START_BAG), dex: { seen: dexSeen, got: dexGot }, flags: { gotStarter: true },
    lastHeal: Object.assign({}, DEFAULT_HEAL_SPOT), rng: makeRng(1), starter: starter, steps: 0,
  };
}
// Texts without variables are cached, so drawing code can call T() every frame without allocating.
const textCache = { el: { m: {}, f: {} }, en: { m: {}, f: {} } };
function resetTextCache() {
  for (const lang of ['el', 'en']) { textCache[lang].m = {}; textCache[lang].f = {}; }
}
function T(key, vars) {
  const gender = G ? G.player.gender : PREVIEW_PLAYER.gender;
  const name = G ? G.player.name : PREVIEW_PLAYER.name;
  if (vars === undefined) {
    const bucket = textCache[OPT.lang][gender];
    let cached = bucket[key];
    if (cached === undefined) { cached = formatText(lookupString(key, OPT.lang), { name: name }, gender); bucket[key] = cached; }
    return cached;
  }
  return formatText(lookupString(key, OPT.lang), Object.assign({ name: name }, vars), gender);
}
// With no saved choice, Reduced motion follows the operating system setting; the Options screen can change it.
function systemPrefersReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (error) { return false; }
}
function loadOptions() {
  let saved = null;
  try { saved = JSON.parse(Store.get(OPTIONS_KEY) || 'null'); } catch (error) { saved = null; }
  OPT = normalizeOptions(saved);
  if (!saved || typeof saved.reduceMotion !== 'boolean') OPT.reduceMotion = systemPrefersReducedMotion();
}
function saveOptions() {
  try { Store.set(OPTIONS_KEY, JSON.stringify(OPT)); } catch (error) { /* ignore */ }
}
function buildSaveObject() {
  return {
    version: SAVE_VERSION, player: Object.assign({}, G.player), party: G.party.map(serializeMon), money: G.money, bag: Object.assign({}, G.bag),
    dex: { seen: Object.assign({}, G.dex.seen), got: Object.assign({}, G.dex.got) }, flags: Object.assign({}, G.flags),
    lastHeal: Object.assign({}, G.lastHeal), options: Object.assign({}, OPT), rngState: G.rng.getState(), starter: G.starter,
  };
}
function writeSave() {
  try { return Store.set(SAVE_KEY, JSON.stringify(buildSaveObject())); } catch (error) { return false; }
}
function readSave() {
  try { return migrateSave(JSON.parse(Store.get(SAVE_KEY) || 'null')); } catch (error) { return null; }
}
function gameFromSave(save) {
  const state = {
    player: save.player, party: save.party.map(restoreMon), money: save.money, bag: save.bag, dex: save.dex, flags: save.flags,
    lastHeal: save.lastHeal, rng: makeRng(1), starter: save.starter, steps: 0,
  };
  state.rng.setState(save.rngState);
  return state;
}

// ---- Canvas and scaling ---------------------------------------------------------------------------
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = document.getElementById('stage');
const touchPad = document.getElementById('touch');
let viewScale = 1;
let touchVisible = false;
let touchForced = null;
const TOUCH_SIDE_WIDTH = 160; // CSS px a landscape button pad needs (the d-pad is 152 px wide)
function detectTouch() {
  if (touchForced !== null) return touchForced;
  return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
}
function resizeScreen() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const viewW = window.innerWidth;
  const viewH = window.innerHeight;
  touchVisible = detectTouch();
  const portrait = viewH > viewW;
  const reservedBottom = touchVisible && portrait ? Math.min(Math.round(viewH * 0.4), 300) : 0;
  // Landscape with touch: the two button pads stand beside the game, never over it.
  const reservedSides = touchVisible && !portrait ? 2 * TOUCH_SIDE_WIDTH : 0;
  let scale = Math.min((viewW - reservedSides) / SCREEN_W, (viewH - reservedBottom) / SCREEN_H);
  scale = Math.max(scale, 0.5); // a tiny window must still give a drawable canvas
  if (scale >= 2) scale = Math.floor(scale); // whole-number scaling when there is room (crisp pixels)
  const cssW = Math.floor(SCREEN_W * scale);
  const cssH = Math.floor(SCREEN_H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  viewScale = canvas.width / SCREEN_W;
  stage.style.justifyContent = touchVisible && portrait ? 'flex-start' : 'center';
  touchPad.style.display = touchVisible ? 'block' : 'none';
  touchPad.className = portrait ? 'portrait' : 'landscape';
  touchPad.style.height = portrait ? (viewH - cssH) + 'px' : '100%';
}

// ---- Drawing helpers ------------------------------------------------------------------------------------
function drawText(text, x, y, color, align) {
  ctx.fillStyle = color || COLOR.ink;
  ctx.textAlign = align || 'left';
  ctx.fillText(text, x, y);
}
function drawPanel(x, y, w, h) {
  ctx.fillStyle = COLOR.border; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = COLOR.paperDark; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = COLOR.paper; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.fillStyle = COLOR.border; ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + w - 1, y, 1, 1); ctx.fillRect(x, y + h - 1, 1, 1); ctx.fillRect(x + w - 1, y + h - 1, 1, 1);
}
function drawBar(x, y, w, h, fraction) {
  ctx.fillStyle = COLOR.border; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = COLOR.hpBack; ctx.fillRect(x, y, w, h);
  const clamped = Math.max(0, Math.min(1, fraction));
  ctx.fillStyle = clamped > 0.5 ? COLOR.hpGreen : (clamped > 0.2 ? COLOR.hpYellow : COLOR.hpRed);
  ctx.fillRect(x, y, Math.round(w * clamped), h);
}
function drawSprite(image, x, y, scale, flip) {
  const w = image.width * scale;
  const h = image.height * scale;
  if (flip) {
    ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(image, 0, 0, w, h); ctx.restore();
  } else ctx.drawImage(image, x, y, w, h);
}
function drawTypeTag(typeId, x, y) {
  ctx.font = FONT_SMALL;
  const label = T('type.' + typeId);
  const width = Math.ceil(ctx.measureText(label).width) + 6;
  ctx.fillStyle = COLOR.border; ctx.fillRect(x, y, width, 10);
  ctx.fillStyle = TYPE_COLORS[typeId]; ctx.fillRect(x + 1, y + 1, width - 2, 8);
  drawText(label, x + 3, y + 1, '#ffffff');
  ctx.font = FONT;
  return width;
}
function wrapText(text, maxWidth, font) {
  ctx.font = font || FONT;
  const lines = [];
  for (const paragraph of text.split('\n')) {
    let line = '';
    for (const word of paragraph.split(' ')) {
      const candidate = line === '' ? word : line + ' ' + word;
      if (line !== '' && ctx.measureText(candidate).width > maxWidth) { lines.push(line); line = word; }
      else line = candidate;
    }
    lines.push(line);
  }
  return lines;
}

const Sound = {
  context: null, master: null, trackId: null, step: 0, nextTime: 0, timer: null, wanted: null,
  unlock: function () {
    if (!this.context) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        this.context = new AudioContextClass();
        this.master = this.context.createGain();
        this.master.connect(this.context.destination);
        this.applyMute();
      } catch (error) { this.context = null; return; }
    }
    if (this.context.state === 'suspended') this.context.resume();
    if (this.wanted && !this.timer) this.play(this.wanted);
  },
  applyMute: function () { if (this.master) this.master.gain.value = OPT.sound ? 0.5 : 0; },
  tone: function (frequency, start, duration, type, volume, slideTo) {
    if (!this.context || !OPT.sound) return;
    const oscillator = this.context.createOscillator();
    const gain = this.context.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    if (slideTo) oscillator.frequency.linearRampToValueAtTime(slideTo, start + duration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(volume, start + 0.006);
    gain.gain.linearRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain);
    gain.connect(this.master);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.02);
  },
  sfx: function (name) {
    if (!this.context || !OPT.sound) return;
    const pattern = SFX_PATTERNS[name];
    if (!pattern) return;
    const now = this.context.currentTime;
    for (const note of pattern) this.tone(note[0], now + note[4], note[1], note[2], note[3], note[5]);
  },
  play: function (id) {
    this.wanted = id;
    if (!this.context || this.trackId === id) return;
    this.trackId = id;
    this.step = 0;
    this.nextTime = this.context.currentTime + 0.05;
    if (!this.timer) this.timer = setInterval(this.schedule.bind(this), 60);
  },
  stop: function () { this.wanted = null; this.trackId = null; },
  schedule: function () {
    if (!this.context || !this.trackId) return;
    const track = MUSIC_TRACKS[this.trackId];
    const stepLength = 60 / track.bpm / 2;
    while (this.nextTime < this.context.currentTime + 0.25) {
      const index = this.step % track.lead.length;
      const lead = track.lead[index];
      const bass = track.bass[index];
      if (lead) this.tone(440 * Math.pow(2, (lead - 69) / 12), this.nextTime, stepLength * 0.9, 'square', 0.045);
      if (bass) this.tone(440 * Math.pow(2, (bass - 69) / 12), this.nextTime, stepLength * 1.6, 'triangle', 0.09);
      this.nextTime += stepLength;
      this.step++;
    }
  },
};

// ---- Layers: a stack of screens; only the top one gets input ------------------------------------------------------
const layers = [];
function pushLayer(layer) {
  layers.push(layer);
  if (layer.onEnter) layer.onEnter();
  return layer;
}
function removeLayer(layer) {
  const index = layers.indexOf(layer);
  if (index >= 0) layers.splice(index, 1);
}
// Opens a layer and waits until it closes itself with layer.close(value).
function openLayer(layer) {
  return new Promise(function (resolve) {
    layer.resolve = resolve;
    pushLayer(layer);
  });
}
function closeLayer(layer, value) {
  removeLayer(layer);
  if (layer.resolve) { const resolve = layer.resolve; layer.resolve = null; resolve(value); }
}
function updateLayers() {
  const top = layers[layers.length - 1];
  if (top) top.update();
  // layers below the top may animate (overworld NPCs) when they ask for it
  for (let i = 0; i < layers.length - 1; i++) if (layers[i].backgroundUpdate) layers[i].backgroundUpdate();
}
function drawLayers() {
  let first = layers.length - 1;
  while (first > 0 && !layers[first].opaque) first--;
  for (let i = Math.max(0, first); i < layers.length; i++) layers[i].draw();
}

// ---- Fade (screen transitions) ----------------------------------------------------------------------------------------
const Fade = {
  alpha: 0, from: 0, to: 0, frame: 0, frames: 0, resolve: null,
  start: function (target, frames) {
    if (OPT.reduceMotion || frames <= 0) { this.alpha = target; return Promise.resolve(); }
    this.from = this.alpha; this.to = target; this.frame = 0; this.frames = frames;
    return new Promise(function (resolve) { Fade.resolve = resolve; });
  },
  update: function () {
    if (this.frames <= 0) return;
    this.frame++;
    this.alpha = this.from + (this.to - this.from) * Math.min(1, this.frame / this.frames);
    if (this.frame >= this.frames) { this.frames = 0; const resolve = this.resolve; this.resolve = null; if (resolve) resolve(); }
  },
  draw: function () {
    if (this.alpha <= 0.001) return;
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.globalAlpha = 1;
  },
};

// ---- Text box (typewriter text with pages) ---------------------------------------------------------------------------------
const TEXT_SPEEDS = [0.45, 1, 3]; // characters per frame for slow, normal, fast
function TextBox(width, linesPerPage) {
  this.width = width;
  this.linesPerPage = linesPerPage;
  this.lines = [];
  this.page = 0;
  this.shown = 0;
  this.total = 0;
  this.typed = 0;
}
TextBox.prototype.setText = function (text) {
  this.lines = wrapText(text, this.width);
  this.page = 0;
  this.beginPage();
};
TextBox.prototype.beginPage = function () {
  let total = 0;
  for (let i = this.page * this.linesPerPage; i < Math.min(this.lines.length, (this.page + 1) * this.linesPerPage); i++) total += this.lines[i].length;
  this.total = total;
  this.typed = 0;
};
TextBox.prototype.isTyping = function () { return this.typed < this.total; };
TextBox.prototype.hasMorePages = function () { return (this.page + 1) * this.linesPerPage < this.lines.length; };
TextBox.prototype.update = function () {
  if (this.typed < this.total) this.typed = Math.min(this.total, this.typed + TEXT_SPEEDS[OPT.textSpeed]);
};
// A press: finish typing, go to the next page, or report that the text is finished.
TextBox.prototype.advance = function () {
  if (this.isTyping()) { this.typed = this.total; return false; }
  if (this.hasMorePages()) { this.page++; this.beginPage(); return false; }
  return true;
};
TextBox.prototype.draw = function (x, y, lineHeight, color) {
  let remaining = Math.floor(this.typed);
  const start = this.page * this.linesPerPage;
  for (let i = start; i < Math.min(this.lines.length, start + this.linesPerPage); i++) {
    const line = this.lines[i];
    if (remaining <= 0) break;
    drawText(remaining >= line.length ? line : line.slice(0, remaining), x, y + (i - start) * lineHeight, color);
    remaining -= line.length;
  }
};

// ---- Choice menu (small list that returns the chosen index, or -1 for back) --------------------------------------------------
// items: array of strings or { label, disabled }. options: x, y, w, cancel (default true), start.
function ChoiceLayer(items, options) {
  const o = options || {};
  this.opaque = false;
  this.items = items.map(function (item) { return typeof item === 'string' ? { label: item } : item; });
  this.x = o.x === undefined ? 150 : o.x;
  this.y = o.y === undefined ? 70 : o.y;
  this.w = o.w || 84;
  this.cancel = o.cancel !== false;
  this.cursor = o.start || 0;
  this.title = o.title || null;
  this.onMove = o.onMove || null;
  this.rowHeight = 12;
  this.h = this.items.length * this.rowHeight + 8 + (this.title ? 12 : 0);
  if (o.bottom !== undefined) this.y = o.bottom - this.h;
}
ChoiceLayer.prototype.update = function () {
  const count = this.items.length;
  if (Input.repeat.up) { this.cursor = (this.cursor + count - 1) % count; Sound.sfx('move'); if (this.onMove) this.onMove(this.cursor); }
  if (Input.repeat.down) { this.cursor = (this.cursor + 1) % count; Sound.sfx('move'); if (this.onMove) this.onMove(this.cursor); }
  if (Input.pressed.a) {
    if (this.items[this.cursor].disabled) { Sound.sfx('error'); return; }
    Sound.sfx('confirm');
    closeLayer(this, this.cursor);
  } else if (Input.pressed.b && this.cancel) { Sound.sfx('back'); closeLayer(this, -1); }
};
ChoiceLayer.prototype.draw = function () {
  drawPanel(this.x, this.y, this.w, this.h);
  ctx.font = FONT;
  let top = this.y + 5;
  if (this.title) { drawText(this.title, this.x + 6, top, COLOR.red); top += 12; }
  for (let i = 0; i < this.items.length; i++) {
    const item = this.items[i];
    const color = item.disabled ? COLOR.gray : COLOR.ink;
    if (i === this.cursor) { ctx.fillStyle = COLOR.red; ctx.fillRect(this.x + 5, top + i * this.rowHeight + 2, 3, 5); }
    drawText(item.label, this.x + 11, top + i * this.rowHeight, color);
  }
};
function choose(items, options) { return openLayer(new ChoiceLayer(items, options)); }
async function askYesNo(key, vars) {
  const prompt = new DialogLayer(T(key, vars));
  prompt.waitForChoice = true;
  pushLayer(prompt);
  while (prompt.box.isTyping()) await nextFrame();
  const answer = await choose([T('ui.yes'), T('ui.no')], { x: 170, bottom: DIALOG_BOX.y - 2, w: 64, start: 0 });
  closeLayer(prompt);
  return answer === 0;
}

// ---- Frame helpers -----------------------------------------------------------------------------------------------------------
let frameWaiters = [];

  const waiters = frameWaiters;

// ---- Overworld ---------------------------------------------------------------------------------------
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
const MOVE_FRAMES = 10;
const SHEET_ROW = { down: 0, up: 1, left: 2, right: 2 };

function OverworldLayer() {
  this.opaque = true;
  this.busy = false;
  this.tick = 0;
  this.move = null;
  this.lastDir = 'down';
  this.exclaim = null;
  this.popup = 0;
  this.npcs = [];
  this.tempNpcs = [];

}
OverworldLayer.prototype.loadMap = function (mapId, x, y, dir) {
  this.mapId = mapId;
  this.map = MAPS[mapId];
  this.px = x;
  this.py = y;
  this.dir = dir || 'down';
  this.move = null;
  this.tempNpcs = [];
  this.npcs = this.map.npcs.map(function (def) { return { def: def, x: def.x, y: def.y, face: def.face, walk: null }; });
  this.npcListStale = true;
  G.player.map = mapId; G.player.x = x; G.player.y = y; G.player.dir = this.dir;
  this.popup = 120;
  Sound.play(this.map.music);
};
OverworldLayer.prototype.onEnter = function () { this.loadMap(G.player.map, G.player.x, G.player.y, G.player.dir); this.popup = 0; };
// The visible NPCs are listed again only when a story flag was added or the NPCs of the map changed
// (flags are only ever added), so the per-frame calls do not allocate.
OverworldLayer.prototype.visibleNpcs = function () {
  let flagCount = 0;
  for (const name in G.flags) if (G.flags[name]) flagCount++;
  if (this.npcListStale || flagCount !== this.npcListFlagCount || G.flags !== this.npcListFlags) {
    this.npcList = [];
    for (const npc of this.npcs) if (npcVisible(npc.def, G.flags)) this.npcList.push(npc);
    for (const npc of this.tempNpcs) this.npcList.push(npc);
    this.npcListFlagCount = flagCount;
    this.npcListFlags = G.flags;
    this.npcListStale = false;
  }
  return this.npcList;
};
OverworldLayer.prototype.npcAt = function (x, y) {
  for (const npc of this.visibleNpcs()) if (npc.x === x && npc.y === y) return npc;
  return null;
};
OverworldLayer.prototype.canWalk = function (x, y) {
  if (tileDef(this.map, x, y).solid) return false;
  if (this.npcAt(x, y)) return false;
  const warp = findWarp(this.map, x, y);
  if (warp && !warpOpen(warp, G.flags)) return false;
  return true;
};
OverworldLayer.prototype.runScript = async function (script) {
  this.busy = true;
  try { await script(); } catch (error) { console.error('Mizamon script error', error); }
  this.busy = false;
};
OverworldLayer.prototype.update = function () {
  this.tick++;
  if (this.popup > 0) this.popup--;
  this.backgroundUpdate();
  if (this.busy) return;
  if (this.move) { this.advanceMove(); return; }
  if (Input.pressed.menu) { this.runScript(openPauseMenu.bind(null, this)); return; }
  if (Input.pressed.a) { this.runScript(this.interact.bind(this)); return; }
  for (const name of ['up', 'down', 'left', 'right']) if (Input.pressed[name]) this.lastDir = name;
  let wanted = Input.down[this.lastDir] ? this.lastDir : null;
  if (!wanted) for (const name of ['up', 'down', 'left', 'right']) if (Input.down[name]) wanted = name;
  if (wanted) this.tryMove(wanted);
};
OverworldLayer.prototype.backgroundUpdate = function () {
  for (const npc of this.visibleNpcs()) {
    if (!npc.walk) continue;
    npc.walk.t += 1 / MOVE_FRAMES;
    if (npc.walk.t >= 1) {
      npc.x += npc.walk.dx; npc.y += npc.walk.dy;
      const done = npc.walk.done;
      npc.walk = null;
      if (done) done();
    }
  }
};
OverworldLayer.prototype.tryMove = function (dir) {
  this.dir = dir;
  G.player.dir = dir;
  const target = DIRS[dir];
  const nx = this.px + target[0];
  const ny = this.py + target[1];
  if (!this.canWalk(nx, ny)) {
    if (Input.pressed[dir]) Sound.sfx('bump');
    return;
  }
  this.move = { dx: target[0], dy: target[1], t: 0 };
};
OverworldLayer.prototype.advanceMove = function () {
  this.move.t += 1 / MOVE_FRAMES;
  if (this.move.t < 1) return;
  this.px += this.move.dx;
  this.py += this.move.dy;
  this.move = null;
  this.stepAnim++;
  G.player.x = this.px; G.player.y = this.py;
  G.steps++;
  this.runScript(this.onArrive.bind(this));
};
OverworldLayer.prototype.onArrive = async function () {
  const warp = findWarp(this.map, this.px, this.py);
  if (warp && warpOpen(warp, G.flags)) { await this.useWarp(warp); return; }
  if (await this.checkTriggers()) return;
  const encounter = rollEncounter(G.rng, this.map, this.px, this.py);
  if (encounter) { await this.wildEncounter(encounter); return; }
  await this.checkTrainerSight();
};
OverworldLayer.prototype.checkTriggers = async function () {
  for (const trigger of this.map.triggers || []) {
    if (trigger.x === this.px && trigger.y === this.py && !G.flags[trigger.flag]) { await this.runEvent(trigger.event); return true; }
  }
  return false;
};
OverworldLayer.prototype.useWarp = async function (warp) {
  Sound.sfx('door');
  await Fade.start(1, 10);
  this.loadMap(warp.to, warp.tx, warp.ty, this.dir);
  await waitFrames(2);
  await Fade.start(0, 10);
  if (await this.checkTriggers()) return;
  await this.checkTrainerSight();
};
OverworldLayer.prototype.teleport = async function (spot) {
  await Fade.start(1, 12);
  this.loadMap(spot.map, spot.x, spot.y, spot.dir || 'up');
  await waitFrames(2);
  await Fade.start(0, 12);
};
// Walks a non-player character one tile; resolves when the step is finished.
OverworldLayer.prototype.walkNpc = function (npc, dir) {
  npc.face = dir;
  return new Promise(function (resolve) { npc.walk = { dx: DIRS[dir][0], dy: DIRS[dir][1], t: 0, done: resolve }; });
};
OverworldLayer.prototype.showExclaim = async function (npc) {
  this.exclaim = npc;
  Sound.sfx('alert');
  await waitFrames(36);
  this.exclaim = null;
};
OverworldLayer.prototype.checkTrainerSight = async function () {
  for (const npc of this.visibleNpcs()) {
    const def = npc.def;
    if (def.kind !== 'trainer' || !def.sight || G.flags['t_' + def.trainer]) continue;
    if (!this.seesPlayer(npc)) continue;
    await this.challenge(npc, true);
    return;
  }
};
OverworldLayer.prototype.seesPlayer = function (npc) {
  const direction = DIRS[npc.face];
  for (let distance = 1; distance <= npc.def.sight; distance++) {
    const x = npc.x + direction[0] * distance;
    const y = npc.y + direction[1] * distance;
    if (x === this.px && y === this.py) return true;
    if (tileDef(this.map, x, y).solid || this.npcAt(x, y)) return false;
  }
  return false;
};
OverworldLayer.prototype.interact = async function () {
  const facing = DIRS[this.dir];
  const fx = this.px + facing[0];
  const fy = this.py + facing[1];
  let npc = this.npcAt(fx, fy);
  if (!npc && tileDef(this.map, fx, fy).counter) npc = this.npcAt(fx + facing[0], fy + facing[1]);
  if (npc) { npc.face = OPPOSITE[this.dir]; await this.talkTo(npc); return; }
  const signKey = this.map.signs[fx + ',' + fy];
  if (signKey) { await say(signKey); return; }
  const warp = findWarp(this.map, fx, fy);
  if (warp && !warpOpen(warp, G.flags)) await say(warp.lockedText);
};
OverworldLayer.prototype.talkTo = async function (npc) {
  const def = npc.def;
  if (def.kind === 'talk') await say(def.text);
  else if (def.kind === 'prof') await this.talkProfessor();
  else if (def.kind === 'heal') await this.healAtKep();
  else if (def.kind === 'shop') await this.shopTalk();
  else if (def.kind === 'save') await this.cafeTalk();
  else if (def.kind === 'trainer' || def.kind === 'boss') {
    if (G.flags['t_' + def.trainer]) await say('tr.' + def.trainer + '.after');
    else await this.challenge(npc, false);
  }
};
OverworldLayer.prototype.talkProfessor = async function () {
  if (G.flags.credits) await say('npc.prof.3');
  else if (G.flags.badge) await say('npc.prof.2');
  else if (G.flags.rival1) await say('npc.prof.1b');
  else await say('npc.prof.1');
};
OverworldLayer.prototype.healAtKep = async function () {
  await say('kep.hello');
  await say('kep.ticket', { n: '9.999' });
  await openLayer(new TicketLayer());
  Sound.sfx('heal');
  for (const mon of G.party) healMon(mon);
  G.lastHeal = { map: 'kep', x: 4, y: 6, dir: 'up' };
  await say('kep.done');
};
OverworldLayer.prototype.shopTalk = async function () {
  await say('shop.hello');
  await openLayer(new ShopLayer());
  await say('shop.bye');
};
OverworldLayer.prototype.cafeTalk = async function () {
  await say('cafe.hello');
  if (await askYesNo('cafe.ask')) {
    const stored = writeSave();
    Sound.sfx('heal');
    await say(stored ? 'cafe.saved' : 'cafe.savedMemory');
  } else await say('cafe.bye');
};
OverworldLayer.prototype.wildEncounter = async function (encounter) {
  const foe = makeMon(encounter.sp, encounter.lv);
  const result = await runBattle({ kind: 'wild', foeParty: [foe] });
  await this.afterBattle(result, null);
};
OverworldLayer.prototype.challenge = async function (npc, fromSight) {
  const trainerId = npc.def.trainer;
  const trainer = TRAINERS[trainerId];
  const walked = []; // the steps the trainer took toward the player, so they can walk back afterwards
  if (fromSight) {
    await this.showExclaim(npc);
    let guard = 0;
    while (guard++ < 8 && Math.abs(npc.x - this.px) + Math.abs(npc.y - this.py) > 1) { walked.push(npc.face); await this.walkNpc(npc, npc.face); }
  }
  await say('tr.' + trainerId + '.intro');
  const result = await runBattle({ kind: 'trainer', trainerId: trainerId, foeParty: buildTrainerTeam(trainerId, G.starter) });
  await this.afterBattle(result, trainerId);
  if (result === 'win') {
    G.flags['t_' + trainerId] = true;
    await say('tr.' + trainerId + '.win');
    if (trainer.boss) await this.bossVictory();
  }
  if (result !== 'lose' && npcVisible(npc.def, G.flags)) {
    for (let i = walked.length - 1; i >= 0; i--) await this.walkNpc(npc, OPPOSITE[walked[i]]);
    npc.face = npc.def.face;
  }
};
OverworldLayer.prototype.afterBattle = async function (result, trainerId) {
  if (result === 'lose') { await this.blackout(); return; }
  await runEvolutions();
};
OverworldLayer.prototype.blackout = async function () {
  await say('blackout.text');
  G.money = Math.floor(G.money * BLACKOUT_MONEY_KEEP);
  for (const mon of G.party) healMon(mon);
  await this.teleport(G.lastHeal);
  await say('blackout.kep');
};
OverworldLayer.prototype.bossVictory = async function () {
  await say('boss.win2');
  G.flags.badge = true;
  Sound.sfx('levelup');
  await openLayer(new BadgeLayer());
  await say('boss.win3');
  await openLayer(new CreditsLayer());
  G.flags.credits = true;
  Sound.play(this.map.music);
  await say('credits.after');
};
OverworldLayer.prototype.runEvent = async function (eventId) {
  if (eventId === 'rival1') {
    G.flags.rival1 = true;
    const rival = { def: { look: 'rival', kind: 'tmp' }, x: 3, y: 9, face: 'up', walk: null };
    this.tempNpcs.push(rival);
    this.npcListStale = true;
    Sound.sfx('alert');
    await this.walkNpc(rival, 'up');
    await sayAll(['rival1.intro1', 'rival1.intro2']);
    const result = await runBattle({ kind: 'trainer', trainerId: 'rival1', foeParty: buildTrainerTeam('rival1', G.starter) });
    if (result === 'ran') { this.tempNpcs = []; this.npcListStale = true; return; } // the battle broke: the fight does not count
    G.flags.t_rival1 = true;
    if (result === 'lose') { await say('rival1.win'); await this.afterBattle('lose', 'rival1'); }
    else { await say('rival1.lose'); await runEvolutions(); }
    if (result !== 'lose') {
      await this.walkNpc(rival, 'right');
      for (let i = 0; i < 6; i++) await this.walkNpc(rival, 'right');
    }
    this.tempNpcs = [];
    this.npcListStale = true;
  }
};
OverworldLayer.prototype.draw = function () {
  ctx.font = FONT;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  const map = this.map;
  let offsetX = this.move ? this.move.dx * this.move.t * TILE : 0;
  let offsetY = this.move ? this.move.dy * this.move.t * TILE : 0;
  const playerX = this.px * TILE + offsetX;
  const playerY = this.py * TILE + offsetY;
  let camX = Math.round(playerX + TILE / 2 - SCREEN_W / 2);
  let camY = Math.round(playerY + TILE / 2 - SCREEN_H / 2);
  if (map.w * TILE <= SCREEN_W) camX = -Math.floor((SCREEN_W - map.w * TILE) / 2);
  else camX = Math.max(0, Math.min(map.w * TILE - SCREEN_W, camX));
  if (map.h * TILE <= SCREEN_H) camY = -Math.floor((SCREEN_H - map.h * TILE) / 2);
  else camY = Math.max(0, Math.min(map.h * TILE - SCREEN_H, camY));
  const firstX = Math.max(0, Math.floor(camX / TILE));
  const lastX = Math.min(map.w - 1, Math.floor((camX + SCREEN_W) / TILE));
  const firstY = Math.max(0, Math.floor(camY / TILE));
  const lastY = Math.min(map.h - 1, Math.floor((camY + SCREEN_H) / TILE));
  const waterFrame = waterFrames[(this.tick >> 5) & 1];
  for (let y = firstY; y <= lastY; y++) {
    const row = map.rows[y];
    for (let x = firstX; x <= lastX; x++) {
      const char = row[x];
      ctx.drawImage(char === '~' ? waterFrame : tileSprites[char], x * TILE - camX, y * TILE - camY);
    }
  }
  const npcs = this.visibleNpcs();
  for (const npc of npcs) if (npc.y <= this.py) this.drawNpc(npc, camX, camY);
  this.drawPlayer(playerX - camX, playerY - camY);
  for (const npc of npcs) if (npc.y > this.py) this.drawNpc(npc, camX, camY);
  if (this.exclaim) {
    const npc = this.exclaim;
    const ex = npc.x * TILE - camX + 5;
    const ey = npc.y * TILE - camY - 11;
    ctx.fillStyle = COLOR.border; ctx.fillRect(ex - 1, ey - 1, 8, 12);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(ex, ey, 6, 10);
    ctx.fillStyle = COLOR.red; ctx.fillRect(ex + 2, ey + 1, 2, 5); ctx.fillRect(ex + 2, ey + 7, 2, 2);
  }
  if (this.popup > 0) {
    const label = T(map.name);
    const width = Math.ceil(ctx.measureText(label).width) + 14;
    drawPanel(Math.floor((SCREEN_W - width) / 2), 4, width, 16);
    drawText(label, SCREEN_W / 2, 8, COLOR.ink, 'center');
  }
};
OverworldLayer.prototype.drawNpc = function (npc, camX, camY) {
  let x = npc.x * TILE;
  let y = npc.y * TILE;
  let frame = 0;
  if (npc.walk) { x += npc.walk.dx * npc.walk.t * TILE; y += npc.walk.dy * npc.walk.t * TILE; frame = npc.walk.t < 0.5 ? 1 : 2; }
  this.blit(charSheet(npc.def.look), npc.face, frame, x - camX, y - camY);
};
OverworldLayer.prototype.drawPlayer = function (x, y) {
  const sheet = charSheet(G.player.gender === 'f' ? 'playerF' : 'playerM');
  const frame = this.move ? (this.move.t < 0.5 ? 1 : 2) : 0;
  this.blit(sheet, this.dir, frame, x, y);
};
OverworldLayer.prototype.blit = function (sheet, dir, frame, x, y) {
  const row = SHEET_ROW[dir];
  const drawX = Math.round(x);
  const drawY = Math.round(y);
  if (dir === 'right') {
    ctx.save(); ctx.translate(drawX + TILE, drawY); ctx.scale(-1, 1);
    ctx.drawImage(sheet, frame * TILE, row * TILE, TILE, TILE, 0, 0, TILE, TILE);
    ctx.restore();
  } else ctx.drawImage(sheet, frame * TILE, row * TILE, TILE, TILE, drawX, drawY, TILE, TILE);
};

const NAME_PAGES = [

  if (event.key === 'Backspace') { this.name = this.name.slice(0, -1); return true; }
  if (event.key === 'Enter') { this.finish(); return true; }
  if (event.key.length === 1 && /[A-Za-zΑ-Ωα-ωάέήίόύώΐΰ0-9.\- ]/.test(event.key)) {
    if (this.name.length < NAME_MAX) this.name += event.key.toLocaleUpperCase('el').replace(/[ΆΈΉΊΌΎΏ]/g, function (c) { return 'ΑΕΗΙΟΥΩ'['ΆΈΉΊΌΎΏ'.indexOf(c)]; });
    return true;
  }
  return false; // arrows and the rest go to the normal input
};
NameLayer.prototype.finish = function () {
  const trimmed = this.name.trim();
  if (trimmed.length === 0) { Sound.sfx('error'); return; }
  Sound.sfx('confirm');
  closeLayer(this, trimmed);
};
NameLayer.prototype.update = function () {
  this.frame++;
  const pageRows = NAME_PAGES[this.page].length;
  if (Input.repeat.up) { this.row = (this.row + this.rows() - 1) % this.rows(); Sound.sfx('move'); }
  if (Input.repeat.down) { this.row = (this.row + 1) % this.rows(); Sound.sfx('move'); }
  const cols = this.row === pageRows ? 3 : 8;
  if (this.col >= cols) this.col = cols - 1;
  if (Input.repeat.left) { this.col = (this.col + cols - 1) % cols; Sound.sfx('move'); }
  if (Input.repeat.right) { this.col = (this.col + 1) % cols; Sound.sfx('move'); }
  if (Input.pressed.b) { this.name = this.name.slice(0, -1); Sound.sfx('back'); }
  if (!Input.pressed.a) return;
  if (this.row < pageRows) {
    const letter = NAME_PAGES[this.page][this.row][this.col];
    if (letter && this.name.length < NAME_MAX) { this.name += letter; Sound.sfx('confirm'); } else Sound.sfx('error');
  } else if (this.col === 0) { this.page = 1 - this.page; this.row = Math.min(this.row, this.rows() - 1); Sound.sfx('confirm'); }
  else if (this.col === 1) { this.name = this.name.slice(0, -1); Sound.sfx('back'); }
  else this.finish();
};

// ---- Pause menu ---------------------------------------------------------------------------------------------------------
async function openPauseMenu(world) {
  Sound.sfx('confirm');
  let start = 0;
  for (;;) {
    const choice = await choose([T('menu.party'), T('menu.bag'), T('menu.dossier'), T('menu.save'), T('menu.options'), T('menu.close')],
      { x: 140, y: 6, w: 96, start: start, title: T('ui.money', { n: G.money }) });
    if (choice === -1 || choice === 5) return;
    start = choice;
    if (choice === 0) await openLayer(new PartyLayer({ mode: 'view' }));
    else if (choice === 1) await openLayer(new BagLayer({ battle: false }));
    else if (choice === 2) await openLayer(new DossierLayer());
    else if (choice === 3) {
      if (world.mapId !== 'cafe') await say('menu.saveOnlyCafe');
      else { const stored = writeSave(); await say(stored ? 'cafe.saved' : 'cafe.savedMemory'); }
    } else if (choice === 4) await openLayer(new OptionsLayer());
  }
}

// ---- Party ---------------------------------------------------------------------------------------------------------------------
// options: mode 'view' | 'choose' | 'switch'; activeIndex (cannot be chosen in switch mode); forced; canChoose(index) -> bool.
function PartyLayer(options) {
  const o = options || {};
  this.opaque = true;
  this.mode = o.mode || 'view';
  this.activeIndex = o.activeIndex === undefined ? -1 : o.activeIndex;
  this.forced = !!o.forced;
  this.canChoose = o.canChoose || null;
  this.cursor = o.start || 0;
  this.swapFrom = -1;
  if (this.mode === 'switch') { // start on the first creature that can actually go in
    const first = G.party.findIndex(function (mon, index) { return mon.hp > 0 && index !== o.activeIndex; });
    if (first >= 0) this.cursor = first;
  }
  this.refresh();
}
PartyLayer.prototype.refresh = function () {
  this.rows = G.party.map(function (mon) {
    return { name: speciesName(mon.sp), level: T('ui.lv') + mon.lv, hp: mon.hp + '/' + maxHp(mon), fraction: mon.hp / maxHp(mon), fainted: mon.hp <= 0 };
  });
  this.title = T(this.mode === 'switch' ? 'party.pickSwitch' : (this.mode === 'choose' ? 'party.pickTarget' : 'party.title'));
};
PartyLayer.prototype.update = function () {
  const count = G.party.length;
  if (Input.repeat.up) { this.cursor = (this.cursor + count - 1) % count; Sound.sfx('move'); }
  if (Input.repeat.down) { this.cursor = (this.cursor + 1) % count; Sound.sfx('move'); }
  if (Input.pressed.b) {
    if (this.swapFrom >= 0) { this.swapFrom = -1; Sound.sfx('back'); return; }
    if (this.forced) { Sound.sfx('error'); return; }
    Sound.sfx('back'); closeLayer(this, -1); return;
  }
  if (!Input.pressed.a) return;
  if (this.mode !== 'view') {
    const mon = G.party[this.cursor];
    const blocked = (this.mode === 'switch' && (mon.hp <= 0 || this.cursor === this.activeIndex)) || (this.canChoose && !this.canChoose(this.cursor));
    if (blocked) { Sound.sfx('error'); return; }
    Sound.sfx('confirm'); closeLayer(this, this.cursor); return;
  }
  Sound.sfx('confirm');
  this.runViewAction(this.cursor);
};
PartyLayer.prototype.runViewAction = async function (index) {
  if (this.swapFrom >= 0) {
    const from = this.swapFrom;
    this.swapFrom = -1;
    const held = G.party[from];
    G.party[from] = G.party[index];
    G.party[index] = held;
    this.refresh();
    return;
  }
  this.busy = true;
  const choice = await choose([T('party.summary'), T('party.move'), T('ui.cancel')], { x: 150, y: 40, w: 84 });
  if (choice === 0) await openLayer(new SummaryLayer(index));
  if (choice === 1 && G.party.length > 1) this.swapFrom = index;
  this.busy = false;
  this.refresh();
};
PartyLayer.prototype.draw = function () {
  ctx.fillStyle = '#1b2a5a'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

    const row = this.rows[i];
    const y = 16 + i * 23;
    const selected = i === this.cursor;
    drawPanel(4, y, 232, 22);
    if (selected) { ctx.fillStyle = COLOR.gold; ctx.fillRect(4, y + 2, 3, 18); }
    if (i === this.swapFrom) { ctx.fillStyle = COLOR.red; ctx.fillRect(4, y + 2, 3, 18); }
    drawCreatureIcon(G.party[i].sp, 10, y + 3, 16);
    drawText(row.name, 30, y + 3, row.fainted ? COLOR.gray : COLOR.ink);
    drawText(row.level, 30, y + 12, COLOR.ink);
    drawBar(100, y + 9, 70, 4, row.fraction);
    drawText(row.hp, 176, y + 7, COLOR.ink);

    if (i === this.activeIndex) drawText(T('party.active'), 228, y + 3, COLOR.red, 'right');
  }
};

  this.entries = ITEM_IDS.filter(function (id) { return (G.bag[id] || 0) > 0; });

  if (Input.pressed.b) { Sound.sfx('back'); closeLayer(this, null); return; }
  if (count === 0) return;
  if (Input.repeat.up) { this.cursor = (this.cursor + count - 1) % count; this.refresh(); Sound.sfx('move'); }
  if (Input.repeat.down) { this.cursor = (this.cursor + 1) % count; this.refresh(); Sound.sfx('move'); }
  if (Input.pressed.a) {
    const itemId = this.entries[this.cursor];

BagLayer.prototype.useOutside = async function (itemId) {

  else {

      applyItemToMon(mon, itemId);

async function runEvolutions() {

async function offerLearnMove(mon, moveId) {
  const name = speciesName(mon.sp);
  const moveName = MOVES[moveId].n;
  if (!(await askYesNo('learn.ask', { mon: name, move: moveName }))) { await say('learn.skip', { mon: name, move: moveName }); return; }
  const labels = mon.moves.map(function (id) { return MOVES[id].n; }).concat([T('ui.cancel')]);
  const choice = await choose(labels, { x: 120, bottom: DIALOG_BOX.y - 2, w: 116, start: 0, title: T('learn.forget') });
  if (choice < 0 || choice >= mon.moves.length) { await say('learn.skip', { mon: name, move: moveName }); return; }

// ---- Battle screen ----------------------------------------------------------------------------------------
// The rules (createBattle, playTurn) produce events; this layer plays them back.
// Layout (decision recorded in REFERENCE section 1): a television debate, not a two-panel RPG screen.
//   - the two fighters stand on podiums that face each other at the same height (player left, foe right);
//   - a poll panel (the "δημοσκόπηση" bar, the creature's HP) hangs above each podium;
//   - the four commands are a row of tabs between the podiums and the bottom;
//   - every message runs in a news-ticker strip along the bottom edge.
const POLL_PANEL = { y: 3, w: 112, h: 30, leftX: 4, rightX: 124 };
const CREATURE_Y = 32;
const PODIUM = { y: 94, w: 88, h: 10, leftX: 14, rightX: 138 };
const COMMAND_ROW = { x: 4, y: 106, w: 232, h: 13, tabW: 58 };

const NEWS_NAVY = '#10163a';
const TAB_BLUE = '#26346e';
const AUTO_ADVANCE_FRAMES = [80, 50, 24];
const ROOT_LABELS = ['battle.fight', 'battle.bag', 'battle.mizamon', 'battle.run'];
let envelopeSprite = null;
function getEnvelopeSprite() {

  p.line(0, 0, 8, 7, '#b8a97c'); p.line(15, 0, 8, 7, '#b8a97c'); p.ell(8, 7, 2, 2, '#c0392b');

function newBattleView() {
  return { sp: null, visible: false, name: '', lvText: '', hpText: '', shown: 0, target: 0, max: 1, lastShown: -1, status: null, dx: 0, dy: 0, alpha: 1, scale: 1, hidden: false };
}
function BattleLayer(battle, trainer, theme) {
  this.opaque = true;
  this.battle = battle;
  this.trainer = trainer;
  this.theme = theme;
  this.views = [newBattleView(), newBattleView()];
  this.mode = 'idle';
  this.box = new TextBox(TICKER.textW, 3);
  this.hold = 0;
  this.textResolve = null;
  this.fx = null;
  this.rootCursor = 0;
  this.moveCursor = 0;
  this.rootPrompt = [];
