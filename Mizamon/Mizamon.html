// ---- Seeded random numbers (mulberry32) --------------------------------------
function makeRng(seed) {
  let state = seed >>> 0;
  const next = function () {
    state = (state + 0x6D2B79F5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  next.getState = function () { return state; };
  next.setState = function (value) { state = value >>> 0; };
  return next;
}
function randInt(rng, min, max) { return min + Math.floor(rng() * (max - min + 1)); }
function pickOne(rng, list) { return list[Math.floor(rng() * list.length)]; }
function pickWeighted(rng, entries) {
  let total = 0;
  for (const entry of entries) total += entry.w;
  let roll = rng() * total;
  for (const entry of entries) {
    roll -= entry.w;
    if (roll < 0) return entry;
  }
  return entries[entries.length - 1];
}
function hashString(text) { // FNV-1a, used for test checksums
  let hash = 2166136261;
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619) >>> 0;
  }
  return hash >>> 0;
}

  inf: { strong: ['cel', 'pol'], weak: ['asf', 'mem'] },
  biz: { strong: ['ekk', 'inf'], weak: ['pol', 'cel'] },
  mem: { strong: ['pol', 'ekk'], weak: ['asf', 'biz'] },
};
const TYPE_CHART = (function buildChart() {
  const chart = {};
  for (const attacker of TYPE_IDS) {
    chart[attacker] = {};
    for (const defender of TYPE_IDS) {
      let multiplier = 1;
      if (TYPE_RULES[attacker].strong.includes(defender)) multiplier = 2;
      if (TYPE_RULES[attacker].weak.includes(defender)) multiplier = 0.5;
      if (attacker === defender) multiplier = 0.5; // "they protect each other"
      chart[attacker][defender] = multiplier;
    }
  }
  return chart;
})();

    if (action.t === 'move') useMove(battle, p.side, action.id);

    else if (action.t === 'item') useItemAction(battle, p.side, action.id, action.target);

function simulateBattle(partyA, partyB, rng, options) {

    kind: o.kind || 'trainer', foeItems: o.foeItems, foeName: 'sim', bag: {}, trainerId: 'sim',
  });
  battle.sides[0].items = o.playerItems ? o.playerItems.slice() : [];

  while (!battle.over && guard++ < 400) {
    let action;
    if (battle.phase === 'forced') {
      const events = playForcedSwitch(battle, chooseReplacement(battle, 0));
      checksum = (checksum + hashString(JSON.stringify(events))) >>> 0;

    }
    action = chooseAction(battle, 0);
    if (action.t === 'item') { battle.bag[action.id] = 1; }
    const events = playTurn(battle, action);
    checksum = (checksum + hashString(JSON.stringify(events))) >>> 0;

}

const ARTICLE = { m: 'Ο', f: 'Η', n: 'Το' };

// Label of a creature in battle text: "Ο Φακελάκης", "Ο ανεξάρτητος Φακελάκης", "Opposition Φακελάκης".
function monLabel(ref, lang, battleKind) {
  const species = SPECIES[ref.sp];
  if (lang === 'en') {
    if (ref.side === 0) return species.n;
    return (battleKind === 'wild' ? 'Independent ' : 'Opposition ') + species.n;
  }
  if (ref.side === 0) return ARTICLE[species.g] + ' ' + species.n;
  const adjective = battleKind === 'wild' ? WILD_ADJECTIVE[species.g] : FOE_ADJECTIVE[species.g];
  return ARTICLE[species.g] + ' ' + adjective + ' ' + species.n;
}
function eventVars(vars, lang, battleKind) {

  for (const name of Object.keys(vars || {})) {
    const value = vars[name];
    if (value && typeof value === 'object') { out[name] = monLabel(value, lang, battleKind); out[name + '_name'] = SPECIES[value.sp].n; }
    else if (name === 'move') out[name] = MOVES[value].n;
    else if (name === 'item') out[name] = lookupString('item.' + value, lang);
    else if (name === 'stat') out[name] = lookupString('stat.' + value, lang);
    else out[name] = value;
  }

}

    if (op[0] === 'px') put(op[1], op[2], op[3]);
    if (op[0] === 'path') {
      const points = op[2];
      for (let i = 0; i + 1 < points.length; i++) {
        const [x1, y1] = points[i];
        const [x2, y2] = points[i + 1];
        for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) put(op[1], x, y);
      }
    }
  }
  return grid.map(function (row) { return row.join(''); });
}

  for (const id of DEX_ORDER) {
    if (save.dex && save.dex.seen && save.dex.seen[id]) dex.seen[id] = true;
    if ((save.dex && save.dex.got && save.dex.got[id]) || owned[id]) { dex.got[id] = true; dex.seen[id] = true; }
  }
  const oldKepSpot = !!save.lastHeal && save.lastHeal.map === 'kep';
  const heal = save.lastHeal && MAPS[save.lastHeal.map] && !oldKepSpot ? save.lastHeal : DEFAULT_HEAL_SPOT;
  const flags = (save.flags && typeof save.flags === 'object') ? Object.assign({}, save.flags) : {};
  const finalMap = useStart ? START_MAP.map : player.map;
  // what the flags and the position tell is always added, so a damaged or missing world part does not lose walked routes
  const world = version >= 3 ? normalizeWorld(save.world) : newWorldState();
  const fromFlags = worldFromOldSave(finalMap, flags);
  for (const part of Object.keys(fromFlags)) Object.assign(world[part], fromFlags[part]);
  worldVisit(world, finalMap, flags);
  return {
    version: SAVE_VERSION,
    player: {
      name: String(player.name || 'ΝΙΚΟΣ').slice(0, NAME_MAX), gender: player.gender === 'f' ? 'f' : 'm',
      map: finalMap, x: useStart ? START_MAP.x : (onHospitalLot ? hospitalDoor.x : player.x), y: useStart ? START_MAP.y : (onHospitalLot ? hospitalDoor.y + 1 : player.y),
      dir: onHospitalLot ? 'down' : (['up', 'down', 'left', 'right'].includes(player.dir) ? player.dir : 'down'),
    },
    party: party.map(serializeMon),
    archive: archive.map(serializeMon),
    money: Math.max(0, Math.floor(Number(save.money) || 0)),
    bag: bag, dex: dex, flags: flags, world: world,
    lastHeal: { map: heal.map, x: heal.x, y: heal.y, dir: heal.dir || 'up' },
    options: normalizeOptions(save.options),
    rngState: Number.isFinite(save.rngState) ? save.rngState >>> 0 : 12345,
    starter: STARTERS.includes(save.starter) ? save.starter : party[0].sp,
  };
}

  'arch.full': ['Το Αρχείο Ασθενών είναι γεμάτο: 60/60. Για νέο φάκελο πρέπει να ανοίξει θέση. Στο Δημόσιο αυτό σημαίνει ποτέ.', 'The Patient Archive is full: 60/60. A new file needs a free slot. In the civil service that means never.'],
  'arch.empty': ['Το αρχείο είναι άδειο. Ούτε ένας φάκελος. Ύποπτο.', 'The archive is empty. Not one file. Suspicious.'],
  'arch.teamFull': ['Η ομάδα σου είναι γεμάτη (6). Κάποιος πρέπει πρώτα να παραιτηθεί... δηλαδή να αρχειοθετηθεί.', 'Your team is full (6). Someone has to resign first... that is, be filed.'],
  'cafe.hello': ['Καφενείο «Η Κρίση». Έλα να τα πούμε. Ελληνικός, μέτριος, με λίγη οικονομία.', 'Cafe "The Crisis". Come, let us talk. Greek coffee, medium, with a little economics.'],
  'cafe.ask': ['Να σημειώσω την πρόοδό σου στο τεφτέρι;', 'Shall I write your progress in the ledger?'],
  'cafe.saved': ['Έγινε! Το τεφτέρι είναι ασφαλές. Όπως η δημόσια περιουσία.', 'Done! The ledger is safe. Like public property.'],
  'cafe.savedMemory': ['Έγινε... αλλά ο χώρος αποθήκευσης του browser δεν δουλεύει. Η πρόοδος μένει μόνο όσο είναι ανοιχτή η σελίδα.', 'Done... but the browser storage is not working. Progress only lasts while this page stays open.'],
  'cafe.bye': ['Όπως θες. Η Ιστορία θα το θυμάται. Εγώ όχι.', 'As you wish. History will remember. I will not.'],
  // Places and signs
  'map.town': ['Νέα Πειραιάς', 'New Piraeus'], 'map.lab': ['Εργαστήριο', 'Laboratory'], 'map.kep': ['ΚΕΠ 3000', 'ΚΕΠ 3000'], 'map.hospital': ['Νοσοκομείο 3000', 'Hospital 3000'], 'map.shop': ['Περίπτερο', 'Kiosk'],
  'map.cafe': ['Καφενείο «Η Κρίση»', 'Cafe "The Crisis"'], 'map.studio': ['Τηλεοπτικό Στούντιο', 'TV Studio'], 'map.route1': ['Διαδρομή 1: Παραλιακή', 'Route 1: The Waterfront'], 'map.port': ['Λιμεναρχείο', 'Harbour Office'],
  'sign.lab': ['Εργαστήριο Καθηγητή Σταθόπουλου. Μισθός: εκκρεμεί από το 2987.', 'Prof. Stathopoulos Laboratory. Salary: pending since 2987.'],
  'sign.kep': ['ΚΕΠ 3000. Ώρες εξυπηρέτησης: 9:00-9:05, ή όποτε.', 'ΚΕΠ 3000. Service hours: 9:00-9:05, or whenever.'],
  'sign.hospital': ['Γενικό Νοσοκομείο Νέας Πειραιάς 3000. Επισκεπτήριο: ώρες προς ανακοίνωση. Εφημερεύει: ο διάδρομος.', 'General Hospital of New Piraeus 3000. Visiting hours: to be announced. On call: the corridor.'],
  'sign.hosp.vending': ['Μηχάνημα καφέ: εκτός λειτουργίας. Έφαγε το κέρμα σου. Και το προηγούμενο. Και ένα του 2991.', 'Coffee machine: out of order. It ate your coin. And the previous one. And one from 2991.'],
  'sign.hosp.tv': ['Πρωινή εκπομπή στην τηλεόραση: ο υπουργός εξηγεί ότι οι λίστες αναμονής είναι οπτική ψευδαίσθηση. Στο διπλανό κανάλι: συνταγή για τηγανητές πατάτες.', 'A morning show on the TV: the minister explains that waiting lists are an optical illusion. On the next channel: a recipe for fried potatoes.'],
  'sign.shop': ['Περίπτερο: εφημερίδες, σνακ, κι άλλα σνακ, ρέστα (εξαντλήθηκαν).', 'Kiosk: newspapers, snacks, more snacks, change (sold out).'],
  'sign.cafe': ['Καφενείο «Η Κρίση»: αποθήκευση προόδου, τάβλι και λύσεις για την οικονομία.', 'Cafe "The Crisis": saving progress, backgammon and solutions to the economy.'],
  'sign.studio': ['Τηλεοπτικό Στούντιο «Κανάλι 3000». Ζωντανά, δηλαδή ηχογραφημένα.', 'TV Studio "Channel 3000". Live, meaning recorded.'],
  'sign.house1': ['Κλειστό. Επιστρέφουμε το 2987.', 'Closed. Back in 2987.'],
  'sign.house2': ['Ενοικιάζεται. Βραχυχρόνια μίσθωση 3000. Ο ιδιοκτήτης είναι στο εξωτερικό.', 'For rent. Short-let 3000. The owner is abroad.'],
  'sign.route1': ['Διαδρομή 1. Προσοχή: ψηλό γρασίδι και ψηλοί φόροι.', 'Route 1. Beware: tall grass and tall taxes.'],
  'sign.port': ['Λιμεναρχείο. Το λιμάνι πουλιέται κάθε σεζόν. Η πόρτα είναι ανοιχτή.', 'Harbour Office. The port is sold every season. The door is open.'],
  'warp.studio': ['Το στούντιο είναι κλειστό. Περιμένει να γίνεις αρκετά {διάσημος|διάσημη}.', 'The studio is closed. It is waiting for you to become famous enough.'],
  // People
  'npc.kid': ['Έδωσα εξετάσεις 12 φορές. Ο Μπέμπης πέρασε με ένα τηλεφώνημα.', 'I took the exam 12 times. Bebis passed with one phone call.'],
  'npc.oldman': ['Στον καιρό μου το Δημόσιο έκλεινε στις 3. Τώρα κλείνει και στις 2:59.', 'In my day the civil service closed at 3. Now it closes at 2:59.'],
  'npc.fisher': ['Ψαρεύω στον ποταμό της αναμονής. Το λιμάνι πλημμύρισε το 2500 και συστάθηκε επιτροπή.', 'I fish in the river of waiting. The port flooded in 2500 and a committee was formed.'],
  'npc.student': ['Είμαι ο βοηθός του Καθηγητή. Δουλεύω εθελοντικά. Δηλαδή με ξέχασαν.', "I am the Professor's assistant. I work as a volunteer. Meaning they forgot me."],
  'npc.prof.1': ['Πήγαινε, {name}! Έξω σε περιμένει η ζωή. Και ο Μπέμπης.', 'Go on, {name}! Life awaits outside. And Bebis.'],
  'npc.prof.1b': ['Ο Μπέμπης; Το ξέρω, έχει θείους παντού. Εσύ έχεις Mizamon. Προχώρα στη Διαδρομή 1.', 'Bebis? I know, he has uncles everywhere. You have Mizamon. Head down Route 1.'],
  'npc.prof.2': ['Παράσημο, ε; Μπράβο! Τώρα μπορείς να ζητήσεις αύξηση. Εγώ περιμένω ακόμη τη δική μου.', 'A medal, eh? Well done! Now you can ask for a raise. I am still waiting for mine.'],
  'npc.prof.3': ['Άνοιξε Τηλεοπτικό Στούντιο στην πλατεία. Λένε ότι ο παρουσιαστής ψάχνει αντίπαλο. Και φάκελο.', 'A TV Studio opened in the square. They say the host is looking for a challenger. And an envelope.'],
  'npc.queue1': ['Περιμένω από την Τρίτη. Δεν θυμάμαι ποια Τρίτη.', 'I have been waiting since Tuesday. I do not remember which Tuesday.'],
  'npc.queue2': ['Ο αριθμός μου είναι 10.000. Ο μπαμπάς μου πήρε αριθμό το 2990.', 'My number is 10,000. My dad took a number in 2990.'],
  'npc.customer': ['Ήρθα για ένα κουλούρι και έφυγα με φορολογική δήλωση.', 'I came for a koulouri and left with a tax return.'],
  'npc.hosp.doctor': ['Εφημερεύω 36 ώρες. Δεν θα σε εξετάσω, αλλά θα σου πω κάτι: ένα Φακελάκι... ένα Φακελάκι βοηθάει τη μνήμη μου.', 'I have been on call for 36 hours. I will not examine you, but I will tell you something: a little envelope... a little envelope helps my memory.'],
  'npc.hosp.wait1': ['Περιμένω για εξέταση από το 2995. Στο μεταξύ έμαθα να πλέκω. Έχω πλέξει τρία πουλόβερ και μια λίστα αναμονής.', 'I have been waiting for an examination since 2995. In the meantime I learned to knit. I have knitted three sweaters and a waiting list.'],
  'npc.hosp.wait2': ['Ράντζο στον διάδρομο, με θέα στον διάδρομο. Τα δωμάτια με θέα θάλασσα είναι για όσους έχουν... γνωριμίες.', 'A cot in the corridor, with a view of the corridor. The sea-view rooms are for those who have... connections.'],
  'npc.hosp.wait3': ['Η μαμά μου είπε «πάμε για πέντε λεπτά». Αυτό ήταν πριν από δύο εξάμηνα.', 'My mum said "we are only going for five minutes". That was two semesters ago.'],
  'npc.hosp.wait4': ['Η απεργία των εφημερευόντων ξεκινά αύριο. Ή ήταν χθες; Στο σύστημα γράφει «σε εξέλιξη».', 'The strike of the on-call staff starts tomorrow. Or was it yesterday? The system says "in progress".'],
  'npc.tavli1': ['Αν ο Μπέμπης γίνεται υπουργός, εγώ λύνω την οικονομία. Έλα, ρίξε ζάρια.', 'If Bebis can become a minister, I can fix the economy. Come on, roll the dice.'],
  'npc.tavli2': ['Πεντέ-έξι. Αυτό ήταν το ελληνικό ΑΕΠ το 2400.', 'Five-six. That was the Greek GDP in 2400.'],
  'npc.sailor1': ['Ο Λιμενάρχης είναι εκεί. Μην αναφέρεις ότι το λιμάνι πουλήθηκε ήδη. Δύο φορές.', 'The Harbour Master is right there. Do not mention the port is already sold. Twice.'],
  'npc.sailor2': ['Δουλεύω εδώ 20 χρόνια. Ο μισθός μου είναι μια ιδέα. Μου αρέσει η ιδέα.', 'I have worked here 20 years. My salary is an idea. I like the idea.'],
  'rival1.intro1': ['Ε, εσύ! Εσύ είσαι που πήρες Mizamon από τον Καθηγητή; Εγώ πήρα το δικό μου με ένα τηλεφώνημα.', 'Hey, you! You are the one who got a Mizamon from the Professor? I got mine with one phone call.'],
  'rival1.intro2': ['Με λένε Μπέμπη. Ο θείος μου είναι υπουργός. Ο άλλος θείος μου είναι υπουργός. Ο τρίτος... βρες {μόνος|μόνη}. ΜΑΧΗ!', 'I am Bebis. My uncle is a minister. My other uncle is a minister. The third... figure it out. BATTLE!'],
  'rival1.win': ['Χα! Το ήξερα. Γεννήθηκα νικητής. Και με βύσμα.', 'Ha! I knew it. I was born a winner. And with connections.'],
  'rival1.lose': ['Τι; Αυτό δεν... Θα το πω στον θείο! Θα σε βάλω σε εξεταστική επιτροπή!', 'What? That is not... I will tell my uncle! I will put you before an inquiry committee!'],
  'tr.phoebe.intro': ['Γεια σας, φίλοι μου! Σήμερα κάνουμε unboxing... ΜΑΧΗ! Μην ξεχάσετε το like!', 'Hi friends! Today we do an unboxing... BATTLE! Do not forget to like!'],
  'tr.phoebe.win': ['Θα το μοντάρω αλλιώς. Θα φαίνεται ότι κέρδισα.', 'I will edit it differently. It will look like I won.'],
  'tr.phoebe.after': ['Έχασα ακολούθους. Αλλά όχι αυτούς που αγόρασα.', 'I lost followers. Not the ones I bought, though.'],
  'tr.stelios.intro': ['Έλεγχος ταυτότητας! Για λόγους ασφαλείας. Μόνο τα δικά σου χαρτιά.', 'ID check! For security reasons. Only your papers.'],
  'tr.stelios.win': ['Ήταν άσκηση ετοιμότητας. Δεν έγινε τίποτα. Αρχειοθετείται.', 'That was a readiness exercise. Nothing happened. Filed away.'],
  'tr.stelios.after': ['Δεν υπήρξε περιστατικό. Κυκλοφορήστε.', 'There was no incident. Move along.'],
  'tr.takis.intro': ['Στο πάλκο, {φίλε|φίλη}! Το μπουζούκι θέλει φωνή και ο κόσμος θέλει ψυχή.', 'To the stage, friend! The bouzouki wants a voice and the crowd wants a soul.'],
  'tr.takis.win': ['Το τραγούδι ήταν καλύτερο από τη μάχη. Πάντα είναι.', 'The song was better than the fight. It always is.'],
  'tr.takis.after': ['Αύριο παίζω στην Τρούμπα. Αν με θυμηθούν.', 'Tomorrow I play in Troumpa. If they remember me.'],
  'tr.rival2.intro': ['Α, εσύ πάλι! Ο θείος μου ο υπουργός είπε να σε νικήσω. Δεν τον ρώτησα πώς.', 'Oh, you again! My uncle the minister told me to beat you. I did not ask him how.'],
  'tr.rival2.win': ['Θα τηλεφωνήσω σε κάποιον. Αυτό δεν μετράει! Αυτό δεν μετράει!', 'I will call someone. This does not count! This does not count!'],
  'tr.rival2.after': ['Ο Μπέμπης έφυγε. Κάποιος του τηλεφώνησε.', 'Bebis left. Someone called him.'],
  'tr.kotsos.intro': ['Καλώς ήρθες στο Λιμεναρχείο. Το λιμάνι είναι δικό μου... αυτή τη σεζόν. Να δούμε τι ομάδα έχεις, {ανιψιέ|ανιψιά}.', 'Welcome to the Harbour Office. The port is mine... this season. Let us see what team you have, nephew.'],
  'tr.kotsos.win': ['Ε, μπράβο. Θα πουλήσω ξανά το λιμάνι για να το γιορτάσω.', 'Well, congratulations. I will sell the port again to celebrate.'],
  'tr.kotsos.after': ['Το λιμάνι είναι πουλημένο. Ξανά. Να προσέχεις στον δρόμο.', 'The port is sold. Again. Take care on the road.'],
  'tr.host.intro': ['Καλησπέρα και καλώς ήρθατε στην εκπομπή «Όλοι Μαζί, Κανείς Μόνος»! Απόψε: ΕΣΥ εναντίον των καλεσμένων μου. Παίζουμε ζωντανά, δηλαδή ηχογραφημένα!', 'Good evening and welcome to the show "All Together, No One Alone"! Tonight: YOU against my guests. We play live, meaning recorded!'],
  'tr.host.win': ['Και κόβουμε για διαφημίσεις. Μείνετε μαζί μας. Δεν έχετε άλλη επιλογή.', 'And we cut to a commercial break. Stay with us. You have no other choice.'],
  'tr.host.after': ['Η εκπομπή συνεχίζεται. Όπως και τα ρέστα του καναλιού.', "The show goes on. So does the channel's budget."],
  'blackout.text': ['Όλη η ομάδα σου παραιτήθηκε και το πορτοφόλι ελαφρύνθηκε στο μισό. Η δημοσκόπησή σου πήρε την κατηφόρα και ένα ασθενοφόρο ήρθε μόνο του: δεν το κάλεσε κανείς.', 'Your whole team resigned and the wallet got half lighter. Your poll numbers took the downhill road and an ambulance arrived on its own: nobody had called it.'],
  'blackout.hospital': ['Ξύπνησες σε ράντζο στον διάδρομο του Νοσοκομείου 3000. Η ομάδα σου εξετάστηκε χωρίς ραντεβού. Αυτό είναι το πιο ανησυχητικό.', 'You woke up on a cot in the corridor of Hospital 3000. Your team was examined without an appointment. That is the most worrying part.'],
  'boss.win2': ['Ωραία, ωραία. Το Παράσημο είναι δικό σου, με τον όρο να μη ρωτήσεις πού πήγαν τα λεφτά.', 'Fine, fine. The medal is yours, on the condition that you do not ask where the money went.'],
  'boss.win3': ['Πήρες το Παράσημο Λιμανιού! Ο δρόμος προς την Καστέλλα άνοιξε.', 'You got the Port Medal! The road to Kastella is open.'],
  'badge.title': ['ΠΑΡΑΣΗΜΟ ΛΙΜΑΝΙΟΥ', 'PORT MEDAL'], 'badge.sub': ['Με τον όρο ότι δεν ρωτάς.', 'On the condition you do not ask.'],
  'chapter.title': ['Κεφάλαιο 1 ολοκληρώθηκε', 'Chapter 1 complete'], 'chapter.sub': ['Η Καστέλλα σε περιμένει.', 'Kastella is waiting.'],
  // Πειραιάς rework (MZ-WORLD-02a): route 2, Καστέλλα, two trainers
  'map.route2': ['Διαδρομή 2: Ακτή Θεμιστοκλέους', 'Route 2: The Quay Road'], 'map.kastella': ['Καστέλλα', 'Kastella'],
  'map.kastella.hospital': ['Νοσοκομείο Καστέλλας 3000', 'Kastella Hospital 3000'], 'map.kastella.shop': ['Περίπτερο Καστέλλας', 'Kastella Kiosk'],
  'map.kastella.theatre': ['Θέατρο Καστέλλας', 'Kastella Theatre'],
  'sign.route1.east': ['Ακτή Θεμιστοκλέους, Καστέλλα. Πρώτα το Παράσημο Λιμανιού.', 'Quay Road, Kastella. The Port Medal first.'],
  'warp.route2': ['Η πύλη είναι κλειστή. Χωρίς Παράσημο Λιμανιού δεν περνάς.', 'The gate is shut. No passing without the Port Medal.'],
  'sign.route2': ['Διαδρομή 2: Ακτή Θεμιστοκλέους. Το πλοίο φεύγει πάντα νωρίτερα από το εισιτήριο.', 'Route 2: The Quay Road. The ferry always leaves earlier than the ticket says.'],
  'sign.kastella': ['Καστέλλα. Ανηφόρα με θέα και σκαλιά χωρίς ράμπα.', 'Kastella. A hill with a view and steps with no ramp.'],
  'sign.ktel': ['ΚΤΕΛ 3000. Στάση. Το λεωφορείο θα αργήσει.', 'KTEL 3000. Stop. The bus will be late.'],
  'sign.metro': ['Μετρό 3000. Είσοδος. Ο συρμός έρχεται σε λίγο. Το «λίγο» δεν έχει οριστεί.', 'Metro 3000. Entrance. The train arrives shortly. "Shortly" is not defined.'],
  'sign.theatre': ['Θέατρο Καστέλλας. Παράσταση: ανακοινώνεται. Το εισιτήριο είναι ήδη πληρωμένο.', 'Kastella Theatre. Show: to be announced. The ticket is already paid.'],
  'sign.roadworks': ['Έργα στον παραλιακό δρόμο προς τα Ανατολικά. Τελειώνουν του χρόνου. Πάντα του χρόνου.', 'Roadworks on the coast road to the East. They finish next year. Always next year.'],
  'sign.glyfada.east': ['Προς τα Ανατολικά: Υμηττός. Τα έργα τελειώνουν του χρόνου. Πάντα του χρόνου.', 'To the East: Hymettus. The works finish next year. Always next year.'],
  'sign.kastella.hospital': ['Νοσοκομείο Καστέλλας 3000. Το ασανσέρ είναι υπό μελέτη. Τα σκαλιά είναι εκατό.', 'Kastella Hospital 3000. The lift is under study. The steps are a hundred.'],
  'npc.ferryclerk': ['Το πλοίο φεύγει σε 20 λεπτά. Πριν από την ώρα του εισιτηρίου. Το δρομολόγιο είναι πρόταση.', 'The ferry leaves in 20 minutes. Before the ticket time. The timetable is a suggestion.'],
  'npc.groundkeeper': ['Δύο γήπεδα, το ένα απέναντι στο άλλο. Κανείς δεν θυμάται γιατί. Οι οπαδοί, όμως, θυμούνται.', 'Two grounds facing each other. Nobody remembers why. The fans do.'],
  'npc.kastella1': ['Εξήντα σκαλιά ως το σπίτι μου. Η ράμπα έρχεται του χρόνου, μαζί με τον δρόμο.', 'Sixty steps up to my house. The ramp comes next year, with the road.'],
  'npc.kastella2': ['Το Υπουργείο μου ζήτησε χάρτη. Τώρα ψάχνω την κλίμακα.', 'The Ministry asked me for a map. Now I am looking for the scale.'],
  'npc.kastella3': ['Ψάρεψα ένα παλιό εισιτήριο. Ήταν για το πλοίο που έφυγε νωρίτερα.', 'I fished up an old ticket. It was for the ferry that left early.'],
  'npc.kastella.doctor': ['Το νοσοκομείο έχει θέα στο λιμάνι. Για θεραπεία, όχι.', 'The hospital has a harbour view. For treatment, no.'],
  'npc.kastella.wait1': ['Περιμένω από το πρωί. Η σειρά μου ήταν χθες, αλλά με πρόλαβε το Σαββατοκύριακο.', 'I have waited since morning. My turn was yesterday, but the weekend got there first.'],
  'npc.kastella.customer': ['Ήθελα εφημερίδα. Μου έδωσαν ρέστα: τίποτα.', 'I wanted a newspaper. They gave me change: nothing.'],
  'npc.theatre.view': ['Από εδώ φαίνεται όλο το λιμάνι. Και ο χάρτης του Υπουργείου. Δεν ταιριάζουν.', 'From here you see the whole harbour. And the Ministry map. They do not match.'],
  'npc.theatre.old': ['Βλέπω την ίδια παράσταση σαράντα χρόνια. Η πλοκή αλλάζει μόνο στις επαναλήψεις.', 'I have seen the same play for forty years. The plot only changes in the reruns.'],
  'tr.fan.intro': ['Δύο γήπεδα, μία έδρα και κανένας διαιτητής. Έλα να παίξουμε!', 'Two grounds, one home ground and no referee. Come, let us play!'],
  'tr.fan.win': ['Άδικο! Ο διαιτητής ήταν στο ντουλάπι.', 'Unfair! The referee was in the cupboard.'],
  'tr.fan.after': ['Την άλλη εβδομάδα παίζουμε εντός έδρας. Ή εκτός. Ό,τι βγει.', 'Next week we play at home. Or away. Whatever comes out.'],
  'tr.ferrysailor.intro': ['Το πλοίο φεύγει σε είκοσι λεπτά! Μέχρι τότε, μια μάχη;', 'The ferry leaves in twenty minutes! Until then, a battle?'],
  'tr.ferrysailor.win': ['Έχασα το πλοίο. Δεν πειράζει, έφυγε χθες.', 'I missed the ferry. No matter, it left yesterday.'],
  'tr.ferrysailor.after': ['Το πλοίο έφυγε πριν. Πάντα φεύγει πριν.', 'The ferry left earlier. It always does.'],

  'map.faliro.hospital': ['Νοσοκομείο Φαλήρου 3000', 'Faliro Hospital 3000'], 'map.faliro.shop': ['Περίπτερο Φαλήρου', 'Faliro Kiosk'],
  'map.faliro.cafe': ['Καφενείο «Ο Παραλιακός»', 'Cafe "The Coast Road"'], 'map.route4': ['Διαδρομή 4: Ελληνικό', 'Route 4: The Old Airfield'],
  'map.glyfada': ['Γλυφάδα', 'Glyfada'], 'map.glyfada.hospital': ['Νοσοκομείο Γλυφάδας 3000', 'Glyfada Hospital 3000'],
  'map.glyfada.shop': ['Περίπτερο Γλυφάδας', 'Glyfada Kiosk'], 'map.glyfada.boss': ['Η Μεγάλη Προκυμαία', 'The Great Waterfront'],
  'warp.route3': ['Ο δρόμος προς τα Νότια είναι κλειστός. Πρώτα το Παράσημο Λιμανιού.', 'The road to the South is closed. The Port Medal first.'],
  'sign.kastella.east': ['Προς τα Νότια: Λεωφόρος Ποσειδώνος. Τα έργα τελειώνουν του χρόνου.', 'To the South: Poseidon Avenue. The works finish next year.'],
  'sign.route3': ['Διαδρομή 3: Λεωφόρος Ποσειδώνος. Δρόμος με τραμ, παραλία και ένα έργο που δεν τελειώνει.', 'Route 3: Poseidon Avenue. A road with a tram, a beach and a project that never ends.'],
  'sign.faliro': ['Παλαιό Φάληρο. Η παραλία είναι δωρεάν. Η καρέκλα, ένα Φακελάκι.', 'Old Faliro. The beach is free. The chair costs one Φακελάκι.'],
  'sign.faliro.hospital': ['Νοσοκομείο Φαλήρου 3000. Δίπλα στο τραμ. Όποιο έρθει πρώτο.', 'Faliro Hospital 3000. Next to the tram. Whichever comes first.'],
  'sign.faliro.cafe': ['Καφενείο «Ο Παραλιακός». Καφές με θέα. Η θέα χρεώνεται.', 'Cafe "The Coast Road". Coffee with a view. The view is charged.'],
  'sign.faliro.tram': ['Στάση τραμ. Επόμενο τραμ: σύντομα. Προηγούμενο τραμ: ποτέ.', 'Tram stop. Next tram: soon. Previous tram: never.'],
  'sign.route4': ['Διαδρομή 4: Ελληνικό. Το αεροδρόμιο έκλεισε. Το μεγάλο έργο ανοίγει του χρόνου.', 'Route 4: The Old Airfield. The airport closed. The big project opens next year.'],
  'sign.glyfada': ['Γλυφάδα. Μαρίνα, γκολφ και κλαμπ. Η είσοδος είναι δωρεάν. Η έξοδος, όχι.', 'Glyfada. Marina, golf and clubs. Entry is free. Leaving is not.'],
  'sign.glyfada.hospital': ['Νοσοκομείο Γλυφάδας 3000. Η αναμονή έχει θέα στη μαρίνα.', 'Glyfada Hospital 3000. The waiting list has a marina view.'],
  'sign.glyfada.cafe': ['Η Μεγάλη Προκυμαία. Καφές, μπουγάτσα και η τελευταία λέξη.', 'The Great Waterfront. Coffee, bougatsa and the last word.'],
  'sign.glyfada.club': ['Κλαμπ «Μεσάνυχτα». Ανοίγει στις δύο. Πάντα στις δύο.', 'Club "Midnight". Opens at two. Always at two.'],
  'npc.beachgoer': ['Η άμμος είναι δωρεάν. Το να καθίσεις πάνω της, όχι.', 'The sand is free. Sitting on it is not.'],
  'npc.roadworker': ['Τελειώνουμε του χρόνου. Το λέω εδώ και είκοσι χρόνια, αλλά μετράει ως πρόοδος.', 'We finish next year. I have said so for twenty years, but it counts as progress.'],
  'npc.faliro1': ['Το τραμ έρχεται όταν βαρεθεί. Τα εισιτήρια, πάντως, ισχύουν.', 'The tram comes when it gets bored. The tickets, though, are valid.'],
  'npc.faliro2': ['Ήρθα για έναν καφέ. Πήρα ήδη δύο αποφάσεις. Καμία δεν εφαρμόστηκε.', 'I came for one coffee. I have already made two decisions. Neither was carried out.'],
  'npc.faliro3': ['Η θάλασσα είναι δωρεάν. Το να τη βλέπεις έχει τιμή.', 'The sea is free. Looking at it has a price.'],
  'npc.faliro.doctor': ['Θέα στη μαρίνα έχουμε. Ράντζο με θέα, όχι.', 'We have a marina view. A cot with a view, no.'],
  'npc.faliro.wait1': ['Έχω ραντεβού από το 2990. Ήρθα νωρίς για να μη χάσω τη σειρά.', 'I have had an appointment since 2990. I came early so as not to lose my place.'],
  'npc.faliro.customer': ['Ζήτησα αντηλιακό. Μου έδωσαν υπόσχεση ότι θα έρθει καλοκαίρι.', 'I asked for sunscreen. They gave me a promise that summer will come.'],
  'cafe.hello.faliro': ['Καφενείο «Ο Παραλιακός». Καφές με θέα και λογαριασμός με ηχώ.', 'Cafe "The Coast Road". Coffee with a view and a bill with an echo.'],
  'npc.fcafe1': ['Τα ζάρια είναι του παππού. Φέρνουν πάντα εξάρες. Όταν παίζει εκείνος.', "The dice are grandpa's. They always roll sixes. When he plays."],
  'npc.fcafe2': ['Από εδώ βλέπω τα γιοτ. Κάποτε θα δω και τον ιδιοκτήτη.', 'From here I see the yachts. One day I will see an owner too.'],
  'npc.airfield1': ['Εδώ θα γίνει κάτι μεγάλο. Το λένε χρόνια. Οι γερανοί περιμένουν υπομονετικά.', 'Something big will be built here. They have said so for years. The cranes wait patiently.'],
  'npc.airfield2': ['Τα αεροπλάνα έφυγαν. Έμειναν οι διάδρομοι και οι υποσχέσεις.', 'The planes left. The runways and the promises stayed.'],
  'npc.glyfada1': ['Αυτό το σκάφος είναι δικό μου. Δηλαδή του φίλου μου. Δηλαδή της εταιρείας του.', "That boat is mine. Well, my friend's. Well, his company's."],
  'npc.glyfada2': ['Το γκολφ θέλει νερό. Ο δήμος θέλει υπομονή.', 'Golf wants water. The council wants patience.'],
  'npc.glyfada3': ['Το κλαμπ ανοίγει στις δύο. Το ρολόι του δείχνει πάντα μία και πενήντα εννέα.', 'The club opens at two. Its clock always shows one fifty-nine.'],
  'npc.glyfada.doctor': ['Θέα στα γιοτ έχουμε. Τα ράντζα κοιτάνε τον τοίχο.', 'We have a view of the yachts. The cots face the wall.'],
  'npc.glyfada.wait1': ['Περιμένω σειρά από το πρωί. Η αναμονή έχει θέα στη μαρίνα, τουλάχιστον.', 'I have waited for my turn since morning. The wait has a marina view, at least.'],
  'npc.glyfada.customer': ['Πήρα νερό. Κοστίζει όσο ένα εισιτήριο. Ένα καλό εισιτήριο.', 'I bought water. It costs as much as a ticket. A good ticket.'],
  'npc.boss.cust1': ['Ένας καφές, δύο ώρες, μία μπουγάτσα για δύο. Έτσι κλείνουν οι συμφωνίες.', 'One coffee, two hours, one bougatsa for two. That is how deals are closed.'],
  'npc.boss.cust2': ['Η συζήτηση ξεκίνησε για την οικονομία. Τελείωσε στο γέμισμα. Πάντα τελειώνει εκεί.', 'The talk started with the economy. It ended at the filling. It always ends there.'],
  'item.dikigoros': ['Δικηγόρος', 'Δικηγόρος (lawyer)'], 'item.gemista': ['Γεμιστά της Μάνας', "Mum's Γεμιστά"],
  'itemd.dikigoros': ['Γιατρεύει 80 ΥΓ και κλείνει κάθε υπόθεση: καμία κατάσταση δεν επιζεί. Με αμοιβή.', 'Heals 80 HP and closes every case: no status survives. Fees apply.'],
  'item.chontros': ['Χοντρός Φάκελος', 'Thick Φάκελος'],
  'itemd.chontros': ['Πολύ χοντρός (x2,5). Οι πόρτες ανοίγουν μόνες τους.', 'Very thick (x2.5). Doors open by themselves.'],
  'itemd.gemista': ['Γιατρεύει πλήρως και σβήνει κάθε κατάσταση. Με τη Μάνα δεν διαφωνεί κανείς.', 'Full heal and clears every status. Nobody argues with Mum.'],
  'tr.lifeguard.intro': ['Η παραλία είναι δωρεάν! Μόνο η σκιά χρεώνεται. Έλα να τα πούμε.', 'The beach is free! Only the shade is charged. Come, let us talk.'],
  'tr.lifeguard.win': ['Έχασα. Θα γράψω στην αναφορά ότι έσωσα εγώ εσένα.', 'I lost. I will write in the report that I saved you.'],
  'tr.lifeguard.after': ['Η σημαία είναι πράσινη. Χθες ήταν ό,τι χρώμα είχε ο χορηγός.', 'The flag is green. Yesterday it was whatever colour the sponsor had.'],
  'tr.sunbedseller.intro': ['Μία ξαπλώστρα, ένα Φακελάκι. Και μία μάχη για το ρέστο.', 'One sunbed, one Φακελάκι. And a battle for the change.'],
  'tr.sunbedseller.win': ['Μου χαλάς τον τζίρο. Ποιος θα πληρώσει την ομπρέλα;', 'You are ruining my turnover. Who will pay for the parasol?'],
  'tr.sunbedseller.after': ['Η ξαπλώστρα είναι δική σου. Ο ήλιος, όχι.', 'The sunbed is yours. The sun is not.'],
  'tr.conductor.intro': ['Το εισιτήριο, παρακαλώ! Δεν έχεις; Έχουμε μάχη.', 'Your ticket, please! None? Then we have a battle.'],
  'tr.conductor.win': ['Ακυρώνεται το εισιτήριο. Και η μάχη.', 'The ticket is cancelled. So is the battle.'],
  'tr.conductor.after': ['Το τραμ ήρθε. Άργησε μόνο τρεις ώρες. Ρεκόρ.', 'The tram came. It was only three hours late. A record.'],
  'tr.golfer.intro': ['Η έκταση είναι τεράστια και άδεια. Ιδανική για μία τρύπα και μία μάχη.', 'The land is huge and empty. Ideal for one hole and one battle.'],
  'tr.golfer.win': ['Η μπάλα χάθηκε. Μαζί με τη μισή μου περιουσία.', 'The ball is lost. Together with half my estate.'],
  'tr.golfer.after': ['Παίζω εδώ από πριν αρχίσουν να χτίζουν. Και από πριν σταματήσουν.', 'I have played here since before they built. And before they stopped.'],
  'tr.surfer.intro': ['Πρόσεξε το φόντο! Αύριο έχω ανάρτηση με χορηγό. Μπορώ να σε βάλω στο καρέ;', 'Mind the background! Tomorrow I have a sponsored post. May I put you in the frame?'],
  'tr.surfer.win': ['Εσύ βγήκες καλύτερα στη φωτογραφία. Αδικία.', 'You came out better in the photo. Unfair.'],
  'tr.surfer.after': ['Η ανάρτηση ανέβηκε. Το φίλτρο το έφτιαξε ο ήλιος.', 'The post is up. The sun made the filter.'],
  'tr.skipper.intro': ['Το σκάφος δεν είναι δικό μου. Ούτε το λιμάνι. Η μάχη, ναι.', 'The boat is not mine. Neither is the harbour. The battle is.'],
  'tr.skipper.win': ['Βυθίστηκα. Δεν πειράζει, το σκάφος δεν ήταν δικό μου.', 'I sank. No matter, the boat was not mine.'],
  'tr.skipper.after': ['Ο ιδιοκτήτης λείπει. Όπως πάντα.', 'The owner is away. As always.'],
  'tr.rival3.intro': ['Εσύ ξανά! Ο θείος μου έφερε εξέλιξη. Με απευθείας ανάθεση.', 'You again! My uncle got me an evolution. By direct assignment.'],
  'tr.rival3.win': ['Θα τηλεφωνήσω ξανά. Αυτή τη φορά σε υψηλότερο όροφο.', 'I will call again. This time to a higher floor.'],
  'tr.rival3.after': ['Ο Μπέμπης έφυγε. Πήρε το ασανσέρ προς τα πάνω.', 'Bebis left. He took the lift up.'],
  'tr.bougatsas.intro': ['Καλώς ήρθες στη Μεγάλη Προκυμαία. Εδώ κάθε συζήτηση τελειώνει στο γέμισμα της μπουγάτσας. Τα δικά μου τρώνε μπουγάτσα με διπλή κρέμα. Κάτσε, {ανιψιέ|ανιψιά}.', 'Welcome to the Great Waterfront. Here every talk ends at the filling of the bougatsa. Mine eat bougatsa with double cream. Sit down, nephew.'],
  'tr.bougatsas.win': ['Ωραία. Το Παράσημο είναι δικό σου. Η μπουγάτσα όμως είναι δική μου.', 'Fine. The medal is yours. The bougatsa, though, is mine.'],
  'tr.bougatsas.after': ['Η συζήτηση συνεχίζεται. Δεν θα καταλήξει πουθενά, αλλά με άχνη ζάχαρη.', 'The talk goes on. It will end nowhere, but with powdered sugar.'],
  'boss.bougatsas.win2': ['Κέρδισες. Το Παράσημο Παραλιακής είναι δικό σου, με τον όρο να πληρώσεις τον καφέ.', 'You won. The Coast Medal is yours, on the condition that you pay for the coffee.'],
  'boss.bougatsas.win3': ['Πήρες το Παράσημο Παραλιακής! Ο δρόμος προς τα Ανατολικά άνοιξε. Τα έργα, όμως, συνεχίζονται.', 'You got the Coast Medal! The road to the East is open. The works, however, go on.'],
  'badge.notia.title': ['ΠΑΡΑΣΗΜΟ ΠΑΡΑΛΙΑΚΗΣ', 'COAST MEDAL'], 'badge.notia.sub': ['Χωρίς απόδειξη.', 'No receipt.'],
  // Ανατολικά (MZ-WORLD-02c): places, signs, people, the boss and its badge, the five new creatures. Running joke: every sign has a sponsor, every gate is Β12.
  'map.route5': ['Διαδρομή 5: Υμηττός', 'Route 5: The Hymettus Pass'], 'map.koropi': ['Κορωπί', 'Koropi'],
  'map.koropi.hospital': ['Νοσοκομείο Κορωπιού 3000', 'Koropi Hospital 3000'], 'map.koropi.shop': ['Περίπτερο Κορωπιού', 'Koropi Kiosk'],
  'map.koropi.cafe': ['Καφενείο «Το Κτήμα»', 'Cafe "The Estate"'], 'map.route6': ['Διαδρομή 6: Μεσόγεια', 'Route 6: The Plain'],
  'map.spata': ['Σπάτα', 'Spata'], 'map.spata.hospital': ['Νοσοκομείο Σπάτων 3000', 'Spata Hospital 3000'],
  'map.spata.shop': ['Περίπτερο Σπάτων', 'Spata Kiosk'], 'map.spata.boss': ['Διαστημολιμένας', 'The Spaceport'],
  'warp.route5': ['Ο δρόμος προς τα Ανατολικά είναι κλειστός. Πρώτα το Παράσημο Παραλιακής.', 'The road to the East is closed. The Coast Medal first.'],
  'sign.route5': ['Διαδρομή 5: Υμηττός. Στροφή, στροφή, στροφή. Η κορυφή είναι πάντα στην επόμενη.', 'Route 5: Hymettus. Bend, bend, bend. The top is always at the next one.'],
  'sign.monastery': ['Μονή. Επισκέψεις: όταν ανοίξει η πόρτα. Παρακαλούμε ησυχία.', 'Monastery. Visits: when the door opens. Silence, please.'],
  'sign.koropi': ['Κορωπί. Αυτή η πινακίδα χορηγείται από την επόμενη πινακίδα.', 'Koropi. This sign is sponsored by the next sign.'],
  'sign.koropi.town': ['Πλατεία. Το σιντριβάνι λειτουργεί με χορηγό. Χωρίς χορηγό, ψιθυρίζει.', 'Square. The fountain runs on a sponsor. Without one, it whispers.'],
  'sign.koropi.hospital': ['Νοσοκομείο Κορωπιού 3000. Η αναμονή χορηγείται.', 'Koropi Hospital 3000. The waiting is sponsored.'],
  'sign.koropi.cafe': ['Καφενείο «Το Κτήμα». Κρασί από το κτήμα, λογαριασμός από τον χορηγό.', 'Cafe "The Estate". Wine from the estate, the bill from the sponsor.'],
  'sign.route6': ['Διαδρομή 6: Μεσόγεια. Η γέφυρα από πάνω δεν πηγαίνει πουθενά. Ο δρόμος από κάτω, στα Σπάτα.', 'Route 6: The Plain. The bridge above goes nowhere. The road below goes to Spata.'],
  'sign.spata': ['Σπάτα. Αεροδρόμιο. Η πινακίδα εξόδου χορηγείται από την είσοδο.', 'Spata. Airport. The exit sign is sponsored by the entrance.'],
  'sign.spata.hospital': ['Νοσοκομείο Σπάτων 3000. Πύλη Β12, ισόγειο.', 'Spata Hospital 3000. Gate Β12, ground floor.'],
  'sign.spata.terminal': ['Διαστημολιμένας. Πτήσεις προς τα θέρετρα της τροχιάς. Όλες από την Πύλη Β12.', 'Spaceport. Flights to the orbital resorts. All from Gate Β12.'],
  'sign.spata.north': ['Προς τα Βόρεια: Πεντέλη. Η έξοδος χορηγείται από τον Διαστημολιμένα. Το μάρμαρο, από το λατομείο.', 'To the North: Penteli. The exit is sponsored by the Spaceport. The marble, by the quarry.'],
  'npc.hiker': ['Κάθε στροφή λέει «η κορυφή είναι εδώ». Είναι ψέμα. Αλλά με χορηγό.', 'Every bend says "the top is here". It is a lie. But sponsored.'],
  'npc.wallkeeper': ['Ο τοίχος στέκει από πάντα. Η πινακίδα του, όχι. Η πινακίδα έχει χορηγό.', 'The wall has stood forever. Its sign has not. The sign has a sponsor.'],
  'npc.koropi1': ['Εδώ όλα έχουν χορηγό. Το σιντριβάνι, ο πάγκος, ακόμα και ο πεζόδρομος.', 'Everything here has a sponsor. The fountain, the bench, even the pavement.'],
  'npc.koropi2': ['Το κρασί μας βγαίνει από το σταφύλι. Η ετικέτα βγαίνει από τον χορηγό.', 'Our wine comes from the grape. The label comes from the sponsor.'],
  'npc.koropi3': ['Μου είπαν να μη βγάζω φωτογραφίες. Μετά μου είπαν να βγάζω, για τον χορηγό.', 'They told me not to take photos. Then they told me to, for the sponsor.'],
  'npc.koropi.doctor': ['Οι γιατροί φοράνε το λογότυπο του χορηγού. Οι ασθενείς, ένα βραχιολάκι.', "The doctors wear the sponsor's logo. The patients, a wristband."],
  'npc.koropi.wait1': ['Περιμένω σειρά. Η σειρά μου χορηγείται από την προηγούμενη σειρά.', 'I am waiting for my turn. My turn is sponsored by the previous turn.'],
  'npc.koropi.customer': ['Πήρα μια εφημερίδα. Τα νέα είχαν ήδη χορηγό.', 'I bought a newspaper. The news already had a sponsor.'],
  'cafe.hello.koropi': ['Καφενείο «Το Κτήμα». Καφές από το κτήμα και ο λογαριασμός από πάνω.', 'Cafe "The Estate". Coffee from the estate and the bill on top.'],
  'npc.kcafe1': ['Μία ώρα για έναν καφέ. Η δεύτερη ώρα χορηγείται.', 'One hour for one coffee. The second hour is sponsored.'],
  'npc.kcafe2': ['Το κρασί του κτήματος είναι ό,τι βρεθεί στο κελάρι. Η ετικέτα, ό,τι βρεθεί στο συρτάρι.', 'The estate wine is whatever is in the cellar. The label, whatever is in the drawer.'],
  'npc.farmhand': ['Περνάνε αεροπλάνα πάνω από τα αμπέλια. Τα σταφύλια κάνουν ότι δεν τα βλέπουν.', 'Planes pass over the vines. The grapes pretend not to see them.'],
  'npc.bridgewalker': ['Η γέφυρα οδηγεί στην Πύλη Β12. Έτσι λένε. Δεν την έχει βρει κανείς.', 'The bridge leads to Gate Β12. So they say. Nobody has found it.'],
  'npc.spata.queue1': ['Η ουρά για την Πύλη Β12 ξεκινά εδώ. Πού είναι η Πύλη Β12, κανείς δεν ξέρει.', 'The queue for Gate Β12 starts here. Where Gate Β12 is, nobody knows.'],
  'npc.spata.queue2': ['Στέκομαι εδώ από χθες. Δεν ξέρω για ποια πτήση. Η ουρά είναι ο χορηγός μου.', 'I have stood here since yesterday. I do not know for which flight. The queue is my sponsor.'],
  'npc.spata.queue3': ['Το διαβατήριο το σφραγίζει ο χορηγός. Το πρόσωπό μου, ο άλλος χορηγός.', 'The sponsor stamps the passport. The other sponsor stamps my face.'],
  'npc.spata.sailor': ['Το «τροχιακό φέρι» φεύγει από τη Ραφήνα. Όποτε βρει τροχιά.', 'The "orbital ferry" leaves from Rafina. Whenever it finds an orbit.'],
  'npc.spata.doctor': ['Εδώ τα ράντζα έχουν ρόδες. Λέμε ότι είναι για την πτήση.', 'Here the cots have wheels. We say it is for the flight.'],
  'npc.spata.wait1': ['Ήρθα για έναν έλεγχο. Μου έδωσαν κάρτα επιβίβασης. Χωρίς πτήση.', 'I came for a check-up. They gave me a boarding pass. No flight.'],
  'npc.spata.customer': ['Πήρα νερό για το ταξίδι. Τα 100 ml πέρασαν. Το μπουκάλι, όχι.', 'I bought water for the trip. The 100 ml went through. The bottle did not.'],
  'npc.spata.cust1': ['Η πτήση μου έχει καθυστέρηση. Η καθυστέρηση έχει πτήση.', 'My flight is delayed. The delay has a flight.'],
  'npc.spata.cust2': ['Ρώτησα πού είναι η Πύλη Β12. Μου έδωσαν κάρτα επιβίβασης για την ερώτηση.', 'I asked where Gate Β12 is. They gave me a boarding pass for the question.'],
  'tr.pilgrim.intro': ['Ανεβαίνω την ανηφόρα με τα πόδια. Να σε ανεβάσω και εσένα σε μια μάχη;', 'I climb the slope on foot. May I take you up for a battle too?'],
  'tr.pilgrim.win': ['Έχασα. Θα το πω σιωπηλά.', 'I lost. I will say it in silence.'],
  'tr.pilgrim.after': ['Η στροφή είναι ακόμα μπροστά. Και η επόμενη. Και η επόμενη.', 'The bend is still ahead. And the next. And the next.'],
  'tr.customs.intro': ['Έλεγχος! Έχεις κάτι να δηλώσεις; Εκτός από ένα Φακελάκι;', 'Checkpoint! Anything to declare? Besides a Φακελάκι?'],
  'tr.customs.win': ['Περνάς. Η σφραγίδα όμως είναι του χορηγού.', 'You may pass. The stamp is the sponsor\'s, though.'],
  'tr.customs.after': ['Επόμενος! Η ουρά δεν τελειώνει. Ούτε ο έλεγχος.', 'Next! The queue does not end. Neither does the check.'],
  'tr.tourist.intro': ['Στάσου στο φόντο! Θέλω ένα βίντεο με μάχη για τους ακολούθους μου.', 'Stand in the background! I want a battle video for my followers.'],
  'tr.tourist.win': ['Το βίντεο δεν ανέβηκε. Κέρδισες εσύ τα «μου αρέσει».', 'The video did not go up. You won the likes.'],
  'tr.tourist.after': ['Φωτογράφισα τη στροφή. Δεν είχε χορηγό. Θα τη σβήσω.', 'I photographed the bend. It had no sponsor. I will delete it.'],
  'tr.vineyard.intro': ['Τα αμπέλια είναι δικά μου. Οι πινακίδες στα αμπέλια, του χορηγού. Μια μάχη;', 'The vines are mine. The signs among the vines belong to the sponsor. A battle?'],
  'tr.vineyard.win': ['Έχασα. Το κρασί βγήκε χωρίς ετικέτα.', 'I lost. The wine came out without a label.'],
  'tr.vineyard.after': ['Ο τρύγος ήρθε νωρίς. Χθες. Το ζήτησε ο χορηγός.', 'The harvest came early. Yesterday. The sponsor asked for it.'],
  'tr.cryptoseller.intro': ['Έχω μια ευκαιρία! Αγόρασε σήμερα, θα αξίζει πολλά... μεθαύριο. Ή μια μάχη;', 'I have an opportunity! Buy today, it will be worth a lot... the day after. Or a battle?'],
  'tr.cryptoseller.win': ['Έπεσε η τιμή. Και η εμπιστοσύνη μου στη μάχη.', 'The price fell. So did my trust in the battle.'],
  'tr.cryptoseller.after': ['Η ευκαιρία έφυγε. Ήταν χορηγούμενη.', 'The opportunity left. It was sponsored.'],
  'tr.spotter.intro': ['Μισό λεπτό, φωτογραφίζω ένα αεροπλάνο. Μια μάχη στο ενδιάμεσο;', 'One minute, I am photographing a plane. A battle in between?'],
  'tr.spotter.win': ['Έχασα και το αεροπλάνο και τη μάχη.', 'I lost the plane and the battle.'],
  'tr.spotter.after': ['Πέρασε ένα αεροπλάνο. Δεν είχε ουρά. Πρωτοφανές.', 'A plane went by. It had no queue. Unheard of.'],
  'tr.checkin.intro': ['Κάρτα επιβίβασης, παρακαλώ! Η μάχη είναι μέρος της διαδικασίας.', 'Boarding pass, please! The battle is part of the procedure.'],
  'tr.checkin.win': ['Εντάξει, περνάς. Η Πύλη Β12 είναι... κάπου. Καλή τύχη.', 'Fine, you pass. Gate Β12 is... somewhere. Good luck.'],
  'tr.checkin.after': ['Επόμενος! Έχεις αποσκευές; Ωραία. Έχεις υπομονή;', 'Next! Any luggage? Good. Any patience?'],
  'tr.faia.intro': ['Καλώς ήρθες στον Διαστημολιμένα, {ακόλουθε|ακόλουθη}! Εδώ κάθε πύλη έχει χορηγό, ακόμα και η έξοδος. Πάμε σε live!', 'Welcome to the Spaceport, follower! Here every gate has a sponsor, even the exit. Let us go live!'],
  'tr.faia.win': ['Έχασα το live! Θα πω ότι ήταν δοκιμαστική μετάδοση.', 'I lost the live! I will say it was a test broadcast.'],
  'tr.faia.after': ['Η μετάδοση συνεχίζεται. Η πύλη μου είναι η Β12. Δεν την έχεις δει;', 'The broadcast goes on. My gate is Β12. Have you not seen it?'],
  'boss.faia.win2': ['Κέρδισες. Το Παράσημο Επιβίβασης είναι δικό σου, με τον όρο να με ακολουθήσεις.', 'You won. The Boarding Medal is yours, on the condition that you follow me.'],
  'boss.faia.win3': ['Πήρες το Παράσημο Επιβίβασης! Ο δρόμος προς τα Βόρεια άνοιξε. Η πτήση, όμως, καθυστερεί.', 'You got the Boarding Medal! The road to the North is open. The flight, however, is delayed.'],
  'badge.anatolika.title': ['ΠΑΡΑΣΗΜΟ ΕΠΙΒΙΒΑΣΗΣ', 'BOARDING MEDAL'], 'badge.anatolika.sub': ['Η πτήση καθυστερεί.', 'The flight is delayed.'],
  'sp.monastiriaki': ['Γνωστό για: τοίχους με θέα, ησυχία με χρέωση και ακίνητα που δεν φορολογούνται. Ποτέ δεν καταδικάστηκε.', 'Μοναστηριάκι = "Little Monastery". Known for: walls with a view, silence for a fee and property that is not taxed. Never convicted.'],
  'sp.monimos': ['Γνωστός για: μια θέση που δεν χάνεται ούτε με μετάθεση ούτε με μετάνοια. Ποτέ δεν καταδικάστηκε.', 'Μόνιμος = "Permanent". Known for: a post that is lost neither by transfer nor by regret. Never convicted.'],
  'sp.influenza': ['Γνωστή για: μια ανάρτηση που κολλάει σαν γρίπη και ένα φίλτρο για κάθε δάκρυ. Ποτέ δεν καταδικάστηκε.', 'Influεnζα = "Influenza". Known for: a post that spreads like a flu and a filter for every tear. Never convicted.'],
  'sp.kryptomakis': ['Γνωστός για: μια ευκαιρία που αξίζει πολλά και ένα πορτοφόλι που δεν βρέθηκε ποτέ. Ποτέ δεν καταδικάστηκε.', 'Κρυπτο-Μάκης = "Crypto-Maki". Known for: an opportunity worth a lot and a wallet that was never found. Never convicted.'],
  'sp.nftarchis': ['Γνωστός για: εικόνες που κοστίζουν ένα σπίτι και δεν κρεμιούνται πουθενά. Ποτέ δεν καταδικάστηκε.', 'NFT-άρχης = "NFT-arch". Known for: pictures that cost a house and hang nowhere. Never convicted.'],
  // Βόρεια (MZ-WORLD-02d): places, signs, people, the boss and its badge, the seven new creatures. Running joke: the old stars are on a permanent comeback tour, the stadium is always being renovated.
  'map.route7': ['Διαδρομή 7: Πεντέλη', 'Route 7: The Marble Mountain'], 'map.kifisia': ['Κηφισιά', 'Kifisia'],
  'map.kifisia.hospital': ['Νοσοκομείο Κηφισιάς 3000', 'Kifisia Hospital 3000'], 'map.kifisia.shop': ['Περίπτερο Κηφισιάς', 'Kifisia Kiosk'],
  'map.kifisia.cafe': ['Καφενείο «Ο Πλάτανος»', 'Cafe "The Plane Tree"'], 'map.route8': ['Διαδρομή 8: Λεωφόρος Κηφισίας', 'Route 8: Kifisia Avenue'],
  'map.marousi': ['Μαρούσι', 'Marousi'], 'map.marousi.hospital': ['Νοσοκομείο Αμαρουσίου 3000', 'Marousi Hospital 3000'],
  'map.marousi.shop': ['Περίπτερο Αμαρουσίου', 'Marousi Kiosk'], 'map.marousi.boss': ['Στάδιο Συναυλιών 3000', 'Concert Stadium 3000'],
  'warp.route7': ['Ο δρόμος προς τα Βόρεια είναι κλειστός. Πρώτα το Παράσημο Επιβίβασης.', 'The road to the North is closed. The Boarding Medal first.'],
  'sign.route7': ['Διαδρομή 7: Πεντέλη. Το μάρμαρο είναι λευκό, τα χαρτιά όχι. Προσοχή, πέφτουν πέτρες.', 'Route 7: Penteli. The marble is white, the paperwork is not. Mind the falling stones.'],
  'sign.quarry': ['Λατομείο. Ο γερανός στέκει εδώ από το 2961. Η δουλειά, όχι.', 'Quarry. The crane has stood here since 2961. The work has not.'],
  'sign.kifisia': ['Κηφισιά. Τέρμα του μετρό. Και αρχή του λογαριασμού.', 'Kifisia. The end of the metro line. And the start of the bill.'],
  'sign.kifisia.town': ['Πλατεία Πλατάνων. Οι πλάτανοι είναι προστατευόμενοι. Οι ένοικοι, λιγότερο.', 'Plane Tree Square. The plane trees are protected. The residents, less so.'],
  'sign.kifisia.hospital': ['Νοσοκομείο Κηφισιάς 3000. Η αναμονή γίνεται στον κήπο. Δεν τελειώνει ούτε εκεί.', 'Kifisia Hospital 3000. The waiting is done in the garden. It does not end there either.'],
  'sign.kifisia.cafe': ['Καφενείο «Ο Πλάτανος». Ο καφές κοστίζει όσο ένα δέντρο.', 'Cafe "The Plane Tree". The coffee costs as much as a tree.'],
  'sign.kifisia.metro': ['Μετρό 3000. Τέρμα Κηφισιά. Το τέρμα κοστίζει περισσότερο από τη διαδρομή.', 'Metro 3000. Terminus Kifisia. The end of the line costs more than the line.'],
  'sign.route8': ['Διαδρομή 8: Λεωφόρος Κηφισίας. Δέκα χιλιόμετρα βιτρίνες. Ένας δρόμος.', 'Route 8: Kifisia Avenue. Ten kilometres of shop windows. One road.'],
  'sign.roundabout': ['Κυκλικός κόμβος. Έξι έξοδοι. Η σωστή είναι πάντα η επόμενη.', 'Roundabout. Six exits. The right one is always the next.'],
  'sign.marousi.road': ['Μαρούσι. Το στάδιο είναι σε ανακαίνιση. Από το 2961.', 'Marousi. The stadium is under renovation. Since 2961.'],
  'sign.marousi.hospital': ['Νοσοκομείο Αμαρουσίου 3000. Η ανακαίνιση τελειώνει του χρόνου.', 'Marousi Hospital 3000. The renovation finishes next year.'],
  'sign.marousi.stadium': ['Στάδιο Συναυλιών 3000. Σε ανακαίνιση. Η στέγη κόστισε τρεις φορές τον προϋπολογισμό.', 'Concert Stadium 3000. Under renovation. The roof cost three times the plan.'],
  'sign.marousi.tennis': ['Όμιλος Αντισφαίρισης. Μόνο για μέλη. Η αναμονή για να γίνεις μέλος: δέκα χρόνια.', 'Tennis Club. Members only. The wait to become a member: ten years.'],
  'sign.marousi.west': ['Προς τα Δυτικά: ο αυτοκινητόδρομος. Τα διόδια θα τα πληρώσεις και στον γυρισμό.', 'To the West: the Ring Road. You will pay the toll on the way back too.'],
  'npc.quarryman': ['Κόβουμε μάρμαρο για το ίδιο γήπεδο εδώ και χρόνια. Το γήπεδο μεγαλώνει πιο γρήγορα από το λατομείο.', 'We have cut marble for the same stadium for years. The stadium grows faster than the quarry.'],
  'npc.stonecutter': ['Το μάρμαρο είναι αιώνιο. Η προθεσμία, όχι.', 'Marble is eternal. The deadline is not.'],
  'npc.kifisia1': ['Το μετρό φτάνει ως εδώ. Το ενοίκιο, πιο πέρα.', 'The metro comes this far. The rent goes further.'],
  'npc.kifisia2': ['Κάθε βίλα έχει φράχτη. Κάθε φράχτης έχει δικό του φράχτη.', 'Every villa has a hedge. Every hedge has a hedge of its own.'],
  'npc.kifisia3': ['Ο κήπος μου είναι τόσο μεγάλος που έχει δική του στάση λεωφορείου. Το λεωφορείο δεν έρχεται ποτέ.', 'My garden is so big it has its own bus stop. The bus never comes.'],
  'npc.kifisia.doctor': ['Εδώ οι ασθενείς περιμένουν στον κήπο. Με τσάι. Και με λογαριασμό.', 'Here the patients wait in the garden. With tea. And with a bill.'],
  'npc.kifisia.wait1': ['Περιμένω σειρά. Στο ιδιωτικό η αναμονή είναι πιο πολυτελής.', 'I am waiting my turn. In the private one the waiting is more luxurious.'],
  'npc.kifisia.customer': ['Πήρα νερό. Το μπουκάλι είχε ιστορία. Και ΦΠΑ.', 'I bought water. The bottle had a history. And VAT.'],
  'cafe.hello.kifisia': ['Καφενείο «Ο Πλάτανος». Ο καφές ψήνεται στον ίσκιο. Ο λογαριασμός, στον ήλιο.', 'Cafe "The Plane Tree". The coffee roasts in the shade. The bill, in the sun.'],
  'npc.kfcafe1': ['Μία ώρα για έναν εσπρέσο. Η δεύτερη ώρα, για τον κήπο.', 'One hour for one espresso. The second hour, for the garden.'],
  'npc.kfcafe2': ['Στον Πλάτανο όλοι έχουν γνώμη. Κανείς δεν έχει ρέστα.', 'At the Plane Tree everyone has an opinion. Nobody has change.'],
  'npc.shopper': ['Μπήκα για μία βιτρίνα. Βγήκα με δέκα. Τις είδα όλες.', 'I went in for one window. I came out with ten. I saw them all.'],
  'npc.driver': ['Ο κυκλικός κόμβος έχει έξι εξόδους. Η μία πηγαίνει κάπου.', 'The roundabout has six exits. One of them goes somewhere.'],
  'npc.marousi1': ['Το στάδιο είναι σε ανακαίνιση από το 2961. Η στέγη κόστισε τρεις φορές. Δεν είπαν ποιος πλήρωσε.', 'The stadium has been under renovation since 2961. The roof cost three times. They did not say who paid.'],
  'npc.marousi2': ['Εδώ οι σταρ γυρνούν πίσω κάθε χρόνο, με «περιοδεία επανόδου».', 'The stars return here every year, on a "comeback tour".'],
  'npc.marousi3': ['Έχω εισιτήριο για την πρώτη σειρά. Η πρώτη σειρά είναι στο βάθος.', 'I have a ticket for the first row. The first row is at the back.'],
  'npc.marousi.doctor': ['Οι περισσότεροι ασθενείς έρχονται από συναυλία. Η πρώτη σειρά ακούει περισσότερο.', 'Most patients come from a concert. The first row hears the most.'],
  'npc.marousi.wait1': ['Πήγα στη συναυλία για να δω. Άκουσα. Τώρα βλέπω μόνο ηχώ.', 'I went to the concert to see. I heard. Now I only see an echo.'],
  'npc.marousi.customer': ['Πήρα ωτοασπίδες. Η συναυλία είναι σε τρία χρόνια. Προληπτικά.', 'I bought earplugs. The concert is in three years. Just in case.'],
  'npc.marousi.cust1': ['Περιμένω την περιοδεία επανόδου. Είναι η δέκατη φορά. Η τελευταία, λένε.', 'I am waiting for the comeback tour. It is the tenth time. The last one, they say.'],
  'npc.marousi.cust2': ['Ο DJ παίζει ένα και μόνο κομμάτι. Το λέει «μίξη».', 'The DJ plays one single track. He calls it a "mix".'],
  'tr.oldstar.intro': ['Δεν σταμάτησα ποτέ! Απλώς έκανα μια παύση είκοσι ετών. Έλα στην περιοδεία επανόδου!', 'I never stopped! I just took a pause of twenty years. Come to the comeback tour!'],
  'tr.oldstar.win': ['Το κοινό δεν χειροκρότησε. Ήταν σε διάλειμμα.', 'The audience did not clap. It was on a break.'],
  'tr.oldstar.after': ['Η περιοδεία συνεχίζεται. Η επόμενη στάση είναι πάντα του χρόνου.', 'The tour goes on. The next stop is always next year.'],
  'tr.gardener.intro': ['Φροντίζω έναν κήπο. Τον ιδιοκτήτη δεν τον έχω δει ποτέ. Μια μάχη για το μεροκάματο;', 'I tend a garden. I have never seen the owner. A battle for the day wage?'],
  'tr.gardener.win': ['Έχασα. Ο φράχτης θα μείνει άκοπος. Και ο ιδιοκτήτης αόρατος.', 'I lost. The hedge stays unclipped. And the owner stays unseen.'],
  'tr.gardener.after': ['Ο κήπος θέλει νερό. Το νερό θέλει λογαριασμό. Ο λογαριασμός θέλει εμένα.', 'The garden wants water. The water wants a bill. The bill wants me.'],
  'tr.contestant.intro': ['Είμαι σε ριάλιτι! Οι κάμερες είναι παντού! Δώσε μου σκηνή: μια μάχη!', 'I am on a reality show! The cameras are everywhere! Give me a scene: a battle!'],
  'tr.contestant.win': ['Με έβγαλαν από το παιχνίδι. Θα το πω «ψηφοφορία».', 'They voted me out of the game. I will call it "a vote".'],
  'tr.contestant.after': ['Έχω δικό μου επεισόδιο. Δεν ξέρω ποιος το βλέπει.', 'I have an episode of my own. I do not know who watches it.'],
  'tr.lobbyist.intro': ['Μια χάρη, ένας φάκελος, μια μάχη. Με αυτή τη σειρά. Ποτέ το αντίθετο.', 'A favour, an envelope, a battle. In that order. Never the opposite.'],
  'tr.lobbyist.win': ['Έχασα τη μάχη. Θα μιλήσω σε κάποιον να αλλάξει το αποτέλεσμα.', 'I lost the battle. I will speak to someone to change the result.'],
  'tr.lobbyist.after': ['Δεν έχασα. Έκανα επένδυση στην ήττα.', 'I did not lose. I invested in the defeat.'],
  'tr.tennis.intro': ['Μόνο για μέλη! Αλλά για μια μάχη κάνω εξαίρεση. Πλήρωσες τη συνδρομή;', 'Members only! But I make an exception for a battle. Have you paid the fee?'],
  'tr.tennis.win': ['Έχασα! Αυτό δεν υπάρχει στον κανονισμό του ομίλου.', 'I lost! That is not in the rules of the club.'],
  'tr.tennis.after': ['Η ρακέτα μου έσπασε. Ο όμιλος θα την αλλάξει. Σε δέκα χρόνια.', 'My racket broke. The club will replace it. In ten years.'],
  'tr.rival4.intro': ['Ακόμα εδώ; Ο θείος μου κανόνισε την πρώτη σειρά. Εσύ έχεις εισιτήριο;', 'Still here? My uncle arranged the first row. Do you have a ticket?'],
  'tr.rival4.win': ['Θα τηλεφωνήσω στον διευθυντή του σταδίου. Δεν χρειάζεται να ξέρεις γιατί.', 'I will call the director of the stadium. You do not need to know why.'],
  'tr.rival4.after': ['Ο Μπέμπης έφυγε. Πήρε το ταξί του θείου του. Πλήρωσε ο θείος.', "Bebis left. He took his uncle's taxi. The uncle paid."],
  'tr.usher.intro': ['Το εισιτήριό σου! Και η θέση σου! Και η μάχη σου!', 'Your ticket! And your seat! And your battle!'],
  'tr.usher.win': ['Περάστε. Η θέση σας είναι... κάπου. Μην ρωτήσετε πού.', 'Go ahead. Your seat is... somewhere. Do not ask where.'],
  'tr.usher.after': ['Η θέση 1Α είναι πίσω από την 40Ζ. Έτσι χτίστηκε το στάδιο.', 'Seat 1A is behind 40Z. That is how the stadium was built.'],
  'tr.amartia.intro': ['Καλώς ήρθες στο Στάδιο Συναυλιών 3000, {φίλε|φίλη}! Το σόου ξεκινά όταν πάρω εγώ το μικρόφωνο. Και πάντα το παίρνω.', 'Welcome to Concert Stadium 3000, friend! The show starts when I take the mic. And I always take the mic.'],
  'tr.amartia.win': ['Ο ήχος έσπασε. Θα πω ότι ήταν η ηχητική δοκιμή.', 'The sound broke. I will say it was the sound check.'],
  'tr.amartia.after': ['Η συναυλία συνεχίζεται. Το μόνο κομμάτι που ξέρω είναι αυτό. Το παίζω ξανά.', 'The concert goes on. The only track I know is this one. I am playing it again.'],
  'boss.amartia.win2': ['Κέρδισες. Το Παράσημο Πρώτης Σειράς είναι δικό σου, με τον όρο να πας στην τελευταία σειρά.', 'You won. The First Row Medal is yours, on the condition that you go to the last row.'],
  'boss.amartia.win3': ['Πήρες το Παράσημο Πρώτης Σειράς! Ο δρόμος προς τα Δυτικά άνοιξε. Τα διόδια, όμως, δεν είναι δωρεάν.', 'You got the First Row Medal! The road to the West is open. The toll, however, is not free.'],
  'badge.voreia.title': ['ΠΑΡΑΣΗΜΟ ΠΡΩΤΗΣ ΣΕΙΡΑΣ', 'FIRST ROW MEDAL'], 'badge.voreia.sub': ['Η θέση είναι πίσω.', 'The seat is at the back.'],
  'sp.star90': ['Γνωστός για: ένα τραγούδι που παίζεται ακόμα και μια περιοδεία επανόδου που δεν τελειώνει. Ποτέ δεν καταδικάστηκε.', 'Σταρ των 90ς = "Star of the 90s". Known for: one song that is still played and a comeback tour that never ends. Never convicted.'],
  'sp.rialito': ['Γνωστός για: μυς, κάμερα και ένα ψηφοδέλτιο που αποφασίζει ποιος μένει στο σπίτι. Ποτέ δεν καταδικάστηκε.', 'Ριάλιτο-Νταής = "Reality-Bruiser". Known for: muscles, a camera and a ballot that decides who stays in the house. Never convicted.'],
  'sp.lobbylykaina': ['Γνωστή για: μια χάρη που κοστίζει δύο φακέλους και ένα τηλεφώνημα που δεν έγινε ποτέ. Ποτέ δεν καταδικάστηκε.', 'Lobby-Λύκαινα = "Lobby-She-Wolf". Known for: a favour that costs two envelopes and a phone call that was never made. Never convicted.'],
  'sp.giotarchis': ['Γνωστός για: ένα γιοτ που είναι πάντα αγκυροβολημένο κάπου αλλού και μια εταιρεία με έδρα το πουθενά. Ποτέ δεν καταδικάστηκε.', 'Γιοτάρχης = "Yacht-arch". Known for: a yacht that is always moored somewhere else and a company based nowhere. Never convicted.'],
  'sp.yperypourgos': ['Γνωστός για: δεκατέσσερα υπουργεία, καμία παρουσία και μια κόκκινη κάπα για τις επίσημες ώρες. Ποτέ δεν καταδικάστηκε.', 'Υπερυπουργός = "Super-Minister". Known for: fourteen ministries, no attendance and a red cape for official hours. Never convicted.'],
  'sp.matanthropos': ['Γνωστός για: πανοπλία, ασπίδα και μια βαθιά πίστη στη «διαδικασία». Ποτέ δεν καταδικάστηκε.', 'ΜΑΤάνθρωπος = "Riot-man". Known for: armour, a shield and a deep faith in "procedure". Never convicted.'],
  'sp.despotakis': ['Γνωστός για: χρυσό ραβδί με μπάλα ντίσκο, μεγάλα κτήματα και ευλογία με χρέωση. Ποτέ δεν καταδικάστηκε.', 'Δεσποτάκης = "Little Bishop". Known for: a golden staff with a disco ball, large estates and blessings with a fee. Never convicted.'],
  // Δυτικά (MZ-WORLD-02e): places, signs, people, the boss and its badge, the Συλλογική Σύμβαση, the five new creatures. Running joke: the Monastery owns the road to the Monastery.
  'map.route9': ['Διαδρομή 9: Ο Αυτοκινητόδρομος', 'Route 9: The Ring Road'], 'map.peristeri': ['Περιστέρι', 'Peristeri'],
  'map.peristeri.hospital': ['Νοσοκομείο Περιστερίου 3000', 'Peristeri Hospital 3000'], 'map.peristeri.shop': ['Περίπτερο Περιστερίου', 'Peristeri Kiosk'],
  'map.peristeri.cafe': ['Καφενείο «Η Γωνιά»', 'Cafe "The Corner"'], 'map.route10': ['Διαδρομή 10: Λεωφόρος Θηβών', 'Route 10: Thivon Avenue'],
  'map.chaidari': ['Χαϊδάρι', 'Chaidari'], 'map.chaidari.hospital': ['Νοσοκομείο Χαϊδαρίου 3000', 'Chaidari Hospital 3000'],
  'map.chaidari.shop': ['Περίπτερο Χαϊδαρίου', 'Chaidari Kiosk'], 'map.chaidari.boss': ['Μονή Αφορολογήτου', 'Tax-Free Monastery'],
  'warp.route9': ['Ο δρόμος προς τα Δυτικά είναι κλειστός. Πρώτα το Παράσημο Πρώτης Σειράς.', 'The road to the West is closed. The First Row Medal first.'],
  'sign.route9': ['Διαδρομή 9: Ο Αυτοκινητόδρομος. Ο δρόμος είναι ευθύς. Η χρέωση, όχι.', 'Route 9: The Ring Road. The road is straight. The charge is not.'],
  'sign.toll': ['Διόδια. Πληρώνεις για τον δρόμο που μόλις περπάτησες. Η απόδειξη έρχεται του χρόνου.', 'Toll. You pay for the road you just walked. The receipt comes next year.'],
  'sign.peristeri': ['Περιστέρι. Δέκα χιλιάδες πολυκατοικίες. Όλες ίδιες. Η δική σου είναι η έβδομη στη σειρά.', 'Peristeri. Ten thousand apartment blocks. All the same. Yours is the seventh in the row.'],
  'sign.peristeri.hospital': ['Νοσοκομείο Περιστερίου 3000. Η αναμονή γίνεται στον ανελκυστήρα. Δεν δουλεύει.', 'Peristeri Hospital 3000. The waiting is done in the lift. It does not work.'],
  'sign.peristeri.cafe': ['Καφενείο «Η Γωνιά». Ο καφές έχει γωνία. Και ο λογαριασμός.', 'Cafe "The Corner". The coffee has a corner. So does the bill.'],
  'sign.peristeri.market': ['Λαϊκή αγορά. Η τιμή ρωτιέται δύο φορές. Η δεύτερη είναι υψηλότερη.', 'Street market. The price is asked twice. The second is higher.'],
  'sign.peristeri.pitch': ['Γήπεδο γειτονιάς. Μπάλες: δώδεκα. Τέρματα: δύο. Οφσάιντ: ό,τι πει ο πιο δυνατός.', 'Neighbourhood ground. Balls: twelve. Goals: two. Offside: whatever the loudest says.'],
  'sign.route10': ['Λεωφόρος Θηβών. Ευθεία, ίσια, για πάντα. Με ένα ποτάμι που δεν ρέει.', 'Thivon Avenue. Straight, flat, forever. With a river that does not flow.'],
  'sign.channel': ['Το ποτάμι είναι εδώ. Το νερό θα έρθει. Κάποτε.', 'The river is here. The water will come. Some day.'],
  'sign.chaidari': ['Χαϊδάρι. Στο πέρασμα. Το πέρασμα έχει εισιτήριο.', 'Chaidari. At the pass. The pass has a ticket.'],
  'sign.chaidari.hospital': ['Νοσοκομείο Χαϊδαρίου 3000. Στο ισόγειο, γιατί ο όροφος ανήκει στη Μονή.', 'Chaidari Hospital 3000. On the ground floor, because the upper floor belongs to the Monastery.'],
  'sign.chaidari.monastery': ['Μονή Αφορολογήτου. Αφορολόγητη από πάντα. Και περήφανη.', 'Tax-Free Monastery. Tax-free since forever. And proud.'],
  'sign.chaidari.carpark': ['Πάρκινγκ της Μονής. Ο δρόμος προς το πάρκινγκ και το πάρκινγκ: ιδιοκτησία της Μονής. Το τέλος εξόδου, επίσης.', 'Monastery car park. The road to the car park and the car park: property of the Monastery. The exit fee, too.'],
  'sign.chaidari.west': ['Προς την Αθήνα: η αρχαία οδός. Υπό έργα. Τα έργα τελειώνουν του χρόνου.', 'To Athens: the ancient road. Under works. The works finish next year.'],
  'npc.tollwatcher': ['Εδώ πληρώνεις για να περάσεις. Στη στάση πιο πέρα πληρώνεις και για να σταθείς.', 'Here you pay to pass. At the stop up ahead you pay to stand, too.'],
  'npc.hitchhiker': ['Έκανα ωτοστόπ. Με πήρε ένα φορτηγό. Το φορτηγό μου χρέωσε τα διόδια.', 'I hitched a ride. A lorry took me. The lorry charged me the toll.'],
  'npc.peristeri1': ['Παίζουμε από τις έξι. Ο διαιτητής είναι ο ιδιοκτήτης της μπάλας. Κερδίζει πάντα.', 'We play from six. The referee is the owner of the ball. He always wins.'],
  'npc.peristeri2': ['Ντομάτες! Δύο ευρώ. Αν ρωτήσεις ξανά, τρία.', 'Tomatoes! Two euros. If you ask again, three.'],
  'npc.peristeri3': ['Ανοίγω το μπαλκόνι και βλέπω δώδεκα ίδια μπαλκόνια. Όλα με ρούχα. Κανένα δικό μου.', 'I open the balcony and see twelve identical balconies. All with laundry. None of it mine.'],
  'npc.peristeri.doctor': ['Οι ασθενείς πολλοί, οι κλίνες λίγες. Στα ράντζα, όμως, έχουμε πλεόνασμα.', 'Many patients, few beds. But we have a surplus of cots.'],
  'npc.peristeri.wait1': ['Έχω σειρά. Ο αριθμός μου είναι ο 412. Η οθόνη δείχνει τον 17.', 'I have a ticket. My number is 412. The screen shows 17.'],
  'npc.peristeri.customer': ['Πήρα εισιτήριο για το πάρκινγκ της Μονής. Δεν έχω αυτοκίνητο.', 'I bought a ticket for the Monastery car park. I do not own a car.'],
  'cafe.hello.peristeri': ['Καφενείο «Η Γωνιά». Ο καφές στη γωνία κοστίζει όσο ένα τετραγωνικό.', 'Cafe "The Corner". The coffee on the corner costs as much as a square metre.'],
  'npc.pscafe1': ['Η καλύτερη θέση είναι εκείνη που βλέπει τη γωνία. Δεν περνά κανείς. Αλλά τη βλέπω.', 'The best seat is the one that sees the corner. Nobody passes. But I see it.'],
  'npc.pscafe2': ['Ο μπαμπάς πάει στο γήπεδο, η μαμά στη λαϊκή, εγώ στο μπαλκόνι. Έτσι μένουμε οικογένεια.', 'Dad goes to the ground, Mum to the market, I go to the balcony. That is how we stay a family.'],
  'npc.stallholder': ['Φρέσκα! Από το χωράφι. Ποιο χωράφι; Ένα χωράφι κάπου. Θα το δεις.', 'Fresh! From the field. Which field? A field somewhere. You will see it.'],
  'npc.angler': ['Ψαρεύω στο κανάλι. Μέχρι τώρα έπιασα τρία καρότσια και ένα ποδήλατο.', 'I fish in the channel. So far I caught three shopping trolleys and a bicycle.'],
  'npc.chaidari1': ['Το πάρκινγκ είναι της Μονής. Ο δρόμος προς το πάρκινγκ είναι της Μονής. Εγώ είμαι της Μονής: με μισθό.', "The car park is the Monastery's. The road to the car park is the Monastery's. I am the Monastery's: with a salary."],
  'npc.chaidari2': ['Το ύψωμα έχει πινακίδα «ιδιωτικό». Ο ουρανός, δεν ξέρω.', 'The hill has a "private" sign. The sky, I am not sure.'],
  'npc.chaidari3': ['Η Μονή μου ζήτησε τέλος για τη σκιά της στον κήπο μου. Είπε ότι η σκιά είναι δική της.', 'The Monastery asked me for a fee for its shadow in my garden. It said the shadow is its own.'],
  'npc.chaidari.doctor': ['Το νοσοκομείο χτίστηκε σε οικόπεδο της Μονής. Πληρώνουμε ενοίκιο. Από τα έσοδα της αναμονής.', 'The hospital was built on land of the Monastery. We pay rent. From the income of the waiting.'],
  'npc.chaidari.wait1': ['Περιμένω από το πρωί. Ο λογαριασμός έφτασε πριν από τον γιατρό.', 'I have waited since morning. The bill arrived before the doctor.'],
  'npc.chaidari.customer': ['Πήρα νερό. Η Μονή έχει το δικαίωμα στη βρύση. Και στο μπουκάλι.', 'I bought water. The Monastery has the rights to the tap. And to the bottle.'],
  'npc.chaidari.cust1': ['Περιμένω τον Ηγούμενο. Δεν πρόλαβα να ρωτήσω ποια ώρα. Ρωτάω εδώ και χρόνια.', 'I am waiting for the Abbot. I did not manage to ask what time. I have been asking for years.'],
  'npc.chaidari.cust2': ['Το γραφείο έχει δικό του πάρκινγκ. Το πάρκινγκ έχει δικό του γραφείο.', 'The office has a car park of its own. The car park has an office of its own.'],
  'tr.tollclerk.intro': ['Στάση! Πλήρωσε για τον δρόμο που μόλις περπάτησες. Ή πάλεψε με εμένα.', 'Stop! Pay for the road you just walked. Or battle me.'],
  'tr.tollclerk.win': ['Έχασα. Η απόδειξη χάθηκε μαζί μου.', 'I lost. The receipt got lost along with me.'],
  'tr.tollclerk.after': ['Το διόδιο είναι ανοιχτό. Η απόδειξη, κλειστή.', 'The toll is open. The receipt is closed.'],
  'tr.ultras.intro': ['Ο αγώνας ξεκινά τώρα! Εσύ είσαι ο αντίπαλος. Ο διαιτητής είμαι εγώ.', 'The match starts now! You are the opposition. I am the referee.'],
  'tr.ultras.win': ['Έχασα! Θα ζητήσω επανάληψη. Και άλλον διαιτητή.', 'I lost! I will ask for a replay. And another referee.'],
  'tr.ultras.after': ['Στην επόμενη αγωνιστική κερδίζω εγώ. Όπως πάντα. Στη φαντασία.', 'Next matchday I win. Like always. In my imagination.'],
  'tr.granny.intro': ['Παιδί μου! Έλα εδώ να σου δείξω την παντόφλα. Και μετά τη μάχη.', 'My child! Come here, let me show you the slipper. And then the battle.'],
  'tr.granny.win': ['Κέρδισες. Θα το πω στη γειτόνισσα, αλλά με άλλη εκδοχή.', 'You won. I will tell the neighbour, but with a different version.'],
  'tr.granny.after': ['Η παντόφλα δεν έχασε. Άλλαξε στόχο.', 'The slipper did not lose. It changed target.'],
  'tr.marketeer.intro': ['Φρέσκα προϊόντα και φρέσκια πρόκληση! Δύο ευρώ η μάχη. Αν ρωτήσεις, τρία.', 'Fresh goods and a fresh challenge! Two euros a battle. If you ask, three.'],
  'tr.marketeer.win': ['Έχασα! Οι ντομάτες θα πληρώσουν.', 'I lost! The tomatoes will pay.'],
  'tr.marketeer.after': ['Η τιμή μόλις ανέβηκε. Λόγω ήττας.', 'The price just went up. Due to the defeat.'],
  'tr.philosopher.intro': ['Ο πραγματικός αντίπαλος είναι ο εαυτός. Αλλά αφού είσαι εδώ, μια μάχη.', 'The real opponent is the self. But since you are here, a battle.'],
  'tr.philosopher.win': ['Έχασα. Και τι είναι η νίκη; Ένας καφές που κρύωσε.', 'I lost. And what is victory? A coffee that went cold.'],
  'tr.philosopher.after': ['Σκέφτομαι ότι σκέφτομαι. Θα πληρώσω τον καφέ όταν τελειώσει η σκέψη.', 'I think that I think. I will pay for the coffee when the thought is done.'],
  'tr.steward.intro': ['Είμαι ο επίτροπος του πάρκινγκ. Όποιος περνά, πληρώνει. Όποιος μάχεται, πληρώνει διπλά.', 'I am the steward of the car park. Whoever passes pays. Whoever battles pays double.'],
  'tr.steward.win': ['Έχασα. Ο λογαριασμός θα πάει στη Μονή.', 'I lost. The bill goes to the Monastery.'],
  'tr.steward.after': ['Αύριο το τέλος εισόδου ανεβαίνει. Λόγω της σημερινής αναστάτωσης.', "Tomorrow the entry fee goes up. Due to today's disturbance."],
  'tr.gatekeeper.intro': ['Η πόρτα ανοίγει με εισιτήριο. Το εισιτήριο το δίνω εγώ. Όταν νικήσεις.', 'The door opens with a ticket. I give the ticket. When you win.'],
  'tr.gatekeeper.win': ['Περάστε. Ο Ηγούμενος σάς περιμένει. Με το ταμείο ανοιχτό.', 'Go ahead. The Abbot is waiting. With the till open.'],
  'tr.gatekeeper.after': ['Η πόρτα είναι ανοιχτή. Η έξοδος, με αντίτιμο.', 'The door is open. The exit, for a fee.'],
  'tr.plousiakis.intro': ['Καλώς ήρθες στη Μονή Αφορολογήτου, {φίλε|φίλη}! Εδώ ο δρόμος, το πάρκινγκ και το αφορολόγητο είναι δικά μου. Μόνο η νίκη δεν είναι.', 'Welcome to the Tax-Free Monastery, friend! Here the road, the car park and the tax exemption are all mine. Only the win is not.'],
  'tr.plousiakis.win': ['Έχασα. Θα το δηλώσω ως ζημιά. Αφορολόγητη, φυσικά.', 'I lost. I will declare it as a loss. Tax-free, of course.'],
  'tr.plousiakis.after': ['Η Μονή συνεχίζει να εισπράττει. Και την ήττα.', 'The Monastery goes on collecting. The defeat, too.'],
  'boss.plousiakis.win2': ['Κέρδισες. Το Παράσημο Αφορολογήτου είναι δικό σου, με τον όρο να μην το δηλώσεις.', 'You won. The Tax-Free Medal is yours, on the condition that you do not declare it.'],
  'boss.plousiakis.win3': ['Πήρες το Παράσημο Αφορολογήτου! Ο δρόμος προς την Αθήνα είναι ακόμα υπό έργα.', 'You got the Tax-Free Medal! The road to Athens is still under works.'],
  'badge.dytika.title': ['ΠΑΡΑΣΗΜΟ ΑΦΟΡΟΛΟΓΗΤΟΥ', 'TAX-FREE MEDAL'], 'badge.dytika.sub': ['Δεν δηλώνεται.', 'It is not declared.'],
  'item.sylvasi': ['Συλλογική Σύμβαση', 'Collective Deal'],
  'itemd.sylvasi': ['Γιατρεύει 120 ΥΓ. Υπογράφεται από όλους. Εκτός από σένα.', 'Heals 120 HP. Signed by everyone. Except you.'],
  'sp.tavlilordos': ['Γνωστός για: ζάρια που φέρνουν πάντα εξάρες στον ίδιο και μια παρτίδα που κρατά μια ζωή. Ποτέ δεν καταδικάστηκε.', 'Τάβλι-λόρδος = "Backgammon Lord". Known for: dice that always roll sixes for him and a game that lasts a lifetime. Never convicted.'],
  'sp.giagiaexo': ['Γνωστή για: μια παντόφλα που φτάνει στον στόχο πριν από την ερώτηση και μια συνταγή για κάθε ένοχο. Ποτέ δεν καταδικάστηκε.', 'Γιαγιά Εξολοθρεύτρια = "Granny Exterminator". Known for: a slipper that reaches the target before the question and a recipe for every culprit. Never convicted.'],
  'sp.elegktis': ['Γνωστός για: ένα προσωπείο που βλέπει τα πάντα, εκτός από τον φάκελο στο δικό του συρτάρι. Ποτέ δεν καταδικάστηκε.', 'Ελεγκτής ΣΔΟΕ 3000 = "Inspector, Audit Squad 3000". Known for: a visor that sees everything except the envelope in his own drawer. Never convicted.'],
  'sp.ktimatomesitis': ['Γνωστός για: οικόπεδα που δεν φορολογούνται, τετραγωνικά που μεγαλώνουν μόνα τους και μια πινακίδα «πωλείται» σε κάθε τοίχο. Ποτέ δεν καταδικάστηκε.', 'Κτηματομεσίτης = "Property Agent". Known for: plots that are not taxed, square metres that grow by themselves and a "for sale" board on every wall. Never convicted.'],
  'sp.rousfetolykos': ['Γνωστός για: μια χάρη που γυρίζει πάντα σαν δάγκωμα και ένα κοπάδι ψηφοφόρων που τον ακολουθεί. Ποτέ δεν καταδικάστηκε.', 'Ρουσφετόλυκος = "Patronage Wolf". Known for: a favour that always comes back as a bite and a flock of voters that follows him. Never convicted.'],
  'sp.kafenovios': ['Γνωστός για: ένα φλιτζάνι που κρατά από το πρωί ως το βράδυ και πολιτική ανάλυση χωρίς λογαριασμό. Ποτέ δεν καταδικάστηκε.', 'Καφενόβιος = "Cafe-dweller". Known for: one small cup that lasts from morning to night and political analysis with no bill. Never convicted.'],
  'sp.vouleftakos': ['Γνωστός για: ψήφους που αλλάζουν με τον καιρό και την έδρα. Ποτέ δεν καταδικάστηκε.', 'Βουλευτάκος = "Little MP". Known for: votes that change with the weather and the seat. Never convicted.'],
  'sp.batsonos': ['Γνωστός για: σφυρίχτρα, γκλομπ και βαθιά πίστη στη «διαδικασία». Ποτέ δεν καταδικάστηκε.', 'Μπατσόνος = "Big Cop". Known for: a whistle, a baton and deep faith in "procedure". Never convicted.'],
  'sp.diakosdisko': ['Γνωστός για: ψαλμωδία με ηχοσύστημα και φώτα. Η ευχή έρχεται μετά τον λογαριασμό. Ποτέ δεν καταδικάστηκε.', 'Διάκος Ντίσκο = "Deacon Disco". Known for: chanting with a sound system and lights. The blessing comes after the bill. Never convicted.'],
  'sp.efoplistakos': ['Γνωστός για: πλοία με σημαία ευκαιρίας και φόρους με σημαία καμία. Ποτέ δεν καταδικάστηκε.', 'Εφοπλιστάκος = "Little Shipowner". Known for: ships under a flag of convenience and taxes under no flag. Never convicted.'],
  'credits.text': ['MIZAMON\n\nΤο τέλος της Πρώτης Περιφέρειας\n\nΣχεδιασμός, κώδικας, γραφικά, μουσική:\nόλα φτιαγμένα από κώδικα\n\nΟ Καθηγητής Σταθόπουλος\nεκπροσωπεί όλους όσους\nπεριμένουν πληρωμή\n\nΣάτιρα. Όλοι οι χαρακτήρες\nείναι παρωδίες ή φανταστικοί·\nκάθε ομοιότητα είναι καρικατούρα.\n\nΗ Βουλή του 3000 περιμένει...\n\nΕυχαριστούμε που έπαιξες!',
    'MIZAMON\n\nThe end of the First District\n\nDesign, code, graphics, music:\nall made from code\n\nProfessor Stathopoulos\nspeaks for everyone\nwaiting to be paid\n\nSatire. All characters\nare parodies or fictional;\nany resemblance is caricature.\n\nThe Parliament of 3000 awaits...\n\nThanks for playing!'],
  'credits.after': ['Ένα νέο κτίριο άνοιξε στην πλατεία της Νέας Πειραιάς: το Τηλεοπτικό Στούντιο. Λένε ότι ψάχνει αντίπαλο.', 'A new building opened in the New Piraeus square: the TV Studio. They say it is looking for a challenger.'],

  'b.st.inv': ['{mon} τέθηκε υπό έρευνα!', '{mon} is Under Investigation!'],
  'b.st.sca': ['Σκάνδαλο για {mon_name}!', 'Scandal hits {mon_name}!'],
  'b.st.str': ['{mon} κήρυξε απεργία!', '{mon} goes on strike!'],

function makePen(width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  const pen = {
    canvas: canvas, g: g,
    px: function (x, y, color) { g.fillStyle = color; g.fillRect(x, y, 1, 1); },
    rect: function (x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); },
    ell: function (cx, cy, rx, ry, color) { // filled ellipse, one scanline at a time
      g.fillStyle = color;
      for (let y = -ry; y <= ry; y++) {
        const half = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / ((ry + 0.5) * (ry + 0.5)))));
        g.fillRect(cx - half, cy + y, half * 2 + 1, 1);
      }
    },
    line: function (x1, y1, x2, y2, color) {
      g.fillStyle = color;
      const steps = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1), 1);
      for (let i = 0; i <= steps; i++) g.fillRect(Math.round(x1 + (x2 - x1) * i / steps), Math.round(y1 + (y2 - y1) * i / steps), 1, 1);
    },
    tri: function (x1, y1, x2, y2, x3, y3, color) {
      g.fillStyle = color;
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath(); g.fill();
    },
    outline: function (color) { // 1 px dark outline around everything that is drawn
      const image = g.getImageData(0, 0, width, height);
      const data = image.data;
      const solid = new Uint8Array(width * height);
      for (let i = 0; i < solid.length; i++) solid[i] = data[i * 4 + 3] > 0 ? 1 : 0;
      const rgb = hexToRgb(color);
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const index = y * width + x;
          if (solid[index]) continue;
          const near = (x > 0 && solid[index - 1]) || (x < width - 1 && solid[index + 1]) || (y > 0 && solid[index - width]) || (y < height - 1 && solid[index + width]);
          if (near) { data[index * 4] = rgb[0]; data[index * 4 + 1] = rgb[1]; data[index * 4 + 2] = rgb[2]; data[index * 4 + 3] = 255; }
        }
      }
      g.putImageData(image, 0, 0);
    },
  };
  return pen;
}
function hexToRgb(hex) {
  const value = parseInt(hex.slice(1), 16);
  return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
}
function shade(hex, amount) { // amount -1..1 : darker or lighter
  const rgb = hexToRgb(hex).map(function (c) { return Math.max(0, Math.min(255, Math.round(amount < 0 ? c * (1 + amount) : c + (255 - c) * amount))); });
  return '#' + rgb.map(function (c) { return c.toString(16).padStart(2, '0'); }).join('');
}

function drawGrassTexture(p, base, seed) {
  p.rect(0, 0, 16, 16, base);
  const rng = makeRng(seed);

  const dark = shade(base, -0.18);

function drawRoofTile(p, color) {
  p.rect(0, 0, 16, 16, color);
  const dark = shade(color, -0.25);
  const light = shade(color, 0.2);
  for (let y = 0; y < 16; y += 4) { p.rect(0, y + 3, 16, 1, dark); p.rect(0, y, 16, 1, light); }
  for (let y = 0; y < 16; y += 4) for (let x = (y / 4) % 2 ? 4 : 0; x < 16; x += 8) p.rect(x, y, 1, 4, dark);
}

function drawCharFrame(p, ox, oy, look, dir, frame) {
  const dark = shade(look.top, -0.3);
  const stepLeft = frame === 1;
  const stepRight = frame === 2;
  // legs and shoes
  p.rect(ox + 5, oy + 13, 3, stepLeft ? 1 : 2, look.pants);
  p.rect(ox + 8, oy + 13, 3, stepRight ? 1 : 2, look.pants);
  p.rect(ox + 5, oy + (stepLeft ? 14 : 15), 3, 1, '#222');
  p.rect(ox + 8, oy + (stepRight ? 14 : 15), 3, 1, '#222');
  // body
  p.rect(ox + 4, oy + 8, 8, 5, look.top);
  p.rect(ox + 4, oy + 8, 1, 5, dark);
  p.rect(ox + 11, oy + 8, 1, 5, dark);
  if (look.skirt) p.rect(ox + 4, oy + 12, 8, 2, look.top);
  if (look.coat) { p.rect(ox + 4, oy + 8, 8, 7, look.top); p.rect(ox + 7, oy + 10, 2, 5, '#cfcfcf'); }
  if (look.apron) p.rect(ox + 5, oy + 10, 6, 5, look.apron);
  if (look.stripes) for (let y = 9; y < 13; y += 2) p.rect(ox + 4, oy + y, 8, 1, look.stripes);
  p.px(ox + 4, oy + 12, look.skin); p.px(ox + 11, oy + 12, look.skin);
  // head
  p.rect(ox + 5, oy + 2, 6, 6, look.skin);
  if (dir === 'up') {
    p.rect(ox + 5, oy + 1, 6, 6, look.hair);
  } else {
    if (look.style !== 'bald') p.rect(ox + 5, oy + 1, 6, 2, look.hair);
    else p.rect(ox + 5, oy + 1, 6, 1, look.hair);
    if (look.style === 'long' || look.style === 'bun') {
      p.rect(ox + 4, oy + 2, 1, 6, look.hair); p.rect(ox + 11, oy + 2, 1, 6, look.hair);
    }
    if (look.style === 'pomp') { p.rect(ox + 5, oy + 0, 6, 2, look.hair); p.rect(ox + 4, oy + 2, 1, 2, look.hair); p.rect(ox + 11, oy + 2, 1, 2, look.hair); }
    if (look.style === 'bun') p.rect(ox + 6, oy + 0, 4, 1, look.hair);
    if (look.style === 'bald') { p.px(ox + 4, oy + 3, look.hair); p.px(ox + 11, oy + 3, look.hair); }
    if (dir === 'down') {
      p.px(ox + 6, oy + 5, '#1a1a1a'); p.px(ox + 9, oy + 5, '#1a1a1a');
      if (look.glasses) { p.rect(ox + 5, oy + 5, 3, 1, '#222'); p.rect(ox + 8, oy + 5, 3, 1, '#222'); }
      if (look.mustache) p.rect(ox + 6, oy + 6, 4, 1, shade(look.hair, -0.4));
      if (look.pacifier) { p.rect(ox + 7, oy + 7, 2, 1, '#e8e040'); p.px(ox + 8, oy + 8, '#e8e040'); }
      if (look.tie) p.rect(ox + 7, oy + 8, 2, 4, look.tie);
      if (look.bowtie) { p.rect(ox + 6, oy + 8, 4, 1, look.bowtie); }
      if (look.mic) { p.rect(ox + 12, oy + 9, 1, 3, '#aaa'); p.px(ox + 12, oy + 8, '#222'); }
      if (look.phone) { p.rect(ox + 12, oy + 7, 2, 4, '#222'); p.px(ox + 12, oy + 8, '#8fc3ee'); }
      if (look.envelope) { p.rect(ox + 12, oy + 10, 3, 2, '#f6efdc'); p.px(ox + 13, oy + 10, '#d8a030'); } // an envelope held out, just in case
      if (look.slipper) { p.rect(ox + 12, oy + 8, 3, 2, '#d8887a'); p.rect(ox + 12, oy + 8, 3, 1, '#a85a4a'); } // a house slipper raised in the hand
    } else if (dir === 'left') {
      p.px(ox + 6, oy + 5, '#1a1a1a');
      p.rect(ox + 8, oy + 2, 3, 5, look.hair);
      if (look.glasses) p.rect(ox + 5, oy + 5, 2, 1, '#222');
      if (look.mustache) p.rect(ox + 5, oy + 6, 2, 1, shade(look.hair, -0.4));
    }
  }
  if (look.hat) {
    p.rect(ox + 4, oy + 0, 8, 3, look.hat);
    p.rect(ox + 3, oy + 3, 10, 1, look.brim || shade(look.hat, -0.3));
  }
}
const charSheets = {};
function charSheet(lookId) {
  if (charSheets[lookId]) return charSheets[lookId];
  const p = makePen(48, 48);
  const look = LOOKS[lookId];
  ['down', 'up', 'left'].forEach(function (dir, row) {
    for (let frame = 0; frame < 3; frame++) drawCharFrame(p, frame * 16, row * 16, look, dir, frame);
  });
  charSheets[lookId] = p.canvas;
  return p.canvas;
}

function humanoid(p, o) {
  const skin = o.skin || '#f0c08a';
  // legs, shoes
  if (!o.longRobe) {
    p.rect(11, 26, 4, 4, o.pants || '#333a50'); p.rect(17, 26, 4, 4, o.pants || '#333a50');
    p.rect(10, 29, 5, 2, '#222'); p.rect(17, 29, 5, 2, '#222');
