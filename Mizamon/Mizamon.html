  // arms and torso
  p.rect(7, 17, 3, 8, o.suit); p.rect(22, 17, 3, 8, o.suit);
  p.rect(7, 24, 3, 2, skin); p.rect(22, 24, 3, 2, skin);
  p.rect(10, 16, 12, o.longRobe ? 14 : 11, o.suit);
  p.rect(10, 16, 1, o.longRobe ? 14 : 11, shade(o.suit, -0.25)); p.rect(21, 16, 1, o.longRobe ? 14 : 11, shade(o.suit, -0.25));
  if (o.shirt) p.rect(14, 16, 4, 6, o.shirt);
  if (o.tie) { p.rect(15, 17, 2, 2, o.tie); p.rect(15, 19, 2, 6, o.tie); p.px(15, 25, o.tie); }
  // head
  p.ell(16, 9, 7, 7, skin);
  p.rect(9, 7, 1, 4, skin); p.rect(22, 7, 1, 4, skin);
  if (o.cheeks) { p.rect(10, 12, 2, 1, o.cheeks); p.rect(20, 12, 2, 1, o.cheeks); }
}

// ---- Storage (works without localStorage) ----------------------------------------------------
const Store = {
  memory: {},
  forceMemory: false,
  get: function (key) {
    if (!this.forceMemory) {
      try { return window.localStorage.getItem(key); } catch (error) { /* private mode or blocked storage */ }
    }
    return Object.prototype.hasOwnProperty.call(this.memory, key) ? this.memory[key] : null;
  },
  set: function (key, value) {
    if (!this.forceMemory) {
      try { window.localStorage.setItem(key, value); return true; } catch (error) { /* fall back to memory */ }
    }
    this.memory[key] = value;
    return false;
  },
  remove: function (key) {
    if (!this.forceMemory) {
      try { window.localStorage.removeItem(key); } catch (error) { /* ignore */ }
    }
    delete this.memory[key];
  },
};

// ---- Game state and options ---------------------------------------------------------------------
let OPT = defaultOptions();
let G = null; // the running game; null on the title screen
const PREVIEW_PLAYER = { gender: 'm', name: 'ΝΙΚΟΣ' };
function newGameState(name, gender, starter) {
  const party = [makeMon(starter, 5)];
  const dexSeen = {};
  const dexGot = {};
  dexSeen[starter] = true;
  dexGot[starter] = true;
  return {
    player: { name: name, gender: gender, map: START_MAP.map, x: START_MAP.x, y: START_MAP.y, dir: START_MAP.dir },
    party: party, archive: [], money: START_MONEY, bag: Object.assign({}, START_BAG), dex: { seen: dexSeen, got: dexGot }, flags: { gotStarter: true }, world: newWorldState(),
    lastHeal: Object.assign({}, DEFAULT_HEAL_SPOT), rng: makeRng(1), starter: starter, steps: 0,
  };
}
// Texts without variables are cached, so drawing code can call T() every frame without allocating.
const textCache = { el: { m: {}, f: {} }, en: { m: {}, f: {} } };
function resetTextCache() {
  for (const lang of ['el', 'en']) { textCache[lang].m = {}; textCache[lang].f = {}; }
}
function T(key, vars) {
  const gender = G ? G.player.gender : PREVIEW_PLAYER.gender;
  const name = G ? G.player.name : PREVIEW_PLAYER.name;
  if (vars === undefined) {
    const bucket = textCache[OPT.lang][gender];
    let cached = bucket[key];
    if (cached === undefined) { cached = formatText(lookupString(key, OPT.lang), { name: name }, gender); bucket[key] = cached; }
    return cached;
  }
  return formatText(lookupString(key, OPT.lang), Object.assign({ name: name }, vars), gender);
}
// With no saved choice, Reduced motion follows the operating system setting; the Options screen can change it.
function systemPrefersReducedMotion() {
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (error) { return false; }
}
function loadOptions() {
  let saved = null;
  try { saved = JSON.parse(Store.get(OPTIONS_KEY) || 'null'); } catch (error) { saved = null; }
  OPT = normalizeOptions(saved);
  if (!saved || typeof saved.reduceMotion !== 'boolean') OPT.reduceMotion = systemPrefersReducedMotion();
}
function saveOptions() {
  try { Store.set(OPTIONS_KEY, JSON.stringify(OPT)); } catch (error) { /* ignore */ }
}
function buildSaveObject() {
  return {
    version: SAVE_VERSION, player: Object.assign({}, G.player), party: G.party.map(serializeMon), archive: G.archive.map(serializeMon), money: G.money, bag: Object.assign({}, G.bag),
    dex: { seen: Object.assign({}, G.dex.seen), got: Object.assign({}, G.dex.got) }, flags: Object.assign({}, G.flags), world: JSON.parse(JSON.stringify(G.world)),
    lastHeal: Object.assign({}, G.lastHeal), options: Object.assign({}, OPT), rngState: G.rng.getState(), starter: G.starter,
  };
}
function writeSave() {
  try { return Store.set(SAVE_KEY, JSON.stringify(buildSaveObject())); } catch (error) { return false; }
}
function readSave() {
  try { return migrateSave(JSON.parse(Store.get(SAVE_KEY) || 'null')); } catch (error) { return null; }
}
function gameFromSave(save) {
  const state = {
    player: save.player, party: save.party.map(restoreMon), archive: save.archive.map(restoreMon), money: save.money, bag: save.bag, dex: save.dex, flags: save.flags, world: save.world,
    lastHeal: save.lastHeal, rng: makeRng(1), starter: save.starter, steps: 0,
  };
  state.rng.setState(save.rngState);
  return state;
}

// ---- Canvas and scaling ---------------------------------------------------------------------------
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d', { alpha: false });
const stage = document.getElementById('stage');
const touchPad = document.getElementById('touch');
let viewScale = 1;
let touchVisible = false;
let touchForced = null;
const TOUCH_SIDE_WIDTH = 160; // CSS px a landscape button pad needs (the d-pad is 152 px wide)
function detectTouch() {
  if (touchForced !== null) return touchForced;
  return (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
}
function resizeScreen() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const viewW = window.innerWidth;
  const viewH = window.innerHeight;
  touchVisible = detectTouch();
  const portrait = viewH > viewW;
  const reservedBottom = touchVisible && portrait ? Math.min(Math.round(viewH * 0.4), 300) : 0;
  // Landscape with touch: the two button pads stand beside the game, never over it.
  const reservedSides = touchVisible && !portrait ? 2 * TOUCH_SIDE_WIDTH : 0;
  let scale = Math.min((viewW - reservedSides) / SCREEN_W, (viewH - reservedBottom) / SCREEN_H);
  scale = Math.max(scale, 0.5); // a tiny window must still give a drawable canvas
  if (scale >= 2) scale = Math.floor(scale); // whole-number scaling when there is room (crisp pixels)
  const cssW = Math.floor(SCREEN_W * scale);
  const cssH = Math.floor(SCREEN_H * scale);
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);
  viewScale = canvas.width / SCREEN_W;
  stage.style.justifyContent = touchVisible && portrait ? 'flex-start' : 'center';
  touchPad.style.display = touchVisible ? 'block' : 'none';
  touchPad.className = portrait ? 'portrait' : 'landscape';
  touchPad.style.height = portrait ? (viewH - cssH) + 'px' : '100%';
}

// ---- Drawing helpers ------------------------------------------------------------------------------------
function drawText(text, x, y, color, align) {
  ctx.fillStyle = color || COLOR.ink;
  ctx.textAlign = align || 'left';
  ctx.fillText(text, x, y);
}
function drawPanel(x, y, w, h) {
  ctx.fillStyle = COLOR.border; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = COLOR.paperDark; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = COLOR.paper; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);
  ctx.fillStyle = COLOR.border; ctx.fillRect(x, y, 1, 1); ctx.fillRect(x + w - 1, y, 1, 1); ctx.fillRect(x, y + h - 1, 1, 1); ctx.fillRect(x + w - 1, y + h - 1, 1, 1);
}
function drawBar(x, y, w, h, fraction) {
  ctx.fillStyle = COLOR.border; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = COLOR.hpBack; ctx.fillRect(x, y, w, h);
  const clamped = Math.max(0, Math.min(1, fraction));
  ctx.fillStyle = clamped > 0.5 ? COLOR.hpGreen : (clamped > 0.2 ? COLOR.hpYellow : COLOR.hpRed);
  ctx.fillRect(x, y, Math.round(w * clamped), h);
}
function drawSprite(image, x, y, scale, flip) {
  const w = image.width * scale;
  const h = image.height * scale;
  if (flip) {
    ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(image, 0, 0, w, h); ctx.restore();
  } else ctx.drawImage(image, x, y, w, h);
}
function drawTypeTag(typeId, x, y) {
  ctx.font = FONT_SMALL;
  const label = T('type.' + typeId);
  const width = Math.ceil(ctx.measureText(label).width) + 6;
  ctx.fillStyle = COLOR.border; ctx.fillRect(x, y, width, 10);
  ctx.fillStyle = TYPE_COLORS[typeId]; ctx.fillRect(x + 1, y + 1, width - 2, 8);
  drawText(label, x + 3, y + 1, '#ffffff');
  ctx.font = FONT;
  return width;
}
function wrapText(text, maxWidth, font) {
  ctx.font = font || FONT;
  const lines = [];
  for (const paragraph of text.split('\n')) {
    let line = '';
    for (const word of paragraph.split(' ')) {
      const candidate = line === '' ? word : line + ' ' + word;
      if (line !== '' && ctx.measureText(candidate).width > maxWidth) { lines.push(line); line = word; }
      else line = candidate;
    }
    lines.push(line);
  }
  return lines;
}

const BUTTONS = ['up', 'down', 'left', 'right', 'a', 'b', 'menu', 'map'];
const KEY_MAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  KeyZ: 'a', Enter: 'a', Space: 'a', KeyX: 'b', Escape: 'b', Backspace: 'b', KeyM: 'menu', Tab: 'menu', KeyQ: 'map',
};
function padButtonOn(buttons, index) { return !!(buttons[index] && buttons[index].pressed); }
const Input = {
  down: {}, previous: {}, pressed: {}, repeat: {}, heldFrames: {}, keys: {}, pad: {}, touch: {}, injected: {}, padConnected: 0,
  poll: function () {
    if (this.padConnected > 0) this.readGamepad();
    for (let i = 0; i < BUTTONS.length; i++) {
      const name = BUTTONS[i];
      const current = !!(this.keys[name] || this.pad[name] || this.touch[name] || this.injected[name] > 0);
      this.pressed[name] = current && !this.previous[name];
      this.heldFrames[name] = current ? (this.heldFrames[name] || 0) + 1 : 0;
      this.repeat[name] = this.pressed[name] || (this.heldFrames[name] > 20 && (this.heldFrames[name] - 20) % 5 === 0);
      this.down[name] = current;
      this.previous[name] = current;
      if (this.injected[name] > 0) this.injected[name]--;
    }
  },
  readGamepad: function () {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < BUTTONS.length; i++) this.pad[BUTTONS[i]] = false; // reuse the object: no allocation per frame
    for (const pad of pads) {
      if (!pad) continue;
      const axisX = pad.axes[0] || 0;
      const axisY = pad.axes[1] || 0;
      const buttons = pad.buttons;
      if (padButtonOn(buttons, 12) || axisY < -0.5) this.pad.up = true;
      if (padButtonOn(buttons, 13) || axisY > 0.5) this.pad.down = true;
      if (padButtonOn(buttons, 14) || axisX < -0.5) this.pad.left = true;
      if (padButtonOn(buttons, 15) || axisX > 0.5) this.pad.right = true;
      if (padButtonOn(buttons, 0)) this.pad.a = true;
      if (padButtonOn(buttons, 1)) this.pad.b = true;
      if (padButtonOn(buttons, 9) || padButtonOn(buttons, 3)) this.pad.menu = true;
      if (padButtonOn(buttons, 8)) this.pad.map = true; // Select / Back
    }
  },
  inject: function (name, frames) { this.injected[name] = frames || 2; },
  clear: function () { this.keys = {}; this.pad = {}; this.touch = {}; this.injected = {}; this.previous = {}; },
};
window.addEventListener('keydown', function (event) {
  Sound.unlock();
  const top = layers[layers.length - 1];
  if (top && top.onKey && top.onKey(event)) { event.preventDefault(); return; }
  if (event.code === 'KeyN') { OPT.sound = !OPT.sound; Sound.applyMute(); saveOptions(); return; }
  const name = KEY_MAP[event.code];
  if (!name) return;
  event.preventDefault();
  Input.keys[name] = true;
});
window.addEventListener('keyup', function (event) {
  const name = KEY_MAP[event.code];
  if (name) Input.keys[name] = false;
});
window.addEventListener('blur', function () { Input.keys = {}; Input.touch = {}; });
window.addEventListener('gamepadconnected', function () { Input.padConnected++; });
window.addEventListener('gamepaddisconnected', function () { Input.padConnected = Math.max(0, Input.padConnected - 1); Input.pad = {}; });
function bindTouchButtons() {
  for (const element of touchPad.querySelectorAll('[data-btn]')) {
    const name = element.getAttribute('data-btn');
    const press = function (event) { event.preventDefault(); Sound.unlock(); Input.touch[name] = true; element.classList.add('on'); };
    const release = function (event) { event.preventDefault(); Input.touch[name] = false; element.classList.remove('on'); };
    element.addEventListener('pointerdown', press);
    element.addEventListener('pointerup', release);
    element.addEventListener('pointercancel', release);
    element.addEventListener('pointerleave', release);
    element.addEventListener('contextmenu', function (event) { event.preventDefault(); });
  }
}

const Sound = {
  context: null, master: null, trackId: null, step: 0, nextTime: 0, timer: null, wanted: null,
  unlock: function () {
    if (!this.context) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        this.context = new AudioContextClass();
        this.master = this.context.createGain();
        this.master.connect(this.context.destination);
        this.applyMute();
      } catch (error) { this.context = null; return; }
    }
    if (this.context.state === 'suspended') this.context.resume();
    if (this.wanted && !this.timer) this.play(this.wanted);
  },
  applyMute: function () { if (this.master) this.master.gain.value = OPT.sound ? 0.5 : 0; },
  tone: function (frequency, start, duration, type, volume, slideTo) {
    if (!this.context || !OPT.sound) return;
    const oscillator = this.context.createOscillator();
    const gain = this.context.createGain();
    oscillator.type = type;
    oscillator.frequency.setValueAtTime(frequency, start);
    if (slideTo) oscillator.frequency.linearRampToValueAtTime(slideTo, start + duration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.linearRampToValueAtTime(volume, start + 0.006);
    gain.gain.linearRampToValueAtTime(0.0001, start + duration);
    oscillator.connect(gain);
    gain.connect(this.master);
    oscillator.start(start);
    oscillator.stop(start + duration + 0.02);
  },
  sfx: function (name) {
    if (!this.context || !OPT.sound) return;
    const pattern = SFX_PATTERNS[name];
    if (!pattern) return;
    const now = this.context.currentTime;
    for (const note of pattern) this.tone(note[0], now + note[4], note[1], note[2], note[3], note[5]);
  },
  play: function (id) {
    this.wanted = id;
    if (!this.context || this.trackId === id) return;
    this.trackId = id;
    this.step = 0;
    this.nextTime = this.context.currentTime + 0.05;
    if (!this.timer) this.timer = setInterval(this.schedule.bind(this), 60);
  },
  stop: function () { this.wanted = null; this.trackId = null; },
  schedule: function () {
    if (!this.context || !this.trackId) return;
    const track = MUSIC_TRACKS[this.trackId];
    const stepLength = 60 / track.bpm / 2;
    while (this.nextTime < this.context.currentTime + 0.25) {
      const index = this.step % track.lead.length;
      const lead = track.lead[index];
      const bass = track.bass[index];
      if (lead) this.tone(440 * Math.pow(2, (lead - 69) / 12), this.nextTime, stepLength * 0.9, 'square', 0.045);
      if (bass) this.tone(440 * Math.pow(2, (bass - 69) / 12), this.nextTime, stepLength * 1.6, 'triangle', 0.09);
      this.nextTime += stepLength;
      this.step++;
    }
  },
};

// ---- Layers: a stack of screens; only the top one gets input ------------------------------------------------------
const layers = [];
function pushLayer(layer) {
  layers.push(layer);
  if (layer.onEnter) layer.onEnter();
  return layer;
}
function removeLayer(layer) {
  const index = layers.indexOf(layer);
  if (index >= 0) layers.splice(index, 1);
}
// Opens a layer and waits until it closes itself with layer.close(value).
function openLayer(layer) {
  return new Promise(function (resolve) {
    layer.resolve = resolve;
    pushLayer(layer);
  });
}
function closeLayer(layer, value) {
  removeLayer(layer);
  if (layer.resolve) { const resolve = layer.resolve; layer.resolve = null; resolve(value); }
}
function updateLayers() {
  const top = layers[layers.length - 1];
  if (top) top.update();
  // layers below the top may animate (overworld NPCs) when they ask for it
  for (let i = 0; i < layers.length - 1; i++) if (layers[i].backgroundUpdate) layers[i].backgroundUpdate();
}
function drawLayers() {
  let first = layers.length - 1;
  while (first > 0 && !layers[first].opaque) first--;
  for (let i = Math.max(0, first); i < layers.length; i++) layers[i].draw();
}

// ---- Fade (screen transitions) ----------------------------------------------------------------------------------------
const Fade = {
  alpha: 0, from: 0, to: 0, frame: 0, frames: 0, resolve: null,
  start: function (target, frames) {
    if (OPT.reduceMotion || frames <= 0) { this.alpha = target; return Promise.resolve(); }
    this.from = this.alpha; this.to = target; this.frame = 0; this.frames = frames;
    return new Promise(function (resolve) { Fade.resolve = resolve; });
  },
  update: function () {
    if (this.frames <= 0) return;
    this.frame++;
    this.alpha = this.from + (this.to - this.from) * Math.min(1, this.frame / this.frames);
    if (this.frame >= this.frames) { this.frames = 0; const resolve = this.resolve; this.resolve = null; if (resolve) resolve(); }
  },
  draw: function () {
    if (this.alpha <= 0.001) return;
    ctx.globalAlpha = this.alpha;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
    ctx.globalAlpha = 1;
  },
};

// ---- Text box (typewriter text with pages) ---------------------------------------------------------------------------------
const TEXT_SPEEDS = [0.45, 1, 3]; // characters per frame for slow, normal, fast
function TextBox(width, linesPerPage) {
  this.width = width;
  this.linesPerPage = linesPerPage;
  this.lines = [];
  this.page = 0;
  this.shown = 0;
  this.total = 0;
  this.typed = 0;
}
TextBox.prototype.setText = function (text) {
  this.lines = wrapText(text, this.width);
  this.page = 0;
  this.beginPage();
};
TextBox.prototype.beginPage = function () {
  let total = 0;
  for (let i = this.page * this.linesPerPage; i < Math.min(this.lines.length, (this.page + 1) * this.linesPerPage); i++) total += this.lines[i].length;
  this.total = total;
  this.typed = 0;
};
TextBox.prototype.isTyping = function () { return this.typed < this.total; };
TextBox.prototype.hasMorePages = function () { return (this.page + 1) * this.linesPerPage < this.lines.length; };
TextBox.prototype.update = function () {
  if (this.typed < this.total) this.typed = Math.min(this.total, this.typed + TEXT_SPEEDS[OPT.textSpeed]);
};
// A press: finish typing, go to the next page, or report that the text is finished.
TextBox.prototype.advance = function () {
  if (this.isTyping()) { this.typed = this.total; return false; }
  if (this.hasMorePages()) { this.page++; this.beginPage(); return false; }
  return true;
};
TextBox.prototype.draw = function (x, y, lineHeight, color) {
  let remaining = Math.floor(this.typed);
  const start = this.page * this.linesPerPage;
  for (let i = start; i < Math.min(this.lines.length, start + this.linesPerPage); i++) {
    const line = this.lines[i];
    if (remaining <= 0) break;
    drawText(remaining >= line.length ? line : line.slice(0, remaining), x, y + (i - start) * lineHeight, color);
    remaining -= line.length;
  }
};

// ---- Dialog layer ------------------------------------------------------------------------------------------------------------
const DIALOG_BOX = { x: 4, y: 112, w: 232, h: 44 };
function DialogLayer(text) {
  this.opaque = false;
  this.box = new TextBox(DIALOG_BOX.w - 20, 3);
  this.box.setText(text);
  this.blink = 0;
}
DialogLayer.prototype.update = function () {
  this.box.update();
  this.blink++;
  if (Input.pressed.a || Input.pressed.b) {
    if (this.waitForChoice) { if (this.box.isTyping()) this.box.advance(); return; }
    if (this.box.advance()) { Sound.sfx('confirm'); closeLayer(this); }
  }
};
DialogLayer.prototype.draw = function () {
  drawPanel(DIALOG_BOX.x, DIALOG_BOX.y, DIALOG_BOX.w, DIALOG_BOX.h);
  ctx.font = FONT;
  this.box.draw(DIALOG_BOX.x + 10, DIALOG_BOX.y + 7, 11, COLOR.ink);
  if (!this.box.isTyping() && (this.blink >> 4) % 2 === 0) {
    ctx.fillStyle = COLOR.red;
    ctx.fillRect(DIALOG_BOX.x + DIALOG_BOX.w - 14, DIALOG_BOX.y + DIALOG_BOX.h - 12, 6, 2);
    ctx.fillRect(DIALOG_BOX.x + DIALOG_BOX.w - 13, DIALOG_BOX.y + DIALOG_BOX.h - 10, 4, 2);
    ctx.fillRect(DIALOG_BOX.x + DIALOG_BOX.w - 12, DIALOG_BOX.y + DIALOG_BOX.h - 8, 2, 2);
  }
};
function say(textOrKey, vars) {
  const text = vars === undefined && STRINGS[textOrKey] === undefined ? textOrKey : T(textOrKey, vars);
  return openLayer(new DialogLayer(text));
}
async function sayAll(keys, vars) { for (const key of keys) await say(key, vars); }

// ---- Choice menu (small list that returns the chosen index, or -1 for back) --------------------------------------------------
// items: array of strings or { label, disabled }. options: x, y, w, cancel (default true), start.
function ChoiceLayer(items, options) {
  const o = options || {};
  this.opaque = false;
  this.items = items.map(function (item) { return typeof item === 'string' ? { label: item } : item; });
  this.x = o.x === undefined ? 150 : o.x;
  this.y = o.y === undefined ? 70 : o.y;
  this.w = o.w || 84;
  this.cancel = o.cancel !== false;
  this.cursor = o.start || 0;
  this.title = o.title || null;
  this.onMove = o.onMove || null;
  this.rowHeight = 12;
  this.h = this.items.length * this.rowHeight + 8 + (this.title ? 12 : 0);
  if (o.bottom !== undefined) this.y = o.bottom - this.h;
}
ChoiceLayer.prototype.update = function () {
  const count = this.items.length;
  if (Input.repeat.up) { this.cursor = (this.cursor + count - 1) % count; Sound.sfx('move'); if (this.onMove) this.onMove(this.cursor); }
  if (Input.repeat.down) { this.cursor = (this.cursor + 1) % count; Sound.sfx('move'); if (this.onMove) this.onMove(this.cursor); }
  if (Input.pressed.a) {
    if (this.items[this.cursor].disabled) { Sound.sfx('error'); return; }
    Sound.sfx('confirm');
    closeLayer(this, this.cursor);
  } else if (Input.pressed.b && this.cancel) { Sound.sfx('back'); closeLayer(this, -1); }
};
ChoiceLayer.prototype.draw = function () {
  drawPanel(this.x, this.y, this.w, this.h);
  ctx.font = FONT;
  let top = this.y + 5;
  if (this.title) { drawText(this.title, this.x + 6, top, COLOR.red); top += 12; }
  for (let i = 0; i < this.items.length; i++) {
    const item = this.items[i];
    const color = item.disabled ? COLOR.gray : COLOR.ink;
    if (i === this.cursor) { ctx.fillStyle = COLOR.red; ctx.fillRect(this.x + 5, top + i * this.rowHeight + 2, 3, 5); }
    drawText(item.label, this.x + 11, top + i * this.rowHeight, color);
  }
};
function choose(items, options) { return openLayer(new ChoiceLayer(items, options)); }
async function askYesNo(key, vars) {
  const prompt = new DialogLayer(T(key, vars));
  prompt.waitForChoice = true;
  pushLayer(prompt);
  while (prompt.box.isTyping()) await nextFrame();
  const answer = await choose([T('ui.yes'), T('ui.no')], { x: 170, bottom: DIALOG_BOX.y - 2, w: 64, start: 0 });
  closeLayer(prompt);
  return answer === 0;
}

// ---- Frame helpers -----------------------------------------------------------------------------------------------------------
let frameWaiters = [];
function nextFrame() { return new Promise(function (resolve) { frameWaiters.push(resolve); }); }
async function waitFrames(count) { for (let i = 0; i < count; i++) await nextFrame(); }
function releaseFrameWaiters() {
  const waiters = frameWaiters;
  frameWaiters = [];
  for (let i = 0; i < waiters.length; i++) waiters[i]();
}

// ---- Overworld ---------------------------------------------------------------------------------------
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };
const MOVE_FRAMES = 10;
const SHEET_ROW = { down: 0, up: 1, left: 2, right: 2 };

function OverworldLayer() {
  this.opaque = true;
  this.busy = false;
  this.tick = 0;
  this.move = null;
  this.lastDir = 'down';
  this.exclaim = null;
  this.popup = 0;
  this.npcs = [];
  this.tempNpcs = [];
  this.npcList = [];
  this.npcListFlagCount = -1;
  this.npcListFlags = null;
  this.npcListStale = true;
  this.stepAnim = 0;
}
OverworldLayer.prototype.loadMap = function (mapId, x, y, dir) {
  this.mapId = mapId;
  this.map = MAPS[mapId];
  this.px = x;
  this.py = y;
  this.dir = dir || 'down';
  this.move = null;
  this.tempNpcs = [];
  this.npcs = this.map.npcs.map(function (def) { return { def: def, x: def.x, y: def.y, face: def.face, walk: null }; });
  this.npcListStale = true;
  G.player.map = mapId; G.player.x = x; G.player.y = y; G.player.dir = this.dir;
  worldVisit(G.world, mapId, G.flags);
  this.popup = 120;
  Sound.play(this.map.music);
};
OverworldLayer.prototype.onEnter = function () { this.loadMap(G.player.map, G.player.x, G.player.y, G.player.dir); this.popup = 0; };
// The visible NPCs are listed again only when a story flag was added or the NPCs of the map changed
// (flags are only ever added), so the per-frame calls do not allocate.
OverworldLayer.prototype.visibleNpcs = function () {
  let flagCount = 0;
  for (const name in G.flags) if (G.flags[name]) flagCount++;
  if (this.npcListStale || flagCount !== this.npcListFlagCount || G.flags !== this.npcListFlags) {
    this.npcList = [];
    for (const npc of this.npcs) if (npcVisible(npc.def, G.flags)) this.npcList.push(npc);
    for (const npc of this.tempNpcs) this.npcList.push(npc);
    this.npcListFlagCount = flagCount;
    this.npcListFlags = G.flags;
    this.npcListStale = false;
  }
  return this.npcList;
};
OverworldLayer.prototype.npcAt = function (x, y) {
  for (const npc of this.visibleNpcs()) if (npc.x === x && npc.y === y) return npc;
  return null;
};
OverworldLayer.prototype.canWalk = function (x, y) {
  if (tileDef(this.map, x, y).solid) return false;
  if (this.npcAt(x, y)) return false;
  const warp = findWarp(this.map, x, y);
  if (warp && !warpOpen(warp, G.flags)) return false;
  return true;
};
OverworldLayer.prototype.runScript = async function (script) {
  this.busy = true;
  try { await script(); } catch (error) { console.error('Mizamon script error', error); }
  this.busy = false;
};
OverworldLayer.prototype.update = function () {
  this.tick++;
  if (this.popup > 0) this.popup--;
  this.backgroundUpdate();
  if (this.busy) return;
  if (this.move) { this.advanceMove(); return; }
  if (Input.pressed.menu) { this.runScript(openPauseMenu.bind(null, this)); return; }
  if (Input.pressed.map) { this.runScript(openMapScreen); return; }
  if (Input.pressed.a) { this.runScript(this.interact.bind(this)); return; }
  for (const name of ['up', 'down', 'left', 'right']) if (Input.pressed[name]) this.lastDir = name;
  let wanted = Input.down[this.lastDir] ? this.lastDir : null;
  if (!wanted) for (const name of ['up', 'down', 'left', 'right']) if (Input.down[name]) wanted = name;
  if (wanted) this.tryMove(wanted);
};
OverworldLayer.prototype.backgroundUpdate = function () {
  for (const npc of this.visibleNpcs()) {
    if (!npc.walk) continue;
    npc.walk.t += 1 / MOVE_FRAMES;
    if (npc.walk.t >= 1) {
      npc.x += npc.walk.dx; npc.y += npc.walk.dy;
      const done = npc.walk.done;
      npc.walk = null;
      if (done) done();
    }
  }
};
OverworldLayer.prototype.tryMove = function (dir) {
  this.dir = dir;
  G.player.dir = dir;
  const target = DIRS[dir];
  const nx = this.px + target[0];
  const ny = this.py + target[1];
  if (!this.canWalk(nx, ny)) {
    if (Input.pressed[dir]) Sound.sfx('bump');
    return;
  }
  this.move = { dx: target[0], dy: target[1], t: 0 };
};
OverworldLayer.prototype.advanceMove = function () {
  this.move.t += 1 / MOVE_FRAMES;
  if (this.move.t < 1) return;
  this.px += this.move.dx;
  this.py += this.move.dy;
  this.move = null;
  this.stepAnim++;
  G.player.x = this.px; G.player.y = this.py;
  G.steps++;
  this.runScript(this.onArrive.bind(this));
};
OverworldLayer.prototype.onArrive = async function () {
  const warp = findWarp(this.map, this.px, this.py);
  if (warp && warpOpen(warp, G.flags)) { await this.useWarp(warp); return; }
  if (await this.checkTriggers()) return;
  const encounter = rollEncounter(G.rng, this.map, this.px, this.py);
  if (encounter) { await this.wildEncounter(encounter); return; }
  await this.checkTrainerSight();
};
OverworldLayer.prototype.checkTriggers = async function () {
  for (const trigger of this.map.triggers || []) {
    if (trigger.x === this.px && trigger.y === this.py && !G.flags[trigger.flag]) { await this.runEvent(trigger.event); return true; }
  }
  return false;
};
OverworldLayer.prototype.useWarp = async function (warp) {
  Sound.sfx('door');
  await Fade.start(1, 10);
  this.loadMap(warp.to, warp.tx, warp.ty, this.dir);
  await waitFrames(2);
  await Fade.start(0, 10);
  if (await this.checkTriggers()) return;
  await this.checkTrainerSight();
};
OverworldLayer.prototype.teleport = async function (spot) {
  await Fade.start(1, 12);
  this.loadMap(spot.map, spot.x, spot.y, spot.dir || 'up');
  await waitFrames(2);
  await Fade.start(0, 12);
};
// Walks a non-player character one tile; resolves when the step is finished.
OverworldLayer.prototype.walkNpc = function (npc, dir) {
  npc.face = dir;
  return new Promise(function (resolve) { npc.walk = { dx: DIRS[dir][0], dy: DIRS[dir][1], t: 0, done: resolve }; });
};
OverworldLayer.prototype.showExclaim = async function (npc) {
  this.exclaim = npc;
  Sound.sfx('alert');
  await waitFrames(36);
  this.exclaim = null;
};
OverworldLayer.prototype.checkTrainerSight = async function () {
  for (const npc of this.visibleNpcs()) {
    const def = npc.def;
    if (def.kind !== 'trainer' || !def.sight || G.flags['t_' + def.trainer]) continue;
    if (!this.seesPlayer(npc)) continue;
    await this.challenge(npc, true);
    return;
  }
};
OverworldLayer.prototype.seesPlayer = function (npc) {
  const direction = DIRS[npc.face];
  for (let distance = 1; distance <= npc.def.sight; distance++) {
    const x = npc.x + direction[0] * distance;
    const y = npc.y + direction[1] * distance;
    if (x === this.px && y === this.py) return true;
    if (tileDef(this.map, x, y).solid || this.npcAt(x, y)) return false;
  }
  return false;
};
OverworldLayer.prototype.interact = async function () {
  const facing = DIRS[this.dir];
  const fx = this.px + facing[0];
  const fy = this.py + facing[1];
  let npc = this.npcAt(fx, fy);
  if (!npc && tileDef(this.map, fx, fy).counter) npc = this.npcAt(fx + facing[0], fy + facing[1]);
  if (npc) { npc.face = OPPOSITE[this.dir]; await this.talkTo(npc); return; }
  const action = this.map.actions ? this.map.actions[fx + ',' + fy] : null;
  if (action === 'archive') { await this.useArchive(); return; }
  const signKey = this.map.signs[fx + ',' + fy];
  if (signKey) { await say(signKey); return; }
  const warp = findWarp(this.map, fx, fy);
  if (warp && !warpOpen(warp, G.flags)) await say(warp.lockedText);
};
OverworldLayer.prototype.talkTo = async function (npc) {
  const def = npc.def;
  if (def.kind === 'talk') await say(def.text);
  else if (def.kind === 'prof') await this.talkProfessor();
  else if (def.kind === 'heal') await this.healAtHospital();
  else if (def.kind === 'kep') await this.talkKep();
  else if (def.kind === 'shop') await this.shopTalk();
  else if (def.kind === 'save') await this.cafeTalk();
  else if (def.kind === 'trainer' || def.kind === 'boss') {
    if (G.flags['t_' + def.trainer]) await say('tr.' + def.trainer + '.after');
    else await this.challenge(npc, false);
  }
};
OverworldLayer.prototype.talkProfessor = async function () {
  if (G.flags.credits) await say('npc.prof.3');
  else if (G.flags.badge) await say('npc.prof.2');
  else if (G.flags.rival1) await say('npc.prof.1b');
  else await say('npc.prof.1');
};

// The Αρχείο Ασθενών terminal: deposit, withdraw, list.
OverworldLayer.prototype.useArchive = async function () {
  await say('arch.hello');
  let start = 0;
  for (;;) {
    const choice = await choose([T('arch.deposit'), T('arch.withdraw'), T('arch.list'), T('menu.close')],
      { x: 120, y: 40, w: 112, start: start, title: T('arch.count', { n: G.archive.length, max: ARCHIVE_MAX }) });

OverworldLayer.prototype.archiveDeposit = async function () {

OverworldLayer.prototype.shopTalk = async function () {

OverworldLayer.prototype.cafeTalk = async function () {
  await say(this.map.cafeHello || 'cafe.hello'); // the café of Παλαιό Φάληρο has its own greeting
  if (await askYesNo('cafe.ask')) {
    const stored = writeSave();
    Sound.sfx('heal');

OverworldLayer.prototype.wildEncounter = async function (encounter) {
  const foe = makeMon(encounter.sp, encounter.lv);
  const result = await runBattle({ kind: 'wild', foeParty: [foe] });
  await this.afterBattle(result, null);
};
OverworldLayer.prototype.challenge = async function (npc, fromSight) {
  const trainerId = npc.def.trainer;
  const trainer = TRAINERS[trainerId];
  const walked = []; // the steps the trainer took toward the player, so they can walk back afterwards
  if (fromSight) {
    await this.showExclaim(npc);
    let guard = 0;
    while (guard++ < 8 && Math.abs(npc.x - this.px) + Math.abs(npc.y - this.py) > 1) { walked.push(npc.face); await this.walkNpc(npc, npc.face); }
  }
  await say('tr.' + trainerId + '.intro');
  const result = await runBattle({ kind: 'trainer', trainerId: trainerId, foeParty: buildTrainerTeam(trainerId, G.starter) });
  await this.afterBattle(result, trainerId);
  if (result === 'win') {
    G.flags['t_' + trainerId] = true;
    await say('tr.' + trainerId + '.win');
    if (trainer.boss) await this.bossVictory(trainerId);
  }
  if (result !== 'lose' && npcVisible(npc.def, G.flags)) {
    for (let i = walked.length - 1; i >= 0; i--) await this.walkNpc(npc, OPPOSITE[walked[i]]);
    npc.face = npc.def.face;
  }
};
OverworldLayer.prototype.afterBattle = async function (result, trainerId) {
  if (result === 'lose') { await this.blackout(); return; }
  await runEvolutions();
};
OverworldLayer.prototype.blackout = async function () {
  await say('blackout.text');
  G.money = Math.floor(G.money * BLACKOUT_MONEY_KEEP);
  hospitalHeal(G.party, G.bag, false);
  await this.teleport(G.lastHeal);
  await say('blackout.hospital');
};
// What follows a won boss fight: the line, the badge flag, the badge card, the line after it. Only the first boss also shows the chapter card
// and sets the flag credits (the studio opens on it).
OverworldLayer.prototype.bossVictory = async function (trainerId) {

OverworldLayer.prototype.runEvent = async function (eventId) {
  if (eventId === 'rival1') {
    G.flags.rival1 = true;
    const rival = { def: { look: 'rival', kind: 'tmp' }, x: 3, y: 9, face: 'up', walk: null };
    this.tempNpcs.push(rival);
    this.npcListStale = true;
    Sound.sfx('alert');
    await this.walkNpc(rival, 'up');
    await sayAll(['rival1.intro1', 'rival1.intro2']);
    const result = await runBattle({ kind: 'trainer', trainerId: 'rival1', foeParty: buildTrainerTeam('rival1', G.starter) });
    if (result === 'ran') { this.tempNpcs = []; this.npcListStale = true; return; } // the battle broke: the fight does not count
    G.flags.t_rival1 = true;
    if (result === 'lose') { await say('rival1.win'); await this.afterBattle('lose', 'rival1'); }
    else { await say('rival1.lose'); await runEvolutions(); }
    if (result !== 'lose') {
      await this.walkNpc(rival, 'right');
      for (let i = 0; i < 6; i++) await this.walkNpc(rival, 'right');
    }
    this.tempNpcs = [];
    this.npcListStale = true;
  }
};
OverworldLayer.prototype.draw = function () {
  ctx.font = FONT;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  const map = this.map;
  let offsetX = this.move ? this.move.dx * this.move.t * TILE : 0;
  let offsetY = this.move ? this.move.dy * this.move.t * TILE : 0;
  const playerX = this.px * TILE + offsetX;
  const playerY = this.py * TILE + offsetY;
  let camX = Math.round(playerX + TILE / 2 - SCREEN_W / 2);
  let camY = Math.round(playerY + TILE / 2 - SCREEN_H / 2);
  if (map.w * TILE <= SCREEN_W) camX = -Math.floor((SCREEN_W - map.w * TILE) / 2);
  else camX = Math.max(0, Math.min(map.w * TILE - SCREEN_W, camX));
  if (map.h * TILE <= SCREEN_H) camY = -Math.floor((SCREEN_H - map.h * TILE) / 2);
  else camY = Math.max(0, Math.min(map.h * TILE - SCREEN_H, camY));
  const firstX = Math.max(0, Math.floor(camX / TILE));
  const lastX = Math.min(map.w - 1, Math.floor((camX + SCREEN_W) / TILE));
  const firstY = Math.max(0, Math.floor(camY / TILE));
  const lastY = Math.min(map.h - 1, Math.floor((camY + SCREEN_H) / TILE));
  const waterFrame = waterFrames[(this.tick >> 5) & 1];
  for (let y = firstY; y <= lastY; y++) {
    const row = map.rows[y];
    for (let x = firstX; x <= lastX; x++) {
      const char = row[x];
      ctx.drawImage(char === '~' ? waterFrame : tileSprites[char], x * TILE - camX, y * TILE - camY);
    }
  }
  const npcs = this.visibleNpcs();
  for (const npc of npcs) if (npc.y <= this.py) this.drawNpc(npc, camX, camY);
  this.drawPlayer(playerX - camX, playerY - camY);
  for (const npc of npcs) if (npc.y > this.py) this.drawNpc(npc, camX, camY);
  if (this.exclaim) {
    const npc = this.exclaim;
    const ex = npc.x * TILE - camX + 5;
    const ey = npc.y * TILE - camY - 11;
    ctx.fillStyle = COLOR.border; ctx.fillRect(ex - 1, ey - 1, 8, 12);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(ex, ey, 6, 10);
    ctx.fillStyle = COLOR.red; ctx.fillRect(ex + 2, ey + 1, 2, 5); ctx.fillRect(ex + 2, ey + 7, 2, 2);
  }
  if (this.popup > 0) {
    const label = T(map.name);
    const width = Math.ceil(ctx.measureText(label).width) + 14;
    drawPanel(Math.floor((SCREEN_W - width) / 2), 4, width, 16);
    drawText(label, SCREEN_W / 2, 8, COLOR.ink, 'center');
  }
};
OverworldLayer.prototype.drawNpc = function (npc, camX, camY) {
  let x = npc.x * TILE;
  let y = npc.y * TILE;
  let frame = 0;
  if (npc.walk) { x += npc.walk.dx * npc.walk.t * TILE; y += npc.walk.dy * npc.walk.t * TILE; frame = npc.walk.t < 0.5 ? 1 : 2; }
  this.blit(charSheet(npc.def.look), npc.face, frame, x - camX, y - camY);
};
OverworldLayer.prototype.drawPlayer = function (x, y) {
  const sheet = charSheet(G.player.gender === 'f' ? 'playerF' : 'playerM');
  const frame = this.move ? (this.move.t < 0.5 ? 1 : 2) : 0;
  this.blit(sheet, this.dir, frame, x, y);
};
OverworldLayer.prototype.blit = function (sheet, dir, frame, x, y) {
  const row = SHEET_ROW[dir];
  const drawX = Math.round(x);
  const drawY = Math.round(y);
  if (dir === 'right') {
    ctx.save(); ctx.translate(drawX + TILE, drawY); ctx.scale(-1, 1);
    ctx.drawImage(sheet, frame * TILE, row * TILE, TILE, TILE, 0, 0, TILE, TILE);
    ctx.restore();
  } else ctx.drawImage(sheet, frame * TILE, row * TILE, TILE, TILE, drawX, drawY, TILE, TILE);
};

// ---- Small story screens: ticket, badge, credits -------------------------------------------------------------------
function TicketLayer() { this.opaque = false; this.frame = 0; }
TicketLayer.prototype.update = function () {

};
TicketLayer.prototype.draw = function () {

  drawText(T('kep.sign'), 120, 38, COLOR.red, 'center');
  drawText(T('kep.yourNumber'), 120, 52, COLOR.ink, 'center');
  ctx.font = 'bold 20px "Courier New", monospace';
  drawText('9.999', 120, 62, COLOR.ink, 'center');

  const serving = 3 + Math.floor(this.frame / 60);

};
// The hospital "examination": a heart-monitor line sweeps across a dark screen while three beeps play.
// With Reduced motion the line is drawn whole and does not scroll or flash.
const MONITOR_FRAMES = 72;
const MONITOR_PULSE = [0, 0, 0, 0, -1, -2, -1, 0, 0, 0, 3, -14, 9, 0, 0, 0, -1, -3, -4, -3, -1, 0, 0, 0, 0, 0, 0, 0]; // one heartbeat: pixel offsets from the middle
const MONITOR_BOX = { x: 38, y: 52, w: 164, h: 48 };
function MonitorLayer() { this.opaque = false; this.frame = 0; }
MonitorLayer.prototype.onEnter = function () { Sound.sfx('hospital'); };
MonitorLayer.prototype.update = function () {
  this.frame++;
  if (this.frame >= MONITOR_FRAMES) closeLayer(this);
};
MonitorLayer.prototype.draw = function () {
  ctx.fillStyle = 'rgba(10,10,30,0.7)'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  drawPanel(30, 30, 180, 80);
  ctx.font = FONT;
  drawText(T('hosp.monitor'), 120, 38, COLOR.ink, 'center');
  ctx.fillStyle = '#0e2a1c'; ctx.fillRect(MONITOR_BOX.x, MONITOR_BOX.y, MONITOR_BOX.w, MONITOR_BOX.h);
  const still = OPT.reduceMotion;
  const scroll = still ? 0 : this.frame * 2;
  const reach = still ? MONITOR_BOX.w : Math.min(MONITOR_BOX.w, Math.round(this.frame / MONITOR_FRAMES * MONITOR_BOX.w * 1.2));
  ctx.fillStyle = still || (this.frame >> 3) % 2 === 0 ? '#4fe08a' : '#b8ffd0';
  const middle = MONITOR_BOX.y + MONITOR_BOX.h / 2;
  let previousY = middle;
  for (let x = 0; x < reach; x++) {
    const y = middle + MONITOR_PULSE[(x + scroll) % MONITOR_PULSE.length];
    ctx.fillRect(MONITOR_BOX.x + x, Math.min(y, previousY), 1, Math.abs(y - previousY) + 1);
    previousY = y;
  }
  ctx.font = FONT_SMALL;
  drawText(T('hosp.monitorNote'), 120, 102, COLOR.gray, 'center');
  ctx.font = FONT;
};
// The badge card; the texts and the ribbon colour come from the boss' victory data (the first badge keeps the red ribbon).
function BadgeLayer(titleKey, subKey, ribbon) { this.opaque = false; this.frame = 0; this.titleKey = titleKey || 'badge.title'; this.subKey = subKey || 'badge.sub'; this.ribbon = ribbon || '#c0392b'; this.ribbonDark = shadeColor(this.ribbon, 0.6); }
BadgeLayer.prototype.update = function () {
  this.frame++;
  if (this.frame > 60 && Input.pressed.a) closeLayer(this);
};
BadgeLayer.prototype.draw = function () {
  ctx.fillStyle = 'rgba(10,10,30,0.8)'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);
  const bob = OPT.reduceMotion ? 0 : Math.sin(this.frame / 12) * 2;
  const cx = 120;
  const cy = 62 + bob;
  ctx.fillStyle = this.ribbon; ctx.fillRect(cx - 14, cy + 6, 8, 22); ctx.fillRect(cx + 6, cy + 6, 8, 22); // ribbon
  ctx.fillStyle = this.ribbonDark; ctx.fillRect(cx - 14, cy + 22, 8, 2); ctx.fillRect(cx + 6, cy + 22, 8, 2);
  ctx.fillStyle = '#8a6a10'; ctx.beginPath(); ctx.arc(cx, cy, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#f4c430'; ctx.beginPath(); ctx.arc(cx, cy, 15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffe58a'; ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a5fc4'; ctx.fillRect(cx - 8, cy - 3, 16, 11); // envelope
  ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.moveTo(cx - 8, cy - 3); ctx.lineTo(cx, cy + 4); ctx.lineTo(cx + 8, cy - 3); ctx.lineTo(cx + 8, cy - 2); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 8, cy - 2); ctx.fill();
  ctx.fillStyle = '#f4c430'; ctx.fillRect(cx - 5, cy - 8, 10, 4); ctx.fillRect(cx - 5, cy - 11, 2, 3); ctx.fillRect(cx - 1, cy - 11, 2, 3); ctx.fillRect(cx + 3, cy - 11, 2, 3); // crown
  ctx.font = FONT;
  drawText(T(this.titleKey), 120, 100, COLOR.gold, 'center');
  drawText(T(this.subKey), 120, 112, COLOR.white, 'center');
};
// The short card after the first boss: "Chapter 1 complete".
function ChapterLayer() { this.opaque = true; this.frame = 0; }
ChapterLayer.prototype.onEnter = function () { Sound.play('title'); };
ChapterLayer.prototype.update = function () {
  this.frame++;
  if (this.frame > 240 || (this.frame > 60 && (Input.pressed.a || Input.pressed.b))) closeLayer(this);
};
ChapterLayer.prototype.draw = function () {
  ctx.fillStyle = '#0c1030'; ctx.fillRect(0, 0, SCREEN_W, SCREEN_H);

// ---- Pause menu ---------------------------------------------------------------------------------------------------------
async function openPauseMenu(world) {
  Sound.sfx('confirm');
  let start = 0;
  for (;;) {
    const choice = await choose([T('menu.party'), T('menu.bag'), T('menu.dossier'), T('menu.map'), T('menu.save'), T('menu.options'), T('menu.close')],
      { x: 140, y: 6, w: 96, start: start, title: T('ui.money', { n: G.money }) });
    if (choice === -1 || choice === 6) return;
    start = choice;
    if (choice === 0) await openLayer(new PartyLayer({ mode: 'view' }));
    else if (choice === 1) await openLayer(new BagLayer({ battle: false }));
    else if (choice === 2) await openLayer(new DossierLayer());
    else if (choice === 3) await openMapScreen();
    else if (choice === 4) {
      if (world.mapId !== 'cafe') await say('menu.saveOnlyCafe');
      else { const stored = writeSave(); await say(stored ? 'cafe.saved' : 'cafe.savedMemory'); }
    } else if (choice === 5) await openLayer(new OptionsLayer());
  }
}

// ---- Map screen (Χάρτης / Map) ----------------------------------------------------------------------------------------------------
// 240 x 160: a 12 px title bar, the 30 x 15 cell map (8 px cells) and a 28 px info panel (three 9 px lines). The land, routes and places
// are drawn once into an offscreen canvas when the screen opens (nothing on them changes while it is open); the player marker and the
// cursor are drawn on top every frame.
const MAP_TOP = 12;
const MAP_CELL = 8;
const MAP_PANEL_TOP = 132;
const MAP_TEXT_LIMIT = 232; // the widest text line of the screen must fit in this many logical pixels
const MAP_PIP = 7;
const MAP_PIN = ['.###.', '#####', '##.##', '#####', '.###.', '..#..', '..#..'];
const MAP_DIAMOND = ['..#..', '.###.', '#####', '.###.', '..#..'];
const MAP_STAR = ['..#..', '.###.', '#####', '.###.', '##.##'];
const MAP_PEAK = ['..#..', '.###.', '#####'];
const MAP_SNOW = ['..#..', '.#...'];
const MAP_COLOR = { sea: '#3c78b4', foam: '#8fc5ee', outside: '#9e9a92', peak: '#6b5a46', snow: '#faf5eb', pipOff: '#3a3a52', pipEdge: '#8a8a99', door: '#5a3296', bus: '#2a5fc4' };
function shadeColor(hex, factor) {
  const value = parseInt(hex.slice(1), 16);
  const parts = [value >> 16, (value >> 8) & 255, value & 255].map(function (part) { return Math.max(0, Math.min(255, Math.round(part * factor))); });
  return 'rgb(' + parts.join(',') + ')';
}
// Draws a shape of '#' cells with its top-left corner at (left, top); an outline colour adds a 1 px ring first.
function drawShapeOn(g, shape, left, top, color, outline) {
  if (outline) {
    g.fillStyle = outline;
    shape.forEach(function (row, ry) {
      for (let rx = 0; rx < row.length; rx++) {
        if (row[rx] !== '#') continue;
        g.fillRect(left + rx - 1, top + ry, 3, 1); g.fillRect(left + rx, top + ry - 1, 1, 3);
      }
    });
  }
  g.fillStyle = color;
  shape.forEach(function (row, ry) { for (let rx = 0; rx < row.length; rx++) if (row[rx] === '#') g.fillRect(left + rx, top + ry, 1, 1); });
}
function worldBadgeCount(world) { return Object.keys(world.badges).length; }
function mapCellCentre(cell) { return [Math.round(cell[0] * MAP_CELL + MAP_CELL / 2), Math.round(cell[1] * MAP_CELL + MAP_CELL / 2)]; }

function mapDistrictAt(x, y) {
  const char = WORLD.grid[y][x];
  if (char === '~' || char === '#') return char;
  return Object.values(WORLD.districts).find(function (district) { return district.letter === char.toUpperCase(); }).id;
}
function drawMapTerrain(g, world) {
  const locked = {};
  for (const id of Object.keys(WORLD.districts)) locked[id] = districtState(world, id) === 'locked';
  for (let y = 0; y < WORLD.rows; y++) {
    for (let x = 0; x < WORLD.cols; x++) {
      const here = mapDistrictAt(x, y);
      const left = x * MAP_CELL;
      const top = y * MAP_CELL;
      if (here === '~') {
        g.fillStyle = MAP_COLOR.sea; g.fillRect(left, top, MAP_CELL, MAP_CELL);
        if ((x + y) % 2 === 0) { g.fillStyle = MAP_COLOR.foam; g.fillRect(left + 3, top + 4, 1, 1); } // a faint wave mark
        continue;
      }
      if (here === '#') { g.fillStyle = MAP_COLOR.outside; g.fillRect(left, top, MAP_CELL, MAP_CELL); continue; }
      const hill = WORLD.grid[y][x] !== WORLD.grid[y][x].toUpperCase();
      let factor = hill ? 0.82 : 1;
      if (locked[here]) factor *= 0.62;
      g.fillStyle = shadeColor(WORLD.districts[here].color, factor); g.fillRect(left, top, MAP_CELL, MAP_CELL);
      if (locked[here]) { // the checker pattern of a locked district
        g.fillStyle = 'rgba(27,27,47,0.3)';
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2 === 0) g.fillRect(left + i * 2, top + j * 2, 2, 2);
      }
    }
  }
  // borders: a dark line between two districts, a light line along the coast
  for (let y = 0; y < WORLD.rows; y++) {
    for (let x = 0; x < WORLD.cols; x++) {
      const here = mapDistrictAt(x, y);
      if (here === '~') continue;
      const rightSide = x + 1 < WORLD.cols ? mapDistrictAt(x + 1, y) : '~';
      const below = y + 1 < WORLD.rows ? mapDistrictAt(x, y + 1) : '~';
      const leftSide = x > 0 ? mapDistrictAt(x - 1, y) : '~';
      const above = y > 0 ? mapDistrictAt(x, y - 1) : '~';
      if (rightSide !== here) { g.fillStyle = rightSide === '~' ? MAP_COLOR.foam : COLOR.ink; g.fillRect(x * MAP_CELL + MAP_CELL - 1, y * MAP_CELL, 1, MAP_CELL); }
      if (below !== here) { g.fillStyle = below === '~' ? MAP_COLOR.foam : COLOR.ink; g.fillRect(x * MAP_CELL, y * MAP_CELL + MAP_CELL - 1, MAP_CELL, 1); }
      g.fillStyle = MAP_COLOR.foam;
      if (leftSide === '~') g.fillRect(x * MAP_CELL, y * MAP_CELL, 1, MAP_CELL);
      if (above === '~' && y > 0) g.fillRect(x * MAP_CELL, y * MAP_CELL, MAP_CELL, 1);
    }
  }
  // hills and mountains (lower case in the grid): little peaks with a snow tip
  for (let y = 0; y < WORLD.rows; y++) {
    for (let x = 0; x < WORLD.cols; x++) {
      const char = WORLD.grid[y][x];
      if (char === '~' || char === '#' || char === char.toUpperCase()) continue;
      const centre = mapCellCentre([x, y]);
      drawShapeOn(g, MAP_PEAK, centre[0] - 2, centre[1], MAP_COLOR.peak);
      drawShapeOn(g, MAP_SNOW, centre[0] - 2, centre[1] - 2, MAP_COLOR.snow);
    }
  }
}
function drawMapRoutes(g, world) {
  for (const route of Object.values(WORLD.routes)) {
    if (districtState(world, route.district) === 'locked') continue;
    const endStates = [placeState(world, route.a), placeState(world, route.b)];
    if (!endStates.some(function (state) { return state === 'seen' || state === 'visited'; })) continue;
    g.beginPath();
    route.path.forEach(function (cell, index) {
      const centre = mapCellCentre(cell);
      if (index === 0) g.moveTo(centre[0] + 0.5, centre[1] + 0.5); else g.lineTo(centre[0] + 0.5, centre[1] + 0.5);
    });
    if (route.built && world.routes[route.id]) { // walked: a solid line with its number
      g.setLineDash([]); g.lineJoin = 'round';
      g.strokeStyle = COLOR.ink; g.lineWidth = 3; g.stroke();
      g.strokeStyle = COLOR.paper; g.lineWidth = 1; g.stroke();
      const middle = mapCellCentre(pointAlongPath(route.path, 0.5));
      const label = route.id.replace('route', '');
      const width = label.length * 4 + 3;
      g.fillStyle = COLOR.paper; g.fillRect(middle[0] - Math.floor(width / 2), middle[1] - 4, width, 7);
      g.font = FONT_SMALL; g.textAlign = 'center'; g.fillStyle = COLOR.ink; g.fillText(label, middle[0], middle[1] - 4);
    } else { // not walked yet: dotted
      g.setLineDash([2, 2]); g.strokeStyle = COLOR.ink; g.lineWidth = 1; g.stroke(); g.setLineDash([]);
    }
  }
}
function drawMapPlaces(g, world) {
  for (const node of Object.values(WORLD.nodes)) {
    const state = placeState(world, node.id);
    if (state === 'hidden') continue;
    const centre = mapCellCentre(node.cell);
    const cx = centre[0];
    const cy = centre[1];
    if (state === 'unknown') { // built later: a question mark
      g.fillStyle = COLOR.ink; g.fillRect(cx - 3, cy - 3, 7, 7);
      g.fillStyle = COLOR.paper; g.fillRect(cx - 2, cy - 2, 5, 5);
      g.font = FONT_SMALL; g.textAlign = 'center'; g.fillStyle = COLOR.ink; g.fillText('?', cx + 0.5, cy - 4);
      continue;
    }
    if (node.kind === 'door') { // the Parliament: a purple square with a gold frame
      g.fillStyle = COLOR.gold; g.fillRect(cx - 4, cy - 4, 9, 9);
      g.fillStyle = MAP_COLOR.door; g.fillRect(cx - 3, cy - 3, 7, 7);
      continue;
    }
    g.fillStyle = COLOR.ink; g.fillRect(cx - 3, cy - 3, 7, 7);
    g.fillStyle = state === 'seen' ? WORLD.districts[node.district].color : '#ffffff'; g.fillRect(cx - 2, cy - 2, 5, 5); // a seen place is a hollow square in its district colour; a visited one is white
    if (node.boss) drawShapeOn(g, MAP_DIAMOND, cx + 2, cy - 6, world.badges[node.district] ? COLOR.gray : COLOR.gold, COLOR.ink);
    if (world.stops[node.id]) { g.fillStyle = MAP_COLOR.bus; g.fillRect(cx - 6, cy + 2, 4, 3); } // a bus pip: a ΚΤΕΛ stop is open here

}
function drawMapDistrictNames(g, world) {

function buildMapBase(world) {
  const base = document.createElement('canvas');
  base.width = WORLD.cols * MAP_CELL;
  base.height = WORLD.rows * MAP_CELL;
  const g = base.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.textBaseline = 'top';
  drawMapTerrain(g, world);
  drawMapRoutes(g, world);
  drawMapPlaces(g, world);
  drawMapDistrictNames(g, world);
  return base;
}

// The title bar: the title on the left, the six badge pips and "n/6" on the right. Measured, so a test can check they fit and do not touch.
function mapTitleLayout(won) {
  ctx.font = FONT;
  const title = T('map.title') + ' · ' + T('map.scale');
  const count = won + '/' + WORLD_BADGE_COUNT;
  const countWidth = Math.ceil(ctx.measureText(count).width);
  const countX = SCREEN_W - 4 - countWidth;
  const pipsX = countX - 4 - (WORLD_BADGE_COUNT * (MAP_PIP + 1) - 1);
  return { title: title, count: count, countX: countX, pipsX: pipsX, leftEnd: 4 + Math.ceil(ctx.measureText(title).width) };
}
// The three info lines for the selected place: page one (what is there, the keys) or the district sheet (page two).
function mapInfoLines(world, nodeId, sheet) {
  const node = WORLD.nodes[nodeId];
  const district = WORLD.districts[node.district];
  const levels = T('map.levels', { lo: district.levels[0], hi: district.levels[1] });
  if (!sheet) {
    const has = (node.has || []).map(function (key) { return T('world.has.' + key); }).join(', ');
    return [T('world.' + nodeId) + ' · ' + T(district.nameKey), has + ' · ' + levels, T('map.keys')];
  }
  const boss = TRAINERS[district.bossTrainer] ? TRAINERS[district.bossTrainer].name : '???';
  const species = districtSpecies(district.id);
  const towns = Object.values(WORLD.nodes).filter(function (other) { return other.district === district.id && other.kind === 'town'; });
  return [
    T(district.nameKey) + ' · ' + T(world.badges[district.id] ? 'map.badge.won' : 'map.badge.no'),
    T('map.sheet.boss', { boss: boss }),
    T('map.sheet.stats', {
      met: species.filter(function (id) { return G.dex.seen[id]; }).length, all: species.length,
      seen: towns.filter(function (town) { return world.visited[town.id]; }).length, towns: towns.length,
    }) + ' · ' + levels,
  ];
}

function MapLayer() {
  this.opaque = true;
  this.frame = 0;
  this.sheet = false;
  this.world = G.world;
  this.base = buildMapBase(this.world);
  this.marker = worldMarker(G.player.map, G.player.x, G.player.y);
  this.cursor = this.startCursor();
  // Everything draw() shows is built here or when the cursor or the sheet changes, never per frame (reference section 11).
  this.won = worldBadgeCount(this.world);
  this.titleLayout = mapTitleLayout(this.won);
  this.markerPixel = this.marker ? mapCellCentre(this.marker.cell) : null;
  this.refreshInfo();
}
// The cursor's pixel position and its info lines; called when the cursor or the sheet changes.
MapLayer.prototype.refreshInfo = function () {
  this.cursorPixel = this.cursor ? mapCellCentre(WORLD.nodes[this.cursor].cell) : null;
  this.lines = this.cursor ? mapInfoLines(this.world, this.cursor, this.sheet) : null;
  this.districtWon = this.cursor ? !!this.world.badges[WORLD.nodes[this.cursor].district] : false;
};
// The cursor starts on the player's place; on a route, on the nearer end that is on the map.
MapLayer.prototype.startCursor = function () {
  const candidates = worldCandidates(this.world);
  const marker = this.marker;
  if (marker && !marker.onRoute && candidates.includes(marker.id)) return marker.id;
  if (marker && marker.onRoute) {
    const route = WORLD.routes[marker.id];
    const ends = marker.fraction < 0.5 ? [route.a, route.b] : [route.b, route.a];
    for (const id of ends) if (candidates.includes(id)) return id;
  }
  return candidates.length > 0 ? candidates[0] : null;
};
// Jumps to the nearest place in the pressed direction (a straight line is preferred over a sideways one).
MapLayer.prototype.moveCursor = function (direction) {
  if (!this.cursor) return;
  const vector = DIRS[direction];
  const from = WORLD.nodes[this.cursor].cell;
  let best = null;
  let bestScore = Infinity;
  for (const id of worldCandidates(this.world)) {
    if (id === this.cursor) continue;
    const cell = WORLD.nodes[id].cell;
    const along = (cell[0] - from[0]) * vector[0] + (cell[1] - from[1]) * vector[1];
    const across = Math.abs((cell[0] - from[0]) * vector[1] - (cell[1] - from[1]) * vector[0]);
    if (along <= 0) continue;
    const score = along + 2 * across;
    if (score < bestScore) { best = id; bestScore = score; }
  }
  if (best) { this.cursor = best; this.refreshInfo(); Sound.sfx('move'); }
};
MapLayer.prototype.update = function () {
  this.frame++;
  if (Input.pressed.b && this.sheet) { this.sheet = false; this.refreshInfo(); Sound.sfx('back'); return; }
  // back, the open key and the menu input all close the map; the layer below (pause menu or overworld) gets control back
  if (Input.pressed.b || Input.pressed.map || Input.pressed.menu) { Sound.sfx('back'); closeLayer(this); return; }
  if (Input.pressed.a && this.cursor) { this.sheet = !this.sheet; this.refreshInfo(); Sound.sfx('confirm'); return; }
  if (this.sheet) return;
  for (const name of ['up', 'down', 'left', 'right']) if (Input.pressed[name]) this.moveCursor(name);
};
MapLayer.prototype.draw = function () {
  ctx.font = FONT;
  const won = this.won;
  const layout = this.titleLayout;
  ctx.fillStyle = COLOR.ink; ctx.fillRect(0, 0, SCREEN_W, MAP_TOP);
  drawText(layout.title, 4, 2, COLOR.paper);
  for (let i = 0; i < WORLD_BADGE_COUNT; i++) {
    ctx.fillStyle = i < won ? COLOR.gold : MAP_COLOR.pipEdge; ctx.fillRect(layout.pipsX + i * (MAP_PIP + 1), 2, MAP_PIP, MAP_PIP);
    ctx.fillStyle = i < won ? '#c88a1c' : MAP_COLOR.pipOff; ctx.fillRect(layout.pipsX + i * (MAP_PIP + 1) + 1, 3, MAP_PIP - 2, MAP_PIP - 2);
  }
  drawText(layout.count, layout.countX, 2, COLOR.paper);
  ctx.drawImage(this.base, 0, MAP_TOP);
  const still = OPT.reduceMotion; // Reduced motion: no bobbing and no blinking
  if (this.marker) {
    const centre = this.markerPixel;
    const bob = still ? 0 : Math.floor(this.frame / 30) % 2; // 1 px every 500 ms
    drawShapeOn(ctx, MAP_PIN, centre[0] - 2, centre[1] + MAP_TOP - 10 - bob, COLOR.red, COLOR.ink);
  }
  if (this.cursor && (still || Math.floor(this.frame / 16) % 2 === 0)) {
    const centre = this.cursorPixel;
    const left = centre[0] - 5;
    const top = centre[1] + MAP_TOP - 5;
    ctx.fillStyle = COLOR.gold;
    ctx.fillRect(left, top, 10, 1); ctx.fillRect(left, top + 9, 10, 1); ctx.fillRect(left, top, 1, 10); ctx.fillRect(left + 9, top, 1, 10);
  }
  ctx.fillStyle = COLOR.paper; ctx.fillRect(0, MAP_PANEL_TOP, SCREEN_W, SCREEN_H - MAP_PANEL_TOP);
  ctx.fillStyle = COLOR.ink; ctx.fillRect(0, MAP_PANEL_TOP, SCREEN_W, 1);
  if (!this.cursor) return;
  const lines = this.lines;
  for (let i = 0; i < lines.length; i++) drawText(lines[i], 4, MAP_PANEL_TOP + 2 + i * 9, i === 2 && !this.sheet ? COLOR.gray : COLOR.ink);
  if (this.sheet) { // the badge pip of the district at the right end of the first line
    const won = this.districtWon;
    ctx.fillStyle = won ? COLOR.gold : MAP_COLOR.pipEdge; ctx.fillRect(SCREEN_W - 4 - MAP_PIP, MAP_PANEL_TOP + 3, MAP_PIP, MAP_PIP);
    ctx.fillStyle = won ? '#c88a1c' : MAP_COLOR.pipOff; ctx.fillRect(SCREEN_W - 3 - MAP_PIP, MAP_PANEL_TOP + 4, MAP_PIP - 2, MAP_PIP - 2);
  }
};

// ---- Party ---------------------------------------------------------------------------------------------------------------------
// options: mode 'view' | 'choose' | 'switch'; activeIndex (cannot be chosen in switch mode); forced; canChoose(index) -> bool;
// titleKey (a strings key for the heading instead of the default one).
function PartyLayer(options) {
  const o = options || {};
  this.opaque = true;
  this.titleKey = o.titleKey || null;
  this.mode = o.mode || 'view';
  this.activeIndex = o.activeIndex === undefined ? -1 : o.activeIndex;
  this.forced = !!o.forced;
  this.canChoose = o.canChoose || null;
  this.cursor = o.start || 0;
  this.swapFrom = -1;
  if (this.mode === 'switch') { // start on the first creature that can actually go in
    const first = G.party.findIndex(function (mon, index) { return mon.hp > 0 && index !== o.activeIndex; });
    if (first >= 0) this.cursor = first;
  }
  this.refresh();
}
PartyLayer.prototype.refresh = function () {
  this.rows = G.party.map(function (mon) {
    return { name: speciesName(mon.sp), level: T('ui.lv') + mon.lv, hp: mon.hp + '/' + maxHp(mon), fraction: mon.hp / maxHp(mon), fainted: mon.hp <= 0 };
  });
  this.title = T(this.titleKey || (this.mode === 'switch' ? 'party.pickSwitch' : (this.mode === 'choose' ? 'party.pickTarget' : 'party.title')));
};
PartyLayer.prototype.update = function () {
  const count = G.party.length;
  if (Input.repeat.up) { this.cursor = (this.cursor + count - 1) % count; Sound.sfx('move'); }
  if (Input.repeat.down) { this.cursor = (this.cursor + 1) % count; Sound.sfx('move'); }
  if (Input.pressed.b) {
    if (this.swapFrom >= 0) { this.swapFrom = -1; Sound.sfx('back'); return; }
    if (this.forced) { Sound.sfx('error'); return; }
    Sound.sfx('back'); closeLayer(this, -1); return;
  }
  if (!Input.pressed.a) return;
  if (this.mode !== 'view') {
    const mon = G.party[this.cursor];
    const blocked = (this.mode === 'switch' && (mon.hp <= 0 || this.cursor === this.activeIndex)) || (this.canChoose && !this.canChoose(this.cursor));
    if (blocked) { Sound.sfx('error'); return; }
    Sound.sfx('confirm'); closeLayer(this, this.cursor); return;
  }
  Sound.sfx('confirm');
  this.runViewAction(this.cursor);
};
PartyLayer.prototype.runViewAction = async function (index) {
  if (this.swapFrom >= 0) {
    const from = this.swapFrom;
    this.swapFrom = -1;
    const held = G.party[from];
    G.party[from] = G.party[index];
    G.party[index] = held;
    this.refresh();
    return;
  }
  this.busy = true;
  const choice = await choose([T('party.summary'), T('party.move'), T('ui.cancel')], { x: 150, y: 40, w: 84 });
  if (choice === 0) await openLayer(new SummaryLayer(index));
  if (choice === 1 && G.party.length > 1) this.swapFrom = index;
  this.busy = false;
  this.refresh();
};

  for (let i = 0; i < this.rows.length; i++) {
    const row = this.rows[i];
    const y = 16 + i * 23;
    const selected = i === this.cursor;
    drawPanel(4, y, 232, 22);
    if (selected) { ctx.fillStyle = COLOR.gold; ctx.fillRect(4, y + 2, 3, 18); }
    if (i === this.swapFrom) { ctx.fillStyle = COLOR.red; ctx.fillRect(4, y + 2, 3, 18); }
    drawCreatureIcon(G.party[i].sp, 10, y + 3, 16);
    drawText(row.name, 30, y + 3, row.fainted ? COLOR.gray : COLOR.ink);
    drawText(row.level, 30, y + 12, COLOR.ink);
    drawBar(100, y + 9, 70, 4, row.fraction);

};

const ARCHIVE_ROWS = 6;
function ArchiveLayer(options) {
  this.opaque = true;
  this.mode = options && options.mode === 'withdraw' ? 'withdraw' : 'view';
  this.cursor = 0;
  this.top = 0;
  this.refresh();
}
ArchiveLayer.prototype.refresh = function () {
  this.rows = G.archive.map(function (mon) {
    return { name: speciesName(mon.sp), level: T('ui.lv') + mon.lv, hp: mon.hp + '/' + maxHp(mon), fraction: mon.hp / maxHp(mon), type: SPECIES[mon.sp].t };
  });
  this.title = T(this.mode === 'withdraw' ? 'arch.pickWithdraw' : 'arch.listTitle', { n: G.archive.length, max: ARCHIVE_MAX });
  this.position = (this.cursor + 1) + '/' + G.archive.length;
};
ArchiveLayer.prototype.moveCursor = function (target) {
  this.cursor = target;
  if (this.cursor < this.top) this.top = this.cursor;
  if (this.cursor >= this.top + ARCHIVE_ROWS) this.top = this.cursor - ARCHIVE_ROWS + 1;
  this.refresh();

};
ArchiveLayer.prototype.update = function () {
  const count = G.archive.length;
  if (Input.repeat.up) this.moveCursor((this.cursor + count - 1) % count);

  if (Input.pressed.left) this.moveCursor(Math.max(0, this.cursor - ARCHIVE_ROWS));
  if (Input.pressed.right) this.moveCursor(Math.min(count - 1, this.cursor + ARCHIVE_ROWS));
  if (Input.pressed.b) { Sound.sfx('back'); closeLayer(this, -1); return; }

    drawBar(100, y + 16, 70, 3, row.fraction);

  }
};

// ---- Battle screen ----------------------------------------------------------------------------------------
// The rules (createBattle, playTurn) produce events; this layer plays them back.
// Layout (decision recorded in REFERENCE section 1): a television debate, not a two-panel RPG screen.
//   - the two fighters stand on podiums that face each other at the same height (player left, foe right);
//   - a poll panel (the "δημοσκόπηση" bar, the creature's HP) hangs above each podium;
//   - the four commands are a row of tabs between the podiums and the bottom;
//   - every message runs in a news-ticker strip along the bottom edge.
const POLL_PANEL = { y: 3, w: 112, h: 30, leftX: 4, rightX: 124 };
const CREATURE_Y = 32;
const PODIUM = { y: 94, w: 88, h: 10, leftX: 14, rightX: 138 };
const COMMAND_ROW = { x: 4, y: 106, w: 232, h: 13, tabW: 58 };
const TICKER = { y: 121, h: 39, tagW: 44, textX: 50, textW: 184, lineHeight: 11 };
const NEWS_NAVY = '#10163a';
const TAB_BLUE = '#26346e';
const AUTO_ADVANCE_FRAMES = [80, 50, 24];
const ROOT_LABELS = ['battle.fight', 'battle.bag', 'battle.mizamon', 'battle.run'];
let envelopeSprite = null;
function getEnvelopeSprite() {

  p.line(0, 0, 8, 7, '#b8a97c'); p.line(15, 0, 8, 7, '#b8a97c'); p.ell(8, 7, 2, 2, '#c0392b');

}
// The mark of a boosted creature (a boss' creature with mon.boost, section 11.12): how far left of the panel's right text edge a small arrow is drawn, 0 = no mark.
// Measured once when the creature is sent out, never per frame.
function boostMarkOffset(mon, lvText) {
  if (!mon.boost) return 0;
  ctx.font = FONT;
  return Math.ceil(ctx.measureText(lvText).width) + BOOST_MARK_W + 3;
}
const BOOST_MARK_W = 5;
function drawBoostMark(x, y) {
  ctx.fillStyle = COLOR.red;
  ctx.fillRect(x + 2, y, 1, 1); ctx.fillRect(x + 1, y + 1, 3, 1); ctx.fillRect(x, y + 2, 5, 1);
}
function newBattleView() {
  return { sp: null, visible: false, name: '', lvText: '', boostMark: 0, hpText: '', shown: 0, target: 0, max: 1, lastShown: -1, status: null, dx: 0, dy: 0, alpha: 1, scale: 1, hidden: false };
}
function BattleLayer(battle, trainer, theme) {
  this.opaque = true;
  this.battle = battle;
  this.trainer = trainer;
  this.theme = theme;
  this.views = [newBattleView(), newBattleView()];
  this.mode = 'idle';
  this.box = new TextBox(TICKER.textW, 3);
  this.hold = 0;
  this.textResolve = null;
  this.fx = null;
  this.rootCursor = 0;
  this.moveCursor = 0;
  this.rootPrompt = [];
  this.moveInfo = '';
  this.trainerLook = trainer ? trainer.look : null;
  this.tick = 0;
  this.thrown = null;
}
BattleLayer.prototype.update = function () {
  this.tick++;
  this.box.update();
  for (const view of this.views) {
    if (view.shown < view.target) view.shown = Math.min(view.target, view.shown + Math.max(0.6, view.max / 45));
    else if (view.shown > view.target) view.shown = Math.max(view.target, view.shown - Math.max(0.6, view.max / 45));
    const whole = Math.round(view.shown);
    if (whole !== view.lastShown) { view.lastShown = whole; view.hpText = whole + '/' + view.max; }
  }
  if (this.fx) {
    this.fx.t++;
    this.applyFx();
    if (this.fx.t >= this.fx.dur) { const done = this.fx.resolve; this.finishFx(); if (done) done(); }
  }
  if (this.mode === 'text') this.updateText();
  else if (this.mode === 'root') this.updateRoot();
  else if (this.mode === 'moves') this.updateMoves();
};
BattleLayer.prototype.updateText = function () {
  if (this.box.isTyping()) { if (Input.pressed.a || Input.pressed.b) this.box.advance(); return; }
  this.hold++;
  if (Input.pressed.a || Input.pressed.b || this.hold > AUTO_ADVANCE_FRAMES[OPT.textSpeed]) {
    if (this.box.hasMorePages()) { this.box.advance(); this.hold = 0; return; }
    this.mode = 'idle';
    const resolve = this.textResolve;
    this.textResolve = null;
    if (resolve) resolve();
  }
};
BattleLayer.prototype.showText = function (text) {
  this.mode = 'text';
  this.hold = 0;
  this.box.setText(text);
  const layer = this;
  return new Promise(function (resolve) { layer.textResolve = resolve; });
};
// ---- effects (short animations that finish before the next event is played) ----
BattleLayer.prototype.startFx = function (kind, side, duration) {
  const layer = this;
  if (OPT.reduceMotion && (kind === 'attack' || kind === 'hit')) duration = Math.min(duration, 6);
  if (OPT.reduceMotion && kind === 'faint') duration = 1; // the creature just disappears
  return new Promise(function (resolve) { layer.fx = { kind: kind, side: side, t: 0, dur: Math.max(1, duration), resolve: resolve }; });
};
BattleLayer.prototype.applyFx = function () {
  const fx = this.fx;
  const view = this.views[fx.side];
  const progress = fx.t / fx.dur;
  if (fx.kind === 'attack') view.dx = OPT.reduceMotion ? 0 : Math.sin(progress * Math.PI) * 12 * (fx.side === 0 ? 1 : -1);
  else if (fx.kind === 'hit') {
    view.dx = OPT.reduceMotion ? 0 : ((fx.t >> 1) % 2 === 0 ? 3 : -3);
    view.alpha = OPT.reduceMotion ? 1 : ((fx.t >> 1) % 2 === 0 ? 0.4 : 1);
  } else if (fx.kind === 'faint') {
    view.dy = OPT.reduceMotion ? 0 : progress * 36;
    view.alpha = OPT.reduceMotion ? 1 : 1 - progress;
  }
  else if (fx.kind === 'enter') { view.alpha = progress; view.dx = (1 - progress) * (fx.side === 0 ? -30 : 30); }
};
BattleLayer.prototype.finishFx = function () {
  const fx = this.fx;
  const view = this.views[fx.side];
  if (fx.kind === 'faint') { view.visible = false; view.alpha = 1; view.dy = 0; }
  else { view.dx = 0; view.dy = 0; view.alpha = 1; }
  this.fx = null;
};
BattleLayer.prototype.waitUntil = async function (condition, maxFrames) {
  for (let i = 0; i < maxFrames && !condition(); i++) await nextFrame();
};
// ---- menus ----
BattleLayer.prototype.updateRoot = function () {
  // The four tabs sit in one row: left/up goes to the previous tab, right/down to the next (wrapping).
  const step = (Input.pressed.right || Input.pressed.down ? 1 : 0) - (Input.pressed.left || Input.pressed.up ? 1 : 0);
  if (step !== 0) { this.rootCursor = (this.rootCursor + step + ROOT_LABELS.length) % ROOT_LABELS.length; Sound.sfx('move'); }
  if (Input.pressed.a) { Sound.sfx('confirm'); const resolve = this.menuResolve; this.mode = 'idle'; this.menuResolve = null; resolve(this.rootCursor); }
};
BattleLayer.prototype.updateMoves = function () {
  const mon = activeMon(this.battle, 0);
  const count = mon.moves.length;
  let cursor = this.moveCursor; // the moves are a vertical list in the ticker strip
  if (Input.pressed.up && cursor > 0) cursor--;
  if (Input.pressed.down && cursor + 1 < count) cursor++;
  if (cursor !== this.moveCursor) { this.moveCursor = cursor; Sound.sfx('move'); this.refreshMoveInfo(); }
  if (Input.pressed.a || Input.pressed.b) {
    const resolve = this.menuResolve;
    this.mode = 'idle';
    this.menuResolve = null;
    if (Input.pressed.a) { Sound.sfx('confirm'); resolve(mon.moves[this.moveCursor]); } else { Sound.sfx('back'); resolve(null); }
  }
};
BattleLayer.prototype.refreshMoveInfo = function () {
  const moveId = activeMon(this.battle, 0).moves[this.moveCursor];
  this.moveInfo = moveInfoLine(moveId);
  this.moveType = MOVES[moveId].t;
};
BattleLayer.prototype.askRoot = function () {
  const layer = this;
  const mon = activeMon(this.battle, 0);
  this.rootPrompt = wrapText(T('battle.prompt', { name: speciesName(mon.sp) }), TICKER.textW);
  this.mode = 'root';
  return new Promise(function (resolve) { layer.menuResolve = resolve; });
};
BattleLayer.prototype.askMove = function () {
  const layer = this;
  this.moveCursor = 0;
  this.refreshMoveInfo();
  this.mode = 'moves';
  return new Promise(function (resolve) { layer.menuResolve = resolve; });
};
// ---- the main loop ----
BattleLayer.prototype.askAction = async function () {
  const battle = this.battle;
  for (;;) {
    const choice = await this.askRoot();
    const mon = activeMon(battle, 0);
    if (choice === 0) {
      const moveId = await this.askMove();
      if (moveId) return { t: 'move', id: moveId };
    } else if (choice === 1) {
      const itemId = await openLayer(new BagLayer({ battle: true }));
      if (!itemId) continue;
      if (ITEMS[itemId].kind === 'recruit') return { t: 'recruit', id: itemId };
      const target = await openLayer(new PartyLayer({ mode: 'choose', canChoose: function (index) { return canUseItemOn(G.party[index], itemId); } }));
      if (target >= 0) return { t: 'item', id: itemId, target: target };
    } else if (choice === 2) {
      if (mon.bt.trap > 0) { await this.showText(T('b.trapped', { mon: speciesName(mon.sp) })); continue; }
      const index = await openLayer(new PartyLayer({ mode: 'switch', activeIndex: battle.sides[0].active }));
      if (index >= 0) return { t: 'switch', idx: index };
    } else {
      if (battle.kind !== 'wild') { await this.showText(T('b.run.trainer')); continue; }
      return { t: 'run' };
    }
  }
};
BattleLayer.prototype.run = async function () {
  const battle = this.battle;
  await this.playEvents(battle.events);
  while (!battle.over) {
    if (battle.phase === 'forced') {
      const index = await openLayer(new PartyLayer({ mode: 'switch', forced: true, activeIndex: -1 }));
      await this.playEvents(playForcedSwitch(battle, index));
      continue;
    }
    const action = await this.askAction();
    await this.playEvents(playTurn(battle, action));
  }

};
BattleLayer.prototype.finish = async function () {
  const battle = this.battle;
  let result = 'win';
  if (battle.ran) result = 'ran';
  else if (battle.winner === 1) result = 'lose';
  if (result === 'win') {
    if (battle.kind === 'trainer') {
      const prize = prizeFor(battle, this.trainer);
      G.money += prize;
      await this.showText(T('b.prize', { n: prize }));
    }
    if (battle.moneyDelta !== 0) {
      G.money = Math.max(0, G.money + battle.moneyDelta);
      await this.showText(T(battle.moneyDelta > 0 ? 'b.moneyGain' : 'b.moneyLoss', { n: Math.abs(battle.moneyDelta) }));
    }

};
BattleLayer.prototype.playEvents = async function (events) {

    else if (ev.k === 'seen') G.dex.seen[ev.sp] = true;
    else if (ev.k === 'recruited') { G.dex.seen[ev.sp] = true; G.dex.got[ev.sp] = true; }
    else if (ev.k === 'send') {
      view.sp = ev.sp; view.name = speciesName(ev.sp); view.max = ev.max; view.shown = ev.hp; view.target = ev.hp; view.lastShown = -1;
      view.status = ev.status; view.visible = true; view.hidden = false; view.lvText = T('ui.lv') + battle.sides[ev.side].party[battle.sides[ev.side].active].lv;
      view.boostMark = boostMarkOffset(battle.sides[ev.side].party[battle.sides[ev.side].active], view.lvText);
      if (ev.side === 1) this.trainerLook = null;
      await this.startFx('enter', ev.side, OPT.reduceMotion ? 1 : 16);
    } else if (ev.k === 'hp') {
      view.max = ev.max; view.target = ev.hp; view.lastShown = -1;
      await this.waitUntil(function () { return view.shown === view.target; }, 100);
    } else if (ev.k === 'status') view.status = ev.status;
    else if (ev.k === 'anim') {
      if (ev.kind === 'attack') { Sound.sfx('attack'); await this.startFx('attack', ev.side, 14); }
      else {
        Sound.sfx(ev.eff > 1 ? 'super' : (ev.eff < 1 ? 'weak' : 'hit'));
        await this.startFx('hit', ev.side, 16);
      }
    } else if (ev.k === 'faint') { Sound.sfx('faint'); await this.startFx('faint', ev.side, 30); }
    else if (ev.k === 'xp') await this.showText(T('b.xp', { mon: speciesName(G.party[ev.idx].sp), n: ev.amount }));
    else if (ev.k === 'lvl') {
      const mon = G.party[ev.idx];
      Sound.sfx('levelup');
      if (ev.active) { const mine = this.views[0]; mine.lvText = T('ui.lv') + ev.lv; mine.max = ev.max; mine.target = ev.hp; mine.lastShown = -1; }
      await this.showText(T('b.lvl', { mon: speciesName(mon.sp), n: ev.lv }));
    } else if (ev.k === 'learned') await this.showText(T('b.learned', { mon: speciesName(G.party[ev.idx].sp), move: MOVES[ev.move].n }));
    else if (ev.k === 'learnPrompt') {
      const mon = G.party[ev.idx];
      mon.pend = mon.pend.filter(function (id) { return id !== ev.move; });
      await offerLearnMove(mon, ev.move);
    } else if (ev.k === 'recruit') await this.playRecruit(ev);
  }
};
BattleLayer.prototype.playRecruit = async function (ev) {
  const foeView = this.views[1];
  this.thrown = { t: 0, x: 0, y: 0, wobble: 0 };
  Sound.sfx('throw');
  for (let t = 0; t <= 24; t++) { this.thrown.t = t / 24; await nextFrame(); }
  foeView.hidden = true;
  for (let i = 0; i < ev.shakes; i++) {
    Sound.sfx('shake');
    for (let t = 0; t < 22; t++) { this.thrown.wobble = OPT.reduceMotion ? 0 : Math.sin(t / 22 * Math.PI * 4) * 3; await nextFrame(); }
    this.thrown.wobble = 0;
    await waitFrames(8);
  }
  if (ev.ok) Sound.sfx('recruit');
  else { foeView.hidden = false; Sound.sfx('error'); }
  this.thrown = null;
  if (ev.ok) { foeView.visible = false; await waitFrames(20); }
};
// ---- drawing ----
const battleSkyCache = {}; // one gradient per theme, made on first use (not every frame)
const BATTLE_THEMES = {
  studio: { top: '#3a1a5a', bottom: '#7a3a8a', ground: '#4a2a5a', edge: '#5a3a6a' },

  grass: { top: '#8ec8f0', bottom: '#dff3d8', ground: '#6cba58', edge: '#8ad070' },

BattleLayer.prototype.drawBackground = function () {
  const colors = BATTLE_THEMES[this.theme] || BATTLE_THEMES.grass;
  if (!battleSkyCache[this.theme]) {
    const sky = ctx.createLinearGradient(0, 0, 0, 112);
    sky.addColorStop(0, colors.top);
    sky.addColorStop(1, colors.bottom);
    battleSkyCache[this.theme] = sky;
  }
  ctx.fillStyle = battleSkyCache[this.theme]; ctx.fillRect(0, 0, SCREEN_W, 112);
  ctx.fillStyle = colors.ground; ctx.fillRect(0, 70, SCREEN_W, 90);
  ctx.fillStyle = colors.edge; ctx.fillRect(0, 70, SCREEN_W, 2);
  if (this.theme === 'studio') { ctx.fillStyle = '#d8452f'; for (let x = 0; x < SCREEN_W; x += 40) ctx.fillRect(x, 0, 6, 70); }
};
// A wooden podium; x is its left edge.
function drawPodium(x) {
  ctx.fillStyle = COLOR.border; ctx.fillRect(x - 1, PODIUM.y - 1, PODIUM.w + 2, PODIUM.h + 2);

BattleLayer.prototype.drawView = function (view, x, y, flip) {

// The poll panel above a podium: name, level, the poll bar (HP) and, for the player's side, the numbers.
BattleLayer.prototype.drawPollPanel = function (view, x, showHp) {

// The four command tabs. They are dimmed while a message plays, bright when the player chooses.
BattleLayer.prototype.drawCommandRow = function () {

    drawText(T(ROOT_LABELS[i]), x + (COMMAND_ROW.tabW - 2) / 2, COMMAND_ROW.y + 3, selected ? COLOR.ink : COLOR.white, 'center');
