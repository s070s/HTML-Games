<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1c">
<title>Mizamon</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0e1c; overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; font-family: "Segoe UI", Verdana, sans-serif; }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #screen { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  /* Large text (Options, Accessibility): the text being read in big letters under the picture. Size and font are set by the script. */
  #caption { display: none; flex: none; box-sizing: border-box; margin: 0; padding: 4px 10px; overflow: hidden; background: #0b0e1c; color: #ffffff;
    border-top: 2px solid #f4b942; font-weight: 700; line-height: 1.25; text-align: left; overflow-wrap: anywhere; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; pointer-events: none; }
  #touch .btn { position: absolute; display: flex; align-items: center; justify-content: center; box-sizing: border-box; pointer-events: auto;
    touch-action: none; color: #f6efdc; font-weight: 700; background: rgba(40, 48, 90, 0.72); border: 2px solid rgba(246, 239, 220, 0.55);
    border-radius: 12px; -webkit-tap-highlight-color: transparent; }
  #touch .btn.on { background: rgba(244, 185, 66, 0.85); color: #1b1b2f; }
  #touch.portrait .btn { width: 66px; height: 66px; font-size: 24px; }
  #touch.landscape .btn { width: 50px; height: 50px; font-size: 18px; opacity: 0.85; }
  #touch.portrait [data-btn="up"] { left: 80px; bottom: 150px; }
  #touch.portrait [data-btn="down"] { left: 80px; bottom: 14px; }
  #touch.portrait [data-btn="left"] { left: 12px; bottom: 82px; }
  #touch.portrait [data-btn="right"] { left: 148px; bottom: 82px; }
  #touch.portrait [data-btn="a"] { right: 16px; bottom: 90px; width: 80px; height: 80px; border-radius: 50%; font-size: 30px; }
  #touch.portrait [data-btn="b"] { right: 104px; bottom: 26px; width: 66px; height: 66px; border-radius: 50%; }
  #touch.portrait [data-btn="menu"] { right: 16px; bottom: 14px; width: 76px; height: 38px; font-size: 14px; border-radius: 19px; }
  #touch.portrait [data-btn="map"] { right: 18px; bottom: 180px; width: 76px; height: 34px; font-size: 12px; border-radius: 17px; }
  /* Phones narrower than 384 px: smaller buttons, so that the d-pad, B and A do not cross each other (the full size needs 384 px). */
  @media (max-width: 383px) {
    #touch.portrait .btn { width: 52px; height: 52px; font-size: 22px; }
    #touch.portrait [data-btn="up"] { left: 62px; bottom: 132px; }
    #touch.portrait [data-btn="down"] { left: 62px; bottom: 14px; }
    #touch.portrait [data-btn="left"] { left: 6px; bottom: 73px; }
    #touch.portrait [data-btn="right"] { left: 118px; bottom: 73px; }
    #touch.portrait [data-btn="a"] { right: 8px; bottom: 90px; width: 70px; height: 70px; font-size: 26px; }
    #touch.portrait [data-btn="b"] { right: 92px; bottom: 26px; width: 54px; height: 54px; }
    #touch.portrait [data-btn="menu"] { right: 8px; bottom: 14px; width: 76px; height: 38px; font-size: 14px; }
    #touch.portrait [data-btn="map"] { right: 8px; bottom: 170px; width: 76px; height: 34px; font-size: 12px; }
  }
  #touch.landscape [data-btn="up"] { left: 54px; bottom: 112px; }
  #touch.landscape [data-btn="down"] { left: 54px; bottom: 10px; }
  #touch.landscape [data-btn="left"] { left: 6px; bottom: 61px; }
  #touch.landscape [data-btn="right"] { left: 102px; bottom: 61px; }
  #touch.landscape [data-btn="a"] { right: 10px; bottom: 70px; width: 62px; height: 62px; border-radius: 50%; font-size: 22px; }
  #touch.landscape [data-btn="b"] { right: 78px; bottom: 20px; width: 52px; height: 52px; border-radius: 50%; }
  #touch.landscape [data-btn="menu"] { right: 10px; top: 10px; bottom: auto; width: 62px; height: 32px; font-size: 12px; border-radius: 16px; }
  #touch.landscape [data-btn="map"] { right: 10px; top: 50px; bottom: auto; width: 62px; height: 30px; font-size: 10px; border-radius: 15px; }
  /* One drawn arrow for the four d-pad buttons (no font glyph, so no phone turns it into an emoji): a triangle pointing up, turned by the button. */
  #touch .arrow { display: block; width: 1.1em; height: 1.1em; background: currentColor; clip-path: polygon(50% 15%, 85% 75%, 15% 75%); pointer-events: none; }
  #touch [data-btn="down"] .arrow { transform: rotate(180deg); }
  #touch [data-btn="left"] .arrow { transform: rotate(270deg); }
  #touch [data-btn="right"] .arrow { transform: rotate(90deg); }
  noscript { position: fixed; inset: 0; color: #f6efdc; padding: 24px; font-size: 18px; }
</style>
</head>
<body>
<div id="stage"><canvas id="screen" width="240" height="160" aria-label="Mizamon"></canvas><div id="caption" role="status" aria-live="polite"></div></div>
<div id="touch" aria-hidden="true">
  <div class="btn" data-btn="up"><span class="arrow"></span></div>
  <div class="btn" data-btn="down"><span class="arrow"></span></div>
  <div class="btn" data-btn="left"><span class="arrow"></span></div>
  <div class="btn" data-btn="right"><span class="arrow"></span></div>
  <div class="btn" data-btn="b">B</div>
  <div class="btn" data-btn="a">A</div>
  <div class="btn" data-btn="menu">MENU</div>
  <div class="btn" data-btn="map">ΧΑΡΤΗΣ</div>
</div>
<noscript>Mizamon needs JavaScript. / Το Mizamon χρειάζεται JavaScript.</noscript>
<script>
'use strict';
// RULES-BEGIN
/*@@DATA@@*/
/*@@RULES@@*/

/*@@ENGINE@@*/

</script>
</body>
</html>
