/* =====================================================================
   09c SELF-TEST + BOOT - headless acceptance checks (Menu > About > Run self-test) and startup.
   ===================================================================== */
const SelfTest = {
  scripted(fn) { return ScriptedController.make(fn); },
  make(opts, s1, s2) {
    const m = new MatchSim(Object.assign({ mode: 'free', countdown: false, timer: 0, seed: 11, winsNeeded: 2 }, opts));
    m.controllers[0] = this.scripted(s1 || (() => {}));
    m.controllers[1] = this.scripted(s2 || (() => {}));
    return m;
  },
  place(m, gap, x0) {
    const a = m.fighters[0], b = m.fighters[1], c = x0 === undefined ? 0 : x0;
    a.x = c - gap / 2; b.x = c + gap / 2; a.z = b.z = 0;
    a.prevX = a.x; b.prevX = b.x; a.prevZ = b.prevZ = 0;
  },
  run(m, n) { for (let i = 0; i < n; i++) m.step(); },
  capture(names) {
    const log = {};
    const offs = names.map((n) => { log[n] = []; return Events.on(n, (e) => log[n].push(e)); });
    log.stop = () => offs.forEach((off) => off());
    return log;
  },

  run_all() {
    const results = [];
    const self = this;
    const test = (name, fn) => {
      let m = null;
      try { const r = fn(); results.push({ name, pass: r === true, detail: r === true ? '' : String(r) }); } catch (e) { results.push({ name, pass: false, detail: 'exception: ' + e.message }); }
      if (Match.current) Match.current.dispose();
      void m;
    };
    const mk = (...a) => self.make(...a);
    const once = (tick, key, extra) => (it, f, o, m) => { if (m.tick === tick) { it[key] = true; if (extra) Object.assign(it, extra); } };

    test('Deterministic simulation (same seed, same result)', () => {
      const play = () => {
        const m = mk({ seed: 5, difficulty: 'hard' }, (it, f, o, mm) => { if (mm.tick % 40 === 3) it.lp = true; if (mm.tick % 90 === 20) it.rk = true; it.fwd = mm.tick % 120 < 60 ? 1 : -0.5; });
        m.controllers[1] = new AIController(ROSTER_BY_ID.mara, 'hard');
        self.run(m, 500);
        const r = [m.fighters[0].hp, m.fighters[1].hp, m.fighters[0].x, m.fighters[1].z].join('|');
        m.dispose();
        return r;
      };
      const a = play(), b = play();
      return a === b ? true : a + ' != ' + b;
    });
    test('Jab connects once and deals damage', () => {
      const log = self.capture(['hit']);
      const m = mk({}, once(2, 'lp')); self.place(m, 1.2); self.run(m, 60); log.stop();
      const d = m.fighters[1].maxHp - m.fighters[1].hp;
      return log.hit.length === 1 && d >= 2 && d <= 8 ? true : 'hits ' + log.hit.length + ' dmg ' + d;
    });
    test('Attack out of range whiffs', () => {
      const log = self.capture(['hit', 'block']);
      const m = mk({}, once(2, 'lp')); self.place(m, 3.2); self.run(m, 60); log.stop();
      return log.hit.length === 0 && log.block.length === 0 ? true : 'unexpected contact';
    });
    test('Four core buttons map to jab / cross / front kick / roundhouse', () => {
      const want = { lp: 'jab', rp: 'cross', lk: 'front_kick', rk: 'roundhouse' };
      for (const k in want) {
        const m = mk({}, once(2, k)); self.place(m, 3); self.run(m, 3);
        const id = m.fighters[0].move ? m.fighters[0].move.id : 'none';
        m.dispose();
        if (id !== want[k]) return k + ' -> ' + id;
      }
      return true;
    });
    test('Strong / height modifiers select the right variant and never fire alone', () => {
      const want = [['rk', { strong: true }, 'heavy_roundhouse'], ['lk', { height: true }, 'low_kick'], ['lk', { strong: true, height: true }, 'sweep'], ['rp', { height: true }, 'uppercut'], ['lp', { strong: true }, 'power_jab']];
      for (const [k, mods, id] of want) {
        const m = mk({}, (it, f, o, mm) => { if (mm.tick >= 2) Object.assign(it, mods); if (mm.tick === 2) it[k] = true; }); self.place(m, 3); self.run(m, 3);
        const got = m.fighters[0].move ? m.fighters[0].move.id : 'none';
        m.dispose();
        if (got !== id) return k + '+' + JSON.stringify(mods) + ' -> ' + got;
      }
      const m = mk({}, (it) => { it.strong = true; it.height = true; }); self.place(m, 3); self.run(m, 40);
      return m.fighters[0].state === S.IDLE && !m.fighters[0].move ? true : 'modifier alone started ' + m.fighters[0].state;
    });
    test('Strong attacks cost more stamina and have longer recovery', () => {
      const l = ATTACKS.jab, h = ATTACKS.heavy_roundhouse;
      const m = mk({}, once(2, 'rk', { strong: true })); self.place(m, 3); self.run(m, 3);
      const spent = m.fighters[0].maxStam - m.fighters[0].stam;
      return h.stam > l.stam && h.recovery > l.recovery && spent >= h.stam - 1 ? true : 'spent ' + spent;
    });
    test('High block stops high + mid, low block stops low, mids beat low block', () => {
      const trial = (k, mods, block) => {
        const log = self.capture(['hit', 'block']);
        const m = mk({}, (it, f, o, mm) => { if (mm.tick === 2) { it[k] = true; } if (mm.tick >= 1) Object.assign(it, mods); }, (it, f, o, mm) => { if (mm.tick >= 1) it[block] = true; });
        self.place(m, 1.2); self.run(m, 50); log.stop(); m.dispose();
        return { hit: log.hit.length, block: log.block.length };
      };
      const a = trial('lp', {}, 'blockH'), b = trial('lk', { height: true }, 'blockL'), c = trial('lk', {}, 'blockL'), d = trial('lk', { height: true }, 'blockH');
      return a.block === 1 && a.hit === 0 && b.block === 1 && c.hit === 1 && d.hit === 1 ? true : JSON.stringify([a, b, c, d]);
    });
    test('Crouching avoids a high attack', () => {
      const log = self.capture(['hit']);
      const m = mk({}, once(2, 'lp'), (it) => { it.crouch = true; }); self.place(m, 1.2); self.run(m, 50); log.stop();
      return log.hit.length === 0 ? true : 'jab hit a crouching fighter';
    });
    test('Perfect block window, guard pressure and guard break', () => {
      let log = self.capture(['block']);
      let m = mk({}, once(2, 'lp'), (it, f, o, mm) => { if (mm.tick >= 5) it.blockH = true; }); self.place(m, 1.2); self.run(m, 40); log.stop();
      const perfect = log.block.length === 1 && log.block[0].perfect;
      m.dispose();
      log = self.capture(['block']);
      m = mk({}, once(2, 'lp', { strong: true }), (it) => { it.blockH = true; }); self.place(m, 1.2); m.fighters[1].stam = 4; self.run(m, 60); log.stop();
      const broke = log.block.some((b) => b.broke) && m.fighters[1].state === S.STUN;
      return perfect && broke ? true : 'perfect ' + perfect + ' broke ' + broke;
    });
    test('Perfect block opens one counter, the next press is a normal move', () => {
      const log = self.capture(['attackStart']);
      let first = 0, second = false;
      const m = mk({}, once(2, 'lp'), (it, f, o, mm) => {
        if (!first && f.counterWindow > 0) { it.lp = true; first = mm.tick; } else if (first && !second && mm.tick >= first + 30) { it.lp = true; second = true; } else if (!first && mm.tick >= 5) it.blockH = true;
      });
      self.place(m, 1.2); self.run(m, 90); log.stop();
      const moves = log.attackStart.filter((e) => e.f.index === 1).map((e) => e.mv.id).join();
      return moves === 'counter_strike,jab' ? true : 'moves ' + moves;
    });
    test('Mashing block never gives a perfect block', () => {
      const log = self.capture(['block']);
      const m = mk({}, once(40, 'lp'), (it, f, o, mm) => { it.blockH = mm.tick % 8 !== 0; });
      self.place(m, 1.2); self.run(m, 80); log.stop();
      return log.block.length === 1 && !log.block[0].perfect ? true : 'blocks ' + log.block.length + ' perfect ' + log.block.some((b) => b.perfect);
    });
    test('Combo chain: legal transitions, scaling, count', () => {
      const log = self.capture(['hit']);
      const m = mk({}, (it, f, o, mm) => { if (mm.tick === 2) it.lp = true; if (mm.tick >= 10 && mm.tick <= 16) it.rp = true; }); self.place(m, 1.1); self.run(m, 90); log.stop();
      const ok = log.hit.length === 2 && log.hit[1].combo === 2;

      const assigned = ROSTER.every((r) => MOVE_STYLE[r.moveStyle]) && new Set(ROSTER.map((r) => r.moveStyle)).size === ROSTER.length;
      return same.length === 0 && assigned ? true : 'too similar: ' + same.join(', ') + ' roster styles ok ' + assigned;
    });
    test('Motion: individuality is seeded and stable, never shared by two fighters', () => {
      const a1 = new Fighter(ROSTER_BY_ID.kai, 0).motion, a2 = new Fighter(ROSTER_BY_ID.kai, 1).motion;
      const twin = new Fighter(Object.assign({}, ROSTER_BY_ID.kai, { id: 'kai2' }), 0).motion;
      const stable = a1.phase === a2.phase && a1.bounce === a2.bounce && a1.guard[0].every((v, i) => v === a2.guard[0][i]);
      const distinct = a1.phase !== twin.phase && a1.bounce !== twin.bounce;
      return stable && distinct ? true : 'stable ' + stable + ' distinct ' + distinct;
    });
    test('Motion: movement style saves, shares, and old codes without it still import', () => {
      const c = validateCustom(randomCustom(4321)).value;
      c.moveStyle = 'judoka';
      const back = decodeCustom(encodeCustom(c), true);
      const fields = JSON.parse(fromBase64Url(encodeCustom(c).split('-')[1]));
      fields.pop();                                                 // an older code: no movement style field
      const payload = toBase64Url(JSON.stringify(fields));
      const old = decodeCustom(SHARE_PREFIX + '-' + payload + '-' + shareChecksum(payload), true);
      const stored = validateCustom(Object.assign({}, c, { moveStyle: undefined }));
      const bad = validateCustom(Object.assign({}, c, { moveStyle: 'ninja' }));
      const profile = customProfile(back.value, 0);
      const ok = back.ok && back.value.moveStyle === 'judoka' && old.ok && old.value.moveStyle === ARCHETYPE_MOVE_STYLE[c.arch] &&
        stored.ok && stored.value.moveStyle === ARCHETYPE_MOVE_STYLE[c.arch] && !bad.ok && new Fighter(profile, 0).motion.styleId === 'judoka';
      return ok ? true : 'round trip ' + (back.value && back.value.moveStyle) + ' old ' + old.ok + ' ' + (old.value && old.value.moveStyle) + ' stored ' + stored.ok + ' bad rejected ' + !bad.ok;
    });
    test('Motion: kicks land in front of the body at the reference heights', () => {
      const problems = [];
      for (const r of ROSTER) {
        const footAt = (mvId) => {
          const f = new Fighter(r, 0), mv = ATTACKS[mvId];
          f.state = S.ATTACK; f.move = mv; f.mStartup = mv.startup; f.mActive = mv.active; f.mRecovery = mv.recovery; f.moveTick = mv.startup + 1;
          f.computePose(); f.skeleton(0, 0, 0, 0, false);
          const foot = mv.limb === 'LL' ? 5 : 6;
          return { fwd: f.pts[foot * 3 + 2], up: f.pts[foot * 3 + 1] };
        };
        const round = footAt('roundhouse'), front = footAt('front_kick'), low = footAt('low_kick');
        if (round.fwd < 0.6 || front.fwd < 0.6 || low.fwd < 0.5) problems.push(r.id + ' foot behind: ' + [round.fwd, front.fwd, low.fwd].map((v) => v.toFixed(2)).join('/'));
        if (!(round.up > low.up + 0.25 && front.up > low.up + 0.25)) problems.push(r.id + ' heights ' + [round.up, front.up, low.up].map((v) => v.toFixed(2)).join('/'));
      }
      return problems.length ? problems.join('; ') : true;
    });
    return results;
  },
};

UI.runSelfTest = function runSelfTest() {
  const out = $('selftestOut');
  if (Game.state !== GS.MENU || Game.match) { if (out) out.textContent = 'Self-test is available from the main menu only.'; return; }
  const t0 = performance.now();
  const illegalBefore = Diag.illegalTransitions;
  const res = SelfTest.run_all();
  Diag.illegalTransitions = illegalBefore;
  Showcase.arenaId = null;
  this.menuScene('warehouse', 'kai', 'mara', false);
  simRng = makeRng((Date.now() & 0xffff) + 1);
  const pass = res.filter((r) => r.pass).length;
  const text = 'Self-test: ' + pass + ' / ' + res.length + ' passed in ' + Math.round(performance.now() - t0) + ' ms\n' + res.map((r) => (r.pass ? '[pass] ' : '[FAIL] ') + r.name + (r.detail ? '  -> ' + r.detail : '')).join('\n');
  if (out) out.textContent = text;
  Diag.log(pass === res.length ? 'info' : 'warn', 'Self-test ' + pass + '/' + res.length);
  return res;
};

/* ---------- boot ---------- */
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
function checkFeatures() {
  const missing = [];
  if (typeof requestAnimationFrame !== 'function') missing.push('requestAnimationFrame');
  if (typeof Float32Array === 'undefined') missing.push('typed arrays');
  if (typeof Promise === 'undefined') missing.push('Promise');
  if (missing.length) throw new Error('Your browser is missing: ' + missing.join(', '));
}
function installGlobalHandlers() {
  window.addEventListener('error', (e) => { Diag.log('error', 'Uncaught: ' + e.message); });
  window.addEventListener('unhandledrejection', (e) => { Diag.log('error', 'Unhandled promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
  let resizeQueued = false;
  // Quality.apply recomputes the pixel budget for the new size and resizes the canvas.
  const queueResize = () => { if (resizeQueued) return; resizeQueued = true; requestAnimationFrame(() => { resizeQueued = false; Quality.apply(); }); };
  window.addEventListener('resize', queueResize);
  window.addEventListener('orientationchange', () => setTimeout(queueResize, 150));
  document.addEventListener('fullscreenchange', queueResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Game.pause(); Sound.suspend(); } else Sound.resumeIfAllowed();
  });
  window.addEventListener('blur', () => { Game.pause(); });
  Events.on('settings', () => { Sound.applyVolumes(); });
  Events.on('frame', () => Music.update());
}

async function boot() {
  const t0 = performance.now();
  const root = $('screens');
  root.innerHTML = '<section class="screen on center"><div class="panel"><h1 class="logo">BREAKPOINT</h1><p class="sub" id="loadMsg">Starting...</p><div style="height:.5em;background:#1b2a4d"><div id="loadBar" style="height:100%;width:0;background:var(--a1)"></div></div></div></section>';
  const status = (msg, frac) => { const m = $('loadMsg'), b = $('loadBar'); if (m) m.textContent = msg; if (b) b.style.width = Math.round(frac * 100) + '%'; };
  try {
    status('Checking browser features...', 0.05); await nextFrame();
    checkFeatures();
    status('Loading settings...', 0.2); await nextFrame();
    Store.init(); Settings.init(); Keymap.init(); Progress.init(); CustomRoster.init();
    status('Creating renderer...', 0.4); await nextFrame();
    if (!R.init($('view'))) { UI.dom.fatal = $('fatal'); fatalStartup(R.error + ' BREAKPOINT needs WebGL 2 (current Chrome, Edge, Firefox or Safari 15+) with hardware acceleration enabled.'); return; }
    R.resize(); Quality.apply();
    status('Preparing effects and physics pools...', 0.6); await nextFrame();
    Debris.init(); FX.init();
    status('Initialising input and audio...', 0.8); await nextFrame();
    Input.init(); Sound.wire(); Effects.init(); UI.init(); installGlobalHandlers();
    status('Ready', 1); await nextFrame();
    Showcase.set('warehouse', 'kai', 'mara', false);
    Diag.startupMs = performance.now() - t0;
    Game.go(GS.MENU);
    Game.start();
    Diag.log('info', 'Started in ' + Math.round(Diag.startupMs) + ' ms');
  } catch (e) {
    Diag.log('error', 'Startup failed: ' + (e && e.stack ? e.stack : e));
    fatalStartup('Startup failed: ' + (e && e.message ? e.message : e));
  }
}
function fatalStartup(msg) {
  const f = $('fatal');
  f.hidden = false;
  f.innerHTML = '<div class="panel"><h2>BREAKPOINT cannot start</h2><p></p><p class="hint">No data was changed. Reload the page after fixing the issue.</p></div>';
  f.querySelector('p').textContent = msg;
  $('screens').innerHTML = '';
}

window.BREAKPOINT = { version: VERSION, selfTest: () => UI.runSelfTest(), diagnostics: () => ({ state: Game.state, fps: 1000 / Math.max(1, Diag.frameMs), errors: Diag.errors, logs: Diag.logs.slice(-20), illegalTransitions: Diag.illegalTransitions }) };
boot();

})();
