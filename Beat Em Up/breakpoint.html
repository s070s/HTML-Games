    const pivot = kick ? (roundKick ? m.kickPivot : m.kickPivot * 0.3) : (mv.limb[0] === 'R' ? m.punchPivot : 0);
    const side = mv.limb[0] === 'L' ? 1 : -1;
    pose[J.bodyYaw] = g[J.bodyYaw] - side * pivot * Math.max(0, ext);
  }

  /* Walk the joint hierarchy; optionally queue draw calls. Also records key points in this.pts. */
  skeleton(px, py, pz, yaw, draw) {
    DRAW_NOW = draw;
    const p = this.pose, col = this.col, sc = this.scale, b = this.build, pts = this.pts;
    M4.identity(FBASE);
    M4.translate(FBASE, px, py, pz);
    M4.rotY(FBASE, yaw);
    M4.scale(FBASE, sc, sc, sc);
    const ms = FMS;
    ms.reset(FBASE);
    const lie = clamp(p[J.lie], 0, 1);
    const rootY = lerp(rootHeight(p), LIE_HEIGHT, lie) - p[J.rootDrop];
    ms.t(p[J.rootSide], rootY, p[J.rootFwd]);
    ms.ry(p[J.bodyYaw]); ms.rx(p[J.bodyPitch]); ms.rz(p[J.bodyRoll]);
    const m = ms.m;
    pts[0] = m[12]; pts[1] = m[13]; pts[2] = m[14];
    const fl = this.flash * 0.4;
    const skin = col.skin, lk = this.lk, glow = this.accentGlow;
    const pants = lk.legs === 'pants', legCol = pants ? col.shorts : skin;
    part(MESH.CUBE, 0, 0, 0, 0.34 * b, 0.2, 0.22 * b, col.shorts, 0, 0.8, fl);
    // legs
    for (let s = 1; s >= -1; s -= 2) {
      const hx = s > 0 ? p[J.hipLx] : p[J.hipRx], hz = s > 0 ? p[J.hipLz] : p[J.hipRz], kn = s > 0 ? p[J.knL] : p[J.knR];
      ms.push();
      ms.t(s * 0.1 * b, -HIP_DROP, 0); ms.rz(s * hz); ms.rx(-hx);
      part(MESH.CYL, 0, -0.22, 0, (pants ? 0.16 : 0.14) * b, 0.44, (pants ? 0.16 : 0.14) * b, legCol, 0, pants ? 0.85 : 0.7, fl);
      if (!pants) part(MESH.CYL, 0, -0.13, 0, 0.17 * b, 0.28, 0.17 * b, col.shorts, 0, 0.8, fl);
      ms.t(0, -THIGH, 0); ms.rx(kn);
      part(MESH.CYL, 0, -0.22, 0, (pants ? 0.125 : 0.11) * b, 0.44, (pants ? 0.125 : 0.11) * b, legCol, 0, pants ? 0.85 : 0.7, fl);
      part(MESH.SPHERE, 0, 0, 0, 0.12 * b, 0.12 * b, 0.12 * b, legCol, 0, 0.7, fl);
      ms.t(0, -SHIN, 0);
      if (lk.feet === 'barefoot') part(MESH.CUBE, 0, -0.035, 0.07, 0.09 * b, 0.06, 0.25, skin, 0, 0.7, fl);
      else if (lk.feet === 'boots') part(MESH.CUBE, 0, 0.0, 0.06, 0.115 * b, 0.14, 0.27, col.shoe, 0, 0.6, fl);
      else part(MESH.CUBE, 0, -0.03, 0.07, 0.1 * b, 0.07, 0.27, col.shoe, 0, 0.6, fl);
      const q = ms.m, fi = s > 0 ? 15 : 18;
      pts[fi] = q[12] + q[8] * 0.16; pts[fi + 1] = q[13] + q[9] * 0.16; pts[fi + 2] = q[14] + q[10] * 0.16;
      ms.pop();
    }
    // torso
    ms.push();
    ms.t(0, 0.1, 0); ms.rx(p[J.torsoLean]); ms.ry(p[J.torsoTwist]); ms.rz(p[J.torsoRoll]);
    part(MESH.CUBE, 0, 0.26, 0, 0.35 * b, 0.5, 0.21 * b, col.top, 0, 0.8, fl);
    part(MESH.SPHERE, 0, 0.4, 0.02, 0.4 * b, 0.28, 0.25 * b, col.top, 0, 0.8, fl);
    if (lk.belt === 'none') part(MESH.CUBE, 0, 0.0, 0, 0.36 * b, 0.07, 0.23 * b, col.shorts, 0, 0.6, fl);
    else part(MESH.CUBE, 0, 0.0, 0, 0.365 * b, 0.09, 0.235 * b, col.accent, glow, 0.6, fl);
    if (lk.topStyle === 'gi') part(MESH.CUBE, 0, -0.1, 0, 0.37 * b, 0.14, 0.235 * b, col.top, 0, 0.85, fl);       // jacket skirt
    if (lk.belt === 'sash') part(MESH.CUBE, 0.13 * b, -0.15, 0.11 * b, 0.06, 0.22, 0.03, col.accent, glow, 0.7, fl); // hanging sash end
    pts[3] = ms.m[12] + ms.m[4] * 0.3; pts[4] = ms.m[13] + ms.m[5] * 0.3; pts[5] = ms.m[14] + ms.m[6] * 0.3;
    // head
    ms.push();

    pts[6] = ms.m[12] + ms.m[4] * 0.2; pts[7] = ms.m[13] + ms.m[5] * 0.2; pts[8] = ms.m[14] + ms.m[6] * 0.2;

      const sx = s > 0 ? p[J.shLx] : p[J.shRx], sz = s > 0 ? p[J.shLz] : p[J.shRz], sy = s > 0 ? p[J.shLy] : p[J.shRy], el = s > 0 ? p[J.elL] : p[J.elR];

  drawLowerFace(fl) {

  draw(alpha) {

}

/* =====================================================================
   05c COMBAT - hit evaluation, blocking, damage, combos, clinch / throws, environmental impacts.
   Hits are evaluated for both fighters first, then applied, so trades resolve fairly.
   ===================================================================== */
const COMBO_SCALE = [1, 1, 0.9, 0.8, 0.7, 0.6, 0.5];
const KNOCK_DAMP = GROUND_DAMP;

const THROW_VEC = [0, 0];   // scratch for Combat.throwVector (no per-frame allocation)
const Combat = {
  attackCounter: 0,
  flightCounter: 0,

  /* Legal attack-to-attack transitions: tiers may only go up, heavies end a chain, repeats are limited. */
  canChain(from, to, f) {
    if (from.type !== 'strike' || to.type !== 'strike') return false;
    if (from.ctx || to.ctx === 'counter' || to.ctx === 'run') return false;
    if (f.chainCount >= 4) return false;
    if (from.tier === 3) return false;
    if (to.id === from.id) return from.tier === 1 && f.chainCount < 2;
    return to.tier >= from.tier;
  },
  comboScale(n) { return COMBO_SCALE[Math.min(n, COMBO_SCALE.length - 1)]; },
  /* Momentum for damage that landed (strike, ground hit, clinch strike, throw, tackle): the dealer gains by the damage, the receiver by a share of it. */
  momentum(att, def, dmg) { if (def.hp > 0) att.gainMomentum(dmg * MOMENTUM_PER_DAMAGE); def.gainMomentum(dmg * MOMENTUM_PER_DAMAGE * MOMENTUM_TAKEN_RATIO); },

  /* Decide what the attacker's active move would do to the defender this tick (no side effects). */
  evaluate(att, def) {
    const mv = att.move;
    if (!mv || !def) return null;
    if (def.invuln > 0 || TERMINAL_STATES.includes(def.state)) return null;
    if (att.hitList.includes(def)) return null;
    const dx = def.x - att.x, dz = def.z - att.z;
    const fx = att.fwdX, fz = att.fwdZ;
    const fwd = dx * fx + dz * fz, lat = Math.abs(dx * fz - dz * fx);
    const reach = mv.reach * att.stats.reach + def.radius;
    if (fwd < -0.05 || fwd > reach) return null;
    if (lat > mv.width + def.radius * 0.6) return null;
    const st = def.state;
    if (mv.type === 'grab') {
      if (st === S.DOWN || st === S.GETUP || st === S.THROWN || st === S.CLINCH || st === S.GRAPPLE || st === S.SUBMIT || def.y > 0.5 || att.y > 0.3) return null;   // nobody grabs a holder or the held fighter (DOWN)
      return { type: 'grab', att, def, mv };
    }
    if (st === S.CLINCH || st === S.GRAPPLE) return null;
    if (st === S.DOWN) return mv.h === 'L' && def.groundHits < 1 ? { type: 'ground', att, def, mv } : null;
    if (st === S.THROWN && (!def.juggle || def.juggleCount >= JUGGLE_LIMIT)) return null;
    const crouched = st === S.CROUCH || st === S.BLOCK_L;
    if (mv.h === 'H' && crouched) return null;
    if (mv.h === 'L' && def.y > 0.35) return null;
    if (mv.h === 'M' && def.y > 0.9 && !def.juggle) return null;
    // Sway i-frames: strikes that would have hit miss (grabs were handled above and still connect); the last SWAY_PERFECT_TICKS of them make it a perfect sway
    if (st === S.SWAY && def.stateTicks < SWAY_IFRAME_TICKS) return { type: 'sway', att, def, mv, perfect: def.stateTicks >= SWAY_IFRAME_TICKS - SWAY_PERFECT_TICKS };
    let block = 'none';
    const facing = def.fwdX * -dx + def.fwdZ * -dz > 0;
    if (facing) {
      if (st === S.BLOCK_H && (mv.h === 'H' || mv.h === 'M')) block = 'block';
      else if (st === S.BLOCK_L && mv.h === 'L') block = 'block';
      if (block === 'block' && def.blockFresh && def.stateTicks <= PERFECT_BLOCK_TICKS) block = 'perfect';
    }
    return { type: 'strike', att, def, mv, block };
  },

  apply(d, match) {
    d.att.hitList.push(d.def);
    if (d.type === 'grab') this.startClinch(d.att, d.def, match);
    else if (d.type === 'ground') this.groundHit(d, match);
    else if (d.type === 'sway') this.swayHit(d, match);
    else if (d.block === 'perfect') this.blockHit(d, match, true);
    else if (d.block === 'block') this.blockHit(d, match, false);
    else this.landHit(d, match);
  },

  hitPoint(att, def, mv) {
    const h = mv.h === 'H' ? (def.state === S.CROUCH ? 1.1 : 1.45) : mv.h === 'M' ? 1.0 : 0.4;
    const dirx = att.fwdX, dirz = att.fwdZ;
    return { x: def.x - dirx * 0.18, y: def.y + h * def.scale, z: def.z - dirz * 0.18 };
  },

  landHit(d, match) {
    const { att, def, mv } = d;
    const counter = def.state === S.ATTACK && !!def.move && def.move.type === 'strike' && def.moveTick <= def.mStartup + def.mActive;
    let dmg = mv.dmg * att.damageMult(mv) * this.comboScale(def.gotHits);
    if (att.repeatCount > 0) dmg *= Math.max(0.5, 1 - 0.2 * att.repeatCount);
    if (counter) dmg *= mv.cv;
    dmg *= def.stats.taken * (mv.kind === 'hit' && !counter ? 1 : def.stats.impact);   // balance softens everything but plain hits
    if (def.state === S.STUN) dmg *= 1.2;
    dmg = Math.max(1, Math.round(dmg * 10) / 10);
    def.hp = Math.max(0, def.hp - dmg);
    if (match.floorHp(def) > def.hp) def.hp = match.floorHp(def);
    att.moveConnected = true;
    if (def.gotHits === 0) { att.comboHits = 0; att.comboDamage = 0; }
    def.gotHits++;
    def.calmTicks = 0;
    att.comboHits = def.gotHits;
    att.comboDamage += dmg;
    att.comboShow = 100;
    this.momentum(att, def, dmg);
    def.flash = 1;
    def.blockStun = 0;
    def.counterWindow = 0;
    def.hitKind = mv.h === 'H' ? 'high' : mv.h === 'L' ? 'low' : 'mid';
    const dirx = att.fwdX, dirz = att.fwdZ;
    def.hitDirX = dirx; def.hitDirZ = dirz;
    const stun = Math.round(mv.hitstun * def.stats.stun * (counter ? 1.3 : 1) * Math.max(0.6, 1 - 0.07 * (def.gotHits - 1)));
    const v0 = mv.push * KNOCK_DAMP;
    const pos = this.hitPoint(att, def, mv);
    let hs = mv.hitStop + (counter ? 2 : 0);
    if (Settings.v.reducedMotion) hs = Math.ceil(hs * 0.5);
    if (def.hp <= 0) {
      this.knockOut(def, att, mv, match);
      hs = 16;
    } else if (def.state === S.THROWN && def.juggle) {
      def.juggleCount++;
      def.vy = Math.max(def.vy, mv.kind === 'launch' ? mv.launchV * 0.8 : 2.4);
      def.kx = dirx * Math.max(v0, 2); def.kz = dirz * Math.max(v0, 2);
      if (mv.kind === 'knockdown' || def.juggleCount >= JUGGLE_LIMIT) def.juggle = false;
    } else if (mv.kind === 'launch') {
      def.setState(S.THROWN);
      def.lieSign = 1; def.downMult = 1; def.throwPitch = 0; def.throwRoll = 0;
      def.juggle = true; def.juggleCount++;
      def.flightId = ++this.flightCounter;
      def.vy = mv.launchV;
      def.y = Math.max(def.y, def.groundY) + 0.02;

  groundHit(d, match) {

  blockHit(d, match, perfect) {

  /* A strike met a swaying fighter's i-frames: it whiffs (the attacker's string does not continue). A perfect sway also opens one

  },

  /* Environmental hit: a strike that lands on scenery. */
  hitObjects(att, match) {

    const cy = (mv.h === 'H' ? 1.4 : mv.h === 'M' ? 1.0 : 0.35) + att.y; // body height is cosmetic, so it must not move the hit height
    const raw = mv.dmg * att.damageMult(mv) / att.boostMult();   // the momentum boost is for fighters, not scenery

  /* ----- clinch, throws and escapes ----- */
  startClinch(att, def, match) {

    att.clinchTick = 0; def.clinchTick = 0; att.throwPending = null; def.escapeLock = 0; def.escapeQueued = false; def.counterWindow = 0; att.clinchStrikes = 0;
    att.vx = att.vz = def.vx = def.vz = 0; def.kx = def.kz = att.kx = att.kz = 0;

  /* Rear grip when the defender's back is turned, low grip when either fighter is crouched, otherwise front. */
  gripFor(att, def) {

  /* Move the held defender along the throw's carry path (part of the simulation: it decides where they land). */
  carryPartner(att, def, tp) {
    const c = sampleCarry(tp.data.anim, clamp(tp.tick / tp.data.startup, 0, 1));
    const side = c[2] * tp.side;
    const fx = att.fwdX, fz = att.fwdZ, rx = -fz, rz = fx;
    def.x = att.x + fx * c[1] + rx * side;
    def.z = att.z + fz * c[1] + rz * side;

    def.liftY = c[3];                                    // visual lift only: collisions use the real height
    def.vx = def.vz = def.kx = def.kz = def.vy = 0;
    def.yaw = wrapAngle(tp.baseYaw + c[6] * tp.side);
  },
  /* World direction of a throw relative to the thrower's facing. Returns a shared scratch pair: read it right away. */
  throwVector(att, dir) {
    const fx = att.fwdX, fz = att.fwdZ, v = THROW_VEC;
    if (dir === 'back') { v[0] = -fx; v[1] = -fz; } else if (dir === 'left') { v[0] = fz; v[1] = -fx; } else if (dir === 'right') { v[0] = -fz; v[1] = fx; } else { v[0] = fx; v[1] = fz; }

  },
  clinchStrike(att, def, cm, match) {
    if (!match.live) return;
    att.clinchStrikeCd = 22;
    att.clinchStrikeAnim = CLINCH_STRIKE_ANIM_TICKS;
    att.clinchStrikeKind = cm.id;
    att.clinchStrikes++;
    const exhausted = att.stam < cm.stam;   // an empty tank still lands the strike, but weakly (like an exhausted attack)
    att.stam = Math.max(0, att.stam - cm.stam);
    att.noRegen = 30;
    def.stam = Math.max(0, def.stam - cm.drain);
    const dmg = Math.max(1, Math.round(cm.dmg * att.stats.damage * att.boostMult() * (exhausted ? 0.6 : 1) * this.comboScale(def.gotHits) * def.stats.taken * 10) / 10);
    def.hp = Math.max(0, def.hp - dmg);
    if (match.floorHp(def) > def.hp) def.hp = match.floorHp(def);
    def.flash = 1;
    def.gotHits++; att.comboHits = def.gotHits; att.comboDamage += dmg; att.comboShow = 100;
    this.momentum(att, def, dmg);
    match.hitStop = Math.max(match.hitStop, 5);
    if (def.hp <= 0) this.knockOut(def, att, null, match);   // before the hit event, so the KO blow gets its full feedback
    Events.emit('hit', { att, def, mv: { id: cm.id, name: cm.name, tier: 2, cat: cm.cat, h: 'M', kind: 'hit', hitStop: 5 }, dmg, counter: false, x: def.x, y: def.y + 0.9, z: def.z, dirx: att.fwdX, dirz: att.fwdZ, kind: 'hit', combo: att.comboHits, ko: def.state === S.KO });
  },
  executeThrow(att, def, match) {
    const p = att.throwPending, t = p.data;
    att.throwPending = null;
    let dmg = t.dmg * att.stats.damage * att.boostMult() * def.stats.taken * def.stats.impact;
    dmg = match.live ? Math.max(1, Math.round(dmg * 10) / 10) : 0;   // a throw finishing after the round ends still lands, harmlessly
    def.hp = Math.max(0, def.hp - dmg);
    if (match.floorHp(def) > def.hp) def.hp = match.floorHp(def);
    this.momentum(att, def, dmg);
    const v = this.throwVector(att, p.dir), vx = v[0], vz = v[1];

    def.setState(S.THROWN);
    def.juggle = false;
    def.flightId = ++this.flightCounter;
    def.partner = null; def.clinchTick = 0; def.gotHits = 0;
    def.kx = vx * speed; def.kz = vz * speed;
    def.vy = t.arc;
    def.y = Math.max(def.y, def.groundY) + 0.03;
    def.pendingKO = def.hp <= 0;
    def.hitKind = 'mid';
    def.downMult = t.down;
    def.lieSign = t.face === 'front' ? -1 : 1;
    const release = sampleCarry(t.anim, 1);
    def.throwPitch = release[4]; def.throwRoll = release[5] * p.side;
    def.flash = 1;
    att.partner = null; att.clinchTick = 0;
    att.setState(S.IDLE);
    att.lock = t.recovery;
    att.throwFollow = { anim: t.anim, side: p.side, recovery: t.recovery };
    match.hitStop = Math.max(match.hitStop, 7);
    Events.emit('throw', { att, def, dmg, dir: p.dir, grip: att.grip, name: t.name, x: def.x, y: 1.0, z: def.z });
  },
  escapeClinch(def, att, match) {
    att.throwPending = null;
    def.stam = Math.max(0, def.stam - 6);
    const dx = def.x - att.x, dz = def.z - att.z, l = Math.hypot(dx, dz) || 1;
    def.reactDur = 16; att.reactDur = 16; def.hitKind = 'mid'; att.hitKind = 'mid';
    def.partner = null; att.partner = null;
    def.setState(S.HIT); att.setState(S.HIT);
    def.kx = dx / l * 4; def.kz = dz / l * 4; att.kx = -dx / l * 4; att.kz = -dz / l * 4;

  },
  releaseClinch(att, def) {

    att.partner = null; def.partner = null; att.throwPending = null;
    att.setState(S.IDLE); def.setState(S.IDLE);
    att.lock = 12;
    def.kx = dx / l * 3; def.kz = dz / l * 3; att.kx = -dx / l * 3; att.kz = -dz / l * 3;

  /* ----- submissions (P3-05): see the SUBMIT_* constants. The holder is `partner`-linked to the victim, who stays in DOWN with pinnedBy set ----- */
  canSubmit(att, def, match) {
    if (!match.live || !def || att === def || !styleCanSubmit(att.profile)) return false;
    if (!att.alive || att.airborne || att.stam < SUBMIT_MIN_STAMINA || att.pinnedBy || att.partner) return false;
    if (def.state !== S.DOWN || def.pinnedBy || def.submitDone || !def.alive) return false;   // a hold is joined by nobody: the victim is taken, once per knockdown
    return Math.hypot(def.x - att.x, def.z - att.z) <= SUBMIT_RANGE && Math.abs(def.y - att.y) < 0.6;
  },
  startSubmission(att, def, match) {

    att.holdTicks = 0; att.holdContest = 0; att.holdDamage = 0; att.holdHp = att.hp;
    const dx = att.x - def.x, dz = att.z - def.z, l = Math.hypot(dx, dz) || 1;
    att.x = def.x + dx / l * SUBMIT_GAP; att.z = def.z + dz / l * SUBMIT_GAP;
    att.yaw = Math.atan2(-dx, -dz);
    att.vx = att.vz = att.kx = att.kz = def.vx = def.vz = def.kx = def.kz = 0;

  dropSubmission(att, reason) {

    }

  /* One tick of the hold's damage: it builds from SUBMIT_DMG_START to SUBMIT_DMG_END over the hold. */

    def.hp = Math.max(0, def.hp - dmg);

  },

  /* ----- heavy tackle (P3-06): called for each ordered pair after movement, before the bodies are pushed apart ----- */

    if (match.floorHp(f) > f.hp) f.hp = match.floorHp(f);

/* ---------- colour helpers ---------- */

/* ---------- point-buy rules ---------- */
function attrCost(value) { return value + Math.max(0, value - ATTR_KNEE); }

/* Strict validation: returns { ok, value, error }. value is a fresh, normalised record. Never throws. */

  if (!Number.isInteger(raw.title) || raw.title < 0 || raw.title >= TITLES.length) return fail('Unknown title');
  if (!ARCHETYPE_IDS.includes(raw.arch)) return fail('Unknown fighting style');
  if (!TIERS.includes(raw.tier)) return fail('Unknown tier');

/* ---------- random fighters (seeded, reproducible) ---------- */

  const arch = pick(ARCHETYPE_IDS);
  const attrs = Object.assign({}, ARCHETYPES[arch].attrs);
  for (let i = 0; i < 6; i++) {                              // move single points around, staying legal
    const from = pick(ATTR_KEYS), to = pick(ATTR_KEYS);
    if (from === to || attrs[from] <= ATTR_MIN || attrs[to] >= ATTR_MAX) continue;
    attrs[from]--; attrs[to]++;

  for (const key of LOOK_CHOICE_KEYS) look[key] = pick(LOOK_CHOICES[key].options);

  if (!code) return fail('Paste a fighter code first');
  if (code.length > SHARE_MAX_LENGTH) return fail('Code is too long');
  const match = /^BP1-([A-Za-z0-9_-]{8,})-([0-9a-z]{1,8})$/.exec(code);
  if (!match) return fail('Not a BREAKPOINT fighter code');
  if (shareChecksum(match[1]) !== match[2]) return fail('Code is damaged or was edited (checksum mismatch)');
  let fields;
  try { fields = JSON.parse(fromBase64Url(match[1])); } catch (e) { return fail('Code could not be read'); }
  if (!Array.isArray(fields) || ![SHARE_FIELD_COUNT, SHARE_FIELD_COUNT_STYLE, SHARE_FIELD_COUNT_DEFENSE].includes(fields.length)) return fail('Code has the wrong number of fields');
  if (fields[0] !== SHARE_VERSION) return fail('Code is from an unsupported version');
  let i = 1;
  const record = { name: fields[i++], title: fields[i++], arch: ARCHETYPE_IDS[fields[i++]], tier: TIERS[fields[i++]], attrs: {}, look: {} };
  for (const key of ATTR_KEYS) record.attrs[key] = fields[i++];
  for (const key of SHARE_LOOK_KEYS) record.look[key] = LOOK_CHOICES[key].options[fields[i++]];
  record.look.scale = Number.isInteger(fields[i]) ? fields[i] / 100 : NaN; i++;
  record.look.build = Number.isInteger(fields[i]) ? fields[i] / 100 : NaN; i++;
  for (const key of LOOK_COLOR_KEYS) { const hex = fields[i++]; record.look[key] = typeof hex === 'string' ? '#' + hex : null; }
  if (fields.length >= SHARE_FIELD_COUNT_STYLE) record.moveStyle = Number.isInteger(fields[i]) ? MOVE_STYLE_IDS[fields[i]] : null;
  if (fields.length === SHARE_FIELD_COUNT_DEFENSE) record.defense = DEFENSE_TYPES[fields[i + 1]] || DEFAULT_DEFENSE;   // an unknown index means Block; older codes have no field and get the style default in validateCustom
  const checked = validateCustom(record);
  if (!checked.ok) return checked;
  if (checked.value.tier === 'veteran' && !allowVeteran) return fail('Veteran fighters need an Arcade clear first');
  return checked;
}

/* ---------- save slots ---------- */
const CustomRoster = {
  slots: new Array(CUSTOM_SLOTS).fill(null),
  revision: 0,                         // bumps on every change so previews and menus can refresh
  init() {
    this.slots = new Array(CUSTOM_SLOTS).fill(null);
    const raw = Store.get(KEY_CUSTOM);
    if (raw && raw.length <= STORE_MAX_LENGTH) this.loadFrom(readJson(KEY_CUSTOM));
    else if (raw) Diag.log('warn', 'Ignoring oversized custom fighter data');
    this.register();
  },
  loadFrom(stored) {
    if (!stored || !Array.isArray(stored.slots)) return;
    for (let i = 0; i < CUSTOM_SLOTS; i++) {
      const entry = stored.slots[i];
      if (entry === null || entry === undefined) continue;
      const checked = validateCustom(entry);
      if (checked.ok) this.slots[i] = checked.value;
      else Diag.log('warn', 'Dropped invalid custom fighter in slot ' + (i + 1) + ': ' + checked.error);
    }
  },
  save() { Store.set(KEY_CUSTOM, JSON.stringify({ version: CUSTOM_STORE_VERSION, slots: this.slots })); },
  /* Keep ROSTER_BY_ID in sync with the slots; ROSTER (ladder order by rank) never changes. */
  register() {
    for (const id of CUSTOM_IDS) delete ROSTER_BY_ID[id];
    for (let i = 0; i < CUSTOM_SLOTS; i++) if (this.slots[i]) ROSTER_BY_ID[CUSTOM_IDS[i]] = customProfile(this.slots[i], i);
    this.revision++;
    if (typeof Game !== 'undefined') Game.ensureSelection();
  },
  put(slot, custom) {
    if (slot < 0 || slot >= CUSTOM_SLOTS) return { ok: false, error: 'Unknown slot' };
    const checked = validateCustom(custom);
    if (!checked.ok) return checked;
    this.slots[slot] = checked.value;
    this.save();
    this.register();
    return checked;
  },
  remove(slot) {
    if (slot < 0 || slot >= CUSTOM_SLOTS || !this.slots[slot]) return false;
    this.slots[slot] = null;
    this.save();
    this.register();
    return true;
  },
  firstFree() { return this.slots.indexOf(null); },
  has(id) { const slot = CUSTOM_IDS.indexOf(id); return slot >= 0 && !!this.slots[slot]; },
  profiles() { return CUSTOM_IDS.map((id) => ROSTER_BY_ID[id]).filter(Boolean); },
};

/* =====================================================================
   06 AI - perception snapshots with reaction delay, action scoring, difficulty profiles.
   The AI only reads observable state (positions, current animation phase of the opponent),
   delayed by its reaction time. It never reads the opponent's controller input.
   ===================================================================== */
const DIFFICULTY = {
  easy: { id: 'easy', label: 'Easy', react: 20, interval: 34, blockSkill: 0.15, parry: 0.01, punish: 0.1, counter: 0.08, mistakes: 0.4, aggression: 0.4, heavy: 0.12, grab: 0.04, escape: 0.15, adapt: 0, sidestep: 0, lockout: 22, env: false, dmg: 0.75 },
  normal: { id: 'normal', label: 'Normal', react: 14, interval: 20, blockSkill: 0.4, parry: 0.05, punish: 0.35, counter: 0.25, mistakes: 0.18, aggression: 0.6, heavy: 0.25, grab: 0.1, escape: 0.35, adapt: 0.1, sidestep: 0.12, lockout: 13, env: false, dmg: 0.85 },
  hard: { id: 'hard', label: 'Hard', react: 10, interval: 9, blockSkill: 0.75, parry: 0.2, punish: 0.75, counter: 0.55, mistakes: 0.06, aggression: 1.05, heavy: 0.4, grab: 0.2, escape: 0.65, adapt: 0.35, sidestep: 0.35, lockout: 8, env: true, dmg: 1 },
  expert: { id: 'expert', label: 'Expert', react: 8, interval: 6, blockSkill: 0.9, parry: 0.35, punish: 0.92, counter: 0.8, mistakes: 0.02, aggression: 1.2, heavy: 0.5, grab: 0.3, escape: 0.85, adapt: 0.7, sidestep: 0.55, lockout: 6, env: true, dmg: 1 },
};
/* react = reaction delay in ticks (slower than most strikes on Easy, so blockSkill matters more as difficulty rises);
   parry = chance a reaction block is timed as a perfect block; adapt = chance to guard where the opponent usually attacks;
   dmg = the CPU's damage dealt (Easy and Normal hit softer, so a beginner who trades blows still wins). */
const AI_SWAY_REACT = 0.4;       // a Sway AI reads a wind-up after this share of its normal reaction delay (a dodge is timed off the first frames, a guard is just raised)
const AI_SWAY_MIN_ETA = 6;       // a Sway AI only dodges a strike it sees at least this many ticks ahead: a late, plain dodge leaves the attacker free before the sway ends, so it just gets hit in the recovery
const AI_SWAY_AIM = 3;         // a sway is timed so the strike goes active this many ticks into the dodge (a plain dodge, well inside the i-frames)
const AI_SWAY_AIM_PERFECT = 8;   // ... or this many when the AI aims for a perfect sway (the last SWAY_PERFECT_TICKS of the i-frames are 6-11)
const AI_HEIGHT_READ = 4;       // ticks into a strike before its height (high / mid / low) can be told apart
const AI_GRAB_APPROACH = 2.1;    // distance from which an AI may walk in for a grab
const AI_GRAB_STAMINA = 0.3;     // share of max stamina an AI needs before grabbing (grab + throw cost ~20-30)
const AI_THROW_TARGET_BONUS = 0.4;   // extra grab appeal when a wall or object would take the throw
const AI_THROW_READ = 0.6;       // escape chance per throw = difficulty escape skill x this
const AI_GRAB_BREAK = 0.3;       // chance to break a grab at the first legal tick = blockSkill x this, rolled once per grab
const AI_BLOCK_PUNISH = 0.8;     // chance to punish a blocked, unsafe attack = difficulty punish skill x this
const AI_BLOCK_PUNISH_EDGE = 4;  // the attacker must still be recovering this many ticks after the guard drops
/* Submissions: an AI whose style allows it holds a downed foe it stands near with a chance per decision of grab skill x AI_SUBMIT_CHANCE
   (easy .08 .. expert .6), then taps Grapple; a held AI taps Defend. Taps per tick = difficulty escape skill x AI_TAP_RATE (hard ~4 a second). */
const AI_SUBMIT_CHANCE = 2;
const AI_SUBMIT_APPROACH = 2.2;   // distance from which an AI walks in to hold a downed foe
const AI_SUBMIT_SCORE = 3;        // a rolled hold beats every other plan
const AI_TAP_RATE = 0.1;
const DIFFICULTY_ORDER = ['easy', 'normal', 'hard', 'expert'];
const AI_HISTORY = 48;

class AIController {
  constructor(profile, difficultyId) {
    this.profile = profile;
    this.d = DIFFICULTY[difficultyId] || DIFFICULTY.normal;
    this.hist = [];
    for (let i = 0; i < AI_HISTORY; i++) this.hist.push({ dist: 9, state: S.IDLE, moveId: 0, mvType: '', mvH: '', mvReach: 0, mvWidth: 0, moveTick: 0, startup: 0, active: 0, total: 0, y: 0, pendingThrow: -1, hp: 1, stam: 1, mvCat: '' });
    this.reset();
  }
  reset() {
    this.head = 0; this.count = 0; this.plan = null; this.nextDecision = 0; this.lastMoves = [];
    this.readThrow = null; this.willEscape = false; this.escapeAt = 0;
    this.threatId = -1; this.threatResp = null; this.earlyRoll = null; this.breakGrabId = -1; this.punishId = -1; this.punishYes = false; this.steerSide = 1;
    this.oppRecent = []; this.lastOppMoveId = 0; this.counterTried = false; this.clinchPlan = null; this.tickNo = 0;
  }
  observe(f, opp) {
    const s = this.hist[this.head];
    const mv = opp.move;
    s.dist = Math.hypot(opp.x - f.x, opp.z - f.z);
    s.state = opp.state; s.moveId = opp.moveId; s.y = opp.y;
    s.mvType = mv ? mv.type : ''; s.mvH = mv ? mv.h : ''; s.mvReach = mv ? mv.reach * opp.stats.reach : 0; s.mvWidth = mv ? mv.width : 0; s.mvCat = mv ? mv.cat : '';
    s.moveTick = opp.moveTick; s.startup = opp.mStartup; s.active = opp.mActive; s.total = opp.mStartup + opp.mActive + opp.mRecovery + opp.whiffExtra;
    s.pendingThrow = opp.throwPending ? opp.throwPending.tick : -1;
    s.hp = opp.hp / opp.maxHp; s.stam = opp.stam / opp.maxStam;
    this.head = (this.head + 1) % AI_HISTORY;
    this.count++;
    if (mv && mv.type === 'strike' && opp.moveId !== this.lastOppMoveId && opp.state === S.ATTACK) {
      this.lastOppMoveId = opp.moveId;
      this.oppRecent.push(mv.h);
      if (this.oppRecent.length > 8) this.oppRecent.shift();
    }
  }
  delayed(n) {
    const k = Math.min(n, Math.min(this.count, AI_HISTORY) - 1);
    return this.hist[(this.head - 1 - Math.max(0, k) + AI_HISTORY * 2) % AI_HISTORY];
  }

  /* Steer around solid obstacles: rotate the desired heading until the short path ahead is clear. */
  steer(f, dx, dz) {
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;
    const r = 0.3, look = 1.7;
    if (!Arena.pathBlocked(f.x, f.z, f.x + dx * look, f.z + dz * look, r)) return [dx, dz];
    for (const a of [0.7, 1.4, 2.1]) {
      for (const sgn of [this.steerSide, -this.steerSide]) {
        const c = Math.cos(a * sgn), s = Math.sin(a * sgn);
        const nx = dx * c - dz * s, nz = dx * s + dz * c;
        if (!Arena.pathBlocked(f.x, f.z, f.x + nx * look, f.z + nz * look, r)) { this.steerSide = sgn; return [nx, nz]; }
      }
    }
    return [dx, dz];
  }
  moveToward(f, it, dx, dz, run) {
    const [sx, sz] = this.steer(f, dx, dz);
    const fx = f.fwdX, fz = f.fwdZ;
    it.fwd = sx * fx + sz * fz;
    it.side = sx * -fz + sz * fx;
    it.run = !!run && it.fwd > 0.6;
  }

  think(f, opp, match, it) {
    clearIntent(it);
    this.tickNo++;
    this.observe(f, opp);
    const d = this.d;
    const snap = this.delayed(d.react);
    if (!f.alive || TERMINAL_STATES.includes(f.state)) return it;
    if (f.state !== S.GRAPPLE) this.clinchPlan = null;   // every clinch gets a fresh plan
    // reactions to the clinch and getting up
    if (f.state === S.CLINCH) return this.thinkClinched(f, opp, it, snap);
    if (f.state === S.GRAPPLE) return this.thinkGrapple(f, opp, match, it);
    if (f.state === S.SUBMIT) { this.plan = null; if (simRng() < d.escape * AI_TAP_RATE) it.grapple = true; return it; }   // the holder keeps tapping Grapple
    if (f.state === S.DOWN && f.pinnedBy) { if (simRng() < d.escape * AI_TAP_RATE) it.defend = true; return it; }   // held: Defend taps are escape attempts
    if (f.state === S.DOWN) { if (d.id !== 'easy' && f.stam > 20 && f.stateTicks > 16 && simRng() < 0.15) it.defend = true; return it; }   // one Defend press = quick recovery
    if (REACTION_STATES.includes(f.state)) { this.plan = null; this.counterTried = false; return it; }
    if (f.state === S.SWAY) { this.plan = null; return it; }   // a sway runs by itself; the next decision comes after it
    // facing: nothing to do, fighter auto-faces
    const dist = Math.hypot(opp.x - f.x, opp.z - f.z);

    // 0. punish a blocked attack that leaves the attacker recovering (the AI knows the move it just blocked)
    if (this.punishBlocked(f, opp, snap, dist, it)) return it;
    // 1. reactive defence against attacks seen (with delay)
    this.reactToThreat(f, opp, snap, it);
    const tr = this.threatResp;
    if (tr && tr.until > this.tickNo && f.state !== S.ATTACK) {
      if (tr.kind === 'sway') {   // one Defend press, at the planned tick
        if (!tr.done && this.tickNo >= tr.at) { tr.done = true; it.defend = true; }
        return it;
      }
      if (tr.kind === 'block' && !tr.read && snap.moveId === tr.id && snap.moveTick >= AI_HEIGHT_READ) { tr.read = true; tr.h = snap.mvH; }   // the strike's line is visible now
      it.defend = tr.kind === 'block';
      it.crouch = tr.kind === 'block' && tr.h === 'L';   // Crouch + Defend = low guard
      it.noParry = tr.kind === 'block' && !tr.parry;
      if (tr.kind === 'sidestep' && !tr.done) { tr.done = true; it.sidestep = simRng() < 0.5 ? -1 : 1; }
      return it;
    }
    // 2. counter-attack after a successful block
    if (f.counterWindow > 0 && !this.counterTried && f.state !== S.ATTACK) {
      this.counterTried = true;
      if (simRng() < d.counter) { if (simRng() < 0.6) it.punch = true; else it.kick = true; this.plan = null; return it; }
    }
    if (f.counterWindow === 0) this.counterTried = false;
    // 3. chaining while attacking
    if (f.state === S.ATTACK) { this.thinkChain(f, opp, it); return it; }
    // 4. execute / choose plan
    if (this.plan) {
      this.runPlan(f, opp, it);
      if (this.plan && this.plan.ticks <= 0) this.plan = null;
    }
    const punish = this.checkPunish(f, opp, snap, dist);
    if (punish) { this.plan = punish; this.runPlan(f, opp, it); return it; }
    if (!this.plan && f.lock === 0 && this.tickNo >= this.nextDecision) {
      this.plan = this.decide(f, opp, match, snap, dist);
      this.nextDecision = this.tickNo + d.interval;
      if (this.plan) this.runPlan(f, opp, it);
    }
    return it;
  }

  reactToThreat(f, opp, snap, it) {
    const d = this.d;
    if (f.defense === 'sway') this.readSway(f);
    const incoming = snap.state === S.ATTACK && (snap.mvType === 'strike' || snap.mvType === 'grab') && snap.moveTick <= snap.startup + 1 && snap.dist <= snap.mvReach + 1.0;
    if (!incoming || snap.moveId === this.threatId) return;
    this.threatId = snap.moveId;
    const roll = this.earlyRoll && this.earlyRoll.id === snap.moveId ? this.earlyRoll.roll : simRng();
    const hold = snap.startup + snap.active - snap.moveTick + d.react + 8;
    if (this.profile && f.state !== S.ATTACK && f.lock === 0) {
      if (snap.mvType === 'grab') {
        // too fast to dodge on reaction (startup ~9 vs react >= 8), but a grab seen coming is broken at the first legal tick
        if (roll < d.blockSkill * AI_GRAB_BREAK) this.breakGrabId = snap.moveId;
      } else if (roll < d.blockSkill) {
        // a Sway fighter's dodge was decided by readSway; seen this late, a sway would come too late
        if (f.defense === 'block') {
          this.threatResp = { kind: 'block', h: this.guessHeight(), id: snap.moveId, read: false, parry: simRng() < d.parry, until: this.tickNo + hold, done: false };
          this.plan = null;
        }
      } else if (roll < d.blockSkill + d.sidestep * 0.5 && snap.mvWidth < 0.5 && f.stam > 10) {
        this.threatResp = { kind: 'sidestep', h: snap.mvH, until: this.tickNo + 6, done: false };
        this.plan = null;
      }
    }
  }
  /* A sway has to start before the strike goes active. The snapshot is swayDelay() ticks old, so the strike's first active tick is
     eta ticks from now (this tick = 1); the press is timed so that tick lands AI_SWAY_AIM ticks into the dodge, or AI_SWAY_AIM_PERFECT
     (inside the perfect window) when this AI rolls its parry chance. Too late (eta < AI_SWAY_MIN_ETA) or too tired: no response. */
  swayDelay() { return Math.round(this.d.react * AI_SWAY_REACT); }
  /* Only the strike-to-sway roll uses the fresher snapshot: grabs and sidesteps keep the normal delay, and a roll that does not sway
     is stored so the normal-delay read reuses it (a Sway AI gets no extra roll). */
  readSway(f) {
    const early = this.delayed(this.swayDelay());
    const strike = early.state === S.ATTACK && early.mvType === 'strike' && early.moveTick <= early.startup + 1 && early.dist <= early.mvReach + 1.0;
    if (!strike || early.moveId === this.threatId || (this.earlyRoll && this.earlyRoll.id === early.moveId)) return;
    const roll = simRng();
    if (roll < this.d.blockSkill && this.profile && f.state !== S.ATTACK && f.lock === 0) {
      this.threatId = early.moveId;
      this.threatResp = this.swayResponse(f, early);
      this.plan = null;
      return;
    }
    this.earlyRoll = { id: early.moveId, roll };
  }
  swayResponse(f, snap) {
    const eta = snap.startup + 1 - snap.moveTick - this.swayDelay();
    if (eta < AI_SWAY_MIN_ETA || f.stam < SWAY_COST) return null;
    const aim = simRng() < this.d.parry ? AI_SWAY_AIM_PERFECT : AI_SWAY_AIM;
    const at = this.tickNo + Math.max(0, eta - aim - 1);
    return { kind: 'sway', id: snap.moveId, at, until: at + 3, done: false };
  }
  /* Too early to see where a strike goes: guard high (covers high and mid), or low once this AI has learned the opponent mostly attacks low. */
  guessHeight() {
    const lows = this.oppRecent.filter((h) => h === 'L').length;
    return lows * 2 > this.oppRecent.length && simRng() < this.d.adapt ? 'L' : 'H';
  }
  punishBlocked(f, opp, snap, dist, it) {
    const br = f.blockRead;
    if (!br || f.blockStun > 0) return false;
    f.blockRead = null;
    if (br.edge < AI_BLOCK_PUNISH_EDGE || f.state === S.ATTACK || f.lowStamina || simRng() >= this.d.punish * AI_BLOCK_PUNISH) return false;
    const mv = this.pickMove(f, opp, snap, dist, true, br.edge);
    if (!mv) return false;
    this.threatResp = null;
    this.plan = this.attackPlan(mv);
    this.runPlan(f, opp, it);
    return true;
  }
  checkPunish(f, opp, snap, dist) {
    const d = this.d;
    if (!(snap.state === S.ATTACK && (snap.mvType === 'strike' || snap.mvType === 'grab'))) return null;   // a grab still in ATTACK after its active ticks has whiffed
    const remaining = snap.total - snap.moveTick;
    if (snap.moveTick <= snap.startup + snap.active || remaining < 7) return null;
    if (this.punishId !== snap.moveId) { this.punishId = snap.moveId; this.punishYes = simRng() < d.punish; }
    if (!this.punishYes || f.lock > 0 || f.lowStamina) return null;
    const mv = this.pickMove(f, opp, snap, dist, true);
    if (mv) { this.punishYes = false; return this.attackPlan(mv); }
    if (dist < 3.2 && f.stam > 25) return { kind: 'walk', ticks: 6, away: false, run: true };
    return null;
  }

  thinkChain(f, opp, it) {
    const d = this.d, mv = f.move;
    if (!mv || !f.moveConnected || mv.tier === 3 || f.chainCount >= 3) return;
    if (f.moveTick < f.mStartup + 1 || f.moveTick > f.mStartup + f.mActive + 4) return;
    if (simRng() > 0.18 + d.aggression * 0.22) return;
    const dist = Math.hypot(opp.x - f.x, opp.z - f.z);
    const pool = this.reachable(f).filter((c) => Combat.canChain(mv, c.mv, f) && dist <= c.mv.reach * f.stats.reach + 0.2 && f.stam > c.mv.stam);
    if (!pool.length) return;
    const pick = pool[Math.floor(simRng() * pool.length)];
    this.pressMove(it, pick);
  }
  /* The moves a Punch / Kick press (standing or crouched) would play right now: { mv, btn, height }. The AI presses the
     same inputs as a player, so it reaches the strong moves only as steps of the attack strings. */
  reachable(f) {
    const list = [];
    for (const btn of ['punch', 'kick']) {
      for (const height of [false, true]) {
        const mv = f.pressMove(btn, height);
        if (mv.type === 'strike' && !mv.ctx && !list.some((c) => c.mv === mv)) list.push({ mv, btn, height });
      }
    }
    return list;
  }
  pressMove(it, pick) {
    it[pick.btn] = true;
    it.height = pick.height;
  }
  attackPlan(pick) {
    return { kind: 'attack', ticks: this.d.lockout, mv: pick.mv, pick, fired: false };
  }

  inRange(f, mv, dist) { return dist <= mv.reach * f.stats.reach + 0.34 - 0.08 && dist >= 0.45; }
  pickMove(f, opp, snap, dist, fastOnly, maxStartup = 99) {
    const d = this.d, st = this.profile.style;
    let best = null, bestScore = 0;
    const oppState = snap.state;
    const oppCrouch = oppState === S.CROUCH || oppState === S.BLOCK_L;
    const blockingH = oppState === S.BLOCK_H, blockingL = oppState === S.BLOCK_L;
    for (const pick of this.reachable(f)) {
      const mv = pick.mv;
      if (!this.inRange(f, mv, dist)) continue;
      if (fastOnly && mv.startup > 11) continue;
      if (mv.startup > maxStartup) continue;
      let sc = 0.5;
      sc *= mv.cat === 'punch' ? 0.4 + st.punch : mv.cat === 'kick' ? 0.4 + st.kick : 0.3 + st.heavy * d.heavy * 2.2;
      if (mv.h === 'L') sc *= 0.5 + st.low;
      sc *= 1.25 - mv.startup / 30;
      const cost = mv.stam;
      if (f.stam < cost * 2 + 10) sc *= 0.25; else if (f.lowStamina) sc *= mv.tier === 3 ? 0.15 : 0.5;
      if (blockingH) sc *= mv.h === 'L' ? 1.8 : 0.45;
      if (blockingL) sc *= mv.h === 'L' ? 0.3 : 1.4;
      if (oppCrouch && mv.h === 'H') sc *= 0.1;
      if (snap.y > 0.4 && mv.h === 'L') sc *= 0.1;
      if (this.lastMoves.includes(mv.id)) sc *= 0.6;
      sc *= 1 + (simRng() - 0.5) * (0.3 + d.mistakes * 3);
      if (sc > bestScore) { bestScore = sc; best = pick; }
    }
    return best;
  }

  decide(f, opp, match, snap, dist) {
    const d = this.d, st = this.profile.style;
    const pref = this.profile.range;
    const options = [];
    const add = (score, plan) => { options.push({ score: score * (1 + (simRng() - 0.5) * (0.25 + d.mistakes * 3)), plan }); };
    const low = f.lowStamina;
    const aggr = st.aggr * d.aggression;
    const b = Arena.def.bounds;
    const cornered = Math.abs(f.x) > b.x - 1.2 || Math.abs(f.z) > b.z - 1.0;
    const interval = d.interval;
    // spacing
    if (dist > pref + 0.35) add(0.5 + clamp((dist - pref - 0.35) * 0.9, 0, 3) * aggr * (low ? 0.3 : 1), { kind: 'walk', ticks: interval, away: false, run: dist > 3.6 && f.stam > f.maxStam * 0.45 && d.id !== 'easy' });
    if (dist < pref - 0.25 || low) add((clamp(pref - dist, 0, 2) * 1.2 + (low ? 1.6 : 0.1)) * (1.2 - aggr * 0.4), cornered ? { kind: 'circle', ticks: interval, side: simRng() < 0.5 ? -1 : 1, hold: true } : { kind: 'walk', ticks: interval, away: true, run: false });
    if (Math.abs(dist - pref) < 0.9) add(0.15 + st.circle * 0.9 * (d.id === 'easy' ? 0.4 : 1), { kind: 'circle', ticks: interval + 4, side: simRng() < 0.5 ? -1 : 1, hold: true });
    if (dist < pref + 0.9 && !low) add(0.12 + st.defend * 0.5 * d.blockSkill, { kind: 'guard', ticks: interval + 4, low: simRng() < 0.3 });
    if (low) add(0.3, { kind: 'guard', ticks: interval + 8, low: false });   // blocking drains stamina too: a tired AI mostly backs off
    // attacks
    if (!low || snap.state === S.STAGGER) {
      const mv = this.pickMove(f, opp, snap, dist, false);
      if (mv) add(0.9 * aggr + (snap.state === S.STAGGER || snap.state === S.HIT ? 1.2 : 0), this.attackPlan(mv));
    }
    // grapple (also towards scenery for harder AIs)
    // grapple: close in from mid range, then grab (low grab against a crouching or low-blocking opponent)
    if (dist < AI_GRAB_APPROACH && snap.y < 0.3 && f.stam > f.maxStam * AI_GRAB_STAMINA) {
      let g = st.grab * d.grab * 6 + (snap.state === S.BLOCK_H || snap.state === S.BLOCK_L ? 1.0 : 0);
      const lowGrab = snap.state === S.CROUCH || snap.state === S.BLOCK_L;
      let dir = 'fwd';
      if (d.env) {
        const target = this.throwTarget(f, opp);
        if (target) { dir = target.dir; g += AI_THROW_TARGET_BONUS; }
      }
      add(g, { kind: 'grab', ticks: d.lockout + 8 + (dist > 1.3 ? 12 : 0), dir, low: lowGrab });
    }
    // a downed foe: a style that holds sometimes walks in and holds them
    if (opp.state === S.DOWN && snap.state === S.DOWN && styleCanSubmit(this.profile) && !opp.pinnedBy && !opp.submitDone && dist < AI_SUBMIT_APPROACH && f.stam >= SUBMIT_MIN_STAMINA && simRng() < d.grab * AI_SUBMIT_CHANCE) {
      add(AI_SUBMIT_SCORE, { kind: 'submit', ticks: d.lockout + 40, fired: false });
    }
    // sidestep / jump for variety
    if (d.sidestep > 0 && dist < pref + 1 && f.stam > 15) add(0.1 + d.sidestep * st.circle * 0.5, { kind: 'sidestep', ticks: 14, side: simRng() < 0.5 ? -1 : 1 });
    if (d.id !== 'easy' && dist > 1.8 && dist < 2.8 && f.stam > f.maxStam * 0.6) add(0.08 * st.kick * aggr, { kind: 'jumpkick', ticks: 24, t: 0 });
    let best = null, bs = -1;
    for (const o of options) if (o.score > bs) { bs = o.score; best = o.plan; }
    if (best && best.kind === 'attack') { this.lastMoves.push(best.mv.id); if (this.lastMoves.length > 2) this.lastMoves.shift(); }
    return best;
  }

  /* Find a breakable object (preferred) or a wall where a throw in some direction would land the opponent. */
  throwTarget(f, opp) {
    let best = null, bd = 1e9;
    for (const dir of THROW_DIRS) {
      const v = Combat.throwVector(f, dir), dx = v[0], dz = v[1];
      const tx = opp.x + dx * 3.0, tz = opp.z + dz * 3.0;
      const obj = Arena.nearestObject(tx, tz, 1.4, true);
      if (obj) { const dd = Math.hypot(obj.x - tx, obj.z - tz); if (dd < bd) { bd = dd; best = { dir, kind: 'object' }; } }
    }
    if (best) return best;
    const b = Arena.def.bounds;
    for (const dir of THROW_DIRS) {
      const v = Combat.throwVector(f, dir), dx = v[0], dz = v[1];
      const tx = opp.x + dx * 2.6, tz = opp.z + dz * 2.6;
      if (Math.abs(tx) > b.x - 0.4 || Math.abs(tz) > b.z - 0.4) return { dir, kind: 'wall' };
    }
    return null;
  }
  /* True when the thrower's own back is near a wall. */
  cornered(f) {
    const b = Arena.def.bounds, bx = f.x - f.fwdX * 1.4, bz = f.z - f.fwdZ * 1.4;
    return Math.abs(bx) > b.x - 0.5 || Math.abs(bz) > b.z - 0.5;
  }
  /* Deliberate throw choice: scenery or walls first (smarter CPUs), escape a corner by throwing past us, else by style. */
  chooseThrowDir(f, opp) {
    const target = this.d.env ? this.throwTarget(f, opp) : null;
    if (target) return target.dir;
    if (this.cornered(f)) return 'back';                     // the opponent lands in our corner, we face the open floor
    const st = this.profile.style, roll = simRng();
    if (roll < st.heavy * 0.45 + st.grab * 0.25) return 'back';
    if (roll < st.heavy * 0.45 + st.grab * 0.25 + st.circle * 0.35) return simRng() < 0.5 ? 'left' : 'right';
    return 'fwd';
  }

  runPlan(f, opp, it) {
    const p = this.plan;
    if (!p) return;
    p.ticks--;
    switch (p.kind) {
      case 'walk': { let dx = opp.x - f.x, dz = opp.z - f.z; if (p.away) { dx = -dx; dz = -dz; } this.moveToward(f, it, dx, dz, p.run); break; }
      case 'circle': it.side = p.side; it.fwd = p.hold ? clamp((this.profile.range - Math.hypot(opp.x - f.x, opp.z - f.z)) * -1.5, -0.6, 0.6) : 0; break;
      case 'guard':
        if (f.defense === 'sway') this.moveToward(f, it, f.x - opp.x, f.z - opp.z, false);   // no hold-guard: a sway fighter backs off instead
        else { it.defend = true; it.crouch = !!p.low; }   // Crouch + Defend = low guard
        break;
      case 'attack':
        if (!p.fired) { p.fired = true; this.pressMove(it, p.pick); }
        break;
      case 'grab': {
        if (p.fired) break;
        const dx = opp.x - f.x, dz = opp.z - f.z;
        if (!this.inRange(f, ATTACKS.grab, Math.hypot(dx, dz))) { this.moveToward(f, it, dx, dz, false); break; }
        p.fired = true; it.grapple = true; it.grapDir = p.dir;
        if (p.low) it.crouch = true;
        break;
      }
      case 'submit': {
        if (p.fired) break;
        if (opp.state !== S.DOWN) { this.plan = null; break; }
        const dx = opp.x - f.x, dz = opp.z - f.z;
        if (Math.hypot(dx, dz) > SUBMIT_RANGE - 0.15) { this.moveToward(f, it, dx, dz, false); break; }
        p.fired = true; it.grapple = true;
        break;
      }
      case 'sidestep': if (!p.fired) { p.fired = true; it.sidestep = p.side; } break;
      case 'jumpkick':
        p.t++;
        if (p.t === 1) { it.jump = true; it.fwd = 1; }
        if (p.t === 8) it.kick = true;
        break;
      default: break;
    }
  }

  thinkGrapple(f, opp, match, it) {
    if (!this.clinchPlan) this.clinchPlan = { at: 8 + Math.floor(simRng() * 20), knees: this.d.id === 'easy' ? 0 : Math.floor(simRng() * 2.2), done: false, dir: 'pending' };
    const cp = this.clinchPlan;
    if (f.throwPending) return it;
    if (f.clinchTick >= cp.at) {
      if (cp.knees > 0 && f.clinchStrikeCd === 0 && f.stam > 12) { cp.knees--; it.kick = true; cp.at = f.clinchTick + 24; return it; }
      if (!cp.dir || cp.dir === 'pending') cp.dir = this.chooseThrowDir(f, opp);
      const dir = cp.dir;
      it.grapple = true;
      // express the throw direction through movement axes, exactly like a player holding the stick
      it.fwd = dir === 'fwd' ? 1 : dir === 'back' ? -1 : 0; it.side = dir === 'right' ? 1 : dir === 'left' ? -1 : 0;
    }
    return it;
  }
  thinkClinched(f, opp, it, snap) {
    const d = this.d;
    if (this.threatId !== opp.moveId) {
      // a grab that clinched before this AI could react (Hard's delay equals a grab's startup) still gets its one break roll
      this.threatId = opp.moveId;
      if (this.profile && simRng() < d.blockSkill * AI_GRAB_BREAK) this.breakGrabId = opp.moveId;
    }
    if (f.clinchTick < escapeStartFor(f) + 1 || f.escapeLock > 0) return it;
    if (this.breakGrabId === opp.moveId) { this.breakGrabId = -1; it.grapple = true; return it; }
    const tp = opp.throwPending;
    if (tp) {
      // read each throw once: a hit means a timed escape press inside the window, a miss means no press
      if (this.readThrow !== tp) {
        this.readThrow = tp;
        this.willEscape = simRng() < d.escape * AI_THROW_READ;
        this.escapeAt = Math.min(Math.round(d.react * 0.6), tp.data.escapeUntil - 1);
      }
      if (this.willEscape && tp.tick >= this.escapeAt) it.grapple = true;
      return it;
    }
    if (simRng() < d.escape * 0.012) it.grapple = true;
    return it;
  }
}

/* Training dummy: scripted behaviours for practice. */
const DUMMY_MODES = ['stand', 'block', 'blockLow', 'crouch', 'jump', 'walk', 'attackHigh', 'attackLow', 'attackMix', 'blockAfterHit', 'easy', 'normal', 'hard', 'expert'];
const DUMMY_LABEL = { stand: 'Stand still', block: 'Block high', blockLow: 'Block low', crouch: 'Crouch', jump: 'Jump', walk: 'Walk back and forth', attackHigh: 'Attack high', attackLow: 'Attack low', attackMix: 'Attack high or low', blockAfterHit: 'Block after the first hit', easy: 'CPU Easy', normal: 'CPU Normal', hard: 'CPU Hard', expert: 'CPU Expert' };
const DUMMY_SWAY_LABEL = { block: 'Sway at each strike', blockLow: 'Sway at each strike (low too)', blockAfterHit: 'Sway after the first hit' };   // the guard modes of a dummy whose defense is Sway
const dummyLabel = (match) => (match.fighters[1].defense === 'sway' && DUMMY_SWAY_LABEL[match.cfg.dummy]) || DUMMY_LABEL[match.cfg.dummy];
const DUMMY_AI_MODES = ['easy', 'normal', 'hard', 'expert'];
const DUMMY_ATTACK_EVERY = 75;       // ticks between dummy attacks: time to practise blocking and punishing
const DUMMY_ATTACK_RANGE = 1.3;      // the attacking dummy walks in until it is this close
const DUMMY_SWAY_LEAD = 3;           // a swaying dummy lets a strike go active this many ticks into its dodge
const DUMMY_GUARD_TICKS = 40;       // 'block after hit' keeps blocking this long after a hit: only true combos land
class DummyController {
  constructor(profile, mode) { this.profile = profile; this.mode = mode; this.ai = null; this.t = 0; this.guardTicks = 0; this.swayedMoveId = 0; this.setMode(mode); }
  setMode(mode) {
    this.mode = mode;
    this.ai = DUMMY_AI_MODES.includes(mode) ? new AIController(this.profile, mode) : null;
  }
  reset() { if (this.ai) this.ai.reset(); this.t = 0; this.guardTicks = 0; this.swayedMoveId = 0; }
  think(f, opp, match, it) {
    clearIntent(it);
    this.t++;
    if (this.ai) return this.ai.think(f, opp, match, it);
    if (REACTION_STATES.includes(f.state)) this.guardTicks = DUMMY_GUARD_TICKS;
    if (!f.alive || REACTION_STATES.includes(f.state)) return it;
    switch (this.mode) {
      case 'block': this.guard(f, opp, it, false); break;
      case 'blockLow': this.guard(f, opp, it, true); break;
      case 'crouch': it.crouch = true; break;
      case 'jump': if (this.t % 90 === 1) it.jump = true; break;
      case 'walk': it.side = Math.sin(this.t / 50) > 0 ? 1 : -1; break;
      case 'attackHigh': case 'attackLow': case 'attackMix': this.attack(f, opp, it); break;
      case 'blockAfterHit': if (this.guardTicks > 0) { this.guardTicks--; this.guard(f, opp, it, false); } break;
      default: break;
    }
    return it;
  }
  /* The dummy's defense: a Block fighter holds Defend (Crouch + Defend = low guard); a Sway fighter has no hold-guard, so it sways once
     per incoming strike, pressed so the strike goes active DUMMY_SWAY_LEAD ticks into the dodge (a plain dodge, never a perfect one). */
  guard(f, opp, it, low) {
    if (f.defense !== 'sway') { it.defend = true; it.crouch = low; return; }
    const mv = opp.move;
    if (f.state === S.SWAY || opp.state !== S.ATTACK || !mv || mv.type !== 'strike' || opp.moveId === this.swayedMoveId) return;
    const activeIn = opp.mStartup + 1 - opp.moveTick;   // ticks until the strike's first active tick (this tick = 1)
    if (activeIn < 1 || activeIn > DUMMY_SWAY_LEAD + 1) return;
    this.swayedMoveId = opp.moveId;
    it.defend = true;
  }
  /* Walk in, then a jab (high) or a low kick on a steady beat. */
  attack(f, opp, it) {
    if (Math.hypot(opp.x - f.x, opp.z - f.z) > DUMMY_ATTACK_RANGE) { it.fwd = 1; return; }
    if (this.t % DUMMY_ATTACK_EVERY !== 0) return;
    const low = this.mode === 'attackLow' || (this.mode === 'attackMix' && simRng() < 0.5);
    if (low) { it.kick = true; it.height = true; } else it.punch = true;   // the beat is longer than the string window, so these are always step 1
  }
}

/* =====================================================================
   07 MATCH - authoritative simulation (fixed 60 Hz), round rules, game-state manager, game loop.
   Per tick: input -> AI -> fighter logic -> combat -> physics -> world -> animation -> round rules.
   ===================================================================== */
const Match = { current: null };
const DT = FIXED_DT;
const ROUND_BANNER_TICKS = 48;        // "ROUND n" stays readable this long before the count starts
const COUNT_STEP_TICKS = 45;          // one countdown number; round 1 counts from 3, later rounds from 2
const ROUND_END_TICKS = 110;
const KO_DELAY_TICKS = 45;
const KO_SLOW_TICKS = 30;             // slow motion starts on the knock-out blow itself
const SKIP_ARM_TICKS = 30;            // the round-end sequence can be skipped after this long
const TIMER_LOW_SECONDS = 10;         // the round timer turns to the warning colour
const TIMER_BEEP_SECONDS = 5;         // and beeps once a second from here

/* A human player: P1 reads Input, the second Versus player reads Input2. */
const PlayerController = {
  input: Input,
  think(f, opp, match, it) { return Input.fillIntent(it, f, opp); },
  reset() {},
};
const Player2Controller = {
  input: Input2,
  think(f, opp, match, it) { return Input2.fillIntent(it, f, opp); },
  reset() {},
};
const ScriptedController = {
  make(fn) { return { think(f, opp, match, it) { clearIntent(it); fn(it, f, opp, match); return it; }, reset() {} }; },
};

class MatchSim {
  constructor(cfg) {
    this.cfg = Object.assign({ mode: 'free', playerId: 'kai', opponentId: 'mara', arenaId: 'warehouse', difficulty: 'normal', arcadeLevel: 'normal', winsNeeded: 2, timer: 60, seed: 1, playerHp: 1, countdown: true, dummy: 'stand' }, cfg);
    simRng = makeRng(this.cfg.seed);
    this.def = ARENAS[this.cfg.arenaId];
    Arena.build(this.def);
    const p1 = ROSTER_BY_ID[this.cfg.playerId] || ROSTER_BY_ID.kai;
    let p2 = ROSTER_BY_ID[this.cfg.opponentId] || ROSTER_BY_ID.mara;
    if (this.cfg.mode === 'arcade' && p2.bossAttrs) p2 = Object.assign({}, p2, { attrs: p2.bossAttrs[this.cfg.arcadeLevel] || p2.bossAttrs.normal });   // the Arcade final boss, scaled by the difficulty option
    this.fighters = [new Fighter(p1, 0), new Fighter(p2, 1)];
    if (p1.id === p2.id) this.fighters[1].applyLook(alternateLook(p2.look));
    this.training = this.cfg.mode === 'training';
    this.versus = this.cfg.mode === 'versus';
    this.controllers = [PlayerController, this.rivalController(p2)];
    if (!this.versus && !this.training && !this.cfg.evenDamage) this.fighters[1].stats.damage *=(DIFFICULTY[this.cfg.difficulty] || DIFFICULTY.normal).dmg;
    this.intents = [makeIntent(), makeIntent()];
    this.tick = 0;
    this.matchTicks = 0;
    this.round = 0;
    this.wins = [0, 0];
    this.winsNeeded = this.cfg.winsNeeded;
    this.decider = false;
    this.hitStop = 0;
    this.phase = 'countdown';
    this.phaseTicks = 0;
    this.roundTicks = 0;
    this.endTimer = 0;
    this.locked = false;
    this.roundWinner = -1;
    this.matchOver = false;
    this.matchWinner = -1;
    this.slowTicks = 0;
    this.stats = [this.newStats(), this.newStats()];
    this.lastMove = null;
    this.infiniteHp = false;
    this.infiniteStam = false;
    this.lastCountdown = -1;
    this.disposed = false;
    this.unsub = [];
    this.subscribe();
    Match.current = this;
    this.startRound();
  }
  /* Fighter 2: the second player in Versus, the dummy in Training, otherwise the CPU. */
  rivalController(profile) {
    if (this.versus) return Player2Controller;
    return this.training ? new DummyController(profile, this.cfg.dummy) : new AIController(profile, this.cfg.difficulty);
  }
  newStats() { return { damage: 0, taken: 0, hits: 0, blocks: 0, perfect: 0, maxCombo: 0, throws: 0, objects: 0, kos: 0 }; }

  subscribe() {
    const on = (name, fn) => this.unsub.push(Events.on(name, fn));
    on('hit', (e) => {
      const s = this.stats[e.att.index];
      s.damage += e.dmg; s.hits++; s.maxCombo = Math.max(s.maxCombo, e.combo || 1);
      this.stats[e.def.index].taken += e.dmg;
      if (e.att.index === 0 && e.mv && ATTACKS[e.mv.id] && this.lastMove) {
        const lm = this.lastMove, base = ATTACKS[e.mv.id], reacting = e.def.state === S.HIT || e.def.state === S.STAGGER;
        lm.result = 'hit'; lm.dmg = e.dmg;
        lm.adv = frameAdvantage(base, { active: lm.active, recovery: lm.recovery, hitstun: reacting ? e.def.reactDur : base.hitstun });
      }
    });
    on('block', (e) => {
      const s = this.stats[e.def.index];
      s.blocks++; if (e.perfect) s.perfect++;
      if (e.att.index === 0 && this.lastMove) {
        const lm = this.lastMove;
        lm.result = e.sway ? (e.perfect ? 'perfect sway' : 'swayed') : e.perfect ? 'perfect block' : 'blocked';
        lm.adv = e.sway ? null : frameAdvantage(e.mv, { active: lm.active, recovery: lm.recovery, blockstun: e.def.blockStun || e.mv.blockstun });
      }
    });
    on('throw', (e) => { this.stats[e.att.index].throws++; this.stats[e.att.index].damage += e.dmg; this.stats[e.def.index].taken += e.dmg; });
    on('submissionEnd', (e) => { this.stats[e.att.index].damage += e.damage; this.stats[e.def.index].taken += e.damage; });
    on('objBreak', (e) => { if (e.by === 0 || e.by === 1) this.stats[e.by].objects++; });
    on('ko', (e) => { if (e.att) this.stats[e.att.index].kos++; });
    on('attackStart', (e) => {
      if (e.f.index === 0) this.lastMove = { mv: e.mv, startup: e.f.mStartup, active: e.f.mActive, recovery: e.f.mRecovery, result: '-', adv: null, dmg: 0 };
    });
  }
  dispose() {
    this.unsub.forEach((off) => off());
    this.unsub.length = 0;
    this.disposed = true;
    if (Match.current === this) Match.current = null;
  }

  get player() { return this.fighters[0]; }
  get opponent() { return this.fighters[1]; }
  floorHp(f) { return this.training && this.infiniteHp && f.index === 1 ? 1 : 0; }
  /* Damage only counts while the round is being fought: not after a KO or the bell. */
  get live() { return this.phase === 'fight' && !this.locked; }
  get timeLeft() { return this.cfg.timer > 0 && !this.training ? Math.ceil(this.roundTicks / 60) : null; }
  get countFrom() { return this.round === 1 ? 3 : 2; }

  placeFighters(hpFrac) {
    const s = this.def.spawn;
    this.fighters[0].reset(-s, 0, Math.PI / 2, hpFrac, 1);
    this.fighters[1].reset(s, 0, -Math.PI / 2, 1, 1);
    for (const c of this.controllers) c.reset();
    this.intents.forEach(clearIntent);
  }
  startRound() {
    this.round++;
    this.placeFighters(this.round === 1 || this.cfg.mode === 'survival' ? this.cfg.playerHp : 1);   // survival health carries into a drawn round's replay
    this.roundTicks = this.cfg.timer * 60;
    this.hitStop = 0;
    this.endTimer = 0;
    this.locked = false;
    this.roundWinner = -1;
    this.slowTicks = 0;
    this.phaseTicks = 0;
    this.lastCountdown = -1;
    Camera.snapNext = true;
    Inputs.reset();
    this.phase = this.cfg.countdown ? 'countdown' : 'fight';
    Events.emit('roundStart', { round: this.round, match: this });
    if (this.phase === 'fight') Events.emit('fightStart', {});
  }

  /* ----- one fixed simulation tick ----- */
  step() {
    this.tick++;
    this.phaseTicks++;
    switch (this.phase) {
      case 'countdown': this.stepCountdown(); break;
      case 'fight': this.stepFight(); break;
      case 'roundEnd': this.stepRoundEnd(); break;
      default: this.stepIdle(); break;
    }
    Arena.update(DT);
    Debris.update(DT);
    FX.update(DT);
  }
  stepCountdown() {
    const counting = this.phaseTicks - ROUND_BANNER_TICKS;
    const n = this.countFrom - Math.floor(counting / COUNT_STEP_TICKS);
    if (counting >= 0 && n !== this.lastCountdown && n >= 1) { this.lastCountdown = n; Events.emit('countdown', { n }); }
    for (const f of this.fighters) f.animate(DT);
    if (counting >= this.countFrom * COUNT_STEP_TICKS) {
      this.phase = 'fight';
      this.phaseTicks = 0;
      Inputs.reset();
      Events.emit('fightStart', {});
    }
  }
  readIntents() {
    const [a, b] = this.fighters;
    for (let i = 0; i < 2; i++) {
      const f = this.fighters[i], opp = this.fighters[i ^ 1];
      if (this.locked || !f.alive) clearIntent(this.intents[i]);
      else this.controllers[i].think(f, opp, this, this.intents[i]);
    }
    if (this.training) {
      if (this.infiniteStam) { b.stam = b.maxStam; }
      if (this.infiniteHp && b.alive && b.hp < b.maxHp && !REACTION_STATES.includes(b.state) && this.tick % 120 === 0) b.hp = b.maxHp;
    }
    void a;
  }
  stepFight() {
    const [a, b] = this.fighters;
    if (this.hitStop > 0) {
      this.hitStop--;
      for (const f of this.fighters) f.animate(0);
      return;
    }
    this.matchTicks++;
    this.readIntents();
    for (let i = 0; i < 2; i++) this.fighters[i].update(this.intents[i], this.fighters[i ^ 1], this);
    this.resolveCombat();
    this.physics();
    Combat.tickCombos(this.fighters);
    for (const f of this.fighters) f.animate(DT);
    if (this.training) this.trainingMaintenance();
    else this.checkRoundEnd();
    void a; void b;
  }
  resolveCombat() {
    const descs = [];
    for (const att of this.fighters) {
      if (att.state !== S.ATTACK || !att.move) continue;
      const t = att.moveTick;
      if (t > att.mStartup && t <= att.mStartup + att.mActive) {
        const d = Combat.evaluate(att, this.fighters[att.index ^ 1]);
        if (d) descs.push(d);
        if (att.move.type === 'strike') Combat.hitObjects(att, this);
      }
    }
    for (const d of descs) Combat.apply(d, this);
  }
  physics() {
    const [a, b] = this.fighters;
    const air = [a.integrate(DT), b.integrate(DT)];
    Combat.tackle(a, b, this); Combat.tackle(b, a, this);   // body contact of a run, before the bodies are pushed apart
    this.separate(a, b);
    for (let i = 0; i < 2; i++) {
      const f = this.fighters[i];
      Arena.resolveFighter(f);
      f.afterCollision(air[i]);
      Combat.impactCheck(f, this);
    }
  }
  separate(a, b) {
    if (a.state === S.CLINCH || a.state === S.GRAPPLE || b.state === S.CLINCH || b.state === S.GRAPPLE) return;
    if (a.state === S.THROWN || b.state === S.THROWN) return;
    if (Math.abs(a.y - b.y) > 1.25) return;
    let dx = b.x - a.x, dz = b.z - a.z;
    let d = Math.hypot(dx, dz);
    const min = a.radius + b.radius;
    if (d >= min) return;
    if (d < 1e-5) { dx = 1; dz = 0; d = 1; }
    const push = (min - d) / 2;
    a.x -= (dx / d) * push; a.z -= (dz / d) * push;
    b.x += (dx / d) * push; b.z += (dz / d) * push;
  }
  trainingMaintenance() {
    const [a, b] = this.fighters;
    if (!a.alive || !b.alive) {
      this.endTimer++;
      if (this.endTimer > 100) { this.endTimer = 0; this.resetFighters(); }
    }
  }
  resetFighters() {
    this.placeFighters(1);
    Camera.snapNext = true;
    Events.emit('trainingReset', {});
  }
  resetArenaObjects() { Arena.reset(); Events.emit('trainingReset', {}); }
  scenario(n) {
    const [a, b] = this.fighters;
    this.placeFighters(1);
    const bx = this.def.bounds.x;
    if (n === 2) { a.x = -0.55; b.x = 0.55; } else if (n === 3) { b.x = bx - 0.7; a.x = b.x - 1.4; } else if (n === 4) {
      const o = Arena.objects.find((q) => !q.destroyed && q.type !== 'panel') || Arena.objects[0];
      if (o) { b.x = o.x - (o.hx + 1.0); b.z = o.z; a.x = b.x - 1.2; a.z = o.z; }
    } else if (n === 5) { b.stam = b.maxStam * 0.12; this.infiniteStam = false; }   // infinite stamina would refill it at once
    for (const f of this.fighters) { f.prevX = f.x; f.prevZ = f.z; }
    Camera.snapNext = true;
    Events.emit('trainingReset', {});
  }
  setDummy(mode) { this.cfg.dummy = mode; this.controllers[1].setMode(mode); }

  /* ----- round rules ----- */
  checkRoundEnd() {
    const [a, b] = this.fighters;
    if (!a.alive || !b.alive) {
      if (!this.locked) this.slowTicks = KO_SLOW_TICKS;
      this.locked = true;
      this.endTimer++;
      if (this.slowTicks > 0) this.slowTicks--;
      if (this.endTimer >= KO_DELAY_TICKS) this.endRound('ko');
      return;
    }
    if (this.cfg.timer > 0) {
      this.roundTicks--;
      if (this.roundTicks <= 0) { this.roundTicks = 0; this.endRound('time'); return; }
      const whole = this.roundTicks % 60 === 0, seconds = this.roundTicks / 60;
      if (whole && seconds <= TIMER_BEEP_SECONDS) Events.emit('timeWarn', { seconds });
    }
  }
  endRound(reason) {
    const [a, b] = this.fighters;
    let winner = -1;
    if (a.alive && !b.alive) winner = 0;
    else if (b.alive && !a.alive) winner = 1;
    else if (a.alive && b.alive) {
      const ha = a.hp / a.maxHp, hb = b.hp / b.maxHp;
      if (Math.abs(ha - hb) > 0.0005) winner = ha > hb ? 0 : 1;
      else if (this.decider) winner = a.stam >= b.stam ? 0 : 1;
    }
    this.roundWinner = winner;
    if (winner >= 0) this.wins[winner]++; else { this.wins[0]++; this.wins[1]++; }
    if (this.wins[0] >= this.winsNeeded && this.wins[1] >= this.winsNeeded) { this.decider = true; this.winsNeeded = Math.max(this.wins[0], this.wins[1]) + 1; }
    this.matchOver = this.wins[0] >= this.winsNeeded || this.wins[1] >= this.winsNeeded;
    if (this.matchOver) this.matchWinner = this.wins[0] >= this.winsNeeded ? 0 : 1;
    this.phase = 'roundEnd';
    this.phaseTicks = 0;
    this.locked = true;
    Events.emit('roundEnd', { winner, reason, round: this.round, wins: this.wins.slice(), matchOver: this.matchOver, match: this });
  }
  stepRoundEnd() {
    this.hitStopTick();
    this.readIntents();
    for (let i = 0; i < 2; i++) this.fighters[i].update(this.intents[i], this.fighters[i ^ 1], this);
    this.physics();
    for (const f of this.fighters) f.animate(DT);
    if (this.phaseTicks === 60) this.settlePoses(false);
    if (this.phaseTicks === 90) this.settlePoses(true);
    if (this.slowTicks > 0) this.slowTicks--;
    if (this.phaseTicks >= ROUND_END_TICKS) {
      if (this.matchOver) { this.phase = 'matchEnd'; this.phaseTicks = 0; Events.emit('matchEnd', { match: this }); }
      else { this.phase = 'waiting'; Events.emit('nextRound', { match: this }); }
    }
  }
  /* Winner / loser poses for standing fighters; late (true) also catches a thrown fighter that has landed. */
  settlePoses(late) {
    this.fighters.forEach((f, i) => {
      if (!f.alive || TERMINAL_STATES.includes(f.state) || f.airborne || (f.state === S.THROWN && !late)) return;
      f.setState(this.roundWinner === i ? S.VICTORY : S.DEFEAT);
    });
  }
  /* A button press fast-forwards the round-end sequence once it has played for a moment. */
  skipRoundEnd() {
    if (this.phase !== 'roundEnd' || this.phaseTicks < SKIP_ARM_TICKS) return false;
    this.slowTicks = 0;
    this.settlePoses(true);
    this.phaseTicks = Math.max(this.phaseTicks, ROUND_END_TICKS - 1);
    return true;
  }
  hitStopTick() { if (this.hitStop > 0) this.hitStop = 0; }
  stepIdle() {
    for (const f of this.fighters) { f.update(clearIntent(makeIntent()), this.fighters[f.index ^ 1], this); f.animate(DT); }
    this.physics();
  }

  results() {
    const [a, b] = this.fighters;
    return {
      winner: this.matchWinner, wins: this.wins.slice(), rounds: this.round, seconds: Math.round(this.matchTicks / 60),
      stats: this.stats, playerHp: a.hp / a.maxHp, opponentHp: b.hp / b.maxHp, player: a.name, opponent: b.name,
    };
  }
}

/* ---------- headless AI vs AI runner (balance work): no rendering, sound, effects or HUD ---------- */
const SIM_MAX_TICKS = 60 * 60 * 15;   // safety cap: 15 minutes of game time
const SimRunner = {
  /* opts: playerId, opponentId, arenaId, difficulty (both sides) or difficulty1 / difficulty2, seed, winsNeeded, timer.
     Returns the winner (0 / 1, -1 if the cap was reached), duration and damage dealt per move type for each side.
     'other' is damage not carried by a hit or throw: walls, objects and chip damage. */
  run(opts) {
    const cfg = Object.assign({ playerId: 'kai', opponentId: 'mara', arenaId: 'warehouse', difficulty: 'hard', seed: 1, winsNeeded: 2, timer: 60 }, opts);
    if (!ARENAS[cfg.arenaId] || !ROSTER_BY_ID[cfg.playerId] || !ROSTER_BY_ID[cfg.opponentId]) return { error: 'Unknown arena or fighter id' };
    const savedHandlers = Events.handlers, savedReduced = Settings.v.reducedMotion;
    Events.handlers = {};   // only this run's listeners: the menu scene, sound and HUD never see the simulated match
    Settings.v.reducedMotion = false;   // reduced motion shortens hitstop; balance numbers must not depend on a viewer setting
    const damage = [{}, {}];
    const add = (side, type, dmg) => { damage[side][type] = (damage[side][type] || 0) + dmg; };
    let m = null;
    try {
      Events.on('hit', (e) => add(e.att.index, e.kind === 'ground' ? 'ground' : e.mv.cat || 'other', e.dmg));
      Events.on('throw', (e) => add(e.att.index, 'throw', e.dmg));
      m = new MatchSim({ mode: 'free', evenDamage: true, countdown: false, playerId: cfg.playerId, opponentId: cfg.opponentId, arenaId: cfg.arenaId, seed: cfg.seed, winsNeeded: cfg.winsNeeded, timer: cfg.timer });
      m.controllers[0] = new AIController(m.fighters[0].profile, cfg.difficulty1 || cfg.difficulty);
      m.controllers[1] = new AIController(m.fighters[1].profile, cfg.difficulty2 || cfg.difficulty);
      const lost = [0, 0];
      while (m.phase !== 'matchEnd' && m.tick < SIM_MAX_TICKS) {
        const before = [m.fighters[0].hp, m.fighters[1].hp];
        m.step();
        if (m.phase === 'waiting') { m.startRound(); continue; }
        for (let i = 0; i < 2; i++) lost[i] += Math.max(0, before[i] - m.fighters[i].hp);
      }
      for (let i = 0; i < 2; i++) {
        let credited = 0;
        for (const k in damage[i]) credited += damage[i][k];
        const other = lost[i ^ 1] - credited;
        if (other > 0.05) add(i, 'other', other);
        for (const k in damage[i]) damage[i][k] = Math.round(damage[i][k] * 10) / 10;
      }
      return {
        winner: m.matchOver ? m.matchWinner : -1, seconds: Math.round(m.matchTicks / 60), ticks: m.tick, rounds: m.round, wins: m.wins.slice(),
        hpLeft: m.fighters.map((f) => Math.round((f.hp / f.maxHp) * 1000) / 1000), damage, config: cfg,
      };
    } finally {
      if (m) m.dispose();
      Events.handlers = savedHandlers;
      Settings.v.reducedMotion = savedReduced;
    }
  },
};

/* ---------- showcase scene used behind menus ---------- */
const PREVIEW_FIGHTER_SPAN = 2.7;     // metres of fighter (plus margin) the creator preview keeps in view
const PREVIEW_CENTER_Y = 0.95;
const Showcase = {
  arenaId: null, fighters: [], t: 0, solo: false, orbit: 0,
  creator: false, previewFighter: null, previewPose: 'guard', poseClock: 0, userYaw: 0.5, spinHoldUntil: 0,
  previewFocus: [-0.4, 0], previewFreeHeight: 1,     // screen spot (NDC) and free height fraction left by the creator panel
  /* altSolo: the lone fighter wears the alternate colours (P2 picking P1's fighter); a mirror pair always does. */
  set(arenaId, leftId, rightId, solo, altSolo) {
    if (this.arenaId !== arenaId || !Arena.def || Arena.def.id !== arenaId) { Arena.build(ARENAS[arenaId]); this.arenaId = arenaId; }
    this.solo = !!solo;
    this.creator = false;
    const mk = (id, idx, x, yaw, alt) => {
      const profile = ROSTER_BY_ID[id] || ROSTER_BY_ID.kai;
      let f = this.fighters[idx];
      if (!f || f.profile !== profile) f = this.fighters[idx] = new Fighter(profile, idx);
      f.applyLook(alt ? alternateLook(profile.look) : profile.look);
      f.reset(x, 0, yaw);
      f.pose.set(f.motion.guard);
      return f;
    };
    mk(leftId, 0, solo ? 0 : -1.5, solo ? 0 : Math.PI / 2, solo && altSolo);
    if (rightId && !solo) mk(rightId, 1, 1.5, -Math.PI / 2, rightId === leftId);
  },
  /* Character creator: one live fighter, updated in place on every edit (cosmetic only, never simulated). */
  showPreview(profile) {
    if (!this.previewFighter) this.previewFighter = new Fighter(profile, 0);
    const f = this.previewFighter;
    f.profile = profile; f.id = profile.id; f.name = profile.name;
    f.applyLook(profile.look);
    f.motion = makeMotion(profile, f.scale, f.build);   // movement style, attributes and body can all change in the creator
    if (!this.creator) { f.reset(0, 0, 0); f.pose.set(f.motion.guard); this.userYaw = 0.5; this.poseClock = 0; this.previewPose = 'guard'; }
    this.creator = true;
    this.solo = true;
    this.fighters[0] = f;
  },
  endPreview() {
    if (this.fighters[0] === this.previewFighter) this.fighters[0] = null;
    this.creator = false;
  },
  setPreviewPose(pose) { this.previewPose = pose; this.poseClock = 0; },
  turnPreview(angle) { this.userYaw = wrapAngle(this.userYaw + angle); this.spinHoldUntil = this.t + 4; },
  /* Loops the chosen pose by writing state fields directly; the preview fighter is never simulated. */
  drivePreview(f, dt) {
    if (!Settings.v.reducedMotion && this.t > this.spinHoldUntil) this.userYaw = wrapAngle(this.userYaw + dt * 0.45);
    f.yaw = this.userYaw;
    f.vx = f.vz = 0;
    this.poseClock += dt;
    const pose = this.previewPose;
    if (pose === 'guard' || pose === 'victory') { f.state = pose === 'guard' ? S.IDLE : S.VICTORY; f.move = null; return; }
    const mv = pose === 'punch' ? ATTACKS.cross : ATTACKS.roundhouse;
    const length = mv.startup + mv.active + mv.recovery;
    const tick = Math.floor(this.poseClock * 60) % (length + 40);         // 40 ticks of guard between repeats
    if (tick >= length) { f.state = S.IDLE; f.move = null; return; }
    f.state = S.ATTACK; f.move = mv; f.moveTick = tick; f.whiffExtra = 0;
    f.mStartup = mv.startup; f.mActive = mv.active; f.mRecovery = mv.recovery;
  },
  /* Frame the preview fighter inside the screen area the creator panel leaves free. */
  previewCamera(dt) {
    const az = 0.35, tanHalf = Math.tan(Camera.baseFov / 2), aspect = R.cssW / Math.max(1, R.cssH);
    const dist = clamp(PREVIEW_FIGHTER_SPAN / (2 * tanHalf * this.previewFreeHeight), 4.4, 9);
    const halfH = dist * tanHalf, halfW = halfH * aspect;
    const shiftX = -this.previewFocus[0] * halfW, shiftY = -this.previewFocus[1] * halfH;
    Camera.showcase(dt, Math.cos(az) * shiftX, PREVIEW_CENTER_Y + shiftY, -Math.sin(az) * shiftX, dist, az, 0.16);
  },
  update(dt) {
    this.t += dt;
    Arena.update(dt);
    Debris.update(dt);
    FX.update(dt);      // strike trails from the creator's pose preview fade like in a match
    const n = this.solo ? 1 : 2;
    for (let i = 0; i < n; i++) {
      const f = this.fighters[i];
      if (!f) continue;
      if (this.creator) this.drivePreview(f, dt);
      else if (this.solo && !Settings.v.reducedMotion) f.yaw = this.t * 0.7;
      f.prevYaw = f.yaw;
      f.animate(dt);
    }
    if (this.creator) this.previewCamera(dt);
    else if (this.solo) Camera.showcase(dt, 0, 1.0, 0, 4.2, 0.35, 0.18);
    else Camera.showcase(dt, -1.9, 1.0, 0, 7.0, 0.2 + Math.sin(this.t * 0.25) * 0.3, 0.3);
  },
  draw() {
    const n = this.solo ? 1 : 2;
    for (let i = 0; i < n; i++) if (this.fighters[i]) this.fighters[i].draw(1);
  },
};

/* ---------- game state manager ---------- */
const GS = { LOADING: 'LOADING', MENU: 'MENU', CHARSEL: 'CHARSEL', ARENASEL: 'ARENASEL', COUNTDOWN: 'COUNTDOWN', FIGHT: 'FIGHT', PAUSED: 'PAUSED', ROUND_END: 'ROUND_END', VICTORY: 'VICTORY', DEFEAT: 'DEFEAT', RESULTS: 'RESULTS', ERROR: 'ERROR' };
const GS_TRANSITIONS = {
  LOADING: ['MENU', 'ERROR'],
  MENU: ['CHARSEL', 'ERROR'],
  CHARSEL: ['MENU', 'ARENASEL', 'COUNTDOWN', 'ERROR'],
  ARENASEL: ['CHARSEL', 'MENU', 'COUNTDOWN', 'ERROR'],
  COUNTDOWN: ['FIGHT', 'PAUSED', 'MENU', 'ERROR'],
  FIGHT: ['PAUSED', 'ROUND_END', 'MENU', 'ERROR'],
  PAUSED: ['COUNTDOWN', 'FIGHT', 'MENU', 'ERROR'],
  ROUND_END: ['COUNTDOWN', 'VICTORY', 'DEFEAT', 'MENU', 'ERROR'],
  VICTORY: ['RESULTS', 'MENU', 'ERROR'],
  DEFEAT: ['RESULTS', 'MENU', 'ERROR'],
  RESULTS: ['MENU', 'COUNTDOWN', 'CHARSEL', 'ARENASEL', 'ERROR'],
  ERROR: ['MENU'],
};
const SIM_STATES = [GS.COUNTDOWN, GS.FIGHT, GS.ROUND_END, GS.VICTORY, GS.DEFEAT, GS.RESULTS];
const RESULTS_DELAY = 2.6;            // seconds of victory / defeat pose before the results screen
const SKIP_ARM_SECONDS = 0.5;         // presses this soon after a victory / defeat are ignored
const SKIP_ACTIONS = ['punch', 'kick', 'grapple', 'jump'];
const ARCADE_DIFFS = ['easy', 'normal', 'hard', 'hard', 'expert'];
const ARCADE_ARENAS = ['warehouse', 'dojo', 'pit', 'warehouse', 'pit'];
const ARCADE_STAGES = 5;
const ARCADE_LEVELS = ['easy', 'normal', 'hard'];
const ARCADE_LEVEL_SHIFT = { easy: -1, normal: 0, hard: 1 };   // the Arcade difficulty option moves every stage one step
const SURVIVAL_TIMER = 50, SURVIVAL_TIMER_MIN = 30;
const SURVIVAL_HEAL = 0.25, SURVIVAL_HEAL_MIN = 0.1;          // share of max health regained after each win
const SURVIVAL_PEAK = 7;              // wins until the CPU reaches Expert; after that heal and timer keep shrinking
function arcadeDifficulty(stage, level) {
  const i = DIFFICULTY_ORDER.indexOf(ARCADE_DIFFS[stage]) + (ARCADE_LEVEL_SHIFT[level] || 0);
  return DIFFICULTY_ORDER[clamp(i, 0, DIFFICULTY_ORDER.length - 1)];
}
/* Fisher-Yates with the given generator; returns a new array. */
function shuffled(list, rng) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = out[i]; out[i] = out[j]; out[j] = t; }
  return out;
}

const Game = {
  state: GS.LOADING,
  pausedFrom: null,
  acc: 0,
  last: 0,
  alpha: 0,
  match: null,
  run: null,
  selection: { mode: 'arcade', player: 'kai', opponent: 'mara', player2: 'mara', arena: 'warehouse', difficulty: 'easy', rounds: 2, timer: 60, arcadeLevel: 'easy' },   // new players start on the easiest settings
  versus: null,          // Versus session: { score: [P1 wins, P2 wins] }, kept across rematches until the main menu
  endTimer: 0,
  frameAvg: 16,
  rafId: 0,
  errorCount: 0,
  resultsData: null,

  go(next) {
    const allowed = GS_TRANSITIONS[this.state] || [];
    if (!allowed.includes(next)) { Diag.log('warn', 'Rejected game-state transition ' + this.state + ' -> ' + next); return false; }
    const prev = this.state;
    this.state = next;
    this.syncVersusInput();
    Events.emit('gamestate', { from: prev, to: next });
    return true;
  },
  /* P2 reads the keyboard and pads from the Versus fighter select until the main menu. */
  syncVersusInput() { Inputs.setVersus(this.selection.mode === 'versus' && this.state !== GS.MENU && this.state !== GS.LOADING); },

  /* ----- menu flow ----- */
  chooseMode(mode) {
    this.selection.mode = mode;
    if (mode === 'versus') this.versus = { score: [0, 0] };
    this.ensureSelection();
    this.go(GS.CHARSEL);
  },
  /* A deleted custom fighter may still be selected: fall back to built-ins. */
  ensureSelection() {
    const sel = this.selection;
    if (!ROSTER_BY_ID[sel.player]) sel.player = 'kai';
    if (!ROSTER_BY_ID[sel.opponent]) sel.opponent = sel.player === 'mara' ? 'kai' : 'mara';
    if (!ROSTER_BY_ID[sel.player2]) sel.player2 = 'mara';
  },
  chooseArena(id) { this.selection.arena = id; },

  startFromSelection() {
    const sel = this.selection;
    this.endMatch();
    if (sel.mode === 'arcade') this.startArcade(0);
    else if (sel.mode === 'survival') this.startSurvival();
    else if (sel.mode === 'training') this.startTraining();
    else if (sel.mode === 'versus') this.startVersus();
    else this.startFree();
  },
