  opponentsFor(playerId) { return ROSTER.filter((r) => r.id !== playerId).sort((x, y) => x.rank - y.rank); },
  /* Free Fight / Training opponents: the roster plus saved custom fighters. */
  opponentChoices(playerId, allowMirror) { return ROSTER.concat(CustomRoster.profiles()).filter((r) => allowMirror || r.id !== playerId); },
  /* keepRun: next stage or a retry of the same run (continues are counted); otherwise a new run starts. */
  startArcade(stage, keepRun) {
    const sel = this.selection;
    const opponents = this.opponentsFor(sel.player);
    const ladder = opponents.slice(Math.max(0, opponents.length - ARCADE_STAGES)); // custom players still end on ZERO
    const same = keepRun && this.run && this.run.mode === 'arcade' && this.run.player === sel.player;
    if (!same) this.run = { mode: 'arcade', player: sel.player, level: sel.arcadeLevel, continues: 0 };
    Object.assign(this.run, { ladder, stage });
    const opp = ladder[stage];
    this.beginMatch({ mode: 'arcade', playerId: sel.player, opponentId: opp.id, arenaId: ARCADE_ARENAS[stage], difficulty: arcadeDifficulty(stage, this.run.level), arcadeLevel: this.run.level, winsNeeded: 2, timer: 60 });
  },
  startSurvival() {
    const sel = this.selection;
    this.run = { mode: 'survival', player: sel.player, kills: 0, seconds: 0, carryHp: 1, pool: this.opponentChoices(sel.player), order: [], rng: makeRng(Date.now() >>> 0), arenaStart: ARENA_ORDER.indexOf(sel.arena), bestBefore: Progress.d.survivalKills };
    this.nextSurvivalMatch();
  },
  /* Wins past the point where the CPU tops out at Expert. */
  survivalExtra(kills) { return Math.max(0, kills - SURVIVAL_PEAK); },
  nextSurvivalMatch() {
    const r = this.run;
    if (!r.order.length) r.order = shuffled(r.pool, r.rng);   // every lap meets the whole roster (customs too) in a new order
    const opp = r.order.shift();
    const diff = r.kills < 2 ? 'easy' : r.kills < 4 ? 'normal' : r.kills < SURVIVAL_PEAK ? 'hard' : 'expert';
    const arena = ARENA_ORDER[(r.arenaStart + r.kills) % ARENA_ORDER.length];
    const timer = Math.max(SURVIVAL_TIMER_MIN, SURVIVAL_TIMER - 2 * this.survivalExtra(r.kills));
    this.beginMatch({ mode: 'survival', playerId: r.player, opponentId: opp.id, arenaId: arena, difficulty: diff, winsNeeded: 1, timer, playerHp: r.carryHp });
  },
  startTraining() {
    const sel = this.selection;
    const opp = this.opponentsFor(sel.player)[0];
    this.run = { mode: 'training', player: sel.player };
    this.beginMatch({ mode: 'training', playerId: sel.player, opponentId: this.selection.opponent && this.selection.opponent !== sel.player ? this.selection.opponent : opp.id, arenaId: sel.arena, difficulty: 'normal', winsNeeded: 99, timer: 0, countdown: false, dummy: 'stand' });
  },
  startFree() {
    const sel = this.selection;
    this.run = { mode: 'free', player: sel.player };
    this.beginMatch({ mode: 'free', playerId: sel.player, opponentId: sel.opponent, arenaId: sel.arena, difficulty: sel.difficulty, winsNeeded: sel.rounds, timer: sel.timer });
  },
  startVersus() {
    const sel = this.selection;
    if (!this.versus) this.versus = { score: [0, 0] };
    this.run = { mode: 'versus', player: sel.player };
    this.beginMatch({ mode: 'versus', playerId: sel.player, opponentId: sel.player2, arenaId: sel.arena, winsNeeded: sel.rounds, timer: sel.timer });
  },

  beginMatch(cfg) {
    this.endMatch();
    cfg.seed = (Date.now() ^ (this.errorCount * 7919)) >>> 0;
    this.config = cfg;
    this.match = new MatchSim(cfg);
    this.acc = 0;
    this.endTimer = 0;
    this.resultsData = null;
    this.unsubMatch = [
      Events.on('roundEnd', (e) => this.onRoundEnd(e)),
      Events.on('nextRound', () => this.onNextRound()),
      Events.on('matchEnd', () => this.onMatchEnd()),
      Events.on('fightStart', () => { if (this.state === GS.COUNTDOWN) this.go(GS.FIGHT); }),
    ];
    Events.emit('matchCreated', { match: this.match });
    if (this.state === GS.RESULTS || this.state === GS.CHARSEL || this.state === GS.ARENASEL || this.state === GS.PAUSED) this.go(GS.COUNTDOWN);
    else if (this.state !== GS.COUNTDOWN) this.go(GS.COUNTDOWN);
    if (this.match.phase === 'fight' && this.state === GS.COUNTDOWN) this.go(GS.FIGHT);
  },
  endMatch() {
    if (this.unsubMatch) { this.unsubMatch.forEach((off) => off()); this.unsubMatch = null; }
    if (this.match) { this.match.dispose(); this.match = null; }
    Debris.clear(); FX.clear();
    Showcase.arenaId = null;   // the match smashed the arena: the next menu showcase must rebuild it
  },
  /* In Survival a restart abandons the run (no free retries): the record is kept and a new run starts. */
  restartMatch() {
    if (!this.config) return;
    if (this.run && this.run.mode === 'survival') { this.saveSurvivalRecord(); this.startSurvival(); return; }
    // an Arcade retry from the pause menu costs what losing would, so the continues and win-loss records stay honest
    if (this.run && this.run.mode === 'arcade') { Progress.d.losses++; Progress.save(); this.run.continues++; this.startArcade(this.run.stage, true); return; }
    this.beginMatch(Object.assign({}, this.config));
  },
  /* Best streak and time are saved after every win and whenever a run ends, so quitting never loses them. */
  saveSurvivalRecord() {
    const run = this.run;
    if (!run || run.mode !== 'survival') return;
    const unfinished = this.match && !this.match.matchOver ? Math.round(this.match.matchTicks / 60) : 0;
    Progress.d.survivalKills = Math.max(Progress.d.survivalKills, run.kills);
    Progress.d.survivalSeconds = Math.max(Progress.d.survivalSeconds, run.seconds + unfinished);
    Progress.save();
  },
  quitToMenu() {
    this.saveSurvivalRecord();
    this.endMatch();
    this.run = null;
    if (!CreatorUI.returnState) this.versus = null;   // a creator fight preview returns to the creator, so the Versus session score stays
    this.pausedFrom = null;
    if (this.state !== GS.MENU) {
      if (!this.go(GS.MENU)) { this.state = GS.MENU; this.syncVersusInput(); Events.emit('gamestate', { from: 'FORCED', to: GS.MENU }); }
    }
  },

  /* ----- match flow events ----- */
  onRoundEnd(e) {
    if (this.state === GS.FIGHT) this.go(GS.ROUND_END);
    else if (this.state === GS.COUNTDOWN) { this.state = GS.ROUND_END; Events.emit('gamestate', { from: 'COUNTDOWN', to: GS.ROUND_END }); }
  },
  onNextRound() {
    if (!this.match) return;
    this.go(GS.COUNTDOWN);   // first, so a countdown-less round's fightStart can move the state on to FIGHT
    this.match.startRound();
  },
  onMatchEnd() {
    const m = this.match;
    if (!m) return;
    const playerWon = m.matchWinner === 0;
    const run = this.run;
    const data = m.results();
    data.mode = run ? run.mode : 'free';
    data.playerWon = playerWon;
    data.buttons = [];
    if (run && run.mode === 'arcade') {
      data.stage = run.stage + 1; data.stages = run.ladder.length; data.continues = run.continues;
      if (playerWon) {
        Progress.d.wins++;
        const defeated = run.ladder[run.stage];
        if (defeated.id === 'dmitri' || run.stage >= 2) if (Progress.unlock('dmitri')) data.unlocked = 'DMITRI';
        data.newBest = run.stage + 1 > Progress.d.arcadeBest;
        Progress.d.arcadeBest = Math.max(Progress.d.arcadeBest, run.stage + 1);
        if (run.stage + 1 >= run.ladder.length) {
          data.cleared = true; Progress.d.arcadeClears++;
          if (Progress.unlock('zero')) data.unlocked = (data.unlocked ? data.unlocked + ' and ' : '') + 'ZERO';
          const fewest = Progress.d.arcadeFewestContinues;
          if (fewest < 0 || run.continues < fewest) { data.newBest = fewest >= 0 || data.newBest; Progress.d.arcadeFewestContinues = run.continues; }
        }
        Progress.save();
        data.buttons = data.cleared ? ['again', 'menu'] : ['next', 'menu'];
      } else { Progress.d.losses++; Progress.save(); data.buttons = ['retry', 'menu']; }
    } else if (run && run.mode === 'survival') {
      run.seconds += data.seconds;
      if (playerWon) {
        run.kills++;
        const heal = Math.max(SURVIVAL_HEAL_MIN, SURVIVAL_HEAL - 0.02 * this.survivalExtra(run.kills));
        run.carryHp = clamp(m.fighters[0].hp / m.fighters[0].maxHp + heal, 0.3, 1);
        data.newBest = run.kills > run.bestBefore;
        data.buttons = ['next', 'menu'];
      } else {
        data.ended = true;
        data.buttons = ['again', 'menu'];
      }
      data.kills = run.kills; data.survivalSeconds = run.seconds;
      this.saveSurvivalRecord();
    } else if (run && run.mode === 'versus') {
      this.versus.score[m.matchWinner]++;
      data.score = this.versus.score.slice();
      data.buttons = ['again', 'setup', 'menu'];
    } else data.buttons = ['again', 'setup', 'menu'];
    this.resultsData = data;
    this.endTimer = 0;
    this.go(playerWon || data.mode === 'versus' ? GS.VICTORY : GS.DEFEAT);   // Versus always has a winner to celebrate
  },
  resultsAction(kind) {
    const run = this.run;
    if (kind === 'menu') { this.quitToMenu(); return; }
    if (kind === 'setup') { this.endMatch(); this.go(GS.CHARSEL); return; }
    if (kind === 'next') {
      if (run.mode === 'arcade') this.startArcade(run.stage + 1, true);
      else if (run.mode === 'survival') this.nextSurvivalMatch();
      return;
    }
    if (kind === 'retry') { run.continues++; this.startArcade(run.stage, true); return; }
    if (kind === 'again') {
      if (run && run.mode === 'survival') { this.selection.mode = 'survival'; this.startSurvival(); }
      else if (run && run.mode === 'arcade') this.startArcade(0);   // "Play again" after clearing the ladder
      else this.restartMatch();
    }
  },

  /* ----- pause ----- */
  pause() {
    if (this.state !== GS.FIGHT && this.state !== GS.COUNTDOWN) return false;
    this.pausedFrom = this.state;
    return this.go(GS.PAUSED);
  },
  resume() {
    if (this.state !== GS.PAUSED) return false;
    const to = this.pausedFrom || GS.FIGHT;
    Inputs.reset();
    this.pausedFrom = null;
    return this.go(to);
  },

  /* ----- loop ----- */
  start() {
    cancelAnimationFrame(this.rafId);   // never two loops, e.g. when restarting after the error limit
    this.last = performance.now();
    const loop = (now) => {
      this.rafId = requestAnimationFrame(loop);
      try { this.frame(now); } catch (e) { this.fail(e); }
    };
    this.rafId = requestAnimationFrame(loop);
  },
  fail(e) {
    this.errorCount++;
    Diag.log('error', 'Runtime error: ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e));
    if (this.errorCount > 8) { cancelAnimationFrame(this.rafId); }
    if (this.state !== GS.ERROR) {
      this.endMatch();
      this.state = GS.ERROR;
      Events.emit('gamestate', { from: 'ANY', to: GS.ERROR, error: String(e && e.message ? e.message : e) });
    }
  },
  frame(now) {
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (!(dt >= 0)) dt = 0;
    dt = Math.min(dt, MAX_FRAME_DELTA);
    if (dt < 0.1) { this.frameAvg += (dt * 1000 - this.frameAvg) * 0.05; Diag.addFrame(dt * 1000); } // ignore stalls (hidden tab, breakpoints)
    Diag.frameMs = this.frameAvg; Diag.fps = dt > 0 ? 1 / dt : Diag.fps;
    if (Math.abs((window.devicePixelRatio || 1) - R.lastDpr) > 0.01) Quality.apply();
    Inputs.update();
    this.pollMatchInput();
    Quality.adapt(this.frameAvg, dt);
    Events.emit('frame', { dt });
    const t0 = performance.now();
    const st = this.state;
    if (this.match && SIM_STATES.includes(st)) {
      const m = this.match;
      let scale = m.slowTicks > 0 ? 0.35 : 1;
      this.acc += dt * scale;
      let steps = 0;
      while (this.acc >= DT && steps < MAX_STEPS_PER_FRAME && this.match === m) {
        m.step();
        this.acc -= DT;
        steps++;
        if (this.state === GS.PAUSED) break;
      }
      if (steps >= MAX_STEPS_PER_FRAME && this.acc >= DT) { this.acc = 0; Diag.cappedSteps++; }
      this.alpha = clamp(this.acc / DT, 0, 1);
      if ((st === GS.VICTORY || st === GS.DEFEAT) && this.match) {
        this.endTimer += dt;
        if (this.endTimer > RESULTS_DELAY && this.state === st) { this.go(GS.RESULTS); }
      }
    } else if (st === GS.PAUSED && this.match) {
      this.alpha = clamp(this.acc / DT, 0, 1);
    } else if (!this.match) {
      Showcase.update(dt);
    }
    Diag.simMs += (performance.now() - t0 - Diag.simMs) * 0.1;
    this.render(dt);
  },
  /* Pause works in every live phase (countdown and the knock-out lock too); an attack or jump press skips the
     round-end and victory sequences. Presses that arrive too early are dropped so a mashed button cannot skip. */
  pollMatchInput() {
    const st = this.state;
    const reset = Inputs.take('reset');   // gamepad: hold Select
    if (!this.match) return;
    if (reset && st === GS.FIGHT && this.match.training) this.match.resetFighters();
    if ((st === GS.FIGHT || st === GS.COUNTDOWN) && Inputs.take('pause')) { this.pause(); return; }
    if (st !== GS.ROUND_END && st !== GS.VICTORY && st !== GS.DEFEAT) return;
    if (!Inputs.takeAny(SKIP_ACTIONS)) return;
    if (st === GS.ROUND_END) this.match.skipRoundEnd();
    else if (this.endTimer >= SKIP_ARM_SECONDS) this.endTimer = RESULTS_DELAY;
  },
  render(dt) {
    const m = this.match;
    let env;
    if (m && this.state !== GS.LOADING) {
      env = m.def.env;
      Camera.follow(dt, m.fighters[0], m.fighters[1], m.def);
    } else env = Arena.def ? Arena.def.env : DEFAULT_ENV;
    R.begin(env);
    if (m || Arena.def) { Camera.apply(); }
    if (Arena.def) Arena.draw();
    Debris.draw();
    if (m) { for (const f of m.fighters) f.draw(this.alpha); } else Showcase.draw();
    FX.draw();
    R.render();
    Events.emit('rendered', { match: m });
  },
};

/* =====================================================================
   07b EFFECTS - maps combat / environment events to particles and restrained camera impact.
   Intensity is bounded so attacks stay readable; reduced motion lowers it further.
   ===================================================================== */
const COUNTER_COLOR = '#ffd24a';
const RUMBLE_HIT_MS = 110;
const RUMBLE_KO = 0.9, RUMBLE_KO_MS = 400;
const Effects = {
  wired: false,
  init() {
    if (this.wired) return;
    this.wired = true;
    const on = (n, fn) => Events.on(n, fn);
    on('hit', (e) => {
      const tier = e.mv.tier || 1;
      const col = e.counter ? COUNTER_COLOR : e.kind === 'ground' ? '#cfcfcf' : '#ffffff';
      FX.sparks(e.x, e.y, e.z, 5 + tier * 3 + (e.counter ? 4 : 0), 2.2 + tier, col, e.dirx, e.dirz);
      FX.flash(e.x, e.y, e.z, 0.2 + tier * 0.1, '#ffeab5');
      if (tier >= 3 || e.kind === 'knockdown' || e.kind === 'launch') FX.dust(e.def.x, 0.1, e.def.z, 4, 0.4, '#b5ada0');
      Camera.impact(tier >= 3 ? 0.6 : 0.18, tier >= 3 ? 0.5 : 0.15);
      if (e.ko) Camera.impact(1.0, 1.0);
      const hurt = Inputs.forFighter(e.def.index);
      if (hurt && !e.ko) hurt.rumble(0.2 + tier * 0.15, RUMBLE_HIT_MS);   // each human player feels the hits they take on their own pad
    });
    on('block', (e) => {
      if (!e.sway) FX.sparks(e.x, e.y, e.z, e.broke ? 14 : 6, e.broke ? 5 : 3, e.broke ? '#ffb347' : '#9ee7ff', e.dirx, e.dirz);   // a sway dodges the hit: no impact sparks
      FX.ring(e.x, e.y, e.z, e.perfect ? '#ffe066' : '#9ee7ff');
      if (e.perfect) FX.flash(e.x, e.y, e.z, 0.35, '#fff4b0');
      if (e.broke) Camera.impact(0.7, 0.6);
    });
    on('land', (e) => { FX.dust(e.f.x, 0.05, e.f.z, Math.min(10, 3 + Math.floor(e.impact)), 0.5, '#b5ada0'); if (e.impact > 4) Camera.impact(0.3, 0.2); });
    on('knockdown', (e) => FX.dust(e.f.x, 0.05, e.f.z, 6, 0.7, '#b5ada0'));
    on('step', (e) => { if (e.run) FX.dust(e.f.x, 0.05, e.f.z, 1, 0.2, '#b5ada0'); });
    on('sidestep', (e) => FX.dust(e.f.x, 0.05, e.f.z, 3, 0.3, '#b5ada0'));
    on('clinch', (e) => FX.ring(e.x, 0.9, e.z, '#ffffff'));
    on('throw', (e) => { FX.dust(e.x, 0.1, e.z, 8, 0.6, '#b5ada0'); FX.sparks(e.x, 1.0, e.z, 8, 3.5, '#ffffff'); Camera.impact(0.6, 0.5); const thrown = Inputs.forFighter(e.def.index); if (thrown) thrown.rumble(0.7, RUMBLE_HIT_MS * 2); });
    on('escape', (e) => { FX.ring(e.x, 1.0, e.z, '#9cf4ff'); });
    on('submission', (e) => FX.ring(e.x, 0.3, e.z, '#ffffff'));
    on('submissionEscape', (e) => { FX.ring(e.x, 0.6, e.z, '#9cf4ff'); FX.dust(e.x, 0.1, e.z, 4, 0.4, '#b5ada0'); });
    on('tackle', (e) => {
      if (e.result === 'hit') { FX.dust(e.def.x, 0.1, e.def.z, 6, 0.6, '#b5ada0'); Camera.impact(0.7, 0.5); } else FX.ring(e.x, e.y, e.z, e.result === 'blocked' ? '#9ee7ff' : '#ffffff');
    });
    on('ko', (e) => { FX.flash(e.x, e.y, e.z, 0.7, '#ffffff'); FX.sparks(e.x, e.y, e.z, 20, 5, '#ffd27a'); for (const p of Inputs.active()) p.rumble(RUMBLE_KO, RUMBLE_KO_MS); });
    on('wallSlam', (e) => { FX.dust(e.x, 0.6, e.z, 8, 0.5, '#b5ada0'); FX.sparks(e.x, 1.0, e.z, 8, 3, '#ffffff'); Camera.impact(0.7, 0.5); });
    on('envImpact', (e) => { FX.dust(e.x, 0.6, e.z, 8, 0.5, '#b5ada0'); Camera.impact(0.6, 0.4); });
    on('objHit', (e) => { const m = MATERIALS[e.obj.mat]; FX.sparks(e.x, e.y, e.z, e.dmg > 0 ? 6 : 2, 2.5, m ? m.color : '#ffffff'); if (e.dmg > 0 && e.obj.mat === 'concrete') FX.dust(e.x, e.y, e.z, 2, 0.3, '#a8a49b'); });
    on('objStage', (e) => FX.dust(e.x, e.y, e.z, 4, 0.5, '#a89a86'));
  },
};

/* =====================================================================
   08 AUDIO - everything is synthesised with Web Audio (no embedded files).
   The context is created on the first user gesture; voices are capped and throttled.
   ===================================================================== */
const MAX_VOICES = 30;
const MIN_GAP = { punch: 0.035, kick: 0.035, block: 0.04, whoosh: 0.05, step: 0.09, debris: 0.045, grunt: 0.2, objHit: 0.05, menu: 0.03, land: 0.08 };
const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], pentatonic: [0, 2, 4, 7, 9], phrygian: [0, 1, 3, 5, 7, 8, 10] };

const Sound = {
  ctx: null, master: null, musicBus: null, sfxBus: null, comp: null, reverb: null, wet: null, dry: null, noiseBuf: null,
  voices: 0, last: {}, unsupported: false, wired: false, humNode: null, lowpass: null,

  /* Called on any user gesture; safe to call repeatedly. */
  unlock() {
    if (this.unsupported) return;
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { this.unsupported = true; Events.emit('toast', { msg: 'Audio is not supported in this browser', kind: 'warn' }); return; }
        this.ctx = new AC({ latencyHint: 'interactive' });
        this.build();
        // older iOS only opens the output once a sound starts inside the gesture: one silent sample
        const kick = this.ctx.createBufferSource();
        kick.buffer = this.ctx.createBuffer(1, 1, 22050);
        kick.connect(this.ctx.destination);
        kick.start(0);
        this.ctx.onstatechange = () => {
          const state = this.ctx.state;
          if (state === 'suspended' || state === 'interrupted') Diag.log('info', 'Audio context ' + state);
          // iOS suspends or 'interrupts' the context for a phone call, Siri or an alarm: take it back while the page is in front
          if (state !== 'running' && state !== 'closed' && !document.hidden) this.resumeIfAllowed();
        };
      } catch (e) { this.unsupported = true; Diag.log('warn', 'Audio init failed: ' + e.message); return; }
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resumeIfAllowed() { if (this.ctx && this.ctx.state !== 'running' && this.ctx.state !== 'closed') this.ctx.resume().catch(() => {}); },

  build() {
    const c = this.ctx;
    this.master = c.createGain();
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -14; this.comp.ratio.value = 5; this.comp.attack.value = 0.004; this.comp.release.value = 0.18;
    this.musicBus = c.createGain();
    this.sfxBus = c.createGain();
    this.lowpass = c.createBiquadFilter(); this.lowpass.type = 'lowpass'; this.lowpass.frequency.value = 20000;
    this.dry = c.createGain();
    this.wet = c.createGain();
    this.reverb = c.createConvolver();
    this.sfxBus.connect(this.dry); this.sfxBus.connect(this.reverb);
    this.reverb.connect(this.wet);
    this.dry.connect(this.master); this.wet.connect(this.master);
    this.musicBus.connect(this.lowpass); this.lowpass.connect(this.master);
    this.master.connect(this.comp); this.comp.connect(c.destination);
    const len = c.sampleRate * 2;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.setReverb(0.8, 0.2);
    this.applyVolumes();
  },
  setReverb(seconds, wetAmount) {
    if (!this.ctx) return;
    const c = this.ctx, len = Math.floor(c.sampleRate * Math.max(0.2, seconds));
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    this.reverb.buffer = buf;
    this.wet.gain.value = wetAmount;
  },
  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(Settings.v.master, t, 0.03);
    this.sfxBus.gain.setTargetAtTime(Settings.v.sfx, t, 0.03);
    this.musicBus.gain.setTargetAtTime(Settings.v.music * 0.55, t, 0.05);
  },
  setArena(def) {
    if (!this.ctx) return;
    this.setReverb(def.audio.reverb, def.audio.wet);
  },
  duck(on) {
    if (!this.ctx) return;
    this.lowpass.frequency.setTargetAtTime(on ? 700 : 20000, this.ctx.currentTime, 0.08);
  },

  /* ----- voice helpers ----- */
  ready() { return this.ctx && this.ctx.state === 'running'; },
  allow(name, gap) {
    if (!this.ready() || this.voices >= MAX_VOICES) return false;
    const now = this.ctx.currentTime, g = gap !== undefined ? gap : (MIN_GAP[name] || 0.02);
    if (this.last[name] && now - this.last[name] < g) return false;
    this.last[name] = now;
    return true;
  },
  out(pan) {
    if (!pan || typeof this.ctx.createStereoPanner !== 'function') return this.sfxBus;
    const p = this.ctx.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    p.connect(this.sfxBus);
    return p;
  },
  tone(type, f0, f1, dur, gain, delay, pan, dest) {
    if (this.voices >= MAX_VOICES + 12) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + Math.min(0.008, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(dest || this.out(pan));
    this.voices++;
    o.onended = () => { this.voices--; g.disconnect(); };
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(filter, f0, f1, q, dur, gain, delay, pan, dest) {
    if (this.voices >= MAX_VOICES + 12) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    flt.type = filter; flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) flt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);

const MUSIC_FIGHT = 1;            // music intensity tiers: 0 menu, 1 fight, 2 tense fight
const MUSIC_TENSE = 2;
const TENSE_HP_FRACTION = 0.25;   // a fighter below this share of health makes the music tense

  start(track, intensity) {

    };

      // calm menu theme: slow pad + sparse arpeggio
      if (s === 0) { voice('sawtooth', this.note(tr.root, scale, bassDeg[bar * 2 % 8], 2), stepDur * 16, 0.07, 500); voice('sawtooth', this.note(tr.root, scale, bassDeg[bar * 2 % 8] + 2, 2) * 1.004, stepDur * 16, 0.05, 600); }

  },

    } else if (k === 'Escape' || k === 'Backspace') {
      if (e.repeat) return;
      e.preventDefault();
      if (performance.now() < this.guardUntil) return;
      this.back();
    }
  },
  onClick(e) {
    if (performance.now() < this.guardUntil && (this.current === 'pause' || this.current === 'results')) return;
    const t = e.target.closest('[data-act]');
    if (t) { this.act(t.getAttribute('data-act'), t); return; }
    if (e.target.closest('input,textarea')) return;           // text fields and sliders handle themselves
    const opt = e.target.closest('.opt');
    if (opt) this.adjust(opt, 1);
  },
  adjust(el, dir) {
    const creatorKey = el.getAttribute('data-cr');
    if (creatorKey) { CreatorUI.adjust(creatorKey, dir); return; }
    const key = el.getAttribute('data-set');
    if (key) { this.changeSetting(key, dir); return; }
    const local = el.getAttribute('data-local');
    if (local) this.changeLocal(local, dir);
  },
  changeSetting(key, dir) {
    const def = SETTING_DEFS[key];
    const cur = Settings.v[key];
    let next = cur;
    if (def.type === 'num') next = clamp(cur + dir * def.step, def.min, def.max);
    else if (def.type === 'bool') next = !cur;
    else { const i = def.options.indexOf(cur); next = def.options[(i + dir + def.options.length) % def.options.length]; }
    Settings.set(key, next);
    if (['master', 'sfx', 'music'].includes(key)) Sound.applyVolumes();
    if (['quality', 'shadows', 'effects'].includes(key)) Quality.apply();
    if (key === 'uiScale') setTimeout(() => R.resize(), 0);
    if (key === 'sfx') Sound.ui('ok');
    if (key === 'antialias') this.toast('Anti-aliasing changes apply after reloading the page');
    this.rerender(true);
  },
  changeLocal(name, dir) {
    const sel = Game.selection;
    if (name === 'diff') { const i = DIFFICULTY_ORDER.indexOf(sel.difficulty); sel.difficulty = DIFFICULTY_ORDER[(i + dir + 4) % 4]; }
    else if (name === 'rounds') { const list = [1, 2, 3]; sel.rounds = list[(list.indexOf(sel.rounds) + dir + 3) % 3]; }
    else if (name === 'timer') { const list = [30, 60, 90, 0]; sel.timer = list[(list.indexOf(sel.timer) + dir + 4) % 4]; }
    else if (name === 'alevel') { const i = ARCADE_LEVELS.indexOf(sel.arcadeLevel); sel.arcadeLevel = ARCADE_LEVELS[(i + dir + ARCADE_LEVELS.length) % ARCADE_LEVELS.length]; }
    else if (name === 'tscen') { this.scenIdx = (this.scenIdx + dir + SCENARIOS.length) % SCENARIOS.length; }
    else if (name === 'tdummy' && Game.match) { const m = Game.match, i = DUMMY_MODES.indexOf(m.cfg.dummy); m.setDummy(DUMMY_MODES[(i + dir + DUMMY_MODES.length) % DUMMY_MODES.length]); }
    this.rerender(true);
  },
  act(a) {
    Sound.unlock();
    const [name, arg] = a.split(':');
    Sound.ui(name === 'back' ? 'back' : 'ok');
    switch (name) {
      case 'play': this.go('modes'); break;
      case 'controls': this.push('controls'); break;
      case 'settings': this.push('settings'); break;
      case 'credits': this.push('credits'); break;
      case 'moves': this.push('moves'); break;
      case 'back': this.back(); break;
      case 'mode': Game.chooseMode(arg); break;
      case 'pick': this.pickFighter(arg); break;
      case 'confirm': this.confirmFighter(); break;
      case 'opp': if (arg === Game.selection.opponent) { Game.go(GS.ARENASEL); break; } Game.selection.opponent = arg; this.rerender(true); break;
      case 'setupNext': Game.go(GS.ARENASEL); break;
      case 'arena': if (arg === Game.selection.arena) { Game.startFromSelection(); break; } Game.chooseArena(arg); this.menuScene(arg, Game.selection.player, this.rivalId(), false); this.rerender(true); break;
      case 'start': Game.startFromSelection(); break;
      case 'rebind': this.startRebind(Keymap, arg); break;
      case 'rebind2': this.startRebind(Keymap2, arg); break;
      case 'resetKeys': Keymap.resetAll(); this.toast('Keyboard bindings reset'); break;
      case 'resetKeys2': Keymap2.resetAll(); this.toast('P2 keyboard bindings reset'); break;
      case 'resetSettings': Settings.reset(); Sound.applyVolumes(); Quality.apply(); this.rerender(true); break;
      case 'fullscreen': this.toggleFullscreen(); break;
      case 'resume': Game.resume(); break;
      case 'restart': Game.restartMatch(); break;
      case 'quit': Game.quitToMenu(); break;
      case 'res': Game.resultsAction(arg); break;
      case 'selftest': this.runSelfTest(); break;
      case 'tdummy': this.changeLocal('tdummy', 1); break;
      case 'thp': Game.match.infiniteHp = !Game.match.infiniteHp; this.rerender(true); break;
      case 'tstam': Game.match.infiniteStam = !Game.match.infiniteStam; this.rerender(true); break;
      case 'treset': Game.match.resetFighters(); Game.resume(); break;
      case 'tarena': Game.match.resetArenaObjects(); Game.resume(); break;
      case 'tscenGo': Game.match.scenario(this.scenIdx + 1); Game.resume(); break;
      case 'dec': this.changeSetting(arg, -1); break;
      case 'inc': this.changeSetting(arg, 1); break;
      case 'ldec': this.changeLocal(arg, -1); break;
      case 'linc': this.changeLocal(arg, 1); break;
      case 'errmenu':
        this.dom.fatal.hidden = true;
        Game.errorCount = 0;
        Game.start();   // the loop stops after too many errors; start() also cancels a loop that is still running
        Game.quitToMenu();
        break;
      case 'create': CreatorUI.open(this.current === 'char' ? 'char' : 'main'); break;
      case 'editcustom': CreatorUI.openSlot('char', CUSTOM_IDS.indexOf(Game.selection.player)); break;
      default: if (name.startsWith('cr')) CreatorUI.act(name, arg); break;
    }
  },
  /* Versus: P1 picks first, then P2 on the same screen; this is the selection field the fighter cards change. */
  pickKey() { return Game.selection.mode === 'versus' && this.pickSide === 1 ? 'player2' : 'player'; },
  /* The fighter facing P1 in menus: P2's pick in Versus, otherwise the chosen opponent. */
  rivalId() { const sel = Game.selection; return sel.mode === 'versus' ? sel.player2 : sel.opponent; },
  /* Picking the card that is already selected confirms it, so a double click or a second Enter moves on. */
  pickFighter(id) {
    const key = this.pickKey();
    if (id === Game.selection[key]) { this.confirmFighter(); return; }
    Game.selection[key] = id;
    this.showPick();
    this.rerender(true);
  },
  /* The fighter being picked, alone on the stage (P2's mirror pick in the alternate colours). */
  showPick() { const sel = Game.selection, key = this.pickKey(); this.menuScene(sel.arena, sel[key], null, true, key === 'player2' && sel.player2 === sel.player); },
  confirmFighter() {
    const sel = Game.selection;
    if (!Progress.isUnlocked(sel[this.pickKey()])) { Sound.ui('bad'); this.toast('Locked. Win Arcade fights to unlock this fighter.', 'warn'); return; }
    if (sel.mode === 'arcade') Game.startFromSelection();
    else if (sel.mode === 'versus') this.confirmVersusPick();
    else if (sel.mode === 'free' || sel.mode === 'training') { if (sel.mode === 'training' && sel.opponent === sel.player) sel.opponent = Game.opponentsFor(sel.player)[0].id; this.go('setup'); }
    else Game.go(GS.ARENASEL);
  },
  /* Versus: P1's confirm hands the fighter cards to P2; P2's confirm opens the rules. */
  confirmVersusPick() {
    if (this.pickSide === 1) { this.go('setup'); return; }
    this.pickSide = 1;
    this.showPick();
    this.go('char');
  },
  startRebind(keymap, action) {
    const p2 = keymap === Keymap2;
    const btn = this.dom.screens.querySelector('[data-act="' + (p2 ? 'rebind2:' : 'rebind:') + action + '"]');
    if (btn) btn.textContent = 'Press a key... (Esc or pad back cancels)';
    this.say('Press a key for ' + ACTION_LABELS[action] + '. Escape cancels.');
    Inputs.capture((code) => {
      if (code === 'Escape') { this.rerender(true); return; }
      const r = keymap.rebind(action, code);
      this.toast(r.ok ? (p2 ? 'P2 ' : '') + ACTION_LABELS[action] + ' = ' + keyLabel(code) + (r.moved ? '. ' + r.moved : '') : r.msg, r.ok && !r.moved ? '' : 'warn');
      if (!r.ok) Sound.ui('bad');
      this.rerender(true);
    });
  },
  toggleFullscreen() {
    if (!Device.canFullscreen()) { this.toast(Device.fullscreenHint(), 'warn'); return; }
    try {
      if (!Device.fullscreenElement()) {
        const el = document.documentElement;
        const p = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen();
        Promise.resolve(p).then(() => {
          if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['ControlLeft', 'AltLeft', 'KeyW', 'KeyQ', 'KeyE', 'KeyR']).catch(() => {});
          if (Device.touch) Device.lockLandscape(true);
        }).catch(() => this.toast('Fullscreen was blocked by the browser', 'warn'));
      } else {
        if (document.exitFullscreen) document.exitFullscreen(); else document.webkitExitFullscreen();
        if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock();
        Device.lockLandscape(false);
      }
    } catch (err) { this.toast('Fullscreen is not available', 'warn'); }
  },

  statBars(attrs) {

  },

    let h = '<section class="screen on" style="justify-content:flex-end" aria-label="Fighter selection"><div class="panel" style="max-width:min(36em,60vw)"><h2>' + title + '</h2><p class="sub">' + sub + '</p><div class="cards">';

      '<p class="hint">Punch and Kick attack on every press. Press again soon after a move hits or is blocked to play the next move of the string (see the Move list; Auto-assist in Settings lets it go on after a miss); hold Crouch while you press for the low versions. Defend works by your fighter\'s defense type (Block or Sway, shown on its card). Block: ' + DEFENSE_HELP.block + ' Sway: ' + DEFENSE_HELP.sway + ' Press Grapple at close range to clinch (hold Crouch for a low grab, grab from behind for a rear grip); the defender presses Grapple to escape, the attacker holds a direction and presses Grapple to throw that way. Your first clinch shows a hint with the aimed throw and an on-screen arrow (touch: aim with the stick, then GRAB; gamepad: hold the stick or flick the right stick). Press Defend while knocked down for a quick recovery. Press Grapple next to a knocked-down opponent to hold them (' + submissionStyleText() + ' styles): tap Grapple to keep the hold tight, the held fighter taps Defend to escape. Use and Lock on have no effect yet. Gamepad: hold Select in Training to reset. Keys on Ctrl or Alt clash with browser shortcuts (Ctrl + W closes the tab) unless you play in fullscreen.</p>' +

  screen_moves() {
    const adv = (n) => (n > 0 ? '+' : '') + n;
    const pressWords = (keys) => keys.split('').map((k) => (k === 'P' ? 'Punch' : 'Kick')).join(', ');
    const stringInputs = (m) => {   // every press sequence that ends on this move (it is the last step of that row)
      const found = [];
      for (const table of ['stand', 'crouch']) {
        for (const keys in STRINGS[table]) if (STRINGS[table][keys][keys.length - 1] === m.id) found.push((table === 'crouch' ? 'Crouch + ' : '') + pressWords(keys));
      }
      return found.join(' / ');
    };
    const rows = ALL_MOVES.map((m) => {
      const punch = m.btn[1] === 'p';
      let input = m.type === 'grab' ? 'Grapple' : stringInputs(m);
      if (m.ctx === 'air') input = 'In the air: ' + (punch ? 'any punch' : 'any kick');
      else if (m.ctx === 'run') input = 'Running: Punch';
      else if (m.ctx === 'counter') input = 'After a perfect block or sway: ' + (punch ? 'any punch' : 'any kick');
      const fa = frameAdvantage(m);
      const note = [m.kind === 'launch' ? 'launcher' : '', m.kind === 'knockdown' ? 'knockdown' : '', m.kind === 'stagger' ? 'stagger' : '', m.gb ? 'guard break' : '', m.width >= 0.8 ? 'wide arc' : '', m.type === 'grab' ? 'beats blocks' : ''].filter(Boolean).join(', ');
      return '<tr><td>' + esc(m.name) + '</td><td>' + esc(input) + '</td><td>' + (m.type === 'grab' ? '-' : { H: 'High', M: 'Mid', L: 'Low' }[m.h]) + '</td><td>' + m.startup + ' / ' + m.active + ' / ' + m.recovery + '</td><td>' + m.dmg + '</td><td>' + m.stam + '</td><td>' + (m.type === 'grab' ? '-' : adv(fa.onHit) + ' / ' + adv(fa.onBlock)) + '</td><td>' + note + '</td></tr>';
    }).join('');
    let stringRows = '';
    for (const table of ['stand', 'crouch']) {
      for (const keys in STRINGS[table]) stringRows += '<tr><td>' + esc((table === 'crouch' ? 'Crouch + ' : '') + pressWords(keys)) + '</td><td>' + esc(STRINGS[table][keys].map((id) => ATTACKS[id].name).join(' → ')) + '</td></tr>';
    }
    const stringTable = '<table class="ctl"><tr><th>Presses</th><th>Moves</th></tr>' + stringRows + '</table>';
    return '<section class="screen on" aria-label="Move list"><div class="panel wide"><h2>Move list</h2><p class="sub">Frame data at 60 fps. Strong moves cost more stamina and leave you open longer if they miss. There is no hold: Punch and Kick attack on every press, and the strong moves are steps of the attack strings below.</p>' +
      '<table class="ctl"><tr><th>Move</th><th>Input</th><th>Hits</th><th>Start / Active / Recover</th><th>Dmg</th><th>Stam</th><th>Adv hit / block</th><th>Notes</th></tr>' + rows + '</table>' +
      '<h3>Attack strings</h3><p>Press Punch or Kick again soon after the last press (about ' + ATTACK_STRING_SECONDS + ' s, plus the short freeze of each hit), after that move hit or was blocked, to play the next move of the string. A miss, a pause, or getting hit starts over. Strings are up to 3 moves. Hold Crouch at every press for the crouch strings; otherwise the standing strings apply.</p>' +
      stringTable +
      '<h3>Defend: Block or Sway</h3><p>Every fighter has one defense type, shown on its fighter card. <b>Block</b>: ' + esc(DEFENSE_HELP.block) + ' Strong string moves break a block unless it is perfect. <b>Sway</b>: ' + esc(DEFENSE_HELP.sway) + ' A sway fighter has no hold-guard; a Defend press while knocked down still gets up quickly for both types (while held down, Defend presses are escape attempts instead).</p>' +
      '<h3>Clinch and throws</h3><p>Grapple at close range to clinch. The grip depends on position: <b>front</b> (face to face), <b>rear</b> (opponent turned away; harder to escape) or <b>low</b> (you or the opponent crouching). In the clinch, up to two strikes: Kick = knee (drains stamina), Punch = elbow (harder hit); Grapple = throw in the direction you hold. Throws into walls and scenery deal extra damage. The defender escapes with Grapple during the escape window.</p>' +
      '<h3>Holds on a downed opponent</h3><p>Grapple next to a knocked-down opponent starts a hold, for ' + esc(submissionStyleText()) + ' fighters. Damage builds for up to ' + SUBMIT_MAX_TICKS / 60 + ' s. The holder taps Grapple to keep it tight; the held fighter taps Defend to escape, and a tired fighter taps weaker. A hit on the holder breaks the hold. A fighter can be held once per knockdown.</p>' +
      '<h3>Heavy tackle</h3><p>A fighter at least ' + TACKLE_MIN_GAP + ' weight classes (' + esc(WEIGHT_CLASS_NAMES.join(' / ')) + ', from height and build) above its target knocks them back by running into them, with no button. Block stops the charge (no damage), and a Sway or a Sidestep lets it run past. Once per run.</p>' +
      this.throwTable() +
      '<div class="row sticky"><button class="mi" style="width:auto" data-nav data-default data-act="back">Back</button></div></div></section>';
  },
  throwTable() {
    const rows = [];
    for (const grip of ['front', 'rear', 'low']) {
      for (const dir of THROW_DIRS) {
        if (dir === 'left') continue;                       // left and right are mirror images
        const t = THROW_SETS[grip][dir];
        rows.push('<tr><td>' + esc(t.name) + '</td><td>' + GRIP_LABEL[grip].toLowerCase() + ', hold ' + (dir === 'right' ? 'left / right' : DIR_WORD[dir]) + '</td><td>' + t.dmg + '</td><td>' + t.startup + '</td><td>' + t.escapeUntil + '</td><td>' + t.recovery + '</td><td>' + t.stam + '</td></tr>');
      }
    }
    return '<table class="ctl"><tr><th>Throw</th><th>Input</th><th>Dmg</th><th>Startup</th><th>Escape until</th><th>Recovery</th><th>Stam</th></tr>' + rows.join('') + '</table>';
  },
  screen_settings() {
    let h = '<section class="screen on" aria-label="Settings"><div class="panel"><h2>Settings</h2>';
    for (const key in SETTING_DEFS) {
      const def = SETTING_DEFS[key], v = Settings.v[key];
      let text;
      if (def.type === 'num') text = def.max <= 1.5 && key !== 'uiScale' ? Math.round(v * 100) + '%' : '×' + v.toFixed(1);
      else if (def.type === 'bool') text = v ? 'On' : 'Off';
      else text = def.labels ? def.labels[v] : v.charAt(0).toUpperCase() + v.slice(1);
      h += this.optRow(def.label, text, 'data-set="' + key + '"', '<button class="mi" style="display:inline;width:auto;margin:0 .4em;padding:.1em .5em;min-height:0" tabindex="-1" aria-label="decrease" data-act="dec:' + key + '">&#9664;</button>').replace('</span></div>', '<button class="mi" style="display:inline;width:auto;margin:0 0 0 .4em;padding:.1em .5em;min-height:0" tabindex="-1" aria-label="increase" data-act="inc:' + key + '">&#9654;</button></span></div>');
      if (def.hint) h += '<p class="hint" style="margin:.1em 0 .6em">' + esc(def.hint) + '</p>';
    }
    if (!Store.ok) h += '<p class="hint">Browser storage is unavailable: settings and progress will not be kept after closing the page.</p>';

    if (!fullscreen && !Device.standalone()) h += '<p class="hint">' + esc(Device.fullscreenHint()) + '.</p>';
    h += '<div class="row"><button class="mi" style="width:auto" data-nav data-act="back">Back</button>' + (fullscreen ? '<button class="mi" style="width:auto" data-nav data-act="fullscreen">Fullscreen</button>' : '') + '<button class="mi" style="width:auto" data-nav data-act="resetSettings">Reset to defaults</button></div></div></section>';
    return h;
  },
  screen_credits() {
    const p = Progress.d;
    return '<section class="screen on" aria-label="About"><div class="panel wide"><h2>About BREAKPOINT</h2>' +
      '<p>Version ' + VERSION + '. A single-file 3D fighting game: native WebGL 2 rendering, Web Audio synthesis, no external requests.</p>' +
      '<h3>Progress</h3><div class="statgrid"><span>Arcade clears</span><span>' + p.arcadeClears + '</span><span>Best arcade stage</span><span>' + p.arcadeBest + ' / 5</span><span>Best survival streak</span><span>' + p.survivalKills + ' wins</span><span>Unlocked fighters</span><span>' + p.unlocked.length + ' / ' + ROSTER.length + '</span></div>' +
      '<h3>Tips</h3><p>Arenas are destructible: crates splinter, concrete pillars crack and shed chunks, steel railings bend and collapse, glass and paper screens shatter. Throws and knockbacks into scenery cause extra damage and change where you can walk.</p>' +
      '<h3>Compatibility &amp; limits</h3><p>Needs a browser with WebGL 2 (current Chrome, Edge, Firefox, Safari 15+, and mobile Chrome/Safari). Targets 60 FPS on desktop and 30 FPS on mobile; resolution scales automatically when needed. Audio starts after your first click, tap or key press. On iPhone, use Add to Home Screen for full screen; the ring / silent switch can mute the sound. Gamepad support uses the standard mapping; other layouts use a best-effort mapping. Settings are stored in localStorage when the browser allows it.</p>' +
      '<div class="row"><button class="mi" style="width:auto" data-nav data-act="back">Back</button><button class="mi" style="width:auto" data-nav data-act="selftest">Run self-test</button></div><pre id="selftestOut" style="white-space:pre-wrap;font-size:.8em;max-height:14em;overflow:auto"></pre></div></section>';
  },
  screen_pause() {
    const m = Game.match, mode = Game.run ? Game.run.mode : '';
    let h = '<section class="screen on center" style="background:rgba(0,0,0,.55)" aria-label="Paused"><div class="panel"><h2>Paused</h2><nav>' +
      '<button class="mi" data-nav data-default data-act="resume">Resume</button>' +
      (mode === 'survival' ? '<button class="mi" data-nav data-act="restart">Abandon run<small>Your record is kept; a new run starts</small></button>' :
        mode === 'arcade' ? '<button class="mi" data-nav data-act="restart">Retry (uses a continue)<small>Counts as a loss</small></button>' : '<button class="mi" data-nav data-act="restart">Restart match</button>');
    if (m && m.training) {
      h += this.optRow('Dummy', dummyLabel(m),'data-local="tdummy"', '') +
        '<button class="mi" data-nav data-act="thp">Dummy infinite health: ' + (m.infiniteHp ? 'On' : 'Off') + '</button><button class="mi" data-nav data-act="tstam">Dummy infinite stamina: ' + (m.infiniteStam ? 'On' : 'Off') + '</button>' +
        '<button class="mi" data-nav data-act="treset">Reset positions &amp; health<small>Tab</small></button><button class="mi" data-nav data-act="tarena">Reset arena objects<small>F2</small></button>' +
