<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BREAKPOINT">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="BREAKPOINT - a 3D fighting game with destructible arenas. Single self-contained HTML file.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<title>BREAKPOINT</title>
<style>
:root{--ui:1;--panel:rgba(8,12,22,.9);--line:#2f4170;--txt:#eef3ff;--mut:#a9b8da;--a1:#34dcff;--a2:#ff5c93;--ok:#6dff9c;--warn:#ffd24a;--bad:#ff6464;
 /* notch, Dynamic Island and home bar (iPhone with viewport-fit=cover); 0 elsewhere */
 --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--txt);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;inset:0;font-size:calc(16px*var(--ui));touch-action:manipulation}
canvas#view{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
/* ---------- screens / menus ---------- */
#screens{position:absolute;inset:0;pointer-events:none}
/* the transparent border keeps menus out of the safe-area insets while a screen's backdrop still covers them */
.screen{position:absolute;inset:0;display:none;padding:2.2em 2.5em;align-items:center;pointer-events:none;overflow:auto;overscroll-behavior:contain;border:solid transparent;border-width:var(--sat) var(--sar) var(--sab) var(--sal)}
.screen.on{display:flex;pointer-events:auto}
.screen.center{justify-content:center;text-align:center}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:.7em;padding:1.1em 1.3em;min-width:min(26em,92vw);max-width:min(46em,96vw);max-height:calc(92vh - var(--sat) - var(--sab));max-height:calc(92dvh - var(--sat) - var(--sab));overflow:auto;overscroll-behavior:contain;box-shadow:0 .5em 2em rgba(0,0,0,.6)}
.panel.wide{max-width:min(64em,96vw);width:min(64em,96vw)}
h1.logo{padding-right:.12em;font:900 italic clamp(2.4em,9vmin,5em)/1 Impact,"Arial Black",sans-serif;letter-spacing:.06em;margin:0 0 .15em;text-transform:uppercase;background:linear-gradient(90deg,var(--a1),#fff 45%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .06em .06em #000)}
h2{margin:.1em 0 .6em;font:800 1.5em/1.1 Impact,"Arial Black",sans-serif;letter-spacing:.08em;text-transform:uppercase}
h3{margin:.8em 0 .3em;font-size:1em;letter-spacing:.1em;text-transform:uppercase;color:var(--a1)}
p.sub{margin:.2em 0 1em;color:var(--mut)}
button.mi{display:block;width:100%;text-align:left;padding:.65em 1em;margin:.3em 0;background:#111b33;color:var(--txt);border:2px solid #2a3b66;border-radius:.4em;font:inherit;font-weight:800;letter-spacing:.07em;cursor:pointer;min-height:2.8em;text-transform:uppercase}
button.mi small{display:block;font-weight:500;letter-spacing:0;text-transform:none;color:var(--mut)}
button.mi:hover,button.mi:focus-visible,button.mi.sel{outline:3px solid var(--a1);outline-offset:2px;background:#182a55}
button.mi:focus-visible::before,button.mi.sel::before{content:"\25B6  "}
button.mi[disabled],button.mi.locked{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:.8em;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.opt{display:flex;align-items:center;justify-content:space-between;gap:1em;padding:.5em .8em;margin:.25em 0;background:#0f1830;border:2px solid #2a3b66;border-radius:.4em;min-height:2.8em;cursor:pointer}
.opt:focus-visible,.opt:hover{outline:3px solid var(--a1);outline-offset:2px;background:#182a55}
.opt .k{font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.opt .v{font-weight:700;color:var(--a1);min-width:7em;text-align:right}
.opt input[type=range]{width:9em;accent-color:var(--a1)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(10.5em,1fr));gap:.7em;margin:.6em 0}
.card{background:#0f1830;border:2px solid #2a3b66;border-radius:.5em;padding:.6em .7em;cursor:pointer;text-align:left;color:var(--txt);font:inherit;min-height:5em}
.card:hover,.card:focus-visible,.card.sel{outline:3px solid var(--a1);outline-offset:2px;background:#182a55}
.card.locked{opacity:.5}
.card b{display:block;letter-spacing:.1em;font-size:1.1em}
.card em{display:block;font-style:normal;color:var(--mut);font-size:.8em;margin-bottom:.3em}
.stat{display:flex;align-items:center;gap:.4em;font-size:.7em;color:var(--mut)}
.stat span:first-child{width:5em}
.stat i{display:block;height:.55em;background:var(--a1);border-radius:2px}
table.ctl{border-collapse:collapse;width:100%;font-size:.9em}
table.ctl td,table.ctl th{border-bottom:1px solid #2a3b66;padding:.3em .5em;text-align:left;vertical-align:top}
table.ctl th{color:var(--a1);letter-spacing:.08em;text-transform:uppercase;font-size:.8em}
kbd{display:inline-block;padding:.05em .45em;border:1px solid #6d82b8;border-bottom-width:3px;border-radius:.3em;background:#0b1224;font:700 .85em/1.4 Consolas,monospace}
.row.sticky{position:sticky;bottom:-1.1em;background:var(--panel);padding:.5em 0;margin-top:.3em;z-index:2}
.hint{color:var(--mut);font-size:.85em;margin-top:.6em}
.bigtxt{font:900 italic clamp(2em,10vmin,6em)/1 Impact,"Arial Black",sans-serif;letter-spacing:.05em;text-transform:uppercase}
.statgrid{display:grid;grid-template-columns:1fr auto;gap:.2em 1.5em;margin:.6em 0;font-size:1.05em}
.statgrid span:nth-child(odd){color:var(--mut)}
.statgrid span:nth-child(even){text-align:right;font-weight:800}
button.mi small.rec{color:var(--a1)}
.c1{color:var(--a1)}.c2{color:var(--a2)}
.newbest{font:900 italic 1.6em/1 Impact,"Arial Black",sans-serif;letter-spacing:.06em;color:var(--warn);margin:.4em 0}
/* ---------- character creator ---------- */
.screen.creator{justify-content:flex-end;align-items:stretch;padding:1em 1.4em;cursor:grab;touch-action:none}
.panel.cr{width:min(34em,56vw);min-width:min(22em,96vw);max-width:none;max-height:none;display:flex;flex-direction:column;padding:.8em 1em;cursor:auto;touch-action:auto}
.cr-head{display:flex;justify-content:space-between;align-items:baseline;gap:.6em}
.cr-head h2{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr-status{font-size:.75em;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cr-status.dirty{color:var(--warn)}
.tabs{display:flex;gap:.3em;flex-wrap:wrap;margin:.45em 0}
.tab{flex:1 1 4.5em;min-height:44px;padding:.3em .5em;background:#0f1830;color:var(--mut);border:2px solid #2a3b66;border-radius:.4em;font:inherit;font-weight:800;font-size:.78em;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tab[aria-selected=true]{color:var(--txt);background:#182a55;border-color:var(--a1);box-shadow:inset 0 -3px 0 var(--a1)}
.tab:focus-visible,.tab:hover{outline:3px solid var(--a1);outline-offset:2px}
.cr-body{flex:1;min-height:0;overflow:auto;padding:0 .3em .3em 0;animation:crIn .22s ease-out}
@keyframes crIn{from{opacity:0;transform:translateX(.8em)}to{opacity:1;transform:none}}
.cr-body .opt{min-height:44px}
.cr-body .opt .v{display:flex;align-items:center;gap:.5em;justify-content:flex-end}
.cr-foot{display:flex;flex-wrap:wrap;gap:.35em;padding-top:.45em;border-top:1px solid var(--line);margin-top:.35em}
.cr-foot button.mi,.cr-actions button.mi{width:auto;flex:1 1 auto;margin:0;min-height:44px;padding:.4em .6em;font-size:.8em}
.cr-actions{margin:.4em 0;gap:.35em}
.cr-keys{margin:.35em 0 0;font-size:.72em}
.opt.col{flex-wrap:wrap}
.opt .chip{display:inline-block;width:.9em;height:.9em;border-radius:.2em;border:1px solid #fff;vertical-align:-.1em;margin-left:.3em}
.sws{display:flex;flex-wrap:wrap;gap:.3em;width:100%;margin-top:.3em}
.sw{width:44px;height:44px;flex:none;border-radius:.4em;border:2px solid rgba(255,255,255,.35);cursor:pointer;padding:0;position:relative}
.sw:hover{border-color:#fff}
.sw.on{outline:3px solid var(--a1);outline-offset:2px;border-color:#fff}
.sw.on::after{content:"\2713";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1.1em;text-shadow:0 0 3px #000,0 0 3px #000}
.rng{width:8em;min-height:44px;accent-color:var(--a1);cursor:pointer}
.meter{display:inline-block;width:6em;height:.6em;background:#0b1224;border:1px solid #2a3b66;border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--a1)}
.pts{margin:.5em 0;padding:.45em .7em;border:2px solid var(--a1);border-radius:.4em;text-align:center;letter-spacing:.06em}
.pts b{font:900 1.5em/1 Impact,"Arial Black",sans-serif;color:var(--a1);margin-right:.2em}
.pts.zero{border-color:var(--ok)}.pts.zero b{color:var(--ok)}
.cr-derived{font-size:.9em}
.crin{width:100%;font:700 1em/1.3 Consolas,monospace;color:var(--txt);background:#0b1224;border:2px solid #2a3b66;border-radius:.4em;padding:.45em .6em;min-height:44px;user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;letter-spacing:.08em}
.crin:focus{outline:3px solid var(--a1);outline-offset:2px}
textarea.crin{resize:vertical;font-size:.8em;letter-spacing:0;word-break:break-all}
.cr-name{cursor:text}.cr-name .crin{width:auto;flex:1;max-width:14em;text-transform:uppercase}
.card.create{border-style:dashed;border-color:var(--a1)}
.card.create b{color:var(--a1)}
.cr-modal{margin:auto 0;padding:1em;border:2px solid var(--warn);border-radius:.5em;background:#0f1830}
.cr-modal p{font-size:1.1em;margin:.2em 0 .8em}
.hc .sw{border:3px solid #fff}
.hc .tab[aria-selected=true]{background:#000;border-width:3px}
.hc .crin,.hc .cr-modal,.hc .pts{background:#000;border-width:3px}
.reduced .cr-body{animation:none}
@media (orientation:portrait),(max-width:760px){
 .screen.creator{align-items:flex-end;justify-content:center;padding:.5em}
 .panel.cr{width:100%;height:60%;min-width:0}
 .cr-keys{display:none}
}
@media (max-height:520px) and (orientation:landscape){
 .screen.creator{padding:.4em .6em}
 .panel.cr{width:min(36em,66vw);padding:.4em .6em}
 .cr-head h2{font-size:1.1em}
 .tabs,.cr-foot{flex-wrap:nowrap;overflow-x:auto;margin:.25em 0}
 .tab,.cr-foot button.mi{flex:0 0 auto}
 .cr-foot{padding-top:.3em}
 .cr-keys{display:none}
}
/* ---------- HUD ---------- */
#hud{position:absolute;top:var(--sat);right:var(--sar);bottom:var(--sab);left:var(--sal);pointer-events:none;font-weight:800;text-shadow:0 2px 4px #000}
.hud-top{position:absolute;top:.6em;left:.9em;right:.9em;display:flex;gap:1.2em;align-items:flex-start}
.hs{flex:1;min-width:0}
.hs.r{text-align:right}
.hname{font-size:1.05em;letter-spacing:.12em;margin-bottom:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hname b{color:var(--a1)}.hs.r .hname b{color:var(--a2)}
.bar{position:relative;height:1.55em;border:2px solid #fff;background:rgba(0,0,0,.65);overflow:hidden;transform:skewX(-14deg)}
.hs.r .bar{transform:skewX(14deg)}
.bar i,.bar u{position:absolute;inset:0;transform-origin:left;display:block;text-decoration:none}
.hs.r .bar i,.hs.r .bar u{transform-origin:right}
.bar u{background:#ffd24a}
.bar i{background:repeating-linear-gradient(135deg,#46e8ff 0 .6em,#1cb4de .6em 1.2em)}
.hs.r .bar i{background:repeating-linear-gradient(45deg,#ff7aa6 0 .6em,#d62f68 .6em 1.2em)}
.bar b{position:absolute;inset:0;display:flex;align-items:center;padding:0 .6em;font-size:.8em;letter-spacing:.06em;transform:skewX(14deg)}
.hs.r .bar b{justify-content:flex-end;transform:skewX(-14deg)}
.bar.st{height:.8em;margin-top:.25em;border-width:1px;width:70%}
.hs.r .bar.st{margin-left:30%}
.bar.st i{background:#8dff7a}
.bar.st.low i{background:repeating-linear-gradient(90deg,#ffb347 0 .35em,#7a3d00 .35em .7em)}
.bar.st.low{border-style:dashed;border-color:#ffb347}
.bar.mo{height:.4em;margin-top:.2em;border-width:1px;width:70%}
.hs.r .bar.mo{margin-left:30%}
.bar.mo i,.hs.r .bar.mo i{background:#c9b88a}
.bar.mo.on i{background:#ffd24a}
.pips{margin-top:.3em;font-size:.9em;letter-spacing:.2em;min-height:1.2em}
.hc-center{width:7em;text-align:center;flex:none}
#timer{font:900 2.3em/1 Impact,"Arial Black",sans-serif;min-width:1.6em;border:2px solid #fff;background:rgba(0,0,0,.65);padding:.05em .2em;display:inline-block}
#timer.low{color:var(--warn);border-color:var(--warn)}
#roundlbl{font-size:.8em;letter-spacing:.12em;margin-top:.2em;text-transform:uppercase}
#combo,#combo2{position:absolute;left:1.2em;top:7.5em;font:900 italic 1.6em/1.1 Impact,"Arial Black",sans-serif;color:#ffe066;opacity:0;transition:opacity .15s}
#combo2{left:auto;right:1.2em;text-align:right}
#combo.on,#combo2.on{opacity:1}
#combo small,#combo2 small{display:block;font-size:.55em;font-family:inherit;color:#fff;letter-spacing:.1em}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font:900 italic clamp(2.2em,12vmin,7em)/1 Impact,"Arial Black",sans-serif;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 .05em .1em #000,0 0 .3em #000;opacity:0}
#banner.on{opacity:1}
#banner small{display:block;font-size:.3em;letter-spacing:.2em;margin-top:.3em;font-style:normal;font-family:"Segoe UI",system-ui,sans-serif}
#warn,#warn2{position:absolute;left:1.2em;bottom:1.2em;font-size:1em;letter-spacing:.1em;color:#ffb347;border:2px dashed #ffb347;padding:.2em .7em;background:rgba(0,0,0,.6);opacity:0}
#warn2{left:auto;right:1.2em;bottom:4.4em}
#warn.on,#warn2.on{opacity:1;animation:blink 1s steps(2) infinite}
.reduced #warn.on,.reduced #warn2.on{animation:none}
@keyframes blink{50%{opacity:.45}}
#grappleHint,#grappleHint2{position:absolute;left:50%;transform:translateX(-50%);bottom:5.5em;padding:.4em 1em;border:2px solid #fff;background:rgba(0,0,0,.7);letter-spacing:.08em;font-size:1.05em;text-align:center}
.vs #grappleHint{left:1em;transform:none;max-width:46%;border-color:var(--a1)}
#grappleHint2{left:auto;right:1em;transform:none;max-width:46%;border-color:var(--a2)}
#onboard{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);max-width:92vw;padding:.7em 1.2em;background:rgba(0,0,0,.82);border:2px solid var(--a1);border-radius:.4em;pointer-events:auto;cursor:pointer;text-align:left;line-height:1.6}
#onboard h3{margin:0 0 .3em;text-align:center;letter-spacing:.12em}#onboard small{display:block;text-align:center;color:var(--mut);margin-top:.3em}
#grappleHint.go,#grappleHint2.go{border-color:var(--warn);color:var(--warn);font-size:1.25em}
#training{position:absolute;right:.9em;top:6.2em;width:15em;padding:.5em .7em;background:rgba(0,0,0,.65);border:1px solid #6d82b8;font-size:.8em;line-height:1.5;text-align:left}
#training b{color:var(--a1)}
#modeinfo{position:absolute;top:5.1em;left:0;right:0;text-align:center;font-size:.85em;letter-spacing:.14em;color:var(--mut)}
#pauseBtn{position:absolute;right:.9em;bottom:1em;pointer-events:auto;font:inherit;font-weight:800;padding:.35em .9em;min-width:44px;min-height:44px;background:rgba(0,0,0,.6);color:#fff;border:2px solid #fff;border-radius:.4em;cursor:pointer;letter-spacing:.1em}
/* name tags and damage pops use canvas coordinates: undo the HUD's safe-area inset */
#tags{position:absolute;top:calc(-1*var(--sat));right:calc(-1*var(--sar));bottom:calc(-1*var(--sab));left:calc(-1*var(--sal));overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font-size:.8em;letter-spacing:.1em;padding:.1em .5em;background:rgba(0,0,0,.6);border:1px solid #fff;transform:translate(-50%,-100%);will-change:transform}
.tag.p1{border-color:var(--a1)}
.tag.p2{border-color:var(--a2)}
.tag i{font-style:normal;color:#ffe066;margin-left:.4em}
.pop{position:absolute;left:0;top:0;white-space:nowrap;font:900 italic 1.3em/1 Impact,"Arial Black",sans-serif;letter-spacing:.04em;will-change:transform,opacity;text-shadow:0 2px 3px #000,0 0 4px #000}
.hc .bar{border-width:3px;background:#000}
.hc .bar.mo{border-width:1px;height:.6em}
.hc .tag,.hc #timer,.hc #grappleHint,.hc #grappleHint2,.hc #training,.hc #warn,.hc #warn2{background:#000;border-width:3px}
.hc .pop{-webkit-text-stroke:2px #000}
/* ---------- touch ---------- */
#touch{position:absolute;top:var(--sat);right:var(--sar);bottom:var(--sab);left:var(--sal);pointer-events:none;touch-action:none}
#touch .tb,#touch #stickBase{position:absolute;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tb{width:var(--tbs);height:var(--tbs);border-radius:50%;background:rgba(18,28,50,.55);border:3px solid rgba(255,255,255,.6);color:#fff;font:800 calc(var(--tbs)*.26)/1 "Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;letter-spacing:.02em}
.tb.on{background:rgba(52,220,255,.55)}
.tb.lg{width:calc(var(--tbs)*1.25);height:calc(var(--tbs)*1.25);font-size:calc(var(--tbs)*.24)}
.tb.sm{width:calc(var(--tbs)*.8);height:calc(var(--tbs)*.8);font-size:calc(var(--tbs)*.17)}
/* the button and stick positions come from TOUCH_LAYOUT (touchLayoutCss, injected by buildTouch) */
#stickBase{border-radius:50%;background:rgba(18,28,50,.4);border:3px solid rgba(255,255,255,.5)}
#stickKnob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid #fff}
/* ---------- overlays ---------- */
#toast{position:absolute;left:50%;top:calc(1em + var(--sat));transform:translateX(-50%);max-width:90vw;pointer-events:none;z-index:30}
.toast{background:rgba(0,0,0,.85);border:2px solid var(--a1);padding:.45em 1em;margin-top:.4em;border-radius:.4em;font-weight:700;text-align:center}
.toast.warn{border-color:var(--warn)}.toast.err{border-color:var(--bad)}
#touch:not([hidden])~#diag{pointer-events:none}
#diag{position:absolute;left:calc(.5em + var(--sal));bottom:calc(.5em + var(--sab));max-width:min(36em,96vw);max-height:60vh;max-height:60dvh;overflow:auto;font:12px/1.4 Consolas,monospace;background:rgba(0,0,0,.78);border:1px solid #6d82b8;padding:.5em .7em;pointer-events:auto;z-index:20;white-space:pre-wrap;user-select:text}
#fatal{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:1.5em}
#fatal .panel{border-color:var(--bad)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:25}
#fade.on{opacity:1}
.reduced *{transition:none!important;animation:none!important}
.reduced #combo,.reduced #combo2{transition:none}
@media (max-width:700px){.screen{padding:1em}.panel{padding:.8em .9em}}
@media (max-height:520px){.screen{padding:.6em 1em}h1.logo{font-size:2.2em}button.mi{padding:.4em .9em;min-height:2.3em;margin:.2em 0}}
</style>
</head>
<body>
<div id="app" role="application" aria-label="BREAKPOINT fighting game">
  <canvas id="view" tabindex="-1" aria-label="Game view"></canvas>
  <div id="hud" hidden>
    <div class="hud-top">

/* ---------- matrices (column-major Float32Array(16)) ---------- */

/* Matrix stack used for hierarchical (skeletal) drawing. No per-frame allocation. */
class MatStack {
  constructor(depth) {

  reset(base) { this.m.set(base); this.top = 0; }

const SETTING_DEFS = {

  music: { type: 'num', min: 0, max: 1, step: 0.05, def: 0.5, label: 'Music volume' },

const Settings = {
  v: {},
  validate(key, value) {

/* ---------- progress (selective persistence) ---------- */
const DEFAULT_UNLOCKED = ['kai', 'mara', 'brutus', 'yuki'];

const Progress = {
  d: null,
  fresh() { return { unlocked: DEFAULT_UNLOCKED.slice(), arcadeClears: 0, arcadeBest: 0, arcadeFewestContinues: -1, wins: 0, losses: 0, survivalKills: 0, survivalSeconds: 0, seenControls: { keyboard: false, gamepad: false, touch: false }, seenClinch: false, seenHold: false, controlsRevision: KEYS_REVISION }; },
  init() {
    const base = this.fresh();
    const s = readJson(KEY_PROGRESS) || {};
    const num = (v, max) => clamp(Math.floor(finite(Number(v), 0)), 0, max);
    base.arcadeClears = num(s.arcadeClears, 999);
    base.arcadeBest = num(s.arcadeBest, 5);
    // -1 = no clear yet (older saves have no such field)
    base.arcadeFewestContinues = base.arcadeClears > 0 && typeof s.arcadeFewestContinues === 'number' && s.arcadeFewestContinues >= 0 ? num(s.arcadeFewestContinues, 999) : -1;
    base.wins = num(s.wins, 999999);
    base.losses = num(s.losses, 999999);
    base.survivalKills = num(s.survivalKills, 9999);
    base.survivalSeconds = num(s.survivalSeconds, 999999);
    // a save from before the current controls (no revision = 1.0.0) shows the controls card once more and a toast; saved at once, so both happen once
    const oldControls = Object.keys(s).length > 0 && num(s.controlsRevision, 999) < KEYS_REVISION;
    // the first-match controls card was shown, once per input type; an older save held one flag for the card (any device), which counts for all three
    for (const kind of CONTROL_CARD_KINDS) base.seenControls[kind] = !oldControls && (s.seenControls === true || (!!s.seenControls && s.seenControls[kind] === true));
    base.seenClinch = s.seenClinch === true;   // the clinch instructions were shown (they appear in the first clinch only)
    base.seenHold = s.seenHold === true;       // the same for the submission hold instructions
    if (Array.isArray(s.unlocked)) for (const id of s.unlocked) if (typeof id === 'string' && ['dmitri', 'zero'].includes(id) && !base.unlocked.includes(id)) base.unlocked.push(id);

    if (oldControls) { this.save(); controlsChanged = true; }
  },
  save() { Store.set(KEY_PROGRESS, JSON.stringify(this.d)); },
  unlock(id) {
    if (this.d.unlocked.includes(id)) return false;
    this.d.unlocked.push(id);
    this.save();

  },

};

  ios: /iPhone|iPad|iPod/.test(navigator.userAgent || '') || (/Macintosh/.test(navigator.userAgent || '') && (navigator.maxTouchPoints || 0) > 1),
  /* Started from the Home Screen: already full screen, with no browser bars. */
  standalone() { return navigator.standalone === true || (typeof matchMedia === 'function' && matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches); },
  /* iPhone Safari has no element fullscreen at all; iPad Safari only has the webkit-prefixed one. */
  canFullscreen() {
    const el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen) && (document.fullscreenEnabled || document.webkitFullscreenEnabled) === true;
  },
  fullscreenElement() { return document.fullscreenElement || document.webkitFullscreenElement || null; },
  fullscreenHint() {
    if (this.standalone()) return 'Already full screen';
    return this.ios ? 'For full screen, tap Share, then Add to Home Screen, and start BREAKPOINT from there' : 'Fullscreen is not available here';
  },
  /* Landscape lock where the browser has one (Android in fullscreen); iOS has no lock, so failures stay silent. */
  lockLandscape(on) {
    const orient = screen.orientation;
    try {
      if (on && orient && typeof orient.lock === 'function') Promise.resolve(orient.lock('landscape')).catch(() => {});

/* ---------- GPU class detection (before the real context so MSAA can be chosen) ---------- */
const WEAK_GPU = /Intel|Mali|Adreno|PowerVR|SwiftShader|llvmpipe|Microsoft Basic|Mesa|Apple GPU|Vivante|Tegra/i;
const GPU = {
  renderer: '',
  tier: 'high',
  mobile: false,
  detect() {
    this.mobile = (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches) || /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent || '') || Device.ios;
    try {
      const probe = document.createElement('canvas').getContext('webgl2', { antialias: false });
      if (probe) {
        const info = probe.getExtension('WEBGL_debug_renderer_info');
        this.renderer = String(info ? probe.getParameter(info.UNMASKED_RENDERER_WEBGL) : probe.getParameter(probe.RENDERER));
        const lose = probe.getExtension('WEBGL_lose_context');
        if (lose) lose.loseContext();
      }
    } catch (e) { this.renderer = ''; }
    this.tier = this.mobile || WEAK_GPU.test(this.renderer) ? 'low' : 'high';
  },
  /* MSAA costs 2-4 ms per frame on integrated GPUs; it is only enabled where it is cheap or explicitly requested. */
  wantsAntialias() {
    const aa = Settings.v.antialias, q = Settings.v.quality;
    if (aa === 'on') return true;
    if (aa === 'off') return false;
    if (q === 'low' || q === 'medium') return false;
    if (q === 'high') return true;
    return this.tier === 'high';
  },
};

const R = {
  canvas: null, gl: null, ok: false, lost: false, error: '',
  prog: null, u: {}, meshes: [], batches: [],
  vp: M4.create(), proj: M4.create(), view: M4.create(),
  camPos: [0, 3, 8], projScale: 1,
  env: DEFAULT_ENV, lightFrom: [-0.4, -0.8, -0.45],
  scale: 1, dprCap: 2, shadowMode: 2, antialias: false, width: 2, height: 2, cssW: 2, cssH: 2, lastDpr: 1,
  stats: { draws: 0, instances: 0, culled: 0 },
  scratch: M4.create(),
  listeners: [],

  init(canvas) {
    this.canvas = canvas;
    let gl = null;
    GPU.detect();
    const aa = GPU.wantsAntialias();
    try {
      gl = canvas.getContext('webgl2', { antialias: aa, stencil: true, alpha: false, depth: true, powerPreference: 'high-performance' });
    } catch (e) { gl = null; }
    if (!gl) {
      try { gl = canvas.getContext('webgl2', { antialias: false, stencil: true, alpha: false }); } catch (e) { gl = null; }
    }
    if (!gl) { this.error = 'WebGL 2 is not available in this browser or has been disabled.'; return false; }
    this.gl = gl;
    this.antialias = !!(gl.getContextAttributes && (gl.getContextAttributes() || {}).antialias);
    if (!this.listeners.length) {
      const add = (type, fn) => { canvas.addEventListener(type, fn, false); this.listeners.push([type, fn]); };
      add('webglcontextlost', (e) => { e.preventDefault(); this.lost = true; Diag.log('warn', 'WebGL context lost'); Events.emit('glLost'); });

        try { this.buildGL(); this.lost = false; this.resize(); Diag.log('info', 'WebGL context restored'); Events.emit('glRestored'); }
        catch (err) { this.error = err.message; Events.emit('glFailed'); }
      });
    }
    try { this.buildGL(); } catch (e) { this.error = e.message; return false; }
    this.ok = true;
    return true;
  },

  compile(type, src) {
    const gl = this.gl;
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      const log = gl.getShaderInfoLog(sh) || 'unknown error';
      gl.deleteShader(sh);
      throw new Error('Shader compile failed: ' + log);
    }
    return sh;
  },

  buildGL() {
    const gl = this.gl;
    const vs = this.compile(gl.VERTEX_SHADER, VERT_SRC);
    const fs = this.compile(gl.FRAGMENT_SHADER, FRAG_SRC);
    const prog = gl.createProgram();
    gl.attachShader(prog, vs); gl.attachShader(prog, fs);
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error('Shader link failed: ' + gl.getProgramInfoLog(prog));
    gl.deleteShader(vs); gl.deleteShader(fs);
    this.prog = prog;
    this.u = {};
    for (const n of ['uVP', 'uLightFrom', 'uMode', 'uFloor', 'uCam', 'uLightTo', 'uLightCol', 'uSky', 'uGround', 'uFogCol', 'uRim', 'uFog', 'uPL0', 'uPL1', 'uPC0', 'uPC1', 'uShadowCol']) this.u[n] = gl.getUniformLocation(prog, n);
    // static meshes
    const defs = [buildCube(), buildSphere(10, 14), buildCylinder(16), buildShard()];
    this.meshes = defs.map((d) => {
      const vbo = gl.createBuffer(), ibo = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferData(gl.ARRAY_BUFFER, d.v, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, d.i, gl.STATIC_DRAW);
      return { vbo, ibo, count: d.i.length };
    });
    // batches: one instance buffer + VAO per (layer, mesh), reused every frame
    const old = this.batches;
    this.batches = [];
    for (let layer = 0; layer < 4; layer++) {
      for (let mesh = 0; mesh < 4; mesh++) {
        const prev = old[layer * 4 + mesh];
        const data = prev ? prev.data : new Float32Array(INST_FLOATS * 128);
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const m = this.meshes[mesh];
        gl.bindBuffer(gl.ARRAY_BUFFER, m.vbo);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
        gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, m.ibo);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        for (let k = 0; k < 4; k++) { gl.enableVertexAttribArray(2 + k); gl.vertexAttribPointer(2 + k, 4, gl.FLOAT, false, 96, k * 16); gl.vertexAttribDivisor(2 + k, 1); }
        gl.enableVertexAttribArray(6); gl.vertexAttribPointer(6, 4, gl.FLOAT, false, 96, 64); gl.vertexAttribDivisor(6, 1);
        gl.enableVertexAttribArray(7); gl.vertexAttribPointer(7, 4, gl.FLOAT, false, 96, 80); gl.vertexAttribDivisor(7, 1);
        gl.bindVertexArray(null);
        this.batches.push({ layer, mesh, data, count: 0, buf, vao, cap: data.length / INST_FLOATS });
      }
    }
    gl.enable(gl.DEPTH_TEST);
    gl.depthFunc(gl.LEQUAL);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  },

  /* ----- sizing / quality ----- */
  resize() {
    if (!this.canvas) return;
    const rect = this.canvas.getBoundingClientRect();
    this.cssW = Math.max(2, rect.width); this.cssH = Math.max(2, rect.height);
    this.lastDpr = window.devicePixelRatio || 1;
    const dpr = Math.min(this.lastDpr, this.dprCap);
    const w = Math.max(2, Math.floor(this.cssW * dpr * this.scale));
    const h = Math.max(2, Math.floor(this.cssH * dpr * this.scale));
    if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
    this.width = w; this.height = h;
  },
  setQuality(scale, dprCap, shadowMode) {
    this.scale = scale; this.dprCap = dprCap; this.shadowMode = shadowMode;
    this.resize();
  },

  /* ----- frame ----- */
  begin(env) {
    this.env = env || DEFAULT_ENV;
    const L = this.env.lightTo;
    const len = Math.hypot(L[0], L[1], L[2]) || 1;
    this.lightFrom[0] = -L[0] / len; this.lightFrom[1] = -L[1] / len; this.lightFrom[2] = -L[2] / len;
    for (let i = 0; i < this.batches.length; i++) this.batches[i].count = 0;
    this.stats.draws = 0; this.stats.instances = 0; this.stats.culled = 0;
  },

  setCamera(view, proj, pos) {
    this.view.set(view); this.proj.set(proj);
    M4.mul(this.vp, proj, view);
    this.camPos[0] = pos[0]; this.camPos[1] = pos[1]; this.camPos[2] = pos[2];
    this.projScale = Math.abs(proj[5]);
  },

  /* Queue one instance. m is a model matrix (Float32Array(16)). */
  push(layer, mesh, m, col, a, em, rough, flash, cast) {
    const vp = this.vp;
    const cx = m[12], cy = m[13], cz = m[14];
    const sx = m[0] * m[0] + m[1] * m[1] + m[2] * m[2], sy = m[4] * m[4] + m[5] * m[5] + m[6] * m[6], sz = m[8] * m[8] + m[9] * m[9] + m[10] * m[10];
    const rad = 0.9 * Math.sqrt(Math.max(sx, sy, sz));
    const w = vp[3] * cx + vp[7] * cy + vp[11] * cz + vp[15];
    if (w < -rad) { this.stats.culled++; return; }
    if (w > 0.01) {
      const nx = (vp[0] * cx + vp[4] * cy + vp[8] * cz + vp[12]) / w;
      const ny = (vp[1] * cx + vp[5] * cy + vp[9] * cz + vp[13]) / w;
      const rw = (rad * this.projScale * 1.6) / w;
      if (Math.abs(nx) > 1.15 + rw || Math.abs(ny) > 1.15 + rw) { this.stats.culled++; return; }
    }
    const b = this.batches[layer * 4 + mesh];
    if (b.count >= b.cap) {
      const bigger = new Float32Array(b.data.length * 2);
      bigger.set(b.data);
      b.data = bigger; b.cap *= 2;
    }
    const d = b.data, o = b.count * INST_FLOATS;
    for (let i = 0; i < 16; i++) d[o + i] = m[i];
    d[o + 16] = col[0]; d[o + 17] = col[1]; d[o + 18] = col[2]; d[o + 19] = a;
    d[o + 20] = em; d[o + 21] = rough; d[o + 22] = flash; d[o + 23] = cast ? 1 : 0;
    b.count++;
  },

  /* Convenience: translate / euler-rotate / scale a primitive. */
  put(layer, mesh, x, y, z, sx, sy, sz, rx, ry, rz, col, a, em, rough, cast, flash) {
    const m = this.scratch;
    m[0] = 1; m[1] = 0; m[2] = 0; m[3] = 0; m[4] = 0; m[5] = 1; m[6] = 0; m[7] = 0;
    m[8] = 0; m[9] = 0; m[10] = 1; m[11] = 0; m[12] = x; m[13] = y; m[14] = z; m[15] = 1;
    if (ry) M4.rotY(m, ry);
    if (rx) M4.rotX(m, rx);
    if (rz) M4.rotZ(m, rz);
    M4.scale(m, sx, sy, sz);
    this.push(layer, mesh, m, col, a, em, rough, flash || 0, cast);
  },
  box(layer, x, y, z, sx, sy, sz, ry, col, em, rough, cast) {
    this.put(layer, MESH.CUBE, x, y, z, sx, sy, sz, 0, ry || 0, 0, col, 1, em || 0, rough === undefined ? 0.7 : rough, cast, 0);
  },

  uploadAndDraw(layer, shadow) {
    const gl = this.gl;
    for (let mesh = 0; mesh < 4; mesh++) {
      const b = this.batches[layer * 4 + mesh];
      if (!b.count) continue;
      gl.bindVertexArray(b.vao);
      if (!shadow) {
        gl.bindBuffer(gl.ARRAY_BUFFER, b.buf);
        gl.bufferData(gl.ARRAY_BUFFER, b.data.subarray(0, b.count * INST_FLOATS), gl.DYNAMIC_DRAW);
      }
      gl.drawElementsInstanced(gl.TRIANGLES, this.meshes[mesh].count, gl.UNSIGNED_SHORT, 0, b.count);
      this.stats.draws++;
      this.stats.instances += b.count;
    }
    gl.bindVertexArray(null);
  },

  render() {
    const gl = this.gl;
    if (!gl || this.lost || !this.ok) return;
    const e = this.env;
    gl.viewport(0, 0, this.width, this.height);
    gl.clearColor(e.clear[0], e.clear[1], e.clear[2], 1);
    gl.clearStencil(0);
    gl.depthMask(true);
    gl.disable(gl.STENCIL_TEST);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
    gl.useProgram(this.prog);
    const u = this.u;
    gl.uniformMatrix4fv(u.uVP, false, this.vp);
    gl.uniform3fv(u.uCam, this.camPos);
    gl.uniform3fv(u.uLightFrom, this.lightFrom);

    gl.uniform3f(u.uLightTo, L[0] / ll, L[1] / ll, L[2] / ll);

    gl.uniform3fv(u.uSky, e.sky);
    gl.uniform3fv(u.uGround, e.ground);
    gl.uniform3fv(u.uFogCol, e.fogCol);
    gl.uniform3fv(u.uRim, e.rim);
    gl.uniform1f(u.uFog, e.fog);

    gl.uniform4f(u.uPL0, p0 ? p0.pos[0] : 0, p0 ? p0.pos[1] : 0, p0 ? p0.pos[2] : 0, p0 ? p0.r : 0.001);
    gl.uniform3fv(u.uPC0, p0 ? p0.col : [0, 0, 0]);
    gl.uniform4f(u.uPL1, p1 ? p1.pos[0] : 0, p1 ? p1.pos[1] : 0, p1 ? p1.pos[2] : 0, p1 ? p1.r : 0.001);
    gl.uniform3fv(u.uPC1, p1 ? p1.col : [0, 0, 0]);
    gl.uniform4f(u.uShadowCol, 0, 0, 0, 0.4);
    gl.uniform1f(u.uFloor, e.floor || 0);
    gl.uniform1f(u.uMode, 0);
    gl.enable(gl.CULL_FACE);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    // upload every layer once; the shadow pass reuses the solid buffers
    for (let layer = 0; layer < 4; layer++) {
      for (let mesh = 0; mesh < 4; mesh++) {
        const b = this.batches[layer * 4 + mesh];
        if (!b.count) continue;
        gl.bindBuffer(gl.ARRAY_BUFFER, b.buf);
        gl.bufferData(gl.ARRAY_BUFFER, b.data.subarray(0, b.count * INST_FLOATS), gl.DYNAMIC_DRAW);
      }
    }
    // opaque objects first, then the floor (the depth test skips floor pixels hidden by them),
    // then planar shadows on the floor, then transparent and additive layers
    this.uploadAndDraw(LAYER.SOLID, true);
    gl.uniform1f(u.uMode, 2);
    this.uploadAndDraw(LAYER.GROUND, true);
    if (this.shadowMode === 2) {
      gl.enable(gl.STENCIL_TEST);
      gl.stencilFunc(gl.NOTEQUAL, 1, 0xff);
      gl.stencilOp(gl.KEEP, gl.KEEP, gl.REPLACE);
      gl.depthMask(false);
      gl.disable(gl.CULL_FACE);
      gl.enable(gl.POLYGON_OFFSET_FILL);
      gl.polygonOffset(-2, -2);
      gl.uniform1f(u.uMode, 1);
      this.uploadAndDraw(LAYER.SOLID, true);
      gl.disable(gl.POLYGON_OFFSET_FILL);
      gl.disable(gl.STENCIL_TEST);
      gl.enable(gl.CULL_FACE);
      gl.depthMask(true);
    }
    gl.uniform1f(u.uMode, 0);
    gl.depthMask(false);
    this.uploadAndDraw(LAYER.ALPHA, true);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    this.uploadAndDraw(LAYER.ADD, true);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(true);
  },

  /* World point -> CSS pixel position on the canvas. Returns false when behind the camera. */
  project(x, y, z, out) {
    const vp = this.vp;
    const w = vp[3] * x + vp[7] * y + vp[11] * z + vp[15];
    if (w < 0.05) return false;
    const nx = (vp[0] * x + vp[4] * y + vp[8] * z + vp[12]) / w;
    const ny = (vp[1] * x + vp[5] * y + vp[9] * z + vp[13]) / w;
    out[0] = (nx * 0.5 + 0.5) * this.cssW;
    out[1] = (0.5 - ny * 0.5) * this.cssH;

  },
};

/* ---------- adaptive quality ---------- */
const QUALITY_PRESETS = {
  low: { scale: 0.6, dprCap: 1, shadow: 1, particles: 140, debris: 60 },
  medium: { scale: 0.85, dprCap: 1.5, shadow: 2, particles: 300, debris: 110 },
  high: { scale: 1, dprCap: 2, shadow: 2, particles: 520, debris: 170 },
};
/* Auto quality starts from a pixel budget for the detected GPU class, then adapts in small steps.
   Frames while the page is hidden or throttled are ignored. */
// Measured on an Intel HD 4000: about 4.2 ms at 0.9 MP and 6.1 ms at 2.1 MP, so 1080p fits the 16.7 ms budget on weak GPUs.
const PIXEL_BUDGET = { low: 2.1e6, high: 4.2e6 };
const TARGET_FRAME_MS = 1000 / 60;
const SLOW_FRAME_RATIO = 1.17;       // smoothed frame time above target x this = too slow (19.5 ms at 60 Hz)
const FAST_FRAME_RATIO = 1.05;       // below target x this = room to raise the scale again (17.5 ms at 60 Hz)
const REFRESH_SETTLE_FRAMES = 120;   // the smoothed frame time needs this many frames before it shows the display pace
const Quality = {
  level: 'high',
  autoScale: 1,
  bestFrameMs: Infinity,   // smoothest frame time seen this session (light menu scenes): the display's own pace
  slowTime: 0,
  fastTime: 0,
  blockUpUntil: 0,
  limits: QUALITY_PRESETS.high,
  apply() {
    const auto = Settings.v.quality === 'auto';
    const q = auto ? (GPU.tier === 'low' ? 'medium' : 'high') : Settings.v.quality;
    const p = QUALITY_PRESETS[q];
    this.level = q;
    let scale = p.scale;
    if (auto) {
      const dpr = Math.min(window.devicePixelRatio || 1, p.dprCap);
      const rect = R.canvas ? R.canvas.getBoundingClientRect() : { width: window.innerWidth, height: window.innerHeight };
      const pixels = Math.max(1, rect.width * rect.height * dpr * dpr);
      scale = clamp(Math.sqrt(PIXEL_BUDGET[GPU.tier] / pixels), 0.5, 1);
    }
    let shadow = p.shadow;
    const pick = Settings.v.shadows;
    if (pick === 'off') shadow = 0; else if (pick === 'blob') shadow = 1; else if (pick === 'full' && p.shadow === 1) shadow = 1;
    const fx = Settings.v.effects;
    const fxMul = fx === 'low' ? 0.4 : fx === 'medium' ? 0.7 : 1;
    this.limits = { particles: Math.floor(p.particles * fxMul), debris: p.debris };
    R.setQuality(scale * (auto ? this.autoScale : 1), p.dprCap, shadow);
  },
  /* Called once per frame with the smoothed frame interval (ms) and this frame's dt (s). */
  adapt(frameMs, dt) {
    if (Settings.v.quality !== 'auto') { this.autoScale = 1; return; }
    if (document.hidden || dt > 0.1) { this.slowTime = 0; this.fastTime = 0; return; }
    // A 50 Hz screen or a browser capped at 30 fps never runs faster: judge frames against that pace, not against 60 fps
    if (Diag.frameCount > REFRESH_SETTLE_FRAMES) this.bestFrameMs = Math.min(this.bestFrameMs, frameMs);
    const target = Math.max(TARGET_FRAME_MS, Number.isFinite(this.bestFrameMs) ? this.bestFrameMs : 0);
    if (frameMs > target * SLOW_FRAME_RATIO) { this.slowTime += dt; this.fastTime = 0; } else if (frameMs < target * FAST_FRAME_RATIO) { this.fastTime += dt; this.slowTime = 0; } else this.slowTime = 0;
    const now = performance.now();
    if (this.slowTime > 1.5 && this.autoScale > 0.6) {
      this.autoScale = Math.max(0.6, Math.round((this.autoScale - 0.1) * 100) / 100);
      this.slowTime = 0;
      this.blockUpUntil = now + 60000; // do not retry a level that was too slow for a minute
      this.apply();
      Diag.log('info', 'Render scale lowered to ' + R.scale.toFixed(2));
    } else if (this.fastTime > 10 && this.autoScale < 1 && now > this.blockUpUntil) {
      this.autoScale = Math.min(1, Math.round((this.autoScale + 0.1) * 100) / 100);
      this.fastTime = 0;
      this.apply();
    }
  },
};

/* ---------- camera ---------- */
const Camera = {
  pos: [0, 4, 9], target: [0, 1, 0], baseFov: 0.8, fov: 0.8, az: 0.2, dist: 8, elev: 0.46,
  shakeAmp: 0, fovPulse: 0, dirRight: [1, 0], dirFwd: [0, -1], aspect: 1.78,
  view: M4.create(), proj: M4.create(),
  snapNext: true,
  jx: 0, jy: 0, jz: 0,

  impact(shake, pulse) {
    if (Settings.v.reducedMotion) return;
    this.shakeAmp = Math.max(this.shakeAmp, shake * Settings.v.shake * 0.35);
    this.fovPulse = Math.max(this.fovPulse, pulse * Settings.v.shake);
  },

  /* Follow two fighters: keep both visible, clamp to the arena, ease toward the new framing. */
  follow(dt, a, b, def) {
    const bx = def.bounds.x, bz = def.bounds.z;
    const dx = b.x - a.x, dz = b.z - a.z;
    const sep = Math.hypot(dx, dz);
    let tx = (a.x + b.x) / 2, tz = (a.z + b.z) / 2;
    const ty = 1.0 + Math.max(0, Math.max(a.y, b.y)) * 0.35;
    tx = clamp(tx, -bx * 0.8, bx * 0.8); tz = clamp(tz, -bz * 0.8, bz * 0.8);
    // azimuth: stay on the +z side, follow the fighter axis softly
    let azWanted = 0.18;
    if (sep > 0.3) {
      const az1 = Math.atan2(-dz, dx);
      const az2 = az1 + Math.PI;
      const c1 = Math.abs(wrapAngle(az1 - this.az)), c2 = Math.abs(wrapAngle(az2 - this.az));
      azWanted = clamp(wrapAngle(c1 <= c2 ? az1 : az2), -0.55, 0.55) + 0.18;
    }
    const cam = def.camera;
    this.elev = lerp(this.elev, cam.elev, 1 - Math.exp(-dt * 2));
    const fovy = this.baseFov;
    const fovx = 2 * Math.atan(Math.tan(fovy / 2) * this.aspect);
    const needW = (sep * 0.92 + 3.4) * 0.5 / Math.tan(fovx / 2);
    const needH = 2.4 / Math.tan(fovy / 2);
    const maxDist = cam.maxDist * clamp(1.15 / this.aspect, 1, 2.2);
    const distWanted = clamp(Math.max(needW, needH, cam.minDist), cam.minDist, maxDist);
    const k = this.snapNext ? 1 : 1 - Math.exp(-dt * 3.2);
    this.az += wrapAngle(azWanted - this.az) * k;

    this.target[2] += (tz - this.target[2]) * (this.snapNext ? 1 : 1 - Math.exp(-dt * 6));

  /* Slow orbit around a point (menus, character select). */
  showcase(dt, cx, cy, cz, dist, az, elev) {

    this.target[1] += (cy - this.target[1]) * (1 - Math.exp(-dt * 4));
    this.target[2] += (cz - this.target[2]) * (1 - Math.exp(-dt * 4));
    this.dist += (dist - this.dist) * (1 - Math.exp(-dt * 3));
    this.az += wrapAngle(az - this.az) * (1 - Math.exp(-dt * 3));
    this.elev += (elev - this.elev) * (1 - Math.exp(-dt * 3));
    this.finish(dt, 30, 30);
  },

  finish(dt, bx, bz) {
    this.shakeAmp = Math.max(0, this.shakeAmp - dt * 2.4);
    this.fovPulse = Math.max(0, this.fovPulse - dt * 0.9);
    const ce = Math.cos(this.elev);
    let px = this.target[0] + Math.sin(this.az) * ce * this.dist;
    let py = this.target[1] + Math.sin(this.elev) * this.dist;

  apply() {

  },
};

/* ---------- object construction ---------- */
function stageFor(o) {
  const f = o.hp / o.maxHp;
  if (o.hp <= 0) return 4;
  if (f > 0.75) return 0;
  if (f > 0.5) return 1;
  if (f > 0.25) return 2;
  return 3;
}
function makeObject(def, rng) {
  const mat = MATERIALS[def.mat];
  const cracks = [];
  for (let i = 0; i < 16; i++) {
    cracks.push({ face: Math.floor(rng() * 4), u: (rng() - 0.5) * 1.5, v: 0.1 + rng() * 0.8, len: 0.18 + rng() * 0.32, ang: (rng() - 0.5) * 2.4, minStage: 1 + Math.floor(i / 6) });
  }
  const o = {
    id: def.id, type: def.type, look: def.look || '', mat: def.mat, axis: def.axis || 'x',
    x: def.x, z: def.z, hx: def.hx, hz: def.hz, h: def.h,
    color: def.color || mat.color, hp: mat.hp * (def.hpMul || 1), maxHp: mat.hp * (def.hpMul || 1),
    stage: 0, destroyed: false, phase: 'intact', phaseTimer: 0,
    wob: 0, wobPhase: 0, lastSrc: -1, lastImpactTick: -99,
    cracks, collider: null, rubble: null,
  };
  const thin = def.type === 'panel' || def.type === 'rail';
  o.collider = {
    x: def.x, z: def.z, hx: def.hx, hz: def.hz, top: def.h,
    standable: def.type === 'box' && def.h <= 1.05 && def.h >= 0.8, active: true, obj: o, temp: false, timer: 0, thin,
  };

}

const Arena = {
  def: null, objects: [], colliders: [], props: [], time: 0, rng: makeRng(7), propCache: {},
  build(def) {
    this.def = def;
    this.rng = makeRng(0x9e3779b1 ^ def.id.length * 977);
    this.objects = def.objects.map((d) => makeObject(d, this.rng));
    this.colliders = this.objects.map((o) => o.collider);
    this.props = this.propCache[def.id] || (this.propCache[def.id] = buildProps(def.id));
    this.time = 0;
    Debris.clear();
    FX.clear();
  },
  reset() { this.build(this.def); },
  statusCounts() {
    let intact = 0, damaged = 0, destroyed = 0;
    for (const o of this.objects) { if (o.destroyed) destroyed++; else if (o.stage > 0) damaged++; else intact++; }
    return { intact, damaged, destroyed, total: this.objects.length };
  },

  update(dt) {
    this.time += dt;
    for (const o of this.objects) {
      if (o.wob > 0) { o.wob = Math.max(0, o.wob - dt * 3.5); o.wobPhase += dt * 55; }
      if (o.destroyed) {
        o.phaseTimer += dt;
        if (o.phase === 'destroyed' && o.phaseTimer > 0.6) o.phase = 'settling';
        if (o.phase === 'settling' && o.phaseTimer > 4) { o.phase = 'cleanup'; Events.emit('objPhase', { obj: o, phase: 'cleanup' }); }
      }
      const c = o.rubble;
      if (c && c.timer > 0) { c.timer -= dt; if (c.timer <= 0) { c.top = Math.min(c.top, 0.2); c.temp = false; } }
    }
  },

  /* ----- damage ----- */
  /* by: index of the fighter credited with the damage (undefined = nobody). */
  damageObject(o, raw, cat, srcId, dirx, dirz, px, py, pz, by) {
    if (o.destroyed) return false;
    if (srcId !== undefined && o.lastSrc === srcId) return false;
    o.lastSrc = srcId;
    const mat = MATERIALS[o.mat];
    const dmg = raw * OBJ_DAMAGE_SCALE * (mat.mult[cat] || 1) - mat.resist * 0.25;
    o.wob = 1;
    Events.emit('objHit', { obj: o, dmg: Math.max(0, dmg), x: px, y: py, z: pz });
    if (dmg <= 0.2) return true;
    o.hp = Math.max(0, o.hp - dmg);
    const before = o.stage;
    o.stage = stageFor(o);
    if (o.hp <= 0) this.breakObject(o, dirx, dirz, by);
    else if (o.stage > before) Events.emit('objStage', { obj: o, stage: o.stage, x: o.x, y: o.h * 0.5, z: o.z });
    return true;
  },

  breakObject(o, dirx, dirz, by) {
    if (o.destroyed) return;
    o.destroyed = true;
    o.stage = 4;
    o.hp = 0;
    o.phase = 'destroyed';
    o.phaseTimer = 0;
    o.collider.active = false;
    Debris.wake(o.collider);
    const mat = o.mat;
    const rng = simRng;
    const cx = o.x, cz = o.z;
    if (mat === 'wood') {
      for (let i = 0; i < 9; i++) {
        const plank = i < 6;
        const sx = plank ? 0.55 + rng() * 0.35 : 0.16 + rng() * 0.1;
        Debris.spawn('wood', cx + (rng() - 0.5) * o.hx * 1.4, 0.15 + rng() * o.h * 0.8, cz + (rng() - 0.5) * o.hz * 1.4,
          (rng() - 0.5) * 4 + dirx * 2.2, 2 + rng() * 3.2, (rng() - 0.5) * 4 + dirz * 2.2, sx, plank ? 0.08 : 0.16, plank ? 0.17 : 0.16, o.color, 1);
      }
      this.addRubble(o, 0.22, 0.6, 0);
    } else if (mat === 'concrete') {
      for (let i = 0; i < 8; i++) {
        const s = 0.18 + rng() * 0.26;
        Debris.spawn('concrete', cx + (rng() - 0.5) * o.hx * 1.6, 0.2 + rng() * Math.min(o.h, 2) * 0.6, cz + (rng() - 0.5) * o.hz * 1.6,
          (rng() - 0.5) * 4.5 + dirx * 2, 1.5 + rng() * 3, (rng() - 0.5) * 4.5 + dirz * 2, s, s * 0.8, s * 0.9, i % 2 ? '#8d9096' : '#6f7279', 1);
      }
      this.addRubble(o, 0.55, Math.max(o.hx, 0.5) * 1.5, 14);
    } else if (mat === 'metal') {
      const len = o.axis === 'z' ? o.hz : o.hx;
      for (let i = 0; i < 5; i++) {
        const t = (rng() - 0.5) * len * 1.6;
        const px = o.axis === 'z' ? cx : cx + t, pz = o.axis === 'z' ? cz + t : cz;
        const rod = i < 3;
        Debris.spawn('metal', px, 0.5 + rng() * 0.7, pz, (rng() - 0.5) * 3 + dirx * 1.5, 1.5 + rng() * 2, (rng() - 0.5) * 3 + dirz * 1.5,
          rod ? 0.05 : 0.07, rod ? 0.9 + rng() * 0.5 : 0.7, rod ? 0.05 : 0.07, '#8b95a3', 1);
      }
    } else {
      const glass = mat === 'glass';
      const n = glass ? 26 : 16;
      const len = o.axis === 'z' ? o.hz : o.hx;
      for (let i = 0; i < n; i++) {
        const t = (rng() - 0.5) * len * 2, y = 0.1 + rng() * o.h;
        const px = o.axis === 'z' ? cx : cx + t, pz = o.axis === 'z' ? cz + t : cz;
        const s = glass ? 0.05 + rng() * 0.1 : 0.12 + rng() * 0.1;
        Debris.spawn(mat, px, y, pz, (rng() - 0.5) * 2.5 + dirx * 1.6, 0.5 + rng() * 2.2, (rng() - 0.5) * 2.5 + dirz * 1.6, s, glass ? s : 0.012, glass ? s * 1.3 : s * 1.4, glass ? '#bfe6ff' : '#f1e6c4', glass ? 0.6 : 1);
      }
    }
    FX.dust(cx, 0.4, cz, mat === 'concrete' ? 14 : 8, o.hx + 0.3, mat === 'glass' || mat === 'metal' ? '#c9d3e0' : '#a89a86');
    FX.sparks(cx, o.h * 0.5, cz, 10, 4, mat === 'metal' ? '#ffd78a' : '#ffffff');
    Camera.impact(0.9, 0.8);
    Events.emit('objBreak', { obj: o, mat, x: cx, y: o.h * 0.5, z: cz, by });
  },

  addRubble(o, top, half, timer) {
    const c = { x: o.x, z: o.z, hx: half, hz: half, top, standable: true, active: true, obj: null, temp: timer > 0, timer, thin: false };
    this.colliders.push(c);
    o.rubble = c;
  },

  /* ----- queries ----- */
  /* Sphere (attack hitbox) against every live object; damages each object at most once per source id. */
  hitSphere(x, y, z, r, srcId, raw, cat, dirx, dirz, by) {
    let hits = 0;
    for (const o of this.objects) {
      if (o.destroyed) continue;
      const c = o.collider;
      if (y - r > c.top + 0.1) continue;
      const nx = clamp(x, c.x - c.hx, c.x + c.hx), nz = clamp(z, c.z - c.hz, c.z + c.hz);
      const dx = x - nx, dz = z - nz;
      if (dx * dx + dz * dz > r * r) continue;
      if (this.damageObject(o, raw, cat, srcId, dirx, dirz, nx, clamp(y, 0, c.top), nz, by)) hits++;
    }
    return hits;
  },
  nearestObject(x, z, maxDist, aliveOnly) {
    let best = null, bd = maxDist * maxDist;
    for (const o of this.objects) {
      if (aliveOnly && o.destroyed) continue;
      const dx = o.x - x, dz = o.z - z, d = dx * dx + dz * dz;
      if (d < bd) { bd = d; best = o; }
    }
    return best;
  },
  /* True when a straight walk from (x1,z1) to (x2,z2) is blocked by a solid obstacle (used by AI routing). */
  pathBlocked(x1, z1, x2, z2, radius) {
    const steps = 8;
    for (let i = 1; i <= steps; i++) {
      const t = i / steps, x = lerp(x1, x2, t), z = lerp(z1, z2, t);
      for (const c of this.colliders) {
        if (!c.active || c.top <= STEP_HEIGHT) continue;
        if (Math.abs(x - c.x) < c.hx + radius && Math.abs(z - c.z) < c.hz + radius) return true;
      }
    }
    return false;
  },
  blockedAt(x, z, radius) {
    for (const c of this.colliders) {
      if (!c.active || c.top <= STEP_HEIGHT) continue;
      if (Math.abs(x - c.x) < c.hx + radius && Math.abs(z - c.z) < c.hz + radius) return true;
    }
    return false;
  },

  /* Fighter (vertical cylinder) vs bounds and obstacles. Sets f.groundY and wall/obstacle contact info. */
  resolveFighter(f) {
    const b = this.def.bounds, r = f.radius, mx = b.x - r, mz = b.z - r;
    f.wallHit = false; f.obstacleHit = null;
    let groundY = 0;
    for (let pass = 0; pass < 3; pass++) {
      groundY = 0;
      let moved = false;
      for (let i = 0; i < this.colliders.length; i++) {
        const c = this.colliders[i];
        if (!c.active) continue;
        const nx = clamp(f.x, c.x - c.hx, c.x + c.hx), nz = clamp(f.z, c.z - c.hz, c.z + c.hz);
        let dx = f.x - nx, dz = f.z - nz;
        const d2 = dx * dx + dz * dz;
        if (d2 >= r * r) continue;
        if (c.top <= STEP_HEIGHT) { groundY = Math.max(groundY, c.top); continue; }
        if (f.y >= c.top - 0.25) { if (c.standable) groundY = Math.max(groundY, c.top); continue; }
        this.pushOut(f, c, dx, dz, d2, mx, mz);
        moved = true;
        f.obstacleHit = c.obj || f.obstacleHit;
      }
      if (!moved) break;
    }
    if (f.x > mx) { f.x = mx; f.wallHit = true; } else if (f.x < -mx) { f.x = -mx; f.wallHit = true; }
    if (f.z > mz) { f.z = mz; f.wallHit = true; } else if (f.z < -mz) { f.z = -mz; f.wallHit = true; }
    f.groundY = groundY;
  },

  /* Moves a fighter out of an obstacle the shortest way that stays inside the arena (mx / mz: the fighter's limits).
     An obstacle by a wall must never push a fighter toward the wall: the wall would put it straight back inside. */
  pushOut(f, c, dx, dz, d2, mx, mz) {
    const r = f.radius;
    // the fighter may still be past a wall here (the wall clamp runs last): judge each spot as the clamp will leave it
    const clears = (x, z) => {
      const wx = clamp(x, -mx, mx), wz = clamp(z, -mz, mz);
      const ex = wx - clamp(wx, c.x - c.hx, c.x + c.hx), ez = wz - clamp(wz, c.z - c.hz, c.z + c.hz);
      return ex * ex + ez * ez >= r * r - 1e-6;
    };
    if (d2 > 1e-8) {
      const dist = Math.sqrt(d2), push = r - dist;
      const x = f.x + (dx / dist) * push, z = f.z + (dz / dist) * push;
      if (clears(x, z)) { f.x = x; f.z = z; return; }
    }
    // centre inside the box, or the way out leads into a wall: leave through the nearest side that has room
    const exits = [[c.x - c.hx - r, f.z], [c.x + c.hx + r, f.z], [f.x, c.z - c.hz - r], [f.x, c.z + c.hz + r]];
    let best = null, bestCost = Infinity, nearest = null, nearestCost = Infinity;
    for (let i = 0; i < exits.length; i++) {
      const exit = exits[i];
      const cost = Math.abs(exit[0] - f.x) + Math.abs(exit[1] - f.z);
      if (cost < nearestCost) { nearestCost = cost; nearest = exit; }
      const fits = i < 2 ? Math.abs(exit[0]) <= mx : Math.abs(exit[1]) <= mz;   // only the moved coordinate must have room
      if (fits && cost < bestCost) { bestCost = cost; best = exit; }
    }
    const to = best || nearest;
    f.x = to[0]; f.z = to[1];
  },

  /* ----- drawing ----- */
  draw() {
    const t = this.time;
    for (let i = 0; i < this.props.length; i++) {
      const p = this.props[i];
      let y = p.y, e = p.e;
      if (p.bob) y += Math.sin(t * 2.2 + p.ph) * p.bob;
      if (p.flicker) e = 1.6 + Math.sin(t * 17) * 0.5 + Math.sin(t * 31) * 0.3;
      R.put(p.l, p.m, p.x, y, p.z, p.sx, p.sy, p.sz, 0, p.ry, 0, p.c, p.a, e, p.q, p.cast, 0);
    }
    for (const o of this.objects) this.drawObject(o);
    this.drawPointLightFlicker();
  },
  drawPointLightFlicker() {
    if (this.def.id !== 'pit') return;
    const pl = this.def.env.pl;
    const f = 1 + Math.sin(this.time * 13) * 0.08 + Math.sin(this.time * 29) * 0.05;
    pl[0].col[0] = pl[1].col[0] = 1.0 * f; pl[0].col[1] = pl[1].col[1] = 0.45 * f; pl[0].col[2] = pl[1].col[2] = 0.15 * f;
  },

  drawObject(o) {
    const wob = o.wob > 0 ? Math.sin(o.wobPhase) * o.wob * 0.025 : 0;
    const x = o.x + wob, z = o.z + wob * 0.6;
    if (!o.destroyed) {
      if (o.type === 'box') this.drawBox(o, x, z);
      else if (o.type === 'column') this.drawColumn(o, x, z);
      else if (o.type === 'rail') this.drawRail(o, x, z);
      else this.drawPanel(o, x, z);
    } else if (o.rubble) this.drawRubble(o);
    if (R.shadowMode === 1 && !o.destroyed && o.type !== 'panel') {
      R.put(LAYER.ALPHA, MESH.CYL, o.x, 0.02, o.z, o.hx * 2.6, 0.01, o.hz * 2.6, 0, 0, 0, [0, 0, 0], 0.35, 0, 1, false, 0);
    }
  },
  tone(o) {
    const k = 1 - o.stage * 0.09;
    const c = C(o.color);
    return [c[0] * k, c[1] * k, c[2] * k];
  },
  drawCracks(o, x, z, hx, hz) {
    const dark = o.mat === 'glass' ? C('#ffffff') : C(MATERIALS[o.mat].dark);
    const layer = o.mat === 'glass' ? LAYER.ALPHA : LAYER.SOLID;
    for (let i = 0; i < o.cracks.length; i++) {
      const k = o.cracks[i];
      if (k.minStage > o.stage) continue;
      let px, pz, yaw;
      if (k.face === 0) { px = x + k.u * hx; pz = z + hz + 0.012; yaw = 0; }
      else if (k.face === 1) { px = x + k.u * hx; pz = z - hz - 0.012; yaw = Math.PI; }
      else if (k.face === 2) { px = x + hx + 0.012; pz = z + k.u * hz; yaw = Math.PI / 2; }
      else { px = x - hx - 0.012; pz = z + k.u * hz; yaw = -Math.PI / 2; }
      R.put(layer, MESH.CUBE, px, k.v * o.h, pz, k.len, 0.025, 0.02, 0, yaw, k.ang, dark, o.mat === 'glass' ? 0.8 : 1, 0, 0.9, false, 0);
    }
  },
  drawBox(o, x, z) {
    const col = this.tone(o);
    const st = o.stage;
    const lean = st >= 3 ? 0.05 : st >= 2 ? 0.025 : 0;
    const hScale = st >= 3 ? 0.94 : 1;
    R.put(LAYER.SOLID, MESH.CUBE, x, o.h * hScale * 0.5, z, o.hx * 2, o.h * hScale, o.hz * 2, 0, 0, lean, col, 1, 0, 0.8, true, 0);
    const dark = C(MATERIALS[o.mat].dark);
    if (o.look === 'crate') {
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) R.put(LAYER.SOLID, MESH.CUBE, x + sx * (o.hx - 0.04), o.h * 0.5, z + sz * (o.hz - 0.04), 0.1, o.h * 1.01, 0.1, 0, 0, lean, dark, 1, 0, 0.9, false, 0);
      R.put(LAYER.SOLID, MESH.CUBE, x, o.h * 0.5, z + o.hz + 0.01, 0.1, o.h * 1.25, 0.02, 0, 0, 0.75, dark, 1, 0, 0.9, false, 0);
      R.put(LAYER.SOLID, MESH.CUBE, x + o.hx + 0.01, o.h * 0.5, z, 0.02, o.h * 1.25, 0.1, 0, 0, 0.75, dark, 1, 0, 0.9, false, 0);
      if (st >= 2) R.put(LAYER.SOLID, MESH.CUBE, x + 0.1, o.h * 0.8, z + o.hz + 0.05, o.hx * 1.5, 0.14, 0.05, 0, 0, 0.12, col, 1, 0, 0.9, false, 0);
    } else if (o.look === 'bench') {
      R.put(LAYER.SOLID, MESH.CUBE, x, o.h, z, o.hx * 2.1, 0.08, o.hz * 2.2, 0, 0, lean, C('#a87846'), 1, 0, 0.8, true, 0);
      for (const sx of [-1, 1]) R.put(LAYER.SOLID, MESH.CUBE, x + sx * (o.hx - 0.1), o.h * 0.5, z, 0.12, o.h, o.hz * 1.8, 0, 0, 0, dark, 1, 0, 0.9, false, 0);
    } else if (o.look === 'barrier') {
      R.put(LAYER.SOLID, MESH.CUBE, x, o.h + 0.02, z, o.hx * 2.02, 0.05, o.hz * 2.02, 0, 0, 0, C('#d6b32a'), 1, 0, 0.7, false, 0);
      R.put(LAYER.SOLID, MESH.CUBE, x, 0.12, z, o.hx * 2.12, 0.24, o.hz * 2.5, 0, 0, 0, dark, 1, 0, 0.9, false, 0);
    }
    this.drawCracks(o, x, z, o.hx, o.hz);
  },
  drawColumn(o, x, z) {
    const col = this.tone(o);
    const st = o.stage;
    const hh = st >= 3 ? o.h * 0.9 : o.h;
    const d = o.hx * 2;
    R.put(LAYER.SOLID, MESH.CYL, x, hh * 0.5, z, d, hh, d, 0, 0, st >= 3 ? 0.03 : 0, col, 1, 0, 0.85, true, 0);
    const dark = C(MATERIALS[o.mat].dark);
    R.put(LAYER.SOLID, MESH.CYL, x, 0.12, z, d * 1.25, 0.24, d * 1.25, 0, 0, 0, dark, 1, 0, 0.9, false, 0);
    if (o.mat === 'concrete') R.put(LAYER.SOLID, MESH.CYL, x, hh - 0.1, z, d * 1.2, 0.2, d * 1.2, 0, 0, 0, dark, 1, 0, 0.9, false, 0);
    if (st >= 3 && o.mat === 'concrete') for (let i = 0; i < 3; i++) R.put(LAYER.SOLID, MESH.CYL, x + (i - 1) * 0.12, hh + 0.12, z + (i % 2 ? 0.1 : -0.1), 0.04, 0.5, 0.04, 0.2 * (i - 1), 0, 0.15 * (i - 1), C('#7a4a2a'), 1, 0, 0.9, false, 0);
    const r = o.hx;
    for (let i = 0; i < o.cracks.length; i++) {
      const k = o.cracks[i];
      if (k.minStage > st) continue;
      const th = k.face * 1.57 + k.u * 0.8;
      R.put(LAYER.SOLID, MESH.CUBE, x + Math.cos(th) * (r + 0.01), Math.min(k.v * hh, hh - 0.2), z + Math.sin(th) * (r + 0.01), k.len, 0.03, 0.02, 0, -th + Math.PI / 2, k.ang, dark, 1, 0, 0.9, false, 0);
    }
  },
  drawRail(o, x, z) {
    const col = this.tone(o);
    const alongZ = o.axis === 'z';
    const len = (alongZ ? o.hz : o.hx) * 2;
    const n = Math.max(2, Math.round(len / 1.2) + 1);
    const bend = [0, 0.05, 0.16, 0.38][Math.min(3, o.stage)];
    const dark = C(MATERIALS[o.mat].dark);
    const prevY = [0, 0];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const along = (t - 0.5) * len;
      const sag = Math.sin(Math.PI * t) * bend;
      const px = alongZ ? x : x + along, pz = alongZ ? z + along : z;
      R.put(LAYER.SOLID, MESH.CYL, px, 0.52 - sag * 0.1, pz, 0.08, 1.05, 0.08, alongZ ? 0 : sag * 1.4, 0, alongZ ? sag * 1.4 : 0, dark, 1, 0, 0.5, true, 0);
      const ys = [0.98 - sag * 0.55, 0.55 - sag * 0.35];
      if (i > 0) {
        const mid = along - len / (n - 1) / 2;
        const segLen = len / (n - 1);
        for (let k = 0; k < 2; k++) {
          const dy = ys[k] - prevY[k];
          const ang = Math.atan2(dy, segLen);
          const mx = alongZ ? x : x + mid, mz = alongZ ? z + mid : z;
          if (alongZ) R.put(LAYER.SOLID, MESH.CYL, mx, (ys[k] + prevY[k]) / 2, mz, 0.06, segLen * 1.02, 0.06, Math.PI / 2 - ang, 0, 0, col, 1, 0, 0.35, true, 0);
          else R.put(LAYER.SOLID, MESH.CYL, mx, (ys[k] + prevY[k]) / 2, mz, 0.06, segLen * 1.02, 0.06, 0, 0, ang - Math.PI / 2, col, 1, 0, 0.35, true, 0);
        }
      }
      prevY[0] = ys[0]; prevY[1] = ys[1];
    }
  },
  drawPanel(o, x, z) {
    const alongZ = o.axis === 'z';
    const len = (alongZ ? o.hz : o.hx) * 2;
    const yaw = alongZ ? Math.PI / 2 : 0;
    const paper = o.mat === 'paper';
    const frame = C(paper ? '#4a3220' : '#58606b');
    const st = o.stage;
    const dx = alongZ ? 0 : 1, dz = alongZ ? 1 : 0;
    // frame
    R.put(LAYER.SOLID, MESH.CUBE, x, 0.05, z, alongZ ? 0.1 : len + 0.1, 0.1, alongZ ? len + 0.1 : 0.1, 0, 0, 0, frame, 1, 0, 0.8, true, 0);
    R.put(LAYER.SOLID, MESH.CUBE, x, o.h, z, alongZ ? 0.1 : len + 0.1, 0.1, alongZ ? len + 0.1 : 0.1, 0, 0, 0, frame, 1, 0, 0.8, true, 0);
    for (const s of [-1, 1]) R.put(LAYER.SOLID, MESH.CUBE, x + dx * s * len / 2, o.h / 2, z + dz * s * len / 2, 0.1, o.h, 0.1, 0, 0, 0, frame, 1, 0, 0.8, true, 0);
    if (paper) {
      for (let i = 1; i < 4; i++) R.put(LAYER.SOLID, MESH.CUBE, x + dx * (-len / 2 + len * i / 4), o.h / 2, z + dz * (-len / 2 + len * i / 4), 0.05, o.h, 0.05, 0, 0, 0, frame, 1, 0, 0.8, false, 0);
      for (let i = 1; i < 3; i++) R.put(LAYER.SOLID, MESH.CUBE, x, o.h * i / 3, z, alongZ ? 0.05 : len, 0.04, alongZ ? len : 0.05, 0, 0, 0, frame, 1, 0, 0.8, false, 0);
    }
    const holes = st >= 2 ? (st >= 3 ? 3 : 1) : 0;
    R.put(LAYER.ALPHA, MESH.CUBE, x, o.h / 2, z, alongZ ? 0.04 : len, o.h - 0.08, alongZ ? len : 0.04, 0, 0, 0, C(paper ? '#f6ecd0' : '#a8dcff'), paper ? 0.95 : 0.3, paper ? 0.45 : 0.1, 0.1, false, 0);
    // cracks / tears
    const cc = paper ? C('#3a2616') : C('#ffffff');
    for (let i = 0; i < o.cracks.length; i++) {
      const k = o.cracks[i];
      if (k.minStage > st) continue;
      const u = k.u * len * 0.45;
      R.put(LAYER.ALPHA, MESH.CUBE, x + dx * u, k.v * o.h, z + dz * u, alongZ ? 0.03 : k.len * 1.6, 0.03, alongZ ? k.len * 1.6 : 0.03, 0, 0, alongZ ? 0 : k.ang * 1.3, cc, 0.85, 0, 0.9, false, 0);
      if (alongZ) R.put(LAYER.ALPHA, MESH.CUBE, x + 0.02, k.v * o.h, z + u, 0.02, 0.03, k.len * 1.6, k.ang * 1.3, 0, 0, cc, 0.85, 0, 0.9, false, 0);
    }
    for (let i = 0; i < holes; i++) R.put(LAYER.SOLID, MESH.CUBE, x + dx * (i - 1) * len * 0.3, o.h * (0.35 + 0.25 * i), z + dz * (i - 1) * len * 0.3, alongZ ? 0.05 : len * 0.16, o.h * 0.2, alongZ ? len * 0.16 : 0.05, 0, 0, 0, C('#15110e'), 0.9, 0, 1, false, 0);
  },
  drawRubble(o) {
    const c = o.rubble;
    const mat = MATERIALS[o.mat];

      const s = (0.24 + (i % 2) * 0.12) * Math.min(1.2, k + 0.35);

/* ---------- debris pool (bounded, recycled) ---------- */
const DEBRIS_MAX = 220;
const DEBRIS_PROFILE = {
  wood: { rest: 0.35, life: 14, grav: 1 }, concrete: { rest: 0.2, life: 20, grav: 1 }, metal: { rest: 0.3, life: 18, grav: 1 },
  glass: { rest: 0.25, life: 3.2, grav: 1 }, paper: { rest: 0, life: 4, grav: 0.18 },
};
const Debris = {
  pool: [],
  active: 0,
  init() {
    for (let i = 0; i < DEBRIS_MAX; i++) this.pool.push({ on: false, kind: 'wood', x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, rx: 0, ry: 0, rz: 0, wx: 0, wy: 0, wz: 0, sx: 0.2, sy: 0.2, sz: 0.2, col: [1, 1, 1], alpha: 1, life: 0, maxLife: 1, still: 0, asleep: false, born: 0 });
  },
  clear() { for (const d of this.pool) d.on = false; this.active = 0; },
  spawn(kind, x, y, z, vx, vy, vz, sx, sy, sz, hex, alpha) {
    const limit = Math.min(DEBRIS_MAX, Quality.limits.debris);
    let slot = null, oldest = null;
    this.active = 0;
    for (let i = 0; i < DEBRIS_MAX; i++) {
      const d = this.pool[i];
      if (d.on) { this.active++; if (!oldest || d.life < oldest.life) oldest = d; } else if (!slot) slot = d;
    }
    if (this.active >= limit || !slot) slot = oldest;
    if (!slot) return null;
    const prof = DEBRIS_PROFILE[kind];
    const d = slot;
    d.on = true; d.kind = kind; d.x = x; d.y = y; d.z = z; d.vx = vx; d.vy = vy; d.vz = vz;
    d.rx = Math.random() * TAU; d.ry = Math.random() * TAU; d.rz = Math.random() * TAU;
    d.wx = (Math.random() - 0.5) * 12; d.wy = (Math.random() - 0.5) * 12; d.wz = (Math.random() - 0.5) * 12;
    d.sx = sx; d.sy = sy; d.sz = sz; d.col = C(hex); d.alpha = alpha;
    d.life = prof.life * (0.85 + Math.random() * 0.3); d.maxLife = d.life; d.still = 0; d.asleep = false;
    return d;
  },
  update(dt) {
    const b = Arena.def ? Arena.def.bounds : { x: 9, z: 6 };
    let count = 0;
    for (let i = 0; i < DEBRIS_MAX; i++) {
      const d = this.pool[i];
      if (!d.on) continue;
      d.life -= dt;
      if (d.life <= 0) { d.on = false; continue; }
      count++;
      if (d.asleep) continue;
      const prof = DEBRIS_PROFILE[d.kind];
      d.vy -= GRAVITY * prof.grav * dt;
      if (d.kind === 'paper') { d.vx *= 1 - dt * 2; d.vz *= 1 - dt * 2; d.vy = Math.max(d.vy, -1.2); }
      const prevY = d.y;
      d.x += d.vx * dt; d.y += d.vy * dt; d.z += d.vz * dt;
      d.rx += d.wx * dt; d.ry += d.wy * dt; d.rz += d.wz * dt;
      if (Math.abs(d.x) > b.x + 1.2) { d.x = clamp(d.x, -b.x - 1.2, b.x + 1.2); d.vx *= -0.3; }
      if (Math.abs(d.z) > b.z + 1.0) { d.z = clamp(d.z, -b.z - 1.0, b.z + 1.0); d.vz *= -0.3; }
      const floor = this.obstacleSupport(d, prevY) + Math.max(d.sy, Math.min(d.sx, d.sz) * 0.5, 0.025) * 0.5;
      if (d.y <= floor) {
        d.y = floor;
        if (d.vy < -1.2 && d.kind !== 'paper') Events.emit('debrisImpact', { kind: d.kind, x: d.x, z: d.z, power: Math.min(1, -d.vy / 6), big: d.sx > 0.3 });
        d.vy = d.vy < -0.8 ? -d.vy * prof.rest : 0;
        d.vx *= 0.7; d.vz *= 0.7;
        d.wx *= 0.5; d.wy *= 0.5; d.wz *= 0.5;
        // lay flat gradually
        d.rx += (Math.round(d.rx / (Math.PI / 2)) * (Math.PI / 2) - d.rx) * 0.25;
        d.rz += (Math.round(d.rz / (Math.PI / 2)) * (Math.PI / 2) - d.rz) * 0.25;
        if (Math.abs(d.vx) + Math.abs(d.vz) + Math.abs(d.vy) < 0.25) { d.still += dt; if (d.still > 0.5) { d.asleep = true; } } else d.still = 0;
      }
    }
    this.active = count;
  },
  /* Intact objects stop debris: a piece coming down onto one rests on its top, a piece flying into a side bounces
     back out of it. Returns the height the piece rests on (0 = the floor). */
  obstacleSupport(d, prevY) {
    let support = 0;
    for (const c of Arena.colliders) {
      if (!c.active || !c.obj) continue;   // rubble is drawn as loose pieces already
      const overlapX = c.hx - Math.abs(d.x - c.x), overlapZ = c.hz - Math.abs(d.z - c.z);
      if (overlapX <= 0 || overlapZ <= 0) continue;
      if (prevY >= c.top) { support = Math.max(support, c.top); continue; }
      if (overlapX < overlapZ) { d.x = c.x + (d.x < c.x ? -c.hx : c.hx); d.vx *= -0.3; } else { d.z = c.z + (d.z < c.z ? -c.hz : c.hz); d.vz *= -0.3; }
    }
    return support;
  },
  /* Pieces resting on top of an object that just broke fall again. */
  wake(c) {
    for (const d of this.pool) {
      if (d.on && d.asleep && Math.abs(d.x - c.x) < c.hx && Math.abs(d.z - c.z) < c.hz) { d.asleep = false; d.still = 0; }
    }
  },
  draw() {
    for (let i = 0; i < DEBRIS_MAX; i++) {
      const d = this.pool[i];
      if (!d.on) continue;
      const fade = d.life < 0.8 ? d.life / 0.8 : 1;
      const mesh = d.kind === 'glass' ? MESH.SHARD : MESH.CUBE;
      const alphaLayer = d.alpha < 1 || fade < 1;
      R.put(alphaLayer ? LAYER.ALPHA : LAYER.SOLID, mesh, d.x, d.y, d.z, d.sx * fade, d.sy * fade, d.sz * fade, d.rx, d.ry, d.rz, d.col, d.alpha * fade, d.kind === 'glass' ? 0.15 : 0, d.kind === 'metal' ? 0.35 : 0.8, d.sx > 0.15, 0);
    }
  },
};

/* ---------- particles (pooled, bounded) ---------- */
const FX_MAX = 520;
const FX = {
  p: [],
  active: 0,
  init() {
    for (let i = 0; i < FX_MAX; i++) this.p.push({ on: false, kind: 0, x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0, life: 0, max: 1, size: 0.1, grow: 0, col: [1, 1, 1], a: 1, grav: 0, drag: 0, em: 1, add: true, rot: 0 });
  },
  clear() { for (const q of this.p) q.on = false; this.active = 0; },
  spawn(mesh, add, x, y, z, vx, vy, vz, life, size, grow, hex, a, grav, drag, em) {
    if (this.active >= Math.min(FX_MAX, Quality.limits.particles)) return;
    for (let i = 0; i < FX_MAX; i++) {
      const q = this.p[i];
      if (q.on) continue;
      q.on = true; q.kind = mesh; q.add = add; q.x = x; q.y = y; q.z = z; q.vx = vx; q.vy = vy; q.vz = vz;
      q.life = life; q.max = life; q.size = size; q.grow = grow; q.col = typeof hex === 'string' ? C(hex) : hex; q.a = a; q.grav = grav; q.drag = drag; q.em = em; q.rot = Math.random() * 6;
      this.active++;
      return;
    }
  },
  sparks(x, y, z, n, speed, hex, dirx, dirz) {
    const reduced = Settings.v.reducedMotion;
    const count = reduced ? Math.ceil(n * 0.5) : n;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU, e = Math.random() * 1.2 - 0.2, s = speed * (0.4 + Math.random() * 0.8);
      this.spawn(MESH.CUBE, true, x, y, z, Math.cos(a) * s + (dirx || 0) * s * 0.5, Math.sin(e) * s + 1, Math.sin(a) * s + (dirz || 0) * s * 0.5, 0.25 + Math.random() * 0.25, 0.035 + Math.random() * 0.03, -0.05, hex, 0.95, 9, 0.5, 2);
    }
  },
  flash(x, y, z, size, hex) {
    this.spawn(MESH.SPHERE, true, x, y, z, 0, 0, 0, 0.1, size, size * 6, hex, Settings.v.reducedMotion ? 0.45 : 0.85, 0, 0, 2);
  },
  dust(x, y, z, n, radius, hex) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, r = Math.random() * radius;
      this.spawn(MESH.SPHERE, false, x + Math.cos(a) * r, y + Math.random() * 0.2, z + Math.sin(a) * r, Math.cos(a) * 0.9, 0.5 + Math.random() * 0.7, Math.sin(a) * 0.9, 0.6 + Math.random() * 0.5, 0.18 + Math.random() * 0.12, 0.5, hex, 0.4, -0.6, 1.5, 0);
    }
  },
  ring(x, y, z, hex) { this.spawn(MESH.CYL, true, x, y, z, 0, 0, 0, 0.22, 0.2, 5, hex, 0.5, 0, 0, 1.5); },
  trail(x, y, z, hex, size) { this.spawn(MESH.SPHERE, true, x, y, z, 0, 0, 0, 0.17, size, -size * 4.5, hex, 0.55, 0, 0, 1.6); },
  update(dt) {
    let count = 0;
    for (let i = 0; i < FX_MAX; i++) {
      const q = this.p[i];
      if (!q.on) continue;
      q.life -= dt;
      if (q.life <= 0) { q.on = false; continue; }
      count++;
      q.vy -= q.grav * dt;
      if (q.drag) { const k = Math.max(0, 1 - q.drag * dt); q.vx *= k; q.vy *= k; q.vz *= k; }
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      q.size = Math.max(0.001, q.size + q.grow * dt);
      if (q.y < 0.02 && q.kind === MESH.CUBE) { q.y = 0.02; q.vy = 0; q.vx *= 0.6; q.vz *= 0.6; }
    }
    this.active = count;
  },
  draw() {
    for (let i = 0; i < FX_MAX; i++) {
      const q = this.p[i];
      if (!q.on) continue;
      const t = q.life / q.max;
      const s = q.size;
      if (q.kind === MESH.CYL) R.put(LAYER.ADD, MESH.CYL, q.x, q.y, q.z, s, 0.02, s, 0, 0, 0, q.col, q.a * t, q.em, 1, false, 0);
      else R.put(q.add ? LAYER.ADD : LAYER.ALPHA, q.kind, q.x, q.y, q.z, s, s, s, q.rot, q.rot * 1.3, 0, q.col, q.a * t, q.em, 1, false, 0);
    }
  },
};

const S = {
  IDLE: 'IDLE', WALK: 'WALK', RUN: 'RUN', SIDESTEP: 'SIDESTEP', SWAY: 'SWAY', CROUCH: 'CROUCH', JUMP: 'JUMP',
  ATTACK: 'ATTACK', BLOCK_H: 'BLOCK_H', BLOCK_L: 'BLOCK_L', HIT: 'HIT', STAGGER: 'STAGGER', STUN: 'STUN',
  CLINCH: 'CLINCH', GRAPPLE: 'GRAPPLE', SUBMIT: 'SUBMIT', THROWN: 'THROWN', DOWN: 'DOWN', GETUP: 'GETUP', KO: 'KO', VICTORY: 'VICTORY', DEFEAT: 'DEFEAT',
};
const STATE_LABEL = {
  IDLE: 'Idle', WALK: 'Walking', RUN: 'Running', SIDESTEP: 'Sidestep', SWAY: 'Swaying', CROUCH: 'Crouching', JUMP: 'Jumping',
  ATTACK: 'Attacking', BLOCK_H: 'High block', BLOCK_L: 'Low block', HIT: 'Hit reaction', STAGGER: 'Staggered', STUN: 'Stunned',
  CLINCH: 'Clinched', GRAPPLE: 'Grappling', SUBMIT: 'Holding', THROWN: 'Thrown', DOWN: 'Knocked down', GETUP: 'Recovering', KO: 'Knocked out', VICTORY: 'Victory', DEFEAT: 'Defeat',
};
const TERMINAL_STATES = [S.KO, S.VICTORY, S.DEFEAT];
const REACTION_STATES = [S.HIT, S.STAGGER, S.STUN, S.CLINCH, S.THROWN, S.DOWN];
const FREE_SET = [S.IDLE, S.WALK, S.RUN, S.CROUCH, S.BLOCK_H, S.BLOCK_L];
const STRING_BREAK_STATES = [...REACTION_STATES, S.GRAPPLE, S.SUBMIT, S.GETUP, ...TERMINAL_STATES];   // entering one of these ends the fighter's attack string
/* Explicit transition table for voluntary changes. Reactions (hit, stagger, stun, clinch, thrown, down, KO)
   and round-end poses are allowed from any non-terminal state; see canTransition(). */
const TRANSITIONS = {
  IDLE: [...FREE_SET, S.SIDESTEP, S.SWAY, S.JUMP, S.ATTACK, S.SUBMIT],
  WALK: [...FREE_SET, S.SIDESTEP, S.SWAY, S.JUMP, S.ATTACK, S.SUBMIT],
  RUN: [...FREE_SET, S.SIDESTEP, S.SWAY, S.JUMP, S.ATTACK, S.SUBMIT],
  CROUCH: [...FREE_SET, S.SIDESTEP, S.SWAY, S.JUMP, S.ATTACK, S.SUBMIT],
  BLOCK_H: [...FREE_SET, S.SIDESTEP, S.SWAY, S.JUMP, S.ATTACK, S.SUBMIT],
  BLOCK_L: [...FREE_SET, S.SIDESTEP, S.SWAY, S.JUMP, S.ATTACK, S.SUBMIT],
  SIDESTEP: [S.IDLE, S.WALK, S.CROUCH, S.BLOCK_H, S.BLOCK_L, S.ATTACK],
  SWAY: [S.IDLE],
  SUBMIT: [S.IDLE],
  JUMP: [S.IDLE, S.ATTACK],
  ATTACK: [S.IDLE, S.WALK, S.CROUCH, S.BLOCK_H, S.BLOCK_L, S.JUMP, S.ATTACK, S.GRAPPLE],
  HIT: [S.IDLE, S.CROUCH, S.BLOCK_H, S.BLOCK_L],
  STAGGER: [S.IDLE, S.CROUCH, S.BLOCK_H, S.BLOCK_L],
  STUN: [S.IDLE],
  CLINCH: [S.IDLE],
  GRAPPLE: [S.IDLE],
  THROWN: [S.DOWN],
  DOWN: [S.GETUP],
  GETUP: [S.IDLE, S.CROUCH],
  KO: [], VICTORY: [], DEFEAT: [],
};
function canTransition(from, to) {
  if (TERMINAL_STATES.includes(from)) return false;
  if (to === S.KO) return true;
  if (to === S.VICTORY || to === S.DEFEAT) return true;
  if (REACTION_STATES.includes(to)) return to !== S.DOWN || from === S.THROWN || from === S.HIT || from === S.STAGGER;
  if (from === to) return true;
  return TRANSITIONS[from].includes(to);
}

/* ---------- attributes -> gameplay (documented formulas, attribute scale 1..10, 5 = baseline 1.0) ----------
   Slopes are tuned so +2 in any one attribute (7 vs 5, hard CPU mirrors of KAI, MARA and DMITRI, 432 matches each)
   wins 61-69%: health .65, stamina .69, strength .62, speed .65, reach .61, defense .63, balance .68, recovery .62.
   Reach, the heavy-hit impact of balance and recovery's stamina regen were flattened again (they won .69, .74 and .74). */
const ATTR_KEYS = ['health', 'stamina', 'strength', 'speed', 'reach', 'defense', 'balance', 'recovery'];
function normalizeAttrs(a) {
  const out = {};
  for (const k of ATTR_KEYS) out[k] = clamp(Math.round(finite(a[k], 5)), 1, 10);
  return out;
}
function deriveStats(raw) {
  const a = normalizeAttrs(raw);
  return {
    attrs: a,
    maxHp: Math.round(85 + a.health * 5),            // 90..135
    maxStam: Math.round(60 + a.stamina * 10),        // 70..160
    damage: 0.75 + a.strength * 0.05,                // 0.80..1.25  damage dealt
    walk: 0.85 + a.speed * 0.03,                     // 0.88..1.15  movement speed
    atkSpeed: 1.125 - a.speed * 0.025,               // 1.10..0.875 startup/recovery multiplier
    reach: 0.965 + a.reach * 0.007,                  // 0.97..1.04  attack reach
    taken: 1.2 - a.defense * 0.04,                   // 1.16..0.80  damage taken
    stun: 1.25 - a.balance * 0.05,                   // 1.20..0.75  hit-stun and block-stun duration
    guard: 1.25 - a.balance * 0.05,                  // 1.20..0.75  guard (block stamina) cost
    impact: 1.15 - a.balance * 0.03,                 // 1.12..0.85  damage from heavy hits, counters, throws and scenery
    regen: 12.5 + a.recovery * 1.5,                  // 14..27.5 stamina per second
    getup: 1.2 - a.recovery * 0.04,                  // 1.16..0.80  knockdown duration
  };
}

    p[J.torsoRoll] = 0.12 * s * effort; p[J.headY] = 0.25 * s * effort;
  }
  /* After a throw the thrower is locked for the recovery; blend from the release pose back to guard (visual only). */
  throwFollowPose(p) {
    const tf = this.throwFollow;
    if (!tf || this.lock <= 0 || this.state !== S.IDLE) { this.throwFollow = null; return false; }
    const amount = smoothstep(this.lock / tf.recovery);
    const g = this.motion.guard;
    THROW_POSES[tf.anim](p, 1, tf.side);
    for (let i = 0; i < NP; i++) p[i] = g[i] + (p[i] - g[i]) * amount;
    return true;
  }
  liePose(p, amount) {
    p[J.bodyPitch] = -1.52 * this.lieSign * amount; p[J.lie] = amount;
    p[J.shLx] = 0.15 * amount + p[J.shLx] * (1 - amount); p[J.shRx] = 0.15 * amount + p[J.shRx] * (1 - amount);
    p[J.elL] = 0.3 * amount + p[J.elL] * (1 - amount); p[J.elR] = 0.3 * amount + p[J.elR] * (1 - amount);
    p[J.hipLx] = lerp(p[J.hipLx], 0.25, amount); p[J.hipRx] = lerp(p[J.hipRx], 0.1, amount);

  /* Strike pose over time. Visual only: the move's ticks and reach decide hits, never this pose. */
  attackPose() {
    const mv = this.move, pose = this.pose, m = this.motion;
    const g = m.guard;
    if (!mv) { pose.set(g); return; }
    const strike = styledStrikePose(mv, m);
    const kick = isKickAnim(mv.anim);
    const t = this.moveTick, startup = this.mStartup, active = this.mActive, recovery = this.mRecovery + this.whiffExtra;
    const windup = mv.tier === 3 ? 0.45 : 0.28, snap = kick ? m.kickSnap : m.punchSnap;
    const ext = strikeExtension(t, startup, active, recovery, windup, snap);
    if (kick && ext > 0) {
      // guard -> chamber -> extension on the way out, and back through the chamber on the way in
      const chamber = chamberPose(mv, m);
      const rising = ext < CHAMBER_SPLIT;
      const from = rising ? g : chamber, to = rising ? chamber : strike;
      const u = rising ? ext / CHAMBER_SPLIT : (ext - CHAMBER_SPLIT) / (1 - CHAMBER_SPLIT);

      for (let i = 0; i < NP; i++) pose[i] = g[i] + (strike[i] - g[i]) * ext;

    // kinetic chain: the hips and torso turn a little ahead of the limb

      pose[J.torsoTwist] = g[J.torsoTwist] + (strike[J.torsoTwist] - g[J.torsoTwist]) * Math.max(ext, lead);
