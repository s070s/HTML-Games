    match.hitStop = Math.max(match.hitStop, 16);
    Events.emit('ko', { def, att, x: def.x, y: 1.1, z: def.z });
  },

  /* Thrown / knocked fighters hitting scenery or walls. */
  impactCheck(f, match) {
    const flying = f.state === S.THROWN || f.state === S.KO || f.state === S.HIT || f.state === S.STAGGER;
    if (!flying) return;
    const speed = Math.hypot(f.kx, f.kz);
    const need = f.state === S.THROWN || f.state === S.KO ? 3.0 : 5.5;
    if (speed < need || match.tick - f.lastImpactTick < 14) return;
    if (f.obstacleHit) {
      const obj = f.obstacleHit;
      const nx = f.kx / speed, nz = f.kz / speed;
      f.lastImpactTick = match.tick;
      Arena.damageObject(obj, speed * 6, 'impact', 100000 + f.flightId * 10 + (match.tick & 7), nx, nz, f.x, 1.0, f.z, f.index ^ 1);   // credit whoever sent them flying
      const broke = obj.destroyed;
      const dmg = broke ? 1.5 : 2 + speed * 0.35;
      this.envDamage(f, dmg, match);
      f.kx *= broke ? 0.7 : -0.25; f.kz *= broke ? 0.7 : -0.25;
      Events.emit('envImpact', { f, obj, speed, broke, x: f.x, y: 1.0, z: f.z });
    } else if (f.wallHit) {
      f.lastImpactTick = match.tick;
      const b = Arena.def.bounds;
      if (Math.abs(f.x) >= b.x - f.radius - 0.02) f.kx *= -0.2;
      if (Math.abs(f.z) >= b.z - f.radius - 0.02) f.kz *= -0.2;
      this.envDamage(f, 3 + speed * 0.3, match);
      Events.emit('wallSlam', { f, speed, x: f.x, y: 1.0, z: f.z });
    }
  },
  envDamage(f, dmg, match) {
    if (f.state === S.KO || !match.live) return;
    f.hp = Math.max(0, f.hp - dmg * this.comboScale(f.gotHits) * f.stats.taken * f.stats.impact);   // scaled like the combo that carried them there
    if (match.floorHp(f) > f.hp) f.hp = match.floorHp(f);
    f.flash = 1;
    if (f.hp <= 0) this.knockOut(f, null, null, match);
  },

  /* Combo bookkeeping: ends when the victim has been out of hit reactions for a few ticks. */
  tickCombos(fighters) {
    for (const f of fighters) {
      if (f.comboShow > 0) f.comboShow--;
      if (f.gotHits === 0) continue;
      const reactive = REACTION_STATES.includes(f.state) || f.state === S.KO || (f.state === S.THROWN && f.juggle);
      if (reactive) f.calmTicks = 0; else f.calmTicks++;
      if (f.calmTicks > COMBO_RESET_TICKS) {
        const other = fighters[f.index ^ 1];
        Events.emit('comboEnd', { att: other, def: f, hits: other.comboHits, damage: other.comboDamage });
        f.gotHits = 0; f.juggleCount = 0; f.calmTicks = 0;
      }
    }
  },
};

/* ---------- colour helpers ---------- */
function hexToHsl(hex) {
  const [r, g, b] = hexToRgb(hex);
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const lightness = (max + min) / 2;
  if (max === min) return { h: 0, s: 0, l: lightness };
  const d = max - min;
  const s = lightness > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h = (r - g) / d + 4;
  if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
  else if (max === g) h = (b - r) / d + 2;
  return { h: h * 60, s, l: lightness };
}
function hslToHex(h, s, l) {
  const hue = ((h % 360) + 360) % 360;
  const chroma = (1 - Math.abs(2 * l - 1)) * s;
  const x = chroma * (1 - Math.abs(((hue / 60) % 2) - 1));
  const m = l - chroma / 2;
  const table = [[chroma, x, 0], [x, chroma, 0], [0, chroma, x], [0, x, chroma], [x, 0, chroma], [chroma, 0, x]];
  const [r, g, b] = table[Math.floor(hue / 60)] || table[0];
  const toHex = (v) => Math.round(clamp(v + m, 0, 1) * 255).toString(16).padStart(2, '0');
  return '#' + toHex(r) + toHex(g) + toHex(b);
}
function mixHex(a, b, t) {
  const ca = hexToRgb(a), cb = hexToRgb(b);
  const toHex = (v) => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, '0');
  return '#' + toHex(lerp(ca[0], cb[0], t)) + toHex(lerp(ca[1], cb[1], t)) + toHex(lerp(ca[2], cb[2], t));
}

    hairStyle: legacyMask ? 'bald' : look.hairStyle || 'short',
    eyes: look.eyes || 'normal', brows: look.brows || 'none', beard: look.beard || 'none',
    mask: legacyMask ? 'full' : look.mask || 'none',
    headband: look.headband === 'band', topStyle, legs: look.legs || 'shorts', hands: look.hands || 'gloves',
    belt: look.belt || 'none', feet: look.feet || 'shoes', glow: look.glow === 'on', legacyMask,
    colors: {
      skin, hair, top: topStyle === 'bare' ? skin : look.top || skin, shorts: look.shorts || '#18274d',
      glove: look.glove || '#f1f1f5', shoe: look.shoe || '#202228', accent, mask: legacyMask ? hair : accent,
      stubble: mixHex(skin, hair, 0.55),
    },
  };
}

/* ---------- point-buy rules ---------- */
function attrCost(value) { return value + Math.max(0, value - ATTR_KNEE); }
/* Point cost of a build (points above ATTR_KNEE count double). */
function attrTotal(attrs) {
  let sum = 0;
  for (const key of ATTR_KEYS) sum += attrCost(attrs[key]);
  return sum;
}
function veteranUnlocked() { return !!Progress.d && Progress.d.arcadeClears > 0; }
function budgetForTier(tier) { return tier === 'veteran' ? VETERAN_BUDGET : POINT_BUDGET; }
/* Would setting attrs[key] = value keep the fighter legal? */
function canSetAttr(attrs, key, value, budget) {
  if (!ATTR_KEYS.includes(key)) return false;
  if (!Number.isInteger(value) || value < ATTR_MIN || value > ATTR_MAX) return false;
  return attrTotal(attrs) - attrCost(attrs[key]) + attrCost(value) <= budget;
}
/* Lower the largest (priciest) attributes one point at a time until the cost fits the budget. */
function trimToBudget(attrs, budget) {
  while (attrTotal(attrs) > budget) {
    let biggest = ATTR_KEYS[0];
    for (const key of ATTR_KEYS) if (attrs[key] > attrs[biggest]) biggest = key;
    if (attrs[biggest] <= ATTR_MIN) return attrs;
    attrs[biggest]--;
  }
  return attrs;
}

/* ---------- records ---------- */
function defaultCustom(slot) {
  return {
    name: 'FIGHTER' + (slot + 1), title: 0, arch: 'balanced', tier: 'standard', moveStyle: ARCHETYPE_MOVE_STYLE.balanced,
    attrs: Object.assign({}, ARCHETYPES.balanced.attrs),
    look: { skin: '#d9a27c', hair: '#2a1a12', hairStyle: 'short', eyes: 'normal', brows: 'thin', beard: 'none', headband: 'none', mask: 'none',
      topStyle: 'tee', top: '#34dcff', legs: 'shorts', shorts: '#18274d', hands: 'gloves', glove: '#f1f1f5', belt: 'belt', feet: 'shoes', shoe: '#16161c',
      accent: '#ff5c93', glow: 'off', scale: 1, build: 1 },
  };
}
function cloneCustom(c) { return { name: c.name, title: c.title, arch: c.arch, tier: c.tier, moveStyle: c.moveStyle, attrs: Object.assign({}, c.attrs), look: Object.assign({}, c.look) }; }
/* Snap to the slider grid and keep two decimals so saved values compare exactly. */
function snapToStep(value, min, max, step) { return Math.round(clamp(min + Math.round((value - min) / step) * step, min, max) * 100) / 100; }

/* Strict validation: returns { ok, value, error }. value is a fresh, normalised record. Never throws. */
function validateCustom(raw) {
  const fail = (error) => ({ ok: false, value: null, error });
  if (!raw || typeof raw !== 'object') return fail('Not a fighter');
  if (typeof raw.name !== 'string' || !NAME_PATTERN.test(raw.name)) return fail('Name must be 1-' + NAME_MAX + ' letters A-Z or digits');
  if (!Number.isInteger(raw.title) || raw.title < 0 || raw.title >= TITLES.length) return fail('Unknown title');
  if (!ARCHETYPE_IDS.includes(raw.arch)) return fail('Unknown fighting style');
  if (!TIERS.includes(raw.tier)) return fail('Unknown tier');
  // fighters saved before movement styles existed get their archetype's default style
  const moveStyle = raw.moveStyle === undefined ? ARCHETYPE_MOVE_STYLE[raw.arch] : raw.moveStyle;
  if (typeof moveStyle !== 'string' || !MOVE_STYLE_IDS.includes(moveStyle)) return fail('Unknown movement style');
  const attrsIn = raw.attrs, lookIn = raw.look;
  if (!attrsIn || typeof attrsIn !== 'object' || !lookIn || typeof lookIn !== 'object') return fail('Missing attributes or look');
  const attrs = {};
  for (const key of ATTR_KEYS) {
    const v = attrsIn[key];
    if (!Number.isInteger(v) || v < ATTR_MIN || v > ATTR_MAX) return fail('Attribute ' + key + ' must be ' + ATTR_MIN + '-' + ATTR_MAX);
    attrs[key] = v;
  }
  const budget = budgetForTier(raw.tier);
  let flatTotal = 0;
  for (const key of ATTR_KEYS) flatTotal += attrs[key];
  if (flatTotal > budget) return fail('Attributes exceed the ' + budget + '-point budget');
  trimToBudget(attrs, budget);   // builds saved before points above ATTR_KNEE cost double: lower the priciest points until they fit
  const look = {};
  for (const key of LOOK_CHOICE_KEYS) {
    if (!LOOK_CHOICES[key].options.includes(lookIn[key])) return fail('Invalid ' + LOOK_CHOICES[key].label.toLowerCase());
    look[key] = lookIn[key];
  }
  for (const key of LOOK_COLOR_KEYS) {
    if (typeof lookIn[key] !== 'string' || !HEX_COLOR.test(lookIn[key])) return fail('Invalid colour for ' + key);
    look[key] = lookIn[key].toLowerCase();
  }
  const scale = lookIn.scale, build = lookIn.build;
  if (!Number.isFinite(scale) || scale < SCALE_MIN - 1e-6 || scale > SCALE_MAX + 1e-6) return fail('Height out of range');
  if (!Number.isFinite(build) || build < BUILD_MIN - 1e-6 || build > BUILD_MAX + 1e-6) return fail('Build out of range');
  look.scale = Math.round(clamp(scale, SCALE_MIN, SCALE_MAX) * 100) / 100;
  look.build = Math.round(clamp(build, BUILD_MIN, BUILD_MAX) * 100) / 100;
  return { ok: true, value: { name: raw.name, title: raw.title, arch: raw.arch, tier: raw.tier, moveStyle, attrs, look }, error: '' };
}

/* Simulation-facing profile, same shape as a ROSTER entry. */
function customProfile(custom, slot) {
  const archetype = ARCHETYPES[custom.arch];
  const look = Object.assign({}, custom.look);
  if (look.topStyle === 'bare') look.top = null;
  return {
    id: CUSTOM_IDS[slot], name: custom.name, title: TITLES[custom.title], rank: CUSTOM_RANK_BASE + slot, custom: true, slot,
    arch: custom.arch, moveStyle: custom.moveStyle, attrs: Object.assign({}, custom.attrs), range: archetype.range, style: Object.assign({}, archetype.style), look,
  };
}

/* ---------- random fighters (seeded, reproducible) ---------- */
function randomCustom(seed) {
  const rng = makeRng(seed);
  const pick = (list) => list[Math.floor(rng() * list.length) % list.length];
  const arch = pick(ARCHETYPE_IDS);
  const attrs = Object.assign({}, ARCHETYPES[arch].attrs);
  for (let i = 0; i < 6; i++) {                              // move single points around, staying legal
    const from = pick(ATTR_KEYS), to = pick(ATTR_KEYS);
    if (from === to || attrs[from] <= ATTR_MIN || attrs[to] >= ATTR_MAX) continue;
    attrs[from]--; attrs[to]++;
    if (attrTotal(attrs) > POINT_BUDGET) { attrs[from]++; attrs[to]--; }   // a move into the double-cost range must fit the budget
  }
  const look = {};
  for (const key of LOOK_CHOICE_KEYS) look[key] = pick(LOOK_CHOICES[key].options);
  if (rng() < 0.6) look.mask = 'none';                       // masks are a flourish, not the norm
  look.glow = rng() < 0.25 ? 'on' : 'off';
  for (const group of COLOR_GROUPS) look[group.key] = pick(group.swatches);
  look.scale = snapToStep(SCALE_MIN + rng() * (SCALE_MAX - SCALE_MIN), SCALE_MIN, SCALE_MAX, SCALE_STEP);
  look.build = snapToStep(BUILD_MIN + rng() * (BUILD_MAX - BUILD_MIN), BUILD_MIN, BUILD_MAX, BUILD_STEP);
  const fighter = { name: pick(NAME_IDEAS), title: Math.floor(rng() * TITLES.length) % TITLES.length, arch, tier: 'standard', attrs, look };
  fighter.moveStyle = rng() < 0.3 ? pick(MOVE_STYLE_IDS) : ARCHETYPE_MOVE_STYLE[arch];   // drawn last so older seeds keep their other picks
  return fighter;
}

/* Colour schemes derived from the top colour; repeated presses cycle the scheme. */
const HARMONY_SCHEMES = ['complementary', 'triadic', 'analogous', 'monochrome'];
function harmonize(look, schemeIndex) {
  const scheme = HARMONY_SCHEMES[((schemeIndex % HARMONY_SCHEMES.length) + HARMONY_SCHEMES.length) % HARMONY_SCHEMES.length];
  const base = hexToHsl(look.top);
  const sat = Math.max(0.45, base.s);
  const offsets = { complementary: [180, 0], triadic: [120, 240], analogous: [30, -30], monochrome: [0, 0] }[scheme];
  look.shorts = hslToHex(base.h + offsets[1], sat * 0.7, scheme === 'monochrome' ? 0.16 : 0.22);
  look.accent = hslToHex(base.h + offsets[0], Math.min(1, sat + 0.2), scheme === 'monochrome' ? 0.72 : 0.56);
  look.glove = scheme === 'monochrome' ? hslToHex(base.h, sat, 0.88) : look.accent;
  look.shoe = hslToHex(base.h + offsets[1], 0.15, 0.12);
  return scheme;
}

/* ---------- share codes: BP1-<base64url JSON array>-<checksum> ---------- */
const SHARE_LOOK_KEYS = ['hairStyle', 'eyes', 'brows', 'beard', 'headband', 'mask', 'topStyle', 'legs', 'hands', 'belt', 'feet', 'glow'];
const SHARE_FIELD_COUNT = 5 + ATTR_KEYS.length + SHARE_LOOK_KEYS.length + 2 + LOOK_COLOR_KEYS.length;   // codes before movement styles
const SHARE_FIELD_COUNT_STYLE = SHARE_FIELD_COUNT + 1;                                                     // + movement style index
function fnv1a(text) {
  let h = 0x811c9dc5;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h >>> 0;
}

function toBase64Url(text) { return btoa(text).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function fromBase64Url(text) {

  return atob(padded);
}
function encodeCustom(custom) {
  const fields = [SHARE_VERSION, custom.name, custom.title, ARCHETYPE_IDS.indexOf(custom.arch), TIERS.indexOf(custom.tier)];
  for (const key of ATTR_KEYS) fields.push(custom.attrs[key]);
  for (const key of SHARE_LOOK_KEYS) fields.push(LOOK_CHOICES[key].options.indexOf(custom.look[key]));
  fields.push(Math.round(custom.look.scale * 100), Math.round(custom.look.build * 100));
  for (const key of LOOK_COLOR_KEYS) fields.push(custom.look[key].slice(1).toLowerCase());
  fields.push(MOVE_STYLE_IDS.indexOf(custom.moveStyle));

}
/* Returns { ok, value, error }. Rejects anything malformed, oversized, tampered or out of range. Never throws. */
function decodeCustom(text, allowVeteran) {
  const fail = (error) => ({ ok: false, value: null, error });
  if (typeof text !== 'string') return fail('No code given');
  const code = text.replace(/\s+/g, '');
  if (!code) return fail('Paste a fighter code first');
  if (code.length > SHARE_MAX_LENGTH) return fail('Code is too long');
  const match = /^BP1-([A-Za-z0-9_-]{8,})-([0-9a-z]{1,8})$/.exec(code);
  if (!match) return fail('Not a BREAKPOINT fighter code');
  if (shareChecksum(match[1]) !== match[2]) return fail('Code is damaged or was edited (checksum mismatch)');
  let fields;
  try { fields = JSON.parse(fromBase64Url(match[1])); } catch (e) { return fail('Code could not be read'); }
  if (!Array.isArray(fields) || (fields.length !== SHARE_FIELD_COUNT && fields.length !== SHARE_FIELD_COUNT_STYLE)) return fail('Code has the wrong number of fields');
  if (fields[0] !== SHARE_VERSION) return fail('Code is from an unsupported version');
  let i = 1;
  const record = { name: fields[i++], title: fields[i++], arch: ARCHETYPE_IDS[fields[i++]], tier: TIERS[fields[i++]], attrs: {}, look: {} };
  for (const key of ATTR_KEYS) record.attrs[key] = fields[i++];
  for (const key of SHARE_LOOK_KEYS) record.look[key] = LOOK_CHOICES[key].options[fields[i++]];
  record.look.scale = Number.isInteger(fields[i]) ? fields[i] / 100 : NaN; i++;
  record.look.build = Number.isInteger(fields[i]) ? fields[i] / 100 : NaN; i++;
  for (const key of LOOK_COLOR_KEYS) { const hex = fields[i++]; record.look[key] = typeof hex === 'string' ? '#' + hex : null; }
  if (fields.length === SHARE_FIELD_COUNT_STYLE) record.moveStyle = Number.isInteger(fields[i]) ? MOVE_STYLE_IDS[fields[i]] : null;
  const checked = validateCustom(record);
  if (!checked.ok) return checked;
  if (checked.value.tier === 'veteran' && !allowVeteran) return fail('Veteran fighters need an Arcade clear first');
  return checked;
}

/* ---------- save slots ---------- */
const CustomRoster = {
  slots: new Array(CUSTOM_SLOTS).fill(null),
  revision: 0,                         // bumps on every change so previews and menus can refresh
  init() {
    this.slots = new Array(CUSTOM_SLOTS).fill(null);
    const raw = Store.get(KEY_CUSTOM);
    if (raw && raw.length <= STORE_MAX_LENGTH) this.loadFrom(readJson(KEY_CUSTOM));
    else if (raw) Diag.log('warn', 'Ignoring oversized custom fighter data');
    this.register();
  },
  loadFrom(stored) {
    if (!stored || !Array.isArray(stored.slots)) return;
    for (let i = 0; i < CUSTOM_SLOTS; i++) {
      const entry = stored.slots[i];
      if (entry === null || entry === undefined) continue;
      const checked = validateCustom(entry);
      if (checked.ok) this.slots[i] = checked.value;
      else Diag.log('warn', 'Dropped invalid custom fighter in slot ' + (i + 1) + ': ' + checked.error);
    }
  },
  save() { Store.set(KEY_CUSTOM, JSON.stringify({ version: CUSTOM_STORE_VERSION, slots: this.slots })); },
  /* Keep ROSTER_BY_ID in sync with the slots; ROSTER (the ladder order) never changes. */
  register() {
    for (const id of CUSTOM_IDS) delete ROSTER_BY_ID[id];
    for (let i = 0; i < CUSTOM_SLOTS; i++) if (this.slots[i]) ROSTER_BY_ID[CUSTOM_IDS[i]] = customProfile(this.slots[i], i);
    this.revision++;
    if (typeof Game !== 'undefined') Game.ensureSelection();
  },
  put(slot, custom) {
    if (slot < 0 || slot >= CUSTOM_SLOTS) return { ok: false, error: 'Unknown slot' };
    const checked = validateCustom(custom);
    if (!checked.ok) return checked;
    this.slots[slot] = checked.value;
    this.save();
    this.register();
    return checked;
  },
  remove(slot) {
    if (slot < 0 || slot >= CUSTOM_SLOTS || !this.slots[slot]) return false;
    this.slots[slot] = null;
    this.save();
    this.register();
    return true;
  },
  firstFree() { return this.slots.indexOf(null); },
  has(id) { const slot = CUSTOM_IDS.indexOf(id); return slot >= 0 && !!this.slots[slot]; },
  profiles() { return CUSTOM_IDS.map((id) => ROSTER_BY_ID[id]).filter(Boolean); },
};

/* =====================================================================
   06 AI - perception snapshots with reaction delay, action scoring, difficulty profiles.
   The AI only reads observable state (positions, current animation phase of the opponent),
   delayed by its reaction time. It never reads the opponent's controller input.
   ===================================================================== */
const DIFFICULTY = {
  easy: { id: 'easy', label: 'Easy', react: 18, interval: 22, blockSkill: 0.22, parry: 0.02, punish: 0.15, counter: 0.1, mistakes: 0.32, aggression: 0.6, heavy: 0.15, grab: 0.05, escape: 0.2, adapt: 0, sidestep: 0, lockout: 18, env: false },
  normal: { id: 'normal', label: 'Normal', react: 13, interval: 14, blockSkill: 0.5, parry: 0.08, punish: 0.45, counter: 0.3, mistakes: 0.14, aggression: 0.85, heavy: 0.3, grab: 0.12, escape: 0.4, adapt: 0.1, sidestep: 0.15, lockout: 11, env: false },
  hard: { id: 'hard', label: 'Hard', react: 10, interval: 9, blockSkill: 0.75, parry: 0.2, punish: 0.75, counter: 0.55, mistakes: 0.06, aggression: 1.05, heavy: 0.4, grab: 0.2, escape: 0.65, adapt: 0.35, sidestep: 0.35, lockout: 8, env: true },
  expert: { id: 'expert', label: 'Expert', react: 8, interval: 6, blockSkill: 0.9, parry: 0.35, punish: 0.92, counter: 0.8, mistakes: 0.02, aggression: 1.2, heavy: 0.5, grab: 0.3, escape: 0.85, adapt: 0.7, sidestep: 0.55, lockout: 6, env: true },
};
/* react = reaction delay in ticks (slower than most strikes on Easy, so blockSkill matters more as difficulty rises);
   parry = chance a reaction block is timed as a perfect block; adapt = chance to guard where the opponent usually attacks. */
const AI_HEIGHT_READ = 4;        // ticks into a strike before its height (high / mid / low) can be told apart
const AI_GRAB_APPROACH = 2.1;    // distance from which an AI may walk in for a grab
const AI_GRAB_STAMINA = 0.3;     // share of max stamina an AI needs before grabbing (grab + throw cost ~20-30)
const AI_THROW_TARGET_BONUS = 0.4;   // extra grab appeal when a wall or object would take the throw
const AI_THROW_READ = 0.6;       // escape chance per throw = difficulty escape skill x this
const AI_GRAB_BREAK = 0.3;       // chance to break a grab seen coming = blockSkill x this
const DIFFICULTY_ORDER = ['easy', 'normal', 'hard', 'expert'];
const AI_HISTORY = 48;
const AI_MOVES = ALL_MOVES.filter((m) => !m.ctx && m.type === 'strike');

class AIController {
  constructor(profile, difficultyId) {
    this.profile = profile;
    this.d = DIFFICULTY[difficultyId] || DIFFICULTY.normal;
    this.hist = [];
    for (let i = 0; i < AI_HISTORY; i++) this.hist.push({ dist: 9, state: S.IDLE, moveId: 0, mvType: '', mvH: '', mvReach: 0, mvWidth: 0, moveTick: 0, startup: 0, active: 0, total: 0, y: 0, pendingThrow: -1, hp: 1, stam: 1, mvCat: '' });
    this.reset();
  }
  reset() {
    this.head = 0; this.count = 0; this.plan = null; this.nextDecision = 0; this.lastMoves = [];
    this.readThrow = null; this.willEscape = false; this.escapeAt = 0;
    this.threatId = -1; this.threatResp = null; this.breakGrabId = -1; this.punishId = -1; this.punishYes = false; this.steerSide = 1;
    this.oppRecent = []; this.lastOppMoveId = 0; this.counterTried = false; this.clinchPlan = null; this.tickNo = 0;
  }
  observe(f, opp) {
    const s = this.hist[this.head];
    const mv = opp.move;
    s.dist = Math.hypot(opp.x - f.x, opp.z - f.z);
    s.state = opp.state; s.moveId = opp.moveId; s.y = opp.y;
    s.mvType = mv ? mv.type : ''; s.mvH = mv ? mv.h : ''; s.mvReach = mv ? mv.reach * opp.stats.reach : 0; s.mvWidth = mv ? mv.width : 0; s.mvCat = mv ? mv.cat : '';
    s.moveTick = opp.moveTick; s.startup = opp.mStartup; s.active = opp.mActive; s.total = opp.mStartup + opp.mActive + opp.mRecovery + opp.whiffExtra;
    s.pendingThrow = opp.throwPending ? opp.throwPending.tick : -1;

    return this.hist[(this.head - 1 - Math.max(0, k) + AI_HISTORY * 2) % AI_HISTORY];
  }

  /* Steer around solid obstacles: rotate the desired heading until the short path ahead is clear. */
  steer(f, dx, dz) {
    const len = Math.hypot(dx, dz) || 1;
    dx /= len; dz /= len;
    const r = 0.3, look = 1.7;
    if (!Arena.pathBlocked(f.x, f.z, f.x + dx * look, f.z + dz * look, r)) return [dx, dz];
    for (const a of [0.7, 1.4, 2.1]) {
      for (const sgn of [this.steerSide, -this.steerSide]) {
        const c = Math.cos(a * sgn), s = Math.sin(a * sgn);
        const nx = dx * c - dz * s, nz = dx * s + dz * c;
        if (!Arena.pathBlocked(f.x, f.z, f.x + nx * look, f.z + nz * look, r)) { this.steerSide = sgn; return [nx, nz]; }

    return [dx, dz];
  }
  moveToward(f, it, dx, dz, run) {
    const [sx, sz] = this.steer(f, dx, dz);
    const fx = f.fwdX, fz = f.fwdZ;
    it.fwd = sx * fx + sz * fz;
    it.side = sx * -fz + sz * fx;
    it.run = !!run && it.fwd > 0.6;
  }

  think(f, opp, match, it) {
    clearIntent(it);
    this.tickNo++;
    this.observe(f, opp);
    const d = this.d;
    const snap = this.delayed(d.react);
    if (!f.alive || TERMINAL_STATES.includes(f.state)) return it;
    if (f.state !== S.GRAPPLE) this.clinchPlan = null;   // every clinch gets a fresh plan
    // reactions to the clinch and getting up
    if (f.state === S.CLINCH) return this.thinkClinched(f, opp, it, snap);
    if (f.state === S.GRAPPLE) return this.thinkGrapple(f, opp, match, it);
    if (f.state === S.DOWN) { if (d.id !== 'easy' && f.stam > 20 && f.stateTicks > 16 && simRng() < 0.15) it.dash = true; return it; }
    if (REACTION_STATES.includes(f.state)) { this.plan = null; this.counterTried = false; return it; }
    // facing: nothing to do, fighter auto-faces
    const dist = Math.hypot(opp.x - f.x, opp.z - f.z);

    // 1. reactive defence against attacks seen (with delay)
    this.reactToThreat(f, opp, snap, it);
    const tr = this.threatResp;
    if (tr && tr.until > this.tickNo && f.state !== S.ATTACK) {
      if (tr.kind === 'block' && !tr.read && snap.moveId === tr.id && snap.moveTick >= AI_HEIGHT_READ) { tr.read = true; tr.h = snap.mvH; }   // the strike's line is visible now

      it.blockL = tr.kind === 'block' && tr.h === 'L';
      it.noParry = tr.kind === 'block' && !tr.parry;
      if (tr.kind === 'sidestep' && !tr.done) { tr.done = true; it.sidestep = simRng() < 0.5 ? -1 : 1; }
      return it;
    }
    // 2. counter-attack after a successful block
    if (f.counterWindow > 0 && !this.counterTried && f.state !== S.ATTACK) {
      this.counterTried = true;
      if (simRng() < d.counter) { if (simRng() < 0.6) it.lp = true; else it.lk = true; this.plan = null; return it; }
    }
    if (f.counterWindow === 0) this.counterTried = false;
    // 3. chaining while attacking
    if (f.state === S.ATTACK) { this.thinkChain(f, opp, it); return it; }
    // 4. execute / choose plan
    if (this.plan) {
      this.runPlan(f, opp, it);
      if (this.plan && this.plan.ticks <= 0) this.plan = null;
    }
    const punish = this.checkPunish(f, opp, snap, dist);
    if (punish) { this.plan = punish; this.runPlan(f, opp, it); return it; }
    if (!this.plan && f.lock === 0 && this.tickNo >= this.nextDecision) {
      this.plan = this.decide(f, opp, match, snap, dist);
      this.nextDecision = this.tickNo + d.interval;
      if (this.plan) this.runPlan(f, opp, it);
    }
    return it;
  }

  reactToThreat(f, opp, snap, it) {
    const d = this.d;
    const incoming = snap.state === S.ATTACK && (snap.mvType === 'strike' || snap.mvType === 'grab') && snap.moveTick <= snap.startup + 1 && snap.dist <= snap.mvReach + 1.0;
    if (!incoming || snap.moveId === this.threatId) return;
    this.threatId = snap.moveId;
    const roll = simRng();
    const hold = snap.startup + snap.active - snap.moveTick + d.react + 8;
    if (this.profile && f.state !== S.ATTACK && f.lock === 0) {
      if (snap.mvType === 'grab') {
        // too fast to dodge on reaction (startup ~9 vs react >= 8), but a grab seen coming is broken at the first legal tick
        if (roll < d.blockSkill * AI_GRAB_BREAK) this.breakGrabId = snap.moveId;
      } else if (roll < d.blockSkill) {
        this.threatResp = { kind: 'block', h: this.guessHeight(), id: snap.moveId, read: false, parry: simRng() < d.parry, until: this.tickNo + hold, done: false };
        this.plan = null;
      } else if (roll < d.blockSkill + d.sidestep * 0.5 && snap.mvWidth < 0.5 && f.stam > 10) {
        this.threatResp = { kind: 'sidestep', h: snap.mvH, until: this.tickNo + 6, done: false };
        this.plan = null;
      }
    }
  }
  /* Too early to see where a strike goes: guard high (covers high and mid), or low once this AI has learned the opponent mostly attacks low. */
  guessHeight() {
    const lows = this.oppRecent.filter((h) => h === 'L').length;
    return lows * 2 > this.oppRecent.length && simRng() < this.d.adapt ? 'L' : 'H';
  }
  checkPunish(f, opp, snap, dist) {
    const d = this.d;
    if (!(snap.state === S.ATTACK && (snap.mvType === 'strike' || snap.mvType === 'grab'))) return null;   // a grab still in ATTACK after its active ticks has whiffed
    const remaining = snap.total - snap.moveTick;
    if (snap.moveTick <= snap.startup + snap.active || remaining < 7) return null;
    if (this.punishId !== snap.moveId) { this.punishId = snap.moveId; this.punishYes = simRng() < d.punish; }
    if (!this.punishYes || f.lock > 0 || f.lowStamina) return null;
    const mv = this.pickMove(f, opp, snap, dist, true);
    if (mv) { this.punishYes = false; return this.attackPlan(mv); }
    if (dist < 3.2 && f.stam > 25) return { kind: 'walk', ticks: 6, away: false, run: true };
    return null;
  }

  thinkChain(f, opp, it) {
    const d = this.d, mv = f.move;
    if (!mv || !f.moveConnected || mv.tier === 3 || f.chainCount >= 3) return;
    if (f.moveTick < f.mStartup + 1 || f.moveTick > f.mStartup + f.mActive + 4) return;
    if (simRng() > 0.18 + d.aggression * 0.22) return;
    const dist = Math.hypot(opp.x - f.x, opp.z - f.z);
    const pool = AI_MOVES.filter((m) => Combat.canChain(mv, m, f) && dist <= m.reach * f.stats.reach + 0.2 && f.stam > m.stam);
    if (!pool.length) return;
    const pick = pool[Math.floor(simRng() * pool.length)];
    this.pressMove(it, pick);
  }
  pressMove(it, mv) {
    it[mv.btn] = true;
    it.strong = mv.strong;
    it.height = mv.height;
  }
  attackPlan(mv) {
    return { kind: 'attack', ticks: this.d.lockout, mv, fired: false };
  }

  inRange(f, mv, dist) { return dist <= mv.reach * f.stats.reach + 0.34 - 0.08 && dist >= 0.45; }
  pickMove(f, opp, snap, dist, fastOnly) {
    const d = this.d, st = this.profile.style;
    let best = null, bestScore = 0;
    const oppState = snap.state;
    const oppCrouch = oppState === S.CROUCH || oppState === S.BLOCK_L;
    const blockingH = oppState === S.BLOCK_H, blockingL = oppState === S.BLOCK_L;
    for (const mv of AI_MOVES) {
      if (!this.inRange(f, mv, dist)) continue;
      if (fastOnly && mv.startup > 11) continue;
      let sc = 0.5;
      sc *= mv.cat === 'punch' ? 0.4 + st.punch : mv.cat === 'kick' ? 0.4 + st.kick : 0.3 + st.heavy * d.heavy * 2.2;
      if (mv.h === 'L') sc *= 0.5 + st.low;
      sc *= 1.25 - mv.startup / 30;
      const cost = mv.stam;
      if (f.stam < cost * 2 + 10) sc *= 0.25; else if (f.lowStamina) sc *= mv.tier === 3 ? 0.15 : 0.5;
      if (blockingH) sc *= mv.h === 'L' ? 1.8 : 0.45;
      if (blockingL) sc *= mv.h === 'L' ? 0.3 : 1.4;
      if (oppCrouch && mv.h === 'H') sc *= 0.1;
      if (snap.y > 0.4 && mv.h === 'L') sc *= 0.1;
      if (this.lastMoves.includes(mv.id)) sc *= 0.6;
      sc *= 1 + (simRng() - 0.5) * (0.3 + d.mistakes * 3);
      if (sc > bestScore) { bestScore = sc; best = mv; }
    }
    return best;
  }

  decide(f, opp, match, snap, dist) {
    const d = this.d, st = this.profile.style;
    const pref = this.profile.range;
    const options = [];
    const add = (score, plan) => { options.push({ score: score * (1 + (simRng() - 0.5) * (0.25 + d.mistakes * 3)), plan }); };
    const low = f.lowStamina;
    const aggr = st.aggr * d.aggression;
    const b = Arena.def.bounds;
    const cornered = Math.abs(f.x) > b.x - 1.2 || Math.abs(f.z) > b.z - 1.0;
    const interval = d.interval;
    // spacing
    if (dist > pref + 0.35) add(0.5 + clamp((dist - pref - 0.35) * 0.9, 0, 3) * aggr * (low ? 0.3 : 1), { kind: 'walk', ticks: interval, away: false, run: dist > 3.6 && f.stam > f.maxStam * 0.45 && d.id !== 'easy' });
    if (dist < pref - 0.25 || low) add((clamp(pref - dist, 0, 2) * 1.2 + (low ? 1.6 : 0.1)) * (1.2 - aggr * 0.4), cornered ? { kind: 'circle', ticks: interval, side: simRng() < 0.5 ? -1 : 1, hold: true } : { kind: 'walk', ticks: interval, away: true, run: false });
    if (Math.abs(dist - pref) < 0.9) add(0.15 + st.circle * 0.9 * (d.id === 'easy' ? 0.4 : 1), { kind: 'circle', ticks: interval + 4, side: simRng() < 0.5 ? -1 : 1, hold: true });
    if (dist < pref + 0.9 && !low) add(0.12 + st.defend * 0.5 * d.blockSkill, { kind: 'guard', ticks: interval + 4, low: simRng() < 0.3 });
    if (low) add(0.3, { kind: 'guard', ticks: interval + 8, low: false });   // blocking drains stamina too: a tired AI mostly backs off
    // attacks
    if (!low || snap.state === S.STAGGER) {
      const mv = this.pickMove(f, opp, snap, dist, false);
      if (mv) add(0.9 * aggr + (snap.state === S.STAGGER || snap.state === S.HIT ? 1.2 : 0), this.attackPlan(mv));
    }
    // grapple (also towards scenery for harder AIs)
    // grapple: close in from mid range, then grab (low grab against a crouching or low-blocking opponent)
    if (dist < AI_GRAB_APPROACH && snap.y < 0.3 && f.stam > f.maxStam * AI_GRAB_STAMINA) {
      let g = st.grab * d.grab * 6 + (snap.state === S.BLOCK_H || snap.state === S.BLOCK_L ? 1.0 : 0);
      const lowGrab = snap.state === S.CROUCH || snap.state === S.BLOCK_L;
      let dir = 'fwd';
      if (d.env) {
        const target = this.throwTarget(f, opp);
        if (target) { dir = target.dir; g += AI_THROW_TARGET_BONUS; }
      }
      add(g, { kind: 'grab', ticks: d.lockout + 8 + (dist > 1.3 ? 12 : 0), dir, low: lowGrab });
    }
    // sidestep / dash / jump for variety
    if (d.sidestep > 0 && dist < pref + 1 && f.stam > 15) add(0.1 + d.sidestep * st.circle * 0.5, { kind: 'sidestep', ticks: 14, side: simRng() < 0.5 ? -1 : 1 });
    if (d.id !== 'easy' && dist > 2.4 && dist < 4.2 && f.stam > f.maxStam * 0.5) add(0.12 * aggr, { kind: 'dash', ticks: 14 });
    if (d.id !== 'easy' && dist > 1.8 && dist < 2.8 && f.stam > f.maxStam * 0.6) add(0.08 * st.kick * aggr, { kind: 'jumpkick', ticks: 24, t: 0 });
    let best = null, bs = -1;
    for (const o of options) if (o.score > bs) { bs = o.score; best = o.plan; }
    if (best && best.kind === 'attack') { this.lastMoves.push(best.mv.id); if (this.lastMoves.length > 2) this.lastMoves.shift(); }
    return best;
  }

  /* Find a breakable object (preferred) or a wall where a throw in some direction would land the opponent. */
  throwTarget(f, opp) {
    let best = null, bd = 1e9;
    for (const dir of THROW_DIRS) {
      const v = Combat.throwVector(f, dir), dx = v[0], dz = v[1];
      const tx = opp.x + dx * 3.0, tz = opp.z + dz * 3.0;
      const obj = Arena.nearestObject(tx, tz, 1.4, true);
      if (obj) { const dd = Math.hypot(obj.x - tx, obj.z - tz); if (dd < bd) { bd = dd; best = { dir, kind: 'object' }; } }
    }
    if (best) return best;
    const b = Arena.def.bounds;
    for (const dir of THROW_DIRS) {
      const v = Combat.throwVector(f, dir), dx = v[0], dz = v[1];
      const tx = opp.x + dx * 2.6, tz = opp.z + dz * 2.6;
      if (Math.abs(tx) > b.x - 0.4 || Math.abs(tz) > b.z - 0.4) return { dir, kind: 'wall' };
    }
    return null;
  }
  /* True when the thrower's own back is near a wall. */
  cornered(f) {
    const b = Arena.def.bounds, bx = f.x - f.fwdX * 1.4, bz = f.z - f.fwdZ * 1.4;
    return Math.abs(bx) > b.x - 0.5 || Math.abs(bz) > b.z - 0.5;
  }
  /* Deliberate throw choice: scenery or walls first (smarter CPUs), escape a corner by throwing past us, else by style. */
  chooseThrowDir(f, opp) {
    const target = this.d.env ? this.throwTarget(f, opp) : null;
    if (target) return target.dir;
    if (this.cornered(f)) return 'back';                     // the opponent lands in our corner, we face the open floor
    const st = this.profile.style, roll = simRng();
    if (roll < st.heavy * 0.45 + st.grab * 0.25) return 'back';
    if (roll < st.heavy * 0.45 + st.grab * 0.25 + st.circle * 0.35) return simRng() < 0.5 ? 'left' : 'right';
    return 'fwd';
  }

  runPlan(f, opp, it) {
    const p = this.plan;
    if (!p) return;
    p.ticks--;
    switch (p.kind) {
      case 'walk': { let dx = opp.x - f.x, dz = opp.z - f.z; if (p.away) { dx = -dx; dz = -dz; } this.moveToward(f, it, dx, dz, p.run); break; }
      case 'circle': it.side = p.side; it.fwd = p.hold ? clamp((this.profile.range - Math.hypot(opp.x - f.x, opp.z - f.z)) * -1.5, -0.6, 0.6) : 0; break;
      case 'guard': if (p.low) it.blockL = true; else it.blockH = true; break;
      case 'attack':
        if (!p.fired) { p.fired = true; this.pressMove(it, p.mv); }
        break;
      case 'grab': {
        if (p.fired) break;
        const dx = opp.x - f.x, dz = opp.z - f.z;
        if (!this.inRange(f, ATTACKS.grab, Math.hypot(dx, dz))) { this.moveToward(f, it, dx, dz, false); break; }
        p.fired = true; it.grapple = true; it.grapDir = p.dir;
        if (p.low) it.crouch = true;
        break;
      }
      case 'sidestep': if (!p.fired) { p.fired = true; it.sidestep = p.side; } break;
      case 'dash': if (!p.fired) { p.fired = true; it.dash = true; it.fwd = 1; } break;
      case 'jumpkick':
        p.t++;
        if (p.t === 1) { it.jump = true; it.fwd = 1; }
        if (p.t === 8) it.rk = true;
        break;
      default: break;
    }
  }

  thinkGrapple(f, opp, match, it) {
    if (!this.clinchPlan) this.clinchPlan = { at: 8 + Math.floor(simRng() * 20), knees: this.d.id === 'easy' ? 0 : Math.floor(simRng() * 2.2), done: false, dir: 'pending' };
    const cp = this.clinchPlan;
    if (f.throwPending) return it;
    if (f.clinchTick >= cp.at) {
      if (cp.knees > 0 && f.clinchStrikeCd === 0 && f.stam > 12) { cp.knees--; it.lp = true; cp.at = f.clinchTick + 24; return it; }
      if (!cp.dir || cp.dir === 'pending') cp.dir = this.chooseThrowDir(f, opp);
      const dir = cp.dir;
      it.lk = true; it.strong = f.stam > 40 && simRng() < 0.4;
      // express the throw direction through movement axes, exactly like a player holding the stick
      it.fwd = dir === 'fwd' ? 1 : dir === 'back' ? -1 : 0; it.side = dir === 'right' ? 1 : dir === 'left' ? -1 : 0;
    }
    return it;
  }
  thinkClinched(f, opp, it, snap) {
    const d = this.d;
    if (f.clinchTick < escapeStartFor(f) + 1 || f.escapeLock > 0) return it;
    if (this.breakGrabId === opp.moveId) { this.breakGrabId = -1; it.grapple = true; return it; }
    const tp = opp.throwPending;
    if (tp) {
      // read each throw once: a hit means a timed escape press inside the window, a miss means no press
      if (this.readThrow !== tp) {
        this.readThrow = tp;
        this.willEscape = simRng() < d.escape * AI_THROW_READ;
        this.escapeAt = Math.min(Math.round(d.react * 0.6), tp.data.escapeUntil - 1);
      }
      if (this.willEscape && tp.tick >= this.escapeAt) it.grapple = true;
      return it;
    }
    if (simRng() < d.escape * 0.012) it.grapple = true;
    return it;
  }
}

/* Training dummy: scripted behaviours for practice. */
const DUMMY_MODES = ['stand', 'block', 'blockLow', 'crouch', 'jump', 'walk', 'attackHigh', 'attackLow', 'attackMix', 'blockAfterHit', 'easy', 'normal', 'hard', 'expert'];
const DUMMY_LABEL = { stand: 'Stand still', block: 'Block high', blockLow: 'Block low', crouch: 'Crouch', jump: 'Jump', walk: 'Walk back and forth', attackHigh: 'Attack high', attackLow: 'Attack low', attackMix: 'Attack high or low', blockAfterHit: 'Block after the first hit', easy: 'CPU Easy', normal: 'CPU Normal', hard: 'CPU Hard', expert: 'CPU Expert' };
const DUMMY_AI_MODES = ['easy', 'normal', 'hard', 'expert'];
const DUMMY_ATTACK_EVERY = 75;       // ticks between dummy attacks: time to practise blocking and punishing
const DUMMY_ATTACK_RANGE = 1.3;      // the attacking dummy walks in until it is this close
const DUMMY_GUARD_TICKS = 40;        // 'block after hit' keeps blocking this long after a hit: only true combos land
class DummyController {
  constructor(profile, mode) { this.profile = profile; this.mode = mode; this.ai = null; this.t = 0; this.guardTicks = 0; this.setMode(mode); }
  setMode(mode) {
    this.mode = mode;
    this.ai = DUMMY_AI_MODES.includes(mode) ? new AIController(this.profile, mode) : null;
  }
  reset() { if (this.ai) this.ai.reset(); this.t = 0; this.guardTicks = 0; }
  think(f, opp, match, it) {
    clearIntent(it);
    this.t++;
    if (this.ai) return this.ai.think(f, opp, match, it);
    if (REACTION_STATES.includes(f.state)) this.guardTicks = DUMMY_GUARD_TICKS;
    if (!f.alive || REACTION_STATES.includes(f.state)) return it;
    switch (this.mode) {
      case 'block': it.blockH = true; break;
      case 'blockLow': it.blockL = true; break;
      case 'crouch': it.crouch = true; break;
      case 'jump': if (this.t % 90 === 1) it.jump = true; break;
      case 'walk': it.side = Math.sin(this.t / 50) > 0 ? 1 : -1; break;
      case 'attackHigh': case 'attackLow': case 'attackMix': this.attack(f, opp, it); break;
      case 'blockAfterHit': if (this.guardTicks > 0) { this.guardTicks--; it.blockH = true; } break;
      default: break;
    }
    return it;
  }
  /* Walk in, then a jab (high) or a low kick on a steady beat. */
  attack(f, opp, it) {
    if (Math.hypot(opp.x - f.x, opp.z - f.z) > DUMMY_ATTACK_RANGE) { it.fwd = 1; return; }
    if (this.t % DUMMY_ATTACK_EVERY !== 0) return;
    const low = this.mode === 'attackLow' || (this.mode === 'attackMix' && simRng() < 0.5);
    if (low) { it.lk = true; it.height = true; } else it.lp = true;
  }
}

/* =====================================================================
   07 MATCH - authoritative simulation (fixed 60 Hz), round rules, game-state manager, game loop.
   Per tick: input -> AI -> fighter logic -> combat -> physics -> world -> animation -> round rules.
   ===================================================================== */
const Match = { current: null };
const DT = FIXED_DT;
const ROUND_BANNER_TICKS = 48;        // "ROUND n" stays readable this long before the count starts
const COUNT_STEP_TICKS = 45;          // one countdown number; round 1 counts from 3, later rounds from 2
const ROUND_END_TICKS = 110;
const KO_DELAY_TICKS = 45;
const KO_SLOW_TICKS = 30;             // slow motion starts on the knock-out blow itself
const SKIP_ARM_TICKS = 30;            // the round-end sequence can be skipped after this long
const TIMER_LOW_SECONDS = 10;         // the round timer turns to the warning colour
const TIMER_BEEP_SECONDS = 5;         // and beeps once a second from here

const PlayerController = {
  think(f, opp, match, it) { return Input.fillIntent(it, f, opp); },
  reset() {},
};
const ScriptedController = {
  make(fn) { return { think(f, opp, match, it) { clearIntent(it); fn(it, f, opp, match); return it; }, reset() {} }; },
};

class MatchSim {
  constructor(cfg) {
    this.cfg = Object.assign({ mode: 'free', playerId: 'kai', opponentId: 'mara', arenaId: 'warehouse', difficulty: 'normal', winsNeeded: 2, timer: 60, seed: 1, playerHp: 1, countdown: true, dummy: 'stand' }, cfg);
    simRng = makeRng(this.cfg.seed);
    this.def = ARENAS[this.cfg.arenaId];
    Arena.build(this.def);
    const p1 = ROSTER_BY_ID[this.cfg.playerId] || ROSTER_BY_ID.kai;
    let p2 = ROSTER_BY_ID[this.cfg.opponentId] || ROSTER_BY_ID.mara;
    if (this.cfg.mode === 'arcade' && p2.bossAttrs) p2 = Object.assign({}, p2, { attrs: p2.bossAttrs });   // the Arcade final boss fights at full strength
    this.fighters = [new Fighter(p1, 0), new Fighter(p2, 1)];
    this.training = this.cfg.mode === 'training';
    this.controllers = [PlayerController, this.training ? new DummyController(p2, this.cfg.dummy) : new AIController(p2, this.cfg.difficulty)];
    this.intents = [makeIntent(), makeIntent()];
    this.tick = 0;
    this.matchTicks = 0;
    this.round = 0;
    this.wins = [0, 0];
    this.winsNeeded = this.cfg.winsNeeded;
    this.decider = false;
    this.hitStop = 0;
    this.phase = 'countdown';
    this.phaseTicks = 0;
    this.roundTicks = 0;
    this.endTimer = 0;
    this.locked = false;
    this.roundWinner = -1;
    this.matchOver = false;
    this.matchWinner = -1;
    this.slowTicks = 0;
    this.stats = [this.newStats(), this.newStats()];
    this.lastMove = null;
    this.infiniteHp = false;
    this.infiniteStam = false;
    this.lastCountdown = -1;
    this.disposed = false;
    this.unsub = [];
    this.subscribe();
    Match.current = this;
    this.startRound();
  }
  newStats() { return { damage: 0, taken: 0, hits: 0, blocks: 0, perfect: 0, maxCombo: 0, throws: 0, objects: 0, kos: 0 }; }

  subscribe() {
    const on = (name, fn) => this.unsub.push(Events.on(name, fn));
    on('hit', (e) => {
      const s = this.stats[e.att.index];
      s.damage += e.dmg; s.hits++; s.maxCombo = Math.max(s.maxCombo, e.combo || 1);
      this.stats[e.def.index].taken += e.dmg;
      if (e.att.index === 0 && e.mv && ATTACKS[e.mv.id] && this.lastMove) {
        const lm = this.lastMove, base = ATTACKS[e.mv.id], reacting = e.def.state === S.HIT || e.def.state === S.STAGGER;
        lm.result = 'hit'; lm.dmg = e.dmg;
        lm.adv = frameAdvantage(base, { active: lm.active, recovery: lm.recovery, hitstun: reacting ? e.def.reactDur : base.hitstun });
      }
    });
    on('block', (e) => {
      const s = this.stats[e.def.index];
      s.blocks++; if (e.perfect) s.perfect++;
      if (e.att.index === 0 && this.lastMove) {
        const lm = this.lastMove;
        lm.result = e.perfect ? 'perfect block' : 'blocked';
        lm.adv = frameAdvantage(e.mv, { active: lm.active, recovery: lm.recovery, blockstun: e.def.blockStun || e.mv.blockstun });
      }
    });
    on('throw', (e) => { this.stats[e.att.index].throws++; this.stats[e.att.index].damage += e.dmg; this.stats[e.def.index].taken += e.dmg; });
    on('objBreak', (e) => { if (e.by === 0 || e.by === 1) this.stats[e.by].objects++; });
    on('ko', (e) => { if (e.att) this.stats[e.att.index].kos++; });
    on('attackStart', (e) => {
      if (e.f.index === 0) this.lastMove = { mv: e.mv, startup: e.f.mStartup, active: e.f.mActive, recovery: e.f.mRecovery, result: '-', adv: null, dmg: 0 };
    });
  }
  dispose() {
    this.unsub.forEach((off) => off());
    this.unsub.length = 0;
    this.disposed = true;
    if (Match.current === this) Match.current = null;
  }

  get player() { return this.fighters[0]; }
  get opponent() { return this.fighters[1]; }
  floorHp(f) { return this.training && this.infiniteHp && f.index === 1 ? 1 : 0; }
  /* Damage only counts while the round is being fought: not after a KO or the bell. */
  get live() { return this.phase === 'fight' && !this.locked; }
  get timeLeft() { return this.cfg.timer > 0 && !this.training ? Math.ceil(this.roundTicks / 60) : null; }
  get countFrom() { return this.round === 1 ? 3 : 2; }

  placeFighters(hpFrac) {
    const s = this.def.spawn;
    this.fighters[0].reset(-s, 0, Math.PI / 2, hpFrac, 1);
    this.fighters[1].reset(s, 0, -Math.PI / 2, 1, 1);
    for (const c of this.controllers) c.reset();
    this.intents.forEach(clearIntent);
  }
  startRound() {
    this.round++;
    this.placeFighters(this.round === 1 || this.cfg.mode === 'survival' ? this.cfg.playerHp : 1);   // survival health carries into a drawn round's replay
    this.roundTicks = this.cfg.timer * 60;
    this.hitStop = 0;
    this.endTimer = 0;
    this.locked = false;
    this.roundWinner = -1;
    this.slowTicks = 0;
    this.phaseTicks = 0;
    this.lastCountdown = -1;
    Camera.snapNext = true;
    Input.reset();
    this.phase = this.cfg.countdown ? 'countdown' : 'fight';
    Events.emit('roundStart', { round: this.round, match: this });
    if (this.phase === 'fight') Events.emit('fightStart', {});
  }

  /* ----- one fixed simulation tick ----- */
  step() {
    this.tick++;
    this.phaseTicks++;
    switch (this.phase) {
      case 'countdown': this.stepCountdown(); break;
      case 'fight': this.stepFight(); break;
      case 'roundEnd': this.stepRoundEnd(); break;
      default: this.stepIdle(); break;
    }
    Arena.update(DT);
    Debris.update(DT);
    FX.update(DT);
  }
  stepCountdown() {
    const counting = this.phaseTicks - ROUND_BANNER_TICKS;
    const n = this.countFrom - Math.floor(counting / COUNT_STEP_TICKS);
    if (counting >= 0 && n !== this.lastCountdown && n >= 1) { this.lastCountdown = n; Events.emit('countdown', { n }); }
    for (const f of this.fighters) f.animate(DT);
    if (counting >= this.countFrom * COUNT_STEP_TICKS) {
      this.phase = 'fight';
      this.phaseTicks = 0;
      Input.reset();
      Events.emit('fightStart', {});
    }
  }
  readIntents() {
    const [a, b] = this.fighters;
    for (let i = 0; i < 2; i++) {
      const f = this.fighters[i], opp = this.fighters[i ^ 1];
      if (this.locked || !f.alive) clearIntent(this.intents[i]);
      else this.controllers[i].think(f, opp, this, this.intents[i]);
    }
    if (this.training) {
      if (this.infiniteStam) { b.stam = b.maxStam; }
      if (this.infiniteHp && b.alive && b.hp < b.maxHp && !REACTION_STATES.includes(b.state) && this.tick % 120 === 0) b.hp = b.maxHp;
    }
    void a;
  }
  stepFight() {
    const [a, b] = this.fighters;
    if (this.hitStop > 0) {
      this.hitStop--;
      for (const f of this.fighters) f.animate(0);
      return;
    }
    this.matchTicks++;
    this.readIntents();
    for (let i = 0; i < 2; i++) this.fighters[i].update(this.intents[i], this.fighters[i ^ 1], this);
    this.resolveCombat();
    this.physics();
    Combat.tickCombos(this.fighters);
    for (const f of this.fighters) f.animate(DT);
    if (this.training) this.trainingMaintenance();
    else this.checkRoundEnd();
    void a; void b;
  }
  resolveCombat() {
    const descs = [];
    for (const att of this.fighters) {
      if (att.state !== S.ATTACK || !att.move) continue;
      const t = att.moveTick;
      if (t > att.mStartup && t <= att.mStartup + att.mActive) {
        const d = Combat.evaluate(att, this.fighters[att.index ^ 1]);
        if (d) descs.push(d);
        if (att.move.type === 'strike') Combat.hitObjects(att, this);
      }
    }
    for (const d of descs) Combat.apply(d, this);
  }
  physics() {
    const [a, b] = this.fighters;
    const air = [a.integrate(DT), b.integrate(DT)];
    this.separate(a, b);
    for (let i = 0; i < 2; i++) {
      const f = this.fighters[i];
      Arena.resolveFighter(f);
      f.afterCollision(air[i]);
      Combat.impactCheck(f, this);
    }
  }
  separate(a, b) {
    if (a.state === S.CLINCH || a.state === S.GRAPPLE || b.state === S.CLINCH || b.state === S.GRAPPLE) return;
    if (a.state === S.THROWN || b.state === S.THROWN) return;
    if (Math.abs(a.y - b.y) > 1.25) return;
    let dx = b.x - a.x, dz = b.z - a.z;
    let d = Math.hypot(dx, dz);
    const min = a.radius + b.radius;
    if (d >= min) return;
    if (d < 1e-5) { dx = 1; dz = 0; d = 1; }
    const push = (min - d) / 2;
    a.x -= (dx / d) * push; a.z -= (dz / d) * push;
    b.x += (dx / d) * push; b.z += (dz / d) * push;
  }
  trainingMaintenance() {
    const [a, b] = this.fighters;
    if (!a.alive || !b.alive) {
      this.endTimer++;
      if (this.endTimer > 100) { this.endTimer = 0; this.resetFighters(); }
    }
  }
  resetFighters() {
    this.placeFighters(1);
    Camera.snapNext = true;
    Events.emit('trainingReset', {});
  }
  resetArenaObjects() { Arena.reset(); Events.emit('trainingReset', {}); }
  scenario(n) {
    const [a, b] = this.fighters;
    this.placeFighters(1);
    const bx = this.def.bounds.x;
    if (n === 2) { a.x = -0.55; b.x = 0.55; } else if (n === 3) { b.x = bx - 0.7; a.x = b.x - 1.4; } else if (n === 4) {
      const o = Arena.objects.find((q) => !q.destroyed && q.type !== 'panel') || Arena.objects[0];
      if (o) { b.x = o.x - (o.hx + 1.0); b.z = o.z; a.x = b.x - 1.2; a.z = o.z; }
    } else if (n === 5) { b.stam = b.maxStam * 0.12; this.infiniteStam = false; }   // infinite stamina would refill it at once
    for (const f of this.fighters) { f.prevX = f.x; f.prevZ = f.z; }
    Camera.snapNext = true;
    Events.emit('trainingReset', {});
  }
  setDummy(mode) { this.cfg.dummy = mode; this.controllers[1].setMode(mode); }

  /* ----- round rules ----- */
  checkRoundEnd() {
    const [a, b] = this.fighters;
    if (!a.alive || !b.alive) {
      if (!this.locked) this.slowTicks = KO_SLOW_TICKS;
      this.locked = true;
      this.endTimer++;
      if (this.slowTicks > 0) this.slowTicks--;
      if (this.endTimer >= KO_DELAY_TICKS) this.endRound('ko');
      return;
    }
    if (this.cfg.timer > 0) {
      this.roundTicks--;
      if (this.roundTicks <= 0) { this.roundTicks = 0; this.endRound('time'); return; }
      const whole = this.roundTicks % 60 === 0, seconds = this.roundTicks / 60;
      if (whole && seconds <= TIMER_BEEP_SECONDS) Events.emit('timeWarn', { seconds });
    }
  }
  endRound(reason) {
    const [a, b] = this.fighters;
    let winner = -1;
    if (a.alive && !b.alive) winner = 0;
    else if (b.alive && !a.alive) winner = 1;
    else if (a.alive && b.alive) {
      const ha = a.hp / a.maxHp, hb = b.hp / b.maxHp;
      if (Math.abs(ha - hb) > 0.0005) winner = ha > hb ? 0 : 1;
      else if (this.decider) winner = a.stam >= b.stam ? 0 : 1;
    }
    this.roundWinner = winner;
    if (winner >= 0) this.wins[winner]++; else { this.wins[0]++; this.wins[1]++; }
    if (this.wins[0] >= this.winsNeeded && this.wins[1] >= this.winsNeeded) { this.decider = true; this.winsNeeded = Math.max(this.wins[0], this.wins[1]) + 1; }
    this.matchOver = this.wins[0] >= this.winsNeeded || this.wins[1] >= this.winsNeeded;
    if (this.matchOver) this.matchWinner = this.wins[0] >= this.winsNeeded ? 0 : 1;
    this.phase = 'roundEnd';
    this.phaseTicks = 0;
    this.locked = true;
    Events.emit('roundEnd', { winner, reason, round: this.round, wins: this.wins.slice(), matchOver: this.matchOver, match: this });
  }
  stepRoundEnd() {
    this.hitStopTick();
    this.readIntents();
    for (let i = 0; i < 2; i++) this.fighters[i].update(this.intents[i], this.fighters[i ^ 1], this);
    this.physics();
    for (const f of this.fighters) f.animate(DT);
    if (this.phaseTicks === 60) this.settlePoses(false);
    if (this.phaseTicks === 90) this.settlePoses(true);
    if (this.slowTicks > 0) this.slowTicks--;
    if (this.phaseTicks >= ROUND_END_TICKS) {
      if (this.matchOver) { this.phase = 'matchEnd'; this.phaseTicks = 0; Events.emit('matchEnd', { match: this }); }
      else { this.phase = 'waiting'; Events.emit('nextRound', { match: this }); }
    }
  }
  /* Winner / loser poses for standing fighters; late (true) also catches a thrown fighter that has landed. */
  settlePoses(late) {
    this.fighters.forEach((f, i) => {
      if (!f.alive || TERMINAL_STATES.includes(f.state) || f.airborne || (f.state === S.THROWN && !late)) return;
      f.setState(this.roundWinner === i ? S.VICTORY : S.DEFEAT);
    });
  }
  /* A button press fast-forwards the round-end sequence once it has played for a moment. */
  skipRoundEnd() {
    if (this.phase !== 'roundEnd' || this.phaseTicks < SKIP_ARM_TICKS) return false;
    this.slowTicks = 0;
    this.settlePoses(true);
    this.phaseTicks = Math.max(this.phaseTicks, ROUND_END_TICKS - 1);
    return true;
  }
  hitStopTick() { if (this.hitStop > 0) this.hitStop = 0; }
  stepIdle() {
    for (const f of this.fighters) { f.update(clearIntent(makeIntent()), this.fighters[f.index ^ 1], this); f.animate(DT); }
    this.physics();
  }

  results() {
    const [a, b] = this.fighters;
    return {
      winner: this.matchWinner, wins: this.wins.slice(), rounds: this.round, seconds: Math.round(this.matchTicks / 60),
      stats: this.stats, playerHp: a.hp / a.maxHp, opponentHp: b.hp / b.maxHp, player: a.name, opponent: b.name,
    };
  }
}

/* ---------- showcase scene used behind menus ---------- */
const PREVIEW_FIGHTER_SPAN = 2.7;     // metres of fighter (plus margin) the creator preview keeps in view
const PREVIEW_CENTER_Y = 0.95;
const Showcase = {
  arenaId: null, fighters: [], t: 0, solo: false, orbit: 0,
  creator: false, previewFighter: null, previewPose: 'guard', poseClock: 0, userYaw: 0.5, spinHoldUntil: 0,
  previewFocus: [-0.4, 0], previewFreeHeight: 1,     // screen spot (NDC) and free height fraction left by the creator panel
  set(arenaId, leftId, rightId, solo) {
    if (this.arenaId !== arenaId || !Arena.def || Arena.def.id !== arenaId) { Arena.build(ARENAS[arenaId]); this.arenaId = arenaId; }
    this.solo = !!solo;
    this.creator = false;
    const mk = (id, idx, x, yaw) => {
      const profile = ROSTER_BY_ID[id] || ROSTER_BY_ID.kai;
      let f = this.fighters[idx];
      if (!f || f.profile !== profile) f = this.fighters[idx] = new Fighter(profile, idx);
      f.reset(x, 0, yaw);
      f.stance = idx; f.pose.set(f.motion.guard[f.stance]);
      return f;
    };
    mk(leftId, 0, solo ? 0 : -1.5, solo ? 0 : Math.PI / 2);
    if (rightId && !solo) mk(rightId, 1, 1.5, -Math.PI / 2);
  },
  /* Character creator: one live fighter, updated in place on every edit (cosmetic only, never simulated). */
  showPreview(profile) {
    if (!this.previewFighter) this.previewFighter = new Fighter(profile, 0);
    const f = this.previewFighter;
    f.profile = profile; f.id = profile.id; f.name = profile.name;
    f.applyLook(profile.look);
    f.motion = makeMotion(profile, f.scale, f.build);   // movement style, attributes and body can all change in the creator
    if (!this.creator) { f.reset(0, 0, 0); f.stance = 0; f.pose.set(f.motion.guard[0]); this.userYaw = 0.5; this.poseClock = 0; this.previewPose = 'guard'; }
    this.creator = true;
    this.solo = true;
    this.fighters[0] = f;
  },
  endPreview() {
    if (this.fighters[0] === this.previewFighter) this.fighters[0] = null;
    this.creator = false;
  },
  setPreviewPose(pose) { this.previewPose = pose; this.poseClock = 0; },
  turnPreview(angle) { this.userYaw = wrapAngle(this.userYaw + angle); this.spinHoldUntil = this.t + 4; },
  /* Loops the chosen pose by writing state fields directly; the preview fighter is never simulated. */
  drivePreview(f, dt) {
    if (!Settings.v.reducedMotion && this.t > this.spinHoldUntil) this.userYaw = wrapAngle(this.userYaw + dt * 0.45);
    f.yaw = this.userYaw;
    f.vx = f.vz = 0;
    this.poseClock += dt;
    const pose = this.previewPose;
    if (pose === 'guard' || pose === 'victory') { f.state = pose === 'guard' ? S.IDLE : S.VICTORY; f.move = null; return; }
    const mv = pose === 'punch' ? ATTACKS.cross : ATTACKS.roundhouse;
    const length = mv.startup + mv.active + mv.recovery;
    const tick = Math.floor(this.poseClock * 60) % (length + 40);         // 40 ticks of guard between repeats
    if (tick >= length) { f.state = S.IDLE; f.move = null; return; }
    f.state = S.ATTACK; f.move = mv; f.moveTick = tick; f.whiffExtra = 0;
    f.mStartup = mv.startup; f.mActive = mv.active; f.mRecovery = mv.recovery;
  },
  /* Frame the preview fighter inside the screen area the creator panel leaves free. */
  previewCamera(dt) {
    const az = 0.35, tanHalf = Math.tan(Camera.baseFov / 2), aspect = R.cssW / Math.max(1, R.cssH);
    const dist = clamp(PREVIEW_FIGHTER_SPAN / (2 * tanHalf * this.previewFreeHeight), 4.4, 9);
    const halfH = dist * tanHalf, halfW = halfH * aspect;
    const shiftX = -this.previewFocus[0] * halfW, shiftY = -this.previewFocus[1] * halfH;
    Camera.showcase(dt, Math.cos(az) * shiftX, PREVIEW_CENTER_Y + shiftY, -Math.sin(az) * shiftX, dist, az, 0.16);
  },
  update(dt) {
    this.t += dt;
    Arena.update(dt);
    const n = this.solo ? 1 : 2;
    for (let i = 0; i < n; i++) {
      const f = this.fighters[i];
      if (!f) continue;
      if (this.creator) this.drivePreview(f, dt);
      else if (this.solo && !Settings.v.reducedMotion) f.yaw = this.t * 0.7;
      f.prevYaw = f.yaw;
      f.animate(dt);
    }
    if (this.creator) this.previewCamera(dt);
    else if (this.solo) Camera.showcase(dt, 0, 1.0, 0, 4.2, 0.35, 0.18);
    else Camera.showcase(dt, -1.9, 1.0, 0, 7.0, 0.2 + Math.sin(this.t * 0.25) * 0.3, 0.3);
  },
  draw() {
    const n = this.solo ? 1 : 2;
    for (let i = 0; i < n; i++) if (this.fighters[i]) this.fighters[i].draw(1);
  },
};

/* ---------- game state manager ---------- */
const GS = { LOADING: 'LOADING', MENU: 'MENU', CHARSEL: 'CHARSEL', ARENASEL: 'ARENASEL', COUNTDOWN: 'COUNTDOWN', FIGHT: 'FIGHT', PAUSED: 'PAUSED', ROUND_END: 'ROUND_END', VICTORY: 'VICTORY', DEFEAT: 'DEFEAT', RESULTS: 'RESULTS', ERROR: 'ERROR' };
const GS_TRANSITIONS = {
  LOADING: ['MENU', 'ERROR'],
  MENU: ['CHARSEL', 'ERROR'],
  CHARSEL: ['MENU', 'ARENASEL', 'COUNTDOWN', 'ERROR'],
  ARENASEL: ['CHARSEL', 'MENU', 'COUNTDOWN', 'ERROR'],
  COUNTDOWN: ['FIGHT', 'PAUSED', 'MENU', 'ERROR'],
  FIGHT: ['PAUSED', 'ROUND_END', 'MENU', 'ERROR'],
  PAUSED: ['COUNTDOWN', 'FIGHT', 'MENU', 'ERROR'],
  ROUND_END: ['COUNTDOWN', 'VICTORY', 'DEFEAT', 'MENU', 'ERROR'],
  VICTORY: ['RESULTS', 'MENU', 'ERROR'],
  DEFEAT: ['RESULTS', 'MENU', 'ERROR'],
  RESULTS: ['MENU', 'COUNTDOWN', 'CHARSEL', 'ARENASEL', 'ERROR'],
  ERROR: ['MENU'],
};
const SIM_STATES = [GS.COUNTDOWN, GS.FIGHT, GS.ROUND_END, GS.VICTORY, GS.DEFEAT, GS.RESULTS];
const RESULTS_DELAY = 2.6;            // seconds of victory / defeat pose before the results screen
const SKIP_ARM_SECONDS = 0.5;         // presses this soon after a victory / defeat are ignored
const SKIP_ACTIONS = ['lp', 'rp', 'lk', 'rk', 'grapple', 'jump'];
const ARCADE_DIFFS = ['easy', 'normal', 'hard', 'hard', 'expert'];
const ARCADE_ARENAS = ['warehouse', 'dojo', 'pit', 'warehouse', 'pit'];
const ARCADE_STAGES = 5;
const ARCADE_LEVELS = ['easy', 'normal', 'hard'];
const ARCADE_LEVEL_SHIFT = { easy: -1, normal: 0, hard: 1 };   // the Arcade difficulty option moves every stage one step
const SURVIVAL_TIMER = 50, SURVIVAL_TIMER_MIN = 30;
const SURVIVAL_HEAL = 0.25, SURVIVAL_HEAL_MIN = 0.1;          // share of max health regained after each win
const SURVIVAL_PEAK = 7;              // wins until the CPU reaches Expert; after that heal and timer keep shrinking
function arcadeDifficulty(stage, level) {
  const i = DIFFICULTY_ORDER.indexOf(ARCADE_DIFFS[stage]) + (ARCADE_LEVEL_SHIFT[level] || 0);
  return DIFFICULTY_ORDER[clamp(i, 0, DIFFICULTY_ORDER.length - 1)];
}
/* Fisher-Yates with the given generator; returns a new array. */
function shuffled(list, rng) {
  const out = list.slice();
  for (let i = out.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = out[i]; out[i] = out[j]; out[j] = t; }
  return out;
}

const Game = {
  state: GS.LOADING,
  pausedFrom: null,
  acc: 0,
  last: 0,
  alpha: 0,
  match: null,
  run: null,
  selection: { mode: 'arcade', player: 'kai', opponent: 'mara', arena: 'warehouse', difficulty: 'normal', rounds: 2, timer: 60, arcadeLevel: 'normal' },
  endTimer: 0,
  frameAvg: 16,
  rafId: 0,
  errorCount: 0,
  resultsData: null,

  go(next) {
    const allowed = GS_TRANSITIONS[this.state] || [];
    if (!allowed.includes(next)) { Diag.log('warn', 'Rejected game-state transition ' + this.state + ' -> ' + next); return false; }
    const prev = this.state;
    this.state = next;
    Events.emit('gamestate', { from: prev, to: next });
    return true;
  },

  /* ----- menu flow ----- */
  chooseMode(mode) { this.selection.mode = mode; this.ensureSelection(); this.go(GS.CHARSEL); },
  /* A deleted custom fighter may still be selected: fall back to built-ins. */
  ensureSelection() {
    const sel = this.selection;
    if (!ROSTER_BY_ID[sel.player]) sel.player = 'kai';
    if (!ROSTER_BY_ID[sel.opponent]) sel.opponent = sel.player === 'mara' ? 'kai' : 'mara';
  },
  choosePlayer(id) { this.selection.player = id; },
  chooseArena(id) { this.selection.arena = id; },

  startFromSelection() {
    const sel = this.selection;
    this.endMatch();
    if (sel.mode === 'arcade') this.startArcade(0);
    else if (sel.mode === 'survival') this.startSurvival();
    else if (sel.mode === 'training') this.startTraining();
    else this.startFree();
  },
  opponentsFor(playerId) { return ROSTER.filter((r) => r.id !== playerId).sort((x, y) => x.rank - y.rank); },
  /* Free Fight / Training opponents: the roster plus saved custom fighters. */
  opponentChoices(playerId) { return ROSTER.concat(CustomRoster.profiles()).filter((r) => r.id !== playerId); },
  /* keepRun: next stage or a retry of the same run (continues are counted); otherwise a new run starts. */
  startArcade(stage, keepRun) {
    const sel = this.selection;
    const opponents = this.opponentsFor(sel.player);
    const ladder = opponents.slice(Math.max(0, opponents.length - ARCADE_STAGES)); // custom players still end on ZERO
    const same = keepRun && this.run && this.run.mode === 'arcade' && this.run.player === sel.player;
    if (!same) this.run = { mode: 'arcade', player: sel.player, level: sel.arcadeLevel, continues: 0 };
    Object.assign(this.run, { ladder, stage });
    const opp = ladder[stage];
    this.beginMatch({ mode: 'arcade', playerId: sel.player, opponentId: opp.id, arenaId: ARCADE_ARENAS[stage], difficulty: arcadeDifficulty(stage, this.run.level), winsNeeded: 2, timer: 60 });
  },
  startSurvival() {
    const sel = this.selection;
    this.run = { mode: 'survival', player: sel.player, kills: 0, seconds: 0, carryHp: 1, pool: this.opponentChoices(sel.player), order: [], rng: makeRng(Date.now() >>> 0), arenaStart: ARENA_ORDER.indexOf(sel.arena), bestBefore: Progress.d.survivalKills };
    this.nextSurvivalMatch();
  },
  /* Wins past the point where the CPU tops out at Expert. */
  survivalExtra(kills) { return Math.max(0, kills - SURVIVAL_PEAK); },
  nextSurvivalMatch() {
    const r = this.run;
    if (!r.order.length) r.order = shuffled(r.pool, r.rng);   // every lap meets the whole roster (customs too) in a new order
    const opp = r.order.shift();
    const diff = r.kills < 2 ? 'easy' : r.kills < 4 ? 'normal' : r.kills < SURVIVAL_PEAK ? 'hard' : 'expert';
    const arena = ARENA_ORDER[(r.arenaStart + r.kills) % ARENA_ORDER.length];
    const timer = Math.max(SURVIVAL_TIMER_MIN, SURVIVAL_TIMER - 2 * this.survivalExtra(r.kills));
    this.beginMatch({ mode: 'survival', playerId: r.player, opponentId: opp.id, arenaId: arena, difficulty: diff, winsNeeded: 1, timer, playerHp: r.carryHp });
  },
  startTraining() {
    const sel = this.selection;
    const opp = this.opponentsFor(sel.player)[0];
    this.run = { mode: 'training', player: sel.player };
    this.beginMatch({ mode: 'training', playerId: sel.player, opponentId: this.selection.opponent && this.selection.opponent !== sel.player ? this.selection.opponent : opp.id, arenaId: sel.arena, difficulty: 'normal', winsNeeded: 99, timer: 0, countdown: false, dummy: 'stand' });
  },
  startFree() {
    const sel = this.selection;
    let opp = sel.opponent === sel.player ? this.opponentsFor(sel.player)[0].id : sel.opponent;
    this.run = { mode: 'free', player: sel.player };
    this.beginMatch({ mode: 'free', playerId: sel.player, opponentId: opp, arenaId: sel.arena, difficulty: sel.difficulty, winsNeeded: sel.rounds, timer: sel.timer });
  },

  beginMatch(cfg) {
    this.endMatch();
    cfg.seed = (Date.now() ^ (this.errorCount * 7919)) >>> 0;
    this.config = cfg;
    this.match = new MatchSim(cfg);
    this.acc = 0;
    this.endTimer = 0;
    this.resultsData = null;
    this.unsubMatch = [
      Events.on('roundEnd', (e) => this.onRoundEnd(e)),
      Events.on('nextRound', () => this.onNextRound()),
      Events.on('matchEnd', () => this.onMatchEnd()),
      Events.on('fightStart', () => { if (this.state === GS.COUNTDOWN) this.go(GS.FIGHT); }),
    ];
    Events.emit('matchCreated', { match: this.match });
    if (this.state === GS.RESULTS || this.state === GS.CHARSEL || this.state === GS.ARENASEL || this.state === GS.PAUSED) this.go(GS.COUNTDOWN);
    else if (this.state !== GS.COUNTDOWN) this.go(GS.COUNTDOWN);
    if (this.match.phase === 'fight' && this.state === GS.COUNTDOWN) this.go(GS.FIGHT);
  },
  endMatch() {
    if (this.unsubMatch) { this.unsubMatch.forEach((off) => off()); this.unsubMatch = null; }
    if (this.match) { this.match.dispose(); this.match = null; }
    Debris.clear(); FX.clear();
  },
  /* In Survival a restart abandons the run (no free retries): the record is kept and a new run starts. */
  restartMatch() {
    if (!this.config) return;
    if (this.run && this.run.mode === 'survival') { this.saveSurvivalRecord(); this.startSurvival(); return; }
    this.beginMatch(Object.assign({}, this.config));
  },
  /* Best streak and time are saved after every win and whenever a run ends, so quitting never loses them. */
  saveSurvivalRecord() {
    const run = this.run;
    if (!run || run.mode !== 'survival') return;
    const unfinished = this.match && !this.match.matchOver ? Math.round(this.match.matchTicks / 60) : 0;
    Progress.d.survivalKills = Math.max(Progress.d.survivalKills, run.kills);
    Progress.d.survivalSeconds = Math.max(Progress.d.survivalSeconds, run.seconds + unfinished);
    Progress.save();
  },
  quitToMenu() {
    this.saveSurvivalRecord();
    this.endMatch();
    this.run = null;
    this.pausedFrom = null;
    if (this.state !== GS.MENU) {
      if (!this.go(GS.MENU)) { this.state = GS.MENU; Events.emit('gamestate', { from: 'FORCED', to: GS.MENU }); }
    }
  },

  /* ----- match flow events ----- */
  onRoundEnd(e) {
    if (this.state === GS.FIGHT) this.go(GS.ROUND_END);
    else if (this.state === GS.COUNTDOWN) { this.state = GS.ROUND_END; Events.emit('gamestate', { from: 'COUNTDOWN', to: GS.ROUND_END }); }
  },
  onNextRound() {
    if (!this.match) return;
    this.match.startRound();
    this.go(GS.COUNTDOWN);
  },
  onMatchEnd() {
    const m = this.match;
    if (!m) return;
    const playerWon = m.matchWinner === 0;
    const run = this.run;
    const data = m.results();
    data.mode = run ? run.mode : 'free';
    data.playerWon = playerWon;
    data.buttons = [];
    if (run && run.mode === 'arcade') {
      data.stage = run.stage + 1; data.stages = run.ladder.length; data.continues = run.continues;
      if (playerWon) {
        Progress.d.wins++;
        const defeated = run.ladder[run.stage];
        if (defeated.id === 'dmitri' || run.stage >= 2) if (Progress.unlock('dmitri')) data.unlocked = 'DMITRI';
        data.newBest = run.stage + 1 > Progress.d.arcadeBest;
        Progress.d.arcadeBest = Math.max(Progress.d.arcadeBest, run.stage + 1);
        if (run.stage + 1 >= run.ladder.length) {
          data.cleared = true; Progress.d.arcadeClears++;
          if (Progress.unlock('zero')) data.unlocked = (data.unlocked ? data.unlocked + ' and ' : '') + 'ZERO';
          const fewest = Progress.d.arcadeFewestContinues;
          if (fewest < 0 || run.continues < fewest) { data.newBest = fewest >= 0 || data.newBest; Progress.d.arcadeFewestContinues = run.continues; }
        }
        Progress.save();
        data.buttons = data.cleared ? ['again', 'menu'] : ['next', 'menu'];
      } else { Progress.d.losses++; Progress.save(); data.buttons = ['retry', 'menu']; }
    } else if (run && run.mode === 'survival') {
      run.seconds += data.seconds;
      if (playerWon) {
        run.kills++;
        const heal = Math.max(SURVIVAL_HEAL_MIN, SURVIVAL_HEAL - 0.02 * this.survivalExtra(run.kills));
        run.carryHp = clamp(m.fighters[0].hp / m.fighters[0].maxHp + heal, 0.3, 1);
        data.newBest = run.kills > run.bestBefore;
        data.buttons = ['next', 'menu'];
      } else {
        data.ended = true;
        data.buttons = ['again', 'menu'];
      }
      data.kills = run.kills; data.survivalSeconds = run.seconds;
      this.saveSurvivalRecord();
    } else data.buttons = ['again', 'setup', 'menu'];
    this.resultsData = data;
    this.endTimer = 0;
    this.go(playerWon ? GS.VICTORY : GS.DEFEAT);
  },
  resultsAction(kind) {
    const run = this.run;
    if (kind === 'menu') { this.quitToMenu(); return; }
    if (kind === 'setup') { this.endMatch(); this.go(GS.CHARSEL); return; }
    if (kind === 'next') {
      if (run.mode === 'arcade') this.startArcade(run.stage + 1, true);
      else if (run.mode === 'survival') this.nextSurvivalMatch();
      return;
    }
    if (kind === 'retry') { run.continues++; this.startArcade(run.stage, true); return; }
    if (kind === 'again') {
      if (run && run.mode === 'survival') { this.selection.mode = 'survival'; this.startSurvival(); }
      else if (run && run.mode === 'arcade') this.startArcade(0);   // "Play again" after clearing the ladder
      else this.restartMatch();
    }
  },

  /* ----- pause ----- */
  pause() {
    if (this.state !== GS.FIGHT && this.state !== GS.COUNTDOWN) return false;
    this.pausedFrom = this.state;
    return this.go(GS.PAUSED);
  },
  resume() {
    if (this.state !== GS.PAUSED) return false;
    const to = this.pausedFrom || GS.FIGHT;
    Input.reset();
    this.pausedFrom = null;
    return this.go(to);
  },

  /* ----- loop ----- */
  start() {
    this.last = performance.now();
    const loop = (now) => {
      this.rafId = requestAnimationFrame(loop);
      try { this.frame(now); } catch (e) { this.fail(e); }
    };
    this.rafId = requestAnimationFrame(loop);
  },
  fail(e) {
    this.errorCount++;
    Diag.log('error', 'Runtime error: ' + (e && e.stack ? e.stack.split('\n').slice(0, 3).join(' | ') : e));
    if (this.errorCount > 8) { cancelAnimationFrame(this.rafId); }
    if (this.state !== GS.ERROR) {
      this.endMatch();
      this.state = GS.ERROR;
      Events.emit('gamestate', { from: 'ANY', to: GS.ERROR, error: String(e && e.message ? e.message : e) });
    }
  },
  frame(now) {
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (!(dt >= 0)) dt = 0;
    dt = Math.min(dt, MAX_FRAME_DELTA);
    if (dt < 0.1) this.frameAvg += (dt * 1000 - this.frameAvg) * 0.05; // ignore stalls (hidden tab, breakpoints)
    Diag.frameMs = this.frameAvg; Diag.fps = dt > 0 ? 1 / dt : Diag.fps;
    if (Math.abs((window.devicePixelRatio || 1) - R.lastDpr) > 0.01) Quality.apply();
    Input.update();
    this.pollMatchInput();
    Quality.adapt(this.frameAvg, dt);
    Events.emit('frame', { dt });
    const t0 = performance.now();
    const st = this.state;
    if (this.match && SIM_STATES.includes(st)) {
      const m = this.match;
      let scale = m.slowTicks > 0 ? 0.35 : 1;
      this.acc += dt * scale;
      let steps = 0;
      while (this.acc >= DT && steps < MAX_STEPS_PER_FRAME && this.match === m) {
        m.step();
        this.acc -= DT;
        steps++;
        if (this.state === GS.PAUSED) break;
      }
      if (steps >= MAX_STEPS_PER_FRAME && this.acc >= DT) { this.acc = 0; Diag.cappedSteps++; }
      this.alpha = clamp(this.acc / DT, 0, 1);
      if ((st === GS.VICTORY || st === GS.DEFEAT) && this.match) {
        this.endTimer += dt;
        if (this.endTimer > RESULTS_DELAY && this.state === st) { this.go(GS.RESULTS); }
      }
    } else if (st === GS.PAUSED && this.match) {
      this.alpha = clamp(this.acc / DT, 0, 1);
    } else if (!this.match) {
      Showcase.update(dt);
    }
    Diag.simMs += (performance.now() - t0 - Diag.simMs) * 0.1;
    this.render(dt);
  },
  /* Pause works in every live phase (countdown and the knock-out lock too); an attack or jump press skips the
     round-end and victory sequences. Presses that arrive too early are dropped so a mashed button cannot skip. */
  pollMatchInput() {
    const st = this.state;
    const reset = Input.take('reset');   // gamepad: hold Select
    if (!this.match) return;
    if (reset && st === GS.FIGHT && this.match.training) this.match.resetFighters();
    if ((st === GS.FIGHT || st === GS.COUNTDOWN) && Input.take('pause')) { this.pause(); return; }
    if (st !== GS.ROUND_END && st !== GS.VICTORY && st !== GS.DEFEAT) return;
    if (!Input.takeAny(SKIP_ACTIONS)) return;
    if (st === GS.ROUND_END) this.match.skipRoundEnd();
    else if (this.endTimer >= SKIP_ARM_SECONDS) this.endTimer = RESULTS_DELAY;
  },
  render(dt) {
    const m = this.match;
    let env;
    if (m && this.state !== GS.LOADING) {
      env = m.def.env;
      Camera.follow(dt, m.fighters[0], m.fighters[1], m.def);
    } else env = Arena.def ? Arena.def.env : DEFAULT_ENV;
    R.begin(env);
    if (m || Arena.def) { Camera.apply(); }
    if (Arena.def) Arena.draw();
    Debris.draw();
    if (m) { for (const f of m.fighters) f.draw(this.alpha); } else Showcase.draw();
    FX.draw();
    R.render();
    Events.emit('rendered', { match: m });
  },
};

/* =====================================================================
   07b EFFECTS - maps combat / environment events to particles and restrained camera impact.
   Intensity is bounded so attacks stay readable; reduced motion lowers it further.
   ===================================================================== */
const Effects = {
  wired: false,
  init() {
    if (this.wired) return;
    this.wired = true;
    const on = (n, fn) => Events.on(n, fn);
    on('hit', (e) => {
      const tier = e.mv.tier || 1;
      const col = e.counter ? '#ffd24a' : e.kind === 'ground' ? '#cfcfcf' : '#ffffff';
      FX.sparks(e.x, e.y, e.z, 5 + tier * 3 + (e.counter ? 4 : 0), 2.2 + tier, col, e.dirx, e.dirz);
      FX.flash(e.x, e.y, e.z, 0.2 + tier * 0.1, '#ffeab5');
      if (tier >= 3 || e.kind === 'knockdown' || e.kind === 'launch') FX.dust(e.def.x, 0.1, e.def.z, 4, 0.4, '#b5ada0');
      Camera.impact(tier >= 3 ? 0.6 : 0.18, tier >= 3 ? 0.5 : 0.15);
      if (e.ko) Camera.impact(1.0, 1.0);
    });
    on('block', (e) => {
      FX.sparks(e.x, e.y, e.z, e.broke ? 14 : 6, e.broke ? 5 : 3, e.broke ? '#ffb347' : '#9ee7ff', e.dirx, e.dirz);
      FX.ring(e.x, e.y, e.z, e.perfect ? '#ffe066' : '#9ee7ff');
      if (e.perfect) FX.flash(e.x, e.y, e.z, 0.35, '#fff4b0');
      if (e.broke) Camera.impact(0.7, 0.6);
    });
    on('land', (e) => { FX.dust(e.f.x, 0.05, e.f.z, Math.min(10, 3 + Math.floor(e.impact)), 0.5, '#b5ada0'); if (e.impact > 4) Camera.impact(0.3, 0.2); });
    on('knockdown', (e) => FX.dust(e.f.x, 0.05, e.f.z, 6, 0.7, '#b5ada0'));
    on('step', (e) => { if (e.run) FX.dust(e.f.x, 0.05, e.f.z, 1, 0.2, '#b5ada0'); });
    on('dash', (e) => FX.dust(e.f.x, 0.05, e.f.z, 3, 0.3, '#b5ada0'));
    on('clinch', (e) => FX.ring(e.x, 0.9, e.z, '#ffffff'));
    on('throw', (e) => { FX.dust(e.x, 0.1, e.z, 8, 0.6, '#b5ada0'); FX.sparks(e.x, 1.0, e.z, 8, 3.5, '#ffffff'); Camera.impact(0.6, 0.5); });
    on('escape', (e) => { FX.ring(e.x, 1.0, e.z, '#9cf4ff'); });
    on('ko', (e) => { FX.flash(e.x, e.y, e.z, 0.7, '#ffffff'); FX.sparks(e.x, e.y, e.z, 20, 5, '#ffd27a'); });
    on('wallSlam', (e) => { FX.dust(e.x, 0.6, e.z, 8, 0.5, '#b5ada0'); FX.sparks(e.x, 1.0, e.z, 8, 3, '#ffffff'); Camera.impact(0.7, 0.5); });
    on('envImpact', (e) => { FX.dust(e.x, 0.6, e.z, 8, 0.5, '#b5ada0'); Camera.impact(0.6, 0.4); });
    on('objHit', (e) => { const m = MATERIALS[e.obj.mat]; FX.sparks(e.x, e.y, e.z, e.dmg > 0 ? 6 : 2, 2.5, m ? m.color : '#ffffff'); if (e.dmg > 0 && e.obj.mat === 'concrete') FX.dust(e.x, e.y, e.z, 2, 0.3, '#a8a49b'); });
    on('objStage', (e) => FX.dust(e.x, e.y, e.z, 4, 0.5, '#a89a86'));
  },
};

/* =====================================================================
   08 AUDIO - everything is synthesised with Web Audio (no embedded files).
   The context is created on the first user gesture; voices are capped and throttled.
   ===================================================================== */
const MAX_VOICES = 30;
const MIN_GAP = { punch: 0.035, kick: 0.035, block: 0.04, whoosh: 0.05, step: 0.09, debris: 0.045, grunt: 0.2, objHit: 0.05, menu: 0.03, land: 0.08 };
const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], pentatonic: [0, 2, 4, 7, 9], phrygian: [0, 1, 3, 5, 7, 8, 10] };

const Sound = {
  ctx: null, master: null, musicBus: null, sfxBus: null, comp: null, reverb: null, wet: null, dry: null, noiseBuf: null,
  voices: 0, last: {}, unsupported: false, wired: false, humNode: null, lowpass: null,

  /* Called on any user gesture; safe to call repeatedly. */
  unlock() {
    if (this.unsupported) return;
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) { this.unsupported = true; Events.emit('toast', { msg: 'Audio is not supported in this browser', kind: 'warn' }); return; }
        this.ctx = new AC({ latencyHint: 'interactive' });
        this.build();
        this.ctx.onstatechange = () => { if (this.ctx.state === 'suspended' || this.ctx.state === 'interrupted') Diag.log('info', 'Audio context ' + this.ctx.state); };
      } catch (e) { this.unsupported = true; Diag.log('warn', 'Audio init failed: ' + e.message); return; }
    }
    if (this.ctx.state !== 'running') this.ctx.resume().catch(() => {});
  },
  suspend() { if (this.ctx && this.ctx.state === 'running') this.ctx.suspend().catch(() => {}); },
  resumeIfAllowed() { if (this.ctx && this.ctx.state !== 'running') this.ctx.resume().catch(() => {}); },

  build() {
    const c = this.ctx;
    this.master = c.createGain();
    this.comp = c.createDynamicsCompressor();
    this.comp.threshold.value = -14; this.comp.ratio.value = 5; this.comp.attack.value = 0.004; this.comp.release.value = 0.18;
    this.musicBus = c.createGain();
    this.sfxBus = c.createGain();
    this.lowpass = c.createBiquadFilter(); this.lowpass.type = 'lowpass'; this.lowpass.frequency.value = 20000;
    this.dry = c.createGain();
    this.wet = c.createGain();
    this.reverb = c.createConvolver();
    this.sfxBus.connect(this.dry); this.sfxBus.connect(this.reverb);
