    this.reverb.connect(this.wet);
    this.dry.connect(this.master); this.wet.connect(this.master);
    this.musicBus.connect(this.lowpass); this.lowpass.connect(this.master);
    this.master.connect(this.comp); this.comp.connect(c.destination);
    const len = c.sampleRate * 2;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.setReverb(0.8, 0.2);
    this.applyVolumes();
  },
  setReverb(seconds, wetAmount) {
    if (!this.ctx) return;
    const c = this.ctx, len = Math.floor(c.sampleRate * Math.max(0.2, seconds));
    const buf = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const data = buf.getChannelData(ch);
      for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6);
    }
    this.reverb.buffer = buf;
    this.wet.gain.value = wetAmount;
  },
  applyVolumes() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.master.gain.setTargetAtTime(Settings.v.master, t, 0.03);
    this.sfxBus.gain.setTargetAtTime(Settings.v.sfx, t, 0.03);
    this.musicBus.gain.setTargetAtTime(Settings.v.music * 0.55, t, 0.05);
  },
  setArena(def) {
    if (!this.ctx) return;
    this.setReverb(def.audio.reverb, def.audio.wet);
  },
  duck(on) {
    if (!this.ctx) return;
    this.lowpass.frequency.setTargetAtTime(on ? 700 : 20000, this.ctx.currentTime, 0.08);
  },

  /* ----- voice helpers ----- */
  ready() { return this.ctx && this.ctx.state === 'running'; },
  allow(name, gap) {
    if (!this.ready() || this.voices >= MAX_VOICES) return false;
    const now = this.ctx.currentTime, g = gap !== undefined ? gap : (MIN_GAP[name] || 0.02);
    if (this.last[name] && now - this.last[name] < g) return false;
    this.last[name] = now;
    return true;
  },
  out(pan) {
    if (!pan || typeof this.ctx.createStereoPanner !== 'function') return this.sfxBus;
    const p = this.ctx.createStereoPanner();
    p.pan.value = clamp(pan, -1, 1);
    p.connect(this.sfxBus);
    return p;
  },
  tone(type, f0, f1, dur, gain, delay, pan, dest) {
    if (this.voices >= MAX_VOICES + 12) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(20, f0), t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + Math.min(0.008, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(dest || this.out(pan));
    this.voices++;
    o.onended = () => { this.voices--; g.disconnect(); };
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(filter, f0, f1, q, dur, gain, delay, pan, dest) {
    if (this.voices >= MAX_VOICES + 12) return;
    const c = this.ctx, t = c.currentTime + (delay || 0);
    const s = c.createBufferSource(), flt = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf;
    flt.type = filter; flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) flt.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + Math.min(0.01, dur * 0.2));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(flt); flt.connect(g); g.connect(dest || this.out(pan));
    this.voices++;
    s.onended = () => { this.voices--; g.disconnect(); };
    s.start(t, Math.random()); s.stop(t + dur + 0.02);
  },
  panFor(x) { return Arena.def ? clamp(x / Arena.def.bounds.x, -1, 1) * 0.6 : 0; },

  /* ----- sound library ----- */
  hit(power, kick, x) {
    if (!this.allow(kick ? 'kick' : 'punch')) return;
    const p = this.panFor(x), g = 0.35 + power * 0.5;
    this.tone('sine', kick ? 120 : 160, kick ? 42 : 55, 0.12 + power * 0.14, g, 0, p);
    this.noise('bandpass', kick ? 1100 : 1700, 500, 0.9, 0.07 + power * 0.1, g * 0.8, 0, p);
    if (power > 0.6) { this.noise('lowpass', 700, 200, 0.7, 0.28, g * 0.7, 0, p); this.tone('sine', 70, 28, 0.32, g * 0.8, 0, p); }
  },
  block(perfect, broke, x) {
    if (!this.allow('block')) return;
    const p = this.panFor(x);
    if (broke) { this.noise('bandpass', 1400, 400, 1.1, 0.45, 0.6, 0, p); this.tone('sawtooth', 260, 70, 0.45, 0.28, 0, p); this.tone('sine', 1800, 900, 0.3, 0.2, 0, p); return; }
    this.tone('triangle', 520, 360, 0.09, 0.35, 0, p);
    this.noise('highpass', 3200, 3200, 0.8, 0.06, 0.3, 0, p);
    if (perfect) { this.tone('sine', 1320, 1320, 0.45, 0.22, 0, p); this.tone('sine', 1980, 1980, 0.4, 0.15, 0.02, p); }
  },
  whoosh(power, x) {
    if (!this.allow('whoosh')) return;
    this.noise('bandpass', 400, 1800 + power * 800, 0.7, 0.12 + power * 0.08, 0.1 + power * 0.1, 0, this.panFor(x));
  },
  step(run, x) { if (!this.allow('step')) return; this.noise('lowpass', 420, 200, 0.6, 0.05, run ? 0.16 : 0.1, 0, this.panFor(x)); },
  land(power, x) { if (!this.allow('land')) return; const p = this.panFor(x); this.tone('sine', 95, 40, 0.14, 0.3 * Math.min(1, power), 0, p); this.noise('lowpass', 500, 200, 0.6, 0.12, 0.2 * Math.min(1, power), 0, p); },
  grunt(index, big) {
    if (!this.allow('grunt' + index, 0.25)) return;
    const base = (index === 0 ? 135 : 105) * (big ? 0.85 : 1), dur = big ? 0.42 : 0.2;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), f = c.createBiquadFilter(), g = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(base * 1.25, t); o.frequency.exponentialRampToValueAtTime(base * 0.7, t + dur);
    f.type = 'bandpass'; f.frequency.value = 750; f.Q.value = 3.5;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.28, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(this.sfxBus);
    this.voices++; o.onended = () => { this.voices--; };
    o.start(t); o.stop(t + dur + 0.02);
  },
  slam(x) { const p = this.panFor(x); this.tone('sine', 85, 28, 0.4, 0.7, 0, p); this.noise('lowpass', 800, 150, 0.7, 0.3, 0.6, 0, p); },
  material(kind, big, x) {
    if (!this.allow('objHit' + (big ? 'B' : ''), big ? 0.12 : 0.05)) return;
    const p = this.panFor(x), n = big ? 3 : 1, g = big ? 0.7 : 0.4;
    for (let i = 0; i < n; i++) {
      const d = i * 0.045;
      if (kind === 'wood') { this.noise('bandpass', 700 + Math.random() * 400, 300, 1.2, 0.12, g, d, p); this.tone('triangle', 230, 130, 0.12, g * 0.7, d, p); }
      else if (kind === 'concrete') { this.noise('lowpass', 900, 200, 0.8, 0.22, g, d, p); this.tone('sine', 110, 45, 0.25, g, d, p); }
      else if (kind === 'metal') { for (const f of [410, 655, 1120]) this.tone('square', f * (0.95 + Math.random() * 0.1), f * 0.97, big ? 0.5 : 0.25, g * 0.18, d, p); this.noise('highpass', 2500, 2500, 0.8, 0.05, g * 0.3, d, p); }
      else if (kind === 'glass') { this.noise('highpass', 4200, 3000, 0.8, big ? 0.5 : 0.12, g, d, p); for (let k = 0; k < (big ? 6 : 1); k++) this.tone('sine', 2400 + Math.random() * 2600, 2000, 0.12, g * 0.2, d + k * 0.035, p); }
      else { this.noise('highpass', 2000, 1500, 0.6, 0.2, g * 0.6, d, p); }
    }
  },
  debris(kind, power, x) {
    if (!this.allow('debris')) return;
    const p = this.panFor(x), g = 0.1 + power * 0.18;
    if (kind === 'glass') this.tone('sine', 3000 + Math.random() * 2000, 2500, 0.07, g * 0.6, 0, p);
    else if (kind === 'metal') this.tone('square', 600 + Math.random() * 300, 400, 0.15, g * 0.4, 0, p);
    else this.noise('bandpass', kind === 'wood' ? 800 : 400, 300, 1.2, 0.07, g, 0, p);
  },
  ui(kind) {
    if (!this.allow('menu')) return;
    if (kind === 'move') this.tone('square', 660, 700, 0.04, 0.09);
    else if (kind === 'ok') { this.tone('square', 660, 660, 0.07, 0.12); this.tone('square', 990, 990, 0.1, 0.12, 0.07); }
    else if (kind === 'back') { this.tone('square', 520, 380, 0.09, 0.1); }
    else if (kind === 'bad') { this.tone('sawtooth', 160, 120, 0.18, 0.12); }
  },
  beep(n) { if (!this.ready()) return; if (n > 0) this.tone('square', 440, 440, 0.14, 0.18); else { this.tone('square', 880, 880, 0.3, 0.22); this.tone('sine', 1320, 1320, 0.4, 0.14); } },
  bell() { if (!this.ready()) return; this.tone('sine', 880, 880, 1.3, 0.3); this.tone('sine', 1320, 1320, 1.0, 0.18); this.tone('sine', 2200, 2200, 0.7, 0.08); },
  fanfare(win) {
    if (!this.ready()) return;
    const notes = win ? [523, 659, 784, 1047] : [440, 392, 349, 262];
    notes.forEach((f, i) => this.tone(win ? 'triangle' : 'sawtooth', f, f, 0.32, win ? 0.22 : 0.16, i * 0.15));
  },
  lowStamina() { if (!this.allow('low', 0.5)) return; this.tone('sine', 300, 300, 0.1, 0.12); this.tone('sine', 300, 300, 0.1, 0.12, 0.16); },

  /* ----- wire to game events ----- */
  wire() {
    if (this.wired) return;
    this.wired = true;
    const on = (n, fn) => Events.on(n, (e) => { if (this.ready()) fn(e); });
    on('hit', (e) => {
      const power = clamp((e.mv.tier || 1) / 3 + (e.counter ? 0.2 : 0) + (e.ko ? 0.4 : 0), 0.15, 1);
      this.hit(power, e.mv.cat === 'kick' || (e.mv.cat === 'heavy' && /kick|sweep/i.test(e.mv.name)), e.x);
      if (e.mv.tier >= 2 || e.ko) this.grunt(e.def.index, e.ko || e.mv.tier === 3);
    });
    on('block', (e) => this.block(e.perfect, e.broke, e.x));
    on('attackActive', (e) => this.whoosh((e.mv.tier || 1) / 3, e.f.x));
    on('attackStart', (e) => { if (e.mv.tier === 3 && e.f.index === 1) this.grunt(1, false); });
    on('step', (e) => this.step(e.run, e.f.x));
    on('land', (e) => this.land(e.impact / 6, e.f.x));
    on('jump', (e) => this.whoosh(0.2, e.f.x));
    on('dash', (e) => this.whoosh(0.5, e.f.x));
    on('clinch', (e) => { this.tone('sine', 120, 70, 0.12, 0.35); this.noise('bandpass', 900, 500, 0.6, 0.12, 0.25); });
    on('throwStart', (e) => this.whoosh(1, e.f.x));
    on('throw', (e) => { this.slam(e.x); this.grunt(e.def.index, true); });
    on('escape', () => { this.tone('triangle', 600, 900, 0.1, 0.2); });
    on('escapeFail', () => this.ui('bad'));
    on('knockdown', (e) => this.slam(e.f.x));
    on('ko', (e) => { this.slam(e.x); this.bell(); });
    on('wallSlam', (e) => this.slam(e.x));
    on('envImpact', (e) => this.slam(e.x));
    on('objHit', (e) => this.material(MATERIALS[e.obj.mat] ? e.obj.mat : 'wood', false, e.x));
    on('objStage', (e) => this.material(e.obj.mat, false, e.x));
    on('objBreak', (e) => this.material(e.mat, true, e.x));
    on('debrisImpact', (e) => this.debris(e.kind, e.power, e.x));
    on('countdown', (e) => this.beep(e.n));
    on('fightStart', () => this.beep(0));
    on('timeWarn', () => this.tone('sine', 990, 990, 0.09, 0.16));
    on('matchEnd', (e) => this.fanfare(e.match.matchWinner === 0));
    on('lowStamina', (e) => { if (e.f.index === 0) this.lowStamina(); });
    on('uiSound', (e) => this.ui(e.kind));
  },
};

/* ---------- procedural music: bass + drums + arpeggio, tempo and scale come from the arena ---------- */
const MUSIC_FIGHT = 1;            // music intensity tiers: 0 menu, 1 fight, 2 tense fight
const MUSIC_TENSE = 2;
const TENSE_HP_FRACTION = 0.25;   // a fighter below this share of health makes the music tense
const Music = {
  active: false, track: null, nextTime: 0, step: 0, intensity: 0,
  start(track, intensity) {
    this.track = track; this.intensity = intensity; this.active = true; this.step = 0; this.nextTime = 0;
  },
  stop() { this.active = false; },
  setIntensity(v) { this.intensity = v; },
  update() {
    if (!this.active || !Sound.ready()) return;
    const c = Sound.ctx;
    if (this.nextTime < c.currentTime) this.nextTime = c.currentTime + 0.05;
    const tr = this.track, stepDur = 60 / tr.bpm / 4;
    while (this.nextTime < c.currentTime + 0.25) {
      this.schedule(this.nextTime, this.step, stepDur);
      this.nextTime += stepDur;
      this.step++;
    }
  },
  note(root, scale, degree, octave) {
    const len = scale.length;
    const d = ((degree % len) + len) % len;
    const oct = octave + Math.floor(degree / len);
    return root * Math.pow(2, (scale[d] + 12 * oct) / 12);
  },
  schedule(t, step, stepDur) {
    const tr = this.track, c = Sound.ctx;
    const s = step % 16, bar = Math.floor(step / 16) % 4;
    const scale = SCALES[tr.mode] || SCALES.minor;
    const dest = Sound.musicBus;
    const voice = (type, f, dur, gain, filt) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      let node = o;
      if (filt) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = filt; o.connect(fl); node = fl; }
      node.connect(g); g.connect(dest);
      o.onended = () => g.disconnect();
      o.start(t); o.stop(t + dur + 0.03);
    };
    const hit = (kind, gain, dur) => {
      const sBuf = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
      sBuf.buffer = Sound.noiseBuf; fl.type = kind === 'hat' ? 'highpass' : 'bandpass'; fl.frequency.value = kind === 'hat' ? 7000 : 1800; fl.Q.value = 0.8;
      g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      sBuf.connect(fl); fl.connect(g); g.connect(dest); sBuf.onended = () => g.disconnect(); sBuf.start(t, Math.random()); sBuf.stop(t + dur + 0.02);
    };
    const bassDeg = [0, 0, 3, 0, 5, 0, 3, 2];
    if (this.intensity === 0) {
      // calm menu theme: slow pad + sparse arpeggio
      if (s === 0) { voice('sawtooth', this.note(tr.root, scale, bassDeg[bar * 2 % 8], 2), stepDur * 16, 0.07, 500); voice('sawtooth', this.note(tr.root, scale, bassDeg[bar * 2 % 8] + 2, 2) * 1.004, stepDur * 16, 0.05, 600); }
      if (s % 4 === 2) voice('triangle', this.note(tr.root * 4, scale, [0, 2, 4, 3][(s / 4 | 0) % 4] + bar, 1), stepDur * 3, 0.06);
      return;
    }
    // drums
    if (s % 4 === 0 || s === 10) { voice('sine', 120, 0.18, 0.5, 0); const o = c.createOscillator(), g = c.createGain(); o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.14); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16); o.connect(g); g.connect(dest); o.onended = () => g.disconnect(); o.start(t); o.stop(t + 0.2); }
    if (s === 4 || s === 12) hit('snare', 0.25, 0.14);
    if (s % 2 === 0) hit('hat', 0.07, 0.04);
    // bass
    if (s % 2 === 0) { const deg = bassDeg[(s / 2 + bar * 2) % 8]; voice('sawtooth', this.note(tr.root, scale, deg, 0), stepDur * 1.8, 0.2, 380); }
    // arpeggio lead
    if (this.intensity > 0.5 && (s % 4 === 1 || s % 8 === 6)) voice('square', this.note(tr.root * 2, scale, [0, 2, 4, 6, 4, 2][(step >> 1) % 6] + (bar % 2) * 2, 1), stepDur * 1.5, 0.045, 1800);
    // tense layer: off-beat hats and a driving octave bass
    if (this.intensity >= MUSIC_TENSE) {
      if (s % 2 === 1) hit('hat', 0.05, 0.03);
      if (s % 4 === 3) voice('square', this.note(tr.root, scale, bassDeg[((s >> 1) + bar * 2) % 8], 1), stepDur * 0.9, 0.06, 900);
    }
  },
};

/* =====================================================================
   09a UI - menus (keyboard / gamepad / mouse / touch), HUD, popups, touch controls, diagnostics.
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const clockText = (seconds) => String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MODE_INFO = {
  arcade: { label: 'Arcade', desc: 'Fight five opponents of rising difficulty. Beat the ladder to unlock fighters.' },
  survival: { label: 'Survival', desc: 'Endless opponents, limited recovery between fights. How long can you last?' },
  training: { label: 'Training', desc: 'Practice moves, combos, grapples and destruction. Frame data and a configurable dummy.' },
  free: { label: 'Free Fight', desc: 'Pick any opponent, arena, difficulty, round count and timer.' },
};
const GAMEPAD_LABELS = { lp: 'Square', rp: 'Triangle', lk: 'Cross (X)', rk: 'Circle', strong: 'L1', height: 'L2', blockHigh: 'R1', blockLow: 'R2', up: 'Stick up / D-pad up (firm tap = jump)', down: 'Stick down (tap, then hold = crouch)', left: 'Stick left', right: 'Stick right', jump: 'Firm quick tap up', crouch: 'Tap down, then hold down', grapple: 'R3 or right-stick flick', dash: 'L3 (press stick)', stance: 'Select (tap)', pause: 'Start' };
const TOUCH_LABELS = { lp: 'LP', rp: 'RP', lk: 'LK', rk: 'RK', strong: 'STR', height: 'HGT', blockHigh: 'BLK-H', blockLow: 'BLK-L', jump: 'JUMP', crouch: 'DUCK', grapple: 'GRAB', dash: 'DASH', stance: 'STNC', pause: 'II', up: 'Stick up', down: 'Stick down', left: 'Stick left', right: 'Stick right' };
const RESULTS_GUARD_MS = 600;   // presses still mashed from the fight cannot skip the results screen
const ONBOARD_MS = 6000;   // the first-match controls card closes itself after this long
const SCENARIOS = ['1: Neutral distance', '2: Close range', '3: Opponent cornered', '4: Throw into scenery', '5: Opponent low stamina'];
const KIND_NAME = { wood: 'WOOD', concrete: 'CONCRETE', metal: 'METAL', glass: 'GLASS', paper: 'SCREEN' };

const UI = {
  screen_creator() { return CreatorUI.render(); },
  current: null, stack: [], guardUntil: 0, dom: {}, padPrev: { up: false, down: false, left: false, right: false, ok: false, back: false },
  rebinding: null, scenIdx: 0, setupSel: { opp: 'mara' }, pops: [], popIdx: 0, tagEls: [], banners: 0, lastToast: '', ghost: [1, 1], cache: {},
  listeners: [], frameCount: 0, onboardTimer: 0,

  init() {
    for (const id of ['hud', 'screens', 'toast', 'announce', 'diag', 'fatal', 'fade', 'touch', 'hn1', 'hn2', 'hp1', 'hp2', 'hg1', 'hg2', 'ht1', 'ht2', 'st1', 'st2', 'stb1', 'stb2', 'pips1', 'pips2', 'timer', 'roundlbl', 'combo', 'banner', 'warn', 'grappleHint', 'onboard', 'training', 'modeinfo', 'tags', 'pauseBtn']) this.dom[id] = $(id);
    const add = (t, type, fn, o) => { t.addEventListener(type, fn, o); this.listeners.push([t, type, fn, o]); };
    add(window, 'keydown', (e) => this.onKey(e));
    add(this.dom.onboard, 'pointerdown', () => this.hideOnboarding());
    add(this.dom.screens, 'click', (e) => this.onClick(e));
    add(this.dom.pauseBtn, 'click', () => Game.pause());
    add(document, 'contextmenu', (e) => e.preventDefault());
    add(document, 'gesturestart', (e) => e.preventDefault());
    add(document, 'pointerdown', () => Sound.unlock(), { passive: true });
    add(document, 'keydown', () => Sound.unlock(), { passive: true });
    add(document, 'touchstart', () => Sound.unlock(), { passive: true });
    for (let i = 0; i < 2; i++) { const el = document.createElement('div'); el.className = 'tag p' + (i + 1); this.dom.tags.appendChild(el); this.tagEls.push(el); }
    for (let i = 0; i < 16; i++) { const el = document.createElement('div'); el.className = 'pop'; el.style.opacity = '0'; this.dom.tags.appendChild(el); this.pops.push({ el, age: 99, life: 1, x: 0, y: 0, z: 0 }); }
    Events.on('toast', (e) => this.toast(e.msg, e.kind));
    Events.on('frame', () => this.update());
    Events.on('gamestate', (e) => this.onGameState(e));
    Events.on('matchCreated', (e) => this.onMatchCreated(e.match));
    Events.on('rendered', (e) => this.frame(e.match));
    Events.on('settings', () => { this.applyTouchVisibility(); });
    Events.on('hit', (e) => this.onHit(e));
    Events.on('block', (e) => this.onBlock(e));
    Events.on('throw', (e) => this.popAt(e.x, 1.2, e.z, e.name.toUpperCase() + ' ' + Math.round(e.dmg), '#ffd24a'));
    Events.on('escape', (e) => this.popAt(e.x, 1.4, e.z, 'ESCAPE!', '#9cf4ff'));
    Events.on('clinch', (e) => this.popAt(e.x, 1.6, e.z, 'CLINCH', '#ffffff'));
    Events.on('objBreak', (e) => { this.popAt(e.x, 1.3, e.z, (KIND_NAME[e.mat] || 'OBJECT') + ' SMASHED!', '#ffe9a6'); this.say('Object destroyed'); });
    Events.on('objStage', (e) => this.popAt(e.x, e.obj.h + 0.2, e.z, (e.obj.mat === 'metal' ? STAGE_NAMES_METAL : STAGE_NAMES)[e.stage].toUpperCase(), '#d0d8e8'));
    Events.on('wallSlam', (e) => this.popAt(e.x, 1.5, e.z, 'WALL SLAM', '#ffb27a'));
    Events.on('envImpact', (e) => this.popAt(e.x, 1.5, e.z, 'CRASH', '#ffb27a'));
    Events.on('countdown', (e) => this.banner(String(e.n), '', 700));
    Events.on('fightStart', () => this.banner('FIGHT!', '', 900));
    Events.on('roundStart', (e) => { if (e.match.cfg.countdown) this.banner(e.match.decider ? 'FINAL ROUND' : 'ROUND ' + e.round, this.roundSub(e.match), ROUND_BANNER_TICKS * 1000 / 60); else this.say('Round ' + e.round); });
    Events.on('ko', () => this.banner('K.O.!', '', 1600));
    Events.on('roundEnd', (e) => this.onRoundEnd(e));
    Events.on('lowStamina', (e) => { if (e.f.index === 0) this.say('Low stamina'); });
    Events.on('comboEnd', (e) => { if (e.hits >= 3 && e.att && e.att.index === 0) this.say(e.hits + ' hit combo'); });
    Events.on('glLost', () => { Game.pause(); this.toast('Graphics context lost. Waiting for the browser to restore it...', 'warn'); });
    Events.on('glRestored', () => this.toast('Graphics restored'));
    Events.on('bindings', () => { if (this.current === 'controls') this.rerender(true); });
    this.buildTouch();
    this.applyTouchVisibility();
    CreatorUI.init();
  },

  /* ----- helpers ----- */
  toast(msg, kind) {
    if (!msg) return;
    const el = document.createElement('div');
    el.className = 'toast' + (kind ? ' ' + kind : '');
    el.textContent = msg;
    this.dom.toast.appendChild(el);
    while (this.dom.toast.children.length > 3) this.dom.toast.removeChild(this.dom.toast.firstChild);
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 3200);
  },
  say(text) { this.dom.announce.textContent = ''; setTimeout(() => { this.dom.announce.textContent = text; }, 30); },
  banner(text, sub, ms) {
    const b = this.dom.banner, id = ++this.banners;
    b.innerHTML = esc(text) + (sub ? '<small>' + esc(sub) + '</small>' : '');
    b.classList.add('on');
    setTimeout(() => { if (this.banners === id) b.classList.remove('on'); }, ms);
    this.say(text + (sub ? '. ' + sub : ''));
  },
  setText(key, el, value) { if (this.cache[key] !== value) { this.cache[key] = value; el.textContent = value; } },
  setHtml(key, el, value) { if (this.cache[key] !== value) { this.cache[key] = value; el.innerHTML = value; } },
  setTransform(key, el, value) { if (this.cache[key] !== value) { this.cache[key] = value; el.style.transform = value; } },
  /* The control for an action on the device the player used last. */
  keyName(action) {
    if (Input.lastDevice === 'gamepad') return GAMEPAD_LABELS[action];
    if (Input.lastDevice === 'touch') return TOUCH_LABELS[action];
    return keyLabel(Keymap.bindings[action][0]);
  },
  /* First match only: a short card with the main controls for the device in use. */
  showOnboarding() {
    const k = (a) => '<kbd>' + esc(this.keyName(a)) + '</kbd>';
    this.dom.onboard.innerHTML = '<h3>CONTROLS</h3>' +
      'Attacks: ' + ['lp', 'rp', 'lk', 'rk'].map(k).join(' ') + '<br>' +
      'Hold ' + k('strong') + ' strong or ' + k('height') + ' height, then attack<br>' +
      'Block high ' + k('blockHigh') + ', low ' + k('blockLow') + '<br>' +
      'Grapple / escape ' + k('grapple') + '<br>' +
      'Move list: pause with ' + k('pause') + '<small>Click or press any key to close</small>';
    this.dom.onboard.hidden = false;
    Progress.d.seenControls = true;
    Progress.save();
    clearTimeout(this.onboardTimer);
    this.onboardTimer = setTimeout(() => this.hideOnboarding(), ONBOARD_MS);
  },
  hideOnboarding() {
    clearTimeout(this.onboardTimer);
    this.dom.onboard.hidden = true;
  },
  fade(fn) {
    const f = this.dom.fade;
    f.classList.add('on');
    setTimeout(() => { fn(); f.classList.remove('on'); }, Settings.v.reducedMotion ? 0 : 200);
  },

  /* ----- game state -> screens ----- */
  onGameState(e) {
    const to = e.to;
    Input.enabled = to === GS.FIGHT || to === GS.COUNTDOWN;
    window.onbeforeunload = (to === GS.FIGHT || to === GS.COUNTDOWN || to === GS.PAUSED) ? (ev) => { ev.preventDefault(); ev.returnValue = ''; return ''; } : null;
    const inMatch = [GS.COUNTDOWN, GS.FIGHT, GS.PAUSED, GS.ROUND_END, GS.VICTORY, GS.DEFEAT].includes(to);
    this.dom.hud.hidden = !inMatch || !Game.match;
    this.dom.fatal.hidden = to !== GS.ERROR;
    if (to !== GS.COUNTDOWN && to !== GS.FIGHT) this.hideOnboarding();
    this.applyTouchVisibility();
    Sound.duck(to === GS.PAUSED || to === GS.RESULTS);
    switch (to) {
      case GS.MENU:
        this.stack = []; Music.start(this.musicFor(null), 0); Sound.setArena(ARENAS.warehouse);
        if (CreatorUI.resumeAfterPreview()) break;
        this.menuScene('warehouse', 'kai', this.showcaseOpponent(), false); this.go('main');
        break;
      case GS.CHARSEL: this.stack = []; this.menuScene(Game.selection.arena, Game.selection.player, null, true); this.go('char'); break;
      case GS.ARENASEL: this.menuScene(Game.selection.arena, Game.selection.player, Game.selection.opponent, false); this.go('arena'); break;
      case GS.COUNTDOWN: case GS.FIGHT:
        this.hideScreen();
        if (![GS.PAUSED, GS.COUNTDOWN, GS.FIGHT, GS.ROUND_END].includes(e.from)) this.startMatchMusic();
        break;
      case GS.PAUSED: this.stack = []; this.go('pause'); this.guardUntil = performance.now() + 350; break;
      case GS.ROUND_END: break;
      case GS.VICTORY: this.banner('VICTORY', Game.resultsData ? Game.resultsData.player + ' wins' : '', 3000); Music.stop(); break;
      case GS.DEFEAT: this.banner('DEFEAT', '', 3000); Music.stop(); break;
      case GS.RESULTS: this.stack = []; this.go('results'); this.guardUntil = performance.now() + RESULTS_GUARD_MS; break;
      case GS.ERROR: this.showFatal(e.error || 'Unknown error'); break;
      default: break;
    }
  },
  musicFor(def) { const a = def ? def.audio : { bpm: 84, root: 55, mode: 'minor' }; return { bpm: a.bpm, root: a.root, mode: a.mode }; },
  startMatchMusic() { const def = Game.match.def; Sound.setArena(def); Music.start(this.musicFor(def), MUSIC_FIGHT); },
  showcaseOpponent() { const custom = CustomRoster.profiles()[0]; return custom ? custom.id : 'mara'; },
  menuScene(arenaId, left, right, solo) { Showcase.set(arenaId, left, right || (left === 'kai' ? 'mara' : 'kai'), solo); Camera.snapNext = true; },
  onMatchCreated(match) {
    const train = match.training;
    const browserKeys = ACTIONS.some((a) => Keymap.bindings[a].some((c) => /^(Control|Alt)/.test(c)));
    if (!this.tipShown && browserKeys) { this.tipShown = true; this.toast('Tip: Ctrl / Alt shortcuts (Ctrl+W closes the tab) still work in a window. Use Fullscreen (Settings) or remap those keys.', 'warn'); }
    if (window.innerHeight > window.innerWidth && (Settings.v.touch === 'on' || ('ontouchstart' in window))) this.toast('Rotate your device to landscape for the best view', 'warn');
    this.cache = {};
    this.dom.hn1.textContent = 'P1 ' + match.fighters[0].name;
    this.dom.hn2.textContent = (train ? 'DUMMY ' : 'CPU ') + match.fighters[1].name;
    this.ghost = [1, 1];
    this.dom.training.hidden = !train;
    this.dom.hud.hidden = false;
    this.dom.timer.textContent = match.cfg.timer ? String(match.cfg.timer) : '';
    this.dom.timer.hidden = train;
    this.dom.roundlbl.hidden = false;
    if (!Progress.d.seenControls) this.showOnboarding();
    this.pops.forEach((p) => { p.age = 99; p.el.style.opacity = '0'; });
    Input.reset();
  },
  /* Round 1 introduces the fight: Arcade stage or Survival opponent number, then who you face. */
  roundSub(m) {
    if (m.round !== 1) return '';
    const run = Game.run, vs = 'VS ' + m.fighters[1].name;
    if (m.cfg.mode === 'arcade' && run) return 'STAGE ' + (run.stage + 1) + ' / ' + run.ladder.length + ' · ' + vs;
    if (m.cfg.mode === 'survival' && run) return 'OPPONENT ' + (run.kills + 1) + ' · ' + vs;
    return vs;
  },
  onRoundEnd(e) {
    const m = e.match;
    let t = e.reason === 'time' ? 'TIME UP' : 'K.O.';
    let sub = e.winner < 0 ? 'DRAW' : m.fighters[e.winner].name + ' WINS THE ROUND';
    if (e.reason === 'time' && e.winner < 0) t = 'DRAW';
    this.banner(t, sub, 2200);
  },

  /* ----- screens ----- */
  go(name) { this.current = name; this.rerender(false); },
  push(name) { if (this.current) this.stack.push(this.current); this.current = name; this.rerender(false); },
  hideScreen() { this.current = null; this.stack = []; this.dom.screens.innerHTML = ''; },
  back() {
    const cur = this.current;
    if (cur === 'pause') { Game.resume(); return; }
    if (cur === 'results' || cur === 'main' || !cur) return;
    if (cur === 'creator') { CreatorUI.back(); return; }
    Sound.ui('back');
    if (cur === 'modes') { this.go('main'); return; }
    if (cur === 'char') { Game.go(GS.MENU); this.go('modes'); return; }
    if (cur === 'setup') { this.go('char'); return; }
    if (cur === 'arena') { const setup = ['free', 'training'].includes(Game.selection.mode); Game.go(GS.CHARSEL); if (setup) this.go('setup'); return; }
    const prev = this.stack.pop();
    this.go(prev || (Game.state === GS.PAUSED ? 'pause' : 'main'));
  },
  rerender(keepFocus) {
    const root = this.dom.screens;
    let idx = 0;
    if (keepFocus) { const items = this.navItems(); idx = Math.max(0, items.indexOf(document.activeElement)); }
    const fn = this['screen_' + this.current];
    root.innerHTML = fn ? fn.call(this) : '';
    const items = this.navItems();
    const def = root.querySelector('[data-default]');
    const target = keepFocus ? items[Math.min(idx, items.length - 1)] : (def || items[0]);
    if (target) target.focus({ preventScroll: false });
  },
  navItems() { return Array.from(this.dom.screens.querySelectorAll('[data-nav]')); },
  moveFocus(dir) {
    const items = this.navItems();
    if (!items.length) return;
    let i = items.indexOf(document.activeElement);
    i = i < 0 ? 0 : (i + dir + items.length) % items.length;
    items[i].focus();
    Sound.ui('move');
  },
  onKey(e) {
    if (Input.captureCallback) return;
    if (!this.dom.onboard.hidden) this.hideOnboarding();
    if (Game.state === GS.FIGHT && Game.match && Game.match.training) {
      const m = Game.match;
      if (e.code === 'Tab') { e.preventDefault(); m.resetFighters(); return; }
      if (e.code === 'F2') { e.preventDefault(); m.resetArenaObjects(); return; }
      if (/^Digit[1-5]$/.test(e.code) && !e.repeat) { m.scenario(Number(e.code.slice(5))); return; }
    }
    if (e.code === 'F3') { e.preventDefault(); this.toggleDiag(); return; }
    if (!this.current) return;
    if (this.current === 'creator' && CreatorUI.onKey(e)) return;
    const el = document.activeElement;
    const k = e.code;
    const isOpt = el && el.classList && el.classList.contains('opt');
    if (k === 'ArrowDown' || k === 'KeyS') { e.preventDefault(); this.moveFocus(1); }
    else if (k === 'ArrowUp' || k === 'KeyW') { e.preventDefault(); this.moveFocus(-1); }
    else if (k === 'ArrowRight' || k === 'KeyD' || k === 'ArrowLeft' || k === 'KeyA') {
      const dir = (k === 'ArrowRight' || k === 'KeyD') ? 1 : -1;
      if (isOpt) { e.preventDefault(); this.adjust(el, dir); } else if (el && el.classList.contains('card')) { e.preventDefault(); this.moveFocus(dir); }
    } else if (k === 'Enter' || k === 'Space') {
      if (performance.now() < this.guardUntil) { e.preventDefault(); return; }
      if (isOpt) { e.preventDefault(); this.adjust(el, 1); } else if (el && el.tagName === 'BUTTON') { e.preventDefault(); el.click(); }
    } else if (k === 'Escape' || k === 'Backspace') {
      if (e.repeat) return;
      e.preventDefault();
      if (performance.now() < this.guardUntil) return;
      this.back();
    }
  },
  onClick(e) {
    if (performance.now() < this.guardUntil && (this.current === 'pause' || this.current === 'results')) return;
    const t = e.target.closest('[data-act]');
    if (t) { this.act(t.getAttribute('data-act'), t); return; }
    if (e.target.closest('input,textarea')) return;           // text fields and sliders handle themselves
    const opt = e.target.closest('.opt');
    if (opt) this.adjust(opt, 1);
  },
  adjust(el, dir) {
    const creatorKey = el.getAttribute('data-cr');
    if (creatorKey) { CreatorUI.adjust(creatorKey, dir); return; }
    const key = el.getAttribute('data-set');
    if (key) { this.changeSetting(key, dir); return; }
    const local = el.getAttribute('data-local');
    if (local) this.changeLocal(local, dir);
  },
  changeSetting(key, dir) {
    const def = SETTING_DEFS[key];
    const cur = Settings.v[key];
    let next = cur;
    if (def.type === 'num') next = clamp(cur + dir * def.step, def.min, def.max);
    else if (def.type === 'bool') next = !cur;
    else { const i = def.options.indexOf(cur); next = def.options[(i + dir + def.options.length) % def.options.length]; }
    Settings.set(key, next);
    if (['master', 'sfx', 'music'].includes(key)) Sound.applyVolumes();
    if (['quality', 'shadows', 'effects'].includes(key)) Quality.apply();
    if (key === 'uiScale') setTimeout(() => R.resize(), 0);
    if (key === 'sfx') Sound.ui('ok');
    if (key === 'antialias') this.toast('Anti-aliasing changes apply after reloading the page');
    this.rerender(true);
  },
  changeLocal(name, dir) {
    const sel = Game.selection;
    if (name === 'diff') { const i = DIFFICULTY_ORDER.indexOf(sel.difficulty); sel.difficulty = DIFFICULTY_ORDER[(i + dir + 4) % 4]; }
    else if (name === 'rounds') { const list = [1, 2, 3]; sel.rounds = list[(list.indexOf(sel.rounds) + dir + 3) % 3]; }
    else if (name === 'timer') { const list = [30, 60, 90, 0]; sel.timer = list[(list.indexOf(sel.timer) + dir + 4) % 4]; }
    else if (name === 'alevel') { const i = ARCADE_LEVELS.indexOf(sel.arcadeLevel); sel.arcadeLevel = ARCADE_LEVELS[(i + dir + ARCADE_LEVELS.length) % ARCADE_LEVELS.length]; }
    else if (name === 'tscen') { this.scenIdx = (this.scenIdx + dir + SCENARIOS.length) % SCENARIOS.length; }
    else if (name === 'tdummy' && Game.match) { const m = Game.match, i = DUMMY_MODES.indexOf(m.cfg.dummy); m.setDummy(DUMMY_MODES[(i + dir + DUMMY_MODES.length) % DUMMY_MODES.length]); }
    this.rerender(true);
  },
  act(a) {
    Sound.unlock();
    const [name, arg] = a.split(':');
    Sound.ui(name === 'back' ? 'back' : 'ok');
    switch (name) {
      case 'play': this.go('modes'); break;
      case 'controls': this.push('controls'); break;
      case 'settings': this.push('settings'); break;
      case 'credits': this.push('credits'); break;
      case 'moves': this.push('moves'); break;
      case 'back': this.back(); break;
      case 'mode': Game.chooseMode(arg); break;
      // picking the card that is already selected confirms it, so a double click or a second Enter moves on
      case 'pick': if (arg === Game.selection.player) { this.confirmFighter(); break; } Game.choosePlayer(arg); this.menuScene(Game.selection.arena, arg, null, true); this.rerender(true); break;
      case 'confirm': this.confirmFighter(); break;
      case 'opp': if (arg === Game.selection.opponent) { Game.go(GS.ARENASEL); break; } Game.selection.opponent = arg; this.rerender(true); break;
      case 'setupNext': Game.go(GS.ARENASEL); break;
      case 'arena': if (arg === Game.selection.arena) { Game.startFromSelection(); break; } Game.chooseArena(arg); this.menuScene(arg, Game.selection.player, Game.selection.opponent, false); this.rerender(true); break;
      case 'start': Game.startFromSelection(); break;
      case 'rebind': this.startRebind(arg); break;
      case 'resetKeys': Keymap.resetAll(); this.toast('Keyboard bindings reset'); break;
      case 'resetSettings': Settings.reset(); Sound.applyVolumes(); Quality.apply(); this.rerender(true); break;
      case 'fullscreen': this.toggleFullscreen(); break;
      case 'resume': Game.resume(); break;
      case 'restart': Game.restartMatch(); break;
      case 'quit': Game.quitToMenu(); break;
      case 'res': Game.resultsAction(arg); break;
      case 'selftest': this.runSelfTest(); break;
      case 'tdummy': this.changeLocal('tdummy', 1); break;
      case 'thp': Game.match.infiniteHp = !Game.match.infiniteHp; this.rerender(true); break;
      case 'tstam': Game.match.infiniteStam = !Game.match.infiniteStam; this.rerender(true); break;
      case 'treset': Game.match.resetFighters(); Game.resume(); break;
      case 'tarena': Game.match.resetArenaObjects(); Game.resume(); break;
      case 'tscenGo': Game.match.scenario(this.scenIdx + 1); Game.resume(); break;
      case 'dec': this.changeSetting(arg, -1); break;
      case 'inc': this.changeSetting(arg, 1); break;
      case 'ldec': this.changeLocal(arg, -1); break;
      case 'linc': this.changeLocal(arg, 1); break;
      case 'errmenu': this.dom.fatal.hidden = true; Game.go(GS.MENU); break;
      case 'create': CreatorUI.open(this.current === 'char' ? 'char' : 'main'); break;
      case 'editcustom': CreatorUI.openSlot('char', CUSTOM_IDS.indexOf(Game.selection.player)); break;
      default: if (name.startsWith('cr')) CreatorUI.act(name, arg); break;
    }
  },
  confirmFighter() {
    const sel = Game.selection;
    if (!Progress.isUnlocked(sel.player)) { Sound.ui('bad'); this.toast('Locked. Win Arcade fights to unlock this fighter.', 'warn'); return; }
    if (sel.mode === 'arcade') Game.startFromSelection();
    else if (sel.mode === 'free' || sel.mode === 'training') { if (sel.opponent === sel.player) sel.opponent = Game.opponentsFor(sel.player)[0].id; this.go('setup'); }
    else Game.go(GS.ARENASEL);
  },
  startRebind(action) {
    const btn = this.dom.screens.querySelector('[data-act="rebind:' + action + '"]');
    if (btn) btn.textContent = 'Press a key... (Esc cancels)';
    Input.capture((code) => {
      if (code === 'Escape') { this.rerender(true); return; }
      const r = Keymap.rebind(action, code);
      this.toast(r.ok ? ACTION_LABELS[action] + ' = ' + keyLabel(code) : r.msg, r.ok ? '' : 'warn');
      if (!r.ok) Sound.ui('bad');
      this.rerender(true);
    });
  },
  toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        const p = document.documentElement.requestFullscreen();
        Promise.resolve(p).then(() => { if (navigator.keyboard && navigator.keyboard.lock) navigator.keyboard.lock(['ControlLeft', 'AltLeft', 'KeyW', 'KeyQ', 'KeyE', 'KeyR']).catch(() => {}); }).catch(() => this.toast('Fullscreen was blocked by the browser', 'warn'));
      } else { document.exitFullscreen(); if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); }
    } catch (err) { this.toast('Fullscreen is not available', 'warn'); }
  },

  screen_moves() {
    const BTN = { lp: 'Left punch', rp: 'Right punch', lk: 'Left kick', rk: 'Right kick', grapple: 'Grapple' };

      const fa = frameAdvantage(m);
      const note = [m.kind === 'launch' ? 'launcher' : '', m.kind === 'knockdown' ? 'knockdown' : '', m.kind === 'stagger' ? 'stagger' : '', m.gb ? 'guard break' : '', m.width >= 0.8 ? 'wide arc' : '', m.type === 'grab' ? 'beats blocks' : ''].filter(Boolean).join(', ');

    }).join('');
    return '<section class="screen on" aria-label="Move list"><div class="panel wide"><h2>Move list</h2><p class="sub">Frame data at 60 fps. Strong moves cost more stamina and leave you open longer if they miss. Chains: light &rarr; medium &rarr; strong, never the other way round; strong moves end a combo.</p>' +
      '<table class="ctl"><tr><th>Move</th><th>Input</th><th>Hits</th><th>Start / Active / Recover</th><th>Dmg</th><th>Stam</th><th>Adv hit / block</th><th>Notes</th></tr>' + rows + '</table>' +
      '<h3>Clinch and throws</h3><p>Grapple at close range to clinch. The grip depends on position: <b>front</b> (face to face), <b>rear</b> (opponent turned away; harder to escape) or <b>low</b> (you or the opponent crouching). In the clinch, up to two strikes: left punch = knee (drains stamina), right punch = elbow (harder hit); kick or Grapple = throw in the direction you hold (the HUD arrow shows it). Throws into walls and scenery deal extra damage. The defender escapes with Grapple during the escape window.</p>' +

  },
  throwTable() {

  /* ----- gamepad menu navigation ----- */
  update() {
    this.frameCount++;
    if (this.current === 'creator' && this.frameCount % 15 === 1) CreatorUI.measureFocus(); // panel size changes with layout
    if (!this.current || Input.captureCallback) return;
    const unpause = Input.take('pause');   // P / gamepad Start close the pause screen (Esc goes through onKey)
    if (unpause && this.current === 'pause' && performance.now() > this.guardUntil) { Game.resume(); return; }
    const pd = Input.padDir, ph = Input.padHeld, p = this.padPrev;
    const ok = !!(ph.lk), back = !!(ph.rk);
    if (pd.down && !p.down) this.moveFocus(1);
    if (pd.up && !p.up) this.moveFocus(-1);
    const el = document.activeElement;
    if (pd.right && !p.right) { if (el && el.classList.contains('opt')) this.adjust(el, 1); else if (el && el.classList.contains('card')) this.moveFocus(1); }
    if (pd.left && !p.left) { if (el && el.classList.contains('opt')) this.adjust(el, -1); else if (el && el.classList.contains('card')) this.moveFocus(-1); }
    if (ok && !p.ok && performance.now() > this.guardUntil) { if (el && el.classList.contains('opt')) this.adjust(el, 1); else if (el && el.tagName === 'BUTTON') el.click(); }
    if (back && !p.back && performance.now() > this.guardUntil) this.back();
    if (this.current === 'creator') this.creatorPad(ph, pd, p);
    p.up = pd.up; p.down = pd.down; p.left = pd.left; p.right = pd.right; p.ok = ok; p.back = back;
  },

  /* Creator extras on a gamepad: L1 / R1 switch tabs, L2 / R2 turn the preview. */
  creatorPad(ph, pd, p) {
    const onTab = document.activeElement && document.activeElement.classList.contains('tab');
    if ((ph.strong && !p.l1) || (onTab && pd.left && !p.left)) CreatorUI.stepTab(-1);
    if ((ph.blockHigh && !p.r1) || (onTab && pd.right && !p.right)) CreatorUI.stepTab(1);
    if (ph.height) Showcase.turnPreview(-0.04);
    if (ph.blockLow) Showcase.turnPreview(0.04);
    p.l1 = !!ph.strong; p.r1 = !!ph.blockHigh;
  },

  /* ----- HUD ----- */
  onHit(e) {
    const txt = (e.counter ? 'COUNTER ' : '') + Math.round(e.dmg);
    this.popAt(e.x, e.y + 0.1, e.z, txt, e.def.index === 0 ? '#ff9a9a' : '#ffffff');
  },
  onBlock(e) {
    const t = e.broke ? 'GUARD BREAK!' : e.perfect ? 'PERFECT BLOCK!' : 'BLOCK';
    this.popAt(e.x, e.y + 0.1, e.z, t, e.broke ? '#ffb347' : '#9cf4ff');
  },
  popAt(x, y, z, text, color) {
    const p = this.pops[this.popIdx++ % this.pops.length];
    p.age = 0; p.life = 0.95; p.x = x; p.y = y; p.z = z;
    p.el.textContent = text;
    p.el.style.color = color;
    p.el.style.opacity = '1';
  },
  frame(m) {
    const d = this.dom;
    if (m && !d.hud.hidden) this.hudUpdate(m);
    this.diagTick();
  },
  /* Final round, match point or a fighter close to a knock-out. */
  tenseMoment(m) {
    if (m.training) return false;
    const [a, b] = m.fighters;
    const matchPoint = m.round > 1 && (m.wins[0] === m.winsNeeded - 1 || m.wins[1] === m.winsNeeded - 1);
    const lowHp = Math.min(a.hp / a.maxHp, b.hp / b.maxHp) < TENSE_HP_FRACTION;
    return m.decider || matchPoint || lowHp;
  },
  hudUpdate(m) {
    const [a, b] = m.fighters;
    const dt = 1 / 60;
    const bar = (i, f) => {
      const frac = clamp(f.hp / f.maxHp, 0, 1);
      this.ghost[i] = frac >= this.ghost[i] ? frac : Math.max(frac, this.ghost[i] - dt * 0.35);
      this.setTransform('hp' + i, this.dom['hp' + (i + 1)], 'scaleX(' + frac.toFixed(3) + ')');
      this.setTransform('hg' + i, this.dom['hg' + (i + 1)], 'scaleX(' + this.ghost[i].toFixed(3) + ')');
      this.setText('ht' + i, this.dom['ht' + (i + 1)], Math.ceil(f.hp) + ' / ' + f.maxHp);
      this.setTransform('st' + i, this.dom['st' + (i + 1)], 'scaleX(' + clamp(f.stam / f.maxStam, 0, 1).toFixed(3) + ')');
      const low = f.lowStamina;
      if (this.cache['low' + i] !== low) { this.cache['low' + i] = low; this.dom['stb' + (i + 1)].classList.toggle('low', low); }
    };
    bar(0, a); bar(1, b);
    Music.setIntensity(this.tenseMoment(m) ? MUSIC_TENSE : MUSIC_FIGHT);
    const tl = m.timeLeft;
    this.setText('timer', this.dom.timer, tl === null ? (m.training ? '' : '∞') : String(tl));
    const lowTime = tl !== null && tl <= TIMER_LOW_SECONDS;
    if (this.cache.lowTime !== lowTime) { this.cache.lowTime = lowTime; this.dom.timer.classList.toggle('low', lowTime); }
    const cfg = m.cfg;
    this.setText('round', this.dom.roundlbl, m.training ? 'TRAINING' : (m.decider ? 'FINAL ROUND' : 'ROUND ' + m.round));
    if (!m.training) {
      const pip = (w) => '●'.repeat(w) + '○'.repeat(Math.max(0, m.winsNeeded - w));
      this.setText('pips1', this.dom.pips1, pip(m.wins[0])); this.setText('pips2', this.dom.pips2, pip(m.wins[1]));
    } else { this.setText('pips1', this.dom.pips1, ''); this.setText('pips2', this.dom.pips2, ''); }
    let info = '';
    const run = Game.run;
    if (cfg.mode === 'arcade' && run) info = 'ARCADE · STAGE ' + (run.stage + 1) + ' / ' + run.ladder.length + ' · ' + DIFFICULTY[cfg.difficulty].label.toUpperCase();
    else if (cfg.mode === 'survival' && run) info = 'SURVIVAL · DEFEATED ' + run.kills + ' · ' + DIFFICULTY[cfg.difficulty].label.toUpperCase();
    else if (cfg.mode === 'free') info = m.def.name.toUpperCase() + ' · ' + DIFFICULTY[cfg.difficulty].label.toUpperCase();
    else info = m.def.name.toUpperCase() + (Input.lastDevice === 'gamepad' ? ' · hold Select: reset · Start: training menu' : ' · Tab reset · F2 reset arena · 1-5 scenarios');
    this.setText('modeinfo', this.dom.modeinfo, info);
    // combo
    const showCombo = a.comboShow > 0 && a.comboHits >= 2;
    if (this.cache.combo !== showCombo) { this.cache.combo = showCombo; this.dom.combo.classList.toggle('on', showCombo); }
    if (showCombo) this.setHtml('combotxt', this.dom.combo, a.comboHits + ' HITS<small>' + Math.round(a.comboDamage) + ' DAMAGE</small>');
    // warnings and hints
    const warn = a.lowStamina && a.alive;
    if (this.cache.warn !== warn) { this.cache.warn = warn; this.dom.warn.classList.toggle('on', warn); }
    let hint = '';
    if (a.state === S.CLINCH) hint = this.clinchHint(a);
    else if (a.state === S.GRAPPLE) hint = this.throwHint(a);
    else if (b.state === S.CLINCH && b.alive) hint = '';
    if (this.cache.hint !== hint) {
      this.cache.hint = hint;
      this.dom.grappleHint.hidden = !hint; this.dom.grappleHint.textContent = hint;
      this.dom.grappleHint.classList.toggle('go', hint.startsWith('ESCAPE'));
    }
    // name tags + popups
    const out = [0, 0];
    for (let i = 0; i < 2; i++) {
      const f = m.fighters[i], el = this.tagEls[i];
      const ok = R.project(f.x, f.y + 2.15 * f.scale, f.z, out);
      let status = '';
      if (f.state === S.BLOCK_H || f.state === S.BLOCK_L) status = 'BLOCK';
      else if (f.state === S.STUN) status = 'STUNNED';
      else if (f.state === S.CLINCH || f.state === S.GRAPPLE) status = 'CLINCH';
      else if (f.state === S.DOWN) status = 'DOWN';
      else if (f.state === S.KO) status = 'K.O.';
      else if (f.lowStamina) status = 'TIRED';
      this.setHtml('tag' + i, el, (i === 0 ? '1P' : (m.training ? 'DUMMY' : 'CPU')) + (status ? '<i>' + status + '</i>' : ''));
      el.style.display = ok ? '' : 'none';
      if (ok) this.setTransform('tagpos' + i, el, 'translate(' + Math.round(out[0]) + 'px,' + Math.round(out[1]) + 'px) translate(-50%,-100%)');
    }
    for (const p of this.pops) {
      if (p.age > p.life) continue;
      p.age += 1 / 60;
      const u = p.age / p.life;
      if (u >= 1) { p.el.style.opacity = '0'; continue; }
      if (R.project(p.x, p.y + u * 0.6, p.z, out)) p.el.style.transform = 'translate(' + Math.round(out[0]) + 'px,' + Math.round(out[1]) + 'px) translate(-50%,-50%) scale(' + (1 + (1 - u) * 0.25).toFixed(2) + ')';
      p.el.style.opacity = String(u < 0.7 ? 1 : (1 - u) / 0.3);
    }
    if (m.training) this.trainingPanel(m);
  },
  /* Held player: wait while an escape would fail, then the call to press (a press in the last moments is kept). */
  clinchHint(f) {
    if (f.escapeLock > 0) return 'TOO EARLY! ' + GRIP_LABEL[f.grip] + ' · wait for ESCAPE NOW';
    if (f.clinchTick >= escapeStartFor(f) - ESCAPE_GRACE_TICKS) return 'ESCAPE NOW! Press ' + this.keyName('grapple');
    return 'CLINCHED (' + GRIP_LABEL[f.grip] + ') · HOLD... an early escape fails';
  },
  /* Clinch hint: grip, the throw the held direction will do and an on-screen arrow for it. */
  throwHint(f) {
    if (f.throwPending) return f.throwPending.data.name.toUpperCase() + '!';
    const data = throwFor(f.grip, f.throwAim);
    return GRIP_LABEL[f.grip] + ' · ' + this.screenArrow(f, f.throwAim) + ' ' + data.name.toUpperCase() + ' · hold a direction to aim, kick or ' + this.keyName('grapple') + ' throws, punch = knee';
  },
  /* Arrow for a fighter-relative direction as it appears on screen. */
  screenArrow(f, dir) {
    const v = Combat.throwVector(f, dir), wx = v[0], wz = v[1];
    const right = wx * Camera.dirRight[0] + wz * Camera.dirRight[1], up = wx * Camera.dirFwd[0] + wz * Camera.dirFwd[1];
    if (Math.abs(right) > Math.abs(up)) return right > 0 ? '→' : '←';
    return up > 0 ? '↑' : '↓';
  },
  trainingPanel(m) {
    const lm = m.lastMove;
    let h = '<b>FRAME DATA</b> (60 fps)<br>';
    if (lm && lm.mv) {
      const adv = (n) => (n > 0 ? '+' : '') + n;
      h += esc(lm.mv.name) + '<br>Startup ' + lm.startup + 'f &middot; Active ' + lm.active + 'f &middot; Recovery ' + lm.recovery + 'f<br>Result: ' + lm.result + (lm.adv ? '<br>Advantage: hit ' + adv(lm.adv.onHit) + ' / block ' + adv(lm.adv.onBlock) : '') + '<br>Damage: ' + (lm.dmg ? lm.dmg.toFixed(1) : '-');
    } else h += 'Perform a move';
    const a = m.fighters[0];
    h += '<br><b>COMBO</b> ' + a.comboHits + ' hits / ' + Math.round(a.comboDamage) + ' dmg<br><b>Dummy:</b> ' + DUMMY_LABEL[m.cfg.dummy];
    h += '<br><b>Objects:</b> ' + (() => { const c = Arena.statusCounts(); return c.intact + ' intact, ' + c.damaged + ' damaged, ' + c.destroyed + ' destroyed'; })();
    this.setHtml('train', this.dom.training, h);
  },

  /* ----- touch controls ----- */
  buildTouch() {
    const root = this.dom.touch;
    const stick = document.createElement('div');
    stick.id = 'stickBase';
    stick.innerHTML = '<div id="stickKnob"></div>';
    root.appendChild(stick);
    const knob = stick.firstChild;
    let activeId = null;
    const move = (e) => {
      const r = stick.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width / 2;
      let x = (e.clientX - cx) / rad, y = (e.clientY - cy) / rad;
      const m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
      const dead = 0.15;
      Input.touchStickSet(m < dead ? 0 : x, m < dead ? 0 : y, m >= dead);
      knob.style.transform = 'translate(' + x * rad * 0.55 + 'px,' + y * rad * 0.55 + 'px)';
    };
    const end = () => { activeId = null; Input.touchStickSet(0, 0, false); knob.style.transform = ''; };
    stick.addEventListener('pointerdown', (e) => { activeId = e.pointerId; stick.setPointerCapture(e.pointerId); move(e); e.preventDefault(); });
    stick.addEventListener('pointermove', (e) => { if (e.pointerId === activeId) move(e); });
    stick.addEventListener('pointerup', (e) => { if (e.pointerId === activeId) end(); });
    stick.addEventListener('pointercancel', end);
    stick.addEventListener('lostpointercapture', end);
    const defs = [['lp', 'LP'], ['rp', 'RP'], ['lk', 'LK'], ['rk', 'RK'], ['strong', 'STR'], ['height', 'HGT'], ['blockHigh', 'BLK H'], ['blockLow', 'BLK L'], ['jump', 'JUMP'], ['crouch', 'DUCK'], ['grapple', 'GRAB'], ['dash', 'DASH'], ['stance', 'STNC'], ['pause', 'II']];
    for (const [action, label] of defs) {
      const b = document.createElement('div');
      b.className = 'tb' + (['stance', 'strong', 'height', 'blockHigh', 'blockLow', 'grapple', 'dash', 'jump', 'crouch'].includes(action) ? ' sm' : '');
      b.setAttribute('data-a', action);
      b.setAttribute('role', 'button');
      b.setAttribute('aria-label', ACTION_LABELS[action]);
      b.textContent = label;
      const ids = new Set();
      const set = (down, id) => { if (down) ids.add(id); else ids.delete(id); const on = ids.size > 0; b.classList.toggle('on', on); Input.touchSet(action, on); };
      b.addEventListener('pointerdown', (e) => { b.setPointerCapture(e.pointerId); set(true, e.pointerId); e.preventDefault(); });
      const up = (e) => set(false, e.pointerId);
      b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
      root.appendChild(b);
    }
  },
  applyTouchVisibility() {
    const mode = Settings.v.touch;
    const touchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
    const want = mode === 'on' || (mode === 'auto' && touchDevice);
    const inMatch = [GS.COUNTDOWN, GS.FIGHT].includes(Game.state);
    this.dom.touch.hidden = !(want && inMatch);
    if (this.dom.pauseBtn) this.dom.pauseBtn.hidden = want;
  },

  /* ----- diagnostics ----- */
  toggleDiag() { Settings.set('showStats', !Settings.v.showStats); this.dom.diag.hidden = !Settings.v.showStats; },
  diagTick() {
    const el = this.dom.diag;
    const on = Settings.v.showStats;
    if (el.hidden === on) el.hidden = !on;
    if (!on) return;
    const now = performance.now();
    if (now - (this.diagAt || 0) < 250) return;
    this.diagAt = now;
    const m = Game.match, st = R.stats;
    const mem = performance.memory ? ' mem ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + 'MB' : '';
    el.textContent = 'BREAKPOINT ' + VERSION + ' | state ' + Game.state + '\n' +
      'fps ' + (1000 / Math.max(1, Diag.frameMs)).toFixed(0) + ' frame ' + Diag.frameMs.toFixed(1) + 'ms sim ' + Diag.simMs.toFixed(2) + 'ms capped ' + Diag.cappedSteps + mem + '\n' +
      'draws ' + st.draws + ' inst ' + st.instances + ' culled ' + st.culled + ' res ' + R.width + 'x' + R.height + ' q ' + Quality.level + ' s' + R.scale.toFixed(2) + ' gpu ' + GPU.tier + ' msaa ' + (R.antialias ? 'on' : 'off') + '\n' +
      'particles ' + FX.active + ' debris ' + Debris.active + ' voices ' + Sound.voices + ' audio ' + (Sound.ctx ? Sound.ctx.state : 'none') + '\n' +
      'illegal transitions ' + Diag.illegalTransitions + ' errors ' + Diag.errors + ' listeners ' + Events.count() + ' storage ' + (Store.ok ? 'ok' : 'memory') + '\n' +
      'pad ' + (Input.padInfo.connected ? Input.padInfo.name.slice(0, 30) : 'none') + ' startup ' + Diag.startupMs.toFixed(0) + 'ms\n' +
      (m ? 'tick ' + m.tick + ' hitstop ' + m.hitStop + ' P1 ' + m.fighters[0].state + ' P2 ' + m.fighters[1].state + '\n' : '') +
      Diag.logs.slice(-5).join('\n');
  },
};

/* =====================================================================
   09b CREATOR UI - "Create Fighter": tabs, live 3D preview, save slots, share codes, fight preview.
   Rules and validation live in 05d; this module edits a draft record and renders it.
   ===================================================================== */
const CREATOR_TABS = [
  { id: 'body', label: 'Body' }, { id: 'head', label: 'Head' }, { id: 'outfit', label: 'Outfit' },
  { id: 'style', label: 'Style' }, { id: 'identity', label: 'Identity' }, { id: 'library', label: 'Slots' },
];
const PREVIEW_POSES = ['guard', 'punch', 'kick', 'victory'];
const POSE_LABELS = { guard: 'Guard', punch: 'Punch', kick: 'Kick', victory: 'Victory' };
const ATTR_LABELS = { health: 'Health', stamina: 'Stamina', strength: 'Strength', speed: 'Speed', reach: 'Reach', defense: 'Defense', balance: 'Balance', recovery: 'Recovery' };
const TURN_STEP = Math.PI / 6;
const HUE_STEP = 6;
const LIGHT_STEP = 0.03;
const BASE_HEIGHT_CM = 178;
const PREVIEW_ID = 'preview';            // temporary roster id used by "Fight preview"
const FINE_RANGES = { skin: { hueMin: 5, hueMax: 50, lightMin: 0.15, lightMax: 0.88 }, other: { hueMin: 0, hueMax: 359, lightMin: 0.08, lightMax: 0.92 } };

const CreatorUI = {
  draft: null, slot: 0, savedJson: '', tab: 'body', origin: 'main', confirm: null, fineKey: 'top', harmony: 0, randomCount: 0,
  exportCode: '', returnState: null, drag: null,

  init() {
    const root = UI.dom.screens;
    root.addEventListener('input', (e) => this.onInput(e));
    root.addEventListener('change', (e) => this.onChange(e));
    root.addEventListener('pointerdown', (e) => this.onPointerDown(e));
    root.addEventListener('pointermove', (e) => this.onPointerMove(e));
    root.addEventListener('pointerup', () => { this.drag = null; });
    root.addEventListener('pointercancel', () => { this.drag = null; });
  },

  /* ----- opening, closing, dirty tracking ----- */
  open(origin) {
    this.origin = origin;
    this.confirm = null;
    this.exportCode = '';
    const free = CustomRoster.firstFree();
    if (free >= 0) this.startNew(free, 'body');
    else { this.load(0); this.tab = 'library'; UI.toast('All ' + CUSTOM_SLOTS + ' slots are in use: edit one or delete a fighter first', 'warn'); }
    UI.push('creator');
    this.refreshPreview();
  },
  openSlot(origin, slot) {
    this.origin = origin;
    this.confirm = null;
    this.load(slot);
    this.tab = 'body';
    UI.push('creator');
    this.refreshPreview();
  },
  startNew(slot, tab) {
    this.slot = slot;
    this.draft = defaultCustom(slot);
    this.savedJson = JSON.stringify(this.draft);       // an untouched new fighter has nothing to lose
    this.tab = tab;
  },
  load(slot) {
    this.slot = slot;
    const stored = CustomRoster.slots[slot];
    this.draft = stored ? cloneCustom(stored) : defaultCustom(slot);
    this.savedJson = JSON.stringify(this.draft);
  },
  isDirty() { return JSON.stringify(this.draft) !== this.savedJson; },
  ask(text, buttons) { this.confirm = { text, buttons }; UI.rerender(false); },
  closeConfirm() { this.confirm = null; UI.rerender(false); },
  /* Run fn now, or after the player agrees to drop unsaved changes. */
  guardUnsaved(fn) {
    if (!this.isDirty()) { fn(); return; }
    this.ask('You have unsaved changes. Discard them?', [
      { label: 'Keep editing', act: 'crcancel' },
      { label: 'Discard changes', run: fn },
    ]);
  },
  back() {
    if (this.confirm) { Sound.ui('back'); this.closeConfirm(); return; }
    Sound.ui('back');
    this.guardUnsaved(() => this.exit());
  },
  exit() {
    this.confirm = null;
    Showcase.endPreview();
    if (this.origin === 'char') { UI.menuScene(Game.selection.arena, Game.selection.player, null, true); UI.go('char'); return; }
    UI.menuScene('warehouse', 'kai', UI.showcaseOpponent(), false);
    UI.go('main');
  },

  /* ----- preview ----- */
  /* Tell the preview camera where the free screen area is (beside the panel in landscape, above it in portrait). */
  measureFocus() {
    const panel = document.querySelector('.panel.cr');
    if (!panel) return;
    const r = panel.getBoundingClientRect(), w = window.innerWidth, h = window.innerHeight;
    const panelBelow = r.top > h * 0.2;
    const cx = panelBelow ? w / 2 : r.left / 2, cy = panelBelow ? r.top * 0.56 : h / 2;   // slightly low: the camera looks down a little
    Showcase.previewFocus[0] = clamp(cx / w * 2 - 1, -0.9, 0.9);
    Showcase.previewFocus[1] = clamp(1 - cy / h * 2, -0.9, 0.9);
    Showcase.previewFreeHeight = clamp((panelBelow ? r.top : h) / h, 0.25, 1);
  },
  refreshPreview() { Showcase.showPreview(customProfile(this.draft, this.slot)); },
  cyclePose() {
    const i = PREVIEW_POSES.indexOf(Showcase.previewPose);
    Showcase.setPreviewPose(PREVIEW_POSES[(i + 1) % PREVIEW_POSES.length]);
    UI.say('Preview pose: ' + POSE_LABELS[Showcase.previewPose]);
    UI.rerender(true);
  },
  onPointerDown(e) {
    if (UI.current !== 'creator' || !e.target.classList || !e.target.classList.contains('creator')) return;
    this.drag = { id: e.pointerId, x: e.clientX };
    try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  },
  onPointerMove(e) {
    if (!this.drag || e.pointerId !== this.drag.id) return;
    Showcase.turnPreview((e.clientX - this.drag.x) * 0.012);
    this.drag.x = e.clientX;
  },

  /* ----- edits ----- */
  changed(message) {
    this.refreshPreview();
    if (message) UI.say(message);
    UI.rerender(true);
  },
  setLook(key, value) {
    this.draft.look[key] = value;
    const choice = LOOK_CHOICES[key];
    this.changed(choice ? choice.label + ': ' + choice.labels[value] : '');
  },
  cycleChoice(key, dir) {
    const options = LOOK_CHOICES[key].options;
    const i = options.indexOf(this.draft.look[key]);
    this.setLook(key, options[(i + dir + options.length) % options.length]);
  },
  cycleSwatch(key, dir) {
    const swatches = COLOR_GROUP_BY_KEY[key].swatches;
    const i = swatches.indexOf(this.draft.look[key]);
    const next = i < 0 ? 0 : (i + dir + swatches.length) % swatches.length;
    this.setColor(key, swatches[next]);
  },
  setColor(key, hex) {
    this.draft.look[key] = hex;
    this.fineKey = key === 'skin' ? this.fineKey : key;
    const group = COLOR_GROUP_BY_KEY[key];
    const index = group.swatches.indexOf(hex);
    this.changed(group.label + ': ' + (index >= 0 ? 'swatch ' + (index + 1) + ' of ' + group.swatches.length : 'custom'));
  },
  stepBody(key, dir) {
    const look = this.draft.look;
    if (key === 'scale') look.scale = snapToStep(look.scale + dir * SCALE_STEP, SCALE_MIN, SCALE_MAX, SCALE_STEP);
    else look.build = snapToStep(look.build + dir * BUILD_STEP, BUILD_MIN, BUILD_MAX, BUILD_STEP);
    this.changed(key === 'scale' ? 'Height ' + this.heightText() : 'Build ' + this.buildText());
  },
  fineStep(key, part, dir) {
    const hex = this.draft.look[key];
    const hsl = hexToHsl(hex);
    const range = key === 'skin' ? FINE_RANGES.skin : FINE_RANGES.other;
    if (part === 'hue') { hsl.h = clamp(hsl.h + dir * HUE_STEP, range.hueMin, range.hueMax); if (hsl.s < 0.05) hsl.s = 0.5; }
    else hsl.l = clamp(hsl.l + dir * LIGHT_STEP, range.lightMin, range.lightMax);
    this.draft.look[key] = hslToHex(hsl.h, hsl.s, hsl.l);
    this.changed(COLOR_GROUP_BY_KEY[key].label + (part === 'hue' ? ' hue ' + Math.round(hsl.h) : ' lightness ' + Math.round(hsl.l * 100) + '%'));
  },
  fineSet(key, part, value) {
    const hsl = hexToHsl(this.draft.look[key]);
    if (part === 'hue') { hsl.h = value; if (hsl.s < 0.05) hsl.s = 0.5; } else hsl.l = value;
    this.draft.look[key] = hslToHex(hsl.h, hsl.s, hsl.l);
    this.refreshPreview();
  },
  budget() { return budgetForTier(this.draft.tier); },
  stepAttr(key, dir) {
    const attrs = this.draft.attrs, next = attrs[key] + dir;
    if (canSetAttr(attrs, key, next, this.budget())) {
      attrs[key] = next;
      this.changed(ATTR_LABELS[key] + ' ' + next + '. ' + (this.budget() - attrTotal(attrs)) + ' points left');
      return;
    }
    Sound.ui('bad');
    const reason = next > ATTR_MAX ? 'Maximum is ' + ATTR_MAX : next < ATTR_MIN ? 'Minimum is ' + ATTR_MIN : 'No points left. Lower another attribute first';
    UI.say(reason);
    UI.toast(reason, 'warn');
  },
  setArchetype(dir) {
    const i = ARCHETYPE_IDS.indexOf(this.draft.arch);
    this.draft.arch = ARCHETYPE_IDS[(i + dir + ARCHETYPE_IDS.length) % ARCHETYPE_IDS.length];
    const a = ARCHETYPES[this.draft.arch];
    this.draft.moveStyle = ARCHETYPE_MOVE_STYLE[this.draft.arch];
    this.changed('Fighting style: ' + a.label + '. ' + a.desc + ' Movement: ' + MOVE_STYLE[this.draft.moveStyle].label + '.');
  },
  setMoveStyle(dir) {
    const i = MOVE_STYLE_IDS.indexOf(this.draft.moveStyle);
    this.draft.moveStyle = MOVE_STYLE_IDS[(i + dir + MOVE_STYLE_IDS.length) % MOVE_STYLE_IDS.length];
    const style = MOVE_STYLE[this.draft.moveStyle];
    this.changed('Movement: ' + style.label + '. ' + style.desc);
  },
  applySuggestedBuild() {
    this.draft.attrs = Object.assign({}, ARCHETYPES[this.draft.arch].attrs);
    this.changed('Suggested ' + ARCHETYPES[this.draft.arch].label + ' build applied');
  },
  toggleTier() {
    const next = this.draft.tier === 'standard' ? 'veteran' : 'standard';
    if (next === 'veteran' && !veteranUnlocked()) { Sound.ui('bad'); UI.toast('Veteran tier unlocks after clearing Arcade', 'warn'); UI.say('Veteran tier is locked'); return; }
    this.draft.tier = next;
    trimToBudget(this.draft.attrs, this.budget());
    this.changed('Tier: ' + (next === 'veteran' ? 'Veteran, ' : 'Standard, ') + this.budget() + ' points');
  },
  setTitle(dir) {
    this.draft.title = (this.draft.title + dir + TITLES.length) % TITLES.length;
    this.changed('Title: ' + TITLES[this.draft.title]);
  },
  cycleNameIdea(dir) {
    const i = NAME_IDEAS.indexOf(this.draft.name);
    this.draft.name = NAME_IDEAS[i < 0 ? 0 : (i + dir + NAME_IDEAS.length) % NAME_IDEAS.length];
    this.changed('Name: ' + this.draft.name);
  },
  randomize() {
    this.randomCount++;
    const seed = (Date.now() + this.randomCount * 7919) >>> 0;
    const keepName = this.draft.name;
    this.draft = randomCustom(seed);
    if (keepName) this.draft.name = keepName;          // a typed name survives; everything else is rolled
    this.changed('Randomized with seed ' + seed);
  },
  harmonize() {
    const scheme = harmonize(this.draft.look, this.harmony++);
    this.changed('Auto-harmony: ' + scheme + ' colours');
  },
  resetDraft() {
    const run = () => { this.load(this.slot); this.confirm = null; this.changed('Reset to the last saved version'); };
    if (!this.isDirty()) { run(); return; }
    this.ask('Reset all changes since the last save?', [{ label: 'Cancel', act: 'crcancel' }, { label: 'Reset', run }]);
  },

  /* ----- saving and slots ----- */
  save() {
    const result = CustomRoster.put(this.slot, this.draft);
    if (!result.ok) { Sound.ui('bad'); UI.toast('Cannot save: ' + result.error, 'err'); UI.say('Cannot save. ' + result.error); return false; }
    this.draft = cloneCustom(result.value);
    this.savedJson = JSON.stringify(result.value);
    if (this.origin === 'char') Game.choosePlayer(CUSTOM_IDS[this.slot]);
    UI.toast('Saved ' + this.draft.name + ' to slot ' + (this.slot + 1));
    UI.rerender(true);
    return true;
  },
  pickSlot(slot) {
    if (slot === this.slot) return;
    this.guardUnsaved(() => {
      this.confirm = null;
      if (CustomRoster.slots[slot]) this.load(slot); else this.startNew(slot, 'library');
      this.exportCode = '';
      this.changed('Slot ' + (slot + 1) + ': ' + (CustomRoster.slots[slot] ? CustomRoster.slots[slot].name : 'empty, new fighter'));
    });
  },
  newFighter() {
    const free = CustomRoster.firstFree();
    if (free < 0) { Sound.ui('bad'); UI.toast('All slots are in use. Delete a fighter first.', 'warn'); return; }
    this.guardUnsaved(() => { this.confirm = null; this.startNew(free, 'body'); this.changed('New fighter in slot ' + (free + 1)); });
  },
  duplicate() {
    const free = CustomRoster.firstFree();
    if (free < 0) { Sound.ui('bad'); UI.toast('No free slot to duplicate into', 'warn'); return; }
    const copy = cloneCustom(this.draft);
    copy.name = (copy.name.slice(0, NAME_MAX - 1) || 'COPY') + '2';
    const result = CustomRoster.put(free, copy);
    if (!result.ok) { Sound.ui('bad'); UI.toast('Cannot duplicate: ' + result.error, 'err'); return; }
    UI.toast('Copied to slot ' + (free + 1) + ' as ' + copy.name);
    UI.rerender(true);
  },
  deleteSlot() {
    if (!CustomRoster.slots[this.slot]) { Sound.ui('bad'); UI.toast('This slot is not saved yet', 'warn'); return; }
    const name = CustomRoster.slots[this.slot].name;
    this.ask('Delete ' + name + ' from slot ' + (this.slot + 1) + '? This cannot be undone.', [
      { label: 'Cancel', act: 'crcancel' },
      { label: 'Delete', run: () => { CustomRoster.remove(this.slot); this.startNew(this.slot, 'library'); this.confirm = null; this.changed(name + ' deleted'); } },
    ]);
  },
  exportDraft() {
    const checked = validateCustom(this.draft);
    if (!checked.ok) { Sound.ui('bad'); UI.toast('Fix this first: ' + checked.error, 'err'); return; }
    this.exportCode = encodeCustom(checked.value);
    UI.rerender(true);
    const box = $('crExport');
    const copied = () => UI.toast('Fighter code copied to the clipboard');
    const manual = () => { if (box) { box.focus(); box.select(); } UI.toast('Select the code and copy it (Ctrl+C)', 'warn'); };
    try { navigator.clipboard.writeText(this.exportCode).then(copied, manual); } catch (e) { manual(); }
  },
  importCode(text) {
    const result = decodeCustom(text, veteranUnlocked());
    if (!result.ok) { Sound.ui('bad'); UI.toast('Import failed: ' + result.error, 'err'); UI.say('Import failed. ' + result.error); return; }
    this.draft = result.value;
    this.tab = 'body';
    this.changed('Imported ' + this.draft.name + '. Save to keep it in slot ' + (this.slot + 1));
    UI.toast('Imported ' + this.draft.name + ' (not saved yet)');
  },
  pasteCode() {
    const box = $('crImport');
    const manual = () => { if (box) box.focus(); UI.toast('Paste the code into the box (Ctrl+V), then press Import', 'warn'); };
    try { navigator.clipboard.readText().then((t) => { if (box) box.value = t; this.importCode(t); }, manual); } catch (e) { manual(); }
  },
  fightPreview() {
    const checked = validateCustom(this.draft);
    if (!checked.ok) { Sound.ui('bad'); UI.toast('Fix this first: ' + checked.error, 'err'); return; }
    const sel = Game.selection;
    this.returnState = { origin: this.origin, slot: this.slot, draft: cloneCustom(this.draft), savedJson: this.savedJson, tab: this.tab, selection: Object.assign({}, sel) };
    ROSTER_BY_ID[PREVIEW_ID] = Object.assign(customProfile(checked.value, this.slot), { id: PREVIEW_ID });
    Showcase.endPreview();
    sel.mode = 'training'; sel.player = PREVIEW_ID; sel.opponent = 'kai'; sel.arena = 'dojo';
    if (Game.state === GS.MENU) Game.go(GS.CHARSEL);
    Game.startFromSelection();
  },
  /* Called when a fight preview ends: restore the draft and reopen the creator. */
  resumeAfterPreview() {
    const st = this.returnState;
    if (!st) return false;
    this.returnState = null;
    delete ROSTER_BY_ID[PREVIEW_ID];
    Object.assign(Game.selection, st.selection);
    this.origin = st.origin; this.slot = st.slot; this.draft = st.draft; this.savedJson = st.savedJson; this.tab = st.tab; this.confirm = null;
    UI.stack = [];
    UI.go('creator');
    this.refreshPreview();
    return true;
  },

  /* ----- input routing from UI ----- */
  act(name, arg) {
    const handlers = {
      crtab: () => this.switchTab(arg),
      crpose: () => this.cyclePose(),
      crrandom: () => this.randomize(),
      crreset: () => this.resetDraft(),
      crsave: () => this.save(),
      crfight: () => this.fightPreview(),
      crback: () => this.back(),
      crcol: () => { const [key, index] = arg.split('.'); this.setColor(key, COLOR_GROUP_BY_KEY[key].swatches[Number(index)]); },
      crharmony: () => this.harmonize(),
      crsuggest: () => this.applySuggestedBuild(),
      crnamerandom: () => { this.draft.name = NAME_IDEAS[Math.floor(Math.random() * NAME_IDEAS.length)]; this.changed('Name: ' + this.draft.name); },
      crslot: () => this.pickSlot(Number(arg)),
      crnew: () => this.newFighter(),
      crdup: () => this.duplicate(),
      crdel: () => this.deleteSlot(),
      crrename: () => { this.switchTab('identity'); const input = $('crName'); if (input) input.focus(); },
      crexport: () => this.exportDraft(),
      crimport: () => { const box = $('crImport'); this.importCode(box ? box.value : ''); },
      crpaste: () => this.pasteCode(),
      crcancel: () => this.closeConfirm(),
      crconfirm: () => this.runConfirm(Number(arg)),
    };
    const fn = handlers[name];
    if (fn) fn();
  },
  runConfirm(index) {
    const button = this.confirm && this.confirm.buttons[index];
    if (!button) return;
    if (button.run) button.run(); else this.act(button.act, '');
  },
  adjust(key, dir) {
    Sound.ui('move');
    const [kind, name, part] = key.split(':');
    if (kind === 'choice') this.cycleChoice(name, dir);
    else if (kind === 'col') this.cycleSwatch(name, dir);
    else if (kind === 'body') this.stepBody(name, dir);
    else if (kind === 'fine') this.fineStep(name, part, dir);
    else if (kind === 'finekey') this.cycleFineKey(dir);
    else if (kind === 'attr') this.stepAttr(name, dir);
    else if (kind === 'arch') this.setArchetype(dir);
    else if (kind === 'movestyle') this.setMoveStyle(dir);
    else if (kind === 'tier') this.toggleTier();
    else if (kind === 'title') this.setTitle(dir);
    else if (kind === 'nameidea') this.cycleNameIdea(dir);
    else if (kind === 'turn') { Showcase.turnPreview(dir * TURN_STEP); UI.say('Preview turned ' + (dir > 0 ? 'right' : 'left')); }
    else if (kind === 'pose') this.cyclePose();
  },
  cycleFineKey(dir) {
    const keys = LOOK_COLOR_KEYS.filter((k) => k !== 'skin');
    const i = keys.indexOf(this.fineKey);
    this.fineKey = keys[(i + dir + keys.length) % keys.length];
    UI.say('Fine tune: ' + COLOR_GROUP_BY_KEY[this.fineKey].label);
    UI.rerender(true);
  },
  switchTab(id) {
    if (!CREATOR_TABS.some((t) => t.id === id)) return;
    this.tab = id;
    this.exportCode = id === 'library' ? this.exportCode : '';
    UI.say(CREATOR_TABS.find((t) => t.id === id).label + ' tab');
    UI.rerender(false);
    const tab = UI.dom.screens.querySelector('[data-act="crtab:' + id + '"]');
    if (tab) tab.focus();
  },
  stepTab(dir) {
    const i = CREATOR_TABS.findIndex((t) => t.id === this.tab);
    Sound.ui('move');
    this.switchTab(CREATOR_TABS[(i + dir + CREATOR_TABS.length) % CREATOR_TABS.length].id);
  },
  /* Keys that only matter inside the creator. Returns true when handled. */
  onKey(e) {
    const el = document.activeElement;
    const typing = el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text'));
    if (typing) return this.onTypingKey(e, el);
    if (this.confirm) return false;
    const k = e.code;
    const onTab = el && el.classList && el.classList.contains('tab');
    if (onTab && (k === 'ArrowLeft' || k === 'KeyA')) { e.preventDefault(); this.stepTab(-1); return true; }
    if (onTab && (k === 'ArrowRight' || k === 'KeyD')) { e.preventDefault(); this.stepTab(1); return true; }
    if (k === 'KeyQ' || k === 'PageUp') { e.preventDefault(); this.stepTab(-1); return true; }
    if (k === 'KeyE' || k === 'PageDown') { e.preventDefault(); this.stepTab(1); return true; }
    if (k === 'BracketLeft' || k === 'Comma') { e.preventDefault(); Showcase.turnPreview(-TURN_STEP); return true; }
    if (k === 'BracketRight' || k === 'Period') { e.preventDefault(); Showcase.turnPreview(TURN_STEP); return true; }
    if (k === 'KeyT') { e.preventDefault(); this.cyclePose(); return true; }
    return false;
  },
  onTypingKey(e, el) {
    const k = e.code;
    if (k === 'Escape') { e.preventDefault(); el.blur(); UI.dom.screens.querySelector('[data-nav]').focus(); return true; }
    if (k === 'ArrowDown' || k === 'ArrowUp' || (k === 'Enter' && el.tagName === 'INPUT')) { e.preventDefault(); UI.moveFocus(k === 'ArrowUp' ? -1 : 1); return true; }
    return true;                                         // every other key types normally
  },
  onInput(e) {
    const el = e.target;
    if (UI.current !== 'creator' || !el.getAttribute) return;

  onNameInput(el) {
    const clean = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_MAX);

  onRange(key, value, el) {

      '<span>Damage dealt</span><span>' + x(st.damage) + '</span><span>Damage taken</span><span>' + x(st.taken) + '</span><span>Move speed</span><span>' + x(st.walk) + '</span>' +
      '<span>Attack startup</span><span>' + x(st.atkSpeed) + '</span><span>Reach</span><span>' + x(st.reach) + '</span><span>Hit-stun taken</span><span>' + x(st.stun) + '</span>' +
      '<span>Guard cost</span><span>' + x(st.guard) + '</span><span>Heavy-hit damage</span><span>' + x(st.impact) + '</span>' +
      '<span>Stamina regen</span><span>' + st.regen.toFixed(1) + ' / s</span><span>Knockdown time</span><span>' + x(st.getup) + '</span></div>';

      '<p class="hint">Names use A-Z and 0-9, up to ' + NAME_MAX + ' characters. Shown in the HUD, name tags and results.</p>';
  },
  tab_library() {
    let h = '<div class="cards">';
    for (let i = 0; i < CUSTOM_SLOTS; i++) {
      const c = CustomRoster.slots[i], editing = i === this.slot;
      const title = c ? esc(c.name) : 'Empty';
      const sub = c ? esc(TITLES[c.title]) + ' &middot; ' + ARCHETYPES[c.arch].label : (editing ? 'Editing (unsaved)' : 'Free slot');
      h += '<button class="card' + (editing ? ' sel' : '') + '" data-nav data-act="crslot:' + i + '" aria-pressed="' + editing + '"><b>Slot ' + (i + 1) + ': ' + title + '</b><em>' + sub + '</em>' + (c ? UI.statBars(c.attrs) : '') + '</button>';

      '<div class="row cr-actions"><button class="mi" data-nav data-act="crimport">Import into this slot</button><button class="mi" data-nav data-act="crpaste">Paste from clipboard</button></div>' +
      '<p class="hint">Codes stay on this device: nothing is uploaded. Imported fighters load as unsaved changes.</p>';
