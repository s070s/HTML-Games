    return h;
  },
  screen_results() {
    const d = Game.resultsData;
    if (!d) return '';
    if (d.mode === 'versus') return this.versusResults(d);
    const s0 = d.stats[0], s1 = d.stats[1];
    const mm = clockText;
    let sub = d.mode === 'arcade' ? 'Arcade &middot; stage ' + d.stage + ' of ' + d.stages + ' &middot; continues ' + d.continues : d.mode === 'survival' ? 'Survival &middot; defeated ' + (d.kills || 0) : d.mode === 'training' ? 'Training' : 'Free Fight';
    let h = '<section class="screen on center" style="background:rgba(0,0,0,.5)" aria-label="Results"><div class="panel"><div class="bigtxt">' + (d.playerWon ? 'Victory' : 'Defeat') + '</div><p class="sub">' + sub + ' &middot; ' + esc(d.player) + ' vs ' + esc(d.opponent) + '</p>';
    h += '<div class="statgrid"><span>Rounds won</span><span>' + d.wins[0] + ' - ' + d.wins[1] + '</span><span>Fight time</span><span>' + mm(d.seconds) + '</span><span>Damage dealt</span><span>' + Math.round(s0.damage) + '</span><span>Damage taken</span><span>' + Math.round(s0.taken) + '</span><span>Hits landed</span><span>' + s0.hits + '</span><span>Best combo</span><span>' + s0.maxCombo + ' hits</span><span>Blocks or sways (perfect)</span><span>' + s0.blocks + ' (' + s0.perfect + ')</span><span>Throws</span><span>' + s0.throws + '</span><span>Objects destroyed</span><span>' + s0.objects + '</span></div>';
    if (d.mode === 'survival') h += '<p>Survival time: <b>' + mm(d.survivalSeconds) + '</b> &middot; Opponents defeated: <b>' + d.kills + '</b>' + (d.ended ? ' &middot; Run over' : '') + ' &middot; Best: <b>' + Progress.d.survivalKills + '</b></p>';
    if (d.cleared) h += '<p><b>Arcade cleared!</b></p>';
    if (d.newBest) h += '<p class="newbest">NEW BEST!</p>';
    if (d.unlocked) h += '<p><b>Unlocked: ' + d.unlocked + '</b></p>';
    void s1;
    return h + this.resultsNav(d);
  },
  resultsNav(d) {
    const labels = { next: d.mode === 'arcade' ? 'Next opponent' : 'Next fight', retry: 'Retry this stage', again: d.mode === 'survival' ? 'New run' : d.cleared ? 'Play again' : 'Rematch', setup: 'Change fighters', menu: 'Main menu' };
    return '<nav>' + d.buttons.map((b, i) => '<button class="mi" data-nav ' + (i === 0 ? 'data-default ' : '') + 'data-act="res:' + b + '">' + labels[b] + '</button>').join('') + '</nav></div></section>';
  },
  /* Versus: the winner, the session score and both players' stats side by side. */
  versusResults(d) {
    const w = d.winner, names = [d.player, d.opponent], s = d.stats;
    const rows = [['Rounds won', d.wins[0], d.wins[1]], ['Damage dealt', Math.round(s[0].damage), Math.round(s[1].damage)], ['Hits landed', s[0].hits, s[1].hits],
      ['Best combo', s[0].maxCombo + ' hits', s[1].maxCombo + ' hits'], ['Blocks or sways (perfect)',s[0].blocks + ' (' + s[0].perfect + ')', s[1].blocks + ' (' + s[1].perfect + ')'],
      ['Throws', s[0].throws, s[1].throws], ['Objects destroyed', s[0].objects, s[1].objects]];
    let h = '<section class="screen on center" style="background:rgba(0,0,0,.5)" aria-label="Results"><div class="panel"><div class="bigtxt c' + (w + 1) + '">P' + (w + 1) + ' wins</div><p class="sub">Versus &middot; ' + esc(names[w]) + ' takes the match &middot; ' + clockText(d.seconds) + '</p>';
    h += '<p>Session score: <b class="c1">P1 ' + d.score[0] + '</b> - <b class="c2">' + d.score[1] + ' P2</b></p>';
    h += '<table class="ctl"><tr><th></th><th><span class="c1">P1 ' + esc(names[0]) + '</span></th><th><span class="c2">P2 ' + esc(names[1]) + '</span></th></tr>' + rows.map((r) => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + r[2] + '</td></tr>').join('') + '</table>';
    return h + this.resultsNav(d);
  },
  showFatal(msg) {
    const f = this.dom.fatal;
    f.hidden = false;
    this.dom.hud.hidden = true;
    f.innerHTML = '<div class="panel"><h2>Something went wrong</h2><p>' + esc(msg) + '</p><p class="hint">The match was stopped safely. You can return to the main menu. Details are in the diagnostics overlay (F3).</p>' + (Game.state === GS.ERROR && R.ok ? '<button class="mi" data-act="errmenu" id="errBtn">Return to main menu</button>' : '<p class="hint">Please try a current version of Chrome, Edge, Firefox or Safari with hardware acceleration enabled.</p>') + '</div>';
    const b = $('errBtn');
    if (b) { b.addEventListener('click', () => this.act('errmenu')); b.focus(); }
  },

  /* ----- gamepad menu navigation ----- */
  update() {
    this.frameCount++;
    const pauseShown = this.lastScreen === 'pause';   // a press that led back to the pause screen (Esc in Controls) must not also close it
    this.lastScreen = this.current;
    if (this.current === 'creator' && this.frameCount % 15 === 1) CreatorUI.measureFocus(); // panel size changes with layout
    if (this.padOverlay()) return;
    if (!this.current) return;
    if (Inputs.captureCallback) { this.padCancelCapture(); return; }
    const unpause = Inputs.take('pause');   // P / gamepad Start close the pause screen (Esc goes through onKey)
    if (unpause && this.current === 'pause' && pauseShown && performance.now() > this.guardUntil) { Game.resume(); return; }
    const pd = Inputs.menuDir, ph = Inputs.menuHeld, p = this.padPrev;
    const ok = !!(ph.menuOk), back = !!(ph.menuBack);
    if (pd.down && !p.down) this.moveFocus(1);
    if (pd.up && !p.up) this.moveFocus(-1);
    const el = document.activeElement;
    if (pd.right && !p.right) { if (el && el.classList.contains('opt')) this.adjust(el, 1); else if (el && el.classList.contains('card')) this.moveFocus(1); }
    if (pd.left && !p.left) { if (el && el.classList.contains('opt')) this.adjust(el, -1); else if (el && el.classList.contains('card')) this.moveFocus(-1); }
    if (ok && !p.ok && performance.now() > this.guardUntil) { if (el && el.classList.contains('opt')) this.adjust(el, 1); else if (el && el.tagName === 'BUTTON') el.click(); }
    if (back && !p.back && performance.now() > this.guardUntil) this.back();
    if (this.current === 'creator') this.creatorPad(ph, pd, p);
    p.up = pd.up; p.down = pd.down; p.left = pd.left; p.right = pd.right; p.ok = ok; p.back = back;
  },

  /* The error screen and the controls card sit above everything: pad confirm / back (rising edge) uses or closes them.
     Returns true while the error screen is up, so the hidden menu behind it gets no pad input. */
  padOverlay() {
    const fatal = this.fatalShown(), card = !this.dom.onboard.hidden;
    const ok = !!Inputs.menuHeld.menuOk, back = !!Inputs.menuHeld.menuBack, p = this.padPrev;
    const pressed = (ok && !p.ok) || (back && !p.back);
    if (fatal || card) { p.ok = ok; p.back = back; }
    if (!pressed) return fatal;
    if (fatal) { const errBtn = $('errBtn'); if (errBtn) errBtn.click(); } else if (card) this.hideOnboarding();
    return fatal;
  },
  /* A rebind waits for a keyboard key; the pad's back button cancels it so a pad-only player is never stuck. */
  padCancelCapture() {
    const back = !!Inputs.menuHeld.menuBack;
    if (back && !this.padPrev.back) { Inputs.capture(null); Sound.ui('back'); this.rerender(true); }
    this.padPrev.back = back;
  },

  /* Creator extras on a gamepad: L1 / R1 switch tabs, L2 / R2 turn the preview. */
  creatorPad(ph, pd, p) {
    const onTab = document.activeElement && document.activeElement.classList.contains('tab');
    if ((ph.menuL1 && !p.l1) || (onTab && pd.left && !p.left)) CreatorUI.stepTab(-1);
    if ((ph.menuR1 && !p.r1) || (onTab && pd.right && !p.right)) CreatorUI.stepTab(1);
    if (ph.menuL2) Showcase.turnPreview(-0.04);
    if (ph.menuR2) Showcase.turnPreview(0.04);
    p.l1 = !!ph.menuL1; p.r1 = !!ph.menuR1;
  },

  /* ----- HUD ----- */
  onHit(e) {
    const txt = (e.counter ? 'COUNTER ' : '') + Math.round(e.dmg);
    this.popAt(e.x, e.y + 0.1, e.z, txt, e.counter ? COUNTER_COLOR : e.def.index === 0 ? '#ff9a9a' : '#ffffff');
  },
  onBlock(e) {
    const t = e.broke ? 'GUARD BREAK!' : e.sway ? (e.perfect ? 'PERFECT SWAY!' : 'SWAY') : e.perfect ? 'PERFECT BLOCK!' : 'BLOCK';
    this.popAt(e.x, e.y + 0.1, e.z, t, e.broke ? '#ffb347' : '#9cf4ff');
  },
  popAt(x, y, z, text, color) {
    const p = this.pops[this.popIdx++ % this.pops.length];
    p.age = 0; p.life = 0.95; p.x = x; p.y = y; p.z = z;
    p.el.textContent = text;
    p.el.style.color = color;
    p.el.style.opacity = '1';
  },
  frame(m) {
    const d = this.dom;
    if (m && !d.hud.hidden) { this.hudUpdate(m); if (!d.touch.hidden) this.touchContextUpdate(m); }
    this.diagTick();
  },
  /* Final round, match point or a fighter close to a knock-out. */
  tenseMoment(m) {
    if (m.training) return false;
    const [a, b] = m.fighters;
    const matchPoint = m.round > 1 && (m.wins[0] === m.winsNeeded - 1 || m.wins[1] === m.winsNeeded - 1);
    const lowHp = Math.min(a.hp / a.maxHp, b.hp / b.maxHp) < TENSE_HP_FRACTION;
    return m.decider || matchPoint || lowHp;
  },
  hudUpdate(m) {
    const [a, b] = m.fighters;
    const dt = 1 / 60;
    const bar = (i, f) => {
      const frac = clamp(f.hp / f.maxHp, 0, 1);
      this.ghost[i] = frac >= this.ghost[i] ? frac : Math.max(frac, this.ghost[i] - dt * 0.35);
      this.setTransform('hp' + i, this.dom['hp' + (i + 1)], 'scaleX(' + frac.toFixed(3) + ')');
      this.setTransform('hg' + i, this.dom['hg' + (i + 1)], 'scaleX(' + this.ghost[i].toFixed(3) + ')');
      this.setText('ht' + i, this.dom['ht' + (i + 1)], Math.ceil(f.hp) + ' / ' + f.maxHp);
      this.setTransform('st' + i, this.dom['st' + (i + 1)], 'scaleX(' + clamp(f.stam / f.maxStam, 0, 1).toFixed(3) + ')');
      const low = f.lowStamina;
      if (this.cache['low' + i] !== low) { this.cache['low' + i] = low; this.dom['stb' + (i + 1)].classList.toggle('low', low); }
      // momentum: the gauge filling, then the running boost draining
      const boosted = f.boostTicks > 0;
      this.setTransform('mo' + i, this.dom['mo' + (i + 1)], 'scaleX(' + clamp(boosted ? f.boostTicks / BOOST_TICKS : f.momentum / MOMENTUM_MAX, 0, 1).toFixed(3) + ')');
      this.toggleOn('boost' + i, this.dom['mob' + (i + 1)], boosted);
    };
    bar(0, a); bar(1, b);
    Music.setIntensity(this.tenseMoment(m) ? MUSIC_TENSE : MUSIC_FIGHT);
    const tl = m.timeLeft;
    this.setText('timer', this.dom.timer, tl === null ? (m.training ? '' : '∞') : String(tl));
    const lowTime = tl !== null && tl <= TIMER_LOW_SECONDS;
    if (this.cache.lowTime !== lowTime) { this.cache.lowTime = lowTime; this.dom.timer.classList.toggle('low', lowTime); }
    const cfg = m.cfg;
    this.setText('round', this.dom.roundlbl, m.training ? 'TRAINING' : (m.decider ? 'FINAL ROUND' : 'ROUND ' + m.round));
    if (!m.training) {
      const pip = (w) => '●'.repeat(w) + '○'.repeat(Math.max(0, m.winsNeeded - w));
      this.setText('pips1', this.dom.pips1, pip(m.wins[0])); this.setText('pips2', this.dom.pips2, pip(m.wins[1]));
    } else { this.setText('pips1', this.dom.pips1, ''); this.setText('pips2', this.dom.pips2, ''); }
    let info = '';
    const run = Game.run;
    if (cfg.mode === 'arcade' && run) info = 'ARCADE · STAGE ' + (run.stage + 1) + ' / ' + run.ladder.length + ' · ' + DIFFICULTY[cfg.difficulty].label.toUpperCase();
    else if (cfg.mode === 'survival' && run) info = 'SURVIVAL · DEFEATED ' + run.kills + ' · ' + DIFFICULTY[cfg.difficulty].label.toUpperCase();
    else if (cfg.mode === 'free') info = m.def.name.toUpperCase() + ' · ' + DIFFICULTY[cfg.difficulty].label.toUpperCase();
    else if (m.versus) info = 'VERSUS · ' + m.def.name.toUpperCase() + (Game.versus ? ' · SESSION ' + Game.versus.score[0] + ' - ' + Game.versus.score[1] : '');
    else info = m.def.name.toUpperCase() + (Input.lastDevice === 'gamepad' ? ' · hold Select: reset · Start: training menu' : ' · Tab reset · F2 reset arena · 1-5 scenarios');
    this.setText('modeinfo', this.dom.modeinfo, info);
    // combo counters, low-stamina warnings and clinch hints: P1's always, P2's in Versus (on the right, with P2's controls)
    this.comboBox('combo', this.dom.combo, a, true);
    this.comboBox('combo2', this.dom.combo2, b, m.versus);
    this.toggleOn('warn', this.dom.warn, a.lowStamina && a.alive);
    this.toggleOn('warn2', this.dom.warn2, m.versus && b.lowStamina && b.alive);
    this.showHint('hint', this.dom.grappleHint, this.grappleHint(a));
    this.showHint('hint2', this.dom.grappleHint2, m.versus ? this.grappleHint(b) : '');
    // name tags + popups
    const out = [0, 0];
    for (let i = 0; i < 2; i++) {
      const f = m.fighters[i], el = this.tagEls[i];
      const ok = R.project(f.x, f.y + 2.15 * f.scale, f.z, out);
      let status = '';
      if (f.state === S.BLOCK_H || f.state === S.BLOCK_L) status = 'BLOCK';
      else if (f.state === S.SWAY) status = 'SWAY';
      else if (f.state === S.STUN) status = 'STUNNED';
      else if (f.state === S.CLINCH || f.state === S.GRAPPLE) status = 'CLINCH';
      else if (f.state === S.SUBMIT) status = 'HOLD';
      else if (f.state === S.DOWN) status = f.pinnedBy ? 'PINNED' : 'DOWN';
      else if (f.state === S.KO) status = 'K.O.';
      else if (f.lowStamina) status = 'TIRED';
      this.setHtml('tag' + i, el, (i === 0 ? '1P' : m.versus ? '2P' : m.training ? 'DUMMY' : 'CPU') + (status ? '<i>' + status + '</i>' : ''));
      el.style.display = ok ? '' : 'none';
      if (ok) this.setTransform('tagpos' + i, el, 'translate(' + Math.round(out[0]) + 'px,' + Math.round(out[1]) + 'px) translate(-50%,-100%)');
    }
    for (const p of this.pops) {
      if (p.age > p.life) continue;
      p.age += 1 / 60;
      const u = p.age / p.life;
      if (u >= 1) { p.el.style.opacity = '0'; continue; }
      if (R.project(p.x, p.y + u * 0.6, p.z, out)) p.el.style.transform = 'translate(' + Math.round(out[0]) + 'px,' + Math.round(out[1]) + 'px) translate(-50%,-50%) scale(' + (1 + (1 - u) * 0.25).toFixed(2) + ')';
      p.el.style.opacity = String(u < 0.7 ? 1 : (1 - u) / 0.3);
    }
    if (m.training) this.trainingPanel(m);
  },
  comboBox(key, el, f, allowed) {
    const show = allowed && f.comboShow > 0 && f.comboHits >= 2;
    this.toggleOn(key, el, show);
    if (show) this.setHtml(key + 'txt', el, f.comboHits + ' HITS<small>' + Math.round(f.comboDamage) + ' DAMAGE</small>');
  },
  toggleOn(key, el, on) { if (this.cache[key] !== on) { this.cache[key] = on; el.classList.toggle('on', on); } },
  showHint(key, el, hint) {
    if (this.cache[key] === hint) return;
    this.cache[key] = hint;
    el.hidden = !hint; el.textContent = hint;
    el.classList.toggle('go', hint.startsWith('ESCAPE'));
  },
  /* The clinch instructions appear in the first clinch with a human player in it, and never again (saved). */
  firstClinchTip(e) {
    const m = Game.match;
    this.tipClinch = null;
    if (!m || !m.fighters.includes(e.att) || Progress.d.seenClinch) return;   // simulations outside the live match never count
    const human = [e.att, e.def].some((f) => m.controllers[f.index] === PlayerController || m.controllers[f.index] === Player2Controller);
    if (!human) return;
    this.tipClinch = e;
    Progress.d.seenClinch = true;
    Progress.save();
  },
  /* Clinch hint for a human player's fighter during the first clinch: escape timing while held, throw aim while holding. */
  /* The hold instructions likewise appear in the first submission hold with a human player in it, and never again (saved). */
  firstHoldTip(e) {
    const m = Game.match;
    this.tipHold = null;
    if (!m || !m.fighters.includes(e.att) || Progress.d.seenHold) return;
    const human = [e.att, e.def].some((f) => m.controllers[f.index] === PlayerController || m.controllers[f.index] === Player2Controller);
    if (!human) return;
    this.tipHold = e;
    Progress.d.seenHold = true;
    Progress.save();
  },
  grappleHint(f) {
    const hold = this.tipHold;
    if (hold && hold.att === f && f.state === S.SUBMIT && f.partner === hold.def) return 'HOLD · tap ' + this.keyName('grapple', f.index) + ' to keep it tight';
    if (hold && hold.def === f && f.pinnedBy === hold.att) return 'ESCAPE! Tap ' + this.keyName('defend', f.index) + ' fast';
    const tip = this.tipClinch;
    if (!tip || (tip.att !== f && tip.def !== f)) return '';
    if (f.state === S.CLINCH) return this.clinchHint(f);
    if (f.state === S.GRAPPLE) return this.throwHint(f);
    return '';
  },
  /* Held player: wait while an escape would fail, then the call to press (a press in the last moments is kept). */
  clinchHint(f) {
    const windowOpen = f.clinchTick >= escapeStartFor(f) - ESCAPE_GRACE_TICKS;
    // stamina does not regenerate while held, so a tired fighter cannot escape this clinch at all
    if (windowOpen && f.stam < ESCAPE_STAMINA) return 'TOO TIRED TO ESCAPE (' + GRIP_LABEL[f.grip] + ') · brace for the throw';
    if (f.escapeLock > 0) return 'TOO EARLY! ' + GRIP_LABEL[f.grip] + ' · wait for ESCAPE NOW';
    if (windowOpen) return 'ESCAPE NOW! Press ' + this.keyName('grapple', f.index);
    return 'CLINCHED (' + GRIP_LABEL[f.grip] + ') · HOLD... an early escape fails';
  },
  /* Clinch hint: grip, the throw the held direction will do and an on-screen arrow for it. */
  throwHint(f) {
    if (f.throwPending) return f.throwPending.data.name.toUpperCase() + '!';
    const data = throwFor(f.grip, f.throwAim), strikesLeft = CLINCH_STRIKE_MAX - f.clinchStrikes;
    const strikeKeys = this.keyName('punch', f.index) + ' elbow / ' + this.keyName('kick', f.index) + ' knee';
    const strikes = strikesLeft > 0 ? ', ' + strikeKeys + ' (' + strikesLeft + ' left)' : '';
    return GRIP_LABEL[f.grip] + ' · ' + this.screenArrow(f, f.throwAim) + ' ' + data.name.toUpperCase() + ' · hold a direction to aim, ' + this.keyName('grapple', f.index) + ' throws' + strikes;
  },
  /* Arrow for a fighter-relative direction as it appears on screen. */
  screenArrow(f, dir) {
    const v = Combat.throwVector(f, dir), wx = v[0], wz = v[1];
    const right = wx * Camera.dirRight[0] + wz * Camera.dirRight[1], up = wx * Camera.dirFwd[0] + wz * Camera.dirFwd[1];
    if (Math.abs(right) > Math.abs(up)) return right > 0 ? '→' : '←';
    return up > 0 ? '↑' : '↓';
  },
  trainingPanel(m) {
    const lm = m.lastMove;
    let h = '<b>FRAME DATA</b> (60 fps)<br>';
    if (lm && lm.mv) {
      const adv = (n) => (n > 0 ? '+' : '') + n;
      h += esc(lm.mv.name) + '<br>Startup ' + lm.startup + 'f &middot; Active ' + lm.active + 'f &middot; Recovery ' + lm.recovery + 'f<br>Result: ' + lm.result + (lm.adv ? '<br>Advantage: hit ' + adv(lm.adv.onHit) + ' / block ' + adv(lm.adv.onBlock) : '') + '<br>Damage: ' + (lm.dmg ? lm.dmg.toFixed(1) : '-');
    } else h += 'Perform a move';
    const a = m.fighters[0];
    h += '<br><b>COMBO</b> ' + a.comboHits + ' hits / ' + Math.round(a.comboDamage) + ' dmg<br><b>Dummy:</b> ' + dummyLabel(m);
    h += '<br><b>Objects:</b> ' + (() => { const c = Arena.statusCounts(); return c.intact + ' intact, ' + c.damaged + ' damaged, ' + c.destroyed + ' destroyed'; })();
    this.setHtml('train', this.dom.training, h);
  },

  /* ----- touch controls ----- */
  buildTouch() {
    const root = this.dom.touch;
    const stick = document.createElement('div');
    stick.id = 'stickBase';
    stick.innerHTML = '<div id="stickKnob"></div>';
    root.appendChild(stick);
    const knob = stick.firstChild;
    let activeId = null;
    const move = (e) => {
      const r = stick.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2, rad = r.width / 2;
      let x = (e.clientX - cx) / rad, y = (e.clientY - cy) / rad;
      const m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
      const dead = 0.15;
      Input.touchStickSet(m < dead ? 0 : x, m < dead ? 0 : y, m >= dead);
      knob.style.transform = 'translate(' + x * rad * 0.55 + 'px,' + y * rad * 0.55 + 'px)';
    };
    const end = () => { activeId = null; Input.touchStickSet(0, 0, false); knob.style.transform = ''; };
    // one finger steers; a second finger landing on the stick is ignored, and only the steering finger's release ends it
    const endOwn = (e) => { if (e.pointerId === activeId) end(); };
    stick.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (activeId !== null) return;
      activeId = e.pointerId;
      try { stick.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
      move(e);
    });
    stick.addEventListener('pointermove', (e) => { if (e.pointerId === activeId) move(e); });
    stick.addEventListener('pointerup', endOwn);
    stick.addEventListener('pointercancel', endOwn);
    stick.addEventListener('lostpointercapture', endOwn);
    Events.on('inputReleased', () => { if (activeId !== null) end(); });
    const layout = document.createElement('style');
    layout.textContent = touchLayoutCss();
    document.head.appendChild(layout);
    const ariaLabels = { punch: 'Punch (with Duck: low punch)', kick: 'Kick (with Duck: low kick)', defend: 'Defend (with Duck: low guard)' };
    for (const [action, label, size] of TOUCH_BUTTONS) {
      const b = document.createElement('div');
      b.className = 'tb' + (size ? ' ' + size : '');
      b.setAttribute('data-a', action);
      b.setAttribute('role', 'button');
      b.setAttribute('aria-label', ariaLabels[action] || ACTION_LABELS[action]);
      b.textContent = label;
      const ids = new Set();
      const set = (down, id) => {
        if (down) ids.add(id); else ids.delete(id);
        const on = ids.size > 0;
        b.classList.toggle('on', on);
        Input.touchSet(action, on);
      };
      b.addEventListener('pointerdown', (e) => {
        try { b.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
        set(true, e.pointerId); e.preventDefault();
      });
      const up = (e) => { if (ids.has(e.pointerId)) set(false, e.pointerId); };
      b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
      // released by the game (page hidden, blur): forget fingers whose pointerup may never arrive, so the button cannot stick
      Events.on('inputReleased', () => { if (!ids.size) return; ids.clear(); b.classList.remove('on'); });
      // a context button that hides while a finger is on it must let go of its action (the finger's pointerup no longer arrives)
      // only a button with a finger on it lets go: touchSet would also mark a keyboard or pad player as a touch player
      this.touchButtons[action] = { el: b, release: () => { if (!ids.size) return; ids.clear(); b.classList.remove('on'); Input.touchSet(action, false); } };
      b.hidden = TOUCH_CONTEXT_ACTIONS.includes(action);   // USE and LOCK start hidden and keep their reserved slot when they show
      root.appendChild(b);
    }
  },
  /* USE and LOCK show only when they can do something (touchUseVisible / touchLockVisible); a hidden button has no pointer events and no tab stop. */
  touchContextUpdate(m) {
    const me = m.fighters[0];   // touch plays P1
    this.showTouchButton('use', touchUseVisible(me, m));
    this.showTouchButton('lock', touchLockVisible(me, m));
  },
  showTouchButton(action, shown) {
    const button = this.touchButtons[action];
    if (!button || button.el.hidden === !shown) return;
    button.el.hidden = !shown;
    if (!shown) button.release();
  },
  touchWanted() {
    const mode = Settings.v.touch;
    return mode === 'on' || (mode === 'auto' && Device.touch);
  },
  /* True when a touch drag on node should scroll: a form control, or something on the way up that overflows and scrolls. */
  touchScrolls(node) {
    let el = node && node.nodeType === 1 ? node : node && node.parentElement;
    for (; el && el !== document.body; el = el.parentElement) {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
      const overflows = el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
      if (!overflows) continue;
      const st = getComputedStyle(el);
      if (/auto|scroll/.test(st.overflowY + st.overflowX)) return true;
    }
    return false;
  },
  applyTouchVisibility() {
    const want = this.touchWanted();
    const inMatch = [GS.COUNTDOWN, GS.FIGHT].includes(Game.state);
    this.dom.touch.hidden = !(want && inMatch);
    if (this.dom.pauseBtn) this.dom.pauseBtn.hidden = want;
    if (want && inMatch && Input.lastDevice === 'keyboard' && !Input.kb.size) Input.lastDevice = 'touch';   // hints name the on-screen buttons from the first fight
  },

  /* ----- diagnostics ----- */
  toggleDiag() { Settings.set('showStats', !Settings.v.showStats); this.dom.diag.hidden = !Settings.v.showStats; },
  diagTick() {
    const el = this.dom.diag;
    const on = Settings.v.showStats || Diag.forceOverlay;
    if (el.hidden === on) el.hidden = !on;
    if (!on) return;
    const now = performance.now();
    if (now - (this.diagAt || 0) < 250) return;
    this.diagAt = now;
    const m = Game.match, st = R.stats;
    const mem = performance.memory ? ' mem ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + 'MB' : '';
    el.textContent = 'BREAKPOINT ' + VERSION + ' | state ' + Game.state + '\n' +
      'fps ' + (1000 / Math.max(1, Diag.frameMs)).toFixed(0) + ' frame ' + Diag.frameMs.toFixed(1) + 'ms p50 ' + Diag.framePercentile(0.5).toFixed(1) + ' p95 ' + Diag.framePercentile(0.95).toFixed(1) + ' sim ' + Diag.simMs.toFixed(2) + 'ms capped ' + Diag.cappedSteps + mem + '\n' +
      'draws ' + st.draws + ' inst ' + st.instances + ' culled ' + st.culled + ' res ' + R.width + 'x' + R.height + ' q ' + Quality.level + ' s' + R.scale.toFixed(2) + ' gpu ' + GPU.tier + ' msaa ' + (R.antialias ? 'on' : 'off') + '\n' +
      'particles ' + FX.active + ' debris ' + Debris.active + ' voices ' + Sound.voices + ' audio ' + (Sound.ctx ? Sound.ctx.state : 'none') + '\n' +
      'illegal transitions ' + Diag.illegalTransitions + ' errors ' + Diag.errors + ' listeners ' + Events.count() + ' storage ' + (Store.ok ? 'ok' : 'memory') + '\n' +
      'pad ' + Inputs.players.map((p) => (p.padInfo.connected ? p.padInfo.name.slice(0, 30) : 'none')).join(' / ') + ' startup ' + Diag.startupMs.toFixed(0) + 'ms\n' +
      (m ? 'tick ' + m.tick + ' hitstop ' + m.hitStop + ' P1 ' + m.fighters[0].state + ' P2 ' + m.fighters[1].state + '\n' : '') +
      Diag.logs.slice(-5).join('\n');
  },
};

/* =====================================================================
   09b CREATOR UI - "Create Fighter": tabs, live 3D preview, save slots, share codes, fight preview.
   Rules and validation live in 05d; this module edits a draft record and renders it.
   ===================================================================== */
const CREATOR_TABS = [
  { id: 'body', label: 'Body' }, { id: 'head', label: 'Head' }, { id: 'outfit', label: 'Outfit' },
  { id: 'style', label: 'Style' }, { id: 'identity', label: 'Identity' }, { id: 'library', label: 'Slots' },
];
const PREVIEW_POSES = ['guard', 'punch', 'kick', 'victory'];
const POSE_LABELS = { guard: 'Guard', punch: 'Punch', kick: 'Kick', victory: 'Victory' };
const ATTR_LABELS = { health: 'Health', stamina: 'Stamina', strength: 'Strength', speed: 'Speed', reach: 'Reach', defense: 'Defense', balance: 'Balance', recovery: 'Recovery' };
const TURN_STEP = Math.PI / 6;
const HUE_STEP = 6;
const LIGHT_STEP = 0.03;
const BASE_HEIGHT_CM = 178;
const PREVIEW_ID = 'preview';            // temporary roster id used by "Fight preview"
const FINE_RANGES = { skin: { hueMin: 5, hueMax: 50, lightMin: 0.15, lightMax: 0.88 }, other: { hueMin: 0, hueMax: 359, lightMin: 0.08, lightMax: 0.92 } };

const CreatorUI = {
  draft: null, slot: 0, savedJson: '', tab: 'body', origin: 'main', confirm: null, fineKey: 'top', harmony: 0, randomCount: 0,
  exportCode: '', returnState: null, drag: null,

  init() {
    const root = UI.dom.screens;
    root.addEventListener('input', (e) => this.onInput(e));
    root.addEventListener('change', (e) => this.onChange(e));
    root.addEventListener('pointerdown', (e) => this.onPointerDown(e));
    root.addEventListener('pointermove', (e) => this.onPointerMove(e));
    root.addEventListener('pointerup', () => { this.drag = null; });
    root.addEventListener('pointercancel', () => { this.drag = null; });
  },

  /* ----- opening, closing, dirty tracking ----- */
  open(origin) {
    this.origin = origin;
    this.confirm = null;
    this.exportCode = '';
    const free = CustomRoster.firstFree();
    if (free >= 0) this.startNew(free, 'body');
    else { this.load(0); this.tab = 'library'; UI.toast('All ' + CUSTOM_SLOTS + ' slots are in use: edit one or delete a fighter first', 'warn'); }
    UI.push('creator');
    this.refreshPreview();
  },
  openSlot(origin, slot) {
    this.origin = origin;
    this.confirm = null;
    this.load(slot);
    this.tab = 'body';
    UI.push('creator');
    this.refreshPreview();
  },
  startNew(slot, tab) {
    this.slot = slot;
    this.draft = defaultCustom(slot);
    this.savedJson = JSON.stringify(this.draft);       // an untouched new fighter has nothing to lose
    this.tab = tab;
  },
  load(slot) {
    this.slot = slot;
    const stored = CustomRoster.slots[slot];
    this.draft = stored ? cloneCustom(stored) : defaultCustom(slot);
    this.savedJson = JSON.stringify(this.draft);
  },
  isDirty() { return JSON.stringify(this.draft) !== this.savedJson; },
  ask(text, buttons) { this.confirm = { text, buttons }; UI.rerender(false); },
  closeConfirm() { this.confirm = null; UI.rerender(false); },
  /* Run fn now, or after the player agrees to drop unsaved changes. */
  guardUnsaved(fn) {
    if (!this.isDirty()) { fn(); return; }
    this.ask('You have unsaved changes. Discard them?', [
      { label: 'Keep editing', act: 'crcancel' },
      { label: 'Discard changes', run: fn },
    ]);
  },
  back() {
    if (this.confirm) { Sound.ui('back'); this.closeConfirm(); return; }
    Sound.ui('back');
    this.guardUnsaved(() => this.exit());
  },
  exit() {
    this.confirm = null;
    Showcase.endPreview();
    if (this.origin === 'char') {
      if (Game.state === GS.MENU) Game.go(GS.CHARSEL);   // a Fight preview ended in MENU; character select must be live again to start a match
      UI.showPick(); UI.go('char'); return;
    }
    UI.menuScene('warehouse', 'kai', UI.showcaseOpponent(), false);
    UI.go('main');
  },

  /* ----- preview ----- */
  /* Tell the preview camera where the free screen area is (beside the panel in landscape, above it in portrait). */
  measureFocus() {
    const panel = document.querySelector('.panel.cr');
    if (!panel) return;
    const r = panel.getBoundingClientRect(), w = window.innerWidth, h = window.innerHeight;
    const panelBelow = r.top > h * 0.2;
    const cx = panelBelow ? w / 2 : r.left / 2, cy = panelBelow ? r.top * 0.56 : h / 2;   // slightly low: the camera looks down a little
    Showcase.previewFocus[0] = clamp(cx / w * 2 - 1, -0.9, 0.9);
    Showcase.previewFocus[1] = clamp(1 - cy / h * 2, -0.9, 0.9);
    Showcase.previewFreeHeight = clamp((panelBelow ? r.top : h) / h, 0.25, 1);
  },
  refreshPreview() { Showcase.showPreview(customProfile(this.draft, this.slot)); },
  cyclePose() {
    const i = PREVIEW_POSES.indexOf(Showcase.previewPose);
    Showcase.setPreviewPose(PREVIEW_POSES[(i + 1) % PREVIEW_POSES.length]);
    UI.say('Preview pose: ' + POSE_LABELS[Showcase.previewPose]);
    UI.rerender(true);
  },
  onPointerDown(e) {
    if (UI.current !== 'creator' || !e.target.classList || !e.target.classList.contains('creator')) return;
    this.drag = { id: e.pointerId, x: e.clientX };
    try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* capture is optional */ }
  },
  onPointerMove(e) {
    if (!this.drag || e.pointerId !== this.drag.id) return;
    Showcase.turnPreview((e.clientX - this.drag.x) * 0.012);
    this.drag.x = e.clientX;
  },

  /* ----- edits ----- */
  changed(message) {
    this.refreshPreview();
    if (message) UI.say(message);
    UI.rerender(true);
  },
  setLook(key, value) {
    this.draft.look[key] = value;
    const choice = LOOK_CHOICES[key];
    this.changed(choice ? choice.label + ': ' + choice.labels[value] : '');
  },
  cycleChoice(key, dir) {
    const options = LOOK_CHOICES[key].options;
    const i = options.indexOf(this.draft.look[key]);
    this.setLook(key, options[(i + dir + options.length) % options.length]);
  },
  cycleSwatch(key, dir) {
    const swatches = COLOR_GROUP_BY_KEY[key].swatches;
    const i = swatches.indexOf(this.draft.look[key]);
    const next = i < 0 ? 0 : (i + dir + swatches.length) % swatches.length;
    this.setColor(key, swatches[next]);
  },
  setColor(key, hex) {
    this.draft.look[key] = hex;
    this.fineKey = key === 'skin' ? this.fineKey : key;
    const group = COLOR_GROUP_BY_KEY[key];
    const index = group.swatches.indexOf(hex);
    this.changed(group.label + ': ' + (index >= 0 ? 'swatch ' + (index + 1) + ' of ' + group.swatches.length : 'custom'));
  },
  stepBody(key, dir) {
    const look = this.draft.look;
    if (key === 'scale') look.scale = snapToStep(look.scale + dir * SCALE_STEP, SCALE_MIN, SCALE_MAX, SCALE_STEP);
    else look.build = snapToStep(look.build + dir * BUILD_STEP, BUILD_MIN, BUILD_MAX, BUILD_STEP);
    this.changed(key === 'scale' ? 'Height ' + this.heightText() : 'Build ' + this.buildText());
  },
  fineStep(key, part, dir) {
    const hex = this.draft.look[key];
    const hsl = hexToHsl(hex);
    const range = key === 'skin' ? FINE_RANGES.skin : FINE_RANGES.other;
    if (part === 'hue') { hsl.h = clamp(hsl.h + dir * HUE_STEP, range.hueMin, range.hueMax); if (hsl.s < 0.05) hsl.s = 0.5; }
    else hsl.l = clamp(hsl.l + dir * LIGHT_STEP, range.lightMin, range.lightMax);
    this.draft.look[key] = hslToHex(hsl.h, hsl.s, hsl.l);
    this.changed(COLOR_GROUP_BY_KEY[key].label + (part === 'hue' ? ' hue ' + Math.round(hsl.h) : ' lightness ' + Math.round(hsl.l * 100) + '%'));
  },
  fineSet(key, part, value) {
    const hsl = hexToHsl(this.draft.look[key]);
    if (part === 'hue') { hsl.h = value; if (hsl.s < 0.05) hsl.s = 0.5; } else hsl.l = value;
    this.draft.look[key] = hslToHex(hsl.h, hsl.s, hsl.l);
    this.refreshPreview();
  },
  budget() { return budgetForTier(this.draft.tier); },
  stepAttr(key, dir) {
    const attrs = this.draft.attrs, next = attrs[key] + dir;
    if (canSetAttr(attrs, key, next, this.budget())) {
      attrs[key] = next;
      this.changed(ATTR_LABELS[key] + ' ' + next + '. ' + (this.budget() - attrTotal(attrs)) + ' points left');
      return;
    }
    Sound.ui('bad');
    const reason = next > ATTR_MAX ? 'Maximum is ' + ATTR_MAX : next < ATTR_MIN ? 'Minimum is ' + ATTR_MIN : 'No points left. Lower another attribute first';
    UI.say(reason);
    UI.toast(reason, 'warn');
  },
  setArchetype(dir) {
    const i = ARCHETYPE_IDS.indexOf(this.draft.arch);
    this.draft.arch = ARCHETYPE_IDS[(i + dir + ARCHETYPE_IDS.length) % ARCHETYPE_IDS.length];
    const a = ARCHETYPES[this.draft.arch];
    this.draft.moveStyle = ARCHETYPE_MOVE_STYLE[this.draft.arch];
    this.draft.defense = defaultDefense(this.draft.moveStyle);   // a new style brings its default defense; the Defense row can override it
    this.changed('Fighting style: ' + a.label + '. ' + a.desc + ' Movement: ' + MOVE_STYLE[this.draft.moveStyle].label + '. Defense: ' + DEFENSE_LABEL[this.draft.defense] + '.');
  },
  setMoveStyle(dir) {
    const i = MOVE_STYLE_IDS.indexOf(this.draft.moveStyle);
    this.draft.moveStyle = MOVE_STYLE_IDS[(i + dir + MOVE_STYLE_IDS.length) % MOVE_STYLE_IDS.length];
    this.draft.defense = defaultDefense(this.draft.moveStyle);
    const style = MOVE_STYLE[this.draft.moveStyle];
    this.changed('Movement: ' + style.label + '. ' + style.desc + ' Defense: ' + DEFENSE_LABEL[this.draft.defense] + '.');
  },
  setDefense() {
    this.draft.defense = this.draft.defense === 'block' ? 'sway' : 'block';   // exactly one of two
    this.changed('Defense: ' + DEFENSE_LABEL[this.draft.defense] + '. ' + DEFENSE_HELP[this.draft.defense]);
  },
  applySuggestedBuild() {
    this.draft.attrs = Object.assign({}, ARCHETYPES[this.draft.arch].attrs);
    this.changed('Suggested ' + ARCHETYPES[this.draft.arch].label + ' build applied');
  },
  toggleTier() {
    const next = this.draft.tier === 'standard' ? 'veteran' : 'standard';
    if (next === 'veteran' && !veteranUnlocked()) { Sound.ui('bad'); UI.toast('Veteran tier unlocks after clearing Arcade', 'warn'); UI.say('Veteran tier is locked'); return; }
    this.draft.tier = next;
    trimToBudget(this.draft.attrs, this.budget());
    this.changed('Tier: ' + (next === 'veteran' ? 'Veteran, ' : 'Standard, ') + this.budget() + ' points');
  },
  setTitle(dir) {
    this.draft.title = (this.draft.title + dir + TITLES.length) % TITLES.length;
    this.changed('Title: ' + TITLES[this.draft.title]);
  },
  cycleNameIdea(dir) {
    const i = NAME_IDEAS.indexOf(this.draft.name);
    this.draft.name = NAME_IDEAS[i < 0 ? 0 : (i + dir + NAME_IDEAS.length) % NAME_IDEAS.length];
    this.changed('Name: ' + this.draft.name);
  },
  randomize() {
    this.randomCount++;
    const seed = (Date.now() + this.randomCount * 7919) >>> 0;
    const keepName = this.draft.name;
    this.draft = randomCustom(seed);
    if (keepName) this.draft.name = keepName;          // a typed name survives; everything else is rolled
    this.changed('Randomized with seed ' + seed);
  },
  harmonize() {
    const scheme = harmonize(this.draft.look, this.harmony++);
    this.changed('Auto-harmony: ' + scheme + ' colours');
  },
  resetDraft() {
    const run = () => { this.load(this.slot); this.confirm = null; this.changed('Reset to the last saved version'); };
    if (!this.isDirty()) { run(); return; }
    this.ask('Reset all changes since the last save?', [{ label: 'Cancel', act: 'crcancel' }, { label: 'Reset', run }]);
  },

  /* ----- saving and slots ----- */
  save() {
    const result = CustomRoster.put(this.slot, this.draft);
    if (!result.ok) { Sound.ui('bad'); UI.toast('Cannot save: ' + result.error, 'err'); UI.say('Cannot save. ' + result.error); return false; }
    this.draft = cloneCustom(result.value);
    this.savedJson = JSON.stringify(result.value);
    if (this.origin === 'char') Game.selection[UI.pickKey()] = CUSTOM_IDS[this.slot];   // the side being picked (P2 in Versus)
    UI.toast('Saved ' + this.draft.name + ' to slot ' + (this.slot + 1));
    UI.rerender(true);
    return true;
  },
  pickSlot(slot) {
    if (slot === this.slot) return;
    this.guardUnsaved(() => {
      this.confirm = null;
      if (CustomRoster.slots[slot]) this.load(slot); else this.startNew(slot, 'library');
      this.exportCode = '';
      this.changed('Slot ' + (slot + 1) + ': ' + (CustomRoster.slots[slot] ? CustomRoster.slots[slot].name : 'empty, new fighter'));
    });
  },
  newFighter() {
    const free = CustomRoster.firstFree();
    if (free < 0) { Sound.ui('bad'); UI.toast('All slots are in use. Delete a fighter first.', 'warn'); return; }
    this.guardUnsaved(() => { this.confirm = null; this.startNew(free, 'body'); this.changed('New fighter in slot ' + (free + 1)); });
  },
  duplicate() {
    const free = CustomRoster.firstFree();
    if (free < 0) { Sound.ui('bad'); UI.toast('No free slot to duplicate into', 'warn'); return; }
    const copy = cloneCustom(this.draft);
    copy.name = (copy.name.slice(0, NAME_MAX - 1) || 'COPY') + '2';
    const result = CustomRoster.put(free, copy);
    if (!result.ok) { Sound.ui('bad'); UI.toast('Cannot duplicate: ' + result.error, 'err'); return; }
    UI.toast('Copied to slot ' + (free + 1) + ' as ' + copy.name);
    UI.rerender(true);
  },
  deleteSlot() {
    if (!CustomRoster.slots[this.slot]) { Sound.ui('bad'); UI.toast('This slot is not saved yet', 'warn'); return; }
    const name = CustomRoster.slots[this.slot].name;
    this.ask('Delete ' + name + ' from slot ' + (this.slot + 1) + '? This cannot be undone.', [
      { label: 'Cancel', act: 'crcancel' },
      { label: 'Delete', run: () => { CustomRoster.remove(this.slot); this.startNew(this.slot, 'library'); this.confirm = null; this.changed(name + ' deleted'); } },
    ]);
  },
  exportDraft() {
    const checked = validateCustom(this.draft);
    if (!checked.ok) { Sound.ui('bad'); UI.toast('Fix this first: ' + checked.error, 'err'); return; }
    this.exportCode = encodeCustom(checked.value);
    UI.rerender(true);
    const box = $('crExport');
    const copied = () => UI.toast('Fighter code copied to the clipboard');
    const manual = () => { if (box) { box.focus(); box.select(); } UI.toast('Select the code and copy it (Ctrl+C)', 'warn'); };
    try { navigator.clipboard.writeText(this.exportCode).then(copied, manual); } catch (e) { manual(); }
  },
  importCode(text) {
    const result = decodeCustom(text, veteranUnlocked());
    if (!result.ok) { Sound.ui('bad'); UI.toast('Import failed: ' + result.error, 'err'); UI.say('Import failed. ' + result.error); return; }
    this.guardUnsaved(() => {
      this.confirm = null;
      this.draft = result.value;
      this.tab = 'body';
      this.changed('Imported ' + this.draft.name + '. Save to keep it in slot ' + (this.slot + 1));
      UI.toast('Imported ' + this.draft.name + ' (not saved yet)');
    });
  },
  pasteCode() {
    const box = $('crImport');
    const manual = () => { if (box) box.focus(); UI.toast('Paste the code into the box (Ctrl+V), then press Import', 'warn'); };
    try { navigator.clipboard.readText().then((t) => { if (box) box.value = t; this.importCode(t); }, manual); } catch (e) { manual(); }
  },
  fightPreview() {
    const checked = validateCustom(this.draft);
    if (!checked.ok) { Sound.ui('bad'); UI.toast('Fix this first: ' + checked.error, 'err'); return; }
    const sel = Game.selection;
    this.returnState = { origin: this.origin, slot: this.slot, draft: cloneCustom(this.draft), savedJson: this.savedJson, tab: this.tab, selection: Object.assign({}, sel) };
    ROSTER_BY_ID[PREVIEW_ID] = Object.assign(customProfile(checked.value, this.slot), { id: PREVIEW_ID });
    Showcase.endPreview();
    sel.mode = 'training'; sel.player = PREVIEW_ID; sel.opponent = 'kai'; sel.arena = 'dojo';
    if (Game.state === GS.MENU) Game.go(GS.CHARSEL);
    Game.startFromSelection();
  },
  /* Called when a fight preview ends: restore the draft and reopen the creator. */
  resumeAfterPreview() {
    const st = this.returnState;
    if (!st) return false;
    this.returnState = null;
    delete ROSTER_BY_ID[PREVIEW_ID];
    Object.assign(Game.selection, st.selection);
    this.origin = st.origin; this.slot = st.slot; this.draft = st.draft; this.savedJson = st.savedJson; this.tab = st.tab; this.confirm = null;
    UI.stack = [];
    UI.go('creator');
    this.refreshPreview();
    return true;
  },

  /* ----- input routing from UI ----- */
  act(name, arg) {
    const handlers = {
      crtab: () => this.switchTab(arg),
      crpose: () => this.cyclePose(),
      crrandom: () => this.randomize(),
      crreset: () => this.resetDraft(),
      crsave: () => this.save(),
      crfight: () => this.fightPreview(),
      crback: () => this.back(),
      crcol: () => { const [key, index] = arg.split('.'); this.setColor(key, COLOR_GROUP_BY_KEY[key].swatches[Number(index)]); },
      crharmony: () => this.harmonize(),
      crsuggest: () => this.applySuggestedBuild(),
      crnamerandom: () => { this.draft.name = NAME_IDEAS[Math.floor(Math.random() * NAME_IDEAS.length)]; this.changed('Name: ' + this.draft.name); },
      crslot: () => this.pickSlot(Number(arg)),
      crnew: () => this.newFighter(),
      crdup: () => this.duplicate(),
      crdel: () => this.deleteSlot(),
      crrename: () => { this.switchTab('identity'); const input = $('crName'); if (input) input.focus(); },
      crexport: () => this.exportDraft(),
      crimport: () => { const box = $('crImport'); this.importCode(box ? box.value : ''); },
      crpaste: () => this.pasteCode(),
      crcancel: () => this.closeConfirm(),
      crconfirm: () => this.runConfirm(Number(arg)),
    };
    const fn = handlers[name];
    if (fn) fn();
  },
  runConfirm(index) {
    const button = this.confirm && this.confirm.buttons[index];
    if (!button) return;
    if (button.run) button.run(); else this.act(button.act, '');
  },
  adjust(key, dir) {
    Sound.ui('move');
    const [kind, name, part] = key.split(':');
    if (kind === 'choice') this.cycleChoice(name, dir);
    else if (kind === 'col') this.cycleSwatch(name, dir);
    else if (kind === 'body') this.stepBody(name, dir);
    else if (kind === 'fine') this.fineStep(name, part, dir);
    else if (kind === 'finekey') this.cycleFineKey(dir);
    else if (kind === 'attr') this.stepAttr(name, dir);
    else if (kind === 'arch') this.setArchetype(dir);
    else if (kind === 'movestyle') this.setMoveStyle(dir);
    else if (kind === 'defense') this.setDefense();
    else if (kind === 'tier') this.toggleTier();
    else if (kind === 'title') this.setTitle(dir);
    else if (kind === 'nameidea') this.cycleNameIdea(dir);
    else if (kind === 'turn') { Showcase.turnPreview(dir * TURN_STEP); UI.say('Preview turned ' + (dir > 0 ? 'right' : 'left')); }
    else if (kind === 'pose') this.cyclePose();
  },
  cycleFineKey(dir) {
    const keys = LOOK_COLOR_KEYS.filter((k) => k !== 'skin');
    const i = keys.indexOf(this.fineKey);
    this.fineKey = keys[(i + dir + keys.length) % keys.length];
    UI.say('Fine tune: ' + COLOR_GROUP_BY_KEY[this.fineKey].label);
    UI.rerender(true);
  },
  switchTab(id) {
    if (!CREATOR_TABS.some((t) => t.id === id)) return;
    this.tab = id;
    this.exportCode = id === 'library' ? this.exportCode : '';
    UI.say(CREATOR_TABS.find((t) => t.id === id).label + ' tab');
    UI.rerender(false);
    const tab = UI.dom.screens.querySelector('[data-act="crtab:' + id + '"]');
    if (tab) tab.focus();
  },
  stepTab(dir) {
    const i = CREATOR_TABS.findIndex((t) => t.id === this.tab);
    Sound.ui('move');
    this.switchTab(CREATOR_TABS[(i + dir + CREATOR_TABS.length) % CREATOR_TABS.length].id);
  },
  /* Keys that only matter inside the creator. Returns true when handled. */
  onKey(e) {
    const el = document.activeElement;
    const typing = el && (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && el.type === 'text'));
    if (typing) return this.onTypingKey(e, el);
    if (this.confirm) return false;
    const k = e.code;
    const onTab = el && el.classList && el.classList.contains('tab');
    if (onTab && (k === 'ArrowLeft' || k === 'KeyA')) { e.preventDefault(); this.stepTab(-1); return true; }
    if (onTab && (k === 'ArrowRight' || k === 'KeyD')) { e.preventDefault(); this.stepTab(1); return true; }
    if (k === 'KeyQ' || k === 'PageUp') { e.preventDefault(); this.stepTab(-1); return true; }
    if (k === 'KeyE' || k === 'PageDown') { e.preventDefault(); this.stepTab(1); return true; }
    if (k === 'BracketLeft' || k === 'Comma') { e.preventDefault(); Showcase.turnPreview(-TURN_STEP); return true; }
    if (k === 'BracketRight' || k === 'Period') { e.preventDefault(); Showcase.turnPreview(TURN_STEP); return true; }
    if (k === 'KeyT') { e.preventDefault(); this.cyclePose(); return true; }
    return false;
  },
  onTypingKey(e, el) {
    const k = e.code;
    if (k === 'Escape') { e.preventDefault(); el.blur(); UI.dom.screens.querySelector('[data-nav]').focus(); return true; }
    if (k === 'ArrowDown' || k === 'ArrowUp' || (k === 'Enter' && el.tagName === 'INPUT')) { e.preventDefault(); UI.moveFocus(k === 'ArrowUp' ? -1 : 1); return true; }
    return true;                                         // every other key types normally
  },
  onInput(e) {
    const el = e.target;
    if (UI.current !== 'creator' || !el.getAttribute) return;
    if (el.id === 'crName') { this.onNameInput(el); return; }
    const range = el.getAttribute('data-crrange');
    if (range) this.onRange(range, Number(el.value), el);
  },
  onChange(e) {
    if (UI.current !== 'creator' || !e.target.getAttribute || !e.target.getAttribute('data-crrange')) return;
    UI.rerender(true);
  },
  onNameInput(el) {
    const clean = el.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_MAX);
    if (clean !== el.value) el.value = clean;
    this.draft.name = clean;
    const head = $('crTitle');
    if (head) head.textContent = clean || 'UNNAMED';
    this.updateStatus();
  },
  onRange(key, value, el) {
    const [kind, name, part] = key.split(':');
    if (kind === 'body' && name === 'scale') this.draft.look.scale = snapToStep(value, SCALE_MIN, SCALE_MAX, SCALE_STEP);
    if (kind === 'body' && name === 'build') this.draft.look.build = snapToStep(value, BUILD_MIN, BUILD_MAX, BUILD_STEP);
    if (kind === 'fine') this.fineSet(name, part, value);
    const label = el.closest('.opt') && el.closest('.opt').querySelector('.v b');
    if (label) label.textContent = kind === 'fine' ? this.fineText(name, part) : name === 'scale' ? this.heightText() : this.buildText();
    this.refreshPreview();
    this.updateStatus();
  },
  updateStatus() {
    const status = $('crStatus');
    if (status) { status.textContent = this.statusText(); status.classList.toggle('dirty', this.isDirty()); }
  },

  /* ----- text helpers ----- */
  heightText() { return Math.round(BASE_HEIGHT_CM * this.draft.look.scale) + ' cm'; },
  buildText() { const b = this.draft.look.build; return (b < 0.9 ? 'Lean' : b < 1.05 ? 'Athletic' : b < 1.2 ? 'Strong' : 'Heavy') + ' (' + b.toFixed(2) + ')'; },
  fineText(key, part) {
    const hsl = hexToHsl(this.draft.look[key]);
    return part === 'hue' ? Math.round(hsl.h) + '°' : Math.round(hsl.l * 100) + '%';
  },
  statusText() {
    const stored = !!CustomRoster.slots[this.slot];
    return 'Slot ' + (this.slot + 1) + ' · ' + (!stored ? 'New, not saved' : this.isDirty() ? 'Unsaved changes' : 'Saved');
  },

  /* ----- rendering ----- */
  render() {
    const d = this.draft;
    let h = '<section class="screen on creator" aria-label="Create fighter"><div class="panel cr">';
    h += '<div class="cr-head"><h2 id="crTitle">' + esc(d.name || 'UNNAMED') + '</h2><span class="cr-status' + (this.isDirty() ? ' dirty' : '') + '" id="crStatus" role="status">' + esc(this.statusText()) + '</span></div>';
    if (this.confirm) return h + this.renderConfirm() + '</div></section>';
    h += '<div class="tabs" role="tablist" aria-label="Creator sections">';
    // Only the active tab is in the focus order (tablist pattern): left / right on it switches tabs.
    for (const t of CREATOR_TABS) {
      const active = t.id === this.tab;
      h += '<button class="tab" role="tab" ' + (active ? 'data-nav data-default tabindex="0"' : 'tabindex="-1"') + ' data-act="crtab:' + t.id + '" aria-selected="' + active + '" aria-controls="crPanel">' + t.label + '</button>';
    }
    h += '</div><div class="cr-body" id="crPanel" role="tabpanel" aria-label="' + CREATOR_TABS.find((t) => t.id === this.tab).label + '">' + this['tab_' + this.tab]() + '</div>';
    h += '<div class="cr-foot">' + this.footButton('crback', 'Back') + this.footButton('crpose', 'Pose: ' + POSE_LABELS[Showcase.previewPose]) + this.footButton('crrandom', 'Randomize') +
      this.footButton('crreset', 'Reset') + this.footButton('crsave', 'Save') + this.footButton('crfight', 'Fight preview') + '</div>';
    h += '<p class="hint cr-keys">Q / E switch tabs &middot; [ ] or drag to turn &middot; T changes pose &middot; Esc goes back</p>';
    return h + '</div></section>';
  },
  footButton(act, label) { return '<button class="mi" data-nav data-act="' + act + '">' + esc(label) + '</button>'; },
  renderConfirm() {
    let h = '<div class="cr-modal" role="alertdialog" aria-label="Confirm"><p>' + esc(this.confirm.text) + '</p><div class="row">';
    this.confirm.buttons.forEach((b, i) => { h += '<button class="mi" style="width:auto" data-nav ' + (i === 0 ? 'data-default ' : '') + 'data-act="crconfirm:' + i + '">' + esc(b.label) + '</button>'; });
    return h + '</div></div>';
  },
  row(label, value, key, extra) {
    return '<div class="opt" role="spinbutton" tabindex="0" data-nav data-cr="' + key + '" aria-label="' + esc(label) + '" aria-valuetext="' + esc(value) + '">' +
      '<span class="k">' + esc(label) + '</span><span class="v"><b>' + esc(value) + '</b>' + (extra || '') + '</span></div>';
  },
  choiceRow(key) { const c = LOOK_CHOICES[key]; return this.row(c.label, c.labels[this.draft.look[key]], 'choice:' + key); },
  rangeInput(key, min, max, step, value, label) {
    return '<input class="rng" type="range" tabindex="-1" aria-hidden="true" data-crrange="' + key + '" min="' + min + '" max="' + max + '" step="' + step + '" value="' + value + '" title="' + esc(label) + '">';
  },
  swatchRow(key) {
    const group = COLOR_GROUP_BY_KEY[key], current = this.draft.look[key];
    const index = group.swatches.indexOf(current);
    let chips = '<span class="sws">';
    group.swatches.forEach((hex, i) => {
      chips += '<button class="sw' + (hex === current ? ' on' : '') + '" tabindex="-1" style="background:' + hex + '" data-act="crcol:' + key + '.' + i + '" aria-label="' + esc(group.label) + ' swatch ' + (i + 1) + '"></button>';
    });
    chips += '</span>';
    const value = index >= 0 ? (index + 1) + ' / ' + group.swatches.length : 'Custom';
    return '<div class="opt col" role="spinbutton" tabindex="0" data-nav data-cr="col:' + key + '" aria-label="' + esc(group.label) + '" aria-valuetext="' + esc(value) + '">' +
      '<span class="k">' + esc(group.label) + ' <i class="chip" style="background:' + current + '"></i></span><span class="v"><b>' + esc(value) + '</b></span>' + chips + '</div>';
  },
  fineRows(key) {
    const hsl = hexToHsl(this.draft.look[key]);
    const range = key === 'skin' ? FINE_RANGES.skin : FINE_RANGES.other;
    return this.row('Hue', this.fineText(key, 'hue'), 'fine:' + key + ':hue', this.rangeInput('fine:' + key + ':hue', range.hueMin, range.hueMax, 1, Math.round(hsl.h), 'Hue')) +
      this.row('Lightness', this.fineText(key, 'light'), 'fine:' + key + ':light', this.rangeInput('fine:' + key + ':light', range.lightMin, range.lightMax, 0.01, hsl.l.toFixed(2), 'Lightness'));
  },
  tab_body() {
    const look = this.draft.look;
    return this.row('Turn preview', 'Left / right', 'turn') +
      this.row('Height', this.heightText(), 'body:scale', this.rangeInput('body:scale', SCALE_MIN, SCALE_MAX, SCALE_STEP, look.scale, 'Height')) +
      this.row('Build', this.buildText(), 'body:build', this.rangeInput('body:build', BUILD_MIN, BUILD_MAX, BUILD_STEP, look.build, 'Build')) +
      this.swatchRow('skin') + '<h3>Fine skin tone</h3>' + this.fineRows('skin') +
      '<p class="hint">Height and build change how your fighter looks only. Reach, power and speed come from the Style tab.</p>';
  },
  tab_head() {
    const look = this.draft.look;
    let h = this.choiceRow('hairStyle') + this.swatchRow('hair') + this.choiceRow('eyes') + this.choiceRow('brows') + this.choiceRow('beard') + this.choiceRow('headband') + this.choiceRow('mask');
    if (look.headband !== 'none' || look.mask !== 'none') h += this.swatchRow('accent');
    return h + '<h3>Fine hair colour</h3>' + this.fineRows('hair');
  },
  tab_outfit() {
    const look = this.draft.look;
    let h = this.choiceRow('topStyle');
    if (look.topStyle !== 'bare') h += this.swatchRow('top');
    h += this.choiceRow('legs') + this.swatchRow('shorts') + this.choiceRow('hands') + this.swatchRow('glove') + this.choiceRow('belt') + this.choiceRow('feet');
    if (look.feet !== 'barefoot') h += this.swatchRow('shoe');
    h += this.swatchRow('accent') + this.choiceRow('glow');
    h += '<button class="mi" data-nav data-act="crharmony">Auto-harmony<small>Match legwear, accent, hands and shoes to the top colour (press again for another scheme)</small></button>';
    h += '<h3>Custom colour</h3>' + this.row('Colour to tune', COLOR_GROUP_BY_KEY[this.fineKey].label, 'finekey') + this.fineRows(this.fineKey);
    return h;
  },
  tab_style() {
    const d = this.draft, arch = ARCHETYPES[d.arch], budget = this.budget(), left = budget - attrTotal(d.attrs);
    const tierText = d.tier === 'veteran' ? 'Veteran (' + VETERAN_BUDGET + ' points)' : 'Standard (' + POINT_BUDGET + ' points)' + (veteranUnlocked() ? '' : ' · Veteran locked');
    let h = this.row('Fighting style', arch.label, 'arch') + '<p class="hint">' + esc(arch.desc) + ' Sets how the CPU fights with this fighter and its preferred distance.</p>';
    const style = MOVE_STYLE[d.moveStyle] || MOVE_STYLE[DEFAULT_MOVE_STYLE];
    h += this.row('Movement', style.label, 'movestyle') + '<p class="hint">' + esc(style.desc) + ' Looks only: stance, rhythm and how strikes are thrown.</p>';
    h += this.row('Defense', DEFENSE_LABEL[d.defense], 'defense') + '<p class="hint">' + esc(DEFENSE_HELP[d.defense]) + ' Each fighter has one defense, never both. Changing the movement style resets it to that style\'s usual choice.</p>';
    h += this.row('Tier', tierText, 'tier');

   ===================================================================== */
const SELFTEST_STORE_KEYS = [KEY_SETTINGS, KEY_PROGRESS, KEY_BINDINGS, KEY_BINDINGS_P2, KEY_CUSTOM];
const SelfTest = {
  scripted(fn) { return ScriptedController.make(fn); },
  /* Saved data and the in-memory copies the tests may change, so a run in a real browser leaves no trace
     (it would otherwise mark the first-match controls card as seen, for example). */
  snapshot() {
    return {
      raw: SELFTEST_STORE_KEYS.map((key) => Store.get(key)), settings: Object.assign({}, Settings.v), progress: JSON.parse(JSON.stringify(Progress.d)),
      keys: KEYMAPS.map((keymap) => JSON.stringify(keymap.bindings)), selection: Object.assign({}, Game.selection), devices: Inputs.players.map((p) => p.lastDevice),
      controlsChanged,
    };
  },
  restore(saved) {
    SELFTEST_STORE_KEYS.forEach((key, i) => { if (saved.raw[i] === null) Store.remove(key); else Store.set(key, saved.raw[i]); });
    Settings.v = saved.settings;
    Settings.apply();
    Progress.d = saved.progress;
    KEYMAPS.forEach((keymap, i) => { keymap.bindings = JSON.parse(saved.keys[i]); });
    Inputs.rebuildMaps();
    Object.assign(Game.selection, saved.selection);
    Inputs.players.forEach((p, i) => { p.lastDevice = saved.devices[i]; });   // Versus tests switch pads between players
    controlsChanged = saved.controlsChanged;   // the migration tests set it
  },
  make(opts, s1, s2) {
    const m = new MatchSim(Object.assign({ mode: 'free', countdown: false, timer: 0, seed: 11, winsNeeded: 2 }, opts));
    m.controllers[0] = this.scripted(s1 || (() => {}));
    m.controllers[1] = this.scripted(s2 || (() => {}));
    return m;
  },
  place(m, gap, x0) {
    const a = m.fighters[0], b = m.fighters[1], c = x0 === undefined ? 0 : x0;
    a.x = c - gap / 2; b.x = c + gap / 2; a.z = b.z = 0;
    a.prevX = a.x; b.prevX = b.x; a.prevZ = b.prevZ = 0;
  },
  run(m, n) { for (let i = 0; i < n; i++) m.step(); },
  /* Block vs Sway balance (P3-02): two copies of KAI that differ only in their defense type play AI vs AI for `seeds` seeds, each seed
     on both sides so the spawn side cancels out. opts go to SimRunner.run. Returns { block, sway, none } match wins (none = time cap). */
  defenseSplit(seeds, opts) {
    const blockId = 'dsplit_block', swayId = 'dsplit_sway';
    ROSTER_BY_ID[blockId] = Object.assign({}, ROSTER_BY_ID.kai, { id: blockId, name: 'BLOCKER', defense: 'block' });
    ROSTER_BY_ID[swayId] = Object.assign({}, ROSTER_BY_ID.kai, { id: swayId, name: 'SWAYER', defense: 'sway' });
    const wins = { block: 0, sway: 0, none: 0 };
    try {
      for (let seed = 1; seed <= seeds; seed++) {
        for (const swapped of [false, true]) {   // swapped: the Sway fighter is player 1
          const r = SimRunner.run(Object.assign({ playerId: swapped ? swayId : blockId, opponentId: swapped ? blockId : swayId, seed }, opts));
          if (r.error) return { error: r.error };
          if (r.winner < 0) wins.none++; else if ((r.winner === 0) !== swapped) wins.block++; else wins.sway++;
        }
      }
    } finally {
      delete ROSTER_BY_ID[blockId]; delete ROSTER_BY_ID[swayId];
    }
    return wins;
  },
  capture(names) {
    const log = {};
    const offs = names.map((n) => { log[n] = []; return Events.on(n, (e) => log[n].push(e)); });
    log.stop = () => offs.forEach((off) => off());
    return log;
  },

  run_all() {
    const results = [];
    const self = this;
    const test = (name, fn) => {
      let m = null;
      try { const r = fn(); results.push({ name, pass: r === true, detail: r === true ? '' : String(r) }); } catch (e) { results.push({ name, pass: false, detail: 'exception: ' + e.message }); }
      if (Match.current) Match.current.dispose();
      void m;
    };
    const mk = (...a) => self.make(...a);
    /* A match whose second fighter (MARA, a Sway fighter by default) holds Defend as a Block fighter: for the block tests. */
    const mkBlock = (...a) => { const m = self.make(...a); m.fighters[1].defense = 'block'; return m; };
    const once = (tick, key, extra) => (it, f, o, m) => { if (m.tick === tick) { it[key] = true; if (extra) Object.assign(it, extra); } };
    /* Presses an attack string ('P' / 'K' letters) on fighter 1: the first press at tick 2, each next press right after the previous move connected.
       extra = fields set on every press tick (height: true = Crouch held). */

      let next = 0, from = 0;

      const keep = { quality: Settings.v.quality, autoScale: Quality.autoScale, best: Quality.bestFrameMs, block: Quality.blockUpUntil, frames: Diag.frameCount };
      const runFrames = (ms, n) => { for (let i = 0; i < n; i++) Quality.adapt(ms, ms / 1000); };
      try {
        Settings.v.quality = 'auto'; Diag.frameCount = Math.max(Diag.frameCount, REFRESH_SETTLE_FRAMES + 1);
        Quality.autoScale = 1; Quality.slowTime = 0; Quality.bestFrameMs = 20;
        runFrames(20, 600);   // 12 s of steady 50 Hz frames
        const at50Hz = Quality.autoScale;
        Quality.autoScale = 1; Quality.slowTime = 0; Quality.bestFrameMs = TARGET_FRAME_MS;
        runFrames(22, 150);   // 3.3 s of 22 ms frames on a 60 Hz screen
        const slow60 = Quality.autoScale;
        return at50Hz === 1 && slow60 < 1 ? true : '50 Hz scale ' + at50Hz + ', slow 60 Hz scale ' + slow60;
      } finally {
        Settings.v.quality = keep.quality; Quality.autoScale = keep.autoScale; Quality.bestFrameMs = keep.best; Quality.blockUpUntil = keep.block;
        Quality.slowTime = 0; Quality.fastTime = 0; Diag.frameCount = keep.frames; Quality.apply();
      }
    });
    return results;
  },
};

/* The menu backdrop after a self-test, simulation or benchmark replaced the arena; fresh RNG so menus are not replayed. */
UI.resetMenuScene = function resetMenuScene() {
  Debris.clear(); FX.clear();
  Showcase.arenaId = null;
  this.menuScene('warehouse', 'kai', 'mara', false);
  simRng = makeRng((Date.now() & 0xffff) + 1);
};

UI.runSimulation = function runSimulation(opts) {
  if (Game.state !== GS.MENU || Game.match) return { error: 'Simulation is available from the main menu only.' };
  try { return SimRunner.run(opts); } finally { this.resetMenuScene(); }
};

/* ---------- performance benchmark (low-spec method, see the tasklist decision log P0-04) ----------
   Worst-case scene: the arena with the most destructible objects, two expert AI fighters, every object smashed again
   every BENCH_REBREAK_SECONDS so debris stays at the quality cap. Real rendering; run from the main menu. */
const BENCH_SECONDS = 10;
const BENCH_WARMUP_SECONDS = 1;
const BENCH_REBREAK_SECONDS = 2;
UI.runBenchmark = function runBenchmark(seconds) {
  if (Game.state !== GS.MENU || Game.match) return Promise.resolve({ error: 'Benchmark is available from the main menu only.' });
  const duration = Number.isFinite(seconds) && seconds > 0 ? seconds : BENCH_SECONDS;
  const arenaId = ARENA_ORDER.reduce((best, id) => (ARENAS[id].objects.length > ARENAS[best].objects.length ? id : best));
  const smashAll = () => {
    Arena.reset();
    Arena.objects.forEach((o, i) => Arena.damageObject(o, 1e4, 'impact', -1 - i, 1, 0, o.x, 1, o.z, -1));
  };
  Game.go(GS.CHARSEL);
  Game.run = { mode: 'free', player: 'kai' };
  Game.beginMatch({ mode: 'free', playerId: 'kai', opponentId: 'mara', arenaId, difficulty: 'expert', winsNeeded: 99, timer: 0, countdown: false, benchmark: true });
  const m = Game.match;
  m.controllers[0] = new AIController(m.fighters[0].profile, 'expert');
  smashAll();
  const frames = [], work = [];   // frame interval, and main-thread time from simulation start to render submit (not capped by vsync)
  const peak = { draws: 0, instances: 0, debris: 0, particles: 0 };
  let elapsed = 0, sinceBreak = 0, workStart = 0;
  const percentiles = (list) => {
    const sorted = list.slice().sort((a, b) => a - b), at = (p) => sorted[Math.min(sorted.length - 1, Math.floor(p * sorted.length))] || 0;
    return [at(0.5), at(0.95), at(1)].map((v) => Math.round(v * 100) / 100);
  };
  return new Promise((resolve) => {
    // the player quit or paused: stop measuring and leave whatever they are doing now alone
    const abandoned = () => Game.match !== m || !SIM_STATES.includes(Game.state) || Game.state === GS.PAUSED;
    const offFrame = Events.on('frame', (e) => {
      if (abandoned()) { offFrame(); offRendered(); resolve({ error: 'Benchmark stopped: the match was paused or left.' }); return; }
      workStart = performance.now();
      elapsed += e.dt; sinceBreak += e.dt;
      if (sinceBreak >= BENCH_REBREAK_SECONDS) { sinceBreak = 0; smashAll(); }
      if (elapsed > BENCH_WARMUP_SECONDS) frames.push(e.dt * 1000);
    });
    const offRendered = Events.on('rendered', () => {
      if (elapsed <= BENCH_WARMUP_SECONDS) return;
      work.push(performance.now() - workStart);
      peak.draws = Math.max(peak.draws, R.stats.draws); peak.instances = Math.max(peak.instances, R.stats.instances);
      peak.debris = Math.max(peak.debris, Debris.active); peak.particles = Math.max(peak.particles, FX.active);
      if (elapsed < BENCH_WARMUP_SECONDS + duration) return;
      offFrame(); offRendered();
      Game.quitToMenu();
      UI.resetMenuScene();
      const round = (v) => Math.round(v * 100) / 100;
      const [frameP50, frameP95, frameMax] = percentiles(frames), [workP50, workP95, workMax] = percentiles(work);
      resolve({
        arena: arenaId, seconds: duration, frames: frames.length, frameP50, frameP95, frameMax, workP50, workP95, workMax,
        quality: Quality.level, renderScale: round(R.scale), resolution: R.width + 'x' + R.height, gpu: GPU.tier, ...peak,
        heapMB: performance.memory ? round(performance.memory.usedJSHeapSize / 1048576) : null, startupMs: Math.round(Diag.startupMs),
      });
    });
  });
};

UI.runSelfTest = function runSelfTest() {
  const out = $('selftestOut');
  if (Game.state !== GS.MENU || Game.match) { if (out) out.textContent = 'Self-test is available from the main menu only.'; return; }
  const t0 = performance.now();
  const illegalBefore = Diag.illegalTransitions;
  const screen = this.current, stack = this.stack.slice();
  const saved = SelfTest.snapshot();
  const res = SelfTest.run_all();
  SelfTest.restore(saved);
  Diag.illegalTransitions = illegalBefore;
  this.resetMenuScene();
  if (screen && this.current !== screen) { this.go(screen); this.stack = stack; }   // flow tests visit other screens: show the results where the run started
  const pass = res.filter((r) => r.pass).length;
  const text = 'Self-test: ' + pass + ' / ' + res.length + ' passed in ' + Math.round(performance.now() - t0) + ' ms\n' + res.map((r) => (r.pass ? '[pass] ' : '[FAIL] ') + r.name + (r.detail ? '  -> ' + r.detail : '')).join('\n');
  const shown = $('selftestOut');
  if (shown) shown.textContent = text;
  Diag.log(pass === res.length ? 'info' : 'warn', 'Self-test ' + pass + '/' + res.length);
  return res;
};

/* ---------- boot ---------- */
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
function checkFeatures() {
  const missing = [];
  if (typeof requestAnimationFrame !== 'function') missing.push('requestAnimationFrame');
  if (typeof Float32Array === 'undefined') missing.push('typed arrays');
  if (typeof Promise === 'undefined') missing.push('Promise');
  if (missing.length) throw new Error('Your browser is missing: ' + missing.join(', '));
}
function installGlobalHandlers() {
  window.addEventListener('error', (e) => { Diag.log('error', 'Uncaught: ' + e.message); });
  window.addEventListener('unhandledrejection', (e) => { Diag.log('error', 'Unhandled promise: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
  let resizeQueued = false;
  // Quality.apply recomputes the pixel budget for the new size and resizes the canvas.
  const queueResize = () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => {
      resizeQueued = false;
      // iOS can leave the page scrolled after the on-screen keyboard closes; the game never scrolls
      const typing = document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
      if (!typing && (window.scrollX || window.scrollY)) window.scrollTo(0, 0);
      Quality.apply();
    });
  };
  window.addEventListener('resize', queueResize);
  // iOS reports the new size a little after the rotation: measure again once it has settled
  const onRotate = () => { setTimeout(queueResize, 150); setTimeout(queueResize, 500); };
  window.addEventListener('orientationchange', onRotate);
  if (screen.orientation && screen.orientation.addEventListener) screen.orientation.addEventListener('change', onRotate);
  document.addEventListener('fullscreenchange', queueResize);
  document.addEventListener('webkitfullscreenchange', queueResize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', queueResize);
  document.addEventListener('focusout', (e) => { if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) queueResize(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { Game.pause(); Sound.suspend(); } else { Sound.resumeIfAllowed(); queueResize(); }
  });
  // back from the bfcache or another app (iOS): audio may still be suspended
  window.addEventListener('pageshow', () => { Sound.resumeIfAllowed(); queueResize(); });
  window.addEventListener('blur', () => { Game.pause(); });
  Events.on('settings', () => { Sound.applyVolumes(); });
  Events.on('frame', () => Music.update());
}

async function boot() {
  const t0 = performance.now();
  const root = $('screens');
  root.innerHTML = '<section class="screen on center"><div class="panel"><h1 class="logo">BREAKPOINT</h1><p class="sub" id="loadMsg">Starting...</p><div style="height:.5em;background:#1b2a4d"><div id="loadBar" style="height:100%;width:0;background:var(--a1)"></div></div></div></section>';
  const status = (msg, frac) => { const m = $('loadMsg'), b = $('loadBar'); if (m) m.textContent = msg; if (b) b.style.width = Math.round(frac * 100) + '%'; };
  try {
    status('Checking browser features...', 0.05); await nextFrame();
    checkFeatures();
    status('Loading settings...', 0.2); await nextFrame();
    Store.init(); Settings.init(); Keymap.init(); Keymap2.init(); Progress.init(); CustomRoster.init();
    status('Creating renderer...', 0.4); await nextFrame();
    if (!R.init($('view'))) { UI.dom.fatal = $('fatal'); fatalStartup(R.error + ' BREAKPOINT needs WebGL 2 (current Chrome, Edge, Firefox or Safari 15+) with hardware acceleration enabled.' + (Device.ios ? ' On iPhone and iPad, update to iOS 15 or later; if it is still off, turn on WebGL 2.0 under Safari > Advanced > Feature Flags in the Settings app.' : '')); return; }
    R.resize(); Quality.apply();
    status('Preparing effects and physics pools...', 0.6); await nextFrame();
    Debris.init(); FX.init();
    status('Initialising input and audio...', 0.8); await nextFrame();
    Inputs.init(); Sound.wire(); Effects.init(); UI.init(); installGlobalHandlers();
    status('Ready', 1); await nextFrame();
    Showcase.set('warehouse', 'kai', 'mara', false);
    Diag.startupMs = performance.now() - t0;
    Game.go(GS.MENU);
    Game.start();
    Diag.log('info', 'Started in ' + Math.round(Diag.startupMs) + ' ms');
  } catch (e) {
    Diag.log('error', 'Startup failed: ' + (e && e.stack ? e.stack : e));
    fatalStartup('Startup failed: ' + (e && e.message ? e.message : e));
  }
}
function fatalStartup(msg) {
  const f = $('fatal');
  f.hidden = false;
  f.innerHTML = '<div class="panel"><h2>BREAKPOINT cannot start</h2><p></p><p class="hint">No data was changed. Reload the page after fixing the issue.</p></div>';
  f.querySelector('p').textContent = msg;
  $('screens').innerHTML = '';
}

window.BREAKPOINT = { version: VERSION, selfTest: () => UI.runSelfTest(), simulate: (opts) => UI.runSimulation(opts), benchmark: (seconds) => UI.runBenchmark(seconds), diagnostics: () => ({ state: Game.state, fps: 1000 / Math.max(1, Diag.frameMs), errors: Diag.errors, logs: Diag.logs.slice(-20), illegalTransitions: Diag.illegalTransitions }) };
boot();

})();
</script>
