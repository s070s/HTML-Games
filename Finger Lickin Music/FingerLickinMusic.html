  }

  function velocityOf(state, event) {
    const pressure = event.pressure;
    if (typeof pressure !== 'number' || !(pressure > 0)) return state.velocity;
    const isMidi = event.source === 'midi';
    const isPointerPressure = event.source === 'pointer' && pressure !== NEUTRAL_PRESSURE;
    const isGamepadAnalog = event.source === 'gamepad' && pressure < 1;
    if (!isMidi && !isPointerPressure && !isGamepadAnalog) return state.velocity;
    return clamp(Math.round(pressure * MIDI_MAX), 1, MIDI_MAX);
  }

  // ---------------------------------------------------------------------------------------------
  // Chord label (6.8.4 D.7): presses within 30 ms form one group; the label never delays the sound
  // ---------------------------------------------------------------------------------------------
  function chordName(found) {
    const names = Theory.PITCH_CLASS_SHARP;
    const slash = found.inversion > 0 ? '/' + names[Theory.pitchClass(found.bass)] : '';
    return names[found.root] + Theory.chord(found.type).symbol + slash;
  }

  function intervalLabel(low, high) {
    let semitones = high - low;
    while (semitones > INTERVAL_LIMIT) semitones -= OCTAVE_SIZE;
    return Theory.intervals()[semitones].name;
  }

  function labelFor(pitches) {
    const sorted = pitches.slice().sort((a, b) => a - b);
    if (sorted.length === 1) return Theory.noteName(sorted[0]);
    const found = Theory.recognizeChord(sorted);
    if (found) return chordName(found);
    const classes = new Set(sorted.map(Theory.pitchClass)).size;
    if (classes <= 2) return intervalLabel(sorted[0], sorted[sorted.length - 1]);
    return sorted.map((pitch) => Theory.noteName(pitch)).join(' ');
  }

  function labelAction(state, stamp, pitches, control) {
    const group = state.chordWindow;
    const at = stamp.tAudio !== null ? stamp.tAudio : Core.now() / MS_PER_SECOND;
    if (group.t0 === null || at - group.t0 > CHORD_WINDOW_SECONDS) {
      group.t0 = at;
      group.pitches = [];
    }
    pitches.forEach((pitch) => {
      if (group.pitches.length < WINDOW_PITCH_LIMIT) addUnique(group.pitches, pitch);
    });
    state.lastChordLabel = labelFor(group.pitches);
    return makeAction(state, 'label', stamp, { label: state.lastChordLabel, pitches: group.pitches.slice(), control });
  }

  // ---------------------------------------------------------------------------------------------
  // Press and release (6.8.4 D)
  // ---------------------------------------------------------------------------------------------
  /** Seconds a fixed-length note lasts at the current tempo and speed, held to 50..2,000 ms. */
  function fixedSeconds(state, rawTick) {
    const transport = transportOf(state);
    const start = rawTick === null ? 0 : rawTick;
    let seconds = state.fixedDurTicks / TICKS_PER_SECOND_FALLBACK;
    if (transport && typeof transport.tempoMap === 'function') {
      const tempoMap = transport.tempoMap();
      const speed = typeof transport.speed === 'function' ? transport.speed() : 1;
      seconds = (tempoMap.ticksToSeconds(start + state.fixedDurTicks) - tempoMap.ticksToSeconds(start)) / speed;
    }
    return clamp(seconds, FIXED_MIN_SECONDS, FIXED_MAX_SECONDS);
  }

  // The note-off of a fixed-length note is emitted at press time with its own audio time (no JS timer, invariant 2).
  function fixedOffAction(state, stamp, pitches, control) {
    const base = stamp.tAudio !== null ? stamp.tAudio : nowSeconds() + DISPATCH_LEAD_SECONDS;
    const offAt = base + fixedSeconds(state, stamp.rawTick);
    state.pendingOffs = state.pendingOffs.filter((pending) => pending.tAudio > base);
    state.pendingOffs.push({ pitches: pitches.slice(), tAudio: offAt });
    return makeAction(state, 'noteOff', stampAt(state, offAt), { pitches: pitches.slice(), control });
  }

  /** A pitch that is pressed again is released first (retrigger); returns the pitches that were still sounding. */
  function takeOverPitches(state, pitches) {
    const taken = [];
    const keepOthers = (pitch) => {
      if (!pitches.includes(pitch)) return true;
      addUnique(taken, pitch);
      return false;
    };
    state.sounding.forEach((entry) => { entry.pitches = entry.pitches.filter(keepOthers); });
    state.deferred = state.deferred.filter(keepOthers);
    return taken;
  }

  function pressNote(state, control, pitches, event) {
    if (state.sounding.has(control)) return [];
    const stamp = stampAt(state, event.tAudio);
    const actions = [];
    const taken = takeOverPitches(state, pitches);
    if (taken.length > 0) actions.push(makeAction(state, 'noteOff', stamp, { pitches: taken, control }));
    const velocity = velocityOf(state, event);
    actions.push(makeAction(state, 'noteOn', stamp, { pitches: pitches.slice(), velocity, control }));
    const isFixed = state.noteLength === 'fixed';
    if (isFixed) actions.push(fixedOffAction(state, stamp, pitches, control));
    state.sounding.set(control, { pitches: pitches.slice(), tAudio: stamp.tAudio, autoOff: isFixed });
    actions.push(labelAction(state, stamp, pitches, control));
    return actions;
  }

  function releaseNote(state, control, event) {
    const entry = state.sounding.get(control);
    if (!entry) return [];
    state.sounding.delete(control);
    if (entry.autoOff || entry.pitches.length === 0) return [];
    if (state.sustain) {
      entry.pitches.forEach((pitch) => addUnique(state.deferred, pitch));
      return [];
    }
    return [makeAction(state, 'noteOff', stampAt(state, event.tAudio), { pitches: entry.pitches, control })];
  }

  function pressSustain(state, event) {
    state.sustain = true;
    const controller = { controller: SUSTAIN_CONTROLLER, value: CONTROLLER_ON, control: 'sustain' };
    return [makeAction(state, 'cc', stampAt(state, event.tAudio), controller)];
  }

  function releaseSustain(state, event) {
    if (!state.sustain) return [];
    state.sustain = false;
    const stamp = stampAt(state, event.tAudio);
    const actions = [makeAction(state, 'cc', stamp, { controller: SUSTAIN_CONTROLLER, value: 0, control: 'sustain' })];
    if (state.deferred.length > 0) {
      actions.push(makeAction(state, 'noteOff', stamp, { pitches: state.deferred, control: 'sustain' }));
    }
    state.deferred = [];
    return actions;
  }

  /** Pitches for a control: a lane of the active profile, or a MIDI key passed straight through; null otherwise. */
  function pitchesFor(state, control) {
    const lane = LANE_CONTROLS.indexOf(control);
    if (lane >= 0) return lanePitches(state, lane, true);
    const match = MIDI_CONTROL_PATTERN.exec(control);
    const key = match === null ? NaN : Number(match[1]);
    return key >= 0 && key <= MIDI_MAX ? [key] : null;
  }

  function onPress(state, event) {
    const control = event.control;
    if (control === 'octUp' || control === 'octDown') {
      return [shiftOctaveAction(state, control === 'octUp' ? 1 : -1, stampAt(state, event.tAudio), control)];
    }
    if (has(PROFILE_CONTROLS, control)) {
      return [setProfileOn(state, PROFILE_CONTROLS[control], stampAt(state, event.tAudio), control)];
    }
    if (control === 'sustain') return pressSustain(state, event);
    const pitches = pitchesFor(state, control);
    return pitches === null ? [] : pressNote(state, control, pitches, event);
  }

  function onRelease(state, event) {
    if (event.control === 'sustain') return releaseSustain(state, event);
    return releaseNote(state, event.control, event);
  }

  /** Note-offs for everything still sounding, deferred or scheduled, then cc 64 value 0 when sustain was on. */
  function releaseEverything(state, tAudio) {
    const stamp = stampAt(state, tAudio);
    const pitches = [];
    const addAll = (list) => list.forEach((pitch) => addUnique(pitches, pitch));
    state.sounding.forEach((entry) => { if (!entry.autoOff) addAll(entry.pitches); });   // their off is scheduled
    addAll(state.deferred);
    state.pendingOffs.forEach((pending) => {
      if (stamp.tAudio === null || pending.tAudio > stamp.tAudio) addAll(pending.pitches);
    });
    const actions = [];
    if (pitches.length > 0) actions.push(makeAction(state, 'noteOff', stamp, { pitches, control: 'panic' }));
    if (state.sustain) {
      actions.push(makeAction(state, 'cc', stamp, { controller: SUSTAIN_CONTROLLER, value: 0, control: 'panic' }));
    }
    state.sounding.clear();
    state.deferred = [];
    state.pendingOffs = [];
    state.sustain = false;
    state.chordWindow = { t0: null, pitches: [] };
    return actions;
  }

  // ---------------------------------------------------------------------------------------------
  // Validation of context values
  // ---------------------------------------------------------------------------------------------
  function checkSlot(slot) {
    const degree = requireInteger(slot && slot.degree, 1, 7, 'chord slot degree');
    if (!Theory.chord(slot.type)) throw codedError('E-GEN-006', 'unknown chord type: ' + String(slot.type));
    const inversion = slot.inversion === undefined ? 0 : requireInteger(slot.inversion, 0, 3, 'chord slot inversion');
    const voicing = slot.voicing === undefined ? 'close' : slot.voicing;
    if (!VOICINGS.includes(voicing)) throw codedError('E-GEN-005', 'unknown voicing: ' + String(voicing));
    return { degree, type: slot.type, inversion, voicing };
  }

  function checkChordSlots(slots) {
    if (slots === null) return null;
    if (!Array.isArray(slots) || slots.length !== LANE_COUNT) {
      throw codedError('E-GEN-005', 'chordSlots must hold exactly four slots');
    }
    return slots.map(checkSlot);
  }

  function checkIntervals(intervals) {
    if (intervals === null) return null;
    if (!Array.isArray(intervals) || intervals.length !== LANE_COUNT) {
      throw codedError('E-GEN-005', 'intervals must hold exactly four semitone counts');
    }
    return intervals.map((semitones) => requireInteger(semitones, 0, INTERVAL_LIMIT, 'interval'));
  }

  function newState(transport) {
    return {
      profile: 'A', key: { tonic: 0, mode: 'major' }, scaleId: null, octave: null, page: 0, register: 0,
      program: 0, isDrums: false, channel: 0, velocity: DEFAULT_VELOCITY, noteLength: 'hold',
      fixedDurTicks: DEFAULT_FIXED_TICKS, quantize: false, chordSlots: null, intervals: null, range: null,
      transport: transport || null, sounding: new Map(), sustain: false, deferred: [], pendingOffs: [],
      chordWindow: { t0: null, pitches: [] }, lastChordLabel: '', rangeWarned: [], recorded: [], disposed: false
    };
  }

  function setKeyOn(state, key) {
    state.key = checkKey(key);
  }

  function setScaleOn(state, scaleId) {
    if (scaleId !== null && !Theory.scale(scaleId)) throw codedError('E-GEN-006', 'unknown scale: ' + String(scaleId));
    state.scaleId = scaleId;
  }

  function setProgramOn(state, program, isDrums) {
    state.program = requireInteger(program, 0, MIDI_MAX, 'program');
    state.isDrums = isDrums === true;
  }

  function setRangeOn(state, range) {
    const checked = range === null ? null : toRange(range);
    if (range !== null && checked === null) throw codedError('E-GEN-005', 'range must be {low, high} within 0..127');
    state.range = checked;
  }

  function setNoteLengthOn(state, mode, durTicks) {
    if (!NOTE_LENGTH_MODES.includes(mode)) throw codedError('E-GEN-005', 'note length must be hold or fixed');
    state.noteLength = mode;
    if (durTicks !== undefined) state.fixedDurTicks = requireInteger(durTicks, 1, Number.MAX_SAFE_INTEGER, 'durTicks');
  }

  /** Applies the fields of a context object that are present; used by createLive and setContext. */
  function applyContext(state, context) {
    if (has(context, 'key')) setKeyOn(state, context.key);
    if (has(context, 'root')) setKeyOn(state, { tonic: context.root, mode: state.key.mode });
    if (has(context, 'scale')) setScaleOn(state, context.scale);
    if (has(context, 'program') || has(context, 'isDrums')) {
      setProgramOn(state, has(context, 'program') ? context.program : state.program,
        has(context, 'isDrums') ? context.isDrums : state.isDrums);
    }
    if (has(context, 'channel')) state.channel = requireInteger(context.channel, 0, 15, 'channel');
    if (has(context, 'range')) setRangeOn(state, context.range);
    if (has(context, 'profile')) setProfileOn(state, context.profile, stampAt(state, null), '');
    if (has(context, 'octave')) state.octave = requireInteger(context.octave, OCTAVE_MIN, OCTAVE_MAX, 'octave');
    if (has(context, 'register')) {
      state.register = requireInteger(context.register, -REGISTER_LIMIT, REGISTER_LIMIT, 'register');
    }
    if (has(context, 'velocity')) state.velocity = requireInteger(context.velocity, 1, MIDI_MAX, 'velocity');
    if (has(context, 'noteLength') || has(context, 'fixedDurTicks')) {
      setNoteLengthOn(state, has(context, 'noteLength') ? context.noteLength : state.noteLength, context.fixedDurTicks);
    }
    if (has(context, 'quantize')) state.quantize = context.quantize === true;
    if (has(context, 'chordSlots')) state.chordSlots = checkChordSlots(context.chordSlots);
    if (has(context, 'intervals')) state.intervals = checkIntervals(context.intervals);
  }

  // ---------------------------------------------------------------------------------------------
  // LiveMapper
  // ---------------------------------------------------------------------------------------------
  function heldPitches(state) {
    const held = [];
    state.sounding.forEach((entry) => entry.pitches.forEach((pitch) => addUnique(held, pitch)));
    return held.sort((a, b) => a - b);
  }

  function snapshot(state) {
    return {
      profile: state.profile, key: { tonic: state.key.tonic, mode: state.key.mode }, scaleId: scaleIdOf(state),
      scale: scaleIdOf(state), octave: effectiveOctave(state), page: state.page, register: state.register,
      program: state.program, isDrums: state.isDrums, channel: channelOf(state), velocity: state.velocity,
      noteLength: state.noteLength, fixedDurTicks: state.fixedDurTicks, quantize: state.quantize,
      chordSlots: currentChordSlots(state).map((slot) => Object.assign({}, slot)),
      intervals: currentIntervals(state).slice(), range: Object.assign({}, rangeOf(state)),
      held: heldPitches(state),
      sounding: Array.from(state.sounding, ([control, entry]) => ({ control, pitches: entry.pitches.slice() })),
      sustain: state.sustain, deferred: state.deferred.slice(), lastChordLabel: state.lastChordLabel,
      chordWindow: { t0: state.chordWindow.t0, pitches: state.chordWindow.pitches.slice() }
    };
  }

  function isHandleable(event) {
    return Boolean(event) && typeof event.control === 'string' && (event.type === 'press' || event.type === 'release');
  }

  function notify(listeners, action) {
    listeners.slice().forEach((listener) => {
      try {
        listener(action);
      } catch (error) {
        Core.ErrorReporter.report('E-GEN-001', error, { module: 'Mapping', phase: 'onAction' });
      }
    });
  }

  function record(state, action) {
    state.recorded.push(action);
    if (state.recorded.length > RECORDED_LIMIT) state.recorded.shift();
  }

  /** The mapper for Free Play, Studio recording and Instrument-mode lane hits (6.8.2). */
  function createLive(context) {
    const options = context || {};
    const state = newState(options.transport);
    const listeners = [];
    applyContext(state, options);

    function publish(actions) {
      actions.forEach((action) => {
        record(state, action);
        notify(listeners, action);
      });
      return actions;
    }

    function handle(event) {
      if (state.disposed || !isHandleable(event)) return [];
      return publish(event.type === 'press' ? onPress(state, event) : onRelease(state, event));
    }

    function releaseAll(tAudio) {
      return state.disposed ? [] : publish(releaseEverything(state, tAudio));
    }

    function setProfile(profile) {
      return publish([setProfileOn(state, profile, stampAt(state, null), '')])[0];
    }

    function shiftOctave(step) {
      requireInteger(step, -OCTAVE_SIZE, OCTAVE_SIZE, 'step');
      return publish([shiftOctaveAction(state, step, stampAt(state, null), '')])[0];
    }

    function onAction(callback) {
      if (typeof callback !== 'function') throw codedError('E-GEN-005', 'onAction needs a function');
      listeners.push(callback);
      return () => {
        const index = listeners.indexOf(callback);
        if (index >= 0) listeners.splice(index, 1);
      };
    }

    function dispose() {
      state.disposed = true;
      listeners.length = 0;
      state.sounding.clear();
      state.deferred = [];
      state.pendingOffs = [];
    }

    return Object.freeze({
      handle, onInput: handle, onAction, releaseAll, release: releaseAll, dispose,
      setProfile, shiftOctave,
      setContext: (changes) => applyContext(state, changes || {}),
      setKey: (key) => setKeyOn(state, key),
      setScale: (scaleId) => setScaleOn(state, scaleId),
      setOctave: (octave) => applyContext(state, { octave }),
      setRegister: (register) => applyContext(state, { register }),
      setProgram: (program, isDrums) => setProgramOn(state, program, isDrums),
      setRange: (range) => setRangeOn(state, range),
      setVelocity: (velocity) => applyContext(state, { velocity }),
      setNoteLength: (mode, durTicks) => setNoteLengthOn(state, mode, durTicks),
      setQuantize: (isOn) => applyContext(state, { quantize: isOn }),
      setChordSlots: (slots) => applyContext(state, { chordSlots: slots }),
      setIntervals: (intervals) => applyContext(state, { intervals }),
      state: () => snapshot(state),
      actions: () => state.recorded.slice()
    });
  }

  // ---------------------------------------------------------------------------------------------
  // Dispatch to Instruments (the only audio call in this module) and the profile tables for Help
  // ---------------------------------------------------------------------------------------------
  function callInstruments(action, trackId, at) {
    const instruments = FLM.Instruments;
    const isDrums = action.channel === DRUM_CHANNEL;
    if (action.kind === 'noteOn' && typeof instruments.liveNoteOn === 'function') {
      action.pitches.forEach((pitch) => instruments.liveNoteOn(
        trackId, action.program, isDrums, action.channel, pitch, action.velocity, at));
    } else if (action.kind === 'noteOff' && typeof instruments.liveNoteOff === 'function') {
      action.pitches.forEach((pitch) => instruments.liveNoteOff(trackId, action.channel, pitch, at));
    } else if (action.kind === 'cc' && typeof instruments.controlLive === 'function') {
      instruments.controlLive(trackId, action.channel, 'cc', action.controller, action.value, at);
    }
  }

  /**
   * Plays one action at action.tAudio (or now + 5 ms when it is null). Guarded: until M-06 exists (T04.06) nothing
   * is called. A failing voice is reported once as recoverable and never stops the mapper's bookkeeping.
   * @returns {boolean} true when the call reached Instruments without an error
   */
  function dispatch(action, trackId) {
    if (!action || !FLM.Instruments) return false;
    const at = typeof action.tAudio === 'number' ? action.tAudio : nowSeconds() + DISPATCH_LEAD_SECONDS;
    try {
      callInstruments(action, trackId, at);
      return true;
    } catch (error) {
      Core.ErrorReporter.report('E-GEN-001', error, { module: 'Mapping', phase: 'dispatch', kind: action.kind });
      return false;
    }
  }

  const INSTRUMENT_LABELS = Object.freeze({
    bass: ['root', 'fifth', 'octave', 'degree 7'],
    guitar: ['power chord I', 'power chord IV', 'power chord V', 'root'],
    melodic: ['degree 1', 'degree 3', 'degree 5', 'degree 8'],
    effects: ['degree 1', 'degree 2', 'degree 3', 'degree 4']
  });

  function instrumentLabels(state) {
    const family = familyOf(state.program);
    if (family === BASS_FAMILY) return INSTRUMENT_LABELS.bass;
    if (family === GUITAR_FAMILY) return INSTRUMENT_LABELS.guitar;
    return EFFECT_FAMILIES.includes(family) ? INSTRUMENT_LABELS.effects : INSTRUMENT_LABELS.melodic;
  }

  function laneLabel(state, lane, pitches) {
    if (drumsActive(state)) return Theory.gmDrumName(pitches[0]);
    if (state.profile === 'A') return 'degree ' + (lane + 1);
    if (state.profile === 'B') return Theory.intervals()[currentIntervals(state)[lane]].name;
    if (state.profile === 'C') return labelFor(pitches);
    if (state.profile === 'D') return 'degree ' + (state.register + state.page * LANE_COUNT + lane + 1);
    return instrumentLabels(state)[lane];
  }

  /** What each of the four lane controls plays: [{control, action, pitches}] for Help and the pad labels. */
  function profileTable(profile, context) {
    const state = newState(context && context.transport);
    applyContext(state, Object.assign({}, context, { profile }));
    return LANE_INDEXES.map((lane) => {
      const pitches = lanePitches(state, lane, false);
      return { control: LANE_CONTROLS[lane], action: laneLabel(state, lane, pitches), pitches };
    });
  }

  /** The chart lane (0 kick, 1 snare family, 2 hats, 3 everything else) of a GM drum key. */
  function laneForPitch(pitch) {
    return has(DRUM_KEY_LANES, pitch) ? DRUM_KEY_LANES[pitch] : DRUM_OTHER_LANE;
  }

  return Object.freeze({
    PROFILES,
    PROFILE_TITLES,
    DRUM_LANES,
    QUANTIZE_GRID_TICKS,
    CHORD_WINDOW_SECONDS,
    createLive,
    dispatch,
    profileTable,
    diatonicTriad,
    laneForPitch
  });
});
})();

// ==== 09-rhythm.js ====
// 09-rhythm.js - M-09 FLM.Rhythm: judgment windows, the Judge (input against chart time, calibration applied once),
// Score, combo, accuracy, sections, PerformanceSummary and deterministic replay.
// Separation rule: this file owns exactly one namespace and registers it once through
// FLM.Core.define. It may use only lower-numbered modules (Part 4.2, R-DEP). It declares no
// module-level global state object (S-07): each Judge keeps its state inside createJudge().
// Spec: docs/IMPLEMENTATION-PLAN.md Part 6.9 (API 6.9.2, algorithms 6.9.4), Part 5.12 (calibration), B 9.3 and 9.4.
// Time: the Judge never reads a clock. Every time comes from InputEvent.tAudio or the audioNow argument of tick(),
// so a fixed time map and a logged input make a run fully reproducible (I 2.4, B 9.4).
(function () {
'use strict';
const FLM = window.FLM;

FLM.Core.define('Rhythm', function (FLM) {
  const Core = FLM.Core;
  const Log = Core.Log;

  const MS_PER_SECOND = 1000;
  const LANE_COUNT = 4;
  const CHORD_TOLERANCE_MS = 50;
  const LANE_PATTERN = /^(?:lane|dance)([0-3])$/;
  const SNAP_SCALE = 1e6;                    // deltas are snapped to 1e-6 ms so float noise never flips a rounding
  const ZERO_LENGTH_HOLD_SECONDS = 0.001;    // a hold shorter than this after truncation is judged at its head
  const BARS_PER_SECTION = 4;
  const MIN_SECTION_JUDGED = 4;              // a section needs this many judgments to be the "worst" one
  const REPLAY_TAIL_SECONDS = 10;            // replay ends by ticking this far past the last logged event
  const ENDED_BY = Object.freeze(['end', 'user', 'fail', 'net']);
  const STRAY_PENALTIES = Object.freeze(['none', 'combo']);
  const CUSTOM_PRESET = 'custom';
  const NARROWEST_DIFFICULTY = 'expert';     // floor for custom windows when the chart names no known difficulty
  const CALIBRATION_LIMITS = Object.freeze({
    inputOffsetMs: Object.freeze({ min: -500, max: 500, fallback: 0 }),   // 500: the host bound of Part 5.12
    audioLatencyMs: Object.freeze({ min: 0, max: 500, fallback: 0 }),
    visualLeadMs: Object.freeze({ min: 600, max: 3000, fallback: 1500 })
  });
  const NO_INPUT = Object.freeze({ held: () => [] });

  function deepFreeze(value) {
    Object.keys(value).forEach((key) => {
      if (typeof value[key] === 'object' && value[key] !== null) deepFreeze(value[key]);
    });
    return Object.freeze(value);
  }

  /** Half-width windows in ms (BRIEF 6). */
  const WINDOWS = deepFreeze({
    beginner: { perfect: 45, great: 90, good: 135 },
    intermediate: { perfect: 35, great: 70, good: 110 },
    advanced: { perfect: 25, great: 55, good: 90 },
    expert: { perfect: 18, great: 40, good: 70 }
  });

  /** Window multipliers of the judgment presets (Part 5.11). */
  const PRESETS = deepFreeze({ standard: 1, relaxed: 1.5, strict: 0.75 });

  const SCORING = deepFreeze({
    points: { perfect: 100, great: 70, good: 40, miss: 0 },
    comboPerStep: 10,                        // the multiplier rises by 1 every 10 combo, from the combo before the note
    maxMultiplier: 4
  });

  // ---------------------------------------------------------------------------------------------
  // Pure helpers
  // ---------------------------------------------------------------------------------------------
  function codedError(code, text) {

  function hasOwn(object, key) {

  function roundMs(x) {

    return rounded === 0 ? 0 : Math.sign(x) * rounded;
  }

    return roundMs(Math.round(exact * SNAP_SCALE) / SNAP_SCALE);
  }

  /** 'lane0'..'lane3' or 'dance0'..'dance3' -> 0..3; anything else -> -1. */
  function laneOf(control) {
    const match = typeof control === 'string' ? LANE_PATTERN.exec(control) : null;
    return match ? Number(match[1]) : -1;
  }

  /** Judgment for an integer delta given windows: 'perfect' | 'great' | 'good' | null (outside). */
  function judgmentFor(absDeltaMs, windows) {
    if (absDeltaMs <= windows.perfect) return 'perfect';
    if (absDeltaMs <= windows.great) return 'great';
    return absDeltaMs <= windows.good ? 'good' : null;
  }

  function scaledWindows(base, factor) {
    return {
      perfect: Math.round(base.perfect * factor),
      great: Math.round(base.great * factor),
      good: Math.round(base.good * factor)
    };
  }

  /** @returns {{perfect,great,good}} copy for a difficulty and preset; throws E-INP-011 on an unknown name. */
  function windowsFor(difficulty, preset) {
    const presetName = preset === undefined ? 'standard' : preset;
    if (!hasOwn(WINDOWS, difficulty)) throw codedError('E-INP-011', 'unknown difficulty ' + String(difficulty));
    if (!hasOwn(PRESETS, presetName)) throw codedError('E-INP-011', 'unknown preset ' + String(presetName));
    return scaledWindows(WINDOWS[difficulty], PRESETS[presetName]);
  }

  function validWindows(windows) {
    if (!windows || typeof windows !== 'object') return false;
    const widths = [windows.perfect, windows.great, windows.good];
    if (!widths.every((width) => Number.isFinite(width) && width > 0)) return false;
    return windows.perfect <= windows.great && windows.great <= windows.good;
  }

  function clampInteger(value, limits) {
    if (!Number.isFinite(value)) return limits.fallback;
    return Math.min(limits.max, Math.max(limits.min, Math.round(value)));
  }

  /** Fills missing keys from `base`, clamps every value to its range (Part 5.11). */
  function normalizeCalibration(given, base) {
    const source = Object.assign({}, base, given);
    return {
      inputOffsetMs: clampInteger(source.inputOffsetMs, CALIBRATION_LIMITS.inputOffsetMs),
      audioLatencyMs: clampInteger(source.audioLatencyMs, CALIBRATION_LIMITS.audioLatencyMs),
      visualLeadMs: clampInteger(source.visualLeadMs, CALIBRATION_LIMITS.visualLeadMs)
    };
  }

  // ---------------------------------------------------------------------------------------------
  // Chart validation and runtime notes
  // ---------------------------------------------------------------------------------------------
  function lanesProblem(lanes) {
    if (!Array.isArray(lanes) || lanes.length < 1 || lanes.length > LANE_COUNT) return 'lanes must hold 1 to 4 values';
    const valid = lanes.every((lane, index) => Number.isInteger(lane) && lane >= 0 && lane < LANE_COUNT
      && (index === 0 || lane > lanes[index - 1]));
    return valid ? '' : 'lanes must be distinct ascending values 0 to 3';
  }

  function noteProblem(note, previousTick, seenIds) {
    if (!note || typeof note !== 'object') return 'not an object';
    if (!Number.isInteger(note.tick) || note.tick < 0) return 'tick must be an integer >= 0';
    if (note.tick < previousTick) return 'notes are not sorted by tick';
    if (!Number.isInteger(note.durTicks) || note.durTicks < 1) return 'durTicks must be an integer >= 1';
    if (seenIds.has(note.id)) return 'duplicate id ' + String(note.id);
    return lanesProblem(note.lanes);
  }

  /** Throws E-INP-012 for an unsorted chart, bad lanes or duplicate ids (Part 6.9.5). */
  function validateChart(chart) {
    if (!chart || !Array.isArray(chart.notes)) throw codedError('E-INP-012', 'chart has no notes array');
    const seenIds = new Set();
    let previousTick = 0;
    chart.notes.forEach((note, index) => {
      const problem = noteProblem(note, previousTick, seenIds);
      if (problem) throw codedError('E-INP-012', 'note ' + index + ': ' + problem);
      previousTick = note.tick;
      seenIds.add(note.id);
    });
  }

  function laneMaskOf(lanes) {
    return lanes.reduce((mask, lane) => mask | (1 << lane), 0);
  }

  function buildNotes(chart) {
    return chart.notes.map((ref, idx) => ({
      ref,
      idx,
      lanes: Object.freeze(ref.lanes.slice()),
      laneMask: laneMaskOf(ref.lanes),
      isChord: ref.lanes.length > 1,
      hasTail: ref.isHold === true,
      headJudged: false,
      tailJudged: false
    }));
  }

  function buildLaneIndex(notes) {
    const byLane = [[], [], [], []];
    notes.forEach((note) => note.lanes.forEach((lane) => byLane[lane].push(note.idx)));
    return byLane;
  }

  // ---------------------------------------------------------------------------------------------
  // Sections (Part 6.9.4 F)
  // ---------------------------------------------------------------------------------------------
  function markerSections(song) {
    const markers = (song.markers || []).map((marker, index) => ({ marker, index }))
      .filter((item) => item.marker.kind === 'section')
      .sort((a, b) => (a.marker.tick - b.marker.tick) || (a.index - b.index))
      .map((item) => ({ label: item.marker.label, startTick: item.marker.tick }));
    const isNewTick = (section, index) => index === 0 || section.startTick !== markers[index - 1].startTick;
    const unique = markers.filter(isNewTick);
    if (unique.length > 0 && unique[0].startTick > 0) unique.unshift({ label: 'Intro', startTick: 0 });
    return unique;
  }

  function barSections(song, endTick) {
    const barCount = song.meterMap.barCount(endTick);
    const sections = [];
    for (let first = 0; first < barCount; first += BARS_PER_SECTION) {
      sections.push({
        label: 'Bars ' + (first + 1) + '-' + (first + BARS_PER_SECTION),
        startTick: song.meterMap.tickOfBar(first)
      });
    }
    return sections;
  }

  /** Markers of kind 'section', else every 4 bars. @returns {[{index,label,startTick,endTick}]} */
  function sectionsOf(song, minEndTick) {
    const endTick = Math.max(song.durationTicks || 0, minEndTick || 0);
    const markers = markerSections(song);
    const starts = markers.length > 0 ? markers : barSections(song, endTick);
    return starts.map((section, index) => {
      const next = starts[index + 1];
      return {
        index,
        label: section.label,
        startTick: section.startTick,
        endTick: next ? next.startTick : Math.max(endTick, section.startTick)
      };
    });
  }

  /** Index of the last section whose startTick is <= tick (binary search). */
  function sectionIndexAt(sections, tick) {
    let low = 0;
    let high = sections.length - 1;
    while (low < high) {
      const middle = Math.ceil((low + high) / 2);
      if (sections[middle].startTick <= tick) low = middle;
      else high = middle - 1;
    }
    return low;
  }

  function wholeSongSection(endTick) {
    return [{ index: 0, label: 'Song', startTick: 0, endTick }];
  }

  /** Section list, per-note section index (a tail belongs to its head's section) and per-section totals. */
  function planSections(song, notes) {
    const lastEnd = notes.reduce((end, note) => Math.max(end, note.ref.tick + note.ref.durTicks), 0);
    const sections = song ? sectionsOf(song, lastEnd) : wholeSongSection(lastEnd);
    const noteSection = new Int32Array(notes.length);
    const totals = sections.map(() => 0);
    notes.forEach((note) => {
      const index = sectionIndexAt(sections, note.ref.tick);
      noteSection[note.idx] = index;
      totals[index] += note.hasTail ? 2 : 1;
    });
    const withTotals = sections.map((section, index) => Object.assign({}, section, { total: totals[index] }));
    return { sections: withTotals, noteSection };
  }

  // ---------------------------------------------------------------------------------------------
  // Score (Part 6.9.4 E)
  // ---------------------------------------------------------------------------------------------
  function blankCounts() {
    return { perfect: 0, great: 0, good: 0, miss: 0 };
  }

  function multiplierFor(combo) {
    return Math.min(SCORING.maxMultiplier, 1 + Math.floor(combo / SCORING.comboPerStep));
  }

  function accuracyOf(pointsSum, judged) {
    return judged === 0 ? 0 : pointsSum / (POINTS.perfect * judged);
  }

  function completionOf(judged, total) {
    return total === 0 ? 0 : judged / total;
  }

  /** Integer scoring accumulator. `sections` is [{index,label,startTick,endTick,total}]. */
  function createScore(total, sections) {
    const sectionData = sections.map((section) => Object.assign({}, section, {
      judged: 0, pointsSum: 0, counts: blankCounts()
    }));
    const data = {
      score: 0, combo: 0, maxCombo: 0, judged: 0, pointsSum: 0, stray: 0, holdBreaks: 0, lastStrayLane: null,
      counts: blankCounts(), deltaSum: 0, absDeltaSum: 0, deltaCount: 0, early: 0, late: 0
    };

    function recordDelta(deltaMs) {
      data.deltaSum += deltaMs;
      data.absDeltaSum += Math.abs(deltaMs);
      data.deltaCount += 1;
      if (deltaMs < 0) data.early += 1;
      if (deltaMs > 0) data.late += 1;
    }

    function recordSection(judgment, points, sectionIndex) {
      const section = sectionData[sectionIndex];
      if (!section) return;
      section.judged += 1;
      section.pointsSum += points;
      section.counts[judgment] += 1;
    }

    /** Applies one head or tail judgment; points use the combo before this note. */
    function apply(judgment, deltaMs, sectionIndex, isHoldBreak) {
      const points = POINTS[judgment];
      data.score += points * multiplierFor(data.combo);
      data.pointsSum += points;
      data.counts[judgment] += 1;
      data.judged += 1;
      recordSection(judgment, points, sectionIndex);
      if (judgment === 'miss') {
        data.combo = 0;
        if (isHoldBreak) data.holdBreaks += 1;
        return;
      }
      data.combo += 1;
      data.maxCombo = Math.max(data.maxCombo, data.combo);
      recordDelta(deltaMs);
    }

    /** A press with no note to judge: counted, no points; the combo drops by 1 only with the 'combo' penalty. */
    function addStray(lane, penalty) {
      data.stray += 1;
      data.lastStrayLane = lane;
      if (penalty === 'combo') data.combo = Math.max(0, data.combo - 1);
    }

    function state() {
      return {
        score: data.score,
        combo: data.combo,
        maxCombo: data.maxCombo,
        counts: Object.assign({}, data.counts),
        judged: data.judged,
        total,
        accuracy: accuracyOf(data.pointsSum, data.judged),
        completion: completionOf(data.judged, total),
        pointsSum: data.pointsSum,
        stray: data.stray,
        holdBreaks: data.holdBreaks,
        lastStrayLane: data.lastStrayLane
      };
    }

    function sectionStats() {
      return sectionData.map((section) => Object.assign({}, section, {
        counts: Object.assign({}, section.counts),
        accuracy: accuracyOf(section.pointsSum, section.judged)
      }));
    }

    function deltaStats() {
      const mean = (sum) => (data.deltaCount > 0 ? roundMs(sum / data.deltaCount) : 0);
      return {
        earlyCount: data.early,
        lateCount: data.late,
        meanDeltaMs: mean(data.deltaSum),
        absMeanDeltaMs: mean(data.absDeltaSum)
      };
    }

    return Object.freeze({ apply, addStray, state, sectionStats, deltaStats });
  }

  /** Lowest accuracy among sections with enough judgments; ties go to the earlier section. */
  function worstSectionIndex(sectionStats) {
    let worst = null;
    sectionStats.forEach((section) => {
      if (section.judged < MIN_SECTION_JUDGED) return;
      if (worst === null || section.accuracy < worst.accuracy) worst = section;
    });
    return worst === null ? null : worst.index;
  }

  // ---------------------------------------------------------------------------------------------
  // PerformanceSummary (Part 6.9.2, 6.9.4 G)
  // ---------------------------------------------------------------------------------------------
  const PerformanceSummary = Object.freeze({
    VERSION: 1,
    /** parts: {chart, song, meta, preset, comparable, calibration, strayPenalty, score}; score is a createScore(). */
    build(parts) {
      const state = parts.score.state();
      const sections = parts.score.sectionStats();
      const meta = parts.meta || {};
      const chart = parts.chart;
      return Object.assign({
        version: PerformanceSummary.VERSION,
        songId: meta.songId !== undefined ? meta.songId : (parts.song ? parts.song.id : null),
        chartId: meta.chartId !== undefined ? meta.chartId : chart.id,
        trackId: chart.trackId !== undefined ? chart.trackId : null,
        difficulty: chart.difficulty !== undefined ? chart.difficulty : null,
        profile: chart.profile !== undefined ? chart.profile : null,
        settingsHash: chart.settingsHash !== undefined ? chart.settingsHash : null,
        windowsPreset: parts.preset,
        comparable: parts.comparable,
        calibration: {
          inputOffsetMs: parts.calibration.inputOffsetMs,
          audioLatencyMs: parts.calibration.audioLatencyMs
        },
        strayPenalty: parts.strayPenalty
      }, state, parts.score.deltaStats(), {
        sections,
        worstSectionIndex: worstSectionIndex(sections),
        startedAt: meta.startedAt !== undefined ? meta.startedAt : null,
        completedAt: meta.completedAt !== undefined ? meta.completedAt : null,
        durationSec: meta.durationSec !== undefined ? meta.durationSec : null
      });
    }
  });

  // ---------------------------------------------------------------------------------------------
  // Shared calibration (Part 5.12): the one stored copy; each bound Judge applies it once in setCalibration
  // ---------------------------------------------------------------------------------------------
  let sharedCalibration = normalizeCalibration({}, {});
  const followingJudges = new Set();

  function calibration() {
    return Object.assign({}, sharedCalibration);
  }

  /** Stores the calibration (missing keys keep their value) and hands it to every bound Judge. */
  function setCalibration(given) {
    sharedCalibration = normalizeCalibration(given, sharedCalibration);
    followingJudges.forEach((judge) => judge.setCalibration(sharedCalibration));
    return calibration();
  }

  // ---------------------------------------------------------------------------------------------
  // The Judge
  // ---------------------------------------------------------------------------------------------
  /** opts: {timeMap, strayPenalty, windowsPreset, bus, input, kind, followCalibration}; see Part 6.9.2. */
  function createJudge(opts) {
    const settings = opts || {};
    const bus = settings.bus || Core.bus;
    const input = settings.input || FLM.Input || NO_INPUT;
    const timeMap = settings.timeMap || FLM.Transport.main;
    const strayPenalty = settings.strayPenalty === undefined ? 'none' : settings.strayPenalty;
    const defaultPreset = settings.windowsPreset === undefined ? 'standard' : settings.windowsPreset;
    const kind = settings.kind || 'instrument';
    const owner = { module: 'Rhythm' };
    Core.assert(STRAY_PENALTIES.includes(strayPenalty), 'strayPenalty must be none or combo');
    Core.assert(hasOwn(PRESETS, defaultPreset), 'windowsPreset must be standard, relaxed or strict');

    let loaded = null;             // {chart, song, notes, byLane, sections, noteSection, total}; survives restart()
    let run = null;                // everything restart() clears
    let windows = null;
    let preset = defaultPreset;
    let baseDifficulty = null;
    let judgeCalibration = { inputOffsetMs: 0, audioLatencyMs: 0 };
    let offsetSec = 0;             // the ONLY calibration value the Judge uses (S-04)
    let active = false;
    let attached = false;
    let disposed = false;
    const api = {};

    // ---- small accessors -------------------------------------------------------------------------
    const goodMs = () => windows.good;
    const noteTime = (note) => timeMap.audioTimeAt(note.ref.tick);
    const endTime = (note) => timeMap.audioTimeAt(note.ref.tick + note.ref.durTicks);

    function isAnchored() {
      return Number.isFinite(timeMap.audioTimeAt(0));
    }

    function isReady() {
      return loaded !== null && !disposed;
    }

    function freshRun() {
      loaded.notes.forEach((note) => {
        note.headJudged = false;
        note.tailJudged = !note.hasTail;
      });
      return {
        missCursor: 0,
        laneCursor: [0, 0, 0, 0],
        pending: new Map(),
        holds: new Map(),
        held: new Set(),
        results: [],
        log: [],
        score: createScore(loaded.total, loaded.sections),
        finished: false,
        calibrationChanged: false,
        began: false                 // true once the judge was active: a change while paused still counts
      };
    }

    function comparable() {
      return preset === 'standard' && strayPenalty === 'none' && !run.calibrationChanged;
    }

    // ---- events ----------------------------------------------------------------------------------
    function currentSectionIndex() {
      const { notes, noteSection, sections } = loaded;
      if (run.missCursor < notes.length) return noteSection[run.missCursor];
      return sections.length - 1;
    }

    function emitScore(sectionIndex) {
      const payload = Object.assign(run.score.state(), { chartId: loaded.chart.id, sectionIndex });
      bus.emit('score.update', payload);
    }

    /** Scores one head or tail judgment, then emits judge.result before score.update (one HUD frame). */
    function record(note, part, judgment, deltaMs, tInput, isHoldBreak) {
      const sectionIndex = loaded.noteSection[note.idx];
      run.score.apply(judgment, deltaMs, sectionIndex, isHoldBreak === true);
      const result = Object.freeze({
        noteId: note.ref.id,
        judgment,
        deltaMs,
        tInput,
        part,
        lanes: note.lanes,
        tick: part === 'tail' ? note.ref.tick + note.ref.durTicks : note.ref.tick,
        combo: run.score.state().combo,
        isHold: note.hasTail,
        holdPhase: note.hasTail ? part : null
      });
      run.results.push(result);
      bus.emit('judge.result', result);
      emitScore(sectionIndex);
      return result;
    }

    function recordStray(lane) {
      run.score.addStray(lane, strayPenalty);
      emitScore(currentSectionIndex());
    }

    // ---- holds (Part 6.9.4 C) --------------------------------------------------------------------
    function recordTail(note, judgment, deltaMs, tInput, isHoldBreak) {
      note.tailJudged = true;
      return record(note, 'tail', judgment, deltaMs, tInput, isHoldBreak);
    }

    function startHold(note) {
      const degenerate = endTime(note) <= noteTime(note) + ZERO_LENGTH_HOLD_SECONDS;
      if (degenerate) {
        recordTail(note, 'perfect', 0, null, false);
        return;
      }
      run.holds.set(note.idx, { note, lanesHeld: note.laneMask });
    }

    /** The first released lane of a hold ends it: judged with the same windows, or a hold break when too early. */
    function releaseHold(hold, tAdj, tInput) {
      run.holds.delete(hold.note.idx);
      const releaseDelta = deltaMsBetween(tAdj, endTime(hold.note));
      if (releaseDelta < -goodMs()) return recordTail(hold.note, 'miss', releaseDelta, tInput, true);
      return recordTail(hold.note, judgmentFor(Math.abs(releaseDelta), windows), releaseDelta, tInput, false);
    }

    function heldMask() {
      let mask = 0;
      run.held.forEach((lane) => { mask |= 1 << lane; });
      return mask;
    }

    /** Holding through the end is the ideal: perfect, and a late release is never penalized. */
    function completeHold(hold) {
      run.holds.delete(hold.note.idx);
      const stillHeld = (hold.lanesHeld & heldMask()) === hold.lanesHeld;
      if (stillHeld) return [recordTail(hold.note, 'perfect', 0, null, false)];
      return [recordTail(hold.note, 'miss', null, null, true)];
    }

    // ---- deterministic ordering (Part 6.9.4 A) ---------------------------------------------------
    function isWindowClosed(baseTime, tLimit) {
      return deltaMsBetween(tLimit, baseTime) > goodMs();
    }

    function declareMiss(note) {
      run.missCursor += 1;
      run.pending.delete(note.idx);
      note.headJudged = true;
      const results = [record(note, 'head', 'miss', null, null, false)];
      // A missed hold head cannot be held, so its tail is missed with it; `total` counts both.
      if (note.hasTail) results.push(recordTail(note, 'miss', null, null, false));
      return results;
    }

    function dueMiss(tLimit) {
      const { notes } = loaded;
      while (run.missCursor < notes.length && notes[run.missCursor].headJudged) run.missCursor += 1;
      if (run.missCursor >= notes.length) return null;
      const note = notes[run.missCursor];
      const time = noteTime(note);
      return isWindowClosed(time, tLimit) ? { time, declare: () => declareMiss(note) } : null;
    }

    function dueHold(tLimit) {
      let earliest = null;
      run.holds.forEach((hold) => {
        const time = endTime(hold.note);
        if (!isWindowClosed(time, tLimit)) return;
        if (earliest === null || time < earliest.time) earliest = { time, declare: () => completeHold(hold) };
      });
      return earliest;
    }

    /** Next window to close: a miss and a hold end are taken in close-time order, so tick cadence never matters. */
    function nextDue(tLimit) {
      const miss = dueMiss(tLimit);
      const hold = dueHold(tLimit);
      if (!hold) return miss;
      if (!miss) return hold;
      return miss.time <= hold.time ? miss : hold;
    }

    /** Declares every miss and hold completion whose window closed before tLimit; returns the results. */
    function advance(tLimit) {
      const declared = [];
      let due = nextDue(tLimit);
      while (due) {
        declared.push(...due.declare());
        due = nextDue(tLimit);
      }
      return declared;
    }

    // ---- input (Part 6.9.4 B) --------------------------------------------------------------------
    function skipJudgedHeads(lane) {
      const indexes = loaded.byLane[lane];
      let cursor = run.laneCursor[lane];
      while (cursor < indexes.length && loaded.notes[indexes[cursor]].headJudged) cursor += 1;
      run.laneCursor[lane] = cursor;
      return cursor;
    }

    /** Nearest unjudged note of the lane inside the good window; ties go to the earlier tick. */
    function findCandidate(lane, tAdj) {
      const indexes = loaded.byLane[lane];
      let best = null;
      for (let position = skipJudgedHeads(lane); position < indexes.length; position += 1) {
        const note = loaded.notes[indexes[position]];
        if (note.headJudged) continue;
        const deltaMs = deltaMsBetween(tAdj, noteTime(note));
        if (deltaMs < -goodMs()) break;             // notes ascend in time: every later one is further ahead
        if (deltaMs > goodMs()) continue;
        if (best === null || Math.abs(deltaMs) < Math.abs(best.deltaMs)) best = { note, deltaMs };
      }
      return best;
    }

    function hitHead(note, deltaMs, tInput) {
      note.headJudged = true;
      const result = record(note, 'head', judgmentFor(Math.abs(deltaMs), windows), deltaMs, tInput, false);
      if (note.hasTail) startHold(note);
      return result;
    }

    function worstDelta(deltas) {
      return deltas.reduce((worst, delta) => (Math.abs(delta) >= Math.abs(worst) ? delta : worst));
    }

    /** A chord needs every lane within the tolerance of its first press; partial presses wait or miss. */
    function pressChord(note, lane, tAdj, deltaMs, tInput) {
      const bit = 1 << lane;
      const pending = run.pending.get(note.idx);
      if (!pending) {
        run.pending.set(note.idx, { firstTAdj: tAdj, lanesPressed: bit, deltas: [deltaMs] });
        return null;
      }
      if (pending.lanesPressed & bit) return null;                       // duplicate lane press: not a stray
      if (deltaMsBetween(tAdj, pending.firstTAdj) > CHORD_TOLERANCE_MS) {
        recordStray(lane);
        return null;
      }
      pending.lanesPressed |= bit;
      pending.deltas.push(deltaMs);
      if (pending.lanesPressed !== note.laneMask) return null;
      run.pending.delete(note.idx);
      return hitHead(note, worstDelta(pending.deltas), tInput);
    }

    function handlePress(lane, tAdj, tInput) {
      run.held.add(lane);
      const candidate = findCandidate(lane, tAdj);
      if (!candidate) {
        recordStray(lane);
        return null;
      }
      const { note, deltaMs } = candidate;
      if (note.isChord) return pressChord(note, lane, tAdj, deltaMs, tInput);
      return hitHead(note, deltaMs, tInput);
    }

    function handleRelease(lane, tAdj, tInput) {
      run.held.delete(lane);
      const bit = 1 << lane;
      Array.from(run.holds.values()).filter((hold) => hold.lanesHeld & bit)
        .forEach((hold) => releaseHold(hold, tAdj, tInput));
      return null;
    }

    function logInput(evt, ignored) {
      const entry = {
        source: evt.source, control: evt.control, type: evt.type, tPerf: evt.tPerf, tAudio: evt.tAudio,
        pressure: evt.pressure
      };
      if (ignored) entry.ignored = true;
      run.log.push(entry);
    }

    function onInput(evt) {
      if (!isReady() || !evt) return null;
      const lane = laneOf(evt.control);
      const isEdge = evt.type === 'press' || evt.type === 'release';
      if (lane < 0 || !isEdge) return null;
      logInput(evt, !active);
      if (!active) return null;                                         // paused: no stray, no judgment (P 5.2)
      if (!Number.isFinite(evt.tAudio)) {
        Log.once('RHY_NO_TAUDIO', 'warn', 'rhythm', 'RHY_NO_TAUDIO', { control: evt.control });
        return null;
      }
      if (!isAnchored()) return null;
      const tAdj = evt.tAudio - offsetSec;                              // calibration is applied here and nowhere else
      advance(tAdj);
      if (evt.type === 'release') return handleRelease(lane, tAdj, evt.tAudio);
      return handlePress(lane, tAdj, evt.tAudio);
    }

    function tick(audioNow) {
      if (!isReady() || !active || !Number.isFinite(audioNow) || !isAnchored()) return [];
      return advance(audioNow - offsetSec);
    }

    // ---- activity, pause and resume (Part 6.9.4 C.4) ---------------------------------------------
    function lanesFromInput() {
      return input.held().map(laneOf).filter((lane) => lane >= 0);
    }

    function resumeTime() {
      const canRead = typeof timeMap.position === 'function' && isAnchored();
      return canRead ? timeMap.audioTimeAt(timeMap.position()) : null;
    }

    /** Lanes no longer physically held are released at the resume position; lanes still held carry on. */
    function resumeHolds(resumeAt, heldLanes) {
      run.held = new Set(heldLanes);
      if (!Number.isFinite(resumeAt)) return;
      advance(resumeAt);
      Array.from(run.holds.values()).forEach((hold) => {
        const lost = (hold.lanesHeld & ~heldMask()) !== 0;
        if (lost) releaseHold(hold, resumeAt, null);
      });
    }

    /** options (both optional): {tAudio, held:[lane]}; replay passes the logged values, the mode passes none. */
    function setActive(on, options) {
      const next = Boolean(on);
      if (!isReady() || next === active) return;
      const given = options || {};
      const resumeAt = next ? (given.tAudio !== undefined ? given.tAudio : resumeTime()) : given.tAudio;
      const heldLanes = next ? (given.held !== undefined ? given.held : lanesFromInput()) : [];
      active = next;
      if (next) run.began = true;
      run.log.push({ marker: 'active', on: next, tAudio: Number.isFinite(resumeAt) ? resumeAt : null,
        held: heldLanes.slice() });
      if (next) resumeHolds(resumeAt, heldLanes);
    }

    // ---- loading, windows and calibration --------------------------------------------------------
    function narrowestAllowed() {
      const name = hasOwn(WINDOWS, baseDifficulty) ? baseDifficulty : NARROWEST_DIFFICULTY;
      return windowsFor(name, 'strict');
    }

    /** Custom windows may not be narrower than the strict table (UT-09-24); named presets are taken as given. */
    function setWindows(given, presetName) {
      const name = presetName === undefined ? CUSTOM_PRESET : presetName;
      const known = name === CUSTOM_PRESET || hasOwn(PRESETS, name);
      if (!known) throw codedError('E-INP-011', 'unknown preset ' + String(name));
      if (!validWindows(given)) throw codedError('E-INP-011', 'windows need ascending positive perfect, great, good');
      const floor = narrowestAllowed();
      const tooNarrow = name === CUSTOM_PRESET
        && (given.perfect < floor.perfect || given.great < floor.great || given.good < floor.good);
      if (tooNarrow) throw codedError('E-INP-011', 'custom windows are narrower than the strict table');
      windows = { perfect: given.perfect, great: given.great, good: given.good };
      preset = name;
    }

    /** Resolves the windows argument of load(): a difficulty name, a windows object, or the chart's difficulty. */
    function windowsForLoad(chart, windowsOrDifficulty) {
      const choice = windowsOrDifficulty === undefined ? chart.difficulty : windowsOrDifficulty;
      if (typeof choice === 'string') return { windows: windowsFor(choice, defaultPreset), difficulty: choice };
      if (!validWindows(choice)) throw codedError('E-INP-011', 'load needs a difficulty name or valid windows');
      return { windows: choice, difficulty: hasOwn(WINDOWS, chart.difficulty) ? chart.difficulty : null };
    }

    /** Validates first, so a failing load leaves the previous chart loaded (UT-09-02). */
    function load(chart, song, windowsOrDifficulty) {
      Core.assert(!disposed, 'Judge was disposed');
      validateChart(chart);
      const chosen = windowsForLoad(chart, windowsOrDifficulty);
      const notes = buildNotes(chart);
      const plan = planSections(song, notes);
      loaded = {
        chart, song, notes, byLane: buildLaneIndex(notes), sections: plan.sections, noteSection: plan.noteSection,
        total: notes.length + notes.filter((note) => note.hasTail).length
      };
      baseDifficulty = chosen.difficulty;
      windows = null;
      if (typeof windowsOrDifficulty === 'object' && windowsOrDifficulty !== null) {
        setWindows(chosen.windows, defaultPreset);
      } else {
        windows = chosen.windows;
        preset = defaultPreset;
      }
      run = freshRun();
      emitScore(0);
    }

    /** The ONLY application point of calibration: offsetSec is read from it here and nowhere else. */
    function setCalibrationValues(given) {
      const next = normalizeCalibration(given, judgeCalibration);
      const unchanged = next.inputOffsetMs === judgeCalibration.inputOffsetMs
        && next.audioLatencyMs === judgeCalibration.audioLatencyMs;
      if (unchanged || disposed) return;
      judgeCalibration = { inputOffsetMs: next.inputOffsetMs, audioLatencyMs: next.audioLatencyMs };
      offsetSec = (next.inputOffsetMs + next.audioLatencyMs) / MS_PER_SECOND;
      if (!run) return;
      run.log.push({ marker: 'calibration', inputOffsetMs: next.inputOffsetMs, audioLatencyMs: next.audioLatencyMs });
      // E 4.1: earlier results keep their value; the run is no longer comparable.
      if (active || run.began) run.calibrationChanged = true;
    }

    // ---- results, summary, restart, finish -------------------------------------------------------
    function summary(meta) {
      Core.assert(isReady(), 'Judge has no chart loaded');
      return PerformanceSummary.build({
        chart: loaded.chart, song: loaded.song, meta, preset, comparable: comparable(), calibration: judgeCalibration,
        strayPenalty, score: run.score
      });
    }

    function restart() {
      if (!isReady()) return;
      run = freshRun();
      emitScore(0);
    }

    function finish(endedBy, meta) {
      Core.assert(ENDED_BY.includes(endedBy), 'finish needs end, user, fail or net');
      if (!isReady() || run.finished) return;
      run.finished = true;
      bus.emit('chart.finished', { chartId: loaded.chart.id, kind, summary: summary(meta), endedBy });
    }

    function nextNotes(lane, count) {
      if (!isReady() || lane < 0 || lane >= LANE_COUNT) return [];
      const indexes = loaded.byLane[lane];
      const upcoming = [];
      for (let position = skipJudgedHeads(lane); position < indexes.length && upcoming.length < count; position += 1) {
        const note = loaded.notes[indexes[position]];
        if (!note.headJudged) upcoming.push(note.ref);
      }
      return upcoming;
    }

    function cursor() {
      if (!isReady()) return { noteIndex: 0, lanes: [0, 0, 0, 0] };
      return { noteIndex: run.missCursor, lanes: run.laneCursor.map((unused, lane) => skipJudgedHeads(lane)) };
    }

    // ---- bus subscription and lifetime -----------------------------------------------------------
    function onInputEvent(evt) {
      onInput(evt);
    }

    function attach() {
      if (attached || disposed) return;
      attached = true;
      bus.on('input.event', onInputEvent, owner);
    }

    function detach() {
      if (!attached) return;
      attached = false;
      bus.off('input.event', onInputEvent);
    }

    function dispose() {
      detach();
      followingJudges.delete(api);
      disposed = true;
      active = false;
      loaded = null;
      run = null;
    }

    const readState = (read) => (isReady() ? read() : null);

    Object.assign(api, {
      load, setCalibration: setCalibrationValues, setWindows, attach, detach, setActive, onInput, tick, restart,
      finish, summary, nextNotes, cursor, dispose,
      state: () => readState(() => run.score.state()),
      sections: () => readState(() => run.score.sectionStats()),
      results: () => readState(() => run.results.slice()),
      inputLog: () => readState(() => run.log.map((entry) => Object.assign({}, entry)))
    });
    if (settings.followCalibration !== false) {
      followingJudges.add(api);
      setCalibrationValues(sharedCalibration);
    }
    return Object.freeze(api);
  }

  /** Part 4.1 `Judge.bind`; Part 4.7.1 step 8 follows it with load(), setCalibration() and attach(). */
  const Judge = Object.freeze({ bind: createJudge });

  // ---------------------------------------------------------------------------------------------
  // Replay (Part 6.9.4 H)
  // ---------------------------------------------------------------------------------------------
  function replayEntry(judge, entry) {
    if (entry.marker === 'active') judge.setActive(entry.on, { tAudio: entry.tAudio, held: entry.held });
    else if (entry.marker === 'calibration') judge.setCalibration(entry);
    else if (!entry.ignored) judge.onInput(entry);
  }

  function lastEventTime(inputLog) {
    const later = (latest, entry) => (Number.isFinite(entry.tAudio) ? Math.max(latest, entry.tAudio) : latest);
    return inputLog.reduce(later, 0);
  }

  /** Judges a logged input against a chart with a fixed time map (speed 1, anchor 0). Deterministic. */
  function replay(chart, song, difficulty, inputLog, calibrationValues, opts) {
    const settings = opts || {};
    const tempoMap = song.tempoMap;
    const judge = createJudge({
      timeMap: {
        audioTimeAt: (tick) => tempoMap.ticksToSeconds(tick),
        tickAt: (seconds) => tempoMap.secondsToTicks(seconds)
      },
      strayPenalty: settings.strayPenalty,
      windowsPreset: settings.windowsPreset,
      bus: new Core.Emitter(),
      input: NO_INPUT,
      followCalibration: false
    });
    judge.load(chart, song, settings.windows !== undefined ? settings.windows : difficulty);
    judge.setCalibration(calibrationValues || {});
    judge.setActive(true, { tAudio: null, held: [] });
    inputLog.forEach((entry) => replayEntry(judge, entry));
    judge.tick(lastEventTime(inputLog) + REPLAY_TAIL_SECONDS);
    const outcome = { state: judge.state(), results: judge.results() };
    judge.dispose();
    return outcome;
  }

  return Object.freeze({
    WINDOWS,
    PRESETS,
    SCORING,
    POINTS,
    CHORD_TOLERANCE_MS,
    windowsFor,
    laneOf,
    judgmentFor,
    roundMs,
    Judge,
    Score: Object.freeze({ create: createScore, multiplierFor }),
    PerformanceSummary,
    sectionsOf,
    replay,
    calibration,
    setCalibration
  });
});
})();

    } catch (error) {
      removeText(key);
      Core.Log.warn('storage', 'damaged value removed: ' + key);
      return { found: false, value: undefined, damaged: true };
    }
  }

  /** @returns {*} the stored JSON value, or fallback when missing or damaged (the damaged record is removed) */
  function get(key, fallback) {
    const record = readJson(key);
    return record.found ? record.value : fallback;
  }

  /** @returns {{ok:boolean, error:(object|null)}} */
  function set(key, value) {
    let text = null;
    try {
      text = JSON.stringify(value);
    } catch (error) {
      text = null;
    }
    if (typeof text !== 'string') return failed(failure('E-STO-002', 'unserializable'));
    return writeText(key, text);
  }

  function remove(key) {
    removeText(key);
  }

  /** @returns {string[]} sorted key names under flm.v1. without the prefix */
  function keys() {
    const names = [];
    if (usesMemory()) return Array.from(state.memory.keys()).sort();
    try {
      for (let index = 0; index < state.ls.length; index += 1) {
        const key = state.ls.key(index);
        if (key && key.startsWith(KEY_PREFIX)) names.push(key.slice(KEY_PREFIX.length));
      }
    } catch (error) {
      Core.Log.warn('storage', 'key listing failed: ' + errorName(error));
    }
    return names.sort();
  }

  /** @returns {number} bytes used by flm.v1.* keys (UTF-16 code units x 2) */
  function usedBytes() {
    return keys().reduce((total, name) => {
      const text = readText(name);
      return total + (KEY_PREFIX.length + name.length + (text === null ? 0 : text.length)) * 2;
    }, 0);
  }

  /** @param {string=} kind 'local', 'idb' or omitted for either backend */
  function isAvailable(kind) {
    if (kind === 'local') return state.local.ok;
    if (kind === 'idb') return state.idb.ok;
    return state.local.ok || state.idb.ok;
  }

  // ---------------------------------------------------------------- settings document

  function leafPaths(node, prefix, out) {
    Object.keys(node).forEach((name) => {
      const path = prefix === '' ? name : prefix + '.' + name;
      if (isPlainObject(node[name]) && Object.keys(node[name]).length > 0) leafPaths(node[name], path, out);
      else out.push(path);
    });
    return out;
  }

  function readDocument(key) {
    const record = readJson(key);
    if (record.found && !isPlainObject(record.value)) {
      removeText(key);
      Core.Log.warn('storage', 'damaged value removed: ' + key);
      return { doc: null, damaged: true };
    }
    return { doc: record.found ? record.value : null, damaged: record.damaged };
  }

  // The live record first; on a missing or damaged one the .bak is tried (Part 4.3 B6).
  function readSettingsDocument() {
    const main = readDocument(KEYS.settings);
    if (main.doc) return { doc: main.doc, source: 'stored', damaged: false };
    const backup = readDocument(KEYS.settings + BAK_SUFFIX);
    if (backup.doc) return { doc: backup.doc, source: 'backup', damaged: main.damaged };
    return { doc: null, source: 'none', damaged: main.damaged || backup.damaged };
  }

  /**
   * Reads flm.v1.settings (the .bak when the live record is damaged). The document is returned as stored:
   * M-27 normalizes it. A missing or unreadable record returns null.
   * Emits: settings.changed {key:'*', source:'load'}
   * @returns {(object|null)}
   */
  function loadSettings() {
    const found = readSettingsDocument();
    state.settingsLoad = { source: found.source, damaged: found.damaged };
    const keysOfDocument = found.doc ? leafPaths(found.doc, '', []) : [];
    bus.emit('settings.changed', { key: '*', value: null, prev: null, source: 'load', keys: keysOfDocument });
    return found.doc;
  }

  function announceChange(change) {
    if (!change) return;
    Core.assert(SETTING_SOURCES.includes(change.source), 'unknown settings source ' + change.source);
    const payload = { key: change.key, value: change.value, prev: change.prev, source: change.source };
    if (Array.isArray(change.keys)) payload.keys = change.keys;
    bus.emit('settings.changed', payload);
  }

  /** Writes the pending settings document now. @returns {(object|null)} the write result, null when none pending */
  function writeSettingsNow() {
    const pending = state.settingsWrite;
    if (!pending) return null;
    state.settingsWrite = null;
    if (pending.timer !== null) Core.timers.clearTimeout(pending.timer);
    const result = writeText(KEYS.settings, pending.text);
    if (!result.ok) Core.Log.warn('storage', 'settings write failed', { code: result.error.code });
    pending.waiters.forEach((resolve) => resolve(result));
    return result;
  }

  /**
   * Emits `change` at once, then safe-writes the document (debounced; 0 writes immediately). One write covers
   * every call made while it waits.
   * Emits: settings.changed
   * @returns {Promise<{ok:boolean, error:(object|null)}>} resolves after the write
   */
  function saveSettings(doc, change, opts) {
    announceChange(change);
    const delay = opts && Number.isFinite(opts.debounceMs) ? Math.max(0, opts.debounceMs) : SETTINGS_DEBOUNCE_MS;
    return new Promise((resolve) => {
      const pending = state.settingsWrite || { text: '', timer: null, waiters: [] };
      state.settingsWrite = pending;
      pending.text = JSON.stringify(doc);
      pending.waiters.push(resolve);
      if (delay === 0) writeSettingsNow();
      else if (pending.timer === null) pending.timer = Core.timers.setTimeout(writeSettingsNow, delay, OWNER);
    });
  }

  /** Writes a pending debounced settings document now (pagehide, tests). */
  function flushSettings() {
    return Promise.resolve(writeSettingsNow() || RESULT_OK);
  }

  // ---------------------------------------------------------------- export, download, files

  /** @returns {{ok:boolean, blob:(Blob|null), error:(object|null)}} E-EXP-006 above 256 MB */
  function exportBlob(data, mimeType) {
    const blob = data instanceof Blob ? data : new Blob([data], { type: mimeType || 'application/octet-stream' });
    if (blob.size > EXPORT_CAP_BYTES) return { ok: false, blob: null, error: failure('E-EXP-006', null) };
    return { ok: true, blob, error: null };
  }

  /** Letters, digits, dot, underscore, space and hyphen only; runs collapsed; 80 characters with the extension. */
  function sanitizeFileName(fileName) {
    const cleaned = String(fileName).replace(/[^A-Za-z0-9._ -]/g, '_').replace(/_{2,}/g, '_');
    const dot = cleaned.lastIndexOf('.');
    const extension = dot > 0 ? cleaned.slice(dot, dot + EXTENSION_LIMIT) : '';
    const base = dot > 0 ? cleaned.slice(0, dot) : cleaned;
    const name = base.slice(0, FILE_NAME_LIMIT - extension.length) + extension;
    return name === '' ? 'download' : name;
  }

  function isIosSafari() {
    const nav = window.navigator;
    const agent = String(nav.userAgent || '');
    const iPadOs = nav.platform === 'MacIntel' && nav.maxTouchPoints > 1;
    return /iPad|iPhone|iPod/.test(agent) || iPadOs;
  }

  function revokePendingUrls() {
    state.pendingUrls.forEach((url) => window.URL.revokeObjectURL(url));
    state.pendingUrls = [];
  }

  function downloadByAnchor(blob, name) {
    revokePendingUrls();                     // no timer: the previous URL is released at the next download
    const url = window.URL.createObjectURL(blob);
    const anchor = window.document.createElement('a');
    anchor.href = url;
    anchor.download = name;
    anchor.rel = 'noopener';
    window.document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    state.pendingUrls.push(url);
    return { ok: true, method: 'anchor', error: null };
  }

  function readAsDataUrl(blob) {
    return new Promise((resolve) => {
      const reader = new window.FileReader();
      reader.onload = () => resolve(typeof reader.result === 'string' ? reader.result : null);
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(blob);
    });
  }

  // Fallback for browsers that ignore the download attribute: a new tab with the data URL.
  async function downloadByDataUrl(blob) {
    if (blob.size > DATA_URL_CAP_BYTES) return { ok: false, method: 'none', error: failure('E-EXP-009', null) };
    const url = await readAsDataUrl(blob);
    const opened = url === null ? null : window.open(url, '_blank');
    if (!opened) return { ok: false, method: 'none', error: failure('E-EXP-005', null) };
    return { ok: true, method: 'dataUrl', error: null };
  }

  /**
   * Triggers a file download. Resolves when the click was dispatched; success is unknowable.
   * @param {string} fileName
   * @param {Blob|string|ArrayBuffer} data
   * @param {string=} mimeType
   * @returns {Promise<{ok:boolean, method:string, error:(object|null)}>} method 'anchor', 'dataUrl' or 'none'
   */
  async function download(fileName, data, mimeType) {
    const made = exportBlob(data, mimeType);
    if (!made.ok) return { ok: false, method: 'none', error: made.error };
    const name = sanitizeFileName(fileName);
    const anchorWorks = 'download' in window.HTMLAnchorElement.prototype && !isIosSafari();
    return anchorWorks ? downloadByAnchor(made.blob, name) : downloadByDataUrl(made.blob);
  }

  function ensureFileInput() {
    if (state.fileInput && state.fileInput.isConnected) return state.fileInput;
    const input = window.document.createElement('input');
    input.type = 'file';
    input.hidden = true;
    input.tabIndex = -1;
    input.setAttribute('aria-hidden', 'true');
    window.document.body.appendChild(input);
    state.fileInput = input;
    return input;
  }

  /**
   * Opens the file picker. Call it synchronously inside a click or key handler (gesture rule).
   * @param {{accept?:string[], multiple?:boolean}=} options
   * @returns {Promise<File[]>} [] when cancelled
   */
  function pickFile(options) {
    const config = options || {};
    return new Promise((resolve) => {
      const input = ensureFileInput();
      input.accept = Array.isArray(config.accept) ? config.accept.join(',') : '';
      input.multiple = config.multiple === true;
      const offs = [];
      let focusTimer = null;
      const finish = (files) => {
        offs.forEach((off) => off());
        if (focusTimer !== null) Core.timers.clearTimeout(focusTimer);
        input.value = '';                    // the same file can be chosen twice
        resolve(files);
      };
      const onChange = () => finish(Array.from(input.files || []));
      const onFocus = () => { focusTimer = Core.timers.setTimeout(() => finish([]), PICK_FOCUS_DELAY_MS, OWNER); };
      offs.push(Core.dom.on(input, 'change', onChange, undefined, OWNER));
      offs.push(Core.dom.on(input, 'cancel', () => finish([]), undefined, OWNER));
      offs.push(Core.dom.on(window, 'focus', onFocus, { once: true }, OWNER));
      input.click();
    });
  }

  function withTimeout(promise, limitMs) {
    return new Promise((resolve, reject) => {
      const timer = Core.timers.setTimeout(() => reject(new Error('timeout')), limitMs, OWNER);
      promise.then(
        (value) => { Core.timers.clearTimeout(timer); resolve(value); },
        (error) => { Core.timers.clearTimeout(timer); reject(error); }
      );
    });
  }

  /**
   * Size-checked file read: a file over maxBytes is refused before any read (E-IMP-001).
   * @param {File} file
   * @param {{as?:'arrayBuffer'|'text', maxBytes?:number}=} options
   * @returns {Promise<{ok:boolean, data:*, error:(object|null)}>}
   */
  async function readFile(file, options) {
    const config = options || {};
    const limit = Number.isFinite(config.maxBytes) ? config.maxBytes : DEFAULT_MAX_READ_BYTES;
    if (!file || file.size > limit) return { ok: false, data: null, error: failure('E-IMP-001', null) };
    try {
      const reading = config.as === 'text' ? file.text() : file.arrayBuffer();
      return { ok: true, data: await withTimeout(reading, READ_TIMEOUT_MS), error: null };
    } catch (error) {
      return { ok: false, data: null, error: failure('E-IMP-019', errorName(error)) };
    }
  }

  // ---------------------------------------------------------------- housekeeping

  /** Forgets the cached database handle (fault recovery); the next operation reopens it. */
  function reset() {
    closeDatabase();
  }

  /** For leak tests: open transactions, pending timers and listeners added by this module. */
  function counters() {
    return { tx: 0, timers: Core.timers.count(OWNER), listeners: state.offs.length };
  }

  // Tests only: drops pending writes, listeners and timers and returns to the unopened state.
  function teardownForTests() {
    const pending = state.settingsWrite;
    state.settingsWrite = null;
    if (pending) pending.waiters.forEach((resolve) => resolve(failed(failure('E-STO-002', 'teardown'))));
    releaseListeners();
    Core.timers.clearOwner(OWNER);
    closeDatabase();
    revokePendingUrls();
    if (state.fileInput) state.fileInput.remove();
    state.fileInput = null;
    state.memory.clear();
    Object.assign(state, {
      opened: false, mode: 'memory', isFile: false, ls: null, idbFactory: null, notice: null,
      local: { ok: false, error: null }, idb: { ok: false, error: null, openMs: 0 },
      settingsLoad: { source: 'none', damaged: false }
    });
  }

  return Object.freeze({
    DB_NAME,
    DB_VERSION,
    STORES,
    KEY_PREFIX,
    KEYS,
    open,
    state: status,
    isAvailable,
    get,
    set,
    remove,
    keys,
    usedBytes,
    loadSettings,
    /** @returns {{source:string, damaged:boolean}} how the last loadSettings found the record (M-27 uses it) */
    lastSettingsLoad: () => Object.assign({}, state.settingsLoad),
    saveSettings,
    flushSettings,
    exportBlob,
    download,
    pickFile,
    readFile,
    reset,
    counters,
    _teardownForTests: teardownForTests
  });
});
})();
