  // DLG-AudioBlocked: the enable button calls Audio.unlock() inside the click, then the dialog waits for
  // audio.unlocked (resolves 'enabled') and after 5 s says the sound is still blocked.
  function openAudioBlocked(params) {
    const token = Symbol('dlg-audio-blocked');
    const view = { status: null, finish: null, enable: null };
    const isUnlocked = () => Boolean(FLM.Audio) && typeof FLM.Audio.isUnlocked === 'function' &&
      FLM.Audio.isUnlocked();
    function tryUnlock() {
      if (!FLM.Audio || typeof FLM.Audio.unlock !== 'function') {
        view.status.textContent = say('S-AUD-03');
        return undefined;
      }
      view.status.textContent = say('dlg.audio.waiting');
      const attempt = FLM.Audio.unlock();      // inside the gesture, before any await
      Core.timers.setTimeout(() => { view.status.textContent = say('dlg.audio.blocked'); }, AUDIO_WAIT_MS, token);
      return Promise.resolve(attempt).then(() => { if (isUnlocked()) view.finish('enabled'); },
        () => { view.status.textContent = say('S-AUD-03'); });
    }
    const spec = { id: 'DLG-AudioBlocked', title: say('dlg.audio.title'),
      body: say('S-AUD-02') + ' ' + modeLabel(params.mode) + ' needs sound.',
      buttons: [{ id: 'cancel', label: say('dlg.cancel'), kind: 'secondary', isCancel: true }],
      build(container, finish) {
        view.finish = finish;
        view.enable = actionButton({ id: 'dlg-audio-enable', label: say('dlg.audio.enable'), kind: 'primary',
          onPress: tryUnlock });
        view.status = paragraph('', { id: 'dlg-audio-status', role: 'status' });
        addAll(container, [el('div', { class: 'btn-row' }, view.enable.root), view.status]);
      } };
    const shown = UI.dialog(spec);
    bus.on('audio.unlocked', () => view.finish('enabled'), token);
    view.enable.focus();
    return shown.then((result) => {
      bus.removeOwner(token);
      Core.timers.clearOwner(token);
      return result;
    });
  }

  // DLG-ResumeAudio: Audio.resume() runs inside the click, then the dialog closes with 'resume'.
  function openResumeAudio(params) {
    const detail = params.detail ? ' ' + params.detail : '';
    const view = { resume: null };
    const spec = { id: 'DLG-ResumeAudio', title: say('dlg.resume.title'), body: say('dlg.resume.body') + detail,
      buttons: [{ id: 'cancel', label: say('dlg.resume.cancel'), kind: 'secondary', isCancel: true }],
      build(container, finish) {
        const resume = () => {
          const attempt = FLM.Audio && typeof FLM.Audio.resume === 'function' ? FLM.Audio.resume() : undefined;
          return Promise.resolve(attempt).then(() => finish('resume'));
        };
        view.resume = actionButton({ id: 'dlg-resume', label: say('dlg.resume.enable'), kind: 'primary',
          onPress: resume });
        container.appendChild(el('div', { class: 'btn-row' }, view.resume.root));
      } };
    const shown = UI.dialog(spec);
    view.resume.focus();
    return shown;
  }

  // DLG-Unsupported: a disabled feature (title, reason) or the "returned to the menu" variant of showError().
  function openUnsupported(params) {
    const returned = params.variant === 'returned';
    const record = params.record || {};
    const operation = record.context && record.context.mode ? modeLabel(record.context.mode) : 'The last action';
    const title = returned ? say('dlg.returned.title', { operation }) :
      say('dlg.unsupported.title', { feature: params.feature });
    const body = returned ? [record.userMessage || record.message || '', say('dlg.returned.body')] : params.reason;
    const buttons = [Object.assign({ label: say('dlg.ok') }, OK_BUTTON)];
    if (returned) buttons.unshift({ id: 'copy', label: say('dlg.copy'), kind: 'secondary' });
    return UI.dialog({ id: 'DLG-Unsupported', title, body, buttons, alert: returned }).then((result) => {
      if (result === 'copy') copyDiagnostics(false);
      return result;
    });
  }

  function openImportSettings(params) {
    const shown = params.changes.slice(0, IMPORT_LIST_LIMIT);
    const rest = params.changes.length - shown.length;
    const lines = shown.map((change) => el('li', null, change.path));
    if (rest > 0) lines.push(el('li', null, say('dlg.importSettings.more', { count: rest })));
    return UI.dialog({ id: 'DLG-ImportSettings', title: say('dlg.importSettings.title'),
      body: say('dlg.importSettings.body', { file: params.file }),
      build: (container) => container.appendChild(el('ul', { id: 'dlg-import-changes' }, lines)),
      buttons: [{ id: 'apply', label: say('dlg.importSettings.apply'), kind: 'primary' },
        { id: 'cancel', label: say('dlg.cancel'), kind: 'secondary', isCancel: true, isDefault: true }] });
  }

  // params.scope 'controls' asks about the keys only; without it the question is about every setting.
  function openConfirmReset(params) {
    const part = params && params.scope === 'controls' ? 'dlg.resetControls' : 'dlg.reset';
    return UI.dialog({ id: 'DLG-ConfirmReset', title: say(part + '.title'), body: say(part + '.body'),
      consequence: say(part + '.consequence'),
      buttons: [{ id: 'reset', label: say(part + '.apply'), kind: 'danger' },
        { id: 'cancel', label: say('dlg.cancel'), kind: 'secondary', isCancel: true, isDefault: true }] });
  }

  // DLG-RemapConflict (Part 7.7): params {key, control, context, newControl, canMove}. Resolves 'swap' (use the key
  // for the new control), 'again' (capture another key) or 'cancel'. "Use for" is hidden when the other control
  // would be left without a key.
  function openRemapConflict(params) {
    const message = say(params.canMove ? 'dlg.remap.move' : 'dlg.remap.stuck', params);
    const buttons = [{ id: 'again', label: say('dlg.remap.again'), kind: 'secondary', isDefault: !params.canMove },
      { id: 'cancel', label: say('dlg.cancel'), kind: 'secondary', isCancel: true }];
    if (params.canMove) {
      buttons.unshift({ id: 'swap', label: say('dlg.remap.use', params), kind: 'primary', isDefault: true });
    }
    return UI.dialog({ id: 'DLG-RemapConflict', title: say('dlg.remap.title'), body: message, buttons });
  }

  // ---------------------------------------------------------------- DLG-Calibration (Part 6.27.4.22 and 7.7.1)
  // T03.09 delivers the "Watch and tap" step (input offset), the note speed preview and the summary. The "Listen
  // and tap" step needs the audio clicks of M-05 and is completed in T04.09; until then it can only be skipped.
  const CAL_TAP_COUNT = 12;            // flashes (or clicks) per step
  const CAL_IGNORED = 4;               // the first four are for getting into the rhythm
  const CAL_INTERVAL_MS = 667;         // 90 BPM
  const CAL_START_DELAY_MS = 1000;
  const CAL_MATCH_MS = 300;            // a tap counts for the nearest flash within this distance
  const CAL_MATCH_SHARE = 0.45;        // ... and never for more than this share of the beat (300 ms at 90 BPM)
  const CAL_END_MARGIN_MS = 100;       // the step ends this long after the last tap could still match
  const CAL_MIN_MATCHED = 6;
  const CAL_UNEVEN_MS = 40;            // an interquartile range above this shows S-CAL-02
  const CAL_FLASH_MS = 120;
  const CAL_PREVIEW_NOTES = 8;
  const CAL_PREVIEW_LANES = 4;
  const CAL_SPEED_STEP_MS = 50;
  const CAL_TAP_CONTROL = /^(lane|dance)[0-3]$/;
  const CAL_LIMITS = Object.freeze({ inputOffsetMs: [-200, 200], audioLatencyMs: [0, 500] });
  const QUARTILE = Object.freeze({ low: 0.25, middle: 0.5, high: 0.75 });

  function quantile(sorted, fraction) {
    const position = (sorted.length - 1) * fraction;
    const below = Math.floor(position);
    const above = Math.ceil(position);
    return sorted[below] + (sorted[above] - sorted[below]) * (position - below);
  }

  /** Tap minus flash (ms) for the flashes after the first four that have a tap within the match window. */
  function matchedDeltas(taps, targets, matchMs) {
    const deltas = [];
    targets.forEach((target, index) => {
      if (index < CAL_IGNORED) return;
      const near = taps.map((tap) => tap - target).filter((delta) => Math.abs(delta) <= matchMs);
      if (near.length === 0) return;
      deltas.push(near.reduce((best, delta) => (Math.abs(delta) < Math.abs(best) ? delta : best)));
    });
    return deltas;
  }

  /**
   * One tap step (Part 7.7.1): taps and targets in ms on one clock; matchMs is the distance a tap may be from
   * its flash (default 300 ms).
   * @returns {{status:'ok'|'few'|'uneven', medianMs:(number|null), iqrMs:(number|null), matched:number}}
   */
  function analyzeTaps(taps, targets, matchMs) {
    const distanceMs = matchMs === undefined ? CAL_MATCH_MS : matchMs;
    const sorted = matchedDeltas(taps, targets, distanceMs).sort((a, b) => a - b);
    if (sorted.length === 0) return { status: 'few', medianMs: null, iqrMs: null, matched: 0 };
    const iqrMs = quantile(sorted, QUARTILE.high) - quantile(sorted, QUARTILE.low);
    let status = 'ok';
    if (sorted.length < CAL_MIN_MATCHED) status = 'few';
    else if (iqrMs > CAL_UNEVEN_MS) status = 'uneven';
    return { status, medianMs: quantile(sorted, QUARTILE.middle), iqrMs, matched: sorted.length };
  }

  const clampRound = (value, limits) => Math.min(limits[1], Math.max(limits[0], Math.round(value)));

  /**
   * The wizard result (Part 7.7.1). measured: {audioMs, visualMs} step medians, null when the step was skipped. The
   * flash step holds only input and display delay (V); the click step adds the sound delay (A), so the sound delay is
   * A - V and the Judge offset (input offset + sound delay) equals A.
   */
  function calibrationFromMedians(measured, current) {
    const next = Object.assign({}, current);
    if (measured.visualMs === null) return next;
    next.inputOffsetMs = clampRound(measured.visualMs, CAL_LIMITS.inputOffsetMs);
    if (measured.audioMs !== null) {
      next.audioLatencyMs = clampRound(measured.audioMs - measured.visualMs, CAL_LIMITS.audioLatencyMs);
    }
    return next;
  }

  const signed = (value) => (value > 0 ? '+' + value : String(value));

  // params: {intervalMs, startDelayMs, onRunStart(targetsMs)} are test hooks; the player never sets them.
  function openCalibration(params) {
    const token = Symbol('dlg-calibration');
    const intervalMs = params.intervalMs || CAL_INTERVAL_MS;
    const startDelayMs = params.startDelayMs === undefined ? CAL_START_DELAY_MS : params.startDelayMs;
    const matchMs = Math.min(CAL_MATCH_MS, intervalMs * CAL_MATCH_SHARE);
    const view = { page: 'listen', values: Settings.calibration(), measured: { audioMs: null, visualMs: null },
      host: null, finish: null, handles: [], run: null, result: null, pad: null, status: null, notes: [],
      previewFrame: null, runFrame: null, runTimer: null, summaryLine: null };

    function keepHandle(handle) {
      view.handles.push(handle);
      return handle;
    }

    const stepButton = (id, label, onPress, kind, disabledReason) => keepHandle(actionButton({ id: 'cal-' + id,
      label: say(label), kind: kind || 'secondary', onPress, disabledReason })).root;

    function stopRun() {
      view.run = null;
      Core.raf.cancel(view.runFrame);
      Core.timers.clearTimeout(view.runTimer);
    }

    function disposePage() {
      stopRun();
      Core.raf.cancel(view.previewFrame);
      view.handles.forEach((handle) => handle.destroy());
      view.handles = [];
      view.host.textContent = '';
    }

    function goTo(page) {
      disposePage();
      view.page = page;
      PAGES[page]();
    }

    function showPage(title, body, nodes) {
      addAll(view.host, [el('h3', null, title), paragraph(body)].concat(nodes));
    }

    // ---- the tap run: flashes on a fixed beat, taps collected until the last tap could still match
    function addTap(tPerf) {
      if (view.run) view.run.taps.push(tPerf);
    }

    function onInputEvent(evt) {
      if (evt && evt.type === 'press' && CAL_TAP_CONTROL.test(evt.control)) addTap(evt.tPerf);
    }

    function onFrame() {
      const run = view.run;
      if (!run) return;
      const nowMs = Core.now();
      while (run.shown < run.targets.length && nowMs >= run.targets[run.shown]) run.shown += 1;
      const lastFlash = run.shown > 0 ? run.targets[run.shown - 1] : -Infinity;
      view.pad.classList.toggle('on', nowMs - lastFlash < CAL_FLASH_MS);
      if (run.shown > 0) view.status.textContent = say('cal.watch.counter', { count: run.shown });
      view.runFrame = Core.raf.request(onFrame, token);
    }

    function endRun() {
      const run = view.run;
      if (!run) return;
      view.result = analyzeTaps(run.taps, run.targets, matchMs);
      stopRun();
      renderWatch(view.result.status);
    }

    function startRun() {
      renderWatch('running');
      const first = Core.now() + startDelayMs;
      const targets = Array.from({ length: CAL_TAP_COUNT }, (item, index) => first + index * intervalMs);
      view.run = { targets, taps: [], shown: 0 };
      view.runFrame = Core.raf.request(onFrame, token);
      const wait = targets[targets.length - 1] + matchMs + CAL_END_MARGIN_MS - Core.now();
      view.runTimer = Core.timers.setTimeout(endRun, wait, token);
      if (typeof params.onRunStart === 'function') params.onRunStart(targets.slice());
    }

    function acceptWatch() {
      view.measured.visualMs = view.result.medianMs;
      view.values = calibrationFromMedians(view.measured, view.values);
      goTo('speed');
    }

    // ---- pages
    function renderListen() {
      showPage(say('cal.listen.title'), say('cal.listen.body'), [el('div', { class: 'btn-row' }, [
        stepButton('listen-start', 'cal.start', () => {}, 'primary', LATER_BUILD),
        stepButton('listen-skip', 'cal.skip', () => goTo('watch'))])]);
    }

    function watchButtons(outcome) {
      const again = () => stepButton('again', 'cal.again', startRun);
      const back = () => stepButton('back', 'cal.back', () => goTo('listen'));
      const skip = () => stepButton('skip', 'cal.skip', () => goTo('speed'));
      if (outcome === 'running') return [];
      if (outcome === 'ok') return [stepButton('next', 'cal.next', acceptWatch, 'primary'), again(), back()];
      if (outcome === 'few') return [again(), skip(), back()];
      if (outcome === 'uneven') return [again(), stepButton('anyway', 'cal.anyway', acceptWatch), back()];
      return [stepButton('start', 'cal.start', startRun, 'primary'), skip(), back()];
    }

    function watchMessage(outcome) {
      if (outcome === 'few') return say('S-CAL-01');
      if (outcome === 'uneven') return say('S-CAL-02');
      if (outcome === 'ok') return say('cal.result', { tap: signed(Math.round(view.result.medianMs)) });
      return say('cal.watch.ready');
    }

    function renderWatch(outcome) {
      disposePage();
      view.page = 'watch';
      view.pad = el('div', { id: 'cal-pad', class: 'cal-pad', role: 'button', tabindex: '0', owner: token,
        'aria-label': say('cal.watch.pad'), on: { pointerdown: (evt) => addTap(evt.timeStamp) } });
      view.status = paragraph(watchMessage(outcome), { id: 'cal-status', role: 'status' });
      showPage(say('cal.watch.title'), say('cal.watch.body'), [view.pad, view.status,
        el('div', { class: 'btn-row' }, watchButtons(outcome))]);
    }

    function buildPreview() {
      const lanes = Array.from({ length: CAL_PREVIEW_LANES }, () => el('div', { class: 'cal-lane' }));
      view.notes = Array.from({ length: CAL_PREVIEW_NOTES }, (item, index) => {
        const node = el('span', { class: 'cal-note', 'aria-hidden': 'true' });
        lanes[index % CAL_PREVIEW_LANES].appendChild(node);
        return { node, timeMs: index * intervalMs };
      });
      return el('div', { id: 'cal-preview', class: 'cal-preview', 'aria-hidden': 'true' }, lanes);
    }

    // A note crosses the line when its sound is heard: the sound delay shifts the display (Part 5.12), the note
    // speed sets how long it is visible before that.
    function onPreviewFrame() {
      const loopMs = CAL_PREVIEW_NOTES * intervalMs;
      const { audioLatencyMs, visualLeadMs } = view.values;
      view.notes.forEach((note) => {
        const remaining = (((note.timeMs + audioLatencyMs - Core.now()) % loopMs) + loopMs) % loopMs;
        const visible = remaining <= visualLeadMs;
        note.node.hidden = !visible;
        if (visible) note.node.style.top = (1 - remaining / visualLeadMs) * 100 + '%';
      });
      view.previewFrame = Core.raf.request(onPreviewFrame, token);
    }

    function renderSpeed() {
      const change = (value) => { view.values.visualLeadMs = value; };
      const speed = keepHandle(UI.Widgets.slider({ id: 'cal-speed', label: say('cal.noteSpeed'), min: 600, max: 3000,
        step: CAL_SPEED_STEP_MS, value: view.values.visualLeadMs, format: noteSpeedFormat, onInput: change,
        onChange: change }));
      showPage(say('cal.speed.title'), say('cal.speed.body'), [buildPreview(), speed.root,
        el('div', { class: 'btn-row' }, [stepButton('next', 'cal.next', () => goTo('summary'), 'primary'),
          stepButton('back', 'cal.back', () => goTo('watch'))])]);
      view.previewFrame = Core.raf.request(onPreviewFrame, token);
    }

    function refreshSummary() {
      view.summaryLine.textContent = say('cal.summary.line', { sound: view.values.audioLatencyMs,
        tap: signed(view.values.inputOffsetMs), speed: (1500 / view.values.visualLeadMs).toFixed(1) });
    }

    function offsetField(id, label, key) {
      const limits = CAL_LIMITS[key];
      return keepHandle(UI.Widgets.number({ id, label: say(label), min: limits[0], max: limits[1], step: 1,
        unit: 'ms', value: view.values[key], onChange: (value) => { view.values[key] = value; refreshSummary(); } }));
    }

    function resetOffsets() {
      view.values.inputOffsetMs = 0;
      view.values.audioLatencyMs = 0;
      goTo('summary');
    }

    function renderSummary() {
      view.summaryLine = paragraph('', { id: 'cal-summary', role: 'status' });
      showPage(say('cal.summary.title'), say('cal.summary.honest'), [view.summaryLine,
        offsetField('cal-input-offset', 'cal.tapTiming', 'inputOffsetMs').root,
        offsetField('cal-sound-delay', 'cal.soundDelay', 'audioLatencyMs').root,
        el('div', { class: 'btn-row' }, [stepButton('save', 'cal.save', save, 'primary'),
          stepButton('reset', 'cal.reset', resetOffsets), stepButton('back', 'cal.back', () => goTo('speed'))])]);
      refreshSummary();
    }

    function save() {
      const values = { 'calibration.inputOffsetMs': view.values.inputOffsetMs,
        'calibration.audioLatencyMs': view.values.audioLatencyMs,
        'calibration.visualLeadMs': view.values.visualLeadMs };
      Settings.setMany(values, 'wizard');
      view.finish('save');
    }

    const PAGES = { listen: renderListen, watch: renderWatch, speed: renderSpeed, summary: renderSummary };

    // Escape ends a running step only; with no step running the dialog's own Escape closes it.
    function onEscape(evt) {
      if (evt.key !== 'Escape' || !view.run) return;
      evt.preventDefault();
      evt.stopImmediatePropagation();
      renderWatch();
    }

    function bindInput() {
      if (FLM.Input && typeof FLM.Input.bind === 'function') FLM.Input.bind({ owner: token, context: 'instrument' });
      bus.on('input.event', onInputEvent, token);
      Core.dom.on(window, 'keydown', onEscape, { capture: true }, token);
    }

    function release() {
      stopRun();
      Core.raf.cancel(view.previewFrame);
      bus.removeOwner(token);
      Core.dom.offOwner(token);
      Core.timers.clearOwner(token);
      Core.raf.cancelOwner(token);
      if (FLM.Input && typeof FLM.Input.unbind === 'function') FLM.Input.unbind(token);
    }

    const shown = UI.dialog({ id: 'DLG-Calibration', title: say('cal.title'),
      buttons: [{ id: 'cancel', label: say('dlg.cancel'), kind: 'secondary', isCancel: true }],
      build(container, finish) {
        view.host = container;
        view.finish = finish;
        bindInput();
        renderListen();
      } });
    return shown.then((result) => {
      release();
      return result;
    });
  }

  // Dialogs of the list that later steps build; asking for one now is a clear error, never a silent no-op.
  const dialogBuilders = new Map([['DLG-AudioBlocked', openAudioBlocked], ['DLG-ResumeAudio', openResumeAudio],
    ['DLG-Unsupported', openUnsupported], ['DLG-ImportSettings', openImportSettings],
    ['DLG-ConfirmReset', openConfirmReset], ['DLG-RemapConflict', openRemapConflict],
    ['DLG-Calibration', openCalibration]]);

  /** Opens a dialog by id; resolves to the chosen button id. */
  function openDialog(id, params) {
    const builder = dialogBuilders.get(id);
    if (!builder) return Promise.reject(coded('E-MODE-002', 'dialog ' + id + ' is not built in this version'));
    try {
      return builder(params || {});
    } catch (error) {
      return Promise.reject(error);
    }
  }

  /** DLG-Unsupported variant "Returned to the menu" for the error records of M-28. */
  function showError(record) {
    return openDialog('DLG-Unsupported', { variant: 'returned', record }).then(() => undefined);
  }

  // ---------------------------------------------------------------- SCR-Instrument play phase and SCR-Pause (T03.10)
  // The play phase has no panel of its own: the HUD (M-26) and the pads show the play, this screen only feeds the HUD
  // from the judge and answers Back with a pause. The select phase waits for the catalog (Phase 05) and Phase 08.
  const COUNTDOWN_STEP_MS = 500;             // "3", "2", "1" over 1,500 ms, then the resume (Part 6.27.4.20 rule 2)
  const COUNTDOWN_START = 3;
  const PAUSE_VOLUME_ROWS = 2;               // the first two audio rows of SETTINGS_ROWS: master and metronome volume
  const PAUSE_REASON_IDS = Object.freeze({ hidden: 'S-PLAY-03', gamepad: 'S-PLAY-04', stall: 'S-PLAY-05',
    audio: 'S-PLAY-06' });

  function createInstrument() {
    const view = { playing: false };
    return {
      mount(root, params, ctx) {
        ensureStyles();
        view.playing = params.phase === 'play';
        if (!view.playing) {
          const frame = UI.Frame.create(root, { prefix: 'ins', title: say('screen.SCR-Instrument'), subtitle: '' });
          addAll(frame.body, [notice('ins-later', 'info', LATER_BUILD)]);
          return;
        }
        root.classList.add('play-screen');
        bus.on('judge.result', (result) => UI.HUD.flash(result.judgment, result.lanes), ctx.owner);
        bus.on('score.update', (score) => UI.HUD.set({ score: score.score, combo: score.combo,
          accuracy: score.accuracy }), ctx.owner);
      },
      onBack() {
        if (!view.playing) return 'pop';
        FLM.Modes.pause('user').catch((error) => Core.Log.warn('screens', 'pause failed: ' + error.message));
        return 'handled';                      // Back, the pause button and the browser Back all pause (Part 7.4)
      }
    };
  }

  function pauseReasonText(params) {
    if (hasOwn(PAUSE_REASON_IDS, params.reason)) return say(PAUSE_REASON_IDS[params.reason]);
    return params.reason === 'blur' && params.text ? params.text + '.' : '';
  }

  function createPause() {
    const view = { owner: null, count: null, resume: null, timers: [] };

    function showCount(value) {
      view.count.textContent = value;
    }

    function cancelCountdown() {
      view.timers.forEach((id) => Core.timers.clearTimeout(id));
      view.timers = [];
      showCount('');
    }

    function finishCountdown() {
      view.timers = [];
      showCount('');
      Promise.resolve(FLM.Modes.resume()).catch((error) => Core.Log.warn('screens', 'resume failed: ' + error.message));
    }

    // The transport stays paused during the countdown, and the judge stays idle until Modes.resume (rule 2).
    function startCountdown() {
      for (let step = 1; step < COUNTDOWN_START; step += 1) {
        const number = COUNTDOWN_START - step;
        view.timers.push(Core.timers.setTimeout(() => showCount(String(number)), step * COUNTDOWN_STEP_MS,
          view.owner));
      }
      view.timers.push(Core.timers.setTimeout(finishCountdown, COUNTDOWN_START * COUNTDOWN_STEP_MS, view.owner));
      showCount(String(COUNTDOWN_START));
    }

    function toggleResume() {
      if (view.timers.length > 0) cancelCountdown();
      else startCountdown();
      return 'handled';
    }

    function report(job) {
      Promise.resolve(job).catch((error) => Core.Log.warn('screens', 'pause action failed: ' + error.message));
    }

    function buildButtons() {
      view.resume = actionButton({ id: 'ps-resume', label: say('ps.resume'), kind: 'primary', onPress: toggleResume });
      const restart = actionButton({ id: 'ps-restart', label: say('ps.restart'),
        onPress: () => report(FLM.Modes.restart()) });
      const calibrate = actionButton({ id: 'ps-calibrate', label: say('ps.calibrate'),
        onPress: () => report(openDialog('DLG-Calibration', {})) });
      const quit = actionButton({ id: 'ps-quit', label: say('ps.quit'),
        onPress: () => report(FLM.Modes.leave('user')) });
      return [view.resume, restart, calibrate, quit].map((handle) => handle.root);
    }

    // The master and metronome volume sliders (R-P6.2-01, R-P6.2-07): the same settings rows as SCR-Settings, so the
    // value is stored and M-05 follows settings.changed. Their own ids: SCR-Settings can open over this screen.
    // Widgets inside the screen are destroyed with it.
    function volumeSlider(row) {
      return UI.Widgets.slider({ id: 'ps-' + row.path.replace(/\./g, '-'), label: row.label, min: row.min,
        max: row.max, step: row.step, value: Math.round(Settings.get(row.path) * row.scale), format: row.format,
        onChange: (value) => Settings.set(row.path, value / row.scale, 'ui') }).root;
    }

    function buildVolumes() {
      const rows = SETTINGS_ROWS.audio.slice(0, PAUSE_VOLUME_ROWS);
      return el('div', { id: 'ps-volumes', class: 'pause-volumes' }, rows.map(volumeSlider));
    }

    return {
      mount(root, params, ctx) {
        ensureStyles();
        view.owner = ctx.owner;
        view.timers = [];
        root.classList.add('pause-screen');
        view.count = el('p', { id: 'ps-count', class: 'pause-count', 'aria-live': 'assertive' });
        const reason = paragraph(pauseReasonText(params), { id: 'ps-reason' });
        root.appendChild(el('div', { class: 'pause-panel', role: 'dialog', 'aria-labelledby': 'ps-title' },
          [el('h1', { id: 'ps-title' }, say('ps.title')), reason, view.count].concat(buildButtons(),
            [buildVolumes()])));
      },
      initialFocus: () => view.resume.root,
      onBack: toggleResume                     // Escape, browser Back and the gamepad B button all resume
    };
  }

  // ---------------------------------------------------------------- registry and global reactions
  // Screens of the list that later steps build are known ids but have no controller yet (E-MODE-002).
  const controllers = new Map([['SCR-FirstLaunch', createFirstLaunch], ['SCR-MainMenu', createMainMenu],
    ['SCR-Settings', createSettingsScreen], ['SCR-Help', createHelp], ['SCR-About', createAbout],
    ['SCR-Diagnostics', createDiagnostics], ['SCR-Instrument', createInstrument], ['SCR-Pause', createPause]]);
  const registration = { reactions: false };

  /** Controller factory for a screen id; an unknown or not yet built id throws E-MODE-002. */
  function get(id) {
    if (!SCREEN_IDS.includes(id)) throw coded('E-MODE-002', 'unknown screen ' + id);
    if (!controllers.has(id)) throw coded('E-MODE-002', 'screen ' + id + ' is not built in this version');
    return controllers.get(id);
  }

  function installReactions() {
    bus.on('progress.unlock', (event) => {
      if (event && event.title) UI.toast('Unlocked: ' + event.title, { kind: 'success' });
    }, SCREENS_OWNER);
    bus.on('storage.state', (event) => {
      if (event && event.notice && event.reason !== 'open') UI.toast(event.notice, { kind: 'warn' });
    }, SCREENS_OWNER);
  }

  /** Boot step B11: installs the resolver into UI.Screens and the global reactions once. Idempotent. */
  function register() {

    return project && project.song ? project.song : createLiveSong(STUDIO_SONG_ID, 'Studio', false);
  }

  /** The Song a mode puts into Transport.main, chosen by its REQUIREMENTS row; null means nothing to load. */
  function songFor(mode, params) {
    const source = REQUIREMENTS[mode].transport;
    if (source === 'tempo') return createLiveSong(FREE_PLAY_SONG_ID, 'Free Play', true);
    if (source === 'project') return projectSong();
    if (source === 'song' || source === 'tutorial') return playableSong(mode, params);
    return null;                               // 'none', and 'preview' (preview() loads it, not enter)
  }

  function mixerSettings() {
    const volume = settingValue('audio.masterVolume');
    return { master: { gain: typeof volume === 'number' ? volume : 1 } };
  }

  // Step 6: one strip per track with its mix, the Scheduler started on Transport.main, the metronome settings applied.
  function bindScheduler(song) {
    invokeStep('audio binding', 'Audio.Scheduler.bind', FLM.Transport.main, song, mixerSettings());
    const accent = settingValue('audio.metronomeAccent') !== false;
    invokeStep('audio binding', 'Audio.Metronome.configure', { accent });
  }

  /**
   * Steps 5 and 6: the song goes into the one Transport.main (never a transport of this mode's own, S-18) and the
   * one Scheduler binding is made over it. Free Play runs on the override tempo; the visibility policy follows the
   * mode kind (gameplay pauses in the background, live modes continue and re-anchor, Part 4.7.4).
   */
  async function setupMusic(mode, params) {
    const row = REQUIREMENTS[mode];
    if (row.transport === 'none') return;
    invokeStep('music', 'Transport.main.setVisibilityPolicy', LIVE.includes(mode) ? 'continue' : 'pause');
    const song = await songFor(mode, params);
    if (song === null) return;
    const tempoOnly = row.transport === 'tempo';
    const options = tempoOnly ? { tempoSource: 'override', overrideBpm: params.overrideBpm } : undefined;
    invokeStep('music', 'Transport.main.load', song, options);
    if (row.scheduler === 'bound') bindScheduler(song);
  }

  // ---------------------------------------------------------------- gameplay assembly (Part 4.7.1 steps 7, 8, 10, 14)
  // Built for `instrument` only (T03.10). Steps 6, 7 and 9 wait for Audio, the chart generator and the stage: the
  // chart comes from params.testChart (a Chart, or null for playback without a Judge), a test-build hook that is
  // never reachable from the UI and is refused in the shipped build.

  const hasOwn = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const isTestBuild = () => Boolean(FLM.SelfTest);

  function refuseTestHooks(params) {
    if (hasOwn(params, 'testChart') && !isTestBuild()) {
      throw new Error('params.testChart is only available in the test build');
    }
  }

  /** Step 7 until Phase 08: the given test chart, or null (no chart, so no Judge). */
  function chartFromParams(params) {
    if (hasOwn(params, 'testChart')) return params.testChart;
    noteSkip('charts', 'Mapping.ChartGenerator.generateAsync');
    return null;
  }

  /** Step 8: a Judge bound to Transport.main. Calibration is applied once, inside the Judge (S-04). */
  function createJudge(chart, song) {
    if (chart === null) return null;
    if (!available('Rhythm.Judge.bind')) {
      noteSkip('judge', 'Rhythm.Judge.bind');
      return null;
    }
    const judge = FLM.Rhythm.Judge.bind({ timeMap: FLM.Transport.main,
      strayPenalty: settingValue('gameplay.strayPressPenalty') === true ? 'combo' : 'none',
      windowsPreset: settingValue('gameplay.judgmentPreset') || 'standard' });
    try {
      judge.load(chart, song);                 // a bad chart throws E-INP-012 and the enter fails
    } catch (error) {
      judge.dispose();
      throw error;
    }
    return judge;
  }

  /** A judge listens only while the transport plays: no judgment, stray or miss during count-in or pause. */
  function syncJudgeActivity() {
    const gp = state.gp;
    if (!gp || !gp.judge || !available('Transport.main.state')) return;
    const running = ['playing', 'recording'].includes(invoke('Transport.main.state'));
    gp.judge.setActive(running);
    if (running) gp.began = true;
  }

  function refreshHud(now, gp) {
    const tick = invoke('Transport.main.positionAt', now);
    const duration = gp.song.durationTicks;
    const counting = invoke('Transport.main.state') === 'countin';
    const countIn = counting ? invoke('Transport.main.meterMap').beatAt(tick).beat + 1 : null;
    FLM.UI.HUD.set({ progress: duration > 0 ? Core.clamp(tick / duration, 0, 1) : 0, countIn });
  }

  /** The 50 ms pump: judge ticks (misses) and the time-driven HUD fields. The Scheduler drives the transport. */
  function pump() {
    const gp = state.gp;
    if (!gp || gp.finishing) return;
    const now = audioClockNow();
    if (gp.judge) gp.judge.tick(now);
    refreshHud(now, gp);
  }

  // M-07 releases a lost gamepad's controls (source 'system') just before it reports input.device. The flag lives
  // only until the end of that synchronous run, so an unrelated release-all never looks like a lost device.
  function trackGamepad(gp, evt) {
    if (evt.type === 'press' && evt.source === 'gamepad') gp.gamepadHeld.add(evt.control);
    if (evt.type !== 'release' || !gp.gamepadHeld.delete(evt.control) || evt.source !== 'system') return;
    gp.deviceLost = true;
    Promise.resolve().then(() => { gp.deviceLost = false; });
  }

  function onPauseControl() {
    if (state.gp.finishing) return;
    if (state.pauseReason === null) {
      startPause('user');
      return;
    }
    const top = FLM.UI.Screens.current();
    if (top && top.id === 'SCR-Pause' && typeof top.controller.onBack === 'function') top.controller.onBack('key');
  }

  // KeyP: pauses first, then stops every sound (Part 7.6.4); Audio.panic itself arrives with T04.05.
  function onPanicControl() {
    if (state.pauseReason === null) startPause('user');
    invokeStep('panic', 'Audio.panic', false);
    FLM.UI.toast(TEXT.allSoundStopped, { kind: 'info', key: 'play.panic' });
  }

  /** The one input.event subscription of a gameplay mode: judge routing and the pause and panic controls. */
  function onGameplayInput(evt) {
    const gp = state.gp;
    if (!gp || !evt) return;
    trackGamepad(gp, evt);
    if (LANE_CONTROL.test(evt.control)) {
      if (gp.judge) gp.judge.onInput(evt);     // inactive while paused: nothing is judged, no stray is counted
      return;
    }
    if (evt.type !== 'press') return;
    if (evt.control === 'pause') onPauseControl();
    else if (evt.control === 'panic') onPanicControl();
  }

  function resultsScreenBuilt() {
    try {
      return Boolean(FLM.Screens && FLM.Screens.get('SCR-Results'));
    } catch (error) {
      return false;
    }
  }

  /** After "Song complete": the results mode, or the menu while SCR-Results is not built (Part 4.7.1 step 12). */
  async function leaveAfterFinish(gp) {
    if (state.gp !== gp) return;
    const results = resultsScreenBuilt();
    const replay = { mode: state.current.mode, params: state.current.params };
    await leave('finished', results ? { next: 'results' } : undefined);
    if (results) await enter('results', { summary: gp.summary, replay, returnTo: replay.params.returnTo });
  }

  /** Once per gameplay (the finishing guard): declares the remaining notes, ends the Judge, shows the end note. */
  function finishGameplay(endedBy) {
    const gp = state.gp;
    if (!gp || gp.finishing) return;
    gp.finishing = true;
    if (gp.judge) {
      gp.judge.tick(audioClockNow() + FINISH_TICK_AHEAD_S);
      gp.judge.finish(endedBy, { songId: gp.song.id, startedAt: gp.startedAtIso,
        durationSec: (Core.now() - gp.startedAtMs) / MS_PER_SECOND });
    }
    FLM.UI.HUD.note(TEXT.songComplete);
    Core.timers.setTimeout(() => {
      leaveAfterFinish(gp).catch((error) => Core.Log.warn('modes', 'finish failed: ' + messageOf(error)));
    }, FINISH_DELAY_MS, gp.owner);
  }

  function onTransportState(event) {
    const gp = state.gp;
    if (!gp || !event) return;
    if (event.state === 'stopped' && event.reason === 'end') finishGameplay('end');   // before the judge goes idle
    syncJudgeActivity();
  }

  function onChartFinished(event) {
    const gp = state.gp;
    if (!gp || !event) return;
    gp.summary = event.summary;
    finishGameplay(event.endedBy);
  }

  // S-PLAY-08 (OI-23): a calibration change after the run began makes the results not comparable (the Judge flags it).
  function onSettingsChanged(event) {
    const gp = state.gp;
    if (!gp || !gp.judge || !gp.began || !event) return;
    const keys = event.key === '*' && Array.isArray(event.keys) ? event.keys : [event.key];
    if (!keys.some((key) => CALIBRATION_JUDGED.includes(key))) return;
    FLM.UI.toast(TEXT.calibrationChanged, { kind: 'warn', key: 'play.calibrationChanged' });
  }

  function subscribeGameplay(owner) {
    const on = (topic, handler) => bus.on(topic, handler, owner);
    on('input.event', onGameplayInput);
    on('transport.state', onTransportState);
    on('chart.finished', onChartFinished);
    on('settings.changed', onSettingsChanged);
  }

  /** Steps 7, 8 and 12 of Part 4.7.1 for a mode that has a song loaded; null when there is nothing to assemble. */
  function assembleGameplay(mode, params) {
    if (!ASSEMBLED_MODES.includes(mode) || !available('Transport.main.song')) return;
    const song = invoke('Transport.main.song');
    if (song === null) return;
    const chart = chartFromParams(params);
    const owner = state.current.owner;
    state.gp = { owner, song, chart, judge: createJudge(chart, song), began: false, finishing: false, summary: null,
      gamepadHeld: new Set(), deviceLost: false, startedAtIso: new Date().toISOString(), startedAtMs: Core.now() };
    subscribeGameplay(owner);
    Core.timers.setInterval(pump, PUMP_MS, owner);
  }

  /** Step 10: the input context of the mode and the in-game look (no text entry, Escape belongs to pause). */
  function bindGameplayInput() {
    if (state.gp === null) return;
    invokeStep('input', 'Input.bind', { owner: state.current.owner, context: GAMEPLAY_INPUT_CONTEXT,
      surface: '#view', pads: '#touch' });
    FLM.UI.setTextEntryAllowed(false);
    doc.body.classList.add('in-game');
  }

  function countInBarsFor(params) {
    if ([0, 1, 2].includes(params.countInBars)) return params.countInBars;
    return settingValue('gameplay.autoCountIn') === false ? 0 : (settingValue('audio.countInBars') || 0);
  }

  /** Step 14: the transport starts, with the count-in of the settings (or params.countInBars). */
  function startGameplay(params) {
    if (state.gp === null || params.autoStart === false) return;
    invokeStep('start', 'Transport.main.play', { countInBars: countInBarsFor(params) });
  }

  /** Part 6.28.2 gameplayState(): what a screen or test may ask about the running gameplay. */
  function gameplayState() {
    const gp = state.gp;
    if (gp === null) return { active: false, kind: null, chartId: null, settingsHash: null, speed: 1, passes: [],
      finished: false };
    return { active: true, kind: 'instrument', chartId: gp.chart ? gp.chart.id : null,
      settingsHash: gp.chart ? gp.chart.settingsHash || null : null, speed: invoke('Transport.main.speed'),
      passes: [], finished: gp.finishing };
  }

  async function setupMenu(params) {
    if (FLM.UI.Screens.depth() === 0) {
      const root = MENU_ROOTS.includes(params.screen) ? params.screen : MENU_ROOT;
      await FLM.UI.Screens.push(root, params);
    }
    if (typeof params.returnTo === 'string') await FLM.UI.Screens.push(params.returnTo, params);
  }

  async function pushModeScreen(mode, params) {
    const screen = REQUIREMENTS[mode].screen;
    const top = FLM.UI.Screens.current();
    if (top && top.id === screen) await FLM.UI.Screens.replace(screen, Object.assign({ phase: 'play' }, params));
    else await FLM.UI.Screens.push(screen, GAMEPLAY.includes(mode) ? Object.assign({ phase: 'play' }, params) : params);
  }

  /** Steps 5 to 12 of Part 4.7.1. */
  async function setupMode(mode, params) {
    if (mode === 'menu') {
      await setupMenu(params);
      return;
    }
    notePendingSteps(mode);
    await setupMusic(mode, params);
    assembleGameplay(mode, params);
    // EXTENSION POINT: stage (step 9) and the other modes' charts and judges go here (later tasks).
    bindGameplayInput();
    const kind = hudKind(mode, params);
    if (kind !== null) FLM.UI.HUD.show(kind, state.current.owner);
    showPads(mode, params);
    await pushModeScreen(mode, params);
    maybeShowRotate(mode);
  }

  // Part 4.7 table note: a mode that needs sound waits for DLG-AudioBlocked (built by T01.11) or is refused.
  async function passAudioGate(mode) {
    if (!REQUIREMENTS[mode].audio) return true;
    if (!available('Audio.isUnlocked')) {
      noteSkip('audio unlock', 'Audio.isUnlocked');
      return true;
    }
    if (invoke('Audio.isUnlocked')) return true;
    const canAsk = FLM.Screens && typeof FLM.Screens.dialog === 'function';
    const answer = canAsk ? await FLM.Screens.dialog('DLG-AudioBlocked', { mode }) : 'cancel';
    if (answer === 'enabled') return true;
    Core.ErrorReporter.report('E-AUD-002', null, { module: 'Modes', mode });
    return false;
  }

  function rememberMode(mode, params) {
    if (FLM.Screens && FLM.Screens.Settings) FLM.Screens.Settings.set('onboarding.lastMode', mode, 'ui');
    if (!SESSION_MODES.includes(mode)) return;
    FLM.Storage.set(FLM.Storage.KEYS.lastSession, { mode, projectId: params.projectId || null,
      songId: params.songId || null, at: new Date().toISOString() });
  }

  function showError(record) {
    const known = FLM.Screens && typeof FLM.Screens.showError === 'function';
    const shown = known ? FLM.Screens.showError(record) : FLM.UI.dialog({ id: 'DLG-Unsupported',
      title: TEXT.unsupportedTitle, body: record.userMessage || record.message,
      buttons: [{ id: 'ok', label: TEXT.ok, kind: 'primary', isDefault: true, isCancel: true }] });
    Promise.resolve(shown).catch((error) => Core.Log.warn('modes', 'error dialog failed: ' + messageOf(error)));
  }

  async function failEnter(mode, error) {
    const record = Core.ErrorReporter.report('E-MODE-002', error, { module: 'Modes', mode,
      message: messageOf(error) });
    await doLeave('error', { next: 'menu' });
    showError(record);                         // not awaited: the dialog waits for the user, the transition does not
    return { ok: false, mode: 'menu', error: record };
  }

  // The HUD builds its nodes and listeners on first use; building them now keeps them in the baseline.
  function takeBaseline() {
    FLM.UI.HUD.note('');
    state.baseline = counters();
    state.baselineFromMenu = true;
  }

  // Boot enters the menu first; a mode entered before that gets the menu root under it (leave pops back to it).
  async function openMenuRoot() {
    state.current = menuState();
    doc.body.dataset.mode = 'menu';
    await setupMenu({});
  }

  async function doEnter(mode, rawParams) {
    const started = Core.now();
    const prev = state.current.mode;
    const params = rawParams && typeof rawParams === 'object' ? rawParams : {};
    try {
      Core.assert(MODES.includes(mode), 'unknown mode ' + mode);
      refuseTestHooks(params);
      if (!isMenuLike(state.current.mode)) await doLeave('user', { next: mode });
      if (state.current.mode === 'none' && mode !== 'menu') await openMenuRoot();
      // Taken only in the menu (Part 4.7.1 step 2). Entering the menu itself takes it after the menu screen is
      // mounted, because menu-level resources (the screen and its listeners) belong to the baseline.
      if (mode !== 'menu') takeBaseline();
      if (!(await passAudioGate(mode))) return { ok: false, mode: 'menu' };
      const owner = mode === 'menu' ? MENU_OWNER : Symbol(mode + ':' + Core.uid());
      state.current = { mode, params, owner, enteredAt: Core.now() };
      doc.body.dataset.mode = mode;
      await setupMode(mode, params);
      if (mode === 'menu') takeBaseline();
      bus.emit('mode.enter', { mode, prev, params: plainCopy(params), ms: Math.round(Core.now() - started) });
      rememberMode(mode, params);
      startGameplay(params);
      return { ok: true, mode };
    } catch (error) {
      return failEnter(mode, error);
    }
  }

  // Serialization: every transition waits for the one before it (Part 4.7). Jobs never reject.
  function runExclusive(job) {
    const run = state.queue.then(async () => {
      state.transitioning = true;
      try {
        return await job();
      } finally {
        state.transitioning = false;
      }
    });
    state.queue = run.catch(() => {});
    return run;
  }

  /** @returns {Promise<{ok:boolean, mode:string, error?:object}>} never rejects; failure returns to the menu */
  function enter(mode, params) {
    return runExclusive(() => doEnter(mode, params));
  }

  /**
   * Full teardown to the menu (Part 4.7.2). Never rejects; a failing step is reported as E-MODE-003 and the
   * sequence continues.
   * @param {string} reason 'user', 'finished', 'error', 'interrupt' or 'net'
   * @param {{next?:string}=} options
   * @returns {Promise<{leaks:(object|null), ms:number}>}
   */
  function leave(reason, options) {
    return runExclusive(() => doLeave(reason || 'user', options || NO_NEXT));
  }

  /** Restarts the current mode with changed parameters (fresh state; gameplay assembly refines it later). */
  async function restart(changes) {
    const mode = state.current.mode;
    if (isMenuLike(mode)) return;
    await enter(mode, Object.assign({}, state.current.params, changes || {}));
  }

  // ---------------------------------------------------------------- previews (library and import, Part 6.28.2)

  /** Ends a preview: stop, release the Scheduler binding, unload the song. Safe to call when none is playing. */
  async function stopPreview() {
    if (!state.preview.active) return;
    Core.timers.clearTimeout(state.preview.timer);
    state.preview = { active: false, timer: null };
    await runAll('preview', [['Transport.main.stop'], ['Audio.Scheduler.unbind'], ['Transport.main.unload']]);
  }

  /**
   * Plays a candidate song on the one Transport.main in a mode whose row says 'preview' (library, import); the
   * Scheduler binding is made here and released when the preview stops or the mode leaves.
   * @param {(object|string)} songOrId a Song, or a catalog id
   * @param {{fromTick?:number, durationS?:number}=} options
   * @returns {Promise<{ok:boolean}>}
   */
  async function preview(songOrId, options) {
    const given = options || {};
    const mode = state.current.mode;
    const owner = state.current.owner;
    if (!REQUIREMENTS[mode] || REQUIREMENTS[mode].transport !== 'preview') return { ok: false };
    const song = typeof songOrId === 'string' ? await catalogSong(songOrId) : songOrId;
    const usable = song && Array.isArray(song.tracks) && available('Transport.main.play');
    if (!usable || state.current.owner !== owner) return { ok: false };
    await stopPreview();
    invoke('Transport.main.load', song);
    bindScheduler(song);
    const seconds = Number.isFinite(given.durationS) ? given.durationS : PREVIEW_SECONDS;
    const timer = Core.timers.setTimeout(() => {
      stopPreview().catch((error) => Core.Log.warn('modes', 'preview stop failed: ' + messageOf(error)));
    }, seconds * MS_PER_SECOND, owner);
    state.preview = { active: true, timer };
    return { ok: invoke('Transport.main.play', { countInBars: 0, fromTick: given.fromTick }) === true };
  }

  // ---------------------------------------------------------------- pause and interruptions (Part 4.7.4)

  const isGameplay = (mode) => GAMEPLAY.includes(mode === undefined ? state.current.mode : mode);

  function releaseInputs() {
    invokeStep('release', 'Input.releaseAll', 'system');
  }

  /** Pauses the transport, releases inputs and shows SCR-Pause when it exists. @returns {Promise<boolean>} */
  async function pause(reason) {
    if (!isGameplay() || state.pauseReason !== null) return false;
    if (state.gp && state.gp.finishing) return false;   // the song is over: nothing left to pause
    state.pauseReason = reason;
    invokeStep('pause', 'Transport.main.pause');
    syncJudgeActivity();                                // the judge is idle before the held controls are released
    releaseInputs();
    if (state.gp) FLM.UI.setTextEntryAllowed(true);
    try {
      await FLM.UI.Screens.push('SCR-Pause', { reason, text: PAUSE_TEXT[reason] || PAUSE_TEXT.user });
    } catch (error) {
      Core.Log.once('modes.skip.pause-screen', 'info', 'modes', 'skip SCR-Pause: ' + messageOf(error));
    }
    return true;
  }

  /** Pops SCR-Pause and resumes the transport. @returns {Promise<boolean>} */
  async function resume() {
    if (state.pauseReason === null) return false;
    state.pauseReason = null;
    const top = FLM.UI.Screens.current();
    if (top && top.id === 'SCR-Pause') await FLM.UI.Screens.pop();
    invokeStep('resume', 'Transport.main.resume');
    syncJudgeActivity();                                // holds that began before the pause are checked here
    if (state.gp) FLM.UI.setTextEntryAllowed(false);
    return true;
  }

  function startPause(reason) {
    pause(reason).catch((error) => Core.Log.warn('modes', 'pause failed: ' + messageOf(error)));
    return 'paused';
  }

  function transportIsRunning() {
    if (!available('Transport.main.state')) return true;   // a gameplay mode is active, so assume it is playing
    return ['playing', 'countin'].includes(invoke('Transport.main.state'));
  }

  // Rows of Part 6.28.4.9 for the sources that exist in this build. Each handler returns the action taken.
  // Live modes keep playing in the background; Transport.main notes when it was hidden so onVisible can compare the
  // audio clock with the performance clock and re-anchor on a drift over 5 ms (Part 4.7.4, UT-04-22).
  function audioClockNow() {
    return available('Audio.clock') ? invoke('Audio.clock').now() : Core.now() / MS_PER_SECOND;
  }

  function whenHidden(kind) {
    if (kind === 'gameplay') return startPause('hidden');
    if (kind !== 'live') return 'ignored';
    invokeStep('visibility', 'Transport.main.onHidden', audioClockNow(), Core.now());
    return releaseAndReport();
  }

  // A re-anchor after the background is recoverable and silent: logged and counted in the diagnostics (E-AUD-009).
  function reportDrift(result) {
    if (!result || result.drifted !== true) return;
    Core.ErrorReporter.report('E-AUD-009', null, { module: 'Modes', driftMs: result.driftMs });
  }

  function whenVisible(kind) {
    if (kind === 'panel') return 'ignored';
    if (kind === 'live') {
      reportDrift(invokeStep('visibility', 'Transport.main.onVisible', audioClockNow(), Core.now()));
    }
    return 'continued';
  }

  function releaseAndReport() {
    releaseInputs();
    return 'released';
  }

  function whenPageHidden(kind) {
    if (FLM.Screens && FLM.Screens.Settings) FLM.Screens.Settings.flush();
    return whenHidden(kind);
  }

  function whenBlur(kind) {
    if (kind === 'gameplay') return transportIsRunning() ? startPause('blur') : 'ignored';
    return kind === 'live' ? 'continued' : 'ignored';
  }

  function whenAudioStops(kind) {
    if (kind === 'gameplay') return startPause('audio');
    if (kind !== 'live') return 'ignored';
    invokeStep('pause', 'Transport.main.pause');
    return 'paused';
  }

  function whenGamepadGone(kind, detail) {
    if (kind === 'gameplay' && detail && detail.released) return startPause('gamepad');
    return kind === 'live' ? 'released' : 'ignored';
  }

  function whenStalled(kind, detail) {
    if (!detail || !(detail.gapMs > STALL_PAUSE_MS)) return 'ignored';
    if (kind === 'gameplay') return startPause('stall');
    return kind === 'live' ? 'continued' : 'ignored';
  }

  function whenGraphicsChange(kind, lost) {
    if (kind === 'panel' || !FLM.UI.HUD.visible()) return 'ignored';
    FLM.UI.HUD.note(lost ? TEXT.graphicsPaused : '');
    return 'continued';
  }

  function whenLayoutChanges() {
    FLM.UI.TouchPads.layout();
    invokeStep('layout', 'Input.layoutChanged');           // the pad rectangles M-07 hit-tests are measured again
    if (!isMenuLike(state.current.mode)) maybeShowRotate(state.current.mode);
    return 'continued';
  }

  function whenNetworkEnds() {
    if (state.current.mode !== 'multiplayer') return 'ignored';
    leave('net').catch(() => {});
    return 'ended';
  }

  const INTERRUPTS = Object.freeze({
    hidden: whenHidden,
    visible: whenVisible,
    pagehide: whenPageHidden,
    freeze: whenPageHidden,
    blur: whenBlur,
    audio: whenAudioStops,
    gamepad: whenGamepadGone,
    stall: whenStalled,
    contextLost: (kind) => whenGraphicsChange(kind, true),
    contextRestored: (kind) => whenGraphicsChange(kind, false),
    layout: whenLayoutChanges,
    net: whenNetworkEnds
  });

  function modeKind() {
    const mode = state.current.mode;
    if (GAMEPLAY.includes(mode)) return 'gameplay';
    return LIVE.includes(mode) ? 'live' : 'panel';
  }

  /**
   * Handles an interruption for the current mode kind (gameplay, live or panel).
   * @param {string} cause 'hidden', 'visible', 'pagehide', 'freeze', 'blur', 'audio', 'gamepad', 'stall',
   *   'contextLost', 'contextRestored', 'layout' or 'net'
   * @returns {string} 'paused', 'continued', 'ended', 'released' or 'ignored'
   * Emits: mode.interrupted {mode, cause, action} for every handled row
   */
  function onInterrupt(cause, detail) {
    const handler = INTERRUPTS[cause];
    if (!handler || isMenuLike(state.current.mode)) return 'ignored';
    const action = handler(modeKind(), detail);
    if (action !== 'ignored') bus.emit('mode.interrupted', { mode: state.current.mode, cause, action });
    return action;
  }

  // ---------------------------------------------------------------- init: permanent listeners (Part 6.28.4.12)

  // Browser back: the unsaved-changes guard first, then the screen stack decides (Part 6.28.4.12).
  async function confirmLeaveUnsaved() {
    const dirty = available('Project.isDirty') && invoke('Project.isDirty');
    if (!dirty || !PROJECT_MODES.includes(state.current.mode)) return true;
    const answer = await FLM.UI.confirmUnsaved({ title: TEXT.unsavedTitle, body: TEXT.unsavedBody });
    return answer === 'discard';
  }

  async function onPopState(event) {
    const skipGuard = state.skipGuardOnce;
    state.skipGuardOnce = false;
    if (!skipGuard && !(await confirmLeaveUnsaved())) {
      state.skipGuardOnce = true;              // history.forward() fires one more popstate; let it through
      window.history.forward();
      return;
    }
    await FLM.UI.Screens.onPopState(event.state);
  }

  function guarded(handler) {
    return (event) => {
      Promise.resolve(handler(event)).catch((error) => Core.ErrorReporter.report('E-GEN-001', error,
        { module: 'Modes', op: 'listener' }));
    };
  }

  function installListeners() {
    const listen = (target, type, handler) => Core.dom.on(target, type, guarded(handler), undefined, MODES_OWNER);
    listen(window, 'popstate', onPopState);
    listen(doc, 'visibilitychange', () => onInterrupt(doc.visibilityState === 'hidden' ? 'hidden' : 'visible'));
    listen(window, 'pagehide', () => onInterrupt('pagehide'));
    listen(doc, 'freeze', () => onInterrupt('freeze'));
    listen(window, 'blur', () => onInterrupt('blur'));
  }

  // A returnToMenu error raised outside a transition sends the user back to the menu (Part 6.28.4.9).
  function onErrorRecord(record) {
    const ours = record.code === 'E-MODE-002';   // enter reports and handles its own failures
    if (record.class !== 'returnToMenu' || ours || state.transitioning) return;
    leave('error').then(() => showError(record));
  }

  function subscribe() {
    const on = (topic, handler) => bus.on(topic, handler, MODES_OWNER);
    on('error', onErrorRecord);
    // Boot-only resources (the error escalation listener) are gone once the menu is up: baseline again then.
    on('boot.ready', () => { if (isMenuLike(state.current.mode)) takeBaseline(); });
    on('audio.state', (event) => { if (event && event.state !== 'running') onInterrupt('audio'); });
    on('render.contextLost', () => onInterrupt('contextLost'));
    on('render.contextRestored', () => onInterrupt('contextRestored'));
    on('ui.layout', () => onInterrupt('layout'));
    on('input.device', (event) => {
      if (!event || event.source !== 'gamepad' || event.connected !== false) return;
      // E-INP-003: only a pad that had a control held pauses the song (M-07 released those controls just before).
      onInterrupt('gamepad', Object.assign({}, event, { released: Boolean(state.gp && state.gp.deviceLost) }));
    });
    on('sched.stall', (event) => onInterrupt('stall', event));
    on('net.state', (event) => {
      if (event && (event.state === 'ended' || event.state === 'error')) onInterrupt('net');
    });
  }

  /** Boot step B10: browser history on, interruption listeners and subscriptions installed once. */
  function init() {
    if (state.initialized) return;
    state.initialized = true;
    state.current = { mode: 'none', params: {}, owner: null, enteredAt: 0 };
    FLM.UI.Screens.setHistory(true);
    installListeners();
    subscribe();
    FLM.UI.HUD.note('');
    state.baseline = counters();               // these permanent listeners are part of the menu baseline
    state.baselineFromMenu = false;
  }

  // Tests only: removes the permanent listeners and returns to the "none" state.
  function teardownForTests() {
    leaveJudge();
    Core.dom.offOwner(MODES_OWNER);
    bus.removeOwner(MODES_OWNER);
    Core.timers.clearOwner(MODES_OWNER);
    if (state.initialized) FLM.UI.Screens.setHistory(false);
    Object.assign(state, { current: { mode: 'none', params: {}, owner: null, enteredAt: 0 },
      queue: Promise.resolve(), transitioning: false, initialized: false, pauseReason: null,
      rotateDismissed: false, skipGuardOnce: false, baselineFromMenu: false, preview: { active: false, timer: null },
      gp: null });
    state.baseline = counters();
  }

  state.baseline = counters();                 // provisional baseline until the first menu entry (see assertClean)

  return Object.freeze({
    MODES,
    GAMEPLAY,
    LIVE,
    REQUIREMENTS,
    init,
    enter,
    leave,
    restart,
    current: () => ({ mode: state.current.mode, params: plainCopy(state.current.params),
      enteredAt: state.current.enteredAt, transitioning: state.transitioning }),
    params: () => plainCopy(state.current.params),
    isGameplay,
    isTransitioning: () => state.transitioning,
    gameplayState,
    pause,
    resume,
    preview,
    stopPreview,
    onInterrupt,
    baseline: counters,
    assertClean,
    counters,
    _teardownForTests: teardownForTests
  });
});
})();

// ==== 29-boot.js ====
// 29-boot.js - M-29 FLM.Boot (T01.10): the initialization order of Part 4.3 (Phase B steps B1 to B16), the
// capability gate, URL parameters, the boot progress panel, the audio unlock gesture for returning users, the
// global surface FLM.diagnostics / FLM.debug / FLM.selfTest and the fault dispatcher behind FLM.debug.inject.
// Separation rule: this file owns exactly one namespace (Boot) and registers it once through FLM.Core.define.
// It declares no module-level global state object (S-07): state lives inside the factory closure.
// Module presence (convention 6 of Part 11): a step whose module is not built yet is skipped and logged once.
// Stage records: `ms` is the absolute performance.now() at the END of the step (Part 9.1 row 3: menuMs is the
// absolute B16 time, phaseAMs the B1 time); `stepMs` is the duration of the step, so the stepMs values add up to
// the `ms` of boot.ready (UT-29-12).

(function () {
'use strict';
const FLM = window.FLM;

FLM.Core.define('Boot', function (FLM) {
  const Core = FLM.Core;
  const bus = Core.bus;
  const Log = Core.Log;
  const doc = window.document;

  const BOOT_OWNER = Symbol('boot');
  const STEP_COUNT = 16;
  const PANEL_DELAY_MS = 300;                // the progress panel appears when B1 to B8 take longer than this
  const LAST_PROGRESS_STEP = 8;
  const MAX_ONLINE_LENGTH = 200;
  const MS_ROUNDING = 100;                   // stage times are kept to 0.01 ms
  const FIRST_LAUNCH_SCREEN = 'SCR-FirstLaunch';
  const MAIN_MENU_SCREEN = 'SCR-MainMenu';
  const RELOAD_CLASS = 'reload';
  const MIN_CATALOG_ENTRIES = 5;
  const PROGRESS_LABELS = Object.freeze(['Storage', 'Settings', 'Sound', 'Graphics']);
  const TIER_NAMES = Object.freeze({ high: 'High', balanced: 'Balanced', low: 'Low', abstract: 'Abstract' });
  const LOG_LEVELS = Object.freeze({ debug: 10, info: 20, warn: 30, error: 40 });
  // Keys that never count as the first gesture: modifiers alone, and Tab (keyboard navigation, Part 6.29.4.3).
  const IGNORED_KEYS = Object.freeze(['Shift', 'Control', 'Alt', 'AltGraph', 'Meta', 'OS', 'CapsLock', 'NumLock',
    'ScrollLock', 'Fn', 'FnLock', 'Tab']);

  /** Namespaces whose files exist (convention 6 of Part 11); every entry that adds a module file appends its name. */
  const EXPECTED_MODULES = Object.freeze(['Core', 'Theory', 'Model', 'Transport', 'Audio', 'Input', 'Mapping',
    'Rhythm', 'UI', 'Storage', 'Screens', 'Modes', 'Boot']);

  /** Fault prefix -> namespace that owns the fault (Part 6.29.4.8). */
  const FAULT_ROUTES = Object.freeze({
    audio: 'Audio', render: 'Render', storage: 'Storage', net: 'Net', input: 'Input', import: 'Import',
    transport: 'Transport', mode: 'Modes', error: 'Boot'
  });

  // ---------------------------------------------------------------------------------------------
  // Capability gate (Part 6.29.4.5). Hard rows stop the boot; soft rows only disable features.
  // canvas2d and raf are probed by Boot itself (the M-01 report does not carry them); a caps object
  // without those two keys (synthetic caps in tests) counts as passing. The webrtc row reads caps.webrtc the same
  // way: the build lint allows the WebRTC constructor name only in 24-net.js, and M-01 does not probe it yet.
  // ---------------------------------------------------------------------------------------------
  function hardRow(id, code, reason, test) {
    return Object.freeze({ id, test, hard: true, code, reason, affects: Object.freeze(['everything']) });
  }

  function softRow(id, reason, affects, test) {
    return Object.freeze({ id, test, hard: false, code: null, reason, affects: Object.freeze([affects]) });
  }

  const GATE = Object.freeze([
    hardRow('canvas2d', 'E-CAP-002', 'This browser cannot draw graphics.', (caps) => caps.canvas2d !== false),
    hardRow('audio', 'E-CAP-001', 'This browser has no Web Audio support, so nothing could play.',
      (caps) => Boolean(caps.audioContext)),
    hardRow('raf', 'E-CAP-003', 'This browser is missing animation support.', (caps) => caps.raf !== false),
    softRow('webgl2', 'Advanced 3D unavailable; using simpler graphics.', 'High tier', (caps) => Boolean(caps.webgl2)),
    softRow('webgl', '3D stage unavailable in this browser; using the flat visualizer.', '3D tiers',
      (caps) => Boolean(caps.webgl2 || caps.webgl1)),
    softRow('pointer', '', 'touch input', (caps) => Boolean(caps.pointerEvents)),
    softRow('touch4', 'This device reports fewer than 4 simultaneous touches.', 'four-pad chords on touch',
      (caps) => !(caps.maxTouchPoints > 0 && caps.maxTouchPoints < 4)),
    softRow('gamepad', 'Gamepad input is not available in this browser.', 'gamepad', (caps) => Boolean(caps.gamepad)),
    softRow('midi', 'Web MIDI needs a secure context and a supporting browser.', 'MIDI input',
      (caps) => Boolean(caps.webMidi)),
    softRow('localStorage', 'Settings and projects cannot be saved in this browser mode. Use Export.', 'saving',
      (caps) => Boolean(caps.localStorage)),
    softRow('indexedDB', 'Large projects cannot be stored; projects are limited to 2 MB. Use Export for backups.',

    softRow('offline', 'WAV export is not available in this browser.', 'WAV export',

    softRow('mediaRecorder', 'Real-time mix recording is not available in this browser.', 'mix recording',

    softRow('webrtc', 'This browser has no WebRTC support.', 'Multiplayer',

    softRow('visibility', '', 'interruption detection', (caps) => Boolean(caps.visibility)),
    softRow('storageEstimate', '', 'quota display', (caps) => Boolean(caps.storageEstimate)),

  }

  /** Pure: evaluates the gate against a caps object. @returns {{hard:object[], soft:object[], degraded:string[]}} */
  function evaluateGate(caps) {

    const soft = failed.filter((row) => !row.hard);

  // ---------------------------------------------------------------------------------------------
  // URL parameters (Part 6.29.4.6)

  function parseTier(query, warnings) {

    const name = TIER_NAMES[query.get('tier').toLowerCase()];
    if (name) return name;
    warnings.push('W-URL-TIER');
    return null;
  }

  function isRelayUrl(text) {
    if (text.length > MAX_ONLINE_LENGTH) return false;

      const protocol = new URL(text).protocol;
      return protocol === 'ws:' || protocol === 'wss:';
    } catch (error) {
      return false;
    }
  }

  function parseOnline(query, warnings) {
    if (!query.has('online')) return null;
    const text = query.get('online');
    if (isRelayUrl(text)) return text;
    warnings.push('W-URL-ONLINE');
    return null;
  }

  /** Pure: parses a search string such as '?test&tier=low'. Unknown keys are ignored. */
  function parseUrlParams(search) {
    const query = new URLSearchParams(typeof search === 'string' ? search : '');
    const warnings = [];
    return {
      test: query.has('test'),
      tier: parseTier(query, warnings),
      diag: query.has('diag'),
      online: parseOnline(query, warnings),
      perf: query.has('perf'),
      warnings

  }

  const isOnlineEdition = () => typeof Core.RELAY_URL === 'string' && Core.RELAY_URL !== '';

  /** The relay URL that ?online may apply: none in the standalone build (T01.10). */
  function relayUrlFrom(parsed) {
    if (parsed.online === null) return null;
    if (isOnlineEdition()) return parsed.online;
    Log.once('boot.online.ignored', 'info', 'boot', '?online ignored in the standalone build');
    return null;
  }

  // ---------------------------------------------------------------------------------------------
  // State of the page-wide boot (one run per page; tests use separate runs through _runForTests)
  // ---------------------------------------------------------------------------------------------
  const state = {
    started: null,
    stages: [],
    gate: null,
    params: parseUrlParams(''),
    phase: 'idle',                           // idle, booting, ready or failed
    bootDone: false,
    gestureOff: null,
    errorOff: null,
    faults: new Map(),
    showStats: false,
    resolveReady: null
  };
  const readyPromise = new Promise((resolve) => { state.resolveReady = resolve; });

  /** Applies parsed parameters (B2): warnings are logged, ?diag enables the debug surface, ?online the relay. */
  function applyUrlParams(parsed) {
    state.params = parsed;
    parsed.warnings.forEach((code) => Log.warn('boot', code + ': ignored a bad URL parameter'));
    if (parsed.diag && FLM.debug) FLM.debug.enabled = true;
    const relayUrl = relayUrlFrom(parsed);
    if (relayUrl !== null && FLM.Net && typeof FLM.Net.setRelayUrl === 'function') FLM.Net.setRelayUrl(relayUrl);
    if (parsed.perf && FLM.SelfTest) Log.info('boot', '?perf: in-page performance hooks enabled');
  }

  // ---------------------------------------------------------------------------------------------
  // Landing (B14)
  // ---------------------------------------------------------------------------------------------
  function isAudioLocked() {
    const audio = FLM.Audio;
    return Boolean(audio) && typeof audio.isUnlocked === 'function' && !audio.isUnlocked();
  }

  /** Pure apart from reading the audio lock state: which screen boot lands on. */
  function landing(settingsDoc, parsed) {
    const onboarding = settingsDoc && settingsDoc.onboarding;
    const isTest = Boolean(parsed && parsed.test);
    const firstLaunch = !isTest && Boolean(onboarding) && onboarding.firstLaunchDone === false;

      mode: 'menu',

  // ---------------------------------------------------------------------------------------------

    // and a merged record would keep its old (non-reload) class and never show #fatal.
    const cause = new Error('escalated by boot: ' + record.code);

    if (state.errorOff) state.errorOff();

  // Audio unlock gesture for returning users (Part 6.29.4.3)

    state.gestureOff = null;
  }

  }

    if (state.gestureOff) return removeUnlockGesture;
    const overlay = doc.getElementById('overlay');
    const offPointer = Core.dom.on(overlay, 'pointerdown', onGesture, { capture: true }, BOOT_OWNER);
    const offKey = Core.dom.on(window, 'keydown', onGesture, { capture: true }, BOOT_OWNER);

  // ---------------------------------------------------------------------------------------------

    + 'background:var(--c-panel);border:var(--border);border-radius:var(--r-2);color:var(--c-text);';

    return label + ': ' + (isDone ? 'Ready' : 'Checking');
  }

    const overlay = doc.getElementById('overlay');

    panel.setAttribute('role', 'status');

      const row = doc.createElement('div');

  }

    run.panelTimer = null;

  }

  // ---------------------------------------------------------------------------------------------

    return { skipped: true };
  }

    // (Part 7.11), so it goes on screen first (showFatal keeps the first text it is given).
    const text = Core.Text.get('E-GEN-001:boot', { name: missing });
    Core.ErrorReporter.showFatal({ code: 'E-GEN-001', userMessage: text });
    Core.ErrorReporter.fatal('E-GEN-001', null, { module: missing });
    return missing;

    if (run.main) applyUrlParams(run.params);

  }

    return {};
  }

    if (run.gate.hard.length === 0) return {};
    const row = run.gate.hard[0];

    return { ok: false, fatal: true, code: row.code };

  function gateWithStorage(run, status) {

    if (status.idb && status.idb.ok === false) overlay.indexedDB = false;

  async function stepStorage(run) {
