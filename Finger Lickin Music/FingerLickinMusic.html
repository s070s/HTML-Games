    const sampleRate = () => (ctx ? ctx.sampleRate : 0);
    const finiteOrZero = (value) => (typeof value === 'number' && Number.isFinite(value) ? value : 0);
    const isMobile = () => (typeof options.mobile === 'boolean' ? options.mobile : Core.Caps.isMobile());

    /** 6.5.4.7: base + output latency; an estimate when the browser reports neither. Informative only (I 3.5). */
    function latency() {
      const base = ctx ? finiteOrZero(ctx.baseLatency) : 0;
      const output = ctx ? finiteOrZero(ctx.outputLatency) : 0;
      if (base + output > 0) return { seconds: base + output, estimated: false, base, output };
      return { seconds: isMobile() ? MOBILE_LATENCY_S : DESKTOP_LATENCY_S, estimated: true, base, output };
    }

    // ---- voices (6.5.4.5) ---------------------------------------------------------------------
    const voiceFeed = { dirty: true, lastAt: null };
    const allocator = createVoiceAllocator({ capacity: polyphonyFor(polyphonySetting(), isMobile()), now,
      onChange: () => { voiceFeed.dirty = true; } });

    function polyphonySetting() {
      return options.polyphony !== undefined ? options.polyphony : readSettingRaw(SETTING_POLYPHONY);
    }

    function voicesPayload() {
      const counts = allocator.stats();
      return { active: counts.active, released: counts.released, capacity: counts.capacity, max: counts.capacity,
        stolen: counts.stolen, dropped: counts.dropped, started: counts.started, peakActive: counts.peakActive };
    }

    /**
     * audio.voices (Part 4.4): cumulative counters since bind, emitted only when they changed and at most 10 Hz
     * of audio time. `force` publishes the current state now (the first one after start).
     * @returns {boolean} true when it emitted
     */
    function publishVoices(force) {
      if (!force && !voiceFeed.dirty) return false;
      const at = now();
      if (!force && voiceFeed.lastAt !== null && at - voiceFeed.lastAt < VOICES_FEED_S) return false;
      voiceFeed.dirty = false;
      voiceFeed.lastAt = at;
      bus.emit('audio.voices', voicesPayload());
      return true;
    }

    // ---- events -------------------------------------------------------------------------------
    function statePayload(state, previous, reason) {
      const info = latency();
      const payload = { state, previous, unlocked, sampleRate: sampleRate(), baseLatencyMs: info.base * MS_PER_SECOND,
        reason };
      if (info.output > 0) payload.outputLatencyMs = info.output * MS_PER_SECOND;
      return payload;
    }

    /** Emits audio.state when the state changed since the last emission; returns whether it emitted. */
    function publishState(reason) {
      const current = stateNow();
      if (current === lastPublished) return false;
      const previous = lastPublished;
      lastPublished = current;
      bus.emit('audio.state', statePayload(current, previous, reason));
      return true;
    }

    function publishUnlocked() {
      const info = latency();
      bus.emit('audio.unlocked', { audioTime: now(), sampleRate: sampleRate(), latencyMs: info.seconds * MS_PER_SECOND,
        attempts, baseLatency: info.base, outputLatency: info.output });
    }

    /**
     * Stall detection (6.5.4.3): the Scheduler calls this with the clock reading of every tick. The third identical
     * reading in a row emits audio.state with reason 'stalled' once; any change of the reading starts over.
     * @returns {boolean} true when the stall was announced by this call
     */
    function observeTick(audioNow) {
      return readTick(audioNow).announced;
    }

    /** The same detection for the Scheduler, which also needs to know that the reading did not move. */
    function readTick(audioNow) {
      if (audioNow !== stall.lastNow) {
        stall.lastNow = audioNow;
        stall.same = 0;
        return { repeated: false, announced: false };
      }
      stall.same += 1;
      if (stall.same !== STALL_TICKS) return { repeated: true, announced: false };
      const current = stateNow();
      bus.emit('audio.state', statePayload(current, current, 'stalled'));
      return { repeated: true, announced: true };
    }

    // ---- the bus graph (6.5.4.2) --------------------------------------------------------------
    function readSettingRaw(path) {
      if (typeof options.readSetting !== 'function') return undefined;
      try {
        return options.readSetting(path);
      } catch (error) {
        Log.warn('audio', 'reading ' + path + ' failed: ' + messageOf(error));
        return undefined;
      }
    }

    function settingOr(path, fallback) {
      const value = readSettingRaw(path);
      return typeof value === 'number' && Number.isFinite(value) ? Core.clamp(value, 0, 1) : fallback;
    }

    function buildGraph() {
      const master = ctx.createGain();
      master.gain.value = levels.master;
      masterState.last = levels.master;
      const limiter = ctx.createDynamicsCompressor();
      Object.keys(LIMITER).forEach((name) => { limiter[name].value = LIMITER[name]; });
      master.connect(limiter);
      limiter.connect(ctx.destination);
      const analyser = ctx.createAnalyser();     // beside the signal path: nothing flows on from it
      analyser.fftSize = ANALYSER_SIZE;
      master.connect(analyser);
      const metronomeBus = ctx.createGain();
      metronomeBus.gain.value = levels.metronome;
      metronomeState.last = levels.metronome;
      metronomeBus.connect(master);
      graph = { master, limiter, analyser, metronomeBus };
    }

    function adoptContext(context) {
      ctx = context;
      ctx.onstatechange = () => { publishState('statechange'); };
      levels.master = settingOr(SETTING_MASTER, DEFAULT_MASTER_VOLUME);
      levels.metronome = settingOr(SETTING_METRONOME, DEFAULT_METRONOME_VOLUME);
      buildGraph();
    }

    function requireGraph() {
      if (isClosed || !graph) throw codedError('E-GEN-004', 'the audio engine has no running graph');
      return graph;
    }

    // Every caller checks `ctx` first, so a second context cannot be made (E-AUD-003 never happens by construction).
    /** Creates the one context. Throws a coded E-AUD-001 on failure. */
    function createContext() {
      let created = null;
      try {
        const fault = Core.Faults.active('audio.fail');
        if (fault && fault.phase === 'init') {
          Core.Faults.take('audio.fail');
          throw new Error('injected audio initialization failure');
        }
        created = factory();
        adoptContext(created);
      } catch (error) {
        discardContext(created);
        ctx = null;
        graph = null;
        throw codedError('E-AUD-001', messageOf(error), error);
      }
    }

    // A context whose graph could not be built must not stay open: a retry would then make a second one.
    function discardContext(context) {
      if (!context || typeof context.close !== 'function') return;
      try {
        Promise.resolve(context.close()).catch(() => {});
      } catch (error) {
        Log.warn('audio', 'discarding the context failed: ' + messageOf(error));
      }
    }

    function reportInitFailure(error) {
      Core.ErrorReporter.fatal('E-AUD-001', error, { module: 'Audio' });
    }

    /** B7: creates the context (suspended until the gesture) and publishes the first state. Idempotent. */
    function init() {
      if (isClosed) throw codedError('E-GEN-004', 'the audio engine is closed');
      if (!ctx) {
        try {
          createContext();
        } catch (error) {
          reportInitFailure(error);
          throw error;
        }
      }
      publishState('init');
      return engine;
    }

    // ---- unlock (6.5.4.1) ---------------------------------------------------------------------
    function blocked(reason) {
      return { ok: false, state: stateNow(), reason };
    }

    function resumeContext() {
      if (ctx.state === 'running') return Promise.resolve();
      try {
        return Promise.resolve(ctx.resume()).catch((error) => {
          Log.warn('audio', 'resume rejected: ' + messageOf(error));
        });
      } catch (error) {
        Log.warn('audio', 'resume failed: ' + messageOf(error));
        return Promise.resolve();
      }
    }

    // Waits for the promise, but never longer than the limit: some browsers never settle a blocked resume().
    function settleWithin(promise, limitMs) {
      return new Promise((resolve) => {
        const timer = Core.timers.setTimeout(resolve, limitMs, owner);
        promise.then(() => {
          Core.timers.clearTimeout(timer);
          resolve();
        });
      });
    }

    function markUnlocked() {
      const first = !unlocked;
      unlocked = true;
      publishState('gesture');
      if (first) publishUnlocked();
    }

    async function runUnlock() {
      requestPlaybackSession();
      if (!ctx) {
        try {
          createContext();
        } catch (error) {
          reportInitFailure(error);
          return blocked('E-AUD-001');
        }
        publishState('init');
      }
      const needed = ctx.state !== 'running';
      const resumed = resumeContext();           // called before any await: the gesture is still active
      if (needed) playSilentKick(ctx);
      await settleWithin(resumed, UNLOCK_TIMEOUT_MS);
      if (isClosed) return blocked('E-AUD-002');
      if (ctx.state === 'running') {
        markUnlocked();
        return { ok: true, state: 'running' };
      }
      publishState('gesture');
      Log.info('audio', 'E-AUD-002: sound is still blocked', { state: ctx.state });
      return blocked('E-AUD-002');
    }

    /** Must run inside a user gesture handler. Concurrent calls share one promise; never creates a second context. */
    function unlock() {
      if (unlocking) return unlocking;
      if (isClosed) return Promise.resolve(blocked('E-AUD-002'));
      attempts += 1;
      unlocking = runUnlock().finally(() => { unlocking = null; });
      return unlocking;
    }

    /** DLG-ResumeAudio: resumes a suspended or interrupted context inside the click. */
    const resume = () => unlock().then((result) => result.ok);
    const isUnlocked = () => unlocked && !isClosed && stateNow() !== 'closed';

    // ---- volumes and fades (6.5.4.8) ----------------------------------------------------------
    function setMasterGain(value) {
      levels.master = Core.clamp(requireFinite(value, 'master volume'), 0, 1);
      if (!graph || fadeHeld) return;
      rampThrough(masterState, graph.master.gain, now(), [[levels.master, VOLUME_RAMP_S]]);
    }

    function setMetronomeGain(value) {
      levels.metronome = Core.clamp(requireFinite(value, 'metronome volume'), 0, 1);
      if (!graph) return;
      rampThrough(metronomeState, graph.metronomeBus.gain, now(), [[levels.metronome, VOLUME_RAMP_S]]);
    }

    /** Master to 0 over STOP_FADE_S and held there until fadeIn (a pause). */
    function fadeOut(at) {
      requireGraph();
      fadeHeld = true;
      rampThrough(masterState, graph.master.gain, at === undefined ? now() : at, [[0, STOP_FADE_S]]);
    }

    /** Master back to the volume over START_FADE_S. */
    function fadeIn(at) {
      requireGraph();
      fadeHeld = false;
      rampThrough(masterState, graph.master.gain, at === undefined ? now() : at, [[levels.master, START_FADE_S]]);
    }

    // A stop dips the master and brings it back, so live notes (Free Play) stay audible after the song ends.
    function dipMaster(at) {
      fadeHeld = false;
      rampThrough(masterState, graph.master.gain, at, [[0, STOP_FADE_S], [levels.master, START_FADE_S]]);
    }

    function onTransportState(event) {
      if (!event || !graph) return;
      if (event.state === 'paused') fadeOut(now());
      else if (event.state === 'stopped') dipMaster(now());
      else if (fadeHeld) fadeIn(now());
    }

    function onSettingsChanged(event) {
      if (!event) return;
      if (event.key === SETTING_MASTER) setMasterGain(event.value);
      else if (event.key === SETTING_METRONOME) setMetronomeGain(event.value);
      else if (event.key === SETTING_POLYPHONY) setPolyphony(event.value);
      else if (event.key === '*') {
        setMasterGain(settingOr(SETTING_MASTER, levels.master));
        setMetronomeGain(settingOr(SETTING_METRONOME, levels.metronome));
        setPolyphony(readSettingRaw(SETTING_POLYPHONY));
      }
    }

    // 0 (or anything else that is not a whole number) means "automatic": 64 on desktop, 32 on mobile.
    function setPolyphony(setting) {
      allocator.setCapacity(polyphonyFor(setting, isMobile()));
    }

    // ---- strips and solo (6.5.4.2) ------------------------------------------------------------
    const silencedBySolo = (trackId) => soloSet.size > 0 && !soloSet.has(trackId);

    function refreshAllMutes() {
      strips.forEach((strip) => strip.refreshMute());
    }

    function setSolo(trackId, flag) {
      requireTrackId(trackId);
      if (flag) soloSet.add(trackId);
      else soloSet.delete(trackId);
      refreshAllMutes();
    }

    function setMute(trackId, flag) {
      const strip = strips.get(requireTrackId(trackId));
      if (!strip) return false;
      strip.setMute(flag);
      return true;
    }

    function disposeStrip(trackId) {
      const strip = strips.get(trackId);
      if (!strip) return;
      strips.delete(trackId);
      soloSet.delete(trackId);
      strip.release();
      refreshAllMutes();
    }

    // A handle that was disposed before must not dispose the newer strip of the same track.
    function disposeOwnStrip(trackId, strip) {
      if (strips.get(trackId) === strip) disposeStrip(trackId);
    }

    const stripEnv = Object.freeze({
      context: () => ctx, master: () => graph.master, now, silencedBySolo,
      isSolo: (trackId) => soloSet.has(trackId), setSolo, dispose: disposeOwnStrip
    });

    /** The strip of a track; the same object until it is disposed. */
    function createStrip(trackId) {
      requireTrackId(trackId);
      requireGraph();
      if (strips.has(trackId)) return strips.get(trackId);
      const strip = buildStrip(stripEnv, trackId);
      strips.set(trackId, strip);
      return strip;
    }

    // ---- metronome (6.5.4.6) ------------------------------------------------------------------
    function click(atAudio, accent) {
      requireGraph();
      const shape = accent ? CLICKS.accent : CLICKS.normal;
      const at = requireFinite(atAudio, 'click time');
      const oscillator = ctx.createOscillator();
      oscillator.type = 'triangle';
      oscillator.frequency.value = shape.hz;
      const envelope = ctx.createGain();
      envelope.gain.setValueAtTime(0, at);
      envelope.gain.linearRampToValueAtTime(shape.level, at + CLICK_ATTACK_S);
      envelope.gain.exponentialRampToValueAtTime(CLICK_FLOOR, at + shape.decayS);
      oscillator.connect(envelope);
      envelope.connect(graph.metronomeBus);
      oscillator.onended = () => {
        oscillator.disconnect();
        envelope.disconnect();
      };
      oscillator.start(at);
      oscillator.stop(at + CLICK_STOP_S);
    }

    /** M-28 enter step 6: the metronome settings of the mode, `{accent?:boolean, volume?:0..1}`. */
    function configureMetronome(settings) {
      const given = settings || {};
      if (typeof given.accent === 'boolean') metronomeLook.accent = given.accent;
      if (typeof given.volume === 'number') setMetronomeGain(given.volume);
    }

    // ---- peak meter (6.5.4.9) -----------------------------------------------------------------
    function readSamples() {
      const analyser = requireGraph().analyser;
      if (typeof analyser.getFloatTimeDomainData === 'function') {
        analyser.getFloatTimeDomainData(scratch);
        return;
      }
      const bytes = new Uint8Array(ANALYSER_SIZE);
      analyser.getByteTimeDomainData(bytes);
      for (let index = 0; index < ANALYSER_SIZE; index += 1) scratch[index] = (bytes[index] - 128) / 128;
    }

    /** Peak of the master output now, a clip flag, and a held peak that decays with HOLD_DECAY_S. */
    function peak() {
      readSamples();
      let level = 0;
      for (let index = 0; index < ANALYSER_SIZE; index += 1) level = Math.max(level, Math.abs(scratch[index]));
      const at = now();
      const elapsed = levels.lastReadAt === null ? 0 : Math.max(0, at - levels.lastReadAt);
      levels.lastReadAt = at;
      levels.hold = Math.max(level, levels.hold * Math.exp(-elapsed / HOLD_DECAY_S));
      return { peak: level, clip: level >= CLIP_LEVEL, holdPeak: levels.hold };
    }

    function emitPeak() {
      if (bus.listenerCount('audio.peak') === 0 || !graph) {
        stopPeakFeed();
        return;
      }
      const reading = peak();
      bus.emit('audio.peak', { l: reading.peak, r: reading.peak, clipped: reading.clip, audioTime: now() });
    }

    function stopPeakFeed() {
      if (peakTimer === null) return;
      Core.timers.clearInterval(peakTimer);
      peakTimer = null;
    }

    /** audio.peak runs at 10 Hz only while somebody listens; the returned function stops listening. */
    function subscribePeak(listener, listenerOwner) {
      requireGraph();
      const off = bus.on('audio.peak', listener, listenerOwner);
      if (peakTimer === null) peakTimer = Core.timers.setInterval(emitPeak, PEAK_FEED_MS, owner);
      return () => {
        off();
        if (bus.listenerCount('audio.peak') === 0) stopPeakFeed();
      };
    }

    // ---- close --------------------------------------------------------------------------------
    function close() {
      if (isClosed) return;
      stopPeakFeed();
      scheduler.unbind();
      bus.removeOwner(owner);
      Array.from(strips.keys()).forEach(disposeStrip);
      const closing = ctx;
      isClosed = true;
      if (closing) closing.onstatechange = null;
      publishState('statechange');
      if (!closing || typeof closing.close !== 'function') return;
      Promise.resolve(closing.close()).catch((error) => Log.warn('audio', 'close failed: ' + messageOf(error)));
    }

    // ---- assembly -----------------------------------------------------------------------------
    const scheduler = createScheduler({ bus, owner, allocator, now, perfNow: Core.now, readTick,
      hasStrip: (trackId) => strips.has(trackId), createStrip, disposeStrip, click,
      accentOn: () => metronomeLook.accent, fadeIn, fadeOut, setMasterGain, publishVoices,
      reportError: (error) => Core.ErrorReporter.report('E-AUD-004', error,
        { module: 'Audio', origin: 'scheduler' }) });
    if (options.context) adoptContext(options.context);
    bus.on('transport.state', onTransportState, owner);
    bus.on('settings.changed', onSettingsChanged, owner);

    engine = Object.freeze({
      init, unlock, resume, isUnlocked, ctx: () => ctx, clock: () => clock, state: stateNow, now, latency, sampleRate,
      ctxCount: () => (ctx ? 1 : 0), close, observeTick,
      get master() { return graph ? graph.master : null; },
      get limiter() { return graph ? graph.limiter : null; },
      get analyser() { return graph ? graph.analyser : null; },
      get metronomeBus() { return graph ? graph.metronomeBus : null; },
      setMasterGain, masterGain: () => levels.master, setMetronomeGain, metronomeGain: () => levels.metronome,
      createStrip, disposeStrip, strips: () => Array.from(strips.values()), stripCount: () => strips.size,
      setSolo, setMute, soloSet: () => new Set(soloSet),
      Metronome: Object.freeze({ click, configure: configureMetronome }), peak, subscribePeak, fadeOut, fadeIn,
      VoiceAllocator: allocator, Scheduler: scheduler
    });
    return engine;
  }

  // ---------------------------------------------------------------------------------------------
  // FLM.Audio: the factory and the members of the one app engine (6.5.2)
  // ---------------------------------------------------------------------------------------------
  let appEngine = null;
  const NO_CLOCK = Object.freeze({ now: () => 0 });
  const NO_LATENCY = Object.freeze({ seconds: DESKTOP_LATENCY_S, estimated: true, base: 0, output: 0 });

  /** M-29 B7: creates the app-wide engine (once) and its context. A second call returns the same engine. */
  function init(opts) {
    if (!appEngine) appEngine = createEngine(opts);
    return appEngine.init();
  }

  const forward = (name, fallback) => (...args) => (appEngine ? appEngine[name](...args) : fallback);
  const nodeOf = (name) => (appEngine ? appEngine[name] : null);

  /** Never throws: it runs inside gesture handlers. Without init() it starts the engine with default options. */
  function unlock() {
    try {
      if (!appEngine) init();
      return appEngine.unlock();
    } catch (error) {
      return Promise.resolve({ ok: false, state: 'none', reason: error.code || 'E-AUD-001' });
    }
  }

  // The `scheduler` provider of SCR-Diagnostics and the perf harness (Part 9.7.2): counts only, nothing to redact.
  Core.Diagnostics.provide('scheduler', () => (appEngine ? appEngine.Scheduler.diagnostics() : { bound: false }));

  return Object.freeze({
    createEngine, createVoiceAllocator, polyphonyFor, init, LIMITER, RAMP_S, START_FADE_S, STOP_FADE_S, LOOKAHEAD_S,
    TICK_MS, SOFT_PANIC_S, VOICE_MAX_S, STEAL_FADE_S,
    unlock, resume: () => unlock().then((result) => result.ok),
    ctx: forward('ctx', null), isUnlocked: forward('isUnlocked', false),
    clock: () => (appEngine ? appEngine.clock() : NO_CLOCK), state: forward('state', 'none'),
    now: forward('now', 0), latency: forward('latency', NO_LATENCY), sampleRate: forward('sampleRate', 0),
    ctxCount: forward('ctxCount', 0), close: forward('close'), observeTick: forward('observeTick', false),
    get master() { return nodeOf('master'); },
    get limiter() { return nodeOf('limiter'); },
    get metronomeBus() { return nodeOf('metronomeBus'); },
    setMasterGain: forward('setMasterGain'), masterGain: forward('masterGain', DEFAULT_MASTER_VOLUME),
    setMetronomeGain: forward('setMetronomeGain'), metronomeGain: forward('metronomeGain', DEFAULT_METRONOME_VOLUME),
    createStrip: forward('createStrip'), disposeStrip: forward('disposeStrip'), strips: forward('strips', []),
    stripCount: forward('stripCount', 0), setSolo: forward('setSolo'), setMute: forward('setMute', false),
    soloSet: forward('soloSet', new Set()),
    get Metronome() { return nodeOf('Metronome'); },
    get VoiceAllocator() { return nodeOf('VoiceAllocator'); },
    get Scheduler() { return nodeOf('Scheduler'); },
    peak: forward('peak'), subscribePeak: forward('subscribePeak'), fadeOut: forward('fadeOut'),
    fadeIn: forward('fadeIn')
  });
});
})();

// ==== 07-input.js ====
// 07-input.js - M-07 FLM.Input: every physical input source (keyboard, pointer or touch pads, gamepad, optional Web
// MIDI) becomes one normalized InputEvent on input.event, with one lifecycle per control, key repeat and duplicate
// presses suppressed, every held control released when focus or the device goes away, and a performance-time to
// audio-time anchor (median of the last 20 samples).
// Separation rule: this file owns exactly one namespace (Input) and registers it once through FLM.Core.define.
// It may use only lower-numbered modules (Part 4.2, R-DEP). It declares no module-level global state object (S-07):
// all state lives inside the factory closure. It reads FLM.Audio and FLM.Transport lazily, because M-05 is built
// later (T04.01) and tests swap both namespaces.
// Delivered so far: T03.01 (keyboard, anchor), T03.02 (pointer, touch, gamepad, MIDI), T03.03 (lifecycle), T03.04
// (getMap, setMap, remap, unmap, resetMap, conflicts and the input.map event), T03.09 (setCalibration and calibration:
// storage for the UI only).
// Spec: docs/IMPLEMENTATION-PLAN.md Part 6.7 (API 6.7.2, algorithms 6.7.4), Part 4.5 (anchor), ADR-10 (Part 2.10).
(function () {
'use strict';
const FLM = window.FLM;

FLM.Core.define('Input', function (FLM) {
  const Core = FLM.Core;
  const bus = Core.bus;
  const Log = Core.Log;
  const doc = window.document;
  const nav = window.navigator;

  const INPUT_OWNER = Symbol('input');          // owner token of every listener and subscription of this module
  const NO_AUDIO_SOURCE = Object.freeze({});    // anchor source while M-05 does not exist (identity mapping)
  const SYSTEM = 'system';

  const ANCHOR_RING_SIZE = 20;                  // Part 4.5: the median of the 20 latest samples
  const ANCHOR_SAMPLE_GAP_MS = 25;              // samples are taken at most this often
  const ANCHOR_SPREAD_WARN_MS = 5;
  const ANCHOR_EVENT_SHIFT_SEC = 0.001;         // input.anchor fires only when the median moved by more than this
  const ANCHOR_EVENT_GAP_MS = 1000;             // and at most once per second
  const STAMP_SANITY_MS = 60000;                // an event stamp further from now than this is not performance-origin
  const MS_PER_SECOND = 1000;
  const MAX_POINTERS = 10;                      // pointer tracks kept; the oldest is dropped beyond this
  const PAD_COUNT = 4;
  const GAMEPAD_DOWN_LEVEL = 0.5;               // an analog button counts as pressed above this value
  const MOUSE_PRIMARY_BUTTON = 0;
  const DEFAULT_TOUCH_PRESSURE = 0.5;           // what pointer events report when the device has no pressure
  const MIDI_NOTE_OFF = 0x80;
  const MIDI_NOTE_ON = 0x90;
  const MIDI_CONTROL_CHANGE = 0xB0;
  const MIDI_STATUS_MASK = 0xF0;
  const MIDI_VELOCITY_MAX = 127;
  const MIDI_SUSTAIN_THRESHOLD = 64;
  const TEXT_TAGS = Object.freeze(['INPUT', 'TEXTAREA', 'SELECT']);
  const NEVER_PREVENTED = Object.freeze(['Escape']);   // the browser keeps Escape (fullscreen exit); pause still fires
  const TOUCH_API_VALUES = Object.freeze(['auto', 'pointer', 'touch']);
  const ACTIVE_LISTENER = Object.freeze({ passive: false });
  const DEBUG_SOURCES = Object.freeze(['gamepad', 'midi', 'pointer']);
  const CAPTURE_LISTENER = Object.freeze({ capture: true, passive: false });

  function deepFreeze(value) {
    Object.keys(value).forEach((key) => {
      if (value[key] !== null && typeof value[key] === 'object') deepFreeze(value[key]);
    });
    return Object.freeze(value);
  }

  // ---------------------------------------------------------------------------------------------
  // Control names, contexts and default maps (Part 6.7.1)
  // ---------------------------------------------------------------------------------------------
  const LANE_NAMES = Object.freeze(['lane0', 'lane1', 'lane2', 'lane3']);
  const DANCE_NAMES = Object.freeze(['dance0', 'dance1', 'dance2', 'dance3']);
  const PROFILE_NAMES = Object.freeze(['profile1', 'profile2', 'profile3', 'profile4', 'profile5', 'profile6']);
  const CONTROLS = Object.freeze([].concat(LANE_NAMES, DANCE_NAMES, ['pause', 'panic', 'octUp', 'octDown'],
    PROFILE_NAMES, ['sustain']));
  const CONTEXTS = Object.freeze(['menu', 'instrument', 'freeplay', 'dance', 'studio']);
  const PLAY_CONTROLS = [].concat(LANE_NAMES, ['octUp', 'octDown', 'sustain', 'pause', 'panic']);
  const LIVE_CONTROLS = deepFreeze({
    menu: [],
    instrument: PLAY_CONTROLS.slice(),
    freeplay: PLAY_CONTROLS.concat(PROFILE_NAMES),
    studio: PLAY_CONTROLS.concat(PROFILE_NAMES),
    dance: [].concat(DANCE_NAMES, ['pause', 'panic'])
  });
  const FREE_PLAY_CONTEXTS = Object.freeze(['freeplay', 'studio']);   // the contexts that accept midi:<n> controls
  // The keyboard map tables, in the order conflicts are searched.
  const KEYBOARD_CONTEXTS = Object.freeze(['instrument', 'freeplay', 'studio', 'dance', 'global']);
  const GLOBAL_CONTROLS = Object.freeze(['pause', 'panic', 'panicWhilePaused']);
  const MAX_CODES_PER_CONTROL = 3;
  const KEY_CODE_PATTERN = /^[A-Za-z0-9]{1,32}$/;
  const MIDI_NOTE_MAX = 127;

  function instrumentKeys() {
    return { lane0: ['KeyA'], lane1: ['KeyS'], lane2: ['KeyK'], lane3: ['KeyL'], octDown: ['KeyQ'], octUp: ['KeyE'],
      sustain: ['ShiftLeft', 'ShiftRight'] };
  }

  function freePlayKeys() {
    return Object.assign(instrumentKeys(), { profile1: ['Digit1'], profile2: ['Digit2'], profile3: ['Digit3'],
      profile4: ['Digit4'], profile5: ['Digit5'], profile6: ['Digit6'] });
  }

  const DEFAULT_MAPS = deepFreeze({
    version: 1,
    keyboard: {
      instrument: instrumentKeys(),
      freeplay: freePlayKeys(),
      studio: freePlayKeys(),
      dance: { dance0: ['ArrowLeft', 'KeyD'], dance1: ['ArrowDown', 'KeyF'], dance2: ['ArrowUp', 'KeyJ'],
        dance3: ['ArrowRight', 'KeyK'] },
      global: { pause: ['Escape'], panic: ['KeyP'], panicWhilePaused: ['Space'] }
    },
    midi: { lane0: 60, lane1: 62, lane2: 64, lane3: 65, sustainCC: 64 }
  });

  // Standard-mapping gamepad tables (Part 6.7.1): button index -> control. Fixed in v1, not remappable.
  const GAMEPAD_PLAY_MAP = Object.freeze({ 0: 'lane0', 1: 'lane1', 2: 'lane2', 3: 'lane3', 4: 'octDown',
    5: 'octUp', 6: 'sustain', 7: 'sustain', 8: 'panic', 9: 'pause', 12: 'octUp', 13: 'octDown' });
  const GAMEPAD_DANCE_MAP = Object.freeze({ 0: 'dance1', 1: 'dance3', 2: 'dance0', 3: 'dance2', 8: 'panic',
    9: 'pause', 12: 'dance2', 13: 'dance1', 14: 'dance0', 15: 'dance3' });

  // ---------------------------------------------------------------------------------------------
  // State (inside the closure, never module level)
  // ---------------------------------------------------------------------------------------------
  function newAnchor() {
    return { ring: new Float64Array(ANCHOR_RING_SIZE), filled: 0, next: 0, lastSampleMs: -Infinity, median: null,
      source: null, method: 'currentTime', spreadWarned: false, emittedOffset: null, emittedAtMs: -Infinity };
  }

  const state = {
    attached: null,                  // {target, padRoot, surface, offs[]} while init() is in force
    context: 'menu',
    maps: Core.deepClone(DEFAULT_MAPS),   // a private, editable copy; DEFAULT_MAPS stays frozen
    keyLookup: new Map(),            // physical code -> control for the current context plus the global table
    touchApi: 'auto',
    useTouchEvents: false,
    bindings: new Map(),             // owner -> context, one entry per bind()
    heldOrder: [],                   // control names in press order
    keysDown: new Set(),             // physical keys believed down
    tracks: new Map(),               // 'ptr<id>' or 't<id>' -> {key, padIndex}
    pads: { elements: [], rects: [], dirty: true },
    anchor: newAnchor(),
    gamepad: { prev: null, announced: new Map(), synthetic: undefined, nonStandardLogged: false },
    midi: { access: null, pending: null, stateOff: null, ports: new Map(), passThrough: false }
  };
  const records = new Map();         // control name -> {pressed, owner, tAudioPressed, tPerfPressed}, created lazily

  // ---------------------------------------------------------------------------------------------
  // Time: stamps and the audio anchor (Part 4.5, 6.7.4 A and B)
  // ---------------------------------------------------------------------------------------------
  /** The event's own performance-origin stamp when it is plausible, else the time of handling. */
  function stampOf(event) {
    const nowMs = Core.now();
    const stamp = event ? event.timeStamp : undefined;
    const plausible = Number.isFinite(stamp) && stamp > 0 && Math.abs(stamp - nowMs) < STAMP_SANITY_MS;
    return plausible ? stamp : nowMs;
  }

  /** One reading of the audio clock: {source, offsetSec, method}, or null while there is no running context. */
  function readClock(nowMs) {
    const audio = FLM.Audio;
    if (!audio || typeof audio.ctx !== 'function') {
      return { source: NO_AUDIO_SOURCE, offsetSec: 0, method: 'currentTime' };   // same as the Transport fallback clock
    }
    const context = audio.ctx();
    if (!context || context.state !== 'running') return null;
    const stamp = typeof context.getOutputTimestamp === 'function' ? context.getOutputTimestamp() : null;
    if (stamp && Number.isFinite(stamp.contextTime) && Number.isFinite(stamp.performanceTime) &&
      stamp.performanceTime > 0) {
      return { source: context, offsetSec: stamp.contextTime - stamp.performanceTime / MS_PER_SECOND,
        method: 'outputTimestamp' };
    }
    return { source: context, offsetSec: context.currentTime - nowMs / MS_PER_SECOND, method: 'currentTime' };
  }

  function clearAnchor() {
    const anchor = state.anchor;
    anchor.filled = 0;
    anchor.next = 0;
    anchor.lastSampleMs = -Infinity;
    anchor.median = null;
    anchor.source = null;
    anchor.spreadWarned = false;
  }

  function sortedSamples() {
    const anchor = state.anchor;
    return Array.from(anchor.ring.subarray(0, anchor.filled)).sort((a, b) => a - b);
  }

  function medianOf(sorted) {
    const middle = sorted.length >> 1;
    return sorted.length % 2 === 1 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
  }

  function spreadMsOf(sorted) {
    return sorted.length === 0 ? 0 : (sorted[sorted.length - 1] - sorted[0]) * MS_PER_SECOND;
  }

  function jitterMsOf(sorted) {
    const quarter = sorted[Math.floor(sorted.length * 0.25)];
    const threeQuarters = sorted[Math.floor(sorted.length * 0.75)];
    return (threeQuarters - quarter) * MS_PER_SECOND;
  }

  function noteSpread(spreadMs) {
    const anchor = state.anchor;
    if (spreadMs > ANCHOR_SPREAD_WARN_MS && !anchor.spreadWarned) {
      Log.warn('input', 'INP_ANCHOR_SPREAD', { spreadMs: Math.round(spreadMs * 10) / 10 });
    }
    anchor.spreadWarned = spreadMs > ANCHOR_SPREAD_WARN_MS;
  }

  function emitAnchorIfMoved(nowMs, sorted) {
    const anchor = state.anchor;
    const first = anchor.emittedOffset === null;
    if (!first && Math.abs(anchor.median - anchor.emittedOffset) <= ANCHOR_EVENT_SHIFT_SEC) return;
    const gap = nowMs - anchor.emittedAtMs;
    if (!first && gap >= 0 && gap < ANCHOR_EVENT_GAP_MS) return;
    anchor.emittedOffset = anchor.median;
    anchor.emittedAtMs = nowMs;
    bus.emit('input.anchor', { offsetSec: anchor.median, samples: anchor.filled, jitterMs: jitterMsOf(sorted),
      method: anchor.method });
  }

  /** Takes one anchor sample when the last one is 25 ms old or older (or `force`). nowMs: performance time of now. */
  function sampleAnchor(nowMs, force) {
    const anchor = state.anchor;
    const gap = nowMs - anchor.lastSampleMs;
    if (!force && gap >= 0 && gap < ANCHOR_SAMPLE_GAP_MS) return;
    const reading = readClock(nowMs);
    if (!reading) return;
    if (anchor.source !== null && anchor.source !== reading.source) clearAnchor();   // a rebuilt context: new time base
    anchor.source = reading.source;
    anchor.method = reading.method;
    anchor.ring[anchor.next] = reading.offsetSec;
    anchor.next = (anchor.next + 1) % ANCHOR_RING_SIZE;
    anchor.filled = Math.min(anchor.filled + 1, ANCHOR_RING_SIZE);
    anchor.lastSampleMs = nowMs;
    const sorted = sortedSamples();
    anchor.median = medianOf(sorted);
    noteSpread(spreadMsOf(sorted));
    emitAnchorIfMoved(nowMs, sorted);
  }

  /** Performance time (ms) to audio time (s); null while no anchor exists. */
  function perfToAudio(tPerf) {
    const median = state.anchor.median;
    return median === null ? null : tPerf / MS_PER_SECOND + median;
  }

  /** The inverse mapping, used by the test fakes; identity (seconds to ms) while no anchor exists. */
  function audioToPerf(tAudio) {
    const median = state.anchor.median;
    return median === null ? tAudio * MS_PER_SECOND : (tAudio - median) * MS_PER_SECOND;
  }

  function anchorSummary() {
    const sorted = sortedSamples();
    return { samples: state.anchor.filled, offsetSec: state.anchor.median, spreadMs: spreadMsOf(sorted) };
  }

  /** Clears the ring and takes a fresh sample at once (the time base may have changed: unlock, rebuild, resume). */
  function resampleAnchor() {
    clearAnchor();
    sampleAnchor(Core.now(), true);
    return anchorSummary();
  }

  function audioTimeFor(tPerf) {
    sampleAnchor(Core.now(), false);
    return perfToAudio(tPerf);
  }

  // ---------------------------------------------------------------------------------------------
  // Control lifecycle: press and release (Part 6.7.4 F)
  // ---------------------------------------------------------------------------------------------
  function recordOf(control) {
    let record = records.get(control);
    if (!record) {
      record = { pressed: false, owner: null, tAudioPressed: null, tPerfPressed: null };
      records.set(control, record);
    }
    return record;
  }

  function sameOwner(a, b) {
    return a.source === b.source && a.physical === b.physical;
  }

  function isLive(control) {
    if (control.indexOf('midi:') === 0) return state.midi.passThrough && FREE_PLAY_CONTEXTS.includes(state.context);
    return LIVE_CONTROLS[state.context].includes(control);
  }

  function emitInput(source, control, type, tPerf, tAudio, pressure) {
    bus.emit('input.event', { source, control, type, tPerf, tAudio, pressure });
  }

  /** @returns {boolean} true when the press was accepted (live, and the control was idle) */
  function press(control, owner, tPerf, pressure) {
    if (!isLive(control)) return false;
    const record = recordOf(control);
    if (record.pressed) return false;       // a press from any owner while pressed is a duplicate
    const tAudio = audioTimeFor(tPerf);
    record.pressed = true;
    record.owner = owner;
    record.tAudioPressed = tAudio;
    record.tPerfPressed = tPerf;
    state.heldOrder.push(control);
    emitInput(owner.source, control, 'press', tPerf, tAudio, pressure === undefined ? 1 : pressure);
    return true;
  }

  /** Releases a control. owner: only that owner may release it; null releases whoever holds it (release-all). */
  function release(control, owner, tPerf, sourceOverride) {
    const record = records.get(control);
    if (!record || !record.pressed) return false;
    if (owner && !sameOwner(owner, record.owner)) return false;
    const holder = record.owner;
    record.pressed = false;
    record.owner = null;
    record.tAudioPressed = null;
    record.tPerfPressed = null;
    state.heldOrder.splice(state.heldOrder.indexOf(control), 1);
    emitInput(sourceOverride || holder.source, control, 'release', tPerf, audioTimeFor(tPerf), 0);
    return true;
  }

  /** Releases every control held by one source (device lost), reported with source 'system'. */
  function releaseOwnedBy(source, reason) {
    const tPerf = Core.now();
    const owned = state.heldOrder.filter((control) => records.get(control).owner.source === source);
    owned.forEach((control) => release(control, null, tPerf, SYSTEM));
    if (owned.length > 0) Log.info('input', 'INP_RELEASE_DEVICE', { source, reason, count: owned.length });
    return owned.length;
  }

  function releaseWhere(shouldRelease) {
    const tPerf = Core.now();
    state.heldOrder.filter(shouldRelease).forEach((control) => release(control, null, tPerf, SYSTEM));
  }

  /** Releases every pressed control with source 'system', in press order; reason is logged, not emitted. */
  function releaseAll(reason) {
    const count = state.heldOrder.length;
    releaseWhere(() => true);
    state.keysDown.clear();
    state.tracks.clear();
    if (state.gamepad.prev) state.gamepad.prev.buttons = {};
    if (count > 0) Log.info('input', 'INP_RELEASE_ALL', { reason: String(reason), count });
  }

  // ---------------------------------------------------------------------------------------------
  // Contexts and binding (Part 6.7.4 I)
  // ---------------------------------------------------------------------------------------------
  function buildKeyLookup(contextName) {
    const lookup = new Map();
    const addTable = (table) => Object.keys(table || {}).forEach((control) => {
      table[control].forEach((code) => { if (!lookup.has(code)) lookup.set(code, control); });
    });
    addTable(state.maps.keyboard[contextName]);
    addTable(state.maps.keyboard.global);
    return lookup;
  }

  function switchContext(next) {
    state.context = next;
    state.keyLookup = next === 'menu' ? new Map() : buildKeyLookup(next);
    releaseWhere((control) => !isLive(control));
    Array.from(state.keysDown).forEach((code) => { if (!state.keyLookup.has(code)) state.keysDown.delete(code); });
    state.pads.dirty = true;
  }

  /** Binds the input context of a mode; releases the controls that are not live in it (source 'system'). */
  function bind(opts) {
    const options = opts || {};
    Core.assert(CONTEXTS.includes(options.context), 'Input.bind needs a context: ' + CONTEXTS.join(', '));
    Core.assert(options.owner !== undefined && options.owner !== null, 'Input.bind needs an owner');
    state.bindings.set(options.owner, options.context);
    switchContext(options.context);
  }

  /** Releases everything and returns to the menu context. Unknown owners are ignored (panel modes never bind). */
  function unbind(owner) {
    if (!state.bindings.delete(owner)) return false;
    releaseAll('mode');
    const remaining = Array.from(state.bindings.values());
    switchContext(remaining.length > 0 ? remaining[remaining.length - 1] : 'menu');
    return true;
  }

  /** Control names live in a context; 'global' and 'midi' list the controls the remap API accepts for them. */
  function controlsFor(contextName) {
    if (contextName === 'global') return GLOBAL_CONTROLS.slice();
    if (contextName === 'midi') return LANE_NAMES.slice();
    return LIVE_CONTROLS[contextName] ? LIVE_CONTROLS[contextName].slice() : [];
  }

  // ---------------------------------------------------------------------------------------------
  // Maps: read, install, remap, unmap, reset and conflict detection (Part 6.7.4 H)
  // ---------------------------------------------------------------------------------------------
  const cloneMaps = (maps) => Core.deepClone(maps);
  const hasOwn = (object, key) => Object.prototype.hasOwnProperty.call(object, key);
  const isPlain = (value) => value !== null && typeof value === 'object' && !Array.isArray(value);
  const sameList = (a, b) => a.length === b.length && a.every((item, index) => item === b[index]);
  const isMidiNumber = (value) => Number.isInteger(value) && value >= 0 && value <= MIDI_NOTE_MAX;
  const isKeyCode = (value) => typeof value === 'string' && KEY_CODE_PATTERN.test(value);

  function refreshKeyLookup() {
    state.keyLookup = state.context === 'menu' ? new Map() : buildKeyLookup(state.context);
  }

  /** input.map: one event per control whose codes changed (source 'keyboard' or 'midi'; codes are note numbers). */
  function emitMapEvent(context, control, codes, source) {
    bus.emit('input.map', { context, control, codes: codes.slice(), source });
  }

  function announceChanges(before, after) {
    KEYBOARD_CONTEXTS.forEach((context) => {
      Object.keys(after.keyboard[context]).forEach((control) => {
        const codes = after.keyboard[context][control];
        const previous = before.keyboard[context][control] || [];
        if (!sameList(previous, codes)) emitMapEvent(context, control, codes, 'keyboard');
      });
    });
    Object.keys(after.midi).forEach((name) => {
      if (before.midi[name] !== after.midi[name]) emitMapEvent('midi', name, [after.midi[name]], 'midi');
    });
  }

  /** Installs a complete, validated map: rebuilds the key lookup, releases everything, announces what changed. */
  function installMaps(next) {
    const before = state.maps;
    state.maps = next;
    refreshKeyLookup();
    releaseAll('context');
    announceChanges(before, next);
  }

  function getMap() {
    return cloneMaps(state.maps);
  }

  // Conflicts: the same code on another control of the same context or of 'global'; 'global' clashes with every
  // context. The first hit in the order instrument, freeplay, studio, dance, global (controls as declared) is returned.
  function conflictScopes(context) {
    return context === 'global' ? KEYBOARD_CONTEXTS : KEYBOARD_CONTEXTS.filter((name) => name === context ||
      name === 'global');
  }

  function findKeyConflict(maps, context, control, code) {
    for (const scope of conflictScopes(context)) {
      const table = maps.keyboard[scope];
      const clash = Object.keys(table).find((name) => (scope !== context || name !== control) &&
        table[name].includes(code));
      if (clash !== undefined) return { context: scope, control: clash, code };
    }
    return null;
  }

  function findMidiConflict(control, note) {
    const clash = LANE_NAMES.find((name) => name !== control && state.maps.midi[name] === note);
    return clash === undefined ? null : { context: 'midi', control: clash, code: note };
  }

  function canRemap(context, control, code) {
    if (context === 'midi') return LANE_NAMES.includes(control) && isMidiNumber(code);
    const table = state.maps.keyboard[context];
    return Boolean(table) && hasOwn(table, control) && isKeyCode(code);
  }

  /** The clash a remap would cause, or null. Names the other control so the UI can say so before anything is saved. */
  function conflicts(context, control, code) {
    if (!canRemap(context, control, code)) return null;
    return context === 'midi' ? findMidiConflict(control, code) : findKeyConflict(state.maps, context, control, code);
  }

  function remapMidi(control, note) {
    if (state.maps.midi[control] === note) return { ok: true };
    const conflict = findMidiConflict(control, note);
    if (conflict) return { ok: false, conflict };
    state.maps.midi[control] = note;
    emitMapEvent('midi', control, [note], 'midi');
    return { ok: true };
  }

  /**
   * Binds a physical code (a KeyboardEvent.code, or a note number for context 'midi') to a control.
   * @returns {{ok:true}|{ok:false, conflict:({context:string, control:string, code:(string|number)}|null)}}
   *   conflict is null when the request itself is unusable or the control already has three codes.
   */
  function remap(context, control, code) {
    if (!canRemap(context, control, code)) {
      Log.warn('input', 'INP_REMAP_INVALID', { context: String(context), control: String(control) });
      return { ok: false, conflict: null };
    }
    if (context === 'midi') return remapMidi(control, code);
    const codes = state.maps.keyboard[context][control];
    if (codes.includes(code)) return { ok: true };
    const conflict = findKeyConflict(state.maps, context, control, code);
    if (conflict) return { ok: false, conflict };
    if (codes.length >= MAX_CODES_PER_CONTROL) {
      Log.warn('input', 'INP_MAP_FULL', { context, control });
      return { ok: false, conflict: null };
    }
    codes.push(code);
    refreshKeyLookup();
    emitMapEvent(context, control, codes, 'keyboard');
    return { ok: true };
  }

  /** Removes one code. A control keeps at least one code (replace it with remap first), so the last one is refused. */
  function unmap(context, control, code) {
    const table = state.maps.keyboard[context];
    const codes = table && hasOwn(table, control) ? table[control] : null;
    if (!codes || codes.length <= 1 || !codes.includes(code)) return false;
    codes.splice(codes.indexOf(code), 1);
    refreshKeyLookup();
    emitMapEvent(context, control, codes, 'keyboard');
    return true;
  }

  /** Restores the defaults of one context ('midi' included), or of everything when context is undefined. */
  function resetMap(context) {
    const next = cloneMaps(state.maps);
    const defaults = cloneMaps(DEFAULT_MAPS);
    if (context === undefined) {
      next.keyboard = defaults.keyboard;
      next.midi = defaults.midi;
    } else if (context === 'midi') {
      next.midi = defaults.midi;
    } else if (KEYBOARD_CONTEXTS.includes(context)) {
      next.keyboard[context] = defaults.keyboard[context];
    } else {
      Log.warn('input', 'INP_RESET_INVALID', { context: String(context) });
      return;
    }
    installMaps(next);
  }

  // setMap: deep validation of supplied (possibly stale or corrupt) data. Anything unusable falls back to the default
  // of that control and is reported in errors; the call never throws.
  function usableCodes(raw, label, errors) {
    if (!Array.isArray(raw)) {
      errors.push(label + ': the codes must be a list');
      return null;
    }
    const valid = [];
    raw.forEach((code) => {
      if (!isKeyCode(code)) errors.push(label + ': invalid code ' + JSON.stringify(String(code).slice(0, 40)));
      else if (!valid.includes(code)) valid.push(code);
    });
    if (valid.length > MAX_CODES_PER_CONTROL) {
      errors.push(label + ': more than ' + MAX_CODES_PER_CONTROL + ' codes');
      valid.length = MAX_CODES_PER_CONTROL;
    }
    if (valid.length === 0) errors.push(label + ': no usable code, the default is kept');
    return valid.length > 0 ? valid : null;
  }

  function readContextTable(raw, table, context, errors) {
    if (!isPlain(raw)) {
      errors.push(context + ': the table must be an object');
      return;
    }
    Object.keys(raw).forEach((control) => {
      if (!hasOwn(table, control)) {
        errors.push(context + '.' + control + ': unknown control');
        return;
      }
      const codes = usableCodes(raw[control], context + '.' + control, errors);
      if (codes) table[control] = codes;
    });
  }

  function readKeyboard(raw, next, errors) {
    if (!isPlain(raw)) {
      errors.push('keyboard: must be an object');
      return;
    }
    Object.keys(raw).forEach((context) => {
      if (KEYBOARD_CONTEXTS.includes(context)) readContextTable(raw[context], next.keyboard[context], context, errors);
      else errors.push('keyboard.' + context + ': unknown context');
    });
  }

  /** Keeps the first binding of a code, drops later ones (6.7.4 H.4). @returns {boolean} false: a control has no key */
  function dropClashingCodes(next, errors) {
    const settled = { keyboard: {} };
    KEYBOARD_CONTEXTS.forEach((context) => { settled.keyboard[context] = {}; });
    KEYBOARD_CONTEXTS.forEach((context) => {
      Object.keys(next.keyboard[context]).forEach((control) => {
        settled.keyboard[context][control] = [];
        next.keyboard[context][control].forEach((code) => {
          const clash = findKeyConflict(settled, context, control, code);
          if (clash) errors.push(context + '.' + control + ': ' + code + ' is already used by ' + clash.control);
          else settled.keyboard[context][control].push(code);
        });
      });
    });
    const everyControlHasKeys = KEYBOARD_CONTEXTS.every((context) => Object.keys(settled.keyboard[context])
      .every((control) => restoreDefaultKeys(settled, context, control, errors)));
    if (everyControlHasKeys) next.keyboard = settled.keyboard;
    return everyControlHasKeys;
  }

  /** A control that lost every code gets the default codes nobody else holds. @returns {boolean} false: none free */
  function restoreDefaultKeys(settled, context, control, errors) {
    const codes = settled.keyboard[context][control];
    if (codes.length > 0) return true;
    const free = DEFAULT_MAPS.keyboard[context][control].filter((code) => !findKeyConflict(settled, context, control,
      code));
    codes.push(...free);
    if (free.length > 0) errors.push(context + '.' + control + ': the default keys are used');
    return free.length > 0;
  }

  function readMidi(raw, next, errors) {
    if (!isPlain(raw)) {
      errors.push('midi: must be an object');
      return;
    }
    const candidate = Object.assign({}, next.midi);
    Object.keys(raw).forEach((name) => {
      if (!hasOwn(candidate, name)) errors.push('midi.' + name + ': unknown setting');
      else if (!isMidiNumber(raw[name])) errors.push('midi.' + name + ': must be a whole number from 0 to 127');
      else candidate[name] = raw[name];
    });
    const notes = LANE_NAMES.map((name) => candidate[name]);
    if (new Set(notes).size !== notes.length) {
      errors.push('midi: the lane notes must differ, the defaults are kept');
      return;
    }
    next.midi = candidate;
  }

  /** Validates and installs maps. @returns {{ok:boolean, errors:string[]}} never throws */
  function setMap(maps) {
    const errors = [];
    const next = cloneMaps(DEFAULT_MAPS);
    if (!isPlain(maps)) {
      errors.push('maps: must be an object');
    } else {
      if (maps.version !== undefined && maps.version !== DEFAULT_MAPS.version) errors.push('version: not supported');
      Object.keys(maps).forEach((name) => {
        if (!['version', 'keyboard', 'midi'].includes(name)) errors.push(name + ': unknown section');
      });
      if (maps.keyboard !== undefined) readKeyboard(maps.keyboard, next, errors);
      if (maps.midi !== undefined) readMidi(maps.midi, next, errors);
      if (!dropClashingCodes(next, errors)) {
        errors.push('keyboard: a control lost every code, the default keys are used');
        next.keyboard = cloneMaps(DEFAULT_MAPS).keyboard;
      }
    }
    if (errors.length > 0) Log.warn('input', 'INP_MAP_INVALID', { count: errors.length, first: errors[0] });
    installMaps(next);
    return { ok: errors.length === 0, errors };
  }

  // ---------------------------------------------------------------------------------------------
  // Keyboard (Part 6.7.4 C)
  // ---------------------------------------------------------------------------------------------
  /** KeyboardEvent.code; a soft keyboard that reports '' still yields letters and digits from event.key. */
  function codeOf(event) {
    if (event.code) return event.code;
    const key = typeof event.key === 'string' ? event.key : '';
    if (/^[a-z]$/i.test(key)) return 'Key' + key.toUpperCase();
    if (/^[0-9]$/.test(key)) return 'Digit' + key;
    return '';
  }

  function transportIsPaused() {
    const transport = FLM.Transport;
    return Boolean(transport && transport.main && transport.main.state() === 'paused');
  }

  function resolveKeyControl(code) {
    const control = state.keyLookup.get(code);
    if (control === undefined) return null;
    if (control === 'panicWhilePaused') return transportIsPaused() ? 'panic' : null;
    return control;
  }

  function textFieldFocused() {
    const active = doc.activeElement;
    if (!active) return false;
    return TEXT_TAGS.includes(active.tagName) || active.isContentEditable === true;
  }

  function onKeyDown(event) {
    if (state.context === 'menu' || event.repeat) return;
    if (event.ctrlKey || event.metaKey || event.altKey) return;      // browser shortcuts pass through
    const code = codeOf(event);
    const control = code === '' ? null : resolveKeyControl(code);
    if (control === null) return;
    if (textFieldFocused() && control !== 'pause') return;           // the keys belong to the text field
    if (!NEVER_PREVENTED.includes(code)) event.preventDefault();     // no page scroll from Space or arrows
    if (state.keysDown.has(code)) return;                            // a second keydown without keyup
    state.keysDown.add(code);
    press(control, { source: 'keyboard', physical: code }, stampOf(event), 1);
  }

  function holderOf(source, physical) {
    return state.heldOrder.find((control) => {
      const owner = records.get(control).owner;
      return owner.source === source && owner.physical === physical;
    });
  }

  function onKeyUp(event) {
    const code = codeOf(event);
    if (code === '') return;
    state.keysDown.delete(code);
    const control = holderOf('keyboard', code);   // by owner, so a late keyup after a system release does nothing
    if (control !== undefined) release(control, { source: 'keyboard', physical: code }, stampOf(event));
  }

  // ---------------------------------------------------------------------------------------------
  // System triggers (Part 6.7.4 F.4)
  // ---------------------------------------------------------------------------------------------
  function onBlur() {
    releaseAll('system');
  }

  function onPageHide() {
    releaseAll('system');
  }

  function onVisibilityChange() {
    if (doc.hidden) releaseAll('system');
  }

  // ---------------------------------------------------------------------------------------------
  // Pads, pointers and the Touch Events fallback (Part 6.7.4 D, ADR-10 decisions 2, 3 and 10)
  // ---------------------------------------------------------------------------------------------
  function refreshPadRects() {
    const padRoot = state.attached ? state.attached.padRoot : null;
    const pads = state.pads;
    pads.elements = padRoot ? Array.from(padRoot.querySelectorAll('.pad')).slice(0, PAD_COUNT) : [];
    pads.rects = pads.elements.map((element) => element.getBoundingClientRect());
    pads.dirty = false;
  }

  function padRectsStale() {
    const pads = state.pads;
    return pads.dirty || pads.elements.length === 0 || pads.elements.some((element) => !element.isConnected);
  }

  /** Index 0 to 3 of the pad under (x, y), or -1. Rects are cached and rebuilt after any layout change. */
  function padIndexAt(x, y) {
    if (padRectsStale()) refreshPadRects();
    return state.pads.rects.findIndex((rect) => rect.width > 0 && rect.height > 0 && x >= rect.left &&
      x < rect.right && y >= rect.top && y < rect.bottom);
  }

  function layoutChanged() {
    state.pads.dirty = true;
    if (state.attached) refreshPadRects();
  }

  function padControl(index) {
    return (state.context === 'dance' ? 'dance' : 'lane') + index;
  }

  function pressureOf(value) {
    return Number.isFinite(value) ? Core.clamp(value, 0, 1) : DEFAULT_TOUCH_PRESSURE;
  }

  function pointerOwner(key) {
    return { source: 'pointer', physical: key };
  }

  function dropOldestTrack() {
    const oldest = state.tracks.keys().next().value;
    const track = state.tracks.get(oldest);
    state.tracks.delete(oldest);
    if (track.padIndex >= 0) release(padControl(track.padIndex), pointerOwner(oldest), Core.now());
    Log.warn('input', 'INP_PTR_CAP', { dropped: oldest });
  }

  function beginTrack(key, x, y, tPerf, pressure) {
    if (state.tracks.has(key)) return false;
    const index = padIndexAt(x, y);
    if (index < 0) return false;
    if (state.tracks.size >= MAX_POINTERS) dropOldestTrack();
    state.tracks.set(key, { padIndex: index });
    press(padControl(index), pointerOwner(key), tPerf, pressure);
    return true;
  }

  /** A pointer that slides to another pad (or off every pad) releases the old pad, then presses the new one. */
  function moveTrack(key, x, y, tPerf, pressure) {
    const track = state.tracks.get(key);
    if (!track) return;
    const next = padIndexAt(x, y);
    if (next === track.padIndex) return;
    if (track.padIndex >= 0) release(padControl(track.padIndex), pointerOwner(key), tPerf);
    track.padIndex = next;
    if (next >= 0) press(padControl(next), pointerOwner(key), tPerf, pressure);
  }

  function endTrack(key, tPerf) {
    const track = state.tracks.get(key);
    if (!track) return;
    state.tracks.delete(key);
    if (track.padIndex >= 0) release(padControl(track.padIndex), pointerOwner(key), tPerf);
  }

  // Pointer Events (the primary path). Compatibility mouse events are never listened to, and pointerdown is
  // cancelled on a pad so the browser sends none. No pointer capture is requested: hit testing is by coordinates.
  function ignoredByTouchFallback(event) {
    return state.useTouchEvents && event.pointerType === 'touch';
  }

  function onPointerDown(event) {
    if (state.context === 'menu' || ignoredByTouchFallback(event)) return;
    if (event.pointerType === 'mouse' && event.button !== MOUSE_PRIMARY_BUTTON) return;
    const key = 'ptr' + event.pointerId;
    if (beginTrack(key, event.clientX, event.clientY, stampOf(event), pressureOf(event.pressure))) {
      event.preventDefault();
    }
  }

  function onPointerMove(event) {
    if (state.tracks.size === 0 || ignoredByTouchFallback(event)) return;
    moveTrack('ptr' + event.pointerId, event.clientX, event.clientY, stampOf(event), pressureOf(event.pressure));
  }

  function onPointerEnd(event) {
    if (state.tracks.size === 0 || ignoredByTouchFallback(event)) return;
    endTrack('ptr' + event.pointerId, stampOf(event));
  }

  // Touch Events: the OQ-1 fallback, selected by input.touchApi. Otherwise they only block page gestures.
  function touchForce(touch) {
    return Number.isFinite(touch.force) && touch.force > 0 ? Core.clamp(touch.force, 0, 1) : DEFAULT_TOUCH_PRESSURE;
  }

  function blockGesture(event) {
    if (state.context !== 'menu' && event.cancelable !== false) event.preventDefault();
  }

  function onTouchStart(event) {
    blockGesture(event);
    if (!state.useTouchEvents || state.context === 'menu') return;
    const tPerf = stampOf(event);
    Array.from(event.changedTouches).forEach((touch) => {
      beginTrack('t' + touch.identifier, touch.clientX, touch.clientY, tPerf, touchForce(touch));
    });
  }

  function onTouchMove(event) {
    blockGesture(event);
    if (!state.useTouchEvents) return;
    const tPerf = stampOf(event);
    Array.from(event.changedTouches).forEach((touch) => {
      moveTrack('t' + touch.identifier, touch.clientX, touch.clientY, tPerf, touchForce(touch));
    });
  }

  function onTouchEnd(event) {
    if (!state.useTouchEvents) return;
    const tPerf = stampOf(event);
    Array.from(event.changedTouches).forEach((touch) => endTrack('t' + touch.identifier, tPerf));
  }

  function onContextMenu(event) {
    if (state.context !== 'menu') event.preventDefault();
  }

  function setTouchApi(value) {
    const next = TOUCH_API_VALUES.includes(value) ? value : 'auto';
    const useTouch = next === 'touch' || (next === 'auto' && !('PointerEvent' in window));
    const changed = useTouch !== state.useTouchEvents;
    state.touchApi = next;
    state.useTouchEvents = useTouch;
    if (changed) releaseAll('context');     // never half the pointers on one API and half on the other
  }

  // ---------------------------------------------------------------------------------------------
  // Gamepad (Part 6.7.4 E)
  // ---------------------------------------------------------------------------------------------
  function isButtonDown(button) {
    return Boolean(button) && (button.pressed === true || button.value > GAMEPAD_DOWN_LEVEL);
  }

  function normalizeButton(button) {
    if (button !== null && typeof button === 'object') return button;
    return { pressed: Boolean(button), value: button ? 1 : 0 };
  }

  function normalizePad(pad) {
    const buttons = Array.isArray(pad.buttons) ? pad.buttons.map(normalizeButton) : [];
    return { index: pad.index === undefined ? 0 : pad.index, id: pad.id === undefined ? 'synthetic pad' : pad.id,
      mapping: pad.mapping === undefined ? 'standard' : pad.mapping, connected: pad.connected !== false, buttons };
  }

  function connectedPads() {
    const synthetic = state.gamepad.synthetic;
    if (synthetic !== undefined) return synthetic && synthetic.connected ? [synthetic] : [];
    if (typeof nav.getGamepads !== 'function') return [];
    try {
      return Array.from(nav.getGamepads()).filter((pad) => pad && pad.connected === true);
    } catch (error) {
      return [];     // a page that may not use gamepads (permissions policy) behaves as if none is connected
    }
  }

  function faultHolds(source) {
    const fault = Core.Faults.active('input.disconnect');
    return Boolean(fault) && fault.source === source;
  }

  function firstGamepad() {
    return faultHolds('gamepad') ? null : (connectedPads()[0] || null);
  }

  function announceConnect(pad) {
    if (state.gamepad.announced.has(pad.index)) return;
    state.gamepad.announced.set(pad.index, { id: String(pad.id), name: String(pad.id) });
    bus.emit('input.device', { source: 'gamepad', connected: true, id: String(pad.id), name: String(pad.id),
      index: pad.index });
  }

  function announceDisconnect(index) {
    const known = state.gamepad.announced.get(index);
    if (!known) return;
    state.gamepad.announced.delete(index);
    bus.emit('input.device', { source: 'gamepad', connected: false, id: known.id, name: known.name, index });
  }

  function loseGamepad() {
    const prev = state.gamepad.prev;
    state.gamepad.prev = null;
    releaseOwnedBy('gamepad', 'device');
    if (prev) announceDisconnect(prev.index);
  }

  function useNewPad(pad) {
    if (state.gamepad.prev) loseGamepad();
    state.gamepad.prev = { index: pad.index, buttons: {} };
    announceConnect(pad);
    if (pad.mapping !== 'standard' && !state.gamepad.nonStandardLogged) {
      state.gamepad.nonStandardLogged = true;
      Log.warn('input', 'INP_GP_NONSTANDARD', { mapping: String(pad.mapping) });
    }
  }

  function scanButtons(pad, tPerf) {
    const table = state.context === 'dance' ? GAMEPAD_DANCE_MAP : GAMEPAD_PLAY_MAP;
    const prev = state.gamepad.prev;
    Object.keys(table).forEach((name) => {
      const button = pad.buttons[name];
      const down = isButtonDown(button);
      if (down === Boolean(prev.buttons[name])) return;
      prev.buttons[name] = down;
      const owner = { source: 'gamepad', physical: 'gp' + name };
      if (!down) {
        release(table[name], owner, tPerf);
        return;
      }
      press(table[name], owner, tPerf, button.value > 0 ? Math.min(button.value, 1) : 1);
    });
  }

  /** Called once per render frame by the active mode: anchor sample plus gamepad edge detection. */
  function pollGamepad(tPerf) {
    const nowMs = Number.isFinite(tPerf) ? tPerf : Core.now();
    sampleAnchor(nowMs, false);
    const pad = firstGamepad();
    if (!pad) {
      if (state.gamepad.prev) loseGamepad();
      return;
    }
    if (!state.gamepad.prev || state.gamepad.prev.index !== pad.index) useNewPad(pad);
    if (state.context === 'menu') return;
    scanButtons(pad, nowMs);
  }

  function onGamepadConnected(event) {
    if (event.gamepad) announceConnect(event.gamepad);
  }

  function onGamepadDisconnected(event) {
    const pad = event.gamepad;
    if (!pad) return;
    const prev = state.gamepad.prev;
    if (prev && prev.index === pad.index) loseGamepad();     // release at once, not at the next poll
    else announceDisconnect(pad.index);
  }

  // ---------------------------------------------------------------------------------------------
  // Web MIDI (Part 6.7.4 G): only after the user enables it, only in a secure context
  // ---------------------------------------------------------------------------------------------
  function midiSupported() {
    return typeof nav.requestMIDIAccess === 'function';
  }

  function midiSecure() {
    return window.isSecureContext === true;
  }

  function midiControlForNote(note) {
    const lanes = state.maps.midi;
    const index = LANE_NAMES.findIndex((lane) => lanes[lane] === note);
    if (index >= 0) return padControl(index);
    return state.midi.passThrough ? 'midi:' + note : null;
  }

  function handleNote(note, velocity, on, tPerf) {
    const control = midiControlForNote(note);
    if (control === null) return;
    const owner = { source: 'midi', physical: 'n' + note };
    if (on) press(control, owner, tPerf, velocity / MIDI_VELOCITY_MAX);
    else release(control, owner, tPerf);
  }

  function handleSustain(value, tPerf) {
    const owner = { source: 'midi', physical: 'cc' + state.maps.midi.sustainCC };
    if (value >= MIDI_SUSTAIN_THRESHOLD) press('sustain', owner, tPerf, 1);
    else release('sustain', owner, tPerf);
  }

  function onMidiMessage(event) {
    const bytes = event.data;
    if (!bytes || bytes.length < 2 || faultHolds('midi')) return;
    const status = bytes[0] & MIDI_STATUS_MASK;
    const tPerf = stampOf(event);
    const velocity = bytes.length > 2 ? bytes[2] : 0;
    if (status === MIDI_NOTE_ON) handleNote(bytes[1], velocity, velocity > 0, tPerf);
    else if (status === MIDI_NOTE_OFF) handleNote(bytes[1], velocity, false, tPerf);
    else if (status === MIDI_CONTROL_CHANGE && bytes[1] === state.maps.midi.sustainCC) handleSustain(velocity, tPerf);
  }

  function emitMidiDevice(port, connected) {
    bus.emit('input.device', { source: 'midi', connected, id: String(port.id), name: String(port.name || port.id) });
  }

  function subscribePort(port) {
    if (!port || state.midi.ports.has(port.id)) return;
    const off = Core.dom.on(port, 'midimessage', onMidiMessage, undefined, INPUT_OWNER);
    state.midi.ports.set(port.id, { port, off });
    emitMidiDevice(port, true);
  }

  function unsubscribePort(port) {
    const entry = port ? state.midi.ports.get(port.id) : undefined;
    if (!entry) return;
    entry.off();
    state.midi.ports.delete(port.id);
    releaseOwnedBy('midi', 'device');
    emitMidiDevice(port, false);
  }

  function onMidiStateChange(event) {
    const port = event.port;
    if (!port || port.type !== 'input') return;
    if (port.state === 'connected') subscribePort(port);
    else unsubscribePort(port);
  }

  function subscribeAccess(access) {
    state.midi.access = access;
    state.midi.stateOff = Core.dom.on(access, 'statechange', onMidiStateChange, undefined, INPUT_OWNER);
    access.inputs.forEach((port) => subscribePort(port));
  }

  async function requestMidi() {
    try {
      const access = await nav.requestMIDIAccess({ sysex: false });
      if (!state.attached) return { ok: false, code: 'E-INP-002' };     // detached while the prompt was open
      subscribeAccess(access);
      return { ok: true };
    } catch (error) {
      Log.warn('input', 'INP_MIDI_DENIED', { reason: error && error.name ? error.name : 'error' });
      return { ok: false, code: 'E-INP-002' };
    }
  }

  /** User-triggered from Settings. Resolves {ok:true} or {ok:false, code:'E-INP-001' | 'E-INP-002'}. */
  function enableMidi() {
    if (state.midi.access) return Promise.resolve({ ok: true });
    if (!midiSupported() || !midiSecure()) return Promise.resolve({ ok: false, code: 'E-INP-001' });
    if (!state.midi.pending) {
      state.midi.pending = requestMidi().then((result) => {
        state.midi.pending = null;     // runs after the assignment, even when the request failed at once
        return result;
      });
    }
    return state.midi.pending;
  }

  function disableMidi() {
    state.midi.ports.forEach((entry) => entry.off());
    state.midi.ports.clear();
    if (state.midi.stateOff) state.midi.stateOff();
    state.midi.stateOff = null;
    state.midi.access = null;
    releaseOwnedBy('midi', 'device');
  }

  function setMidiPassThrough(on) {
    state.midi.passThrough = Boolean(on);
    if (!state.midi.passThrough) releaseWhere((control) => control.indexOf('midi:') === 0);
  }

  // ---------------------------------------------------------------------------------------------
  // Devices and fault injection
  // ---------------------------------------------------------------------------------------------
  function devices() {
    const names = [];
    state.midi.ports.forEach((entry) => names.push(String(entry.port.name || entry.port.id)));
    return {
      gamepads: connectedPads().map((pad) => ({ index: pad.index, id: String(pad.id), mapping: String(pad.mapping) })),
      midi: { supported: midiSupported(), secure: midiSecure(), enabled: state.midi.access !== null, inputs: names }
    };
  }

  function injectGamepadDisconnect() {
    const known = Array.from(state.gamepad.announced.keys());
    state.gamepad.prev = null;
    releaseOwnedBy('gamepad', 'fault');
    if (known.length === 0) {
      bus.emit('input.device', { source: 'gamepad', connected: false, id: 'injected', name: 'injected', index: 0 });
    }
    known.forEach(announceDisconnect);
  }

  /** The MIDI inputs report themselves disconnected, as a statechange event would. */
  function injectMidiDisconnect() {
    Array.from(state.midi.ports.values()).forEach((entry) => unsubscribePort(entry.port));
    releaseOwnedBy('midi', 'fault');
  }

  /** A pointercancel for every active pointer. */
  function injectPointerCancel() {
    const tPerf = Core.now();
    Array.from(state.tracks.keys()).forEach((key) => endTrack(key, tPerf));
  }

  /**
   * Test build and FLM.debug only: input.disconnect {source:'gamepad'|'midi'|'pointer'}. A gamepad or MIDI device
   * stays unplugged until debugClear.
   */
  function debugInject(fault, args) {
    if (fault !== 'input.disconnect') return false;
    const source = args && DEBUG_SOURCES.includes(args.source) ? args.source : 'gamepad';
    Core.Faults.set(fault, { source });
    if (source === 'midi') injectMidiDisconnect();
    else if (source === 'pointer') injectPointerCancel();
    else injectGamepadDisconnect();
    return true;
  }

  /** With a fault name it clears that fault; without one it also drops the synthetic gamepad. */
  function debugClear(fault) {
    if (fault === undefined || fault === 'input.disconnect') Core.Faults.clear('input.disconnect');
    if (fault === undefined) state.gamepad.synthetic = undefined;
  }

  // ---------------------------------------------------------------------------------------------
  // Anchor and layout subscriptions
  // ---------------------------------------------------------------------------------------------
  function onAudioState(event) {
    if (event && event.state !== 'running') clearAnchor();
  }

  function onAudioUnlocked() {
    resampleAnchor();
  }

  function onLayout() {
    state.pads.dirty = true;
  }

  function onSettingsChanged(event) {
    if (!event) return;
    if (event.key === 'input.touchApi') setTouchApi(event.value);
    else if (event.key === '*' || String(event.key).indexOf('input.pad') === 0) state.pads.dirty = true;
  }

  // ---------------------------------------------------------------------------------------------
  // init and detach (Part 6.7.2): every listener goes through Core.dom with the module's owner token
  // ---------------------------------------------------------------------------------------------
  function listen(target, type, handler, options) {
    state.attached.offs.push(Core.dom.on(target, type, handler, options, INPUT_OWNER));
  }

  function installWindowListeners(target) {
    listen(target, 'keydown', onKeyDown);
    listen(target, 'keyup', onKeyUp);
    listen(target, 'blur', onBlur);
    listen(target, 'pagehide', onPageHide);
    listen(target, 'resize', onLayout);
    listen(target, 'orientationchange', onLayout);
    listen(target, 'gamepadconnected', onGamepadConnected);

})();
